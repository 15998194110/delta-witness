name: DELTA Growth Turn8 Verify Temp
on:
  push:
    paths:
      - '.github/workflows/_temp_growth_turn8_verify_20260908.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
      - name: Production x402 checks and Market402 direct submissions
        shell: bash
        run: |
          set -u
          for spec in \
            'capture|https://delta-witness-api.ruphussten.workers.dev/v1/capture|0.03|{"url":"https://example.com"}' \
            'preflight|https://delta-witness-api.ruphussten.workers.dev/v1/preflight|0.03|{"url":"https://example.com","expected":{"contains":["Example Domain"]}}' \
            'pilot|https://delta-witness-api.ruphussten.workers.dev/v1/guarded-action-pilot|10.00|{"urls":["https://example.com"],"preflight":{"url_index":0,"expected":{"contains":["Example Domain"]}}}'
          do
            IFS='|' read -r name url price body <<< "$spec"
            code=$(curl -sS --retry 4 --retry-delay 2 --retry-all-errors --max-time 30 -o "/tmp/${name}.body" -w '%{http_code}' -H 'content-type: application/json' -d "$body" "$url" || true)
            echo "PROD_${name}_HTTP=$code"
            head -c 800 "/tmp/${name}.body" || true; echo
            st=$(curl -sS --retry 4 --retry-delay 2 --retry-all-errors --max-time 30 -X POST https://market402.com/selftest -H 'content-type: application/json' --data "{\"url\":\"$url\"}" || true)
            echo "MARKET402_SELFTEST_${name}=$st"
            sub=$(curl -sS --retry 4 --retry-delay 2 --retry-all-errors --max-time 30 -X POST https://market402.com/submit -H 'content-type: application/json' --data "{\"resource\":\"$url\",\"declared_price_usd\":$price}" || true)
            echo "MARKET402_SUBMIT_${name}=$sub"
          done
          echo 'MARKET402_STATUS_BEGIN'
          curl -sS --retry 4 --retry-delay 2 --retry-all-errors --max-time 30 https://market402.com/status.json || true
          echo; echo 'MARKET402_STATUS_END'
      - name: MeshKore live readback
        shell: bash
        run: |
          set +e
          echo 'MESHKORE_API_BEGIN'
          curl -sS --retry 5 --retry-delay 3 --retry-all-errors --max-time 30 -w '\nHTTP=%{http_code}\n' https://api.meshkore.com/v1/agents/delta-witness-ruphussten
          echo 'MESHKORE_API_END'
          echo 'MESHKORE_CARD_BEGIN'
          curl -sS --retry 5 --retry-delay 3 --retry-all-errors --max-time 30 -w '\nHTTP=%{http_code}\n' https://meshkore.com/agent/delta-witness-ruphussten/.well-known/agent.json
          echo 'MESHKORE_CARD_END'
          exit 0
      - name: Treasury canonical USDC reconciliation
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request, time
          rpc='https://mainnet.base.org'
          treasury='0x1990e21bc219696ff7fbc26527dbaed335ac6367'.lower()
          usdc='0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913'
          transfer='0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef'
          to_topic='0x'+'0'*24+treasury[2:]
          def rpc_call(method,params,retries=5):
              payload=json.dumps({'jsonrpc':'2.0','id':1,'method':method,'params':params}).encode()
              last=None
              for i in range(retries):
                  try:
                      req=urllib.request.Request(rpc,data=payload,headers={'content-type':'application/json','user-agent':'delta-growth-audit/1.0'})
                      with urllib.request.urlopen(req,timeout=30) as r:
                          out=json.load(r)
                      if 'error' in out: raise RuntimeError(out['error'])
                      return out['result']
                  except Exception as e:
                      last=e; time.sleep(min(2**i,8))
              raise last
          latest=int(rpc_call('eth_blockNumber',[]),16)
          start=51014673
          logs=[]
          for a in range(start,latest+1,5000):
              b=min(a+4999,latest)
              part=rpc_call('eth_getLogs',[{'fromBlock':hex(a),'toBlock':hex(b),'address':usdc,'topics':[transfer,None,to_topic]}])
              logs.extend(part)
          rows=[]
          for l in logs:
              rows.append({'block':int(l['blockNumber'],16),'tx':l['transactionHash'],'logIndex':int(l['logIndex'],16),'amount_usdc':int(l['data'],16)/1_000_000})
          print('TREASURY_RECON='+json.dumps({'from_block':start,'latest':latest,'receipt_count':len(rows),'receipts':rows},separators=(',',':')))
          PY
      - name: D1 paid telemetry reconciliation
        shell: bash
        run: |
          set +e
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo 'D1_RECON=unavailable_missing_cloudflare_secret'
            exit 0
          fi
          npx --yes wrangler@4 d1 execute delta-witness-analytics --remote --json --command "SELECT id,created_at,event,route,channel,partner,success,reason,gross_usd,variable_cost_usd,contribution_margin_usd FROM telemetry_events WHERE created_at > '2026-09-07 22:05:04' AND event IN ('payment_verified','capture_completed') ORDER BY id ASC;" > /tmp/d1.json 2>/tmp/d1.err
          rc=$?
          echo "D1_RC=$rc"
          echo 'D1_RECON_BEGIN'; cat /tmp/d1.json; echo; echo 'D1_RECON_END'
          if [ $rc -ne 0 ]; then cat /tmp/d1.err; fi
          exit 0
