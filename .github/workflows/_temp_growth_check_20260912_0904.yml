name: DELTA Growth Check Temp 20260912 0904
on:
  push:
    paths:
      - '.github/workflows/_temp_growth_check_20260912_0904.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Owner pricing policy gate
        run: node scripts/check-owner-pricing.mjs
      - name: Live public x402 price gate
        run: node scripts/verify-owner-pricing-live.mjs
      - name: Paid funnel telemetry
        continue-on-error: true
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/query-funnel.mjs
      - name: Revenue candidates
        continue-on-error: true
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/query-revenue-candidates.mjs
      - name: Base Treasury reconciliation
        run: node scripts/reconcile-treasury.mjs
      - name: PayanAgent funded demand scan
        continue-on-error: true
        run: node scripts/scan-payan-demand.mjs
      - name: Bazaar discovery check
        continue-on-error: true
        run: node scripts/check-bazaar.mjs
      - name: Agent402 canonical state
        continue-on-error: true
        run: node scripts/register-agent402.mjs --check-only
      - name: True402 canonical state
        continue-on-error: true
        run: node scripts/register-true402.mjs --check-only
