name: DELTA Payan Request Forensics Temp
on:
  push:
    paths:
      - '.github/workflows/_temp_payan_request_forensics_20260908.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect endpoint-health request and escrow evidence
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://payanagent.com'
          TITLE='Build a catalog endpoint-health checker (find dead ecosystem sellers)'
          curl --retry 4 --retry-delay 2 --retry-all-errors -fsS --max-time 30 "$BASE/api/v1/requests?status=open&limit=100" >/tmp/requests.json
          echo 'MATCH_BEGIN'
          jq -c --arg t "$TITLE" '(.requests // .items // .data // [])[] | select(.title==$t)' /tmp/requests.json | tee /tmp/match.json
          echo 'MATCH_END'
          test -s /tmp/match.json
          ID=$(jq -r '.id // .requestId // .request_id // ._id // .request.id // empty' /tmp/match.json)
          echo "REQUEST_ID=${ID:-missing}"
          echo 'KEYS='
          jq -c 'keys' /tmp/match.json
          if [ -n "${ID:-}" ]; then
            echo 'DETAIL_BEGIN'
            code=$(curl --retry 4 --retry-delay 2 --retry-all-errors -sS --max-time 30 -o /tmp/detail.json -w '%{http_code}' "$BASE/api/v1/requests/$ID")
            echo "DETAIL_HTTP=$code"
            cat /tmp/detail.json | jq -c . 2>/dev/null || cat /tmp/detail.json
            echo 'DETAIL_END'
          fi
          echo 'RECEIPT_CANDIDATES_BEGIN'
          for key in escrowReceiptId receiptId escrow_receipt_id receipt_id; do
            RID=$(jq -r --arg k "$key" '.[$k] // empty' /tmp/match.json)
            if [ -n "$RID" ]; then
              echo "RID_KEY=$key RID=$RID"
              curl --retry 3 --retry-delay 2 --retry-all-errors -sS --max-time 30 -o /tmp/rid.json -w 'RID_HTTP=%{http_code}\n' "$BASE/api/v1/receipts/$RID" || true
              cat /tmp/rid.json | jq -c . 2>/dev/null || cat /tmp/rid.json
            fi
          done
          echo 'RECEIPT_CANDIDATES_END'
