name: One-off x402dash registration and reconciliation

on:
  push:
    paths:
      - '.github/_run_x402dash'

permissions:
  contents: write

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6

      - name: Register DELTA on x402dash and reconcile Treasury
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/x402dash.mjs <<'NODE'
          import { writeFile } from 'node:fs/promises';

          const origin = 'https://delta-witness-api.ruphussten.workers.dev';
          const provider = 'delta-witness-api.ruphussten.workers.dev';
          const treasury = '0x1990e21bc219696ff7fbc26527dbaed335ac6367';
          const usdc = '0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913';
          const startBlock = 51047133;
          const apiBases = ['https://api.x402dash.com', 'https://api.x402market.shop'];
          const products = [
            {
              url: `${origin}/v1/capture`,
              name: 'DELTA Witness Capture',
              description: 'Deterministic timestamped public-page capture and evidence artifact for autonomous agents.',
              category: 'Verification',
              tags: ['verification','evidence','x402','agent','page-state']
            },
            {
              url: `${origin}/v1/preflight`,
              name: 'DELTA Witness Preflight',
              description: 'Deterministic public-page observation and comparison before an agent takes a consequential action.',
              category: 'Verification',
              tags: ['verification','preflight','x402','agent','page-state']
            },
            {
              url: `${origin}/v1/guarded-action-pilot`,
              name: 'DELTA Witness Guarded Action Pilot',
              description: 'Higher-value guarded-action pilot using deterministic page-state evidence before a consequential agent action.',
              category: 'Verification',
              tags: ['verification','guarded-action','x402','agent','pilot']
            }
          ];

          const sleep = ms => new Promise(r => setTimeout(r, ms));
          async function fetchJson(url, options = {}, attempts = 2) {
            let last = null;
            for (let i = 0; i < attempts; i++) {
              const controller = new AbortController();
              const timer = setTimeout(() => controller.abort(), 30000);
              try {
                const r = await fetch(url, { ...options, signal: controller.signal });
                const text = await r.text();
                let json = null;
                try { json = text ? JSON.parse(text) : null; } catch {}
                clearTimeout(timer);
                if (r.status >= 500 || r.status === 429) {
                  last = { ok:false, status:r.status, text:text.slice(0,1000), json };
                  if (i + 1 < attempts) { await sleep(1000 * (2 ** i)); continue; }
                }
                return { ok:r.ok, status:r.status, text:text.slice(0,4000), json };
              } catch (e) {
                clearTimeout(timer);
                last = { ok:false, status:0, error:String(e) };
                if (i + 1 < attempts) { await sleep(1000 * (2 ** i)); continue; }
              }
            }
            return last;
          }

          function extractItems(j) {
            if (!j || typeof j !== 'object') return [];
            for (const k of ['items','endpoints','results','data']) if (Array.isArray(j[k])) return j[k];
            return [];
          }
          function itemUrl(x) { return x?.url || x?.endpoint || x?.resource || ''; }

          const evidence = {
            observed_at: new Date().toISOString(),
            channel: 'x402dash',
            pricing_authority: { capture_usdc:0.03, public_preflight_usdc:1, guarded_action_pilot_usdc:10 },
            listing_attempts: [],
            readback: null,
            treasury: null,
            d1: null
          };

          // Free readback first to avoid duplicate registration.
          let before = null;
          for (const base of apiBases) {
            const r = await fetchJson(`${base}/v1/endpoints?limit=200&provider=${encodeURIComponent(provider)}`, {}, 2);
            if (r?.ok) { before = { base, ...r }; break; }
          }
          const beforeItems = extractItems(before?.json);
          const existing = new Set(beforeItems.map(itemUrl));

          for (const p of products) {
            if (existing.has(p.url)) {
              evidence.listing_attempts.push({ url:p.url, action:'already_present', evidence_quality:'A' });
              continue;
            }
            const payload = { ...p };
            let result = null;
            for (const base of apiBases) {
              result = await fetchJson(`${base}/v1/register`, {
                method:'POST',
                headers:{'content-type':'application/json'},
                body:JSON.stringify(payload)
              }, 2);
              evidence.listing_attempts.push({ url:p.url, base, status:result?.status ?? 0, response:result?.json ?? result?.text ?? result?.error ?? null });
              if (result?.ok || result?.status === 409) break;
              // Semantic 4xx is not transient; only use fallback for rate limit / server / network failures.
              if (result?.status >= 400 && result?.status < 500 && result?.status !== 429) break;
            }
          }

          // Free exact provider readback after registration attempts.
          for (const base of apiBases) {
            const r = await fetchJson(`${base}/v1/endpoints?limit=200&provider=${encodeURIComponent(provider)}`, {}, 2);
            if (r?.ok) {
              const items = extractItems(r.json);
              evidence.readback = {
                base,
                status:r.status,
                exact_urls: products.map(p => ({ url:p.url, present:items.some(x => itemUrl(x) === p.url), record:items.find(x => itemUrl(x) === p.url) || null })),
                total_returned:items.length
              };
              break;
            }
            evidence.readback = { base, status:r?.status ?? 0, error:r?.error || r?.text || null };
          }

          // Independent canonical Base USDC Treasury reconciliation via Blockscout.
          async function blockscout(path) {
            const url = `https://base.blockscout.com${path}`;
            return fetchJson(url, {}, 3);
          }
          const headResp = await blockscout('/api?module=block&action=eth_block_number');
          let head = null;
          const headRaw = headResp?.json?.result;
          if (typeof headRaw === 'string') head = headRaw.startsWith('0x') ? parseInt(headRaw,16) : Number(headRaw);
          const txPath = `/api?module=account&action=tokentx&contractaddress=${usdc}&address=${treasury}&startblock=${startBlock}&endblock=99999999&sort=asc`;
          const txResp = await blockscout(txPath);
          let rows = [];
          if (Array.isArray(txResp?.json?.result)) rows = txResp.json.result;
          const incoming = rows.filter(x => String(x.to || '').toLowerCase() === treasury.toLowerCase() && String(x.contractAddress || x.contract_address || '').toLowerCase() === usdc.toLowerCase());
          evidence.treasury = {
            source:'Base Blockscout',
            start_block:startBlock,
            observed_head:Number.isFinite(head) ? head : null,
            head_status:headResp?.status ?? 0,
            transfer_query_status:txResp?.status ?? 0,
            transfer_query_ok:!!txResp?.ok,
            incoming_count:incoming.length,
            incoming:incoming.map(x => ({ hash:x.hash, block:Number(x.blockNumber), from:x.from, to:x.to, value_raw:x.value, amount_usdc:Number(x.value)/1e6 }))
          };

          await writeFile('/tmp/x402dash-evidence.json', JSON.stringify(evidence,null,2));
          NODE
          node /tmp/x402dash.mjs

          # D1 paid-funnel audit is independent of third-party listing/chain channel health.
          if node scripts/query-revenue-candidates.mjs > /tmp/d1.json 2> /tmp/d1.err; then
            :
          else
            jq -n --rawfile err /tmp/d1.err '{ok:false,error:$err}' > /tmp/d1.json
          fi

          node - <<'NODE'
          const fs = require('fs');
          const e = JSON.parse(fs.readFileSync('/tmp/x402dash-evidence.json','utf8'));
          try { e.d1 = JSON.parse(fs.readFileSync('/tmp/d1.json','utf8')); }
          catch { e.d1 = {ok:false,error:'unparseable D1 audit output'}; }
          const exact = e.readback?.exact_urls || [];
          e.metrics = {
            listing_status: exact.length === 3 && exact.every(x=>x.present) ? 'live' : 'partial_or_unconfirmed',
            discovery_status: exact.length === 3 && exact.every(x=>x.present) ? 'public' : 'partial_or_unconfirmed',
            buyer_count:0,
            settlement_count:0,
            external_requests:0,
            intents_402:0,
            paid_settlements:0,
            treasury_received_new:e.treasury?.incoming_count || 0,
            revenue_usdc_new:(e.treasury?.incoming || []).reduce((s,x)=>s+(x.amount_usdc||0),0),
            variable_cost_usdc_new:null,
            contribution_margin_usdc_new:null,
            evidence_quality:(exact.length===3 && exact.every(x=>x.present) && e.treasury?.transfer_query_ok) ? 'A' : 'B'
          };
          fs.mkdirSync('docs/channel-status',{recursive:true});
          fs.writeFileSync('docs/channel-status/x402dash-2026-09-09.json',JSON.stringify(e,null,2)+'\n');
          NODE

          git config user.name 'DELTA Growth Operator'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/channel-status/x402dash-2026-09-09.json
          git commit -m 'growth: register DELTA on x402dash and reconcile revenue' || true
          git push
