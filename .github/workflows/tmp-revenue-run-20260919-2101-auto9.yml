name: TEMP DELTA revenue reconciliation 20260919-2101-auto9
on:
  push:
    branches: [master]
    paths: [.github/workflows/tmp-revenue-run-20260919-2101-auto9.yml]
permissions:
  contents: read
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DELTA_TREASURY_LOOKBACK_BLOCKS: '7000'
      DELTA_TREASURY_CHUNK_BLOCKS: '1900'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
        with: {persist-credentials: false}
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - name: Check owner pricing
        run: node scripts/check-owner-pricing.mjs
      - name: Verify live owner pricing without payment
        run: node scripts/verify-owner-pricing-live.mjs | tee /tmp/delta-live-pricing.json
      - name: Audit paid funnel
        run: node scripts/query-revenue-candidates.mjs | tee /tmp/delta-revenue-candidates.json
      - name: Reconcile Base Treasury
        run: node scripts/reconcile-treasury.mjs | tee /tmp/delta-treasury.json
      - name: Scan AgentPact demand
        continue-on-error: true
        run: node scripts/scan-agentpact-demand.mjs | tee /tmp/delta-agentpact-demand.json
      - name: Scan AgentExchange demand
        continue-on-error: true
        run: node scripts/scan-agentexchange-demand.mjs | tee /tmp/delta-agentexchange-demand.json
      - name: Scan external funded demand
        continue-on-error: true
        run: node scripts/scan-external-funded-demand.mjs | tee /tmp/delta-external-funded-demand.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: delta-revenue-run-${{ github.run_id }}
          path: |
            /tmp/delta-live-pricing.json
            /tmp/delta-revenue-candidates.json
            /tmp/delta-treasury.json
            /tmp/delta-agentpact-demand.json
            /tmp/delta-agentexchange-demand.json
            /tmp/delta-external-funded-demand.json
          if-no-files-found: warn
          retention-days: 7
