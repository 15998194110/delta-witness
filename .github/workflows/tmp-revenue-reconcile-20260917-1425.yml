name: TEMP DELTA revenue reconcile 2026-09-17 1425 JST
on:
  push:
    branches: [master]
    paths: [.github/workflows/tmp-revenue-reconcile-20260917-1425.yml]
permissions:
  contents: read
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DELTA_INDEXNOW_ADMIN_SECRET: ${{ secrets.DELTA_INDEXNOW_ADMIN_SECRET }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DELTA_PARTNER_SECRET: ${{ secrets.DELTA_PARTNER_SECRET }}
      DELTA_TREASURY_LOOKBACK_BLOCKS: '60000'
      DELTA_TREASURY_CHUNK_BLOCKS: '1900'
    steps:
      - uses: actions/checkout@v6
        with: {persist-credentials: false}
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - name: Owner pricing integrity
        run: |
          node scripts/check-owner-pricing.mjs
          node scripts/verify-owner-pricing-live.mjs | tee /tmp/delta-live-pricing.json
      - name: AgentPact funded demand
        continue-on-error: true
        run: node scripts/scan-agentpact-demand.mjs | tee /tmp/delta-agentpact-demand.json
      - name: Agent Exchange funded demand
        continue-on-error: true
        run: node scripts/scan-agentexchange-demand.mjs | tee /tmp/delta-agentexchange-demand.json
      - name: External funded demand
        continue-on-error: true
        run: node scripts/scan-external-funded-demand.mjs | tee /tmp/delta-external-funded-demand.json
      - name: Paid funnel candidates
        run: node scripts/query-revenue-candidates.mjs | tee /tmp/delta-revenue-candidates.json
      - name: Treasury reconciliation
        run: node scripts/reconcile-treasury.mjs | tee /tmp/delta-treasury.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: delta-reconcile-1425-${{ github.run_id }}
          path: |
            /tmp/delta-live-pricing.json
            /tmp/delta-agentpact-demand.json
            /tmp/delta-agentexchange-demand.json
            /tmp/delta-external-funded-demand.json
            /tmp/delta-revenue-candidates.json
            /tmp/delta-treasury.json
          if-no-files-found: warn
          retention-days: 7
