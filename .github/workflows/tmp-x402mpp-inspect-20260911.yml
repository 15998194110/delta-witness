name: TMP DELTA x402mpp inspect

on:
  push:
    paths:
      - .github/workflows/tmp-x402mpp-inspect-20260911.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Check current owner pricing policy
        run: node scripts/check-owner-pricing.mjs
      - name: Verify live prices before any possible listing write
        run: node scripts/verify-owner-pricing-live.mjs
      - name: Inspect exact x402mpp public submission transport without writing
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re, urllib.request
          u='https://x402mpp.sh/assets/app.js'
          req=urllib.request.Request(u,headers={'User-Agent':'DELTA-Witness-discovery-audit/1.0'})
          txt=urllib.request.urlopen(req,timeout=20).read().decode('utf-8','replace')
          for needle in ['apiSubmissionUrl','Submission failed','JSON.stringify({url, company})']:
              print('\nNEEDLE',needle)
              pos=txt.find(needle)
              print('pos',pos)
              if pos>=0: print(re.sub(r'\s+',' ',txt[max(0,pos-900):pos+1600]))
          PY
