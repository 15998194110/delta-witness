name: TMP DELTA x402mpp submit

on:
  push:
    paths:
      - .github/workflows/tmp-x402mpp-inspect-20260911.yml

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Check current owner pricing policy
        run: node scripts/check-owner-pricing.mjs
      - name: Verify live prices before listing write
        run: node scripts/verify-owner-pricing-live.mjs
      - name: Deduplicate and submit canonical DELTA manifest
        shell: bash
        run: |
          set -euo pipefail
          TARGET='https://delta-witness-api.ruphussten.workers.dev/.well-known/x402'
          curl --retry 3 --retry-delay 2 --retry-all-errors -fsS 'https://x402mpp.sh/data/search.json' -o /tmp/search.json
          python - <<'PY'
          import json
          target='https://delta-witness-api.ruphussten.workers.dev/.well-known/x402'
          data=json.load(open('/tmp/search.json'))
          def walk(x):
              if isinstance(x,dict):
                  yield x
                  for v in x.values(): yield from walk(v)
              elif isinstance(x,list):
                  for v in x: yield from walk(v)
          matches=[]
          for obj in walk(data):
              vals=[str(v) for v in obj.values() if isinstance(v,(str,int,float,bool))]
              if target in vals or any('delta-witness-api.ruphussten.workers.dev' in v for v in vals):
                  matches.append(obj)
          print('existing_matches',len(matches))
          if matches:
              print(json.dumps(matches[:5],indent=2)[:8000])
              open('/tmp/already','w').write('1')
          PY
          if [ -f /tmp/already ]; then
            echo 'DELTA already present; no duplicate submission.'
            exit 0
          fi
          for attempt in 1 2 3; do
            code=$(curl -sS --max-time 30 -o /tmp/submit.json -w '%{http_code}' \
              -X POST 'https://api.x402mpp.sh/submit' \
              -H 'content-type: application/json' \
              --data "{\"url\":\"$TARGET\",\"company\":\"\"}" || true)
            echo "attempt=$attempt http=$code body=$(cat /tmp/submit.json 2>/dev/null || true)"
            if [[ "$code" =~ ^2 ]]; then exit 0; fi
            sleep $((attempt*2))
          done
          echo 'submission channel degraded after bounded retries' >&2
          exit 1
