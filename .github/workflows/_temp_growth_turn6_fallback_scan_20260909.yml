name: DELTA Growth Turn6 Fallback Scan

on:
  push:
    paths:
      - '.github/workflows/_temp_growth_turn6_fallback_scan_20260909.yml'

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Fresh funded-demand and market scan
        shell: bash
        run: |
          set -u
          echo '=== PAYAN_OPEN_FALLBACK ==='
          code=$(curl --retry 4 --retry-delay 2 --retry-all-errors -sS --max-time 30 -o /tmp/req.json -w '%{http_code}' 'https://payanagent.com/api/v1/requests?status=open&limit=200' || true)
          echo "HTTP=$code"
          if [ "$code" = 200 ]; then
            echo 'HEALTH_CHECKER'
            jq '[.requests // .items // .data // [] | .[] | select((._id // .id)=="ks76vc9pzpz3qfgf8aawjckn5n8bezhf" or .escrowReceiptId=="kn76vdyp5sb7kk2bqs130mhrx98bf90e" or ((.title//"")|ascii_downcase|contains("catalog endpoint-health checker"))) | {id:(._id//.id),title,status,budgetMaxCents,escrow,escrowDepositedCents,escrowReceiptId,bidCount,acceptedBidId,providerId}]' /tmp/req.json
            echo 'FUNDED_ALL'
            jq '[.requests // .items // .data // [] | .[] | select((.escrow//false)==true and (.escrowDepositedCents//0)>0) | {id:(._id//.id),title,description,budgetMaxCents,escrowDepositedCents,escrowReceiptId,status,bidCount,acceptedBidId,providerId}]' /tmp/req.json
          else cat /tmp/req.json; fi
          echo '=== PAYAN_RECENT_RECEIPTS ==='
          rcode=$(curl --retry 4 --retry-delay 2 --retry-all-errors -sS --max-time 30 -o /tmp/receipts.json -w '%{http_code}' 'https://payanagent.com/api/v1/receipts?limit=100' || true)
          echo "HTTP=$rcode"
          if [ "$rcode" = 200 ]; then
            jq '[.receipts // .items // .data // [] | .[] | select((tostring|contains("ks76vc9pzpz3qfgf8aawjckn5n8bezhf")) or (tostring|contains("kn76vdyp5sb7kk2bqs130mhrx98bf90e")) or ((.sellerWallet//.providerWallet//.payTo//"")|ascii_downcase)=="0x1990e21bc219696ff7fbc26527dbaed335ac6367") ]' /tmp/receipts.json
          else cat /tmp/receipts.json; fi

          echo '=== AGENT_EXCHANGE_OPEN_TASKS ==='
          node <<'NODE'
          const endpoint='https://store.agentexchange.work/mcp';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function mcp(body){let last;for(let i=0;i<4;i++){try{const r=await fetch(endpoint,{method:'POST',headers:{'content-type':'application/json','accept':'application/json, text/event-stream','mcp-protocol-version':'2025-06-18'},body:JSON.stringify(body)});const t=await r.text();if(r.status===429||r.status>=500){last=new Error(r.status);await sleep(300*2**i);continue}return {status:r.status,text:t}}catch(e){last=e;await sleep(300*2**i)}}throw last}
          function parse(t){const d=t.split(/\r?\n/).filter(x=>x.startsWith('data:')).map(x=>x.slice(5).trim());try{return JSON.parse(d.at(-1)||t)}catch{return {raw:t}}}
          await mcp({jsonrpc:'2.0',id:1,method:'initialize',params:{protocolVersion:'2025-06-18',capabilities:{},clientInfo:{name:'delta-witness-growth',version:'1.0.0'}}});
          const l=await mcp({jsonrpc:'2.0',id:2,method:'tools/list',params:{}});const tools=parse(l.text)?.result?.tools||[];
          const tool=tools.find(t=>t.name==='market_list_tasks');
          console.log('TOOL_SCHEMA',JSON.stringify(tool));
          if(tool){
            for(const args of [{status:'open'},{status:'open',limit:100},{}]){
              const c=await mcp({jsonrpc:'2.0',id:3,method:'tools/call',params:{name:'market_list_tasks',arguments:args}});
              console.log('TASKS_CALL',JSON.stringify(args),c.status,c.text.slice(0,80000));
              if(c.status===200) break;
            }
          }
          NODE
