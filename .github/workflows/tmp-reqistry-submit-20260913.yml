name: DELTA one-shot Reqistry submission 2026-09-13
on:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/tmp-reqistry-submit-20260913.yml"
  workflow_dispatch:

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Verify current owner pricing policy
        run: node scripts/check-owner-pricing.mjs
      - name: Verify live public x402 prices without payment
        run: node scripts/verify-owner-pricing-live.mjs
      - name: Check Reqistry and submit only if absent
        shell: bash
        run: |
          set -euo pipefail
          SEARCH_URL='https://api.reqistry.dev/search?q=DELTA%20Witness'
          PROD='https://delta-witness-api.ruphussten.workers.dev'

          curl -fsS --connect-timeout 10 --max-time 30 --retry 3 --retry-delay 2 --retry-all-errors "$SEARCH_URL" -o /tmp/reqistry-before.json || echo '{}' > /tmp/reqistry-before.json
          cat /tmp/reqistry-before.json

          if grep -Fqi 'DELTA Witness' /tmp/reqistry-before.json || grep -Fqi "$PROD" /tmp/reqistry-before.json; then
            echo 'REQISTRY_STATUS=already_present'
            exit 0
          fi

          npx -y mcporter@latest list https://mcp.reqistry.dev/mcp --schema > /tmp/reqistry-schema.txt
          cat /tmp/reqistry-schema.txt

          npx -y mcporter@latest call https://mcp.reqistry.dev/mcp.submit_api \
            --args '{"name":"DELTA Witness","link":"https://delta-witness-api.ruphussten.workers.dev"}' \
            --output json | tee /tmp/reqistry-submit.json

          sleep 2
          curl -fsS --connect-timeout 10 --max-time 30 --retry 3 --retry-delay 2 --retry-all-errors "$SEARCH_URL" -o /tmp/reqistry-after.json || echo '{}' > /tmp/reqistry-after.json
          cat /tmp/reqistry-after.json
          echo 'REQISTRY_STATUS=submitted_for_review'
      - name: Upload one-shot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reqistry-submit-${{ github.run_id }}
          path: |
            /tmp/reqistry-before.json
            /tmp/reqistry-schema.txt
            /tmp/reqistry-submit.json
            /tmp/reqistry-after.json
          if-no-files-found: warn
          retention-days: 7
