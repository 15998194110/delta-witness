name: TMP DELTA treasury reconciliation 20260911

on:
  push:
    paths:
      - '.github/workflows/tmp-treasury-reconcile-20260911.yml'

permissions:
  contents: read

jobs:
  treasury:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Reconcile canonical Base USDC Treasury independently
        run: node scripts/reconcile-treasury.mjs
      - name: Reconcile recent DELTA paid-funnel telemetry independently
        if: always()
        run: |
          if [[ -n "${CLOUDFLARE_API_TOKEN:-}" && -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            node scripts/query-revenue-candidates.mjs
          else
            echo '{"ok":false,"status":"telemetry_not_checked","reason":"Cloudflare scoped read credentials unavailable"}'
          fi
