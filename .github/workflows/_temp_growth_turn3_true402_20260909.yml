name: DELTA true402 Targeted Readback Temp

on:
  push:
    paths:
      - '.github/workflows/_temp_growth_turn3_true402_20260909.yml'

permissions:
  contents: read

jobs:
  readback:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read back targeted DELTA true402 listings
        shell: bash
        run: |
          set +e
          code=$(curl --retry 4 --retry-delay 2 --retry-all-errors -sS --max-time 30 -G -o /tmp/true402.json -w '%{http_code}' 'https://true402.dev/api/v1/services' --data-urlencode 'q=delta-witness' --data-urlencode 'limit=100' || true)
          echo "TRUE402_TARGETED_HTTP=$code"
          if [ "$code" = 200 ]; then
            jq '{object,has_more,next_cursor,data:[(.data // [])[] | {id,url,manifest,reputation}]}' /tmp/true402.json
          else
            head -c 4000 /tmp/true402.json; echo
          fi
