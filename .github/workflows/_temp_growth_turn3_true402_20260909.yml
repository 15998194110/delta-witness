name: DELTA Agent402 Register Temp

on:
  push:
    paths:
      - '.github/workflows/_temp_growth_turn3_true402_20260909.yml'

permissions:
  contents: read

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Register DELTA origin with Agent402 index
        shell: bash
        run: |
          set +e
          ORIGIN='https://delta-witness-api.ruphussten.workers.dev'
          code=$(curl --retry 4 --retry-delay 2 --retry-all-errors -sS --max-time 30 -o /tmp/register.json -w '%{http_code}' -X POST 'https://agent402.tools/api/index/register' -H 'content-type: application/json' --data-binary "{\"origin\":\"$ORIGIN\"}" || true)
          echo "AGENT402_REGISTER_HTTP=$code"
          jq . /tmp/register.json 2>/dev/null || head -c 4000 /tmp/register.json; echo

          echo '=== INDEX_LOOKUP ==='
          icode=$(curl --retry 4 --retry-delay 2 --retry-all-errors -sS --max-time 30 -G -o /tmp/index.json -w '%{http_code}' 'https://agent402.tools/api/index' --data-urlencode 'q=delta-witness-api.ruphussten.workers.dev' --data-urlencode 'limit=100' || true)
          echo "AGENT402_INDEX_HTTP=$icode"
          if [ "$icode" = 200 ]; then
            jq --arg origin "$ORIGIN" '[.. | objects | select(((.origin // .url // .sellerOrigin // "") | startswith($origin))) | {origin,url,sellerOrigin,name,healthy,health,lastCrawl,toolCount,chains,networks,payTo,routerDispatchEligible,routerDispatchReason,settlements,settledVolumeUsd,distinctPayers}] | unique_by(.origin // .url // .sellerOrigin // .name)' /tmp/index.json 2>/dev/null || head -c 5000 /tmp/index.json
          else
            head -c 4000 /tmp/index.json; echo
          fi
