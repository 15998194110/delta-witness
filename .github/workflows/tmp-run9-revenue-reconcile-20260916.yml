name: TEMP DELTA run9 revenue reconcile
on:
  push:
    branches: [master]
    paths: [.github/workflows/tmp-run9-revenue-reconcile-20260916.yml]
permissions:
  contents: read
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with: {persist-credentials: false}
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - name: Verify owner pricing and live public 402 without payment
        run: |
          node scripts/check-owner-pricing.mjs
          node scripts/verify-owner-pricing-live.mjs | tee /tmp/live-pricing.json
      - name: Read funded buyer demand without mutation
        run: |
          set +e
          node scripts/scan-agentpact-demand.mjs | tee /tmp/agentpact.json
          node scripts/scan-agentexchange-demand.mjs | tee /tmp/agentexchange.json
          node scripts/scan-external-funded-demand.mjs | tee /tmp/external-funded.json
          node scripts/scan-moltjobs-demand.mjs | tee /tmp/moltjobs.json
          node scripts/scan-workpnp-demand.mjs | tee /tmp/workpnp.json
          exit 0
      - name: Audit paid funnel
        run: node scripts/query-revenue-candidates.mjs | tee /tmp/revenue-candidates.json
      - name: Reconcile canonical Base USDC Treasury
        env:
          DELTA_TREASURY_LOOKBACK_BLOCKS: '50000'
          DELTA_TREASURY_CHUNK_BLOCKS: '1900'
        run: node scripts/reconcile-treasury.mjs | tee /tmp/treasury.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: delta-run9-revenue-${{ github.run_id }}
          path: |
            /tmp/live-pricing.json
            /tmp/agentpact.json
            /tmp/agentexchange.json
            /tmp/external-funded.json
            /tmp/moltjobs.json
            /tmp/workpnp.json
            /tmp/revenue-candidates.json
            /tmp/treasury.json
          if-no-files-found: warn
          retention-days: 7
