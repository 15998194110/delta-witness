name: TEMP Postera DELTA preflight 20260914-1145

on:
  push:
    paths:
      - '.github/workflows/tmp-postera-preflight-20260914-1145.yml'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - name: Reconfirm owner pricing and live public 402s
        run: |
          node scripts/check-owner-pricing.mjs
          node scripts/verify-owner-pricing-live.mjs
      - name: Inspect Postera protocol and duplicate state without signing
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://postera.dev'
          HOST='delta-witness-api.ruphussten.workers.dev'
          WALLET='0x1990e21bc219696ff7fbc26527dbaed335ac6367'
          curl -fsS --connect-timeout 10 --max-time 30 --retry 2 --retry-all-errors "$BASE/skill.md" -o /tmp/postera-skill.md
          echo '--- POSTERA_PROTOCOL_RELEVANT ---'
          grep -nEi 'challenge|register|publish|price|wallet|JWT|api/posts|api/agents' /tmp/postera-skill.md | head -n 120 || true
          echo '--- DUPLICATE_CHECK_AGENTS ---'
          curl -fsS --connect-timeout 10 --max-time 30 --retry 2 --retry-all-errors "$BASE/api/discovery/agents.json" -o /tmp/agents.json
          node - <<'NODE'
          const fs=require('fs'); const t=fs.readFileSync('/tmp/agents.json','utf8'); const s=t.toLowerCase(); console.log(JSON.stringify({contains_delta:s.includes('delta witness')||s.includes('delta-witness')||s.includes('delta_witness'),contains_host:s.includes('delta-witness-api.ruphussten.workers.dev'),bytes:t.length}));
          NODE
          echo '--- DUPLICATE_CHECK_POSTS ---'
          curl -fsS --connect-timeout 10 --max-time 30 --retry 2 --retry-all-errors "$BASE/api/discovery/posts.json" -o /tmp/posts.json
          node - <<'NODE'
          const fs=require('fs'); const t=fs.readFileSync('/tmp/posts.json','utf8'); const s=t.toLowerCase(); console.log(JSON.stringify({contains_delta:s.includes('delta witness')||s.includes('delta-witness')||s.includes('delta_witness'),contains_host:s.includes('delta-witness-api.ruphussten.workers.dev'),bytes:t.length}));
          NODE
          echo '--- CHALLENGE_PREFLIGHT_NO_SIGNATURE ---'
          node - <<'NODE'
          const fs=require('fs');
          const text=fs.readFileSync('/tmp/postera-skill.md','utf8');
          const wallet='0x1990e21bc219696ff7fbc26527dbaed335ac6367';
          const m=text.match(/POST\s+\/api\/agents\/challenge[\s\S]{0,1800}/i);
          console.log(m ? m[0].slice(0,1800) : 'challenge-doc-snippet-not-found');
          NODE
