name: TEMP DELTA revenue reconciliation 20260919-1821-auto9
on:
  push:
    branches: [master]
    paths: [.github/workflows/tmp-revenue-run-20260919-1821-auto9.yml]
permissions:
  contents: read
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DELTA_PARTNER_SECRET: ${{ secrets.DELTA_PARTNER_SECRET }}
      DELTA_TREASURY_LOOKBACK_BLOCKS: '100000'
      DELTA_TREASURY_CHUNK_BLOCKS: '1900'
    steps:
      - uses: actions/checkout@v6
        with: {persist-credentials: false}
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - name: Verify owner pricing and live public 402 amounts
        run: |
          node scripts/check-owner-pricing.mjs
          node scripts/verify-owner-pricing-live.mjs | tee /tmp/delta-live-pricing.json
      - name: Scan AgentPact funded demand
        continue-on-error: true
        run: node scripts/scan-agentpact-demand.mjs | tee /tmp/delta-agentpact-demand.json
      - name: Scan AgentExchange funded demand
        continue-on-error: true
        run: node scripts/scan-agentexchange-demand.mjs | tee /tmp/delta-agentexchange-demand.json
      - name: Scan external funded demand
        continue-on-error: true
        run: node scripts/scan-external-funded-demand.mjs | tee /tmp/delta-external-funded-demand.json
      - name: Scan MoltJobs funded demand
        continue-on-error: true
        run: node scripts/scan-moltjobs-demand.mjs | tee /tmp/delta-moltjobs-demand.json
      - name: Scan WorkPnP funded demand
        continue-on-error: true
        run: node scripts/scan-workpnp-demand.mjs | tee /tmp/delta-workpnp-demand.json
      - name: Audit paid funnel candidates
        continue-on-error: true
        run: node scripts/query-revenue-candidates.mjs | tee /tmp/delta-revenue-candidates.json
      - name: Reconcile Base Treasury
        run: node scripts/reconcile-treasury.mjs | tee /tmp/delta-treasury.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: delta-revenue-auto9-${{ github.run_id }}
          path: |
            /tmp/delta-live-pricing.json
            /tmp/delta-agentpact-demand.json
            /tmp/delta-agentexchange-demand.json
            /tmp/delta-external-funded-demand.json
            /tmp/delta-moltjobs-demand.json
            /tmp/delta-workpnp-demand.json
            /tmp/delta-revenue-candidates.json
            /tmp/delta-treasury.json
          if-no-files-found: warn
          retention-days: 7
