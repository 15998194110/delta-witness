name: DELTA One-Shot Robauto Edge Resolve

on:
  push:
    paths:
      - '.github/workflows/ops-robauto-resolve.yml'

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect official public discovery responses
        shell: bash
        run: |
          set -euo pipefail
          for u in \
            'https://robauto.ai/api/public/health' \
            'https://robauto.ai/api/public/listings' \
            'https://robauto.ai/openapi.json' \
            'https://robauto.ai/.well-known/x402.json'; do
            echo "=== $u ==="
            curl -sS -L -D /tmp/h "$u" -o /tmp/b || true
            echo '-- headers --'
            sed -n '1,80p' /tmp/h
            echo '-- top-level / URLs --'
            jq -c '{keys:(if type=="object" then keys else [] end), urls:[paths(strings) as $p | getpath($p) as $v | select($v|test("^https?://")) | {path:($p|map(tostring)|join(".")),url:$v}]}' /tmp/b 2>/dev/null || head -c 4000 /tmp/b
            echo
          done
