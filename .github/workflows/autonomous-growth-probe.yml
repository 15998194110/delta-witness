name: Autonomous Growth Probe
on:
  push:
    branches: [master]
    paths: ['.github/workflows/autonomous-growth-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify pilot and funded bid
        shell: bash
        run: |
          python - <<'PY'
          import requests,time
          s=requests.Session(); s.headers['User-Agent']='DELTA-Witness-Autonomous-Growth/1.0'
          def req(m,u,**kw):
            last=None
            for i in range(4):
              try:
                r=s.request(m,u,timeout=20,**kw)
                if r.status_code not in (429,500,502,503,504): return r
                last=r
              except Exception as e: last=e
              time.sleep(min(2**i,5))
            if isinstance(last,Exception): raise last
            return last
          base='https://delta-witness-api.ruphussten.workers.dev'
          r=req('POST',base+'/v1/guarded-action-pilot',json={'urls':['https://example.com']})
          print('PILOT_STATUS',r.status_code)
          print('PILOT_BODY',r.text[:4000].replace('\n',' '))
          rid='ks76vc9pzpz3qfgf8aawjckn5n8bezhf'; bid='jd79ndx8s7y59tkcvjbars0vf18e33z9'
          d=req('GET',f'https://payanagent.com/api/v1/requests/{rid}')
          print('PAYAN_DETAIL_STATUS',d.status_code)
          print('PAYAN_DETAIL',d.text[:9000])
          print('BID_PRESENT',bid in d.text)
          PY
