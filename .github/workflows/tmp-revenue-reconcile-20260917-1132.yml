name: TEMP DELTA revenue reconcile 2026-09-17 1132 JST
on:
  push:
    branches: [master]
    paths: [.github/workflows/tmp-revenue-reconcile-20260917-1132.yml]
permissions:
  contents: read
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DELTA_PARTNER_SECRET: ${{ secrets.DELTA_PARTNER_SECRET }}
    steps:
      - uses: actions/checkout@v6
        with: {persist-credentials: false}
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - name: Verify owner pricing and live public challenges
        run: |
          node scripts/check-owner-pricing.mjs
          node scripts/verify-owner-pricing-live.mjs | tee /tmp/delta-live-pricing.json
      - name: Audit paid funnel
        run: node scripts/query-revenue-candidates.mjs | tee /tmp/delta-revenue-candidates-current.json
      - name: Reconcile canonical Base USDC Treasury
        env:
          DELTA_TREASURY_LOOKBACK_BLOCKS: '90000'
          DELTA_TREASURY_CHUNK_BLOCKS: '1900'
        run: node scripts/reconcile-treasury.mjs | tee /tmp/delta-treasury-current.json
      - name: Scan AgentPact funded buyer demand
        continue-on-error: true
        run: node scripts/scan-agentpact-demand.mjs | tee /tmp/delta-agentpact-current.json
      - name: Scan Agent Exchange funded buyer demand
        continue-on-error: true
        run: node scripts/scan-agentexchange-demand.mjs | tee /tmp/delta-agentexchange-current.json
      - name: Scan additional funded buyer demand
        continue-on-error: true
        run: node scripts/scan-external-funded-demand.mjs | tee /tmp/delta-external-funded-current.json
      - name: Scan MoltJobs funded buyer demand
        continue-on-error: true
        run: node scripts/scan-moltjobs-demand.mjs | tee /tmp/delta-moltjobs-current.json
      - name: Scan WorkPnP funded buyer demand
        continue-on-error: true
        run: node scripts/scan-workpnp-demand.mjs | tee /tmp/delta-workpnp-current.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: delta-revenue-reconcile-${{ github.run_id }}
          path: |
            /tmp/delta-live-pricing.json
            /tmp/delta-revenue-candidates-current.json
            /tmp/delta-treasury-current.json
            /tmp/delta-agentpact-current.json
            /tmp/delta-agentexchange-current.json
            /tmp/delta-external-funded-current.json
            /tmp/delta-moltjobs-current.json
            /tmp/delta-workpnp-current.json
          if-no-files-found: warn
          retention-days: 7
