name: TMP - Submit DELTA to 402 Atlas 20260913

on:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/tmp-402atlas-feedback-submit-20260913.yml"

permissions:
  contents: write

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Submit service-for-testing feedback with bounded retries
        shell: bash
        run: |
          set -euo pipefail
          BODY=$(python - <<'PY'
          import json
          print(json.dumps({
            "message": "Please test DELTA Witness next. It is a production x402 service on Base for timestamped public-page capture, deterministic preflight verification, and guarded-action evidence. Service: https://delta-witness-api.ruphussten.workers.dev ; x402 discovery: https://delta-witness-api.ruphussten.workers.dev/.well-known/x402 ; OpenAPI: https://delta-witness-api.ruphussten.workers.dev/openapi.json ; public docs: https://delta-witness-api.ruphussten.workers.dev/docs . We are specifically seeking independent buyer-side verification using Atlas's normal real-USDC test methodology; no self-pay or synthetic traffic is requested."
          }))
          PY
          )
          mkdir -p docs/evidence
          RESP=/tmp/402atlas-response.txt
          CODE=$(curl -sS -o "$RESP" -w '%{http_code}' \
            --connect-timeout 10 --max-time 30 \
            --retry 3 --retry-delay 2 --retry-all-errors \
            -X POST 'https://402atlas.com/api/feedback' \
            -H 'content-type: application/json' \
            --data "$BODY" || true)
          python - "$CODE" "$RESP" > docs/evidence/402atlas-feedback-20260913.json <<'PY'
          import json, pathlib, sys
          code=sys.argv[1]
          p=pathlib.Path(sys.argv[2])
          text=p.read_text(errors='replace') if p.exists() else ''
          print(json.dumps({
            "channel":"402atlas",
            "action":"request_independent_service_test",
            "http_status":code,
            "response":text[:4000],
            "pricing_written":False,
            "fee_paid":False,
            "wallet_signature":False,
            "duplicate_identity_created":False
          }, indent=2))
          PY
          cat docs/evidence/402atlas-feedback-20260913.json
          case "$CODE" in 2*) ;; *) exit 1 ;; esac
      - name: Commit submission evidence
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/evidence/402atlas-feedback-20260913.json || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'evidence: record 402 Atlas test request'
          git push
