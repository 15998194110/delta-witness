name: TEMP nohumans capture claim refresh 20260915
on:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/tmp-nohumans-claim-inspect-20260915.yml"

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Pre-write owner pricing gate
        run: |
          node scripts/check-owner-pricing.mjs
          node scripts/verify-owner-pricing-live.mjs
      - name: Claim existing Capture listing and add buyer-construction metadata
        shell: bash
        run: |
          set -euo pipefail
          ID='9acc2efd-b71'
          API='https://api.nohumans.directory'
          ORIGIN='https://delta-witness-api.ruphussten.workers.dev'

          # Mint a proof-of-control challenge. It is not a credential and expires in 24h.
          curl -fsS --connect-timeout 10 --max-time 25 --retry 3 --retry-delay 2 --retry-all-errors \
            -X POST "$API/v1/listings/$ID/claim/challenge" -o /tmp/nohumans-challenge.json
          CHALLENGE=$(jq -er '.token' /tmp/nohumans-challenge.json)

          # Temporarily serve the one-time challenge from the canonical origin.
          CHALLENGE="$CHALLENGE" python - <<'PY'
          from pathlib import Path
          import json, os
          p=Path('src/index.ts')
          s=p.read_text()
          marker='app.get("/health", (c) => c.json({ ok: true, version: c.env.APP_VERSION, network: c.env.NETWORK, ts: new Date().toISOString() }));'
          assert marker in s
          token=json.dumps(os.environ['CHALLENGE'])
          route=f'app.get("/.well-known/nohumans-claim", (c) => c.text({token}));\n\n'
          p.write_text(s.replace(marker, route+marker, 1))
          PY
          npm run check
          npx wrangler deploy

          LIVE=$(curl -fsS --connect-timeout 10 --max-time 20 "$ORIGIN/.well-known/nohumans-claim")
          test "$LIVE" = "$CHALLENGE"

          # Claim returns the private edit credential once. Keep it only in this process; never print it.
          curl -fsS --connect-timeout 10 --max-time 25 --retry 2 --retry-delay 2 --retry-all-errors \
            -X POST "$API/v1/listings/$ID/claim" \
            -H 'content-type: application/json' \
            --data '{"email":"ruphussten85@gmail.com"}' \
            -o /tmp/nohumans-claim.json
          EDIT_TOKEN=$(jq -er '.edit_token' /tmp/nohumans-claim.json)

          cat > /tmp/nohumans-patch.json <<'JSON'
          {
            "name": "DELTA Witness Capture — Public Page-State Evidence",
            "description": "Independent timestamped evidence of what a public webpage says now, for procurement, price/availability checks and consequential browser-agent actions. Live x402 v2 price is 1 USDC on Base; the endpoint's current 402 challenge is authoritative.",
            "request_schema": {
              "type": "object",
              "additionalProperties": false,
              "properties": {
                "url": {
                  "type": "string",
                  "pattern": "^https?://",
                  "description": "Public HTTP(S) webpage to observe."
                }
              },
              "required": ["url"]
            },
            "response_schema": {
              "type": "object",
              "required": ["ok", "product", "proof_id", "manifest_url", "public_proof_url", "bundle_root", "observed_at"],
              "properties": {
                "ok": {"const": true},
                "product": {"enum": ["capture", "preflight"]},
                "proof_id": {"type": "string"},
                "manifest_url": {"type": "string"},
                "public_proof_url": {"type": "string"},
                "bundle_root": {"type": "string"},
                "observed_at": {"type": "string"},
                "idempotent_replay": {"type": "boolean"}
              }
            },
            "sample_query": "https://delta-witness-api.ruphussten.workers.dev/v1/quote?product=capture"
          }
          JSON

          PATCH_STATUS=$(curl -sS --connect-timeout 10 --max-time 25 --retry 2 --retry-delay 2 --retry-all-errors \
            -o /tmp/nohumans-patch-response.json -w '%{http_code}' \
            -X PATCH "$API/v1/listings/$ID" \
            -H 'content-type: application/json' \
            -H "x-claim-token: $EDIT_TOKEN" \
            --data-binary @/tmp/nohumans-patch.json)
          test "$PATCH_STATUS" = '200'

          # Sanitize secrets before any readback is printed.
          rm -f /tmp/nohumans-challenge.json /tmp/nohumans-claim.json /tmp/nohumans-patch-response.json
          unset CHALLENGE EDIT_TOKEN LIVE

          curl -fsS --connect-timeout 10 --max-time 25 "$API/v1/listings/$ID" -o /tmp/nohumans-readback.json
          jq '{id,name,description,endpoint_url,status,origin_status,request_schema,response_schema,sample_query,probe,price,onchain_30d}' /tmp/nohumans-readback.json
      - name: Restore canonical production source and redeploy
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- src/index.ts
          npm run check
          npx wrangler deploy
      - name: Post-restore production integrity gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-owner-pricing-live.mjs
          STATUS=$(curl -sS -o /tmp/nohumans-claim-route.txt -w '%{http_code}' https://delta-witness-api.ruphussten.workers.dev/.well-known/nohumans-claim)
          test "$STATUS" = '404'
