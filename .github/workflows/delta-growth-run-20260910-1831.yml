name: DELTA Growth Run 2026-09-10 18:31
on:
  push:
    branches: [master]
    paths: ['.github/workflows/delta-growth-run-20260910-1831.yml']
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - name: Verify DELTA core pricing integrity
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          git checkout --detach origin/master
          BASE='https://delta-witness-api.ruphussten.workers.dev'
          probe() {
            local name="$1" path="$2" expected="$3"
            code=$(curl --connect-timeout 10 --max-time 30 --retry 3 --retry-all-errors --retry-delay 2 -sS -o /tmp/body -D /tmp/headers -w '%{http_code}' -X POST "$BASE$path" -H 'content-type: application/json' -d '{}')
            hdr=$(awk 'BEGIN{IGNORECASE=1} /^payment-required:/{sub(/^[^:]+:[[:space:]]*/,""); gsub(/\r/,""); print; exit}' /tmp/headers)
            decoded=$(printf '%s' "$hdr" | base64 -d)
            amount=$(printf '%s' "$decoded" | jq -r '.. | .amount? // empty' | head -1)
            payto=$(printf '%s' "$decoded" | jq -r '.. | .payTo? // empty' | head -1)
            network=$(printf '%s' "$decoded" | jq -r '.. | .network? // empty' | head -1)
            echo "CORE product=$name status=$code amount=$amount expected=$expected payTo=$payto network=$network"
            test "$code" = 402
            test "$amount" = "$expected"
            test "${payto,,}" = '0x1990e21bc219696ff7fbc26527dbaed335ac6367'
            test "$network" = 'eip155:8453'
          }
          probe capture '/v1/capture' 1000000
          probe preflight '/v1/preflight' 5000000
          probe pilot '/v1/guarded-action-pilot' 10000000
          curl --fail --retry 3 --retry-all-errors --retry-delay 2 "$BASE/health"
      - name: Submit DELTA Witness to Agents.NET if absent
        shell: bash
        run: |
          set -u
          existing=''
          for i in 1 2 3; do
            existing=$(curl --connect-timeout 10 --max-time 30 -fsS "https://agents.net/api/agents?search=DELTA%20Witness&limit=10" 2>/tmp/agents-get.err) && break
            echo "AGENTS_NET read_attempt=$i degraded=$(cat /tmp/agents-get.err)"
            sleep $((i*2))
          done
          if [ -n "$existing" ]; then
            echo "$existing" >/tmp/agents-existing.json
            count=$(printf '%s' "$existing" | jq '[.agents[]? | select((.name // "" | ascii_downcase) == "delta witness")] | length' 2>/dev/null || echo 0)
          else
            count=0
          fi
          if [ "$count" -gt 0 ]; then
            printf '%s' "$existing" | jq -c '.agents[] | select((.name // "" | ascii_downcase) == "delta witness") | {id,name,status,category,platform,apiEndpoint,submittedAt}'
            echo 'AGENTS_NET action=already_present'
            exit 0
          fi
          payload=$(jq -nc '{name:"DELTA Witness",description:"Trust layer for autonomous actions: timestamped public-web evidence, deterministic preflight verification, and guarded-action pilots paid per call with x402 on Base USDC.",category:"Governance",contactEmail:"ruphussten85@gmail.com",apiEndpoint:"https://delta-witness-api.ruphussten.workers.dev",platform:"Custom x402 / MCP"}')
          code=''
          for i in 1 2 3; do
            code=$(curl --connect-timeout 10 --max-time 30 -sS -o /tmp/agents-submit.json -w '%{http_code}' -X POST 'https://agents.net/api/agents/submit' -H 'content-type: application/json' --data "$payload") || code=000
            echo "AGENTS_NET submit_attempt=$i http=$code body=$(cat /tmp/agents-submit.json 2>/dev/null || true)"
            case "$code" in 201|409) break;; 429|500|502|503|504|000) sleep $((i*3));; *) break;; esac
          done
          if [ "$code" = 201 ] || [ "$code" = 409 ]; then exit 0; fi
          echo 'AGENTS_NET channel=degraded recoverable=true'
          exit 0
      - name: Check x402 Arena existing DELTA registrations
        shell: bash
        run: |
          set -u
          for i in 1 2 3; do
            code=$(curl --connect-timeout 10 --max-time 30 -sS -o /tmp/arena.json -w '%{http_code}' 'https://core.x402arena.gg/operator/agents') || code=000
            echo "ARENA attempt=$i http=$code"
            if [ "$code" = 200 ]; then
              jq -c '.. | objects | select((.name? // .id? // "" | tostring | ascii_downcase | contains("delta-witness")))' /tmp/arena.json 2>/dev/null | head -20 || true
              exit 0
            fi
            case "$code" in 429|500|502|503|504|000) sleep $((i*2));; *) break;; esac
          done
          echo 'ARENA channel=degraded recoverable=true'
          exit 0
      - name: Reconcile Base Treasury independently
        shell: bash
        run: |
          set -euo pipefail
          node scripts/reconcile-treasury.mjs
