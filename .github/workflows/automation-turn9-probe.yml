name: automation-turn9-probe
on:
  push:
    paths:
      - '.github/workflows/automation-turn9-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect current Agent Bazaar submission rail
        shell: bash
        run: |
          python3 - <<'PY'
          import json,re,urllib.request,urllib.error,urllib.parse,time
          BASE='https://www.agent-bazaar.com'
          def get(url):
              try:
                  req=urllib.request.Request(url,headers={'user-agent':'delta-autonomous-growth/turn9-agentbazaar'})
                  with urllib.request.urlopen(req,timeout=30) as r: return r.status,r.read().decode('utf-8','replace')
              except urllib.error.HTTPError as e: return e.code,e.read().decode('utf-8','replace')
              except Exception as e: return 0,repr(e)
          out={}
          st,html=get(BASE+'/dev'); out['dev_http']=st
          scripts=re.findall(r'<script[^>]+src="([^"]+)"',html)
          out['script_count']=len(scripts)
          needles=[]
          for src in scripts:
              if src.startswith('/'): src=BASE+src
              elif not src.startswith('http'): continue
              ss,body=get(src)
              if ss!=200: continue
              for pat in [r'https?://[^"\'\\\s]+',r'NEXT_PUBLIC_API_BASE_URL',r'/api/capabilities',r'/capabilities']:
                  for m in re.findall(pat,body):
                      if isinstance(m,tuple): m=''.join(m)
                      if 'capabil' in str(m).lower() or 'api' in str(m).lower(): needles.append(str(m)[:300])
          out['bundle_candidates']=sorted(set(needles))[:100]
          for u in [BASE+'/api/submit',BASE+'/api/capabilities']:
              s,b=get(u); out[u]={'http':s,'body':b[:3000]}
          print('AGENT_BAZAAR_INSPECT='+json.dumps(out,separators=(',',':'),sort_keys=True))
          PY
