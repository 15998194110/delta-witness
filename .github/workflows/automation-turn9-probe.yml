name: automation-turn9-probe
on:
  push:
    paths:
      - '.github/workflows/automation-turn9-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Validate CDP Bazaar discovery
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.error, urllib.parse, time
          ORIGIN='https://delta-witness-api.ruphussten.workers.dev'
          routes=['/v1/capture','/v1/preflight','/v1/guarded-action-pilot']
          def req(method,url,payload=None):
              data=json.dumps(payload).encode() if payload is not None else None
              h={'user-agent':'delta-autonomous-growth/turn9-cdp','content-type':'application/json'}
              for i in range(3):
                  try:
                      r=urllib.request.urlopen(urllib.request.Request(url,data=data,headers=h,method=method),timeout=30)
                      return {'status':r.status,'body':r.read().decode('utf-8','replace')}
                  except urllib.error.HTTPError as e:
                      b=e.read().decode('utf-8','replace')
                      if e.code not in (429,500,502,503,504) or i==2: return {'status':e.code,'body':b}
                  except Exception as e:
                      if i==2: return {'status':0,'body':repr(e)}
                  time.sleep(1.5*(2**i))
          out={}
          for path in routes:
              v=req('POST','https://api.cdp.coinbase.com/platform/v2/x402/validate',{'resource':ORIGIN+path,'method':'POST'})
              try: body=json.loads(v['body'])
              except: body=v['body'][:2500]
              out[path]={'validate_http':v['status'],'validation':body}
              q=urllib.parse.quote(ORIGIN+path,safe='')
              s=req('GET','https://api.cdp.coinbase.com/platform/v2/x402/discovery/search?query='+q+'&limit=20')
              try: sb=json.loads(s['body'])
              except: sb=s['body'][:2500]
              out[path]['search_http']=s['status']; out[path]['search']=sb
          print('CDP_BAZAAR_RESULT='+json.dumps(out,separators=(',',':'),sort_keys=True))
          PY
