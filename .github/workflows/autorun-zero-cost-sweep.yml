name: DELTA zero-cost distribution sweep

on:
  push:
    paths:
      - '.github/workflows/autorun-zero-cost-sweep.yml'

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: DELTA core unpaid 402 integrity
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://delta-witness-api.ruphussten.workers.dev'
          code=$(curl -sS -o /tmp/preflight.body -D /tmp/preflight.headers -w '%{http_code}' --max-time 20 -X POST "$BASE/v1/preflight" -H 'content-type: application/json' -d '{"url":"https://example.com","expected":{"contains":["Example Domain"]}}')
          echo "preflight_http=$code"
          test "$code" = "402"
          grep -qi '^payment-required:' /tmp/preflight.headers
          echo 'DELTA_CORE_402=pass'

      - name: true402 free registry with fallback manifest
        shell: bash
        run: |
          set +e
          API='https://true402.dev/api/v1/services'
          code=$(curl -sS --max-time 20 -o /tmp/true402-services.json -w '%{http_code}' "$API")
          echo "TRUE402_CATALOG_HTTP=$code"
          if [ -s /tmp/true402-services.json ] && grep -qiE 'delta-witness|ruphussten' /tmp/true402-services.json; then
            echo 'TRUE402_STATUS=already_listed'
            grep -ioE '.{0,180}(delta-witness|ruphussten).{0,360}' /tmp/true402-services.json | head -5 || true
            exit 0
          fi
          payload=$(jq -cn '{url:"https://delta-witness-api.ruphussten.workers.dev",manifest:{x402:"1.0",name:"delta-witness-page-state-proof",capabilities:["browser-verification","page-state-proof","preflight-verification","workflow-safety","shopping","procurement"],pricing:{currency:"USDC",base:"0.03",unit:"request"},payment:{address:"0x1990e21bc219696ff7fbc26527dbaed335ac6367",chain:"base",facilitator:"https://facilitator.payai.network"},endpoint:"https://delta-witness-api.ruphussten.workers.dev/v1/capture"}}')
          status=$(curl -sS --max-time 35 -o /tmp/true402-register.body -w '%{http_code}' -X POST "$API" -H 'content-type: application/json' -d "$payload")
          echo "TRUE402_REGISTER_HTTP=$status"
          cat /tmp/true402-register.body || true
          echo
          sleep 1
          verify=$(curl -sS --max-time 20 -o /tmp/true402-after.json -w '%{http_code}' "$API")
          echo "TRUE402_VERIFY_HTTP=$verify"
          if grep -qiE 'delta-witness|ruphussten' /tmp/true402-after.json 2>/dev/null; then
            echo 'TRUE402_STATUS=live_in_catalog'
            grep -ioE '.{0,180}(delta-witness|ruphussten).{0,420}' /tmp/true402-after.json | head -5 || true
          elif [[ "$status" =~ ^2 ]]; then
            echo 'TRUE402_STATUS=accepted_not_yet_visible'
          else
            echo 'TRUE402_STATUS=registration_not_accepted'
          fi
          exit 0

      - name: Tollbooth category discovery and free registrations
        shell: bash
        run: |
          set +e
          API='https://www.trytollbooth.com/api/services'
          code=$(curl -sS --max-time 25 -o /tmp/toll-all.json -w '%{http_code}' "$API")
          echo "TOLLBOOTH_LIST_HTTP=$code"
          echo 'TOLLBOOTH_CATEGORIES:'
          jq -r '[((.services // .)[]? | .category // empty)] | unique | .[]' /tmp/toll-all.json 2>/dev/null || true
          if grep -qiE 'delta-witness|ruphussten' /tmp/toll-all.json 2>/dev/null; then
            echo 'TOLLBOOTH_STATUS=already_listed'
            grep -ioE '.{0,180}(delta-witness|ruphussten).{0,500}' /tmp/toll-all.json | head -10 || true
            exit 0
          fi
          categories=$(jq -r '[((.services // .)[]? | .category // empty)] | unique | .[]' /tmp/toll-all.json 2>/dev/null)
          category=$(printf '%s\n' "$categories" | grep -Ei 'security|verification|developer|data|utility|other' | head -1)
          if [ -z "$category" ]; then category=$(printf '%s\n' "$categories" | head -1); fi
          if [ -z "$category" ]; then category='ai-inference'; fi
          echo "TOLLBOOTH_SELECTED_CATEGORY=$category"
          for spec in capture preflight; do
            if [ "$spec" = capture ]; then
              name='DELTA Witness - Page State Proof'
              endpoint='https://delta-witness-api.ruphussten.workers.dev/v1/capture'
              desc='Verifiable browser page-state capture for autonomous agents before or after irreversible web actions. Returns proof and receipt output for browser, shopping, procurement and workflow verification.'
            else
              name='DELTA Guard - Preflight Verification'
              endpoint='https://delta-witness-api.ruphussten.workers.dev/v1/preflight'
              desc='Deterministic preflight verification for autonomous browser and workflow actions before irreversible execution.'
            fi
            payload=$(jq -cn --arg n "$name" --arg e "$endpoint" --arg d "$desc" --arg c "$category" '{name:$n,endpoint:$e,category:$c,priceUsdc:0.03,wallet:"0x1990e21bc219696ff7fbc26527dbaed335ac6367",chain:"base",description:$d}')
            c=$(curl -sS --max-time 50 -o "/tmp/toll-$spec.body" -w '%{http_code}' -X POST "$API" -H 'content-type: application/json' -d "$payload")
            echo "TOLLBOOTH_${spec}_HTTP=$c"
            cat "/tmp/toll-$spec.body" || true
            echo
          done
          sleep 1
          curl -sS --max-time 25 "$API" -o /tmp/toll-after.json
          if grep -qiE 'delta-witness|ruphussten' /tmp/toll-after.json 2>/dev/null; then
            echo 'TOLLBOOTH_STATUS=live_in_registry'
            grep -ioE '.{0,220}(delta-witness|ruphussten).{0,650}' /tmp/toll-after.json | head -10 || true
          else
            echo 'TOLLBOOTH_STATUS=not_visible_after_registration'
          fi
          exit 0

      - name: Agent402 DELTA routing evidence
        shell: bash
        run: |
          set +e
          for q in 'page-state proof' 'preflight verification'; do
            echo "AGENT402_QUERY=$q"
            curl -sS --max-time 20 --get 'https://agent402.tools/api/route' --data-urlencode "q=$q" --data 'include=external' -o /tmp/agent402.json
            jq -c --arg host 'delta-witness-api.ruphussten.workers.dev' '{query:.query,count:.count,delta:[.results[]? | select(.url|contains($host)) | {seller,slug,name,route,url,price,priceUsd,health,score,networks,routerDispatchEligible,routerDispatchReason,executeViaCallableNow}]}' /tmp/agent402.json 2>/dev/null || cat /tmp/agent402.json
          done
          exit 0

      - name: SwarmBazaar review visibility
        shell: bash
        run: |
          set +e
          found=0
          for u in 'https://swarmbazaar.com/index.json' 'https://swarmbazaar.com/llms.txt'; do
            echo "SWARM_URL=$u"
            curl -sS --max-time 20 "$u" -o /tmp/swarm.out
            if grep -qiE 'DELTA Witness|delta-witness|ruphussten' /tmp/swarm.out; then
              found=1
              grep -iE -C 2 'DELTA Witness|delta-witness|ruphussten' /tmp/swarm.out | head -80 || true
            fi
          done
          if [ "$found" = 1 ]; then echo 'SWARMBAZAAR_STATUS=live'; else echo 'SWARMBAZAAR_STATUS=pending_or_absent'; fi
          exit 0

      - name: PayanAgent funded request inventory
        shell: bash
        run: |
          set +e
          url='https://payanagent.com/api/v1/requests?status=open&limit=100'
          ok=0
          for delay in 0 2 5; do
            sleep "$delay"
            code=$(curl -sS --max-time 25 -o /tmp/payan.body -w '%{http_code}' "$url")
            echo "PAYAN_HTTP=$code"
            if [[ "$code" =~ ^2 ]]; then ok=1; break; fi
          done
          if [ "$ok" = 1 ]; then
            jq -c '[((.requests // .)[]?) | select((((.title // "") + " " + (.description // "") + " " + ((.inputPayload // "")|tostring))) | test("browser|url|web|verify|verification|evidence|preflight|audit|proof|page|shopping|procurement|workflow";"i")) | {id,title,budgetMaxCents,escrow,status,createdAt}]' /tmp/payan.body || cat /tmp/payan.body
          else
            echo 'PAYAN_STATUS=degraded_after_retries'
          fi
          exit 0

      - name: Base Treasury incoming USDC reconciliation
        if: always()
        shell: bash
        run: |
          set +e
          URL='https://base.blockscout.com/api/v2/addresses/0x1990e21bc219696ff7fbc26527dbaed335ac6367/token-transfers?type=ERC-20'
          ok=0
          for delay in 0 2 5; do
            sleep "$delay"
            code=$(curl -sS --max-time 25 -o /tmp/transfers.json -w '%{http_code}' "$URL")
            echo "BLOCKSCOUT_HTTP=$code"
            if [[ "$code" =~ ^2 ]]; then ok=1; break; fi
          done
          if [ "$ok" != 1 ]; then echo 'TREASURY_RECONCILIATION=unavailable_after_retries'; exit 0; fi
          jq -c --arg usdc '0x833589fcd6edb6e08f4c7c32d4f71b54bda02913' --arg addr '0x1990e21bc219696ff7fbc26527dbaed335ac6367' '[.items[]? | select((((.token.address_hash // .token.address // "") | ascii_downcase) == $usdc) and (((.to.hash // .to // "") | ascii_downcase) == $addr)) | {tx_hash:.transaction_hash,timestamp:.timestamp,from:(.from.hash // .from),raw_value:(.total.value // .value),decimals:(.token.decimals // 6)}] | {latest_incoming_usdc:.}' /tmp/transfers.json
          exit 0
