name: DELTA zero-cost distribution sweep

on:
  push:
    paths:
      - '.github/workflows/autorun-zero-cost-sweep.yml'

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: DELTA core unpaid 402 integrity
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://delta-witness-api.ruphussten.workers.dev'
          code=$(curl -sS -o /tmp/preflight.body -D /tmp/preflight.headers -w '%{http_code}' --max-time 20 -X POST "$BASE/v1/preflight" -H 'content-type: application/json' -d '{"url":"https://example.com","expected":{"contains":["Example Domain"]}}')
          echo "preflight_http=$code"
          test "$code" = "402"
          grep -qi '^payment-required:' /tmp/preflight.headers
          echo 'DELTA_CORE_402=pass'

      - name: true402 free registry
        shell: bash
        run: |
          set +e
          ORIGIN='https://delta-witness-api.ruphussten.workers.dev'
          code=$(curl -sS --max-time 20 -o /tmp/true402-services.json -w '%{http_code}' 'https://true402.dev/api/v1/services')
          echo "TRUE402_CATALOG_HTTP=$code"
          if [ -s /tmp/true402-services.json ] && grep -qiE 'delta-witness|ruphussten' /tmp/true402-services.json; then
            echo 'TRUE402_STATUS=already_listed'
            grep -ioE '.{0,180}(delta-witness|ruphussten).{0,320}' /tmp/true402-services.json | head -5 || true
            exit 0
          fi
          status=$(curl -sS --max-time 30 -o /tmp/true402-register.body -w '%{http_code}' -X POST 'https://true402.dev/api/v1/services' -H 'content-type: application/json' -d '{"url":"https://delta-witness-api.ruphussten.workers.dev"}')
          echo "TRUE402_REGISTER_HTTP=$status"
          cat /tmp/true402-register.body || true
          echo
          if [[ "$status" =~ ^2 ]]; then echo 'TRUE402_STATUS=registration_accepted'; else echo 'TRUE402_STATUS=registration_not_accepted'; fi
          exit 0

      - name: Tollbooth free registrations
        shell: bash
        run: |
          set +e
          API='https://www.trytollbooth.com/api/services'
          code=$(curl -sS --max-time 20 -o /tmp/tollbooth-search.json -w '%{http_code}' "$API?q=DELTA")
          echo "TOLLBOOTH_SEARCH_HTTP=$code"
          cat /tmp/tollbooth-search.json 2>/dev/null | head -c 5000 || true
          echo
          if grep -q 'https://delta-witness-api.ruphussten.workers.dev/v1/capture' /tmp/tollbooth-search.json 2>/dev/null; then
            echo 'TOLLBOOTH_capture=already_listed'
          else
            payload=$(jq -cn --arg n 'DELTA Witness - Page State Proof' --arg e 'https://delta-witness-api.ruphussten.workers.dev/v1/capture' --arg d 'Verifiable browser page-state capture for autonomous agents before or after irreversible web actions. Returns proof and receipt output for browser, shopping, procurement and workflow verification.' '{name:$n,endpoint:$e,category:"developer-tools",priceUsdc:0.03,wallet:"0x1990e21bc219696ff7fbc26527dbaed335ac6367",chain:"base",description:$d}')
            c=$(curl -sS --max-time 45 -o /tmp/tollbooth-capture.body -w '%{http_code}' -X POST "$API" -H 'content-type: application/json' -d "$payload")
            echo "TOLLBOOTH_capture_HTTP=$c"
            cat /tmp/tollbooth-capture.body || true
            echo
          fi
          if grep -q 'https://delta-witness-api.ruphussten.workers.dev/v1/preflight' /tmp/tollbooth-search.json 2>/dev/null; then
            echo 'TOLLBOOTH_preflight=already_listed'
          else
            payload=$(jq -cn --arg n 'DELTA Guard - Preflight Verification' --arg e 'https://delta-witness-api.ruphussten.workers.dev/v1/preflight' --arg d 'Deterministic preflight verification for autonomous browser and workflow actions before irreversible execution.' '{name:$n,endpoint:$e,category:"developer-tools",priceUsdc:0.03,wallet:"0x1990e21bc219696ff7fbc26527dbaed335ac6367",chain:"base",description:$d}')
            c=$(curl -sS --max-time 45 -o /tmp/tollbooth-preflight.body -w '%{http_code}' -X POST "$API" -H 'content-type: application/json' -d "$payload")
            echo "TOLLBOOTH_preflight_HTTP=$c"
            cat /tmp/tollbooth-preflight.body || true
            echo
          fi
          exit 0

      - name: Agent402 routing verification
        shell: bash
        run: |
          set +e
          for q in 'DELTA Witness' 'page-state proof' 'preflight verification'; do
            echo "AGENT402_QUERY=$q"
            curl -sS --max-time 20 --get 'https://agent402.tools/api/route' --data-urlencode "q=$q" --data 'include=external' | head -c 6000
            echo
          done
          exit 0

      - name: SwarmBazaar review visibility
        shell: bash
        run: |
          set +e
          for u in 'https://swarmbazaar.com/index.json' 'https://swarmbazaar.com/llms.txt'; do
            echo "SWARM_URL=$u"
            curl -sS --max-time 20 "$u" -o /tmp/swarm.out
            grep -iE -C 2 'DELTA Witness|delta-witness|ruphussten' /tmp/swarm.out | head -80 || true
          done
          exit 0

      - name: PayanAgent funded request inventory
        shell: bash
        run: |
          set +e
          url='https://payanagent.com/api/v1/requests?status=open&limit=100'
          ok=0
          for delay in 0 2 5; do
            sleep "$delay"
            code=$(curl -sS --max-time 25 -o /tmp/payan.body -w '%{http_code}' "$url")
            echo "PAYAN_HTTP=$code"
            if [[ "$code" =~ ^2 ]]; then ok=1; break; fi
            head -c 1200 /tmp/payan.body 2>/dev/null || true
            echo
          done
          if [ "$ok" = 1 ]; then
            jq -c '[((.requests // .)[]?) | select((((.title // "") + " " + (.description // "") + " " + ((.inputPayload // "")|tostring))) | test("browser|url|web|verify|verification|evidence|preflight|audit|proof|page|shopping|procurement|workflow";"i")) | {id,title,budgetMaxCents,escrow,status,createdAt}]' /tmp/payan.body || cat /tmp/payan.body
          else
            echo 'PAYAN_STATUS=degraded_after_retries'
          fi
          exit 0

      - name: Paywitness documented self-list schema discovery
        shell: bash
        run: |
          set +e
          for u in 'https://paywitness.ai/openapi.json' 'https://paywitness.ai/llms.txt' 'https://paywitness.ai/'; do
            echo "PAYWITNESS_URL=$u"
            curl -sS -L --max-time 25 "$u" -o /tmp/payw.out
            grep -E -i -C 5 'POST /list|"/list"|self.?list|listRequest|resource.*url' /tmp/payw.out | head -120 || true
          done
          exit 0

      - name: Base Treasury incoming USDC reconciliation
        if: always()
        shell: bash
        run: |
          set +e
          URL='https://base.blockscout.com/api/v2/addresses/0x1990e21bc219696ff7fbc26527dbaed335ac6367/token-transfers?type=ERC-20'
          ok=0
          for delay in 0 2 5; do
            sleep "$delay"
            code=$(curl -sS --max-time 25 -o /tmp/transfers.json -w '%{http_code}' "$URL")
            echo "BLOCKSCOUT_HTTP=$code"
            if [[ "$code" =~ ^2 ]]; then ok=1; break; fi
          done
          if [ "$ok" != 1 ]; then
            echo 'TREASURY_RECONCILIATION=unavailable_after_retries'
            exit 0
          fi
          jq -c --arg usdc '0x833589fcd6edb6e08f4c7c32d4f71b54bda02913' --arg addr '0x1990e21bc219696ff7fbc26527dbaed335ac6367' '[.items[]? | select((((.token.address_hash // .token.address // "") | ascii_downcase) == $usdc) and (((.to.hash // .to // "") | ascii_downcase) == $addr)) | {tx_hash:.transaction_hash,timestamp:.timestamp,from:(.from.hash // .from),raw_value:(.total.value // .value),decimals:(.token.decimals // 6)}] | {latest_incoming_usdc:.}' /tmp/transfers.json
          exit 0
