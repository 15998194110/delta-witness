name: TEMP Circle form inspect 20260915
on:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/tmp-circle-form-inspect-20260915.yml"
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Circle Google Form and extract fields
        shell: bash
        run: |
          set -euo pipefail
          URL='https://docs.google.com/forms/d/e/1FAIpQLSeVGlFm-rglBEd8nPqWTdbg2XIe8jY7dd43iFC-FhP2WANQvQ/viewform?usp=send_form'
          curl -fL --connect-timeout 10 --max-time 30 --retry 3 --retry-delay 2 --retry-all-errors "$URL" -o /tmp/form.html
          node <<'NODE'
          const fs = require('fs');
          const h = fs.readFileSync('/tmp/form.html','utf8');
          const action = h.match(/<form[^>]+action="([^"]+)"/i)?.[1] || null;
          const title = h.match(/<title>([^<]+)<\/title>/i)?.[1] || null;
          const entries = [...new Set([...h.matchAll(/entry\.(\d+)/g)].map(m=>m[1]))];
          console.log(JSON.stringify({title, action, entry_ids: entries, html_bytes:h.length},null,2));
          for (const id of entries.slice(0,40)) {
            const pos = h.indexOf('entry.'+id);
            const start = Math.max(0,pos-500), end = Math.min(h.length,pos+500);
            console.log(`\n=== ENTRY ${id} CONTEXT ===\n`+h.slice(start,end).replace(/\s+/g,' '));
          }
          const idx = h.indexOf('FB_PUBLIC_LOAD_DATA_');
          if (idx >= 0) console.log('\n=== FB_PUBLIC_LOAD_DATA_ PREFIX ===\n'+h.slice(idx, Math.min(h.length, idx+16000)).replace(/\s+/g,' '));
          NODE
