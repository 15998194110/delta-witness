name: DELTA Automation Turn4 One-Shot Scan
on:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/tmp-automation-turn4-scan-20260913.yml"

permissions:
  contents: write

jobs:
  scan:
    if: contains(github.event.head_commit.message, '[delta-turn4-scan]')
    runs-on: ubuntu-latest
    env:
      DELTA_PARTNER_GATEWAY_SECRET: ${{ secrets.DELTA_PARTNER_GATEWAY_SECRET }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Current owner policy check
        run: node scripts/check-owner-pricing.mjs > /tmp/policy.txt
      - name: Live public 402 pricing and identity verification
        continue-on-error: true
        env:
          PRICING_AUDIT_OUTPUT: /tmp/pricing.json
        run: node scripts/verify-owner-pricing-live.mjs --diagnostic
      - name: Revenue funnel candidates
        if: always()
        continue-on-error: true
        run: node scripts/query-revenue-candidates.mjs > /tmp/funnel.json
      - name: Base Treasury reconciliation
        if: always()
        continue-on-error: true
        run: node scripts/reconcile-treasury.mjs > /tmp/treasury.json
      - name: AgentPact demand and deal state
        if: always()
        continue-on-error: true
        run: node scripts/scan-agentpact-demand.mjs > /tmp/agentpact.json
      - name: Agent Exchange demand
        if: always()
        continue-on-error: true
        run: node scripts/scan-agentexchange-demand.mjs > /tmp/agentexchange.json
      - name: Payan demand
        if: always()
        continue-on-error: true
        run: node scripts/scan-payan-demand.mjs > /tmp/payan.json
      - name: Current discovery probes with bounded retries
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          HOST='delta-witness-api.ruphussten.workers.dev'
          fetch_bounded() { curl -fsS --connect-timeout 10 --max-time 25 --retry 3 --retry-delay 2 --retry-all-errors "$1" -o "$2"; }
          CIRCLE=degraded
          if fetch_bounded "https://api.circle.com/v2/x402/discovery/resources?query=${HOST}" /tmp/circle.json; then
            if grep -Fqi "$HOST" /tmp/circle.json; then CIRCLE=present; else CIRCLE=absent; fi
          fi
          CLAWS=degraded
          if fetch_bounded "https://clawslist.com" /tmp/claws.html; then CLAWS=reachable; fi
          ATLAS=degraded
          if fetch_bounded "https://www.402atlas.com" /tmp/atlas.html; then
            if grep -Fqi "$HOST" /tmp/atlas.html || grep -Fqi 'DELTA Witness' /tmp/atlas.html; then ATLAS=present; else ATLAS=absent_or_not_indexed; fi
          fi
          printf '{"circle":"%s","clawslist":"%s","atlas":"%s"}\n' "$CIRCLE" "$CLAWS" "$ATLAS" > /tmp/discovery.json
      - name: Inspect AgentBets free listing API without creating a submission
        if: always()
        continue-on-error: true
        run: |
          node <<'NODE'
          const fs=require('fs');
          (async()=>{
            const sleep=ms=>new Promise(r=>setTimeout(r,ms));
            async function get(url,init={}){
              let last;
              for(let i=1;i<=3;i++){
                try{
                  const r=await fetch(url,{...init,signal:AbortSignal.timeout(15000)});
                  const t=await r.text();
                  if([429,500,502,503,504].includes(r.status)) throw new Error(`http_${r.status}`);
                  return {status:r.status,text:t,attempt:i};
                }catch(e){last=String(e);if(i<3)await sleep(1000*2**(i-1));}
              }
              return {status:null,text:'',error:last};
            }
            const spec=await get('https://agentbets.ai/api/openapi.yaml');
            const lookup=await get('https://api.agentbets.ai/api/listings?url='+encodeURIComponent('https://delta-witness-api.ruphussten.workers.dev'));
            const invalid=await get('https://api.agentbets.ai/api/listings',{method:'POST',headers:{'content-type':'application/json'},body:'{}'});
            const start=spec.text.indexOf('/api/listings');
            const out={spec_http:spec.status,list_http:lookup.status,invalid_post_http:invalid.status,existing_lookup:lookup.text.slice(0,12000),invalid_post_response:invalid.text.slice(0,12000),openapi_listing_excerpt:start>=0?spec.text.slice(start,start+9000):''};
            fs.writeFileSync('/tmp/agentbets-inspect.json',JSON.stringify(out,null,2));
          })().catch(e=>{fs.writeFileSync('/tmp/agentbets-inspect.json',JSON.stringify({error:String(e)},null,2));process.exitCode=1});
          NODE
      - name: Submit DELTA to Agents.NET if absent and pricing gate is verified
        if: always()
        continue-on-error: true
        run: |
          node <<'NODE'
          const fs=require('fs');
          (async()=>{
            const sleep=ms=>new Promise(r=>setTimeout(r,ms));
            const pricing=JSON.parse(fs.readFileSync('/tmp/pricing.json','utf8'));
            const expected={capture:'1000000',preflight:'5000000','guarded-action-pilot':'10000000'};
            const gate=pricing?.ok===true && pricing.products?.every(p=>p.status==='verified' && p.raw_usdc===expected[p.product] && String(p.pay_to).toLowerCase()==='0x1990e21bc219696ff7fbc26527dbaed335ac6367' && p.network==='eip155:8453' && String(p.asset).toLowerCase()==='0x833589fcd6edb6e08f4c7c32d4f71b54bda02913');
            async function request(url,init={}){
              let last;
              for(let attempt=1;attempt<=3;attempt++){
                try{
                  const r=await fetch(url,{...init,headers:{'accept':'application/json','user-agent':'DELTA-Distribution/1.0',...(init.headers||{})},signal:AbortSignal.timeout(15000)});
                  const text=await r.text();
                  if([429,500,502,503,504].includes(r.status)) throw new Error(`temporary_http_${r.status}`);
                  return {ok:r.ok,status:r.status,text,attempt};
                }catch(e){last=e instanceof Error?e.message:String(e);if(attempt<3)await sleep(1000*2**(attempt-1));}
              }
              return {ok:false,status:null,text:'',error:last};
            }
            const search=await request('https://agents.net/api/agents?search='+encodeURIComponent('DELTA Witness')+'&limit=100');
            let searchBody={}; try{searchBody=JSON.parse(search.text||'{}')}catch{}
            const agents=Array.isArray(searchBody.agents)?searchBody.agents:[];
            const host='delta-witness-api.ruphussten.workers.dev';
            const existing=agents.find(a=>String(a.name||'').toLowerCase()==='delta witness' || String(a.apiEndpoint||'').toLowerCase().includes(host));
            let result={channel:'agents.net',pricing_gate:gate,search_http:search.status,existing:existing||null,listing_status:existing?'present_existing_canonical':'absent',write_attempted:false};
            if(!existing && gate && search.ok){
              const payload={
                name:'DELTA Witness',
                description:'Production trust layer for autonomous actions: timestamped public page-state evidence plus deterministic preflight verification before consequential agent actions. x402 v2 on Base; Capture 1 USDC, Public Preflight 5 USDC, Guarded-Action Pilot 10 USDC.',
                category:'Engineering',
                contactEmail:'ruphussten85@gmail.com',
                apiEndpoint:'https://delta-witness-api.ruphussten.workers.dev',
                platform:'Custom'
              };
              const post=await request('https://agents.net/api/agents/submit',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload)});
              let body={}; try{body=JSON.parse(post.text||'{}')}catch{body={raw:post.text}}
              result={...result,write_attempted:true,submission_http:post.status,submission_response:body,listing_status:post.status===201?'submitted_pending_review':post.status===409?'existing_conflict_no_duplicate':'submission_degraded_or_rejected'};
            } else if(!gate){
              result.blocked_reason='pricing_integrity_gate_not_verified';
            } else if(!search.ok){
              result.blocked_reason='dedup_search_degraded';
            }
            fs.writeFileSync('/tmp/agentsnet.json',JSON.stringify(result,null,2));
            console.log(JSON.stringify(result,null,2));
          })().catch(e=>{fs.writeFileSync('/tmp/agentsnet.json',JSON.stringify({channel:'agents.net',listing_status:'degraded_recoverable',error:String(e)},null,2));process.exitCode=1});
          NODE
      - name: Assemble one-shot evidence
        if: always()
        run: |
          node <<'NODE'
          const fs = require('fs');
          const read = (p) => {
            try { const t=fs.readFileSync(p,'utf8').trim(); try{return JSON.parse(t)}catch{return {raw:t}} } catch(e) { return {missing:true,error:e.message} }
          };
          const out = {
            checked_at: new Date().toISOString(),
            run_kind: 'automation_turn4_one_shot',
            pricing: read('/tmp/pricing.json'),
            funnel: read('/tmp/funnel.json'),
            treasury: read('/tmp/treasury.json'),
            agentpact: read('/tmp/agentpact.json'),
            agentexchange: read('/tmp/agentexchange.json'),
            payan: read('/tmp/payan.json'),
            discovery: read('/tmp/discovery.json'),
            agentbets_inspect: read('/tmp/agentbets-inspect.json'),
            agents_net: read('/tmp/agentsnet.json'),
            financial_action_taken: false,
            outreach_sent: false
          };
          fs.mkdirSync('docs/evidence',{recursive:true});
          fs.writeFileSync('docs/evidence/2026-09-13T1838-kst-automation-turn4.json', JSON.stringify(out,null,2)+'\n');
          NODE
      - name: Commit evidence only
        if: always()
        run: |
          git config user.name 'delta-automation'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/evidence/2026-09-13T1838-kst-automation-turn4.json
          if ! git diff --cached --quiet; then
            git commit -m 'docs: record automation turn4 reconciliation evidence'
            git push
          fi
