name: TMP DELTA A2ARegistry submission 20260911

on:
  push:
    branches: [master]
    paths: ['.github/workflows/tmp-a2aregistry-submit-20260911.yml']

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DELTA_PARTNER_GATEWAY_SECRET: ${{ secrets.DELTA_PARTNER_GATEWAY_SECRET }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - name: Verify owner pricing and live production before directory write
        run: |
          set -euo pipefail
          node scripts/check-owner-pricing.mjs
          node scripts/verify-owner-pricing-live.mjs
          curl --fail --retry 3 --retry-all-errors --retry-delay 2 https://delta-witness-api.ruphussten.workers.dev/.well-known/agent.json -o /tmp/delta-agent.json
          jq -e 'type=="object"' /tmp/delta-agent.json >/dev/null
      - name: Check canonical A2A Registry for existing DELTA record
        id: dedupe
        shell: bash
        run: |
          set -euo pipefail
          api='https://a2aregistry.org/api/agents'
          code=000
          : >/tmp/a2a-before.json
          for i in 1 2 3; do
            code=$(curl --connect-timeout 10 --max-time 30 -sS -o /tmp/a2a-before.json -w '%{http_code}' "$api?search=DELTA%20Witness&limit=100") || code=000
            case "$code" in 200) break;; 429|500|502|503|504|000) sleep $((i*2));; *) break;; esac
          done
          echo "A2AREGISTRY read_http=$code"
          test "$code" = 200
          if jq -e '.. | objects | select((((.name? // "") + " " + (.description? // "") + " " + (.wellKnownURI? // .well_known_uri? // "")) | ascii_downcase | contains("delta witness")) or ((.wellKnownURI? // .well_known_uri? // "") | contains("delta-witness-api.ruphussten.workers.dev")))' /tmp/a2a-before.json >/dev/null 2>&1; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
            echo 'A2AREGISTRY listing_status=already_present duplicate_write_prevented=true'
            jq -c '.. | objects | select((((.name? // "") + " " + (.description? // "") + " " + (.wellKnownURI? // .well_known_uri? // "")) | ascii_downcase | contains("delta witness")) or ((.wellKnownURI? // .well_known_uri? // "") | contains("delta-witness-api.ruphussten.workers.dev"))) | {id,name,description,wellKnownURI,conformance,status,health}' /tmp/a2a-before.json | head -10
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
            echo 'A2AREGISTRY listing_status=not_present'
          fi
      - name: Submit canonical live DELTA manifest
        if: steps.dedupe.outputs.exists == 'false'
        shell: bash
        run: |
          set -euo pipefail
          endpoint='https://a2aregistry.org/api/agents/register'
          payload='{"wellKnownURI":"https://delta-witness-api.ruphussten.workers.dev/.well-known/agent.json"}'
          code=000
          : >/tmp/a2a-submit.json
          for i in 1 2 3; do
            code=$(curl --connect-timeout 10 --max-time 30 -sS -o /tmp/a2a-submit.json -w '%{http_code}' -X POST "$endpoint" -H 'content-type: application/json' --data "$payload") || code=000
            echo "A2AREGISTRY submit_attempt=$i http=$code body=$(jq -c . /tmp/a2a-submit.json 2>/dev/null || head -c 500 /tmp/a2a-submit.json)"
            case "$code" in 200|201|202|409) break;; 429|500|502|503|504|000) sleep $((i*3));; *) break;; esac
          done
          case "$code" in 200|201|202|409) ;; *) exit 1;; esac
      - name: Public readback without resubmission
        if: always()
        shell: bash
        run: |
          set -u
          visible=0
          for delay in 0 3 8; do
            sleep "$delay"
            code=$(curl --connect-timeout 10 --max-time 30 -sS -o /tmp/a2a-after.json -w '%{http_code}' 'https://a2aregistry.org/api/agents?search=DELTA%20Witness&limit=100') || code=000
            if [ "$code" = 200 ] && jq -e '.. | objects | select((((.name? // "") + " " + (.description? // "") + " " + (.wellKnownURI? // .well_known_uri? // "")) | ascii_downcase | contains("delta witness")) or ((.wellKnownURI? // .well_known_uri? // "") | contains("delta-witness-api.ruphussten.workers.dev")))' /tmp/a2a-after.json >/dev/null 2>&1; then
              visible=1
              break
            fi
          done
          echo "A2AREGISTRY public_visible=$visible read_http=$code"
          if [ "$visible" = 1 ]; then
            jq -c '.. | objects | select((((.name? // "") + " " + (.description? // "") + " " + (.wellKnownURI? // .well_known_uri? // "")) | ascii_downcase | contains("delta witness")) or ((.wellKnownURI? // .well_known_uri? // "") | contains("delta-witness-api.ruphussten.workers.dev"))) | {id,name,description,wellKnownURI,conformance,status,health,task_verified,registered_at,updated_at}' /tmp/a2a-after.json | head -10
          fi
          test "$visible" = 1
      - name: Reconcile Base Treasury independently
        if: always()
        continue-on-error: true
        run: node scripts/reconcile-treasury.mjs
