name: DELTA Turn 6 Payan Receipt Recovery

on:
  push:
    paths:
      - '.github/workflows/_temp_growth_turn6_payan_receipt_recovery_20260909.yml'

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Recover known bid settlement and request state
        shell: bash
        run: |
          set +e
          PAYAN='https://payanagent.com'
          RID='ks76vc9pzpz3qfgf8aawjckn5n8bezhf'
          BID='jd79ndx8s7y59tkcvjbars0vf18e33z9'
          rcode=$(curl --retry 4 --retry-delay 2 --retry-all-errors -sS --max-time 35 -o /tmp/receipts.json -w '%{http_code}' "$PAYAN/api/v1/receipts?limit=300" || true)
          echo "PAYAN_RECEIPTS_HTTP=$rcode"
          if [ "$rcode" = 200 ]; then
            jq --arg rid "$RID" --arg bid "$BID" '[.. | objects | select(((.bidId // .bid_id // "") == $bid) or ((.requestId // .request_id // "") == $rid)) | {id:(._id // .id // .receiptId),bidId:(.bidId // .bid_id),requestId:(.requestId // .request_id),status,amountCents,txHash:(.txHash // .transactionHash),createdAt,updatedAt}] | unique_by(.id // .txHash)' /tmp/receipts.json
          else
            head -c 4000 /tmp/receipts.json; echo
          fi
          echo '=== REQUEST_LIST_FALLBACK ==='
          qcode=$(curl --retry 4 --retry-delay 2 --retry-all-errors -sS --max-time 35 -o /tmp/requests.json -w '%{http_code}' "$PAYAN/api/v1/requests?limit=300" || true)
          echo "PAYAN_REQUESTS_HTTP=$qcode"
          if [ "$qcode" = 200 ]; then
            jq --arg rid "$RID" '[.requests // .items // .data // [] | .[] | select((._id // .id) == $rid) | {id:(._id // .id),title,status,budgetMaxCents,escrow,escrowDepositedCents,acceptedBidId,providerId,bidCount,updatedAt}]' /tmp/requests.json
          else
            head -c 4000 /tmp/requests.json; echo
          fi
          exit 0
