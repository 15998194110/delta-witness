name: DELTA one-shot growth audit 20260912-1137

on:
  push:
    paths:
      - '.github/workflows/temp-growth-audit-20260912-1137.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Verify current owner pricing policy
        shell: bash
        run: |
          set +e
          node scripts/check-owner-pricing.mjs > /tmp/pricing-policy.txt 2>&1
          echo $? > /tmp/pricing-policy.exit
          cat /tmp/pricing-policy.txt
          exit 0

      - name: Verify live public x402 pricing
        if: always()
        shell: bash
        run: |
          set +e
          node scripts/verify-owner-pricing-live.mjs > /tmp/live-pricing.txt 2>&1
          echo $? > /tmp/live-pricing.exit
          cat /tmp/live-pricing.txt
          exit 0

      - name: Audit paid funnel
        if: always()
        shell: bash
        run: |
          set +e
          node scripts/query-revenue-candidates.mjs > /tmp/revenue.txt 2>&1
          echo $? > /tmp/revenue.exit
          cat /tmp/revenue.txt
          exit 0

      - name: Reconcile Base Treasury
        if: always()
        shell: bash
        run: |
          set +e
          node scripts/reconcile-treasury.mjs > /tmp/treasury.txt 2>&1
          echo $? > /tmp/treasury.exit
          cat /tmp/treasury.txt
          exit 0

      - name: Scan PayanAgent funded demand
        if: always()
        shell: bash
        run: |
          set +e
          node scripts/scan-payan-demand.mjs > /tmp/payan.txt 2>&1
          echo $? > /tmp/payan.exit
          cat /tmp/payan.txt
          exit 0

      - name: Check Bazaar visibility
        if: always()
        shell: bash
        run: |
          set +e
          node scripts/check-bazaar.mjs > /tmp/bazaar.txt 2>&1
          echo $? > /tmp/bazaar.exit
          cat /tmp/bazaar.txt
          exit 0

      - name: Record machine-readable audit evidence
        if: always()
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const names = ['pricing-policy','live-pricing','revenue','treasury','payan','bazaar'];
          const results = {};
          for (const name of names) {
            const outPath = `/tmp/${name}.txt`;
            const exitPath = `/tmp/${name}.exit`;
            results[name] = {
              exit_code: fs.existsSync(exitPath) ? Number(fs.readFileSync(exitPath, 'utf8').trim()) : null,
              output: fs.existsSync(outPath) ? fs.readFileSync(outPath, 'utf8') : null,
            };
          }
          const evidence = {
            checked_at: new Date().toISOString(),
            run_kind: 'one_shot_read_only_growth_audit',
            source_sha: process.env.GITHUB_SHA,
            pricing_expected_raw: ['1000000','5000000','10000000'],
            treasury: '0x1990e21bc219696ff7fbc26527dbaed335ac6367',
            results,
          };
          fs.writeFileSync('distribution/evidence/growth-run-20260912-1137-kst-raw.json', JSON.stringify(evidence, null, 2));
          NODE

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add distribution/evidence/growth-run-20260912-1137-kst-raw.json
          git commit -m "chore: record DELTA growth audit 2026-09-12 11:37 KST"
          for attempt in 1 2 3; do
            git pull --rebase origin master || true
            if git push origin HEAD:master; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1
