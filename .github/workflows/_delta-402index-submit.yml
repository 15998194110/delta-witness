name: DELTA 402 Index Submit
on:
  push:
    paths:
      - '.github/workflows/_delta-402index-submit.yml'
permissions:
  contents: write
jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Register DELTA x402 endpoints with bounded retries
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          import {writeFile} from 'node:fs/promises';
          const base='https://delta-witness-api.ruphussten.workers.dev';
          const services=[
            {url:`${base}/v1/capture`,name:'DELTA Witness Capture',protocol:'x402',http_method:'POST',probe_body:JSON.stringify({url:'https://example.com'}),description:'Tamper-evident page-state capture and proof for autonomous agents.',price_usd:0.03,payment_asset:'USDC',payment_network:'Base',category:'ai-agents',provider:'DELTA Witness'},
            {url:`${base}/v1/preflight`,name:'DELTA Witness Preflight',protocol:'x402',http_method:'POST',probe_body:JSON.stringify({url:'https://example.com',expected:{contains:['Example Domain']}}),description:'Preflight verification of page state and expected conditions before an agent takes action.',price_usd:0.03,payment_asset:'USDC',payment_network:'Base',category:'ai-agents',provider:'DELTA Witness'},
            {url:`${base}/v1/guarded-action-pilot`,name:'DELTA Witness Guarded Action Pilot',protocol:'x402',http_method:'POST',probe_body:JSON.stringify({}),description:'Higher-value guarded-action pilot for agent workflows requiring evidence-backed execution safety.',price_usd:10,payment_asset:'USDC',payment_network:'Base',category:'ai-agents',provider:'DELTA Witness'}
          ];
          async function submit(s){
            let last;
            for(let i=0;i<4;i++){
              try{
                const r=await fetch('https://402index.io/api/v1/register',{method:'POST',headers:{'content-type':'application/json','user-agent':'DELTA-Witness/0.7.0'},body:JSON.stringify(s)});
                const text=await r.text();
                let body; try{body=JSON.parse(text)}catch{body={raw:text}}
                if(r.status===201 || r.status===400 || r.status===409 || r.status===422) return {http_status:r.status,body};
                last={http_status:r.status,body};
              }catch(e){last={error:String(e)}}
              await new Promise(r=>setTimeout(r,600*(2**i)));
            }
            return {failed_after_retries:true,last};
          }
          const results=[];
          for(const service of services) results.push({service, ...(await submit(service))});
          const out={generated_at:new Date().toISOString(),target:'402index.io',results};
          await writeFile('docs/402index-registration-last.json',JSON.stringify(out,null,2)+'\n');
          console.log(JSON.stringify(out));
          NODE
      - name: Commit registration evidence
        run: |
          git config user.name 'delta-autonomous-growth'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/402index-registration-last.json
          git commit -m 'chore: record 402 Index registration result' || exit 0
          git push
