name: TMP x402Scout DELTA registration 20260910 2231

on:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/tmp-x402scout-register-20260910-2231.yml"

permissions:
  contents: read

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Enforce current owner pricing before external write
        run: |
          node scripts/check-owner-pricing.mjs
          node scripts/verify-owner-pricing-live.mjs
      - name: Register only missing canonical DELTA endpoints in x402Scout
        shell: bash
        run: |
          set -euo pipefail
          CATALOG='https://x402scout.com/.well-known/x402-discovery'
          REGISTER='https://x402scout.com/register'
          curl_retry() {
            local out="$1"; shift
            local code=000
            for i in 1 2 3 4; do
              code=$(curl --connect-timeout 10 --max-time 45 -sS -o "$out" -w '%{http_code}' "$@") || code=000
              echo "attempt=$i http=$code"
              case "$code" in
                200|201|202|204) return 0 ;;
                409|422) return 0 ;;
                429|500|502|503|504|000) sleep $((i*3)) ;;
                *) return 1 ;;
              esac
            done
            return 1
          }

          : >/tmp/scout-catalog.json
          if ! curl_retry /tmp/scout-catalog.json "$CATALOG"; then
            echo 'x402Scout catalog fetch degraded; registration calls will rely on server-side URL dedupe.'
            : >/tmp/scout-catalog.json
          fi

          submit() {
            local name="$1" url="$2" price="$3" category="$4" description="$5"
            if grep -Fq "$url" /tmp/scout-catalog.json 2>/dev/null; then
              echo "X402SCOUT existing=true endpoint=$url action=skip_duplicate"
              return 0
            fi
            payload=$(jq -nc \
              --arg name "$name" \
              --arg url "$url" \
              --argjson price "$price" \
              --arg category "$category" \
              --arg description "$description" \
              '{name:$name,url:$url,price_usd:$price,category:$category,description:$description,network:"base-mainnet"}')
            : >/tmp/scout-register.json
            if ! curl_retry /tmp/scout-register.json -X POST "$REGISTER" -H 'content-type: application/json' --data "$payload"; then
              echo "X402SCOUT endpoint=$url channel=degraded recoverable=true body=$(cat /tmp/scout-register.json 2>/dev/null || true)"
              return 0
            fi
            echo "X402SCOUT endpoint=$url price=$price response=$(cat /tmp/scout-register.json)"
          }

          submit 'DELTA Witness Capture' 'https://delta-witness-api.ruphussten.workers.dev/v1/capture' 1 'developer-tools' 'Timestamped public-web evidence capture for autonomous agents, paid with x402 USDC on Base.'
          submit 'DELTA Witness Preflight' 'https://delta-witness-api.ruphussten.workers.dev/v1/preflight' 5 'security' 'Fresh-source deterministic preflight verification before consequential autonomous agent actions.'
          submit 'DELTA Witness Guarded Action Pilot' 'https://delta-witness-api.ruphussten.workers.dev/v1/guarded-action-pilot' 10 'security' 'Production-verified guarded-action evidence pilot for consequential autonomous workflows.'
