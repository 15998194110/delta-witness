name: DELTA Payan Target Temp

on:
  push:
    paths:
      - '.github/workflows/_temp_growth_turn6_payan_target_20260908.yml'

permissions:
  contents: read
  actions: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify repository secret persistence capability
        shell: bash
        run: |
          set -euo pipefail
          secret_value="probe-$(date +%s)-$RANDOM"
          if printf '%s' "$secret_value" | gh secret set DELTA_TEMP_SECRET_WRITE_TEST --repo "$GITHUB_REPOSITORY" >/tmp/secret-set.out 2>/tmp/secret-set.err; then
            echo 'SECRET_WRITE_CAPABLE=true'
            gh secret delete DELTA_TEMP_SECRET_WRITE_TEST --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || true
          else
            echo 'SECRET_WRITE_CAPABLE=false'
            sed -E 's/[A-Za-z0-9_=-]{20,}/[redacted]/g' /tmp/secret-set.err | head -10
          fi
          unset secret_value

      - name: Inspect exact funded Payan request candidates
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 4 --retry-delay 2 --retry-all-errors -fsS --max-time 30 'https://payanagent.com/api/v1/requests?status=open&limit=100' >/tmp/requests.json
          jq -c '(.requests // .items // .data // [])[] | select((.title // "") == "Build a catalog endpoint-health checker (find dead ecosystem sellers)" or (.title // "") == "Test a historical web verification API on a real task" or (.title // "") == "Working example: an agent that discovers + buys via the PayanAgent MCP")' /tmp/requests.json
