name: DELTA Reconcile Temp
on:
  push:
    paths:
      - '.github/workflows/_temp_growth_reconcile_20260908.yml'

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Reconcile telemetry and canonical Base USDC
        shell: bash
        run: |
          set -euo pipefail
          DB='c9431b00-27c5-4609-9f3d-6af20cb162df'
          TREASURY='0x1990e21bc219696ff7fbc26527dbaed335ac6367'
          USDC='0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913'
          FIRST_BLOCK=50985188
          RPC='https://mainnet.base.org'

          echo '=== D1_TELEMETRY_SINCE_FIRST_STRANGER ==='
          SQL="SELECT id,created_at,event,route,channel,partner,success,reason,gross_usd,browser_ms,storage_bytes,variable_cost_usd,contribution_margin_usd FROM telemetry_events WHERE created_at > '2026-09-07 05:43:13' ORDER BY id ASC"
          jq -n --arg sql "$SQL" '{sql:$sql}' >/tmp/query.json
          curl --retry 4 --retry-delay 2 --retry-all-errors -fsS --max-time 30 -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DB}/query" \
            -H "authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'content-type: application/json' \
            --data-binary @/tmp/query.json >/tmp/d1.json
          jq '{success,errors,rows:[.result[]?.results[]? | select(.event=="payment_verified" or .event=="capture_completed" or .event=="proof_opened" or .event=="qualified_request" or .event=="payment_required")],paid:[.result[]?.results[]? | select(.event=="payment_verified" or (.event=="capture_completed" and (.gross_usd // 0)>0))]}' /tmp/d1.json

          echo '=== D1_AGGREGATE ==='
          SQL2="SELECT event,route,channel,partner,success,COUNT(*) rows,SUM(gross_usd) gross_usd,SUM(variable_cost_usd) variable_cost_usd,SUM(contribution_margin_usd) contribution_margin_usd,MAX(created_at) latest FROM telemetry_events WHERE created_at > '2026-09-07 05:43:13' GROUP BY event,route,channel,partner,success ORDER BY latest DESC"
          jq -n --arg sql "$SQL2" '{sql:$sql}' >/tmp/query2.json
          curl --retry 4 --retry-delay 2 --retry-all-errors -fsS --max-time 30 -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DB}/query" \
            -H "authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'content-type: application/json' \
            --data-binary @/tmp/query2.json | jq '{success,errors,groups:[.result[]?.results[]?]}'

          echo '=== BASE_RPC_HEAD ==='
          rpc() { curl --retry 4 --retry-delay 2 --retry-all-errors -fsS --max-time 30 -H 'content-type: application/json' --data-binary "$1" "$RPC"; }
          head_hex=$(rpc '{"jsonrpc":"2.0","id":1,"method":"eth_blockNumber","params":[]}' | jq -r '.result')
          head_dec=$((16#${head_hex#0x}))
          echo "BASE_HEAD=$head_dec"

          TRANSFER_TOPIC='0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef'
          TO_TOPIC=$(printf '0x%064s' "${TREASURY#0x}" | tr ' ' '0')
          : >/tmp/logs.ndjson
          start=$((FIRST_BLOCK+1))
          chunk=2000
          while [ "$start" -le "$head_dec" ]; do
            end=$((start+chunk-1)); [ "$end" -gt "$head_dec" ] && end=$head_dec
            from_hex=$(printf '0x%x' "$start"); to_hex=$(printf '0x%x' "$end")
            payload=$(jq -nc --arg addr "$USDC" --arg from "$from_hex" --arg to "$to_hex" --arg t0 "$TRANSFER_TOPIC" --arg t2 "$TO_TOPIC" '{jsonrpc:"2.0",id:1,method:"eth_getLogs",params:[{address:$addr,fromBlock:$from,toBlock:$to,topics:[$t0,null,$t2]}]}')
            out=$(rpc "$payload" || true)
            if [ -n "$out" ] && [ "$(jq -r '.error // empty' <<<"$out")" = "" ]; then
              jq -c '.result[]?' <<<"$out" >>/tmp/logs.ndjson
            else
              echo "RPC_LOG_RANGE_DEGRADED from=$start to=$end error=$(jq -c '.error // "transport"' <<<"${out:-{}}" 2>/dev/null || echo transport)"
            fi
            start=$((end+1))
          done
          echo '=== CANONICAL_USDC_INCOMING_AFTER_FIRST ==='
          if [ -s /tmp/logs.ndjson ]; then
            jq -s '[.[] | {blockNumber:(.blockNumber|tonumber? // .blockNumber),transactionHash,logIndex,data,from_topic:.topics[1],to_topic:.topics[2],amount_raw:(.data|ltrimstr("0x")| if .=="" then "0" else . end)}]' /tmp/logs.ndjson
          else
            echo '[]'
          fi

          echo '=== USDC_BALANCE_RAW ==='
          selector='70a08231'
          arg=$(printf '%064s' "${TREASURY#0x}" | tr ' ' '0')
          call_data="0x${selector}${arg}"
          payload=$(jq -nc --arg to "$USDC" --arg data "$call_data" '{jsonrpc:"2.0",id:1,method:"eth_call",params:[{to:$to,data:$data},"latest"]}')
          rpc "$payload" | jq '{result,error}'
