name: DELTA Official MCP Registry Distribution
on:
  push:
    branches: [master]
    paths: ['.github/workflows/autonomous-growth-mcp-registry.yml']
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - name: Render registry metadata
        run: node scripts/render-mcp-server.mjs
      - name: Verify the referenced npm package exists
        id: package
        shell: bash
        run: |
          set -euo pipefail
          NAME=$(node -p "require('./server.json').packages[0].identifier")
          VERSION=$(node -p "require('./server.json').packages[0].version")
          if npm view "$NAME@$VERSION" version --json > /tmp/npm-version.json 2>/tmp/npm-version.err; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "DELTA_MCP_NPM=$(cat /tmp/npm-version.json)"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "DELTA_MCP_NPM_MISSING=$NAME@$VERSION"
            cat /tmp/npm-version.err
          fi
      - name: Install current mcp-publisher and validate metadata
        if: steps.package.outputs.exists == 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-all-errors --retry-delay 2 "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          ./mcp-publisher --version
          ./mcp-publisher validate server.json
      - name: Authenticate namespace with bounded retry
        if: steps.package.outputs.exists == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in 1 2 3 4; do
            if ./mcp-publisher login github-oidc; then ok=1; break; fi
            echo "OIDC login attempt $attempt/4 degraded; retrying" >&2
            sleep $((attempt * 3))
          done
          test "$ok" = 1
      - name: Publish directly with bounded retry
        if: steps.package.outputs.exists == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in 1 2 3 4; do
            set +e
            out=$(./mcp-publisher publish server.json 2>&1)
            code=$?
            set -e
            printf '%s\n' "$out"
            if [ "$code" -eq 0 ]; then ok=1; break; fi
            if grep -qi 'cannot publish duplicate version' <<<"$out"; then
              echo 'DELTA_MCP_PUBLISH_DUPLICATE_IDEMPOTENT=1'
              ok=1; break
            fi
            echo "Registry publish attempt $attempt/4 degraded; retrying" >&2
            sleep $((attempt * 3))
          done
          test "$ok" = 1
      - name: Verify public registry readback independently
        if: steps.package.outputs.exists == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if node scripts/check-mcp-registry.mjs server.json; then
            echo 'DELTA_MCP_REGISTRY_VERIFIED=1'
          else
            echo 'DELTA_MCP_REGISTRY_READBACK_DEGRADED=1' >&2
            exit 1
          fi