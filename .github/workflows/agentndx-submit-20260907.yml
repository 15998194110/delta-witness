name: DELTA AgentNDX submission 20260907

on:
  push:
    paths:
      - '.github/workflows/agentndx-submit-20260907.yml'

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Submit DELTA to AgentNDX free review
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://agentndx.ai'
          cookie=/tmp/cookies.txt
          curl -fsSL --retry 3 --retry-all-errors -c "$cookie" "$BASE/submit/" -o /tmp/form.html
          code=$(curl -sS -b "$cookie" -c "$cookie" --max-time 30 -D /tmp/headers.txt -o /tmp/body.html -w '%{http_code}' \
            -X POST "$BASE/api/submit" \
            --data-urlencode 'name=DELTA Witness MCP' \
            --data-urlencode 'github_url=https://github.com/15998194110/delta-witness' \
            --data-urlencode 'homepage_url=https://delta-witness-api.ruphussten.workers.dev/docs' \
            --data-urlencode 'protocols=MCP' \
            --data-urlencode 'protocols=x402' \
            --data-urlencode 'description=Independent page-state evidence and deterministic preflight verification for consequential autonomous agent actions.' \
            --data-urlencode 'contact=ruphussten@163.com')
          echo "AGENTNDX_SUBMIT_HTTP=$code"
          sed -n '1,30p' /tmp/headers.txt
          python3 - <<'PY'
          from pathlib import Path
          s=Path('/tmp/body.html').read_text(errors='replace')
          print('BODY_PREVIEW='+s[:2000].replace('\n',' '))
          PY
          case "$code" in
            200|201|202|302|303) ;;
            *) exit 1 ;;
          esac
          location=$(awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/\r$/,""); print $2}' /tmp/headers.txt | tail -1)
          echo "AGENTNDX_LOCATION=${location:-none}"
          if [ -n "${location:-}" ]; then
            case "$location" in
              http*) target="$location" ;;
              *) target="$BASE$location" ;;
            esac
            curl -fsSL --retry 3 --retry-all-errors "$target" -o /tmp/result.html
            grep -Eio 'submitted|review|success|thank[^<]{0,80}' /tmp/result.html | head -20 || true
          fi
