name: TEMP DELTA run10 sprint reconcile 0652
on:
  push:
    branches: [master]
    paths: [.github/workflows/tmp-run10-sprint-reconcile-20260917-0652.yml]
permissions:
  contents: read
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DELTA_PARTNER_SECRET: ${{ secrets.DELTA_PARTNER_SECRET }}
    steps:
      - uses: actions/checkout@v6
        with: {persist-credentials: false}
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - name: Fresh paid-funnel audit
        run: node scripts/query-revenue-candidates.mjs | tee /tmp/delta-revenue-candidates.json
      - name: Extend canonical Base USDC Treasury coverage beyond full active sprint age
        env:
          DELTA_TREASURY_LOOKBACK_BLOCKS: '140000'
          DELTA_TREASURY_CHUNK_BLOCKS: '1900'
        run: node scripts/reconcile-treasury.mjs | tee /tmp/delta-treasury.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: delta-run10-sprint-reconcile-${{ github.run_id }}
          path: |
            /tmp/delta-revenue-candidates.json
            /tmp/delta-treasury.json
          retention-days: 7
