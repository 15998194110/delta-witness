name: DELTA Payan Receipt Temp

on:
  push:
    paths:
      - '.github/workflows/_temp_growth_turn6_receipt_20260908.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify Payan escrow receipt and Base transaction
        shell: bash
        run: |
          set -euo pipefail
          RID='kn76vdyp5sb7kk2bqs130mhrx98bf90e'
          curl --retry 4 --retry-delay 2 --retry-all-errors -fsS --max-time 30 "https://payanagent.com/api/v1/receipts/$RID" >/tmp/r.json
          echo 'PAYAN_RECEIPT_BEGIN'
          jq -c . /tmp/r.json
          echo 'PAYAN_RECEIPT_END'
          TX=$(jq -r '.txHash // .transactionHash // .tx_hash // .transaction_hash // .settlementTxHash // empty' /tmp/r.json)
          echo "RECEIPT_TX=$TX"
          if [ -n "$TX" ]; then
            python - "$TX" <<'PY'
          import json, sys, urllib.request, time
          tx=sys.argv[1]
          rpc='https://mainnet.base.org'
          def call(method, params):
              p=json.dumps({'jsonrpc':'2.0','id':1,'method':method,'params':params}).encode()
              last=None
              for i in range(5):
                  try:
                      q=urllib.request.Request(rpc,data=p,headers={'content-type':'application/json','user-agent':'delta-growth-audit/1'})
                      with urllib.request.urlopen(q,timeout=30) as r: o=json.load(r)
                      if o.get('error'): raise RuntimeError(o['error'])
                      return o['result']
                  except Exception as e:
                      last=e; time.sleep(min(2**i,8))
              raise last
          t=call('eth_getTransactionByHash',[tx])
          r=call('eth_getTransactionReceipt',[tx])
          print('BASE_TX',json.dumps({'hash':t.get('hash') if t else None,'from':t.get('from') if t else None,'to':t.get('to') if t else None,'value':t.get('value') if t else None,'status':int(r['status'],16) if r else None,'blockNumber':int(r['blockNumber'],16) if r else None,'logs':len(r.get('logs',[])) if r else None},separators=(',',':')))
          if r:
              usdc='0x833589fcd6edb6e08f4c7c32d4f71b54bda02913'
              transfer='0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef'
              xs=[]
              for l in r.get('logs',[]):
                  if l.get('address','').lower()==usdc and l.get('topics',[None])[0].lower()==transfer:
                      xs.append({'from':'0x'+l['topics'][1][-40:],'to':'0x'+l['topics'][2][-40:],'amount_raw':int(l['data'],16)})
              print('BASE_USDC_TRANSFERS',json.dumps(xs,separators=(',',':')))
          PY
          fi
