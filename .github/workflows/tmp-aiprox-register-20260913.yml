name: DELTA one-shot AIProx registration 2026-09-13
on:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/tmp-aiprox-register-20260913.yml"
permissions:
  contents: read
jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - name: Check current owner pricing policy
        run: node scripts/check-owner-pricing.mjs
      - name: Verify current owner live prices without payment
        run: node scripts/verify-owner-pricing-live.mjs
      - name: Duplicate guard and submit canonical DELTA listing
        shell: bash
        run: |
          set -euo pipefail
          API='https://aiprox.dev/api/agents'
          HOST='delta-witness-api.ruphussten.workers.dev'
          curl -fsS --connect-timeout 10 --max-time 30 --retry 3 --retry-all-errors "$API" -o /tmp/aiprox-agents.json
          if node - <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('/tmp/aiprox-agents.json','utf8'));
          const rows=Array.isArray(j)?j:(Array.isArray(j.agents)?j.agents:[]);
          const hit=rows.find(x=>JSON.stringify(x).toLowerCase().includes('delta-witness')||JSON.stringify(x).toLowerCase().includes('delta-witness-api.ruphussten.workers.dev'));
          if(hit){ console.log('AIPROX_DUPLICATE_GUARD existing='+JSON.stringify(hit)); process.exit(0); }
          process.exit(1);
          NODE
          then
            exit 0
          fi
          cat >/tmp/aiprox-register.json <<'JSON'
          {
            "name":"delta-witness",
            "description":"Independent public webpage evidence, cryptographic proof metadata, deterministic preflight verification, and bounded guarded-action evidence for autonomous agents.",
            "capability":"x-web-verification",
            "rail":"x402",
            "endpoint":"https://delta-witness-api.ruphussten.workers.dev/v1/capture",
            "price_per_call":1,
            "price_unit":"usdc",
            "payment_address":"0x1990e21bc219696ff7fbc26527dbaed335ac6367"
          }
          JSON
          HTTP=$(curl -sS --connect-timeout 10 --max-time 30 --retry 3 --retry-all-errors -o /tmp/aiprox-response.json -w '%{http_code}' -X POST "$API/register" -H 'content-type: application/json' --data-binary @/tmp/aiprox-register.json)
          echo "AIPROX_SUBMIT_HTTP=$HTTP"
          cat /tmp/aiprox-response.json
          test "$HTTP" -ge 200 -a "$HTTP" -lt 300
      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aiprox-registration-${{ github.run_id }}
          path: |
            /tmp/aiprox-agents.json
            /tmp/aiprox-register.json
            /tmp/aiprox-response.json
          if-no-files-found: warn
          retention-days: 7
