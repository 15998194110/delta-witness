name: TMP Aegis DELTA submission 20260911

on:
  push:
    branches: ["master"]
    paths:
      - '.github/workflows/tmp-aegis-submit-20260911.yml'

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - name: Check current owner pricing policy
        run: node scripts/check-owner-pricing.mjs
      - name: Verify live owner pricing before any listing write
        run: node scripts/verify-owner-pricing-live.mjs
      - name: Reconcile Base Treasury independently
        if: always()
        run: node scripts/reconcile-treasury.mjs
      - name: Register canonical DELTA endpoints with Aegis if absent
        if: success()
        shell: bash
        run: |
          set -u
          BASE='https://delta-witness-api.ruphussten.workers.dev'
          API='https://aegis.borisinc.com'
          submit_one() {
            local path="$1" name="$2" category="$3" price="$4"
            local url="$BASE$path"
            local enc
            enc=$(node -e 'process.stdout.write(encodeURIComponent(process.argv[1]))' "$url")

            # Prefer exact-url discovery before any write. Failure here is recoverable;
            # we still use the canonical submit endpoint, which should de-duplicate by URL.
            found=0
            for q in "$enc" "$(node -e 'process.stdout.write(encodeURIComponent(process.argv[1]))' "$name")"; do
              code=$(curl --connect-timeout 10 --max-time 25 -sS -o /tmp/aegis-search.json -w '%{http_code}' "$API/api/services?search=$q") || code=000
              if [[ "$code" == 200 ]] && grep -Fq "$url" /tmp/aegis-search.json; then
                echo "AEGIS_CURRENT url=$url price=$price"
                found=1
                break
              fi
            done
            if [[ "$found" == 1 ]]; then return 0; fi

            submit_url="$API/submit?url=$enc&name=$(node -e 'process.stdout.write(encodeURIComponent(process.argv[1]))' "$name")&category=$(node -e 'process.stdout.write(encodeURIComponent(process.argv[1]))' "$category")&price_usd=$price"
            code=000
            : >/tmp/aegis-submit.json
            for i in 1 2 3 4; do
              code=$(curl --connect-timeout 10 --max-time 30 -sS -o /tmp/aegis-submit.json -w '%{http_code}' "$submit_url") || code=000
              echo "AEGIS_SUBMIT attempt=$i url=$url http=$code body=$(cat /tmp/aegis-submit.json 2>/dev/null || true)"
              case "$code" in
                200|201|202|204|409) break;;
                429|500|502|503|504|000) sleep $((i*3));;
                *) break;;
              esac
            done
            case "$code" in
              200|201|202|204|409) ;;
              *) echo "AEGIS_DEGRADED url=$url http=$code recoverable=true"; return 0;;
            esac

            # Read back; catalog indexing may lag, which is not a mission failure.
            code=$(curl --connect-timeout 10 --max-time 25 -sS -o /tmp/aegis-readback.json -w '%{http_code}' "$API/api/services?search=$enc") || code=000
            if [[ "$code" == 200 ]] && grep -Fq "$url" /tmp/aegis-readback.json; then
              echo "AEGIS_LIVE url=$url price=$price"
            else
              echo "AEGIS_ACCEPTED visibility=pending url=$url readback_http=$code"
            fi
          }

          submit_one '/v1/capture' 'DELTA Witness Capture' 'developer-tools' 1
          submit_one '/v1/preflight' 'DELTA Witness Preflight' 'agent-safety' 5
          submit_one '/v1/guarded-action-pilot' 'DELTA Witness Guarded Action Pilot' 'agent-safety' 10

      - name: Check Circle keyless x402 discovery for canonical DELTA URLs
        if: always()
        shell: bash
        run: |
          set -u
          code=$(curl --connect-timeout 10 --max-time 30 -sS -o /tmp/circle.json -w '%{http_code}' 'https://api.circle.com/v2/x402/discovery/resources') || code=000
          if [[ "$code" == 200 ]]; then
            if grep -Fq 'delta-witness-api.ruphussten.workers.dev' /tmp/circle.json; then
              echo 'CIRCLE_DISCOVERY found=true'
            else
              echo 'CIRCLE_DISCOVERY found=false'
            fi
          else
            echo "CIRCLE_DISCOVERY degraded=true http=$code"
          fi
