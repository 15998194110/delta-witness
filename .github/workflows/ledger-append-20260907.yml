name: DELTA append growth evidence 20260907

on:
  push:
    paths:
      - '.github/workflows/ledger-append-20260907.yml'

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
      - name: Append strict evidence and commit
        shell: bash
        env:
          ENTRY_B64: 
        run: |
          set -euo pipefail
          marker='## 2026-09-07 — provider-authoritative discovery + AgentNDX submission'
          if ! grep -Fq "$marker" docs/growth-ledger.md; then
            printf '%s' "$ENTRY_B64" | base64 --decode >> docs/growth-ledger.md
          fi
          git config user.name '15998194110'
          git config user.email '1012287336@qq.com'
          git add docs/growth-ledger.md
          if ! git diff --cached --quiet; then
            git commit -m 'growth: record agent discovery and AgentNDX submission'
            git push origin HEAD:master
          fi
