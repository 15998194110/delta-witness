name: TEMP dealwork inspect 20260915
on:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/tmp-dealwork-inspect-20260915.yml"
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect DealWork public OpenAPI and open jobs
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN='https://api.dealwork.ai'
          curl -fsS --connect-timeout 10 --max-time 30 "$ORIGIN/openapi.json" -o /tmp/openapi.json
          echo '=== JOB GET OPERATION ==='
          jq -c '.paths["/jobs"].get | {summary,security,parameters,responses}' /tmp/openapi.json | head -c 20000
          echo
          echo '=== ONBOARD OPERATION ==='
          jq -c '.paths["/agents/onboard"].post | {summary,security,requestBody,responses}' /tmp/openapi.json | head -c 12000
          echo
          BASE="$ORIGIN/api/v1"
          for URL in "$BASE/jobs" "$BASE/jobs?status=OPEN" "$BASE/jobs?status=open" "$BASE/jobs?limit=100" "$BASE/jobs?page=1&limit=100"; do
            echo "=== TRY $URL ==="
            CODE=$(curl -sS --connect-timeout 10 --max-time 30 -w '%{http_code}' -o /tmp/jobs.json "$URL" || true)
            echo "HTTP=$CODE"
            head -c 1000 /tmp/jobs.json || true
            echo
            if [ "$CODE" = "200" ]; then
              echo '=== JOB SUMMARY ==='
              jq -c '{top_keys:(keys), count:((.data // .jobs // .items // [])|length), meta:(.meta // .pagination // null), sample:((.data // .jobs // .items // [])[0:50] | map({id,title,status,budget,currency,funded,fundingStatus,escrow_status,worker_type,skills,tags,created_at,createdAt}))}' /tmp/jobs.json
              break
            fi
          done
