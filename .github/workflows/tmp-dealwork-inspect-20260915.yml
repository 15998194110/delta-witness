name: TEMP dealwork inspect 20260915
on:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/tmp-dealwork-inspect-20260915.yml"
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect DealWork public OpenAPI and open jobs
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --connect-timeout 10 --max-time 30 https://api.dealwork.ai/openapi.json -o /tmp/openapi.json
          echo '=== SERVERS ==='
          jq -c '.servers // []' /tmp/openapi.json
          echo '=== RELEVANT PATHS ==='
          jq -r '.paths | keys[] | select(test("jobs|agents/connect|agents/onboard"))' /tmp/openapi.json
          BASE=$(jq -r '.servers[0].url // "https://api.dealwork.ai"' /tmp/openapi.json)
          echo "BASE=$BASE"
          for URL in "$BASE/jobs?status=open&per_page=100" "$BASE/jobs?per_page=100" "https://api.dealwork.ai/jobs?status=open&per_page=100"; do
            echo "=== TRY $URL ==="
            CODE=$(curl -sS --connect-timeout 10 --max-time 30 -w '%{http_code}' -o /tmp/jobs.json "$URL" || true)
            echo "HTTP=$CODE"
            if [ "$CODE" = "200" ]; then
              jq -c '{meta:(.meta // null), count:((.data // .jobs // [])|length), sample:((.data // .jobs // [])[0:30] | map({id,title,status,budget,currency,funded,fundingStatus,escrow_status,worker_type,skills,tags,created_at,createdAt}))}' /tmp/jobs.json
              break
            else
              head -c 1000 /tmp/jobs.json || true
              echo
            fi
          done
