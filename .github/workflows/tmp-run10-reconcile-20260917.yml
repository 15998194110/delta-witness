name: TEMP DELTA run10 revenue reconcile
on:
  push:
    branches: [master]
    paths: [.github/workflows/tmp-run10-reconcile-20260917.yml]
permissions:
  contents: read
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DELTA_INDEXNOW_ADMIN_SECRET: ${{ secrets.DELTA_INDEXNOW_ADMIN_SECRET }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DELTA_PARTNER_SECRET: ${{ secrets.DELTA_PARTNER_SECRET }}
      DELTA_TREASURY_LOOKBACK_BLOCKS: '90000'
      DELTA_TREASURY_CHUNK_BLOCKS: '1900'
    steps:
      - uses: actions/checkout@v6
        with: {persist-credentials: false}
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - name: Owner price integrity and live public 402 readback
        run: |
          node scripts/check-owner-pricing.mjs
          node scripts/verify-owner-pricing-live.mjs | tee /tmp/live-pricing.txt
      - name: Paid funnel candidates
        continue-on-error: true
        run: node scripts/query-revenue-candidates.mjs | tee /tmp/revenue-candidates.json
      - name: AgentPact funded demand
        continue-on-error: true
        run: node scripts/scan-agentpact-demand.mjs | tee /tmp/agentpact.json
      - name: Agent Exchange funded demand
        continue-on-error: true
        run: node scripts/scan-agentexchange-demand.mjs | tee /tmp/agentexchange.json
      - name: Additional funded demand
        continue-on-error: true
        run: node scripts/scan-external-funded-demand.mjs | tee /tmp/external-funded.json
      - name: MoltJobs funded demand
        continue-on-error: true
        run: node scripts/scan-moltjobs-demand.mjs | tee /tmp/moltjobs.json
      - name: WorkPnP funded demand
        continue-on-error: true
        run: node scripts/scan-workpnp-demand.mjs | tee /tmp/workpnp.json
      - name: Base Treasury canonical USDC reconciliation
        run: node scripts/reconcile-treasury.mjs | tee /tmp/treasury.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: delta-run10-reconcile-${{ github.run_id }}
          path: |
            /tmp/live-pricing.txt
            /tmp/revenue-candidates.json
            /tmp/agentpact.json
            /tmp/agentexchange.json
            /tmp/external-funded.json
            /tmp/moltjobs.json
            /tmp/workpnp.json
            /tmp/treasury.json
          if-no-files-found: warn
          retention-days: 7
