name: DELTA Growth Turn7 True402 + Reconcile

on:
  push:
    paths:
      - '.github/workflows/_temp_growth_turn7_true402_reconcile_20260909.yml'

permissions:
  contents: read

jobs:
  growth:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Execute free listing, channel checks and strict reconciliation
        shell: bash
        run: |
          set -u
          node <<'NODE'
          const ORIGIN='https://delta-witness-api.ruphussten.workers.dev';
          const TREASURY='0x1990e21bc219696ff7fbc26527dbaed335ac6367';
          const USDC='0x833589fcd6edb6e08f4c7c32d4f71b54bda02913';
          const FACILITATOR='https://facilitator.payai.network';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function req(url,opts={},tries=4){let last;for(let i=0;i<tries;i++){try{const ac=new AbortController();const t=setTimeout(()=>ac.abort(),30000);const r=await fetch(url,{...opts,signal:ac.signal});clearTimeout(t);const text=await r.text();if((r.status===429||r.status>=500)&&i<tries-1){last={status:r.status,text};await sleep(500*2**i);continue}return {status:r.status,text,headers:Object.fromEntries(r.headers)}}catch(e){last={error:String(e)};if(i<tries-1)await sleep(500*2**i)}}return last}
          const parse=t=>{try{return JSON.parse(t)}catch{return null}};
          console.log('=== CORE_402 ===');
          for(const [path,body] of [['/v1/capture',{url:'https://example.com'}],['/v1/preflight',{url:'https://example.com',rules:[]}]]){
            const r=await req(ORIGIN+path,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});
            const j=parse(r.text); console.log(path,JSON.stringify({status:r.status,body:j||r.text.slice(0,1000)}));
          }
          console.log('=== DISCOVERY_DOCS ===');
          for(const path of ['/distribution.json','/.well-known/x402','/openapi.json']){const r=await req(ORIGIN+path);console.log(path,r.status,r.text.slice(0,4000));}

          console.log('=== TRUE402 ===');
          let q=await req('https://true402.dev/api/v1/services?q=delta%20witness&limit=20');
          console.log('SEARCH_BEFORE',q.status,q.text.slice(0,6000));
          const qj=parse(q.text); const rows=qj?.services||qj?.items||qj?.data||[];
          const exists=Array.isArray(rows)&&rows.some(x=>JSON.stringify(x).toLowerCase().includes('delta')||JSON.stringify(x).includes(ORIGIN));
          if(!exists){
            const manifest={x402:'1.0',name:'delta-witness',description:'Trust layer for autonomous actions: capture public web state and run deterministic preflight checks with timestamped proof hashes.',capabilities:['web-state-capture','preflight','evidence','autonomous-action-verification','browser-agent-safety'],pricing:{currency:'USDC',base:'0.03',unit:'request'},payment:{address:TREASURY,chain:'base',facilitator:FACILITATOR},endpoint:ORIGIN+'/v1/capture'};
            const payload={url:ORIGIN,manifest};
            let r=await req('https://true402.dev/api/v1/services/register',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload)});
            console.log('REGISTER',r.status,r.text.slice(0,8000));
            if(r.status===404||r.status===405){
              r=await req('https://true402.dev/api/v1/services',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload)});
              console.log('REGISTER_FALLBACK',r.status,r.text.slice(0,8000));
            }
          } else console.log('REGISTER skipped: DELTA already present');
          q=await req('https://true402.dev/api/v1/services?q=delta%20witness&limit=20'); console.log('SEARCH_AFTER',q.status,q.text.slice(0,8000));

          console.log('=== AGENT402_REFRESH ===');
          const a=await req('https://agent402.tools/api/index/register',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({origin:ORIGIN})}); console.log(a.status,a.text.slice(0,6000));

          console.log('=== PAYAN_FUNDED_REQUESTS ===');
          for(const url of ['https://payanagent.com/api/v1/requests?status=open&limit=100','https://payanagent.com/api/v1/requests?status=open']){const r=await req(url);console.log(url,r.status,r.text.slice(0,12000));if(r.status===200)break;}

          console.log('=== D1_TELEMETRY_24H ===');
          const account=process.env.CLOUDFLARE_ACCOUNT_ID, token=process.env.CLOUDFLARE_API_TOKEN, db='c9431b00-27c5-4609-9f3d-6af20cb162df';
          if(account&&token){
            const sql=`SELECT channel,event,success,sum(event_count) event_count,round(sum(gross_usd),6) gross_usd,round(sum(variable_cost_usd),6) variable_cost_usd,round(sum(contribution_margin_usd),6) contribution_margin_usd,min(created_at) first_at,max(created_at) last_at FROM telemetry_events WHERE created_at>=datetime('now','-1 day') GROUP BY channel,event,success ORDER BY last_at DESC LIMIT 200`;
            const r=await req(`https://api.cloudflare.com/client/v4/accounts/${account}/d1/database/${db}/query`,{method:'POST',headers:{authorization:`Bearer ${token}`,'content-type':'application/json'},body:JSON.stringify({sql})}); console.log(r.status,r.text.slice(0,20000));
          } else console.log('D1 credentials unavailable');

          console.log('=== TREASURY_TAIL ===');
          const rpcs=['https://mainnet.base.org','https://base-rpc.publicnode.com','https://base.llamarpc.com'];
          async function rpc(method,params){let last;for(const url of rpcs){for(let i=0;i<3;i++){try{const r=await req(url,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method,params})},2);const j=parse(r.text);if(r.status===200&&j&&!j.error)return j.result;last=j?.error||r.text}catch(e){last=String(e)}await sleep(300*2**i)}}throw new Error(JSON.stringify(last))}
          const head=parseInt(await rpc('eth_blockNumber',[]),16), start=51086208;
          const topic0='0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef';
          const toTopic='0x'+'0'.repeat(24)+TREASURY.slice(2).toLowerCase(); let logs=[];
          for(let from=start;from<=head;from+=1500){const to=Math.min(head,from+1499);logs.push(...await rpc('eth_getLogs',[{address:USDC,fromBlock:'0x'+from.toString(16),toBlock:'0x'+to.toString(16),topics:[topic0,null,toTopic]}]));}
          const incoming=logs.map(x=>({block:parseInt(x.blockNumber,16),tx:x.transactionHash,amount_usdc:Number(BigInt(x.data))/1e6,from:'0x'+x.topics[1].slice(-40)}));
          console.log(JSON.stringify({start,head,incoming_count:incoming.length,incoming},null,2));
          NODE