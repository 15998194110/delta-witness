# Retry marker: 2026-09-13T10:35+09:00
name: TMP - Agent Bazaar DELTA Capture submission 20260913
on:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/tmp-agent-bazaar-capture-submit-20260913.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Owner pricing gate before price-bearing listing write
        run: |
          test -s AGENTS.md
          test -s docs/pricing-policy-2026-09-10.md
          node scripts/check-owner-pricing.mjs
          node scripts/verify-owner-pricing-live.mjs
      - name: Install browser runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Duplicate check and submit Capture listing
        run: |
          node <<'NODE'
          const { chromium } = await import('playwright');
          const browser=await chromium.launch({headless:true});
          try {
            const market=await browser.newPage();
            await market.goto('https://www.agent-bazaar.com/marketplace',{waitUntil:'networkidle',timeout:60000});
            await market.waitForTimeout(1500);
            const marketText=(await market.locator('body').innerText()).replace(/\s+/g,' ');
            if (/DELTA Witness|delta-witness-api\.ruphussten\.workers\.dev/i.test(marketText)) {
              console.log('AGENT_BAZAAR_ALREADY_PRESENT: duplicate avoided');
              process.exit(0);
            }
            await market.close();

            const page=await browser.newPage();
            await page.goto('https://www.agent-bazaar.com/dev',{waitUntil:'networkidle',timeout:60000});
            const initial=(await page.locator('body').innerText()).replace(/\s+/g,' ');
            if (/captcha|turnstile|connect wallet|wallet signature|sign in required|log in required/i.test(initial)) throw new Error('USER_ACTION_REQUIRED_INTERACTIVE_AUTH');
            if (await page.locator('input[type="checkbox"][required]').count()) throw new Error('USER_ACTION_REQUIRED_LEGAL_ACK');

            const name=page.locator('input[placeholder^="e.g., GPT-4 Code Review API"]').first();
            const selects=page.locator('select');
            const description=page.locator('textarea[placeholder^="Example: Automated sentiment analysis"]').first();
            const price=page.locator('input[type="number"][placeholder="0.05"]').first();
            const endpoint=page.locator('input[type="url"][placeholder*="your-api.com/x402/endpoint"]').first();
            if(!(await name.count()) || (await selects.count())<2 || !(await description.count()) || !(await price.count()) || !(await endpoint.count())) throw new Error('form_structure_changed');

            await name.fill('DELTA Witness Capture');
            const type=selects.nth(0);
            const typeOpts=await type.locator('option').evaluateAll(os=>os.map(o=>({v:o.value,t:(o.textContent||'').trim()})));
            const api=typeOpts.find(o=>/^API Endpoint$/i.test(o.t))||typeOpts.find(o=>/API/i.test(o.t));
            if(!api) throw new Error('api_type_option_missing');
            await type.selectOption(api.v);

            const category=selects.nth(1);
            const catOpts=await category.locator('option').evaluateAll(os=>os.map(o=>({v:o.value,t:(o.textContent||'').trim()})));
            const cat=catOpts.find(o=>/Web Scraping/i.test(o.t))||catOpts.find(o=>/Research/i.test(o.t))||catOpts.find(o=>/Data Analysis/i.test(o.t));
            if(!cat) throw new Error('suitable_category_missing');
            console.log('AGENT_BAZAAR_CATEGORY',cat);
            await category.selectOption(cat.v);

            await description.fill('Timestamped public-web evidence capture for autonomous agents. Preserves observed page state with verifiable proof metadata and hashes, paid per call through canonical x402 on Base USDC.');
            await price.fill('1');
            await endpoint.fill('https://delta-witness-api.ruphussten.workers.dev/v1/capture');

            const required=page.locator('input[required],textarea[required],select[required]');
            for(let i=0;i<await required.count();i++){
              const el=required.nth(i); const typ=await el.getAttribute('type'); if(typ==='checkbox') continue;
              const val=await el.inputValue().catch(()=> ''); if(!val) throw new Error('required_field_empty');
            }

            const submit=page.getByRole('button',{name:/Submit for Review/i}).first();
            if(!(await submit.count())) throw new Error('submit_button_missing');
            await submit.click();
            await page.waitForTimeout(3000);
            const final=(await page.locator('body').innerText()).replace(/\s+/g,' ');
            console.log('AGENT_BAZAAR_FINAL',final.slice(0,10000));
            if (/captcha|turnstile|connect wallet|sign in|log in/i.test(final) && !/submitted|review|thank|received|pending/i.test(final)) throw new Error('USER_ACTION_REQUIRED_AFTER_SUBMIT');
            if (!/submitted|review|thank|received|pending|success/i.test(final)) throw new Error('submission_acceptance_not_verified');
            console.log('AGENT_BAZAAR_SUBMISSION_ACCEPTED');
            await page.close();
          } finally {await browser.close();}
          NODE
