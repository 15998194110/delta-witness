name: TEMP DELTA run9 paid-funnel correction 2026-09-17
on:
  push:
    branches: [master]
    paths: [.github/workflows/tmp-revenue-reconcile-run9-20260917-1245.yml]
permissions:
  contents: read
jobs:
  paid-funnel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
        with: {persist-credentials: false}
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - name: Read paid funnel candidates only
        run: |
          mkdir -p /tmp/delta-run9-correction
          node scripts/query-revenue-candidates.mjs | tee /tmp/delta-run9-correction/revenue-candidates.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: delta-run9-paid-funnel-${{ github.run_id }}
          path: /tmp/delta-run9-correction/
          if-no-files-found: warn
          retention-days: 7
