name: DELTA Restore Preflight Turn 4

on:
  push:
    paths:
      - '.github/workflows/_temp_growth_turn4_restore_preflight_20260909.yml'

permissions:
  contents: read

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Require deploy bootstrap
        run: test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
      - run: npm ci
      - run: npm run verify
      - name: Deploy core worker
        run: npx wrangler deploy
      - name: Verify direct production prices and treasury
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN='https://delta-witness-api.ruphussten.workers.dev'
          TREASURY='0x1990e21bc219696ff7fbc26527dbaed335ac6367'
          probe() {
            route="$1"; body="$2"; expected="$3"
            code=$(curl --retry 5 --retry-delay 3 --retry-all-errors -sS --max-time 30 -o /tmp/body.json -w '%{http_code}' -X POST "$ORIGIN$route" -H 'content-type: application/json' --data-binary "$body")
            test "$code" = 402
            jq -e --arg amount "$expected" --arg treasury "$TREASURY" '.accepts[0].amount == $amount and ((.accepts[0].payTo|ascii_downcase) == ($treasury|ascii_downcase)) and .accepts[0].network == "eip155:8453"' /tmp/body.json >/dev/null
            jq '{route:"'"$route"'",product,price_usd,amount:.accepts[0].amount,payTo:.accepts[0].payTo,network:.accepts[0].network}' /tmp/body.json
          }
          probe '/v1/capture' '{"url":"https://example.com"}' '30000'
          probe '/v1/preflight' '{"url":"https://example.com","expected":{"contains":["Example Domain"]}}' '30000'
      - name: Verify Payan routed prices
        shell: bash
        run: |
          set -euo pipefail
          TREASURY='0x1990e21bc219696ff7fbc26527dbaed335ac6367'
          probe() {
            name="$1"; id="$2"; body="$3"; amount="$4"
            code=$(curl --retry 5 --retry-delay 3 --retry-all-errors -sS --max-time 30 -o /tmp/payan.json -w '%{http_code}' -X POST "https://payanagent.com/x402/$id" -H 'content-type: application/json' --data-binary "$body")
            test "$code" = 402
            jq -e --arg amount "$amount" --arg treasury "$TREASURY" '.accepts[0].amount == $amount and ((.accepts[0].payTo|ascii_downcase) == ($treasury|ascii_downcase)) and .accepts[0].network == "eip155:8453"' /tmp/payan.json >/dev/null
            jq --arg name "$name" '{name:$name,product,price_usd,amount:.accepts[0].amount,payTo:.accepts[0].payTo,network:.accepts[0].network}' /tmp/payan.json
          }
          probe capture kh79t54410qb82yjcqsjmgv0d58dn7p3 '{"url":"https://example.com"}' '30000'
          probe preflight kh72vd1kdv37109xxzzgmn2xfn8dncc6z '{"url":"https://example.com","expected":{"contains":["Example Domain"]}}' '30000'
          probe guarded-action-pilot kh7dskbdz0mj2ctc0dvm6q1yb98dz8dm '{"urls":["https://example.com"],"preflight":{"url_index":0,"expected":{"contains":["Example Domain"]}}}' '10000000'
