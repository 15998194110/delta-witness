name: TEMP Foragex402 buyer discovery search
on:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/tmp-foragex402-buyer-search-20260915.yml"
permissions:
  contents: read
jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - name: Query public read-only MCP search
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const endpoint='https://foragex402.tablint.dev/mcp';
          async function rpc(body){
            const r=await fetch(endpoint,{method:'POST',headers:{'content-type':'application/json','accept':'application/json, text/event-stream'},body:JSON.stringify(body)});
            const text=await r.text();
            console.log('HTTP',r.status);
            console.log(text.slice(0,20000));
            if(!r.ok) throw new Error('mcp http '+r.status);
            return {r,text};
          }
          await rpc({jsonrpc:'2.0',id:1,method:'tools/call',params:{name:'search_services',arguments:{query:'public webpage evidence capture page state proof procurement price availability verification browser automation',max_price_usdc:10}}});
          await rpc({jsonrpc:'2.0',id:2,method:'tools/call',params:{name:'search_services',arguments:{query:'DELTA Witness'}}});
          NODE