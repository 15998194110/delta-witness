name: TEMP DELTA revenue run 20260918-1535
on:
  push:
    branches: [master]
    paths: [.github/workflows/tmp-revenue-run-20260918-1535.yml]
permissions:
  contents: read
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DELTA_PARTNER_SECRET: ${{ secrets.DELTA_PARTNER_SECRET }}
    steps:
      - uses: actions/checkout@v6
        with: {persist-credentials: false}
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - name: Check owner pricing source
        run: node scripts/check-owner-pricing.mjs
      - name: Verify live public 402 without payment
        run: node scripts/verify-owner-pricing-live.mjs | tee /tmp/delta-pricing.json
      - name: Audit paid funnel candidates
        run: node scripts/query-revenue-candidates.mjs | tee /tmp/delta-revenue-candidates.json
      - name: Reconcile AgentPact funded demand
        continue-on-error: true
        run: node scripts/scan-agentpact-demand.mjs | tee /tmp/delta-agentpact.json
      - name: Reconcile additional funded demand
        continue-on-error: true
        run: node scripts/scan-external-funded-demand.mjs | tee /tmp/delta-external-funded.json
      - name: Reconcile canonical Base USDC Treasury
        env:
          DELTA_TREASURY_LOOKBACK_BLOCKS: '100000'
          DELTA_TREASURY_CHUNK_BLOCKS: '1900'
        run: node scripts/reconcile-treasury.mjs | tee /tmp/delta-treasury.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: delta-revenue-run-${{ github.run_id }}
          path: |
            /tmp/delta-pricing.json
            /tmp/delta-revenue-candidates.json
            /tmp/delta-agentpact.json
            /tmp/delta-external-funded.json
            /tmp/delta-treasury.json
          if-no-files-found: warn
          retention-days: 7
