name: TMP DELTA final sprint reconcile 20260921 1408 JST

on:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/tmp-chat-final-reconcile-20260921-1408.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Collect final read-only sprint evidence
        shell: bash
        run: |
          mkdir -p tmp-evidence
          node scripts/check-owner-pricing.mjs 2>&1 | tee tmp-evidence/pricing-source.txt
          node scripts/verify-owner-pricing-live.mjs 2>&1 | tee tmp-evidence/pricing-live.txt
          node scripts/query-revenue-candidates.mjs 2>&1 | tee tmp-evidence/paid-funnel.txt || true
          node scripts/scan-agentpact-demand.mjs 2>&1 | tee tmp-evidence/agentpact-demand.txt || true
          DELTA_TREASURY_LOOKBACK_BLOCKS=15000 DELTA_TREASURY_CHUNK_BLOCKS=1900 node scripts/reconcile-treasury.mjs 2>&1 | tee tmp-evidence/treasury.txt
          cat > /tmp/final-window.mjs <<'NODE'
          const USDC='0x833589fcd6edb6e08f4c7c32d4f71b54bda02913';
          const TREASURY='0x1990e21bc219696ff7fbc26527dbaed335ac6367';
          const TRANSFER='0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef';
          const TO='0x'+TREASURY.slice(2).padStart(64,'0');
          const START=51587000;
          const DEADLINE=Math.floor(new Date('2026-09-21T04:43:28Z').getTime()/1000);
          const RPCS=['https://mainnet.base.org','https://base-rpc.publicnode.com','https://base.llamarpc.com'];
          async function rpc(method,params){let e;for(const u of RPCS){for(let a=0;a<2;a++){try{const r=await fetch(u,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method,params}),signal:AbortSignal.timeout(12000)});const t=await r.text();if(!r.ok)throw new Error(`${u} ${r.status} ${t.slice(0,120)}`);const j=JSON.parse(t);if(j.error)throw new Error(JSON.stringify(j.error));return j.result;}catch(x){e=x;await new Promise(s=>setTimeout(s,500*(a+1)));}}}throw e;}
          async function block(n){return rpc('eth_getBlockByNumber',['0x'+n.toString(16),false]);}
          const latest=parseInt(await rpc('eth_blockNumber',[]),16);
          let lo=START, hi=latest, best=START-1;
          while(lo<=hi){const mid=Math.floor((lo+hi)/2);const b=await block(mid);const ts=parseInt(b.timestamp,16);if(ts<=DEADLINE){best=mid;lo=mid+1;}else hi=mid-1;}
          async function logs(a,b){const out=[];if(a>b)return out;for(let x=a;x<=b;x+=1900){const y=Math.min(b,x+1899);const rows=await rpc('eth_getLogs',[{address:USDC,fromBlock:'0x'+x.toString(16),toBlock:'0x'+y.toString(16),topics:[TRANSFER,null,TO]}]);out.push(...rows);}return out;}
          const before=await logs(START,best);
          const after=await logs(best+1,latest);
          const mapRows=rows=>rows.map(l=>({tx_hash:l.transactionHash,block_number:parseInt(l.blockNumber,16),from:'0x'+l.topics[1].slice(-40),raw_amount:BigInt(l.data).toString(),usdc:Number(BigInt(l.data))/1e6}));
          const deadlineBlock=best>=START?await block(best):null;
          const firstAfter=best+1<=latest?await block(best+1):null;
          console.log(JSON.stringify({checked_at:new Date().toISOString(),deadline_utc:'2026-09-21T04:43:28Z',scan_start_block:START,deadline_block:best,deadline_block_timestamp:deadlineBlock?new Date(parseInt(deadlineBlock.timestamp,16)*1000).toISOString():null,first_post_deadline_block:best+1<=latest?best+1:null,first_post_deadline_timestamp:firstAfter?new Date(parseInt(firstAfter.timestamp,16)*1000).toISOString():null,latest_block:latest,pre_deadline_gap_receipts:mapRows(before),post_deadline_receipts:mapRows(after)},null,2));
          NODE
          node /tmp/final-window.mjs 2>&1 | tee tmp-evidence/treasury-deadline-window.txt
      - uses: actions/upload-artifact@v4
        with:
          name: delta-final-reconcile-20260921-1408
          path: tmp-evidence/
          retention-days: 1
