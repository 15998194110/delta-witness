name: DELTA Tollbooth Growth Temp
on:
  push:
    paths:
      - '.github/workflows/_temp_growth_tollbooth_20260907_2240.yml'
permissions:
  contents: read
jobs:
  growth:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Probe DELTA core
        shell: bash
        run: |
          set -u
          BASE='https://delta-witness-api.ruphussten.workers.dev'
          curl --retry 3 --retry-delay 2 --retry-all-errors -fsS --max-time 20 "$BASE/health"
          for route in capture preflight; do
            body='{"url":"https://example.com","expected":{"contains":["Example Domain"]}}'
            if [ "$route" = capture ]; then body='{"url":"https://example.com"}'; fi
            code=$(curl --retry 3 --retry-delay 2 --retry-all-errors -sS --max-time 30 -o "/tmp/${route}.json" -w '%{http_code}' -X POST "$BASE/v1/$route" -H 'content-type: application/json' --data-binary "$body" || true)
            echo "CORE_${route^^}_HTTP=$code"
            head -c 1200 "/tmp/${route}.json" 2>/dev/null || true; echo
          done
          code=$(curl --retry 3 --retry-delay 2 --retry-all-errors -sS --max-time 30 -o /tmp/pilot.json -w '%{http_code}' -X POST "$BASE/v1/guarded-action-pilot" -H 'content-type: application/json' --data-binary '{"urls":["https://example.com"],"action":"verify public page before autonomous action"}' || true)
          echo "CORE_PILOT_HTTP=$code"; head -c 1200 /tmp/pilot.json 2>/dev/null || true; echo
      - name: Directly register DELTA on Tollbooth
        shell: bash
        run: |
          set -u
          TB='https://www.trytollbooth.com/api/services'
          W='0x1990e21bc219696ff7fbc26527dbaed335ac6367'
          submit(){
            name="$1"; endpoint="$2"; price="$3"; desc="$4"
            jq -n --arg name "$name" --arg endpoint "$endpoint" --arg wallet "$W" --arg desc "$desc" --argjson price "$price" '{name:$name,endpoint:$endpoint,category:"verification",priceUsdc:$price,wallet:$wallet,chain:"base",description:$desc}' >/tmp/tb.json
            code=$(curl --retry 4 --retry-delay 2 --retry-all-errors -sS --max-time 45 -o /tmp/tb-res.json -w '%{http_code}' -X POST "$TB" -H 'content-type: application/json' --data-binary @/tmp/tb.json || true)
            echo "TOLLBOOTH_SUBMIT name=$name HTTP=$code"
            cat /tmp/tb-res.json 2>/dev/null || true; echo
          }
          submit 'DELTA Witness Capture' 'https://delta-witness-api.ruphussten.workers.dev/v1/capture' 0.03 'Browser verification and timestamped page-state proof for autonomous agents.'
          submit 'DELTA Witness Preflight' 'https://delta-witness-api.ruphussten.workers.dev/v1/preflight' 0.03 'Preflight autonomous actions against fresh public-source observations and deterministic expectations.'
          submit 'DELTA Witness Guarded Action Pilot' 'https://delta-witness-api.ruphussten.workers.dev/v1/guarded-action-pilot' 10 'Higher-value guarded-action pilot for evidence-backed autonomous action verification.'
          echo 'TOLLBOOTH_READBACK_BEGIN'
          curl --retry 4 --retry-delay 2 --retry-all-errors -fsS --max-time 45 'https://www.trytollbooth.com/api/services?q=DELTA' || true
          echo; echo 'TOLLBOOTH_READBACK_END'
      - name: Reconcile Base Treasury
        shell: bash
        run: |
          set -u
          TREASURY='0x1990e21bc219696ff7fbc26527dbaed335ac6367'
          USDC='0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913'
          curl --retry 4 --retry-delay 2 --retry-all-errors -fsS --max-time 30 "https://base.blockscout.com/api/v2/addresses/${TREASURY}/token-transfers?type=ERC-20" >/tmp/transfers.json || true
          echo 'TREASURY_INCOMING_USDC_BEGIN'
          jq --arg t "${TREASURY,,}" --arg u "${USDC,,}" '[.items[]? | select(((.to.hash // .to // "")|ascii_downcase)==$t) | select(((.token.address_hash // .token.address // "")|ascii_downcase)==$u) | {timestamp,transaction_hash,from:(.from.hash // .from),to:(.to.hash // .to),value_raw:.total.value,decimals:.total.decimals,method}] | .[:30]' /tmp/transfers.json 2>/dev/null || echo '[]'
          echo 'TREASURY_INCOMING_USDC_END'
      - name: Reconcile recent DELTA telemetry
        shell: bash
        run: |
          set -u
          DB='c9431b00-27c5-4609-9f3d-6af20cb162df'
          SQL="SELECT id,created_at,event,route,channel,partner,success,reason,gross_usd,browser_ms,storage_bytes,variable_cost_usd,contribution_margin_usd FROM telemetry_events WHERE created_at >= '2026-09-07 13:30:00' ORDER BY id ASC"
          jq -n --arg sql "$SQL" '{sql:$sql}' >/tmp/query.json
          echo 'TELEMETRY_BEGIN'
          curl --retry 4 --retry-delay 2 --retry-all-errors -sS --max-time 30 -X POST "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DB}/query" -H "authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'content-type: application/json' --data-binary @/tmp/query.json | jq '{success,errors,result:[.result[]?|{success,results}]}' || true
          echo 'TELEMETRY_END'
