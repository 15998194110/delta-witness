name: DELTA external channel probe

on:
  push:
    paths:
      - '.github/workflows/ops-external-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect SwarmBazaar submission handler
        shell: bash
        continue-on-error: true
        run: |
          set +e
          curl -L --retry 3 --retry-all-errors --max-time 20 -sS https://swarmbazaar.com/onboard.html -o /tmp/swarm.html
          python3 - <<'PY'
          import re
          s=open('/tmp/swarm.html',errors='ignore').read()
          for pat in [r'fetch\([^\n]{0,500}', r'onboard-form.{0,2000}', r'/api/[^\"\'\s<]{1,100}', r'FormData\([^\n]{0,500}']:
              print('PATTERN',pat)
              for m in re.finditer(pat,s,re.I|re.S):
                  a=max(0,m.start()-600); b=min(len(s),m.end()+1400)
                  print(s[a:b].replace('\n',' ')[:3000])
                  print('---')
          PY
      - name: PayanAgent open requests isolated
        shell: bash
        continue-on-error: true
        run: |
          set +e
          code=$(curl -L --retry 4 --retry-all-errors --max-time 20 -sS -o /tmp/payan.json -w '%{http_code}' 'https://payanagent.com/api/v1/requests?status=open&limit=100')
          echo "PAYAN_HTTP=$code"
      - name: Base Treasury reconciliation independent
        shell: bash
        run: |
          set -euo pipefail
          URL='https://base.blockscout.com/api/v2/addresses/0x1990e21bc219696ff7fbc26527dbaed335ac6367/token-transfers?type=ERC-20'
          curl -L --retry 4 --retry-all-errors --max-time 20 -sS --fail "$URL" -o /tmp/transfers.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/transfers.json'))
          items=d.get('items',[])
          usdc='0x833589fcd6edb6e08f4c7c32d4f71b54bda02913'
          addr='0x1990e21bc219696ff7fbc26527dbaed335ac6367'
          out=[]
          for x in items:
              token=x.get('token') or {}
              ta=(token.get('address_hash') or token.get('address') or '').lower()
              to=((x.get('to') or {}).get('hash') if isinstance(x.get('to'),dict) else x.get('to') or '').lower()
              if ta==usdc and to==addr:
                  dec=int(token.get('decimals') or 6)
                  total=x.get('total') or {}
                  raw=total.get('value') if isinstance(total,dict) else x.get('value')
                  try: amount=int(raw)/(10**dec)
                  except: amount=raw
                  fr=(x.get('from') or {}).get('hash') if isinstance(x.get('from'),dict) else x.get('from')
                  out.append({'tx_hash':x.get('transaction_hash'),'timestamp':x.get('timestamp'),'from':fr,'amount_usdc':amount})
          print(json.dumps({'latest_incoming_usdc':out[:25]},ensure_ascii=False))
          PY
