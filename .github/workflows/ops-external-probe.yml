name: DELTA SwarmBazaar free listing

on:
  push:
    paths:
      - '.github/workflows/ops-external-probe.yml'

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Submit free DELTA listing
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/payload.json <<'JSON'
          {
            "name":"DELTA Witness",
            "url":"https://delta-witness-api.ruphussten.workers.dev",
            "tagline":"Page-state proof and deterministic preflight for autonomous browser actions",
            "category":"seller",
            "protocols":"x402, MCP",
            "offering_title":"Page-state witness + browser preflight",
            "offering_detail":"Public URL evidence receipts and expected-condition checks for browser/workflow agents",
            "offering_price":"$0.03/call · USDC on Base",
            "logo":"",
            "featured_plan":"none",
            "endpoint":"https://delta-witness-api.ruphussten.workers.dev/.well-known/x402",
            "email":"ruphussten85@gmail.com",
            "website2":""
          }
          JSON
          code=$(curl -L --retry 3 --retry-all-errors --max-time 20 -sS -o /tmp/response.json -w '%{http_code}' \
            -X POST 'https://swarmbazaar.com/api/onboard' \
            -H 'content-type: application/json' \
            --data-binary @/tmp/payload.json)
          echo "SWARMBAZAAR_HTTP=$code"
          cat /tmp/response.json
          test "$code" -ge 200 -a "$code" -lt 300
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/response.json'))
          if d.get('payment'):
              raise SystemExit('Unexpected payment requested despite featured_plan=none')
          print('SWARMBAZAAR_FREE_SUBMISSION_ACCEPTED')
          PY
      - name: Independent Treasury check
        shell: bash
        run: |
          set -euo pipefail
          URL='https://base.blockscout.com/api/v2/addresses/0x1990e21bc219696ff7fbc26527dbaed335ac6367/token-transfers?type=ERC-20'
          curl -L --retry 4 --retry-all-errors --max-time 20 -sS --fail "$URL" -o /tmp/transfers.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/transfers.json'))
          items=d.get('items',[])
          usdc='0x833589fcd6edb6e08f4c7c32d4f71b54bda02913'
          addr='0x1990e21bc219696ff7fbc26527dbaed335ac6367'
          out=[]
          for x in items:
              token=x.get('token') or {}
              ta=(token.get('address_hash') or token.get('address') or '').lower()
              to=((x.get('to') or {}).get('hash') if isinstance(x.get('to'),dict) else x.get('to') or '').lower()
              if ta==usdc and to==addr:
                  dec=int(token.get('decimals') or 6)
                  total=x.get('total') or {}
                  raw=total.get('value') if isinstance(total,dict) else x.get('value')
                  try: amount=int(raw)/(10**dec)
                  except: amount=raw
                  fr=(x.get('from') or {}).get('hash') if isinstance(x.get('from'),dict) else x.get('from')
                  out.append({'tx_hash':x.get('transaction_hash'),'timestamp':x.get('timestamp'),'from':fr,'amount_usdc':amount})
          print(json.dumps({'latest_incoming_usdc':out[:25]},ensure_ascii=False))
          PY
