name: DELTA Release Train

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: delta-production-release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with: { node-version: "22" }
      - run: node scripts/check-release-version.mjs
      - run: npm ci
      - run: npm run verify
      - name: Verify partner gateway
        working-directory: channels/partner-gateway
        run: npm ci && npm run verify
      - name: Verify JS client
        working-directory: packages/js-client
        run: npm run check && npm test && npm pack --dry-run
      - name: Verify MCP server
        working-directory: packages/mcp-server
        run: npm ci && npm run prepack && npm pack --dry-run
      - name: Verify Apify actor
        working-directory: channels/apify
        run: npm ci && npm run check
      - name: Verify Base web app
        working-directory: channels/base-app
        run: npm ci && npm run verify
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - name: Verify Python distribution
        working-directory: packages/python-client
        run: python -m pip install build && python -m compileall -q delta_witness && python -m build

  core-cloudflare:
    needs: verify
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DELTA_PARTNER_GATEWAY_SECRET: ${{ secrets.DELTA_PARTNER_GATEWAY_SECRET }}
      DELTA_INDEXNOW_ADMIN_SECRET: ${{ secrets.DELTA_INDEXNOW_ADMIN_SECRET }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with: { node-version: "22" }
      - name: Require Cloudflare bootstrap
        run: test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID" && test -n "$DELTA_PARTNER_GATEWAY_SECRET" && test -n "$DELTA_INDEXNOW_ADMIN_SECRET"
      - run: npm ci
      - name: Apply D1 telemetry migrations
        run: npx wrangler d1 migrations apply delta-witness-analytics --remote
      - name: Record rollback version
        run: npx wrangler versions list
      - name: Install core secrets
        run: |
          printf '%s' "$DELTA_PARTNER_GATEWAY_SECRET" | npx wrangler secret put PARTNER_GATEWAY_SECRET
          printf '%s' "$DELTA_INDEXNOW_ADMIN_SECRET" | npx wrangler secret put INDEXNOW_ADMIN_SECRET
      - run: npx wrangler deploy
      - name: Verify production discovery and existing proof
        run: |
          curl --fail --retry 5 --retry-delay 5 https://delta-witness-api.ruphussten.workers.dev/health
          curl --fail https://delta-witness-api.ruphussten.workers.dev/.well-known/x402
          curl --fail https://delta-witness-api.ruphussten.workers.dev/openapi.json
          curl --fail https://delta-witness-api.ruphussten.workers.dev/v1/proofs/56347db8-1aa5-447f-a0e4-3bb052d7aa89
      - name: Verify Watch prepaid floor without registration
        run: |
          status="$(curl --silent --show-error --output /tmp/delta-watch-floor.json --write-out '%{http_code}' \
            --request POST https://delta-witness-api.ruphussten.workers.dev/internal/partner/watch \
            --header "x-delta-core-secret: $DELTA_PARTNER_GATEWAY_SECRET" \
            --header 'x-delta-partner: internal-ci' \
            --header 'x-delta-channel: internal-ci' \
            --header 'x-delta-gross-usd: 0' \
            --header "idempotency-key: internal-ci-watch-${GITHUB_RUN_ID}" \
            --header 'content-type: application/json' \
            --data '{"url":"https://example.com","checks":1,"interval_seconds":900}')"
          test "$status" = "402"
          grep --quiet '"watch_prepaid_amount_below_floor"' /tmp/delta-watch-floor.json

  partner-gateway:
    needs: [verify, core-cloudflare]
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DELTA_PARTNER_SECRET: ${{ secrets.DELTA_PARTNER_SECRET }}
      DELTA_PARTNER_GATEWAY_SECRET: ${{ secrets.DELTA_PARTNER_GATEWAY_SECRET }}
    defaults: { run: { working-directory: channels/partner-gateway } }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with: { node-version: "22" }
      - name: Require gateway bootstrap
        run: test -n "$DELTA_PARTNER_SECRET" && test -n "$DELTA_PARTNER_GATEWAY_SECRET"
      - run: npm ci
      - name: Install gateway secrets
        run: |
          printf '%s' "$DELTA_PARTNER_SECRET" | npx wrangler secret put PARTNER_SECRET
          printf '%s' "$DELTA_PARTNER_GATEWAY_SECRET" | npx wrangler secret put CORE_SERVICE_SECRET
      - run: npx wrangler deploy
      - run: curl --fail --retry 5 --retry-delay 5 https://delta-witness-partner-gateway.ruphussten.workers.dev/health
      - name: Verify authenticated gateway without fulfillment
        run: |
          status="$(curl --silent --show-error --output /tmp/delta-gateway-smoke.json --write-out '%{http_code}' \
            --request POST https://delta-witness-partner-gateway.ruphussten.workers.dev/watch \
            --header "x-delta-partner-secret: $DELTA_PARTNER_SECRET" \
            --header "idempotency-key: internal-ci-auth-${GITHUB_RUN_ID}" \
            --header 'content-type: application/json' \
            --data '{"url":"https://example.com","checks":0,"interval_seconds":900}')"
          test "$status" = "400"
          grep --quiet '"invalid_checks"' /tmp/delta-gateway-smoke.json

  x402-discovery:
    needs: core-cloudflare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v5
        with: { node-version: "22" }
      - name: Audit deployed x402 discovery
        run: npx -y @agentcash/discovery@1.7.5 discover https://delta-witness-api.ruphussten.workers.dev --json > /tmp/delta-x402-discovery.json
      - name: Require callable Capture and Guard resources
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const result = JSON.parse(fs.readFileSync('/tmp/delta-x402-discovery.json', 'utf8'));
          if (!result.ok || result.selectedStage !== 'openapi') throw new Error(JSON.stringify(result));
          for (const path of ['/v1/capture', '/v1/preflight']) {
            const resource = result.resources.find((item) => item.method === 'POST' && item.path === path);
            if (!resource || !resource.protocols?.includes('x402') || !resource.priceHint) {
              throw new Error(`Missing callable x402 resource ${path}: ${JSON.stringify(result)}`);
            }
          }
          const errors = result.warnings.filter((warning) => warning.severity === 'error');
          if (errors.length) throw new Error(`x402 discovery errors: ${JSON.stringify(errors)}`);
          console.log(JSON.stringify({ ok: true, resources: result.resources.length, warnings: result.warnings.length }));
          NODE

  base-app:
    needs: verify
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults: { run: { working-directory: channels/base-app } }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with: { node-version: "22" }
      - run: npm ci
      - run: npm run build
      - run: npx wrangler pages deploy dist --project-name delta-witness-app --branch master
      - run: curl --fail --retry 5 --retry-delay 5 https://delta-witness-app.pages.dev/
      - name: Push Base app IndexNow (diagnostic only)
        continue-on-error: true
        run: node ../../scripts/indexnow-pulse.mjs base-app

  npm-client:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults: { run: { working-directory: packages/js-client } }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - run: node ../../scripts/prepare-npm-publish.mjs
      - name: Publish JS client when version is new
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "delta-witness-ruphussten@$VERSION" version >/dev/null 2>&1; then
            echo "delta-witness-ruphussten@$VERSION already published; skipping"
          else
            npm publish --access public
          fi

  npm-mcp:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults: { run: { working-directory: packages/mcp-server } }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: "24", registry-url: "https://registry.npmjs.org", package-manager-cache: false }
      - run: npm ci
      - run: node ../../scripts/prepare-npm-publish.mjs
      - name: Publish MCP package when version is new
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "delta-witness-mcp@$VERSION" version >/dev/null 2>&1; then
            echo "delta-witness-mcp@$VERSION already published; skipping"
          else
            npm publish --access public --provenance
          fi

  pypi-client:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults: { run: { working-directory: packages/python-client } }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: python -m pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/python-client/dist
          skip-existing: true

  mcp-registry:
    runs-on: ubuntu-latest
    needs: npm-mcp
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with: { node-version: "22" }
      - run: node scripts/render-mcp-server.mjs
      - run: |
          set -euo pipefail
          PLATFORM="$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          URL="https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_${PLATFORM}.tar.gz"
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 3 "$URL" | tar xz mcp-publisher
          ./mcp-publisher validate server.json
          if node scripts/check-mcp-registry.mjs server.json; then
            echo "MCP Registry version already active; skipping publish"
          else
            ./mcp-publisher login github-oidc
            set +e
            PUBLISH_OUTPUT="$(./mcp-publisher publish server.json 2>&1)"
            PUBLISH_STATUS=$?
            set -e
            printf '%s\n' "$PUBLISH_OUTPUT"
            if [ "$PUBLISH_STATUS" -ne 0 ] && ! grep -q 'cannot publish duplicate version' <<<"$PUBLISH_OUTPUT"; then
              exit "$PUBLISH_STATUS"
            fi
            if [ "$PUBLISH_STATUS" -ne 0 ]; then
              echo "MCP Registry already contains this immutable version; treating duplicate publish as idempotent success"
            fi
          fi

  public-npm-smoke:
    needs: [npm-client, npm-mcp, mcp-registry]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: "24", package-manager-cache: false }
      - run: node scripts/public-npm-smoke.mjs

  public-pypi-smoke:
    needs: pypi-client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - name: Install and call the public PyPI client
        run: |
          VERSION=$(python -c "import json; print(json.load(open('package.json'))['version'])")
          python -m pip install --no-cache-dir "delta-witness-ruphussten==$VERSION"
          python scripts/public-pypi-smoke.py

  postman:
    needs: verify
    if: ${{ vars.POSTMAN_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    env:
      POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
      POSTMAN_WORKSPACE_ID: ${{ vars.POSTMAN_WORKSPACE_ID }}
      POSTMAN_COLLECTION_ID: ${{ vars.POSTMAN_COLLECTION_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with: { node-version: "22" }
      - run: test -n "$POSTMAN_API_KEY"
      - run: node scripts/postman-sync.mjs

  apify:
    needs: verify
    if: ${{ vars.APIFY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    env:
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
    defaults: { run: { working-directory: channels/apify } }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with: { node-version: "22" }
      - run: test -n "$APIFY_TOKEN"
      - run: npm ci
      - run: npm install --global apify-cli
      - run: apify push
