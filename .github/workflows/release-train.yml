name: DELTA Release Train

on:
  workflow_dispatch:
    inputs:
      execute_release:
        type: boolean
        default: false
        description: Execute an independently approved production release
      release_scopes:
        type: string
        default: '[]'
        description: Exact JSON list of separately approved release operations
      source_commit:
        type: string
        required: false
        description: Exact approved 40-character commit (not a branch or tag)
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: delta-production-release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version: "22" }
      - name: Check current owner pricing policy
        run: node scripts/check-owner-pricing.mjs
      - name: Verify live owner pricing before release
        run: node scripts/verify-owner-pricing-live.mjs
      - run: node scripts/check-release-version.mjs
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run verify
      - name: Preserve the verified Core bundle
        run: node scripts/verified-cloudflare-artifact.mjs record "$RUNNER_TEMP/delta-core-verified" core
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: core-verified-${{ github.sha }}
          path: ${{ runner.temp }}/delta-core-verified/
          if-no-files-found: error
      - name: Verify partner gateway
        working-directory: channels/partner-gateway
        run: npm ci && npm run verify
      - name: Preserve the verified gateway bundle
        run: node scripts/verified-cloudflare-artifact.mjs record "$RUNNER_TEMP/delta-gateway-verified" gateway
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gateway-verified-${{ github.sha }}
          path: ${{ runner.temp }}/delta-gateway-verified/
          if-no-files-found: error
      - name: Verify and package exact JS client artifact
        working-directory: packages/js-client
        run: |
          node ../../scripts/prepare-npm-publish.mjs
          npm run prepack
          mkdir -p "$RUNNER_TEMP/delta-npm-js"
          npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP/delta-npm-js" > "$RUNNER_TEMP/delta-npm-js/pack.json"
          node ../../scripts/verified-npm-artifact.mjs record "$RUNNER_TEMP/delta-npm-js" delta-witness-ruphussten
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-js-verified-${{ github.sha }}
          path: ${{ runner.temp }}/delta-npm-js/
          if-no-files-found: error
      - name: Verify and package exact MCP artifact
        working-directory: packages/mcp-server
        run: |
          npm ci
          node ../../scripts/prepare-npm-publish.mjs
          npm run prepack
          mkdir -p "$RUNNER_TEMP/delta-npm-mcp"
          npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP/delta-npm-mcp" > "$RUNNER_TEMP/delta-npm-mcp/pack.json"
          node ../../scripts/verified-npm-artifact.mjs record "$RUNNER_TEMP/delta-npm-mcp" delta-witness-mcp
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-mcp-verified-${{ github.sha }}
          path: ${{ runner.temp }}/delta-npm-mcp/
          if-no-files-found: error
      - name: Verify Apify actor
        working-directory: channels/apify
        run: npm ci && npm run check
      - name: Verify Base web app
        working-directory: channels/base-app
        run: npm ci && npm run verify
      - name: Preserve verified Pages including the signed public manifest
        run: node scripts/verified-cloudflare-artifact.mjs record "$RUNNER_TEMP/delta-pages-verified" pages
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pages-verified-${{ github.sha }}
          path: ${{ runner.temp }}/delta-pages-verified/
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: { python-version: "3.12" }
      - name: Verify Python distribution
        working-directory: packages/python-client
        run: |
          python -m pip install --only-binary=:all: -r requirements-validation.txt
          python -m unittest discover -s tests
          python scripts/verify_build.py "$RUNNER_TEMP/delta-python-verified"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-verified-${{ github.sha }}
          path: ${{ runner.temp }}/delta-python-verified/
          if-no-files-found: error

  authorize-release:
    needs: verify
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.execute_release }}
    runs-on: ubuntu-latest
    environment: production-release
    outputs:
      scopes: ${{ steps.scope.outputs.scopes }}
      variables_policy: ${{ steps.scope.outputs.variables_policy }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version: "24" }
      - name: Require exact candidate and separately approved compatible fallback
        env:
          DELTA_EXECUTE_RELEASE: ${{ inputs.execute_release }}
          DELTA_REQUESTED_SOURCE: ${{ inputs.source_commit }}
          DELTA_APPROVED_SOURCE: ${{ vars.DELTA_APPROVED_RELEASE_SHA }}
          DELTA_ROLLBACK_SOURCE: ${{ vars.DELTA_APPROVED_ROLLBACK_SHA }}
          DELTA_ROLLBACK_ARTIFACT_SHA256: ${{ vars.DELTA_APPROVED_ROLLBACK_ARTIFACT_SHA256 }}
        run: node scripts/check-release-authorization.mjs
      - name: Require exact approved operation scope
        id: scope
        env:
          DELTA_REQUESTED_SCOPES: ${{ inputs.release_scopes }}
          DELTA_APPROVED_SCOPES: ${{ vars.DELTA_APPROVED_RELEASE_SCOPES }}
          DELTA_VARIABLES_POLICY: ${{ vars.DELTA_APPROVED_VARIABLES_POLICY }}
        run: node scripts/release-scope.mjs

  core-cloudflare:
    needs: [verify, authorize-release]
    if: ${{ contains(fromJSON(needs.authorize-release.outputs.scopes || '[]'), 'core-cloudflare') }}
    runs-on: ubuntu-latest
    env:
      DELTA_VARIABLES_POLICY: ${{ needs.authorize-release.outputs.variables_policy }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DELTA_PARTNER_GATEWAY_SECRET: ${{ secrets.DELTA_PARTNER_GATEWAY_SECRET }}
      DELTA_INDEXNOW_ADMIN_SECRET: ${{ secrets.DELTA_INDEXNOW_ADMIN_SECRET }}
      DELTA_EXECUTE_RELEASE: ${{ inputs.execute_release }}
      DELTA_REQUESTED_SOURCE: ${{ inputs.source_commit }}
      DELTA_APPROVED_SOURCE: ${{ vars.DELTA_APPROVED_RELEASE_SHA }}
      DELTA_ROLLBACK_SOURCE: ${{ vars.DELTA_APPROVED_ROLLBACK_SHA }}
      DELTA_ROLLBACK_ARTIFACT_SHA256: ${{ vars.DELTA_APPROVED_ROLLBACK_ARTIFACT_SHA256 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version: "22" }
      - name: Require Cloudflare bootstrap
        run: test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: core-verified-${{ github.sha }}
          path: ${{ runner.temp }}/delta-core-verified/
      - run: node scripts/check-owner-pricing.mjs
      - name: Re-verify live owner pricing immediately before deployment
        run: node scripts/verify-owner-pricing-live.mjs
      - run: npm ci
      - name: Verify original Core artifact before any provider mutation
        run: node scripts/verified-cloudflare-artifact.mjs verify "$RUNNER_TEMP/delta-core-verified" core
      - name: Apply D1 telemetry migrations
        if: ${{ contains(fromJSON(needs.authorize-release.outputs.scopes || '[]'), 'd1-migration') }}
        run: npx wrangler d1 migrations apply delta-witness-analytics --remote
      - name: Record rollback version
        run: npx wrangler versions list
      - name: Install core secrets
        if: ${{ contains(fromJSON(needs.authorize-release.outputs.scopes || '[]'), 'core-secrets') }}
        run: |
          printf '%s' "$DELTA_PARTNER_GATEWAY_SECRET" | npx wrangler secret put PARTNER_GATEWAY_SECRET
          printf '%s' "$DELTA_INDEXNOW_ADMIN_SECRET" | npx wrangler secret put INDEXNOW_ADMIN_SECRET
      - name: Submit the original verified Core bundle without rebuilding
        run: node scripts/verified-cloudflare-artifact.mjs deploy "$RUNNER_TEMP/delta-core-verified" core
      - name: Verify production discovery and existing proof
        run: |
          curl --fail --retry 5 --retry-delay 5 https://delta-witness-api.ruphussten.workers.dev/health
          curl --fail https://delta-witness-api.ruphussten.workers.dev/.well-known/x402
          curl --fail https://delta-witness-api.ruphussten.workers.dev/openapi.json
          curl --fail https://delta-witness-api.ruphussten.workers.dev/v1/proofs/56347db8-1aa5-447f-a0e4-3bb052d7aa89
      - name: Verify owner pricing after deployment
        run: node scripts/verify-owner-pricing-live.mjs
      - name: Verify Watch prepaid floor without registration
        if: ${{ contains(fromJSON(needs.authorize-release.outputs.scopes || '[]'), 'partner-probe') }}
        run: |
          status="$(curl --silent --show-error --output /tmp/delta-watch-floor.json --write-out '%{http_code}' \
            --request POST https://delta-witness-api.ruphussten.workers.dev/internal/partner/watch \
            --header "x-delta-core-secret: $DELTA_PARTNER_GATEWAY_SECRET" \
            --header 'x-delta-partner: internal-ci' \
            --header 'x-delta-channel: internal-ci' \
            --header 'x-delta-gross-usd: 0' \
            --header "idempotency-key: internal-ci-watch-${GITHUB_RUN_ID}" \
            --header 'content-type: application/json' \
            --data '{"url":"https://example.com","checks":1,"interval_seconds":900}')"
          test "$status" = "402"
          grep --quiet '"watch_prepaid_amount_below_floor"' /tmp/delta-watch-floor.json

  partner-gateway:
    needs: [verify, authorize-release, core-cloudflare]
    if: ${{ contains(fromJSON(needs.authorize-release.outputs.scopes || '[]'), 'partner-gateway') }}
    runs-on: ubuntu-latest
    env:
      DELTA_VARIABLES_POLICY: ${{ needs.authorize-release.outputs.variables_policy }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DELTA_PARTNER_SECRET: ${{ secrets.DELTA_PARTNER_SECRET }}
      DELTA_PARTNER_GATEWAY_SECRET: ${{ secrets.DELTA_PARTNER_GATEWAY_SECRET }}
      DELTA_EXECUTE_RELEASE: ${{ inputs.execute_release }}
      DELTA_REQUESTED_SOURCE: ${{ inputs.source_commit }}
      DELTA_APPROVED_SOURCE: ${{ vars.DELTA_APPROVED_RELEASE_SHA }}
      DELTA_ROLLBACK_SOURCE: ${{ vars.DELTA_APPROVED_ROLLBACK_SHA }}
      DELTA_ROLLBACK_ARTIFACT_SHA256: ${{ vars.DELTA_APPROVED_ROLLBACK_ARTIFACT_SHA256 }}
    defaults: { run: { working-directory: channels/partner-gateway } }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version: "22" }
      - name: Require gateway bootstrap
        run: test -n "$DELTA_PARTNER_SECRET" && test -n "$DELTA_PARTNER_GATEWAY_SECRET"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: gateway-verified-${{ github.sha }}
          path: ${{ runner.temp }}/delta-gateway-verified/
      - run: npm ci
      - name: Verify original gateway artifact before any provider mutation
        run: node ../../scripts/verified-cloudflare-artifact.mjs verify "$RUNNER_TEMP/delta-gateway-verified" gateway
      - name: Install gateway secrets
        if: ${{ contains(fromJSON(needs.authorize-release.outputs.scopes || '[]'), 'gateway-secrets') }}
        run: |
          printf '%s' "$DELTA_PARTNER_SECRET" | npx wrangler secret put PARTNER_SECRET
          printf '%s' "$DELTA_PARTNER_GATEWAY_SECRET" | npx wrangler secret put CORE_SERVICE_SECRET
      - name: Submit the original verified gateway bundle without rebuilding
        run: node ../../scripts/verified-cloudflare-artifact.mjs deploy "$RUNNER_TEMP/delta-gateway-verified" gateway
      - run: curl --fail --retry 5 --retry-delay 5 https://delta-witness-partner-gateway.ruphussten.workers.dev/health
      - name: Verify authenticated gateway without fulfillment
        if: ${{ contains(fromJSON(needs.authorize-release.outputs.scopes || '[]'), 'partner-probe') }}
        run: |
          status="$(curl --silent --show-error --output /tmp/delta-gateway-smoke.json --write-out '%{http_code}' \
            --request POST https://delta-witness-partner-gateway.ruphussten.workers.dev/watch \
            --header "x-delta-partner-secret: $DELTA_PARTNER_SECRET" \
            --header "idempotency-key: internal-ci-auth-${GITHUB_RUN_ID}" \
            --header 'content-type: application/json' \
            --data '{"url":"https://example.com","checks":0,"interval_seconds":900}')"
          test "$status" = "400"
          grep --quiet '"invalid_checks"' /tmp/delta-gateway-smoke.json

  x402-discovery:
    needs: core-cloudflare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version: "22" }
      - name: Audit deployed x402 discovery
        run: npx -y @agentcash/discovery@1.7.5 discover https://delta-witness-api.ruphussten.workers.dev --json > /tmp/delta-x402-discovery.json
      - name: Require callable Capture and Guard resources
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const result = JSON.parse(fs.readFileSync('/tmp/delta-x402-discovery.json', 'utf8'));
          if (!result.ok || result.selectedStage !== 'openapi') throw new Error(JSON.stringify(result));
          for (const path of ['/v1/capture', '/v1/preflight']) {
            const resource = result.resources.find((item) => item.method === 'POST' && item.path === path);
            if (!resource || !resource.protocols?.includes('x402') || !resource.priceHint) {
              throw new Error(`Missing callable x402 resource ${path}: ${JSON.stringify(result)}`);
            }
          }
          const errors = result.warnings.filter((warning) => warning.severity === 'error');
          if (errors.length) throw new Error(`x402 discovery errors: ${JSON.stringify(errors)}`);
          console.log(JSON.stringify({ ok: true, resources: result.resources.length, warnings: result.warnings.length }));
          NODE

  base-app:
    needs: [verify, authorize-release]
    if: ${{ contains(fromJSON(needs.authorize-release.outputs.scopes || '[]'), 'base-app') }}
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DELTA_EXECUTE_RELEASE: ${{ inputs.execute_release }}
      DELTA_REQUESTED_SOURCE: ${{ inputs.source_commit }}
      DELTA_APPROVED_SOURCE: ${{ vars.DELTA_APPROVED_RELEASE_SHA }}
      DELTA_ROLLBACK_SOURCE: ${{ vars.DELTA_APPROVED_ROLLBACK_SHA }}
      DELTA_ROLLBACK_ARTIFACT_SHA256: ${{ vars.DELTA_APPROVED_ROLLBACK_ARTIFACT_SHA256 }}
    defaults: { run: { working-directory: channels/base-app } }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version: "22" }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pages-verified-${{ github.sha }}
          path: ${{ runner.temp }}/delta-pages-verified/
      - run: npm ci
      - name: Submit the original verified Pages directory without rebuilding
        run: node ../../scripts/verified-cloudflare-artifact.mjs deploy "$RUNNER_TEMP/delta-pages-verified" pages
      - run: curl --fail --retry 5 --retry-delay 5 https://delta-witness-app.pages.dev/
      - name: Push Base app IndexNow (diagnostic only)
        if: ${{ contains(fromJSON(needs.authorize-release.outputs.scopes || '[]'), 'indexnow') }}
        continue-on-error: true
        run: node ../../scripts/indexnow-pulse.mjs base-app

  npm-client:
    needs: [verify, authorize-release]
    if: ${{ contains(fromJSON(needs.authorize-release.outputs.scopes || '[]'), 'npm-client') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults: { run: { working-directory: packages/js-client } }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-js-verified-${{ github.sha }}
          path: ${{ runner.temp }}/delta-npm-js/
      - name: Publish or verify the exact reviewed JS archive
        env:
          DELTA_EXECUTE_RELEASE: ${{ inputs.execute_release }}
          DELTA_APPROVED_SOURCE: ${{ vars.DELTA_APPROVED_RELEASE_SHA }}
        run: node ../../scripts/verified-npm-artifact.mjs publish "$RUNNER_TEMP/delta-npm-js" delta-witness-ruphussten

  npm-mcp:
    needs: [verify, authorize-release]
    if: ${{ contains(fromJSON(needs.authorize-release.outputs.scopes || '[]'), 'npm-mcp') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults: { run: { working-directory: packages/mcp-server } }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: "24", registry-url: "https://registry.npmjs.org", package-manager-cache: false }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-mcp-verified-${{ github.sha }}
          path: ${{ runner.temp }}/delta-npm-mcp/
      - name: Publish or verify the exact reviewed MCP archive
        env:
          DELTA_EXECUTE_RELEASE: ${{ inputs.execute_release }}
          DELTA_APPROVED_SOURCE: ${{ vars.DELTA_APPROVED_RELEASE_SHA }}
        run: node ../../scripts/verified-npm-artifact.mjs publish "$RUNNER_TEMP/delta-npm-mcp" delta-witness-mcp

  pypi-client:
    needs: [verify, authorize-release]
    if: ${{ contains(fromJSON(needs.authorize-release.outputs.scopes || '[]'), 'pypi-client') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults: { run: { working-directory: packages/python-client } }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-verified-${{ github.sha }}
          path: ${{ runner.temp }}/delta-python-verified/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: ${{ runner.temp }}/delta-python-verified/
          skip-existing: false

  mcp-registry:
    runs-on: ubuntu-latest
    needs: [npm-mcp, authorize-release]
    if: ${{ contains(fromJSON(needs.authorize-release.outputs.scopes || '[]'), 'mcp-registry') }}
    env:
      DELTA_EXECUTE_RELEASE: ${{ inputs.execute_release }}
      DELTA_REQUESTED_SOURCE: ${{ inputs.source_commit }}
      DELTA_APPROVED_SOURCE: ${{ vars.DELTA_APPROVED_RELEASE_SHA }}
      DELTA_ROLLBACK_SOURCE: ${{ vars.DELTA_APPROVED_ROLLBACK_SHA }}
      DELTA_ROLLBACK_ARTIFACT_SHA256: ${{ vars.DELTA_APPROVED_ROLLBACK_ARTIFACT_SHA256 }}
      MCP_PUBLISHER_RELEASE_TAG: ${{ vars.MCP_PUBLISHER_RELEASE_TAG }}
      MCP_PUBLISHER_LINUX_AMD64_SHA256: ${{ vars.MCP_PUBLISHER_LINUX_AMD64_SHA256 }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version: "22" }
      - run: node scripts/render-mcp-server.mjs
      - run: |
          set -euo pipefail
          # Separate release bootstrap: public tag and archive digest must be
          # independently reviewed/approved; no automatic version selection.
          if [[ ! "$MCP_PUBLISHER_RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] ||
             [[ ! "$MCP_PUBLISHER_LINUX_AMD64_SHA256" =~ ^[0-9a-f]{64}$ ]] ||
             [[ "$MCP_PUBLISHER_LINUX_AMD64_SHA256" =~ ^0+$ ]]; then
            echo "Approved MCP publisher tag and linux_amd64 SHA256 are required before release" >&2
            exit 1
          fi
          URL="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_RELEASE_TAG}/mcp-publisher_linux_amd64.tar.gz"
          ARCHIVE="$(mktemp "$RUNNER_TEMP/delta-mcp-publisher.XXXXXX.tar.gz")"
          curl --fail --location --connect-timeout 10 --max-time 60 --retry 3 --retry-all-errors --retry-delay 3 --output "$ARCHIVE" "$URL"
          printf '%s  %s\n' "$MCP_PUBLISHER_LINUX_AMD64_SHA256" "$ARCHIVE" | sha256sum --check --strict
          tar -xzf "$ARCHIVE" mcp-publisher
          ./mcp-publisher validate server.json
          # Exact active metadata is required before skipping or after one
          # attempted publication; duplicate error text is never success.
          node scripts/check-mcp-registry.mjs server.json --publish-if-absent

  public-npm-smoke:
    needs: [npm-client, npm-mcp, mcp-registry]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: "24", package-manager-cache: false }
      - run: node scripts/public-npm-smoke.mjs

  public-pypi-smoke:
    needs: pypi-client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: { python-version: "3.12" }
      - name: Install and call the public PyPI client
        run: |
          VERSION=$(python -c "import json; print(json.load(open('package.json'))['version'])")
          python -m pip install --no-cache-dir "delta-witness-ruphussten==$VERSION"
          python scripts/public-pypi-smoke.py

  postman:
    needs: [verify, authorize-release]
    if: ${{ contains(fromJSON(needs.authorize-release.outputs.scopes || '[]'), 'postman') && vars.POSTMAN_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    env:
      POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
      POSTMAN_WORKSPACE_ID: ${{ vars.POSTMAN_WORKSPACE_ID }}
      POSTMAN_COLLECTION_ID: ${{ vars.POSTMAN_COLLECTION_ID }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version: "22" }
      - run: test -n "$POSTMAN_API_KEY"
      - run: node scripts/postman-sync.mjs

  apify:
    needs: [verify, authorize-release]
    if: ${{ contains(fromJSON(needs.authorize-release.outputs.scopes || '[]'), 'apify') && vars.APIFY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    env:
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
    defaults: { run: { working-directory: channels/apify } }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version: "22" }
      - run: test -n "$APIFY_TOKEN"
      - run: npm ci
      - run: npm install --global apify-cli
      - run: apify push
