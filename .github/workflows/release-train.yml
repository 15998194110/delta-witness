name: DELTA Release Train

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  core-cloudflare:
    runs-on: ubuntu-latest
    if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - run: npm ci
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  partner-gateway:
    runs-on: ubuntu-latest
    if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' && secrets.DELTA_PARTNER_SECRET != '' }}
    defaults: { run: { working-directory: channels/partner-gateway } }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - run: npm ci
      - run: printf '%s' "$DELTA_PARTNER_SECRET" | npx wrangler secret put PARTNER_SECRET
        env:
          DELTA_PARTNER_SECRET: ${{ secrets.DELTA_PARTNER_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  npm-client:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: packages/js-client } }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with: { node-version: '22', registry-url: 'https://registry.npmjs.org' }
      - run: npm publish --access public
        # Configure npm Trusted Publishing for this workflow once; no long-lived token required.

  pypi-client:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: packages/python-client } }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - run: python -m pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        # Configure PyPI Trusted Publishing for this repository/workflow once.

  mcp-registry:
    runs-on: ubuntu-latest
    needs: [npm-client]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - run: node scripts/render-mcp-server.mjs
      - run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          ./mcp-publisher validate server.json
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish server.json

  postman:
    runs-on: ubuntu-latest
    if: ${{ secrets.POSTMAN_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - run: node scripts/postman-sync.mjs
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
          POSTMAN_WORKSPACE_ID: ${{ vars.POSTMAN_WORKSPACE_ID }}

  apify:
    runs-on: ubuntu-latest
    if: ${{ secrets.APIFY_TOKEN != '' }}
    defaults: { run: { working-directory: channels/apify } }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - run: npm ci
      - run: npm install -g apify-cli
      - run: apify push
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}

  chrome-extension:
    runs-on: ubuntu-latest
    if: ${{ secrets.CHROME_WEBSTORE_ACCESS_TOKEN != '' && vars.CHROME_EXTENSION_ID != '' }}
    steps:
      - uses: actions/checkout@v6
      - run: echo "Chrome package is intentionally gated until DELTA has a human checkout UX. Enable after channels/chrome-extension is added and the initial store listing/privacy setup is complete."
