name: TEMP DELTA current reconciliation retry 20260914-1138

on:
  push:
    paths:
      - '.github/workflows/tmp-auto-current-reconcile-retry-20260914-1138.yml'

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DELTA_PARTNER_SECRET: ${{ secrets.DELTA_PARTNER_SECRET }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - name: Check owner pricing policy
        run: node scripts/check-owner-pricing.mjs
      - name: Verify live public x402 pricing
        run: node scripts/verify-owner-pricing-live.mjs
      - name: Audit paid funnel candidates
        continue-on-error: true
        run: node scripts/query-revenue-candidates.mjs
      - name: Scan AgentPact demand
        if: always()
        continue-on-error: true
        run: node scripts/scan-agentpact-demand.mjs
      - name: Reconcile Base Treasury
        if: always()
        run: node scripts/reconcile-treasury.mjs
