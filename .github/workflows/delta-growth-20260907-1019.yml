name: DELTA growth evidence pulse

on:
  push:
    paths:
      - '.github/workflows/delta-growth-20260907-1019.yml'

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6

      - name: DELTA core production contract
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://delta-witness-api.ruphussten.workers.dev'
          curl -fsS --retry 3 --retry-all-errors "$BASE/health" >/tmp/health.json
          echo 'CORE_HEALTH='
          cat /tmp/health.json
          probe() {
            local path="$1" body="$2" expected="$3"
            local headers="/tmp/$(echo "$path" | tr '/-' '__').headers"
            local out="/tmp/$(echo "$path" | tr '/-' '__').json"
            local status
            status=$(curl -sS --retry 3 --retry-all-errors -o "$out" -D "$headers" -w '%{http_code}' -X POST "$BASE$path" -H 'content-type: application/json' -d "$body")
            echo "CORE_PROBE path=$path status=$status expected_usdc=$expected"
            test "$status" = '402'
            grep -qi '^payment-required:' "$headers"
            python3 - "$out" "$expected" <<'PY'
          import json,sys
          p=sys.argv[1]; expected=float(sys.argv[2])
          d=json.load(open(p))
          amount=None
          for k in ('price_usd','price','amount'):
              if k in d:
                  try: amount=float(d[k]); break
                  except: pass
          if amount is None:
              # canonical mirror body can place challenge in accepts
              xs=d.get('accepts') or []
              if xs:
                  raw=xs[0].get('maxAmountRequired') or xs[0].get('amount')
                  if raw is not None:
                      amount=float(raw)/(1_000_000 if float(raw)>1000 else 1)
          if amount is not None and abs(amount-expected)>1e-9:
              raise SystemExit(f'price_mismatch:{amount}!={expected}')
          print(json.dumps({'body_price_usd':amount,'x402Version':d.get('x402Version'),'accepts_count':len(d.get('accepts') or [])}))
          PY
          }
          probe '/v1/capture' '{"url":"https://example.com"}' '0.03'
          probe '/v1/preflight' '{"url":"https://example.com","expected":{"contains":["Example Domain"]}}' '0.03'
          probe '/v1/guarded-action-pilot' '{"urls":["https://example.com"]}' '10'

      - name: Base Treasury canonical USDC reconciliation
        shell: bash
        run: |
          set -u
          URL='https://base.blockscout.com/api/v2/addresses/0x1990e21bc219696ff7fbc26527dbaed335ac6367/token-transfers?type=ERC-20'
          if ! curl -sS --fail --retry 5 --retry-all-errors --connect-timeout 10 --max-time 45 "$URL" -o /tmp/transfers.json; then
            echo 'TREASURY_RECONCILIATION=degraded blockscout_unavailable'
            exit 0
          fi
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/transfers.json'))
          items=d.get('items',[])
          usdc='0x833589fcd6edb6e08f4c7c32d4f71b54bda02913'
          addr='0x1990e21bc219696ff7fbc26527dbaed335ac6367'
          out=[]
          for x in items:
              token=x.get('token') or {}
              ta=(token.get('address_hash') or token.get('address') or '').lower()
              to=((x.get('to') or {}).get('hash') if isinstance(x.get('to'),dict) else x.get('to') or '').lower()
              if ta != usdc or to != addr: continue
              dec=int(token.get('decimals') or 6)
              total=x.get('total') or {}
              raw=total.get('value') if isinstance(total,dict) else x.get('value')
              try: amount=int(raw)/(10**dec)
              except: amount=raw
              fr=(x.get('from') or {}).get('hash') if isinstance(x.get('from'),dict) else x.get('from')
              out.append({'tx_hash':x.get('transaction_hash'),'timestamp':x.get('timestamp'),'from':fr,'amount_usdc':amount})
          print('TREASURY_RESULT='+json.dumps(out[:50],separators=(',',':')))
          PY

      - name: agent-tools live directory and broker propagation
        continue-on-error: true
        shell: bash
        run: |
          set -u
          for u in \
            'https://agent-tools.cloud/api/v1/search?q=DELTA%20Witness&chain=base&limit=20' \
            'https://agent-tools.cloud/api/v1/mcp/search?q=delta-witness&limit=20' \
            'https://agent-tools.cloud/api/v1/resources/search?q=delta-witness&limit=20' \
            'https://agent-tools.cloud/api/v1/broker/recommend?q=preflight%20a%20browser%20purchase%20before%20an%20autonomous%20action&chain=base&max_price_usd=10&limit=20'; do
            echo "AGENT_TOOLS_URL=$u"
            curl -sS --fail --retry 3 --retry-all-errors --max-time 30 "$u" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(json.dumps(d,separators=(",",":"))[:24000])' || echo 'AGENT_TOOLS_DEGRADED'
          done

      - name: Agent402 refresh and semantic routes
        continue-on-error: true
        shell: bash
        run: |
          set -u
          echo 'AGENT402_REGISTER='
          curl -sS --fail --retry 3 --retry-all-errors --max-time 30 -X POST 'https://agent402.tools/api/index/register' -H 'content-type: application/json' -d '{"origin":"https://delta-witness-api.ruphussten.workers.dev"}' || echo 'AGENT402_REGISTER_DEGRADED'
          for q in 'guarded%20action%20pilot' 'preflight%20browser%20purchase' 'page-state%20proof'; do
            echo "AGENT402_ROUTE_Q=$q"
            curl -sS --fail --retry 3 --retry-all-errors --max-time 30 "https://agent402.tools/api/route?q=$q&network=base" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(json.dumps(d,separators=(",",":"))[:24000])' || echo 'AGENT402_ROUTE_DEGRADED'
            echo "AGENT402_FIND_Q=$q"
            curl -sS --fail --retry 3 --retry-all-errors --max-time 30 "https://agent402.tools/api/find?q=$q&network=base" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(json.dumps(d,separators=(",",":"))[:24000])' || echo 'AGENT402_FIND_DEGRADED'
          done

      - name: Coinbase Bazaar merchant discovery
        continue-on-error: true
        shell: bash
        run: |
          set -u
          node scripts/check-bazaar.mjs || echo 'BAZAAR_CHECK_DEGRADED'

      - name: PayanAgent funded compatible requests
        continue-on-error: true
        shell: bash
        run: |
          set -u
          if ! curl -sS --fail --retry 4 --retry-all-errors --max-time 35 'https://payanagent.com/api/v1/requests?status=open&limit=100' -o /tmp/requests.json; then
            echo 'PAYANAGENT=degraded'
            exit 0
          fi
          python3 - <<'PY'
          import json,re
          d=json.load(open('/tmp/requests.json'))
          rows=d.get('requests',d if isinstance(d,list) else [])
          terms=re.compile(r'(browser|url|web|verify|verification|evidence|preflight|audit|proof|page|shopping|procurement|workflow)',re.I)
          out=[]
          for r in rows:
              text=' '.join(str(r.get(k,'')) for k in ('title','description','inputPayload'))
              if terms.search(text):
                  out.append({k:r.get(k) for k in ('id','title','budgetMaxCents','escrow','status','createdAt')})
          print('PAYANAGENT_RESULT='+json.dumps({'open_count':len(rows),'compatible':out[:30]},separators=(',',':')))
          PY

      - name: true402 listing readback
        continue-on-error: true
        shell: bash
        run: |
          set -u
          for u in \
            'https://true402.com/api/v1/services/7e147a75-78fb-4ef3-b35b-538a599df023' \
            'https://true402.com/api/v1/services?search=DELTA%20Witness'; do
            echo "TRUE402_URL=$u"
            curl -sS --fail --retry 3 --retry-all-errors --max-time 30 "$u" | head -c 24000 || echo 'TRUE402_DEGRADED'
            echo
          done
