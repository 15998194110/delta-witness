name: TMP DELTA growth telemetry recheck 20260911 0728
on:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/tmp-growth-run-20260911-0728.yml"

permissions:
  contents: write

jobs:
  recheck:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DELTA_D1_DATABASE_ID: ${{ secrets.DELTA_D1_DATABASE_ID }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Re-read owner authority and verify live prices
        id: pricing
        shell: bash
        run: |
          set -euo pipefail
          test -s AGENTS.md
          test -s docs/pricing-policy-2026-09-10.md
          grep -q 'Public Capture.*1.00 USDC' docs/pricing-policy-2026-09-10.md
          grep -q 'Public Preflight.*5.00 USDC' docs/pricing-policy-2026-09-10.md
          grep -q 'Guarded-Action Pilot.*10.00 USDC' docs/pricing-policy-2026-09-10.md
          node scripts/check-owner-pricing.mjs
          node scripts/verify-owner-pricing-live.mjs | tee /tmp/pricing.txt
          echo 'status=verified' >> "$GITHUB_OUTPUT"

      - name: Reconcile Base Treasury independently
        id: treasury
        shell: bash
        run: |
          set -euo pipefail
          node scripts/reconcile-treasury.mjs | tee /tmp/treasury.json
          jq -e '.evidence_quality == "A_direct_canonical_USDC_log"' /tmp/treasury.json >/dev/null
          echo 'status=ok' >> "$GITHUB_OUTPUT"

      - name: Query fresh paid-funnel telemetry with canonical secrets
        id: telemetry
        shell: bash
        run: |
          set -euo pipefail
          node scripts/query-revenue-candidates.mjs | tee /tmp/revenue-candidates.json
          jq -e '.ok == true' /tmp/revenue-candidates.json >/dev/null
          echo "candidate_rows=$(jq -r '.candidate_rows' /tmp/revenue-candidates.json)" >> "$GITHUB_OUTPUT"
          echo 'status=ok' >> "$GITHUB_OUTPUT"

      - name: Read-only recheck AI Security Directory approval
        id: aisd
        shell: bash
        run: |
          set -u
          status='review_pending'
          for attempt in 1 2 3 4; do
            code=$(curl -L --connect-timeout 10 --max-time 30 -sS -o /tmp/aisd-vendors.json -w '%{http_code}' 'https://aisecuritydirectory.com/api/vendors.json' || printf '000')
            echo "AISD_READ attempt=$attempt http=$code"
            if [[ "$code" =~ ^2 ]]; then
              if grep -Eqi 'delta-witness-api\.ruphussten\.workers\.dev|DELTA Witness' /tmp/aisd-vendors.json; then status='live_public'; fi
              break
            fi
            if [[ "$code" == 429 || "$code" =~ ^5 || "$code" == 000 ]]; then sleep $((attempt * attempt)); continue; fi
            status="nonretryable_http_$code"; break
          done
          if [[ "$code" == 429 || "$code" =~ ^5 || "$code" == 000 ]]; then status='degraded_retries_exhausted'; fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "AISD_STATUS=$status"
        continue-on-error: true

      - name: Read-only recheck MadeWithStack approval
        id: mws
        shell: bash
        run: |
          set -u
          status='review_pending'
          encoded='DELTA%20Witness'
          for attempt in 1 2 3 4; do
            code=$(curl -L --connect-timeout 10 --max-time 30 -sS -o /tmp/mws-search.json -w '%{http_code}' "https://www.madewithstack.com/api/v1/search?q=$encoded" || printf '000')
            echo "MWS_READ attempt=$attempt http=$code"
            if [[ "$code" =~ ^2 ]]; then
              if grep -Eqi 'delta-witness-api\.ruphussten\.workers\.dev|DELTA Witness' /tmp/mws-search.json; then status='live_public'; fi
              break
            fi
            if [[ "$code" == 429 || "$code" =~ ^5 || "$code" == 000 ]]; then sleep $((attempt * attempt)); continue; fi
            status="nonretryable_http_$code"; break
          done
          if [[ "$code" == 429 || "$code" =~ ^5 || "$code" == 000 ]]; then status='degraded_retries_exhausted'; fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "MWS_STATUS=$status"
        continue-on-error: true

      - name: Persist telemetry/listing recheck evidence
        if: always()
        shell: bash
        env:
          PRICING_STATUS: ${{ steps.pricing.outputs.status }}
          TREASURY_STATUS: ${{ steps.treasury.outputs.status }}
          TELEMETRY_STATUS: ${{ steps.telemetry.outputs.status }}
          CANDIDATE_ROWS: ${{ steps.telemetry.outputs.candidate_rows }}
          AISD_STATUS: ${{ steps.aisd.outputs.status }}
          MWS_STATUS: ${{ steps.mws.outputs.status }}
        run: |
          set -euo pipefail
          mkdir -p distribution/evidence
          treasury='{}'; candidates='{}'
          if [ -s /tmp/treasury.json ] && jq -e . /tmp/treasury.json >/dev/null 2>&1; then treasury=$(cat /tmp/treasury.json); fi
          if [ -s /tmp/revenue-candidates.json ] && jq -e . /tmp/revenue-candidates.json >/dev/null 2>&1; then candidates=$(cat /tmp/revenue-candidates.json); fi
          jq -n \
            --arg checked_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg pricing "${PRICING_STATUS:-failed}" \
            --arg treasury_status "${TREASURY_STATUS:-failed}" \
            --arg telemetry "${TELEMETRY_STATUS:-failed}" \
            --arg candidate_rows "${CANDIDATE_ROWS:-unknown}" \
            --arg aisd "${AISD_STATUS:-unknown}" \
            --arg mws "${MWS_STATUS:-unknown}" \
            --argjson treasury "$treasury" \
            --argjson candidates "$candidates" \
            '{checked_at:$checked_at,owner_pricing:{capture_raw:1000000,public_preflight_raw:5000000,guarded_action_pilot_raw:10000000,status:$pricing},treasury:{status:$treasury_status,result:$treasury},telemetry:{status:$telemetry,candidate_rows:$candidate_rows,result:$candidates},pending_listing_recheck:{ai_security_directory:$aisd,made_with_stack:$mws},policy:{submission_writes_this_recheck:0,fees_paid:0,wallet_signatures:0,duplicate_identities_created:0}}' > distribution/evidence/growth-run-20260911-0728-telemetry-recheck.json
          cat distribution/evidence/growth-run-20260911-0728-telemetry-recheck.json
          git config user.name 'DELTA Growth Operator'
          git config user.email 'actions@users.noreply.github.com'
          git add distribution/evidence/growth-run-20260911-0728-telemetry-recheck.json
          git commit -m 'evidence: close DELTA telemetry gap 2026-09-11' || exit 0
          for attempt in 1 2 3; do
            git pull --rebase origin master && git push origin HEAD:master && exit 0
            sleep $((attempt * 2))
          done
          exit 1
