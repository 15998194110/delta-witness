name: TEMP DELTA Tollbooth Capture register 20260915
on:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/tmp-tollbooth-capture-register-20260915.yml"
permissions:
  contents: read
jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - name: Enforce current owner pricing
        run: |
          node scripts/check-owner-pricing.mjs
          node scripts/verify-owner-pricing-live.mjs
      - name: Dedupe and register canonical Capture
        shell: bash
        run: |
          set -euo pipefail
          API='https://www.trytollbooth.com/api/services'
          HOST='delta-witness-api.ruphussten.workers.dev'
          ENDPOINT='https://delta-witness-api.ruphussten.workers.dev/v1/capture'
          PAYTO='0x1990e21bc219696ff7fbc26527dbaed335ac6367'

          get_services() {
            curl -fsS --connect-timeout 10 --max-time 25 --retry 2 --retry-delay 2 --retry-all-errors "$API?q=$HOST"
          }

          BEFORE=$(get_services || true)
          printf '%s' "$BEFORE" > /tmp/toll-before.json
          node <<'NODE'
          const fs=require('fs');
          let j={}; try{j=JSON.parse(fs.readFileSync('/tmp/toll-before.json','utf8')||'{}')}catch{}
          const arr=Array.isArray(j)?j:(Array.isArray(j.services)?j.services:(Array.isArray(j.data)?j.data:[]));
          const target='https://delta-witness-api.ruphussten.workers.dev/v1/capture'.toLowerCase();
          const existing=arr.filter(x=>JSON.stringify(x).toLowerCase().includes(target)||JSON.stringify(x).toLowerCase().includes('delta witness'));
          console.log('TOLLBOOTH_PRECHECK '+JSON.stringify({returned:arr.length,existing_count:existing.length,existing}));
          process.exit(existing.length?0:10);
          NODE
          rc=$?
          if [ "$rc" -eq 0 ]; then
            echo 'TOLLBOOTH_RESULT {"status":"already_present","duplicate_avoided":true,"write_attempted":false}'
            exit 0
          fi
          if [ "$rc" -ne 10 ]; then exit "$rc"; fi

          cat >/tmp/payload.json <<'JSON'
          {
            "name": "DELTA Witness Capture — Public Page-State Evidence",
            "endpoint": "https://delta-witness-api.ruphussten.workers.dev/v1/capture",
            "category": "data",
            "priceUsdc": 1,
            "wallet": "0x1990e21bc219696ff7fbc26527dbaed335ac6367",
            "chain": "base",
            "description": "Capture a public webpage now and return timestamped, hash-addressed evidence for procurement terms, price or availability checkpoints, and browser-agent audit trails. x402 Base USDC; canonical price 1 USDC."
          }
          JSON

          STATUS=$(curl -sS --connect-timeout 10 --max-time 35 -o /tmp/post.json -w '%{http_code}' -X POST "$API" -H 'content-type: application/json' --data-binary @/tmp/payload.json || printf '000')
          echo "TOLLBOOTH_POST_HTTP $STATUS"
          cat /tmp/post.json 2>/dev/null || true
          echo

          sleep 3
          AFTER=$(get_services || true)
          printf '%s' "$AFTER" >/tmp/toll-after.json
          node <<'NODE'
          const fs=require('fs');
          let j={}; try{j=JSON.parse(fs.readFileSync('/tmp/toll-after.json','utf8')||'{}')}catch{}
          const arr=Array.isArray(j)?j:(Array.isArray(j.services)?j.services:(Array.isArray(j.data)?j.data:[]));
          const target='https://delta-witness-api.ruphussten.workers.dev/v1/capture'.toLowerCase();
          const rows=arr.filter(x=>JSON.stringify(x).toLowerCase().includes(target)||JSON.stringify(x).toLowerCase().includes('delta witness'));
          console.log('TOLLBOOTH_READBACK '+JSON.stringify({returned:arr.length,matching_count:rows.length,rows}));
          if(rows.length===0) process.exit(11);
          NODE
          rb=$?
          if [ "$rb" -eq 0 ]; then
            echo 'TOLLBOOTH_RESULT {"status":"present_after_write","duplicate_avoided":true,"write_attempted":true}'
            exit 0
          fi
          echo "TOLLBOOTH_RESULT {\"status\":\"not_present_after_write\",\"write_attempted\":true,\"post_http\":\"$STATUS\"}"
          exit 0