name: DELTA one-shot nohumans diagnostics
on:
  push:
    paths:
      - '.github/workflows/auto-growth-nohumans.yml'

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect nohumans probe diagnostics
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const ids = ['9acc2efd-b71','97b7e8b8-b62','50ce8a12-faa'];
          for (const id of ids) {
            try {
              const r = await fetch(`https://nohumans.directory/v1/listings/${id}`);
              if (!r.ok) { console.log(`NOHUMANS_CHANNEL_DEGRADED=${id}:HTTP_${r.status}`); continue; }
              const j = await r.json();
              const safe = {
                id:j.id,status:j.status,score:j.score,probe_count:j.probe_count,consecutive_failures:j.consecutive_failures,
                last_ok_at:j.last_ok_at,last_probed_at:j.last_probed_at,status_changed_at:j.status_changed_at,
                endpoint_url:j.endpoint_url,request_schema:j.request_schema,
                observed:j.observed || null,
                last_error:j.last_error || j.probe_error || j.last_probe_error || j.failure_reason || null,
                paid_verification:j.paid_verification?{status:j.paid_verification.status,verified:j.paid_verification.verified,error:j.paid_verification.error,tx_hash:j.paid_verification.tx_hash}:null
              };
              console.log(`NOHUMANS_DIAGNOSTIC=${JSON.stringify(safe)}`);
            } catch (e) { console.log(`NOHUMANS_CHANNEL_DEGRADED=${id}:${String(e.message||e)}`); }
          }
          NODE
