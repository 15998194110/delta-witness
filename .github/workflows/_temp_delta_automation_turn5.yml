name: DELTA Automation Turn 5
on:
  push:
    paths:
      - '.github/workflows/_temp_delta_automation_turn5.yml'

permissions:
  contents: read

jobs:
  advance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verify core before deploy
        run: |
          set -euo pipefail
          npm ci
          npm run verify
      - name: Restore standing 0.03 Preflight price in production
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx wrangler deploy
      - name: Probe production paid routes
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://delta-witness-api.ruphussten.workers.dev'
          probe() {
            name="$1"; path="$2"; body="$3"; expected="$4"
            code=$(curl --retry 4 --retry-delay 2 --retry-all-errors -sS -D "/tmp/${name}.headers" -o "/tmp/${name}.json" -w '%{http_code}' -X POST "$BASE$path" -H 'content-type: application/json' --data-binary "$body")
            echo "PROBE $name HTTP=$code"
            cat "/tmp/${name}.json"; echo
            test "$code" = "402"
            jq -e --argjson expected "$expected" '(.price_usd == $expected) or (.error == "payment_required")' "/tmp/${name}.json" >/dev/null
            grep -Ei '^(payment-required|x-payment-required|content-type):' "/tmp/${name}.headers" || true
          }
          probe capture '/v1/capture' '{"url":"https://example.com"}' 0.03
          probe preflight '/v1/preflight' '{"url":"https://example.com","expected":{"contains":["Example Domain"]}}' 0.03
          probe pilot '/v1/guarded-action-pilot' '{"urls":["https://example.com"],"intent":"verify public page state before autonomous action"}' 10
          echo 'HEALTH'; curl --retry 4 --retry-delay 2 --retry-all-errors -fsS "$BASE/health"; echo
      - name: Reconcile Treasury independently
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const treasury = '0x1990e21bc219696ff7fbc26527dbaed335ac6367'.toLowerCase();
          const usdc = '0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913'.toLowerCase();
          const firstBlock = 50985188;
          const topic0 = '0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef';
          const topic2 = '0x' + treasury.slice(2).padStart(64, '0');
          const rpcs = ['https://mainnet.base.org','https://base-rpc.publicnode.com'];
          async function rpc(url, method, params) {
            const r = await fetch(url,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method,params})});
            if(!r.ok) throw new Error(`${url} HTTP ${r.status}`);
            const j=await r.json(); if(j.error) throw new Error(JSON.stringify(j.error)); return j.result;
          }
          let used, latest;
          for (const url of rpcs) { try { latest = Number(BigInt(await rpc(url,'eth_blockNumber',[]))); used=url; break; } catch(e) { console.error('RPC_DEGRADED',url,String(e)); } }
          if(!used) throw new Error('all Base RPCs unavailable');
          const logs=[];
          for(let from=firstBlock; from<=latest; from+=50000){
            const to=Math.min(from+49999,latest);
            const filter={address:usdc,fromBlock:'0x'+from.toString(16),toBlock:'0x'+to.toString(16),topics:[topic0,null,topic2]};
            let chunk;
            try { chunk=await rpc(used,'eth_getLogs',[filter]); }
            catch(e){
              const alt=rpcs.find(x=>x!==used);
              if(!alt) throw e;
              console.error('RPC_LOG_FALLBACK',String(e));
              chunk=await rpc(alt,'eth_getLogs',[filter]);
            }
            logs.push(...chunk);
          }
          const rows=logs.map(x=>({block:Number(BigInt(x.blockNumber)),tx:x.transactionHash,from:'0x'+x.topics[1].slice(-40),to:'0x'+x.topics[2].slice(-40),raw:BigInt(x.data).toString(),usdc:Number(BigInt(x.data))/1e6}));
          console.log('TREASURY_RPC', used, 'LATEST_BLOCK', latest);
          console.log('TREASURY_INCOMING_USDC', JSON.stringify(rows));
          console.log('TREASURY_TOTAL_USDC', rows.reduce((s,x)=>s+x.usdc,0));
          NODE
      - name: Reconcile DELTA telemetry independently
        shell: bash
        run: |
          set -euo pipefail
          DB='c9431b00-27c5-4609-9f3d-6af20cb162df'
          SQL="SELECT id,created_at,event,route,channel,partner,success,reason,gross_usd,browser_ms,storage_bytes,variable_cost_usd,contribution_margin_usd FROM telemetry_events WHERE created_at > '2026-09-07 05:42:06' AND event IN ('payment_verified','capture_started','capture_completed','capture_failed','proof_opened','repeat_call') ORDER BY id ASC"
          jq -n --arg sql "$SQL" '{sql:$sql}' >/tmp/d1.json
          curl --retry 4 --retry-delay 2 --retry-all-errors -fsS --max-time 30 \
            -X POST "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DB}/query" \
            -H "authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'content-type: application/json' \
            --data-binary @/tmp/d1.json | jq '{success,errors,result:[.result[]|{success,results}]}'
      - name: Inspect free listing forms for direct programmatic submission
        shell: bash
        run: |
          set -u
          for spec in 'agentndx|https://agentndx.ai/submit/' 'payapi|https://payapi.market/list'; do
            name=${spec%%|*}; url=${spec#*|}
            echo "FORM_INSPECT_BEGIN $name $url"
            curl --retry 3 --retry-delay 2 --retry-all-errors -LsS --max-time 30 "$url" -o "/tmp/${name}.html" || { echo "FORM_FETCH_DEGRADED $name"; continue; }
            python - "$name" "/tmp/${name}.html" <<'PY'
          import sys
          from html.parser import HTMLParser
          name,path=sys.argv[1],sys.argv[2]
          class P(HTMLParser):
              def handle_starttag(self, tag, attrs):
                  if tag in {'form','input','textarea','select','button'}:
                      d=dict(attrs)
                      print(name, tag, {k:d.get(k) for k in ('action','method','name','type','value','id') if d.get(k) is not None})
          p=P(); p.feed(open(path,encoding='utf-8',errors='ignore').read())
          PY
            echo "FORM_INSPECT_END $name"
          done
