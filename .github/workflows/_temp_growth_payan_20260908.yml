name: DELTA PayanAgent Growth Temp
on:
  push:
    paths:
      - '.github/workflows/_temp_growth_payan_20260908.yml'

permissions:
  contents: read

jobs:
  growth:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Advance PayanAgent and reconcile DELTA
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://delta-witness-api.ruphussten.workers.dev'
          TREASURY='0x1990e21bc219696ff7fbc26527dbaed335ac6367'
          USDC='0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913'
          PAYAN='https://payanagent.com'

          retry_get() {
            curl --retry 4 --retry-delay 2 --retry-all-errors -fsS --max-time 30 "$1"
          }

          echo '=== CORE_PRODUCTION ==='
          retry_get "$BASE/health" | jq -c .
          for route in capture preflight guarded-action-pilot; do
            case "$route" in
              capture) body='{"url":"https://example.com"}' ;;
              preflight) body='{"url":"https://example.com","expected":{"contains":["Example Domain"]}}' ;;
              guarded-action-pilot) body='{"urls":["https://example.com"],"preflight":{"url_index":0,"expected":{"contains":["Example Domain"]}}}' ;;
            esac
            code=$(curl --retry 3 --retry-delay 2 --retry-all-errors -sS --max-time 30 -o "/tmp/${route}.body" -D "/tmp/${route}.headers" -w '%{http_code}' -X POST "$BASE/v1/$route" -H 'content-type: application/json' --data-binary "$body" || true)
            hdr=$(grep -i -E '^(payment-required|x-payment-required):' "/tmp/${route}.headers" | head -1 | cut -d: -f1 || true)
            echo "CORE route=$route http=$code payment_header=${hdr:-none}"
          done

          echo '=== PAYAN_PUBLIC_DISCOVERY ==='
          discover_code=$(curl --retry 4 --retry-delay 2 --retry-all-errors -sS --max-time 30 -o /tmp/payan-discover.json -w '%{http_code}' "$PAYAN/api/v1/discover?q=DELTA%20Witness&limit=50" || true)
          echo "PAYAN_DISCOVER_HTTP=$discover_code"
          if [ "$discover_code" = 200 ]; then
            jq '{agents:[(.agents // [])[] | {id:(.id // .agentId),name,walletAddress,agentUrl,providerType,tags}],offers:[(.offers // [])[] | {id,title,priceUsd,buyUrl,category,status}],openRequests:[(.openRequests // [])[] | {id,title,budgetMaxCents,escrow,status}]}' /tmp/payan-discover.json
          fi

          offers_code=$(curl --retry 4 --retry-delay 2 --retry-all-errors -sS --max-time 30 -o /tmp/payan-offers-before.json -w '%{http_code}' "$PAYAN/api/v1/offers?q=DELTA%20Witness&limit=50" || true)
          echo "PAYAN_OFFERS_BEFORE_HTTP=$offers_code"
          if [ "$offers_code" = 200 ]; then
            jq '{offers:[(.offers // .items // [])[] | {id,title,priceUsd,buyUrl,category,status}]}' /tmp/payan-offers-before.json
          fi

          existing_agent=''
          if [ "$discover_code" = 200 ]; then
            existing_agent=$(jq -r '[.agents // [] | .[] | select(((.name // "")|ascii_downcase|contains("delta witness")) or ((.agentUrl // "")|contains("delta-witness-api.ruphussten.workers.dev"))) | (.id // .agentId)] | first // empty' /tmp/payan-discover.json)
          fi

          existing_offer_count=0
          if [ "$offers_code" = 200 ]; then
            existing_offer_count=$(jq '[.offers // .items // [] | .[] | select(((.title // "")|ascii_downcase|contains("delta witness")))] | length' /tmp/payan-offers-before.json)
          fi

          if [ -z "$existing_agent" ] && [ "$existing_offer_count" -eq 0 ]; then
            echo 'PAYAN_ACTION=register_provider_and_offers'
            cat >/tmp/agent.json <<JSON
          {"name":"DELTA Witness","description":"Independent browser verification and preflight trust layer for autonomous actions. Produces timestamped public-page evidence and deterministic change/expectation checks, paid per call with x402 USDC on Base.","walletAddress":"$TREASURY","chain":"base","tags":["x402","browser-verification","preflight","proof","agent-safety"],"providerType":"api","agentUrl":"$BASE"}
          JSON
            reg_ok=0
            for attempt in 1 2 3 4; do
              reg_code=$(curl -sS --max-time 30 -o /tmp/payan-register.json -w '%{http_code}' -X POST "$PAYAN/api/v1/agents" -H 'content-type: application/json' --data-binary @/tmp/agent.json || true)
              if [[ "$reg_code" =~ ^20[0-9]$ ]]; then reg_ok=1; break; fi
              echo "PAYAN_REGISTER_ATTEMPT=$attempt HTTP=$reg_code"
              sleep $((attempt*2))
            done
            if [ "$reg_ok" -eq 1 ]; then
              agent_id=$(jq -r '.agentId // .id // empty' /tmp/payan-register.json)
              api_key=$(jq -r '.apiKey // empty' /tmp/payan-register.json)
              api_prefix=$(jq -r '.apiKeyPrefix // empty' /tmp/payan-register.json)
              echo "PAYAN_REGISTERED agent_id=$agent_id api_key_prefix=$api_prefix"
              if [ -n "$api_key" ]; then
                make_offer() {
                  local title="$1" desc="$2" category="$3" price="$4" url="$5" verify="$6"
                  jq -n --arg title "$title" --arg description "$desc" --arg category "$category" --argjson price "$price" --arg externalUrl "$url" --argjson verificationBody "$verify" '{title:$title,description:$description,category:$category,tags:["delta-witness","x402","base","usdc","autonomous-agents"],priceCents:$price,offerType:"api",externalUrl:$externalUrl,httpMethod:"POST",verificationBody:$verificationBody}' >/tmp/offer.json
                  local code
                  code=$(curl --retry 3 --retry-delay 2 --retry-all-errors -sS --max-time 30 -o /tmp/offer-response.json -w '%{http_code}' -X POST "$PAYAN/api/v1/offers" -H "Authorization: Bearer $api_key" -H 'content-type: application/json' --data-binary @/tmp/offer.json || true)
                  echo "PAYAN_OFFER_HTTP=$code title=$title"
                  if [[ "$code" =~ ^20[0-9]$ ]]; then jq '{id:(.offerId // .id),title:(.title // .offer.title),status:(.status // .offer.status),buyUrl:(.buyUrl // .offer.buyUrl),priceUsd:(.priceUsd // .offer.priceUsd)}' /tmp/offer-response.json; else jq 'del(.apiKey,.key,.token)' /tmp/offer-response.json 2>/dev/null || cat /tmp/offer-response.json; fi
                }
                make_offer 'DELTA Witness — Capture' 'Preserve what a public webpage says now with browser-rendered evidence, timestamped artifact hashes and a public verifier.' 'Developer Tools' 3 "$BASE/v1/capture" '{"url":"https://example.com"}'
                make_offer 'DELTA Witness — Preflight' 'Verify a fresh public-source observation against deterministic text/hash expectations before an autonomous action.' 'Security' 3 "$BASE/v1/preflight" '{"url":"https://example.com","expected":{"contains":["Example Domain"]}}'
                make_offer 'DELTA Witness — Guarded Action Pilot' 'A $10 guarded-action pilot: capture 1-3 public URLs and optionally run one deterministic preflight check before browser, shopping, procurement, coding or workflow actions.' 'Security' 1000 "$BASE/v1/guarded-action-pilot" '{"urls":["https://example.com"],"preflight":{"url_index":0,"expected":{"contains":["Example Domain"]}}}'
                unset api_key
              else
                echo 'PAYAN_REGISTERED_BUT_API_KEY_MISSING=true'
              fi
            else
              echo 'PAYAN_REGISTER_DEGRADED=true'
              jq 'del(.apiKey,.key,.token)' /tmp/payan-register.json 2>/dev/null || true
            fi
          else
            echo "PAYAN_ACTION=skip_duplicate existing_agent=${existing_agent:-none} existing_offer_count=$existing_offer_count"
          fi

          echo '=== PAYAN_READBACK ==='
          final_offers_code=$(curl --retry 4 --retry-delay 2 --retry-all-errors -sS --max-time 30 -o /tmp/payan-offers-after.json -w '%{http_code}' "$PAYAN/api/v1/offers?q=DELTA%20Witness&limit=50" || true)
          echo "PAYAN_OFFERS_AFTER_HTTP=$final_offers_code"
          if [ "$final_offers_code" = 200 ]; then
            jq '{offers:[(.offers // .items // [])[] | {id,title,priceUsd,buyUrl,category,status,seller:(.seller.name // .sellerName)}]}' /tmp/payan-offers-after.json
          fi

          echo '=== PAYAN_FUNDED_REQUESTS ==='
          req_code=$(curl --retry 4 --retry-delay 2 --retry-all-errors -sS --max-time 30 -o /tmp/payan-requests.json -w '%{http_code}' "$PAYAN/api/v1/requests?status=open&limit=100" || true)
          echo "PAYAN_REQUESTS_HTTP=$req_code"
          if [ "$req_code" = 200 ]; then
            jq '{count:((.requests // .items // [])|length),compatible:[(.requests // .items // [])[] | select(.escrow == true) | select((((.title // "")+" "+(.description // "")+" "+(.inputPayload // ""))|ascii_downcase|test("browser|web|url|proof|verification|verify|preflight|capture|audit|evidence|terms|procurement|shopping|agent"))) | {id,title,description,budgetMaxCents,escrow,status,bidCount:(.bidCount // 0),createdAt}]}' /tmp/payan-requests.json
          fi

          echo '=== TREASURY_RECONCILIATION ==='
          tcode=$(curl --retry 4 --retry-delay 2 --retry-all-errors -sS --max-time 30 -o /tmp/treasury.json -w '%{http_code}' "https://base.blockscout.com/api/v2/addresses/$TREASURY/token-transfers?type=ERC-20" || true)
          echo "TREASURY_HTTP=$tcode"
          if [ "$tcode" = 200 ]; then
            jq --arg t "${TREASURY,,}" --arg u "${USDC,,}" '[.items[] | select(((.to.hash // .to // "")|ascii_downcase)==$t) | select(((.token.address_hash // .token.address // "")|ascii_downcase)==$u) | {timestamp,transaction_hash,from:(.from.hash // .from),value_raw:.total.value,decimals:.total.decimals}] | .[:20]' /tmp/treasury.json
          fi
