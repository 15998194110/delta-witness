name: DELTA Growth Listings 2026-09-10 19:00

on:
  push:
    paths:
      - '.github/workflows/delta-growth-listings-20260910-1900.yml'

permissions:
  contents: read

jobs:
  growth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Verify DELTA core production integrity
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          git checkout --detach origin/master
          BASE='https://delta-witness-api.ruphussten.workers.dev'
          TREASURY='0x1990e21bc219696ff7fbc26527dbaed335ac6367'
          probe() {
            local name="$1" path="$2" expected="$3"
            code=$(curl --connect-timeout 10 --max-time 30 --retry 3 --retry-all-errors --retry-delay 2 -sS -o /tmp/body -D /tmp/headers -w '%{http_code}' -X POST "$BASE$path" -H 'content-type: application/json' -d '{}')
            hdr=$(awk 'BEGIN{IGNORECASE=1} /^payment-required:/{sub(/^[^:]+:[[:space:]]*/,""); gsub(/\r/,""); print; exit}' /tmp/headers)
            test -n "$hdr"
            decoded=$(printf '%s' "$hdr" | base64 -d)
            amount=$(printf '%s' "$decoded" | jq -r '.. | .amount? // empty' | head -1)
            payto=$(printf '%s' "$decoded" | jq -r '.. | .payTo? // empty' | head -1)
            network=$(printf '%s' "$decoded" | jq -r '.. | .network? // empty' | head -1)
            echo "CORE product=$name status=$code amount=$amount expected=$expected payTo=$payto network=$network"
            test "$code" = 402
            test "$amount" = "$expected"
            test "${payto,,}" = "$TREASURY"
            test "$network" = 'eip155:8453'
          }
          probe capture '/v1/capture' 30000
          probe preflight '/v1/preflight' 30000
          probe pilot '/v1/guarded-action-pilot' 10000000
          curl --fail --connect-timeout 10 --max-time 30 --retry 3 --retry-all-errors --retry-delay 2 "$BASE/health"

      - name: Register DELTA endpoints on x402 Arena
        if: success()
        shell: bash
        run: |
          set -u
          API='https://core.x402arena.gg'
          TREASURY='0x1990e21bc219696ff7fbc26527dbaed335ac6367'
          list=''
          for i in 1 2 3; do
            list=$(curl --connect-timeout 10 --max-time 30 -fsS "$API/operator/agents" 2>/tmp/arena-read.err) && break
            echo "ARENA read_attempt=$i degraded=$(cat /tmp/arena-read.err 2>/dev/null || true)"
            sleep $((i*2))
          done
          register() {
            local name="$1" endpoint="$2" niche="$3" desc="$4"
            if [ -n "$list" ] && printf '%s' "$list" | jq -e --arg ep "$endpoint" '.. | objects | select((.endpoint? // .url? // "") == $ep)' >/dev/null 2>&1; then
              echo "ARENA listing_status=already_present endpoint=$endpoint"
              return 0
            fi
            payload=$(jq -nc --arg name "$name" --arg endpoint "$endpoint" --arg niche "$niche" --arg description "$desc" --arg walletAddress "$TREASURY" '{name:$name,endpoint:$endpoint,niche:$niche,description:$description,walletAddress:$walletAddress}')
            code='000'
            : >/tmp/arena-submit.json
            for i in 1 2 3; do
              code=$(curl --connect-timeout 10 --max-time 30 -sS -o /tmp/arena-submit.json -w '%{http_code}' -X POST "$API/register" -H 'content-type: application/json' --data "$payload") || code=000
              echo "ARENA submit_attempt=$i endpoint=$endpoint http=$code body=$(cat /tmp/arena-submit.json 2>/dev/null || true)"
              case "$code" in 200|201|202|204|409) break;; 429|500|502|503|504|000) sleep $((i*3));; *) break;; esac
            done
            case "$code" in 200|201|202|204|409) echo "ARENA listing_status=accepted endpoint=$endpoint";; *) echo "ARENA channel=degraded recoverable=true endpoint=$endpoint http=$code";; esac
          }
          register 'delta-witness-capture' 'https://delta-witness-api.ruphussten.workers.dev/v1/capture' 'developer-tools' 'Timestamped public-web evidence for autonomous agents, paid with x402 Base USDC.'
          register 'delta-witness-preflight' 'https://delta-witness-api.ruphussten.workers.dev/v1/preflight' 'agent-safety' 'Deterministic preflight verification before consequential autonomous actions, paid with x402 Base USDC.'
          register 'delta-witness-guarded-action-pilot' 'https://delta-witness-api.ruphussten.workers.dev/v1/guarded-action-pilot' 'agent-safety' 'Higher-value guarded-action evidence pilot for consequential agent workflows, paid with x402 Base USDC.'
          sleep 3
          verify=$(curl --connect-timeout 10 --max-time 30 -fsS "$API/operator/agents" 2>/tmp/arena-verify.err || true)
          if [ -n "$verify" ]; then
            printf '%s' "$verify" | jq -c '.. | objects | select(((.endpoint? // .url? // "") | contains("delta-witness-api.ruphussten.workers.dev"))) | {name,endpoint,url,niche,revenue,queries,buyers,status}' | head -20 || true
          else
            echo "ARENA verification=deferred recoverable=true reason=$(cat /tmp/arena-verify.err 2>/dev/null || true)"
          fi
          exit 0

      - name: Register DELTA endpoints on x402dash
        if: success()
        shell: bash
        run: |
          set -u
          API='https://api.x402dash.com'
          FALLBACK='https://api.x402market.shop'
          register() {
            local name="$1" endpoint="$2" category="$3" tags="$4"
            payload=$(jq -nc --arg url "$endpoint" --arg name "$name" --arg description 'DELTA Witness trust layer for autonomous actions: timestamped evidence, deterministic preflight, and guarded-action verification on Base.' --arg category "$category" --arg tags "$tags" --arg contact 'ruphussten85@gmail.com' '{url:$url,name:$name,description:$description,category:$category,tags:($tags|split(",")),contact:$contact}')
            code='000'
            : >/tmp/dash-submit.json
            base="$API"
            for i in 1 2 3; do
              code=$(curl --connect-timeout 10 --max-time 30 -sS -o /tmp/dash-submit.json -w '%{http_code}' -X POST "$base/v1/register" -H 'content-type: application/json' --data "$payload") || code=000
              echo "X402DASH submit_attempt=$i base=$base endpoint=$endpoint http=$code body=$(cat /tmp/dash-submit.json 2>/dev/null || true)"
              case "$code" in 200|201|202|204|409) break;; 429|500|502|503|504|000) if [ "$i" = 2 ]; then base="$FALLBACK"; fi; sleep $((i*3));; *) break;; esac
            done
            case "$code" in 200|201|202|204|409) echo "X402DASH listing_status=accepted endpoint=$endpoint";; *) echo "X402DASH channel=degraded recoverable=true endpoint=$endpoint http=$code";; esac
          }
          register 'DELTA Witness Capture' 'https://delta-witness-api.ruphussten.workers.dev/v1/capture' 'Developer Tools' 'evidence,web-capture,agent-trust,x402,base'
          register 'DELTA Witness Preflight' 'https://delta-witness-api.ruphussten.workers.dev/v1/preflight' 'Security' 'preflight,agent-safety,verification,x402,base'
          register 'DELTA Witness Guarded Action Pilot' 'https://delta-witness-api.ruphussten.workers.dev/v1/guarded-action-pilot' 'Security' 'guarded-action,audit,evidence,x402,base'
          sleep 5
          for base in "$API" "$FALLBACK"; do
            out=$(curl --connect-timeout 10 --max-time 30 -fsS "$base/v1/endpoints?limit=50&provider=delta-witness-api.ruphussten.workers.dev" 2>/tmp/dash-verify.err || true)
            if [ -n "$out" ]; then
              echo "X402DASH discovery_base=$base"
              printf '%s' "$out" | jq -c '.items[]? | select(((.url? // .endpoint? // "") | contains("delta-witness-api.ruphussten.workers.dev"))) | {url,endpoint,name,liveness_score,integration_readiness,price_usd,network,onchain_tx_count_30d,onchain_unique_payers_30d}' | head -20 || true
              break
            fi
            echo "X402DASH verify_degraded base=$base reason=$(cat /tmp/dash-verify.err 2>/dev/null || true)"
          done
          exit 0

      - name: Reconcile Base Treasury independently
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          node scripts/reconcile-treasury.mjs
