name: DELTA 402 Index one-shot listing

on:
  push:
    paths:
      - '.github/workflows/402index-list-once.yml'

permissions:
  contents: read

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Register DELTA production x402 services
        shell: bash
        run: |
          set -u
          INDEX='https://402index.io/api/v1'
          API='https://delta-witness-api.ruphussten.workers.dev'
          TREASURY='0x1990e21bc219696ff7fbc26527dbaed335ac6367'

          submit () {
            local name="$1" url="$2" probe="$3"
            body=$(python3 - "$name" "$url" "$probe" <<'PY'
          import json,sys
          name,url,probe=sys.argv[1:]
          print(json.dumps({
            "url": url,
            "name": name,
            "protocol": "x402",
            "http_method": "POST",
            "provider": "DELTA Witness",
            "probe_body": probe
          }))
          PY
            )
            tmp=$(mktemp)
            code=$(curl -sS --retry 4 --retry-all-errors --connect-timeout 5 --max-time 30 \
              -o "$tmp" -w '%{http_code}' -H 'content-type: application/json' \
              -X POST "$INDEX/register" -d "$body" || echo 000)
            echo "INDEX402_REGISTER_HTTP=$code NAME=$name"
            python3 - "$tmp" <<'PY'
          import json,sys
          try:
              d=json.load(open(sys.argv[1]))
              safe={k:d.get(k) for k in ('success','id','service_id','name','url','status','message','verified','health_status','probe_status','protocol','price_usd','payment_network','source','review_status') if k in d}
              print('INDEX402_REGISTER_RESPONSE='+json.dumps(safe,separators=(',',':')))
          except Exception:
              print('INDEX402_REGISTER_RESPONSE_NONJSON')
          PY
          }

          submit 'DELTA Witness — Page-State Proof' "$API/v1/capture" '{"url":"https://example.com"}'
          submit 'DELTA Witness — Preflight Verification' "$API/v1/preflight" '{"url":"https://example.com","expected":{"contains":["Example Domain"]}}'
          submit 'DELTA Witness — Guarded Action Pilot' "$API/v1/guarded-action-pilot" '{"url":"https://example.com","action":{"type":"navigate","target":"https://example.com"}}'

          # Public catalogue readback. This is diagnostic and cannot block Treasury reconciliation.
          for qs in 'search=DELTA%20Witness&limit=50' 'provider=DELTA%20Witness&limit=50' 'q=DELTA%20Witness&limit=50'; do
            tmp=$(mktemp)
            code=$(curl -sS --retry 3 --retry-all-errors --connect-timeout 5 --max-time 30 \
              -o "$tmp" -w '%{http_code}' "$INDEX/services?$qs" || echo 000)
            echo "INDEX402_READBACK_HTTP=$code QUERY=$qs"
            if [ "$code" = '200' ]; then
              python3 - "$tmp" <<'PY'
          import json,sys
          try:d=json.load(open(sys.argv[1]))
          except Exception:
              print('INDEX402_READBACK_NONJSON');raise SystemExit
          rows=d.get('services',d if isinstance(d,list) else [])
          hits=[]
          for r in rows:
              text=' '.join(str(r.get(k,'')) for k in ('name','provider','url')).lower()
              if 'delta witness' in text or 'delta-witness-api.ruphussten.workers.dev' in text:
                  hits.append({k:r.get(k) for k in ('id','name','provider','url','protocol','price_usd','payment_network','health_status','probe_status','source','registered_at','review_status')})
          print('INDEX402_READBACK='+json.dumps({'hit_count':len(hits),'hits':hits[:10]},separators=(',',':')))
          PY
            fi
          done

          # Treasury reconciliation is isolated from listing/readback health.
          TURL="https://base.blockscout.com/api/v2/addresses/$TREASURY/token-transfers?type=ERC-20"
          if curl -sS --fail --retry 4 --retry-all-errors --connect-timeout 5 --max-time 30 "$TURL" -o /tmp/transfers.json; then
            python3 - <<'PY'
          import json
          d=json.load(open('/tmp/transfers.json'))
          usdc='0x833589fcd6edb6e08f4c7c32d4f71b54bda02913'
          addr='0x1990e21bc219696ff7fbc26527dbaed335ac6367'
          out=[]
          for x in d.get('items',[]):
              token=x.get('token') or {}
              ta=(token.get('address_hash') or token.get('address') or '').lower()
              tov=x.get('to') or {}; to=(tov.get('hash') if isinstance(tov,dict) else tov or '').lower()
              if ta != usdc or to != addr: continue
              total=x.get('total') or {}; raw=total.get('value') if isinstance(total,dict) else x.get('value')
              dec=int(token.get('decimals') or 6)
              try: amount=int(raw)/(10**dec)
              except Exception: amount=raw
              fr=x.get('from') or {}; fr=fr.get('hash') if isinstance(fr,dict) else fr
              out.append({'tx_hash':x.get('transaction_hash'),'timestamp':x.get('timestamp'),'from':fr,'amount_usdc':amount})
          print('TREASURY_RESULT='+json.dumps(out[:20],separators=(',',':')))
          PY
          else
            echo 'TREASURY_RECONCILIATION_DEGRADED'
          fi
