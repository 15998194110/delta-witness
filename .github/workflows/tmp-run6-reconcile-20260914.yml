name: Temporary DELTA run6 reconciliation
on:
  push:
    paths:
      - '.github/workflows/tmp-run6-reconcile-20260914.yml'
permissions:
  contents: read
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Check owner pricing policy
        run: node scripts/check-owner-pricing.mjs
      - name: Verify live public prices without payment
        run: node scripts/verify-owner-pricing-live.mjs
      - name: Scan AgentPact current seller and funded demand
        run: node scripts/scan-agentpact-demand.mjs
      - name: Query DELTA revenue candidates
        run: node scripts/query-revenue-candidates.mjs
      - name: Reconcile Base Treasury independently
        run: node scripts/reconcile-treasury.mjs
