name: Temporary 0xWork funded-demand scan
on:
  push:
    paths:
      - '.github/workflows/tmp-0xwork-scan-20260914.yml'
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Discover open 0xWork tasks without wallet
        shell: bash
        run: |
          set +e
          echo 'ZEROXWORK_DISCOVERY_BEGIN'
          npx --yes @0xwork/cli@1.7.13 discover --json
          code=$?
          echo "ZEROXWORK_DISCOVERY_EXIT=$code"
          echo 'ZEROXWORK_DISCOVERY_END'
          exit 0
