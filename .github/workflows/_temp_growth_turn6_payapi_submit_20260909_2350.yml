name: DELTA PayAPI Missing Listings + Reconcile

on:
  push:
    paths:
      - '.github/workflows/_temp_growth_turn6_payapi_submit_20260909_2350.yml'

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Submit only missing free listings and verify current state
        shell: bash
        run: |
          set -u
          node <<'NODE'
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function req(url,opts={},tries=4){let last;for(let i=0;i<tries;i++){try{const ac=new AbortController();const t=setTimeout(()=>ac.abort(),30000);const r=await fetch(url,{...opts,signal:ac.signal,headers:{'user-agent':'DELTA-Witness-Distribution/0.7 (+https://delta-witness-api.ruphussten.workers.dev)',...(opts.headers||{})}});clearTimeout(t);const text=await r.text();if((r.status===429||r.status>=500)&&i<tries-1){last={status:r.status,text};await sleep(500*2**i);continue}return{status:r.status,text,headers:Object.fromEntries(r.headers)}}catch(e){last={error:String(e)};if(i<tries-1)await sleep(500*2**i)}}return last}
          const parse=t=>{try{return JSON.parse(t)}catch{return null}};
          const PAY='https://payapi.market';
          const ORIGIN='https://delta-witness-api.ruphussten.workers.dev';
          const TREASURY='0x1990e21bc219696ff7fbc26527dbaed335ac6367';
          const provider={name:'DELTA Witness',email:'ruphussten@163.com',company_name:'Ruphus Sten Studio',wallet_address:TREASURY};
          const targets=[
            {key:'capture',search:'DELTA Witness Capture',api:{name:'DELTA Witness Capture',description:'Capture deterministic public-web evidence with normalized observation, signed proof, and content hashes. x402 on Base USDC, no API key.',category:'Verification',base_url:ORIGIN+'/v1/capture',mcp_endpoint:'',endpoints_count:1,tools_count:0,price_min:'0.03',price_max:'0.03'}},
            {key:'pilot',search:'DELTA Witness Guarded-Action Pilot',api:{name:'DELTA Witness Guarded-Action Pilot',description:'Guard higher-value autonomous actions with preflight, capture, signed proof, and telemetry. x402 on Base USDC; production price $10.',category:'Verification',base_url:ORIGIN+'/v1/guarded-action-pilot',mcp_endpoint:'',endpoints_count:1,tools_count:0,price_min:'10',price_max:'10'}}
          ];
          console.log('=== PREFLIGHT_DETAIL ===');
          for(const id of ['delta-witness','ceefcd83-fe34-462e-b919-76ed2431abc1']){const r=await req(`${PAY}/agent/get?id=${encodeURIComponent(id)}`);console.log(id,r.status,r.text.slice(0,20000));}
          console.log('=== DUPLICATE_GUARD_AND_SUBMIT ===');
          for(const t of targets){
            const searches=[t.search,t.api.base_url,ORIGIN]; let found=[];
            for(const q of searches){const r=await req(`${PAY}/agent/search?q=${encodeURIComponent(q)}&verified_only=false&limit=100`);const j=parse(r.text); console.log('SEARCH',t.key,q,r.status,r.text.slice(0,12000)); if(j?.results) found.push(...j.results)}
            const dedup=[...new Map(found.map(x=>[x.id||x.slug,x])).values()];
            const exact=dedup.filter(x=>String(x.base_url||'').replace(/\/$/,'')===t.api.base_url || String(x.name||'').toLowerCase()===t.api.name.toLowerCase());
            if(exact.length){console.log('SKIP_EXISTING',t.key,JSON.stringify(exact));continue}
            const body={provider,api:t.api,tier:'free'};
            const r=await req(`${PAY}/api/submit-listing`,{method:'POST',headers:{'content-type':'application/json','accept':'application/json'},body:JSON.stringify(body)},5);
            console.log('SUBMIT',t.key,'STATUS',r.status,'BODY',r.text.slice(0,20000));
          }
          await sleep(1500);
          console.log('=== POST_SUBMISSION_DISCOVERY ===');
          for(const q of ['DELTA Witness','DELTA Witness Capture','DELTA Witness Guarded-Action Pilot',ORIGIN]){const r=await req(`${PAY}/agent/search?q=${encodeURIComponent(q)}&verified_only=false&limit=100`);console.log('POST_SEARCH',q,r.status,r.text.slice(0,16000));}
          console.log('=== TREASURY_RESYNC ===');
          const USDC='0x833589fcd6edb6e08f4c7c32d4f71b54bda02913'; const rpcs=['https://mainnet.base.org','https://base-rpc.publicnode.com','https://base.llamarpc.com'];
          async function rpc(method,params){let last;for(const url of rpcs){for(let i=0;i<3;i++){const r=await req(url,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method,params})},2);const j=parse(r.text);if(r.status===200&&j&&!j.error)return j.result;last=j?.error||r.text;await sleep(300*2**i)}}throw new Error(JSON.stringify(last))}
          const start=51088247, head=parseInt(await rpc('eth_blockNumber',[]),16); const topic0='0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef'; const toTopic='0x'+'0'.repeat(24)+TREASURY.slice(2).toLowerCase(); let logs=[];
          for(let from=start;from<=head;from+=1500){const to=Math.min(head,from+1499);logs.push(...await rpc('eth_getLogs',[{address:USDC,fromBlock:'0x'+from.toString(16),toBlock:'0x'+to.toString(16),topics:[topic0,null,toTopic]}]));}
          const incoming=logs.map(x=>({block:parseInt(x.blockNumber,16),tx:x.transactionHash,amount_usdc:Number(BigInt(x.data))/1e6,from:'0x'+x.topics[1].slice(-40)})); console.log(JSON.stringify({start,head,incoming_count:incoming.length,incoming},null,2));
          NODE