name: TEMP DELTA revenue-first reconcile 20260920-0208
on:
  push:
    branches: [master]
    paths: [.github/workflows/tmp-automation-reconcile-20260920-0208.yml]
permissions:
  contents: read
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with: {persist-credentials: false}
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - name: Verify owner pricing live without payment
        run: node scripts/check-owner-pricing.mjs && node scripts/verify-owner-pricing-live.mjs | tee /tmp/delta-live-pricing.json
      - name: Audit paid funnel candidates
        run: node scripts/query-revenue-candidates.mjs | tee /tmp/delta-revenue-candidates.json
      - name: Read AgentPact demand
        continue-on-error: true
        run: node scripts/scan-agentpact-demand.mjs | tee /tmp/delta-agentpact-demand.json
      - name: Read independently funded adjacent demand
        continue-on-error: true
        run: node scripts/scan-external-funded-demand.mjs | tee /tmp/delta-external-funded-demand.json
      - name: Reconcile canonical Base USDC Treasury
        env:
          DELTA_TREASURY_LOOKBACK_BLOCKS: '70000'
          DELTA_TREASURY_CHUNK_BLOCKS: '1900'
        run: node scripts/reconcile-treasury.mjs | tee /tmp/delta-treasury.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: delta-automation-reconcile-${{ github.run_id }}
          path: |
            /tmp/delta-live-pricing.json
            /tmp/delta-revenue-candidates.json
            /tmp/delta-agentpact-demand.json
            /tmp/delta-external-funded-demand.json
            /tmp/delta-treasury.json
          if-no-files-found: warn
          retention-days: 7
