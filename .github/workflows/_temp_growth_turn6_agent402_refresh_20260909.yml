name: DELTA Turn 6 Agent402 Refresh

on:
  push:
    paths:
      - '.github/workflows/_temp_growth_turn6_agent402_refresh_20260909.yml'

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Refresh DELTA origin with Agent402 and verify response
        shell: bash
        run: |
          set +e
          ORIGIN='https://delta-witness-api.ruphussten.workers.dev'
          code=$(curl --retry 4 --retry-delay 2 --retry-all-errors -sS --max-time 35 -o /tmp/register.json -w '%{http_code}' -X POST 'https://agent402.tools/api/index/register' -H 'content-type: application/json' --data-binary "{\"origin\":\"$ORIGIN\"}" || true)
          echo "AGENT402_REFRESH_HTTP=$code"
          cat /tmp/register.json; echo
          sleep 2
          echo '=== INDEX_FALLBACKS ==='
          for q in 'delta-witness-api.ruphussten.workers.dev' 'delta witness' 'preflight autonomous action'; do
            printf 'QUERY=%s\n' "$q"
            curl --retry 3 --retry-delay 2 --retry-all-errors -sS --max-time 30 -G 'https://agent402.tools/api/index' --data-urlencode "q=$q" --data-urlencode 'limit=100' | head -c 12000; echo
          done
          exit 0
