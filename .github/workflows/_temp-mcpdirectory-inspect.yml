name: DELTA MCP.Directory submit
on:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/_temp-mcpdirectory-inspect.yml"
permissions:
  contents: write
concurrency:
  group: delta-mcpdirectory-submit
  cancel-in-progress: false
jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Submit DELTA MCP server via public free endpoint
        shell: bash
        run: |
          set -euo pipefail
          payload=$(jq -nc '{githubUrl:"https://github.com/15998194110/delta-witness",npmPackage:"delta-witness-mcp",description:"Paid web evidence capture, preflight verification and guarded-action checks over x402."}')
          tmp=$(mktemp)
          code=''
          for delay in 0 1 2 4; do
            [ "$delay" = 0 ] || sleep "$delay"
            code=$(curl -sS --max-time 30 -o "$tmp" -w '%{http_code}' -H 'content-type: application/json' -X POST 'https://mcp.directory/api/submit-server' -d "$payload" || true)
            if [[ "$code" =~ ^2 ]]; then break; fi
            if [[ ! "$code" =~ ^(429|500|502|503|504|000)$ ]]; then break; fi
          done
          node - "$code" "$tmp" <<'NODE' > docs/_temp-mcpdirectory-submit.json
          const fs=require('fs');
          const [code,path]=process.argv.slice(2); let raw=fs.readFileSync(path,'utf8'); let body;
          try{body=JSON.parse(raw)}catch{body={raw:raw.slice(0,1000)}}
          console.log(JSON.stringify({observed_at:new Date().toISOString(),channel:'MCP.Directory',http_status:Number(code)||0,request:{githubUrl:'https://github.com/15998194110/delta-witness',npmPackage:'delta-witness-mcp',description:'Paid web evidence capture, preflight verification and guarded-action checks over x402.',email_omitted:true},response:body},null,2));
          NODE
          if [[ ! "$code" =~ ^2 ]]; then cat docs/_temp-mcpdirectory-submit.json; exit 1; fi
          git config user.name 'DELTA Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/_temp-mcpdirectory-submit.json
          git commit -m 'growth: record MCP.Directory submission response'
          git push
