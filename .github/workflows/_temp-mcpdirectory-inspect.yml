name: DELTA MCP.Directory inspect
on:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/_temp-mcpdirectory-inspect.yml"
permissions:
  contents: write
concurrency:
  group: delta-mcpdirectory-inspect
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
      - name: Resolve public no-account submission endpoint
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://mcp.directory'
          curl --retry 4 --retry-delay 2 --retry-all-errors -fsSL --max-time 30 "$BASE/submit" -o /tmp/page.html
          node <<'NODE' >/tmp/scripts.txt
          const fs=require('fs'); const h=fs.readFileSync('/tmp/page.html','utf8');
          for(const m of h.matchAll(/<script[^>]+src=["']([^"']+)["']/gi)) if(m[1].startsWith('/')) console.log(m[1]);
          NODE
          : >/tmp/bundles.js
          while read -r p; do curl --retry 3 --retry-delay 1 --retry-all-errors -fsSL --max-time 30 "$BASE$p" >>/tmp/bundles.js || true; echo >>/tmp/bundles.js; done </tmp/scripts.txt
          node <<'NODE' > /tmp/out.json
          const fs=require('fs');
          const h=fs.readFileSync('/tmp/page.html','utf8'); const j=fs.readFileSync('/tmp/bundles.js','utf8');
          const needles=['Submit for Review','githubUrl','github_url','repositoryUrl','repository_url','npmPackage','pypiPackage','shortDescription','/api/submit','/api/submissions','submit-server','submission'];
          const excerpts=[];
          for(const n of needles){let pos=0,count=0;while((pos=j.indexOf(n,pos))>=0&&count<8){excerpts.push({needle:n,text:j.slice(Math.max(0,pos-700),Math.min(j.length,pos+1400)).replace(/\s+/g,' ')});pos+=n.length;count++;}}
          const urls=[...new Set([...j.matchAll(/["'`](\/api\/[A-Za-z0-9_?=&.\/-]{2,120})["'`]/g)].map(m=>m[1]))].filter(x=>/submit|server|mcp|listing/i.test(x)).slice(0,100);
          const terms=/(agree|terms of service|terms and conditions|privacy policy|checkbox|required.*terms)/i.test(h.match(/<form\b[\s\S]*?<\/form>/i)?.[0]||'');
          console.log(JSON.stringify({page_bytes:h.length,bundle_bytes:j.length,api_candidates:urls,terms_language_in_form:terms,excerpts},null,2));
          NODE
          cp /tmp/out.json docs/_temp-mcpdirectory-inspect.json
          git config user.name 'DELTA Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/_temp-mcpdirectory-inspect.json
          git commit -m 'ops: resolve MCP.Directory submit endpoint'
          git push
