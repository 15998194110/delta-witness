name: DELTA Growth Turn 7 Temp
on:
  push:
    paths:
      - '.github/workflows/_temp_growth_turn7_20260908.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6

      - name: Verify DELTA production paid surfaces
        run: |
          set -euo pipefail
          BASE='https://delta-witness-api.ruphussten.workers.dev'
          echo 'HEALTH_BEGIN'
          curl --retry 3 --retry-delay 2 --retry-all-errors -fsS --max-time 30 "$BASE/health" | jq .
          echo 'HEALTH_END'
          for product in capture preflight guarded-action-pilot; do
            case "$product" in
              capture) body='{"url":"https://example.com"}' ;;
              preflight) body='{"url":"https://example.com","expected":{"contains":["Example Domain"]}}' ;;
              guarded-action-pilot) body='{"urls":["https://example.com"],"action":"verify"}' ;;
            esac
            code=$(curl --retry 3 --retry-delay 2 --retry-all-errors -sS --max-time 30 -o "/tmp/${product}.body" -D "/tmp/${product}.headers" -w '%{http_code}' -X POST "$BASE/v1/$product" -H 'content-type: application/json' --data-binary "$body" || true)
            echo "PRODUCT=$product HTTP=$code"
            grep -iE '^(payment-required|x-payment|content-type):' "/tmp/${product}.headers" || true
            cat "/tmp/${product}.body" | jq . 2>/dev/null || cat "/tmp/${product}.body"
            test "$code" = '402'
          done

      - name: Reconcile recent DELTA telemetry
        run: |
          set -euo pipefail
          DB='c9431b00-27c5-4609-9f3d-6af20cb162df'
          SQL="SELECT id,created_at,event,route,channel,partner,success,reason,network,gross_usd,browser_ms,storage_bytes,variable_cost_usd,contribution_margin_usd FROM telemetry_events WHERE created_at >= datetime('now','-24 hours') ORDER BY id ASC"
          jq -n --arg sql "$SQL" '{sql:$sql}' >/tmp/query.json
          echo 'TELEMETRY_BEGIN'
          curl --retry 4 --retry-delay 2 --retry-all-errors -fsS --max-time 30 \
            -X POST "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DB}/query" \
            -H "authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'content-type: application/json' \
            --data-binary @/tmp/query.json | jq '{success,errors,result:[.result[]|{success,results}]}'
          echo 'TELEMETRY_END'

      - name: Reconcile Base Treasury via canonical USDC logs
        run: |
          set -euo pipefail
          RPC='https://mainnet.base.org'
          USDC='0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913'
          TREASURY='0x1990e21bc219696ff7fbc26527dbaed335ac6367'
          TOPIC0='0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef'
          TO_TOPIC="0x000000000000000000000000${TREASURY#0x}"
          latest_hex=$(curl --retry 4 --retry-delay 2 --retry-all-errors -fsS --max-time 30 -H 'content-type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"eth_blockNumber","params":[]}' "$RPC" | jq -r .result)
          latest=$((latest_hex))
          start=50985188
          echo "TREASURY_SCAN start=$start latest=$latest"
          echo 'TREASURY_USDC_BEGIN'
          cur=$start
          while [ "$cur" -le "$latest" ]; do
            end=$((cur+9999)); if [ "$end" -gt "$latest" ]; then end=$latest; fi
            from=$(printf '0x%x' "$cur"); to=$(printf '0x%x' "$end")
            jq -n --arg from "$from" --arg to "$to" --arg address "$USDC" --arg t0 "$TOPIC0" --arg t2 "$TO_TOPIC" '{jsonrpc:"2.0",id:1,method:"eth_getLogs",params:[{fromBlock:$from,toBlock:$to,address:$address,topics:[$t0,null,$t2]}]}' >/tmp/rpc.json
            curl --retry 4 --retry-delay 2 --retry-all-errors -fsS --max-time 30 -H 'content-type: application/json' --data-binary @/tmp/rpc.json "$RPC" | jq -c --argjson from "$cur" --argjson to "$end" '{range:[$from,$to],error,logs:(.result // [])}'
            cur=$((end+1))
          done
          echo 'TREASURY_USDC_END'

      - name: Inspect Agent Bazaar free listing submission path
        run: |
          set -euo pipefail
          BASE='https://www.agent-bazaar.com'
          curl --retry 3 --retry-delay 2 --retry-all-errors -fsSL --max-time 30 "$BASE/dev" >/tmp/agentbazaar-dev.html
          echo 'AGENT_BAZAAR_FORM_BEGIN'
          grep -oE '<form[^>]*>|name="[^"]+"|action="[^"]+"|method="[^"]+"' /tmp/agentbazaar-dev.html | head -120 || true
          echo 'AGENT_BAZAAR_FORM_END'
          grep -oE '/_next/static/[^" ]+\.js' /tmp/agentbazaar-dev.html | sort -u >/tmp/chunks.txt || true
          echo 'AGENT_BAZAAR_JS_MATCHES_BEGIN'
          while read -r p; do
            [ -n "$p" ] || continue
            url="$BASE$p"
            curl --retry 2 --retry-delay 1 --retry-all-errors -fsSL --max-time 30 "$url" -o /tmp/chunk.js || continue
            if grep -qiE 'submit.*skill|skill.*submit|api/.{0,40}skill|fetch\(' /tmp/chunk.js; then
              echo "CHUNK=$p"
              grep -oE '.{0,180}(submit.{0,80}skill|skill.{0,80}submit|/api/[A-Za-z0-9_/?=&.-]*|fetch\().{0,220}' /tmp/chunk.js | head -80 || true
            fi
          done </tmp/chunks.txt
          echo 'AGENT_BAZAAR_JS_MATCHES_END'

      - name: Check public candidate channels
        run: |
          set +e
          echo 'CHANNEL_CHECKS_BEGIN'
          for url in \
            'https://agent402.tools/api/reliability' \
            'https://payanagent.com/api/v1/discover?q=DELTA%20Witness' \
            'https://agentndx.ai/api/search?q=DELTA%20Witness' \
            'https://www.agent-bazaar.com/marketplace'; do
            echo "URL=$url"
            curl --retry 3 --retry-delay 2 --retry-all-errors -sS -L --max-time 30 -o /tmp/out -D /tmp/h -w 'HTTP=%{http_code}\n' "$url"
            head -c 3000 /tmp/out; echo
          done
          echo 'CHANNEL_CHECKS_END'
