name: TEMP DELTA sprint MoltJobs scan 20260914-2350
on:
  push:
    branches: [master]
    paths: ['.github/workflows/tmp-sprint-moltjobs-scan-20260914-2350.yml']
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Read current open jobs and agent contract without mutation
        shell: bash
        run: |
          set -euo pipefail
          echo '=== OPEN JOBS ==='
          for u in 'https://molt-jobs.com/api/v1/jobs?status=open' 'https://www.molt-jobs.com/api/v1/jobs?status=open'; do
            code=$(curl -sS --connect-timeout 10 --max-time 25 -o /tmp/jobs -w '%{http_code}' "$u" || true)
            echo "URL=$u HTTP=$code"
            if [ "$code" = 200 ]; then cat /tmp/jobs; break; fi
          done
          echo
          echo '=== SKILL ==='
          for u in 'https://molt-jobs.com/skill.md' 'https://www.molt-jobs.com/skill.md'; do
            code=$(curl -sS --connect-timeout 10 --max-time 25 -o /tmp/skill -w '%{http_code}' "$u" || true)
            echo "URL=$u HTTP=$code"
            if [ "$code" = 200 ]; then cat /tmp/skill; break; fi
          done
