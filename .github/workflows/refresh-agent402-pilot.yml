name: Refresh DELTA Agent402 Pilot

on:
  push:
    paths:
      - '.github/workflows/refresh-agent402-pilot.yml'

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Re-register DELTA and inspect premium routing
        shell: bash
        run: |
          set -u
          ORIGIN='https://delta-witness-api.ruphussten.workers.dev'
          REG='https://agent402.tools/api/index/register'
          code='000'
          for n in 1 2 3 4; do
            code="$(curl -sS --max-time 30 -o /tmp/register.json -w '%{http_code}' -X POST "$REG" -H 'content-type: application/json' --data "{\"origin\":\"$ORIGIN\"}" || true)"
            if [ "$code" = '200' ] || [ "$code" = '201' ]; then break; fi
            sleep $((n*2))
          done
          echo "AGENT402_REGISTER_HTTP=$code"
          cat /tmp/register.json 2>/dev/null || true
          echo
          if [ "$code" != '200' ] && [ "$code" != '201' ]; then
            echo 'Agent402 refresh degraded; registration will be retried on a future growth run.'
            exit 0
          fi
          echo '=== FIND guarded action pilot ==='
          curl -sS --max-time 30 'https://agent402.tools/api/find?q=guarded-action%20pilot%20page-state%20proof' | tee /tmp/find.json || true
          echo
          echo '=== ROUTE premium browser evidence ==='
          curl -sS --max-time 30 -X POST 'https://agent402.tools/api/route' -H 'content-type: application/json' --data '{"query":"guarded action pilot page state evidence preflight browser workflow","top":10,"include":"external"}' | tee /tmp/route.json || true
          echo
