name: One-off PayanAgent funded-request scan

on:
  push:
    paths:
      - '.github/_run_payan_requests'

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Scan compatible open requests
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const base='https://payanagent.com';
          const queries=['verification','preflight','evidence','endpoint','website','browser'];
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function get(q){
            const url=`${base}/api/v1/discover?q=${encodeURIComponent(q)}&limit=100`;
            let last=null;
            for(let i=0;i<3;i++){
              const c=new AbortController(); const t=setTimeout(()=>c.abort(),25000);
              try{
                const r=await fetch(url,{signal:c.signal}); const txt=await r.text(); clearTimeout(t);
                let j=null; try{j=JSON.parse(txt)}catch{}
                if(r.status===429 || r.status>=500){last={q,status:r.status,error:txt.slice(0,500)}; if(i+1<3) await sleep(1000*(2**i)); continue;}
                return {q,status:r.status,ok:r.ok,json:j,error:r.ok?null:txt.slice(0,500)};
              }catch(e){clearTimeout(t); last={q,status:0,error:String(e)}; if(i+1<3) await sleep(1000*(2**i));}
            }
            return last;
          }
          async function main(){
            const calls=[]; const byId=new Map();
            for(const q of queries){
              const r=await get(q); calls.push({q,status:r?.status||0,ok:!!r?.ok,error:r?.error||null});
              for(const req of (r?.json?.openRequests||[])){
                const id=req.id||req.requestId||JSON.stringify(req).slice(0,100);
                byId.set(id,req);
              }
            }
            const terms=/verif|preflight|evidence|endpoint|health|website|browser|url|proof|audit|page|http|api|discover|monitor/i;
            const relevant=[...byId.values()].filter(r=>terms.test(JSON.stringify(r)));
            const out={observed_at:new Date().toISOString(),channel:'PayanAgent',calls,relevant_open_requests:relevant,count:relevant.length};
            fs.mkdirSync('docs/channel-status',{recursive:true});
            fs.writeFileSync('docs/channel-status/payanagent-open-requests-2026-09-09.json',JSON.stringify(out,null,2)+'\n');
          }
          main().catch(e=>{console.error(e);process.exit(1)});
          NODE
          git config user.name 'DELTA Growth Operator'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/channel-status/payanagent-open-requests-2026-09-09.json
          git commit -m 'growth: scan PayanAgent funded requests' || true
          git push
