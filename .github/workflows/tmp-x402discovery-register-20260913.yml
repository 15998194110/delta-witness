name: TMP - x402 Discovery registration 20260913
on:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/tmp-x402discovery-register-20260913.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Enforce current owner pricing policy
        run: node scripts/check-owner-pricing.mjs
      - name: Verify live canonical public 402 pricing
        run: node scripts/verify-owner-pricing-live.mjs
      - name: Register one canonical DELTA Capture service without duplication
        shell: bash
        run: |
          set -euo pipefail
          API='https://x402-discovery-api.onrender.com'
          URL='https://delta-witness-api.ruphussten.workers.dev/v1/capture'
          TREASURY='0x1990e21bc219696ff7fbc26527dbaed335ac6367'

          catalog_body=''
          catalog_source=''
          catalog_available=0

          fetch_catalog_round() {
            local endpoint status body_file
            for endpoint in '/catalog?limit=1000' '/catalog' '/.well-known/x402-discovery'; do
              body_file="/tmp/x402discovery-$(echo "$endpoint" | tr '/?.=&' '-').txt"
              status="$(curl -sS --connect-timeout 10 --max-time 35 -o "$body_file" -w '%{http_code}' "$API$endpoint" || true)"
              echo "X402DISCOVERY_PROBE endpoint=$endpoint status=$status"
              if [ "$status" = '200' ]; then
                catalog_body="$(cat "$body_file")"
                catalog_source="$endpoint"
                catalog_available=1
                return 0
              fi
            done
            return 1
          }

          for delay in 0 5 12; do
            if [ "$delay" -gt 0 ]; then sleep "$delay"; fi
            if fetch_catalog_round; then break; fi
          done

          if [ "$catalog_available" -ne 1 ]; then
            health_status="$(curl -sS --connect-timeout 10 --max-time 25 -o /tmp/x402discovery-health.txt -w '%{http_code}' "$API/health" || true)"
            echo "X402DISCOVERY_DEGRADED recoverable=true catalog_unavailable=true health_status=$health_status"
            echo 'X402DISCOVERY_DEFERRED_RECHECK: recurring canonical discovery pulse will retry; no unsafe duplicate write attempted'
            exit 0
          fi

          if printf '%s' "$catalog_body" | grep -Fqi "$URL"; then
            echo "X402DISCOVERY_PRESENT source=$catalog_source exact canonical Capture URL already listed; no duplicate write"
            exit 0
          fi

          cat >/tmp/delta-register.json <<JSON
          {
            "id": "delta-witness-capture",
            "name": "DELTA Witness",
            "description": "Machine-verifiable public-web evidence capture for autonomous agents. Returns timestamped proof metadata and content hashes; payment is canonical x402 Base USDC and raw artifacts remain private.",
            "url": "$URL",
            "category": "utility",
            "price_usd": 1.0,
            "network": "base",
            "wallet_address": "$TREASURY",
            "tags": ["verification", "evidence", "web", "agents", "x402"],
            "capability_tags": ["verification", "evidence", "web", "agents", "x402"]
          }
          JSON

          register_status='000'
          for delay in 0 5 12; do
            if [ "$delay" -gt 0 ]; then sleep "$delay"; fi
            register_status="$(curl -sS --connect-timeout 10 --max-time 35 -o /tmp/delta-register-response.json -w '%{http_code}' -X POST "$API/register" -H 'content-type: application/json' --data-binary @/tmp/delta-register.json || true)"
            echo "X402DISCOVERY_REGISTER_ATTEMPT status=$register_status"
            if [ "$register_status" = '409' ] || { [ "$register_status" -ge 200 ] 2>/dev/null && [ "$register_status" -lt 300 ] 2>/dev/null; }; then break; fi
            if [ "$register_status" != '429' ] && [ "$register_status" -lt 500 ] 2>/dev/null; then break; fi
          done
          cat /tmp/delta-register-response.json 2>/dev/null || true

          if [ "$register_status" = '409' ]; then
            echo 'X402DISCOVERY_PRESENT: registry reports existing entry; treating as canonical presence'
          elif [ "$register_status" -ge 200 ] 2>/dev/null && [ "$register_status" -lt 300 ] 2>/dev/null; then
            echo "X402DISCOVERY_REGISTER_ACCEPTED status=$register_status"
          elif [ "$register_status" = '429' ] || [ "$register_status" -ge 500 ] 2>/dev/null; then
            echo "X402DISCOVERY_DEGRADED recoverable=true register_status=$register_status"
            echo 'X402DISCOVERY_DEFERRED_RECHECK: recurring canonical discovery pulse will retry'
            exit 0
          else
            echo "X402DISCOVERY_REGISTER_REJECTED status=$register_status"
            exit 1
          fi

          sleep 3
          readback=''
          readback_available=0
          catalog_body=''
          catalog_available=0
          if fetch_catalog_round; then
            readback="$catalog_body"
            readback_available=1
          fi
          if [ "$readback_available" -eq 1 ] && printf '%s' "$readback" | grep -Fqi "$URL"; then
            echo 'X402DISCOVERY_READBACK_PRESENT: exact canonical Capture URL discoverable'
          else
            echo 'X402DISCOVERY_READBACK_PENDING: write accepted/existing but propagation or channel health prevents readback confirmation'
          fi
