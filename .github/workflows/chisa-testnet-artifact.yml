name: CHISA Testnet Artifact Build

on:
  workflow_dispatch:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/chisa-testnet-artifact.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Write canonical CHISA testnet source
        shell: bash
        run: |
          cat > /tmp/CHISAToken.sol <<'SOL'
          // SPDX-License-Identifier: MIT
          pragma solidity ^0.8.24;

          contract CHISAToken {
              string public constant name = "CHISA";
              string public constant symbol = "CHISA";
              uint8 public constant decimals = 18;
              uint256 public constant MAX_SUPPLY = 1_000_000_000 ether;
              uint256 public constant COMMUNITY_RESERVE = 100_000_000 ether;
              uint256 public constant CLAIM_AMOUNT = 100 ether;

              uint256 public totalSupply;
              uint256 public totalClaimed;
              mapping(address => uint256) public balanceOf;
              mapping(address => mapping(address => uint256)) public allowance;
              mapping(address => bool) public hasClaimed;

              event Transfer(address indexed from, address indexed to, uint256 value);
              event Approval(address indexed owner, address indexed spender, uint256 value);

              error ZeroAddress();
              error InsufficientBalance();
              error InsufficientAllowance();
              error AlreadyClaimed();
              error CommunityReserveExhausted();

              constructor(address treasury) {
                  if (treasury == address(0)) revert ZeroAddress();
                  totalSupply = MAX_SUPPLY;
                  uint256 treasuryAmount = MAX_SUPPLY - COMMUNITY_RESERVE;
                  balanceOf[treasury] = treasuryAmount;
                  balanceOf[address(this)] = COMMUNITY_RESERVE;
                  emit Transfer(address(0), treasury, treasuryAmount);
                  emit Transfer(address(0), address(this), COMMUNITY_RESERVE);
              }

              function transfer(address to, uint256 amount) external returns (bool) {
                  _transfer(msg.sender, to, amount);
                  return true;
              }

              function approve(address spender, uint256 amount) external returns (bool) {
                  allowance[msg.sender][spender] = amount;
                  emit Approval(msg.sender, spender, amount);
                  return true;
              }

              function transferFrom(address from, address to, uint256 amount) external returns (bool) {
                  uint256 allowed = allowance[from][msg.sender];
                  if (allowed != type(uint256).max) {
                      if (allowed < amount) revert InsufficientAllowance();
                      unchecked { allowance[from][msg.sender] = allowed - amount; }
                      emit Approval(from, msg.sender, allowance[from][msg.sender]);
                  }
                  _transfer(from, to, amount);
                  return true;
              }

              function burn(uint256 amount) external {
                  uint256 bal = balanceOf[msg.sender];
                  if (bal < amount) revert InsufficientBalance();
                  unchecked { balanceOf[msg.sender] = bal - amount; totalSupply -= amount; }
                  emit Transfer(msg.sender, address(0), amount);
              }

              function claim() external {
                  if (hasClaimed[msg.sender]) revert AlreadyClaimed();
                  if (totalClaimed + CLAIM_AMOUNT > COMMUNITY_RESERVE) revert CommunityReserveExhausted();
                  hasClaimed[msg.sender] = true;
                  totalClaimed += CLAIM_AMOUNT;
                  _transfer(address(this), msg.sender, CLAIM_AMOUNT);
              }

              function communityReserveRemaining() external view returns (uint256) {
                  return COMMUNITY_RESERVE - totalClaimed;
              }

              function _transfer(address from, address to, uint256 amount) internal {
                  if (to == address(0)) revert ZeroAddress();
                  uint256 bal = balanceOf[from];
                  if (bal < amount) revert InsufficientBalance();
                  unchecked { balanceOf[from] = bal - amount; balanceOf[to] += amount; }
                  emit Transfer(from, to, amount);
              }
          }
          SOL

      - name: Compile with Solidity 0.8.30
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/chisa-compiler
          cd /tmp/chisa-compiler
          npm init -y >/dev/null 2>&1
          npm install --ignore-scripts --no-audit --no-fund solc@0.8.30
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const solc = require('solc');
          const source = fs.readFileSync('/tmp/CHISAToken.sol', 'utf8');
          const input = {
            language: 'Solidity',
            sources: {'CHISAToken.sol': {content: source}},
            settings: {
              optimizer: {enabled: true, runs: 200},
              evmVersion: 'cancun',
              outputSelection: {'*': {'*': ['abi','evm.bytecode.object','evm.deployedBytecode.object','metadata']}}
            }
          };
          const out = JSON.parse(solc.compile(JSON.stringify(input)));
          const errors = (out.errors || []).filter(e => e.severity === 'error');
          if (errors.length) throw new Error(errors.map(e => e.formattedMessage || e.message).join('\n'));
          const c = out.contracts?.['CHISAToken.sol']?.CHISAToken;
          if (!c || !c.evm?.bytecode?.object) throw new Error('No CHISAToken bytecode produced');
          const artifact = {
            contractName: 'CHISAToken',
            compiler: solc.version(),
            optimizer: {enabled: true, runs: 200},
            evmVersion: 'cancun',
            source,
            sourceSha256: crypto.createHash('sha256').update(source).digest('hex'),
            abi: c.abi,
            bytecode: '0x' + c.evm.bytecode.object,
            deployedBytecode: '0x' + c.evm.deployedBytecode.object,
            metadata: JSON.parse(c.metadata)
          };
          const data = JSON.stringify(artifact, null, 2);
          fs.writeFileSync('/tmp/chisa-artifact.json', data);
          console.log('compiler=' + artifact.compiler);
          console.log('sourceSha256=' + artifact.sourceSha256);
          console.log('bytecodeBytes=' + ((artifact.bytecode.length - 2) / 2));
          console.log('artifactSha256=' + crypto.createHash('sha256').update(data).digest('hex'));
          NODE

      - name: Upload CHISA artifact
        uses: actions/upload-artifact@v4
        with:
          name: chisa-testnet-artifact
          path: /tmp/chisa-artifact.json
          if-no-files-found: error
          retention-days: 1
