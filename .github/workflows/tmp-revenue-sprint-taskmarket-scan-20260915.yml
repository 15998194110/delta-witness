name: TEMP DELTA revenue sprint Taskmarket scan 20260915
on:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/tmp-revenue-sprint-taskmarket-scan-20260915.yml"
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Read current Taskmarket buyer demand without wallet or mutation
        shell: bash
        run: |
          set -euo pipefail
          URL='https://api.taskmarket.dev/api/tasks?status=open&sort=newest&limit=100'
          curl -fsS --connect-timeout 10 --max-time 30 --retry 2 --retry-delay 2 "$URL" -o /tmp/tasks.json
          node <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('/tmp/tasks.json','utf8'));
          const tasks=Array.isArray(j.tasks)?j.tasks:[];
          const fit=/evidence|proof|verify|verification|audit|browser|web|website|page|scrap|monitor|price|availability|procurement|vendor|terms|research|public data|api/i;
          const norm=tasks.map(t=>({
            id:t.id,
            reward_usdc: t.reward==null?null:Number(t.reward)/1e6,
            mode:t.mode,
            status:t.status,
            tags:t.tags||[],
            expiryTime:t.expiryTime||null,
            submissionCount:t.submissionCount ?? t.submissionsCount ?? t.submission_count ?? null,
            stake:t.stake ?? t.stakeRequired ?? null,
            description:String(t.description||'').replace(/\s+/g,' ').slice(0,700),
            fit:fit.test(`${t.description||''} ${JSON.stringify(t.tags||[])}`)
          }));
          console.log(JSON.stringify({checked_at:new Date().toISOString(),count:norm.length,hasMore:j.hasMore,nextCursor:j.nextCursor,fit:norm.filter(x=>x.fit),all:norm},null,2));
          NODE
