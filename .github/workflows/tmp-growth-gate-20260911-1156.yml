name: DELTA one-shot growth gate 20260911-1156

on:
  push:
    paths:
      - '.github/workflows/tmp-growth-gate-20260911-1156.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Owner pricing policy check
        run: node scripts/check-owner-pricing.mjs
      - name: Live public 402 verification
        run: node scripts/verify-owner-pricing-live.mjs
      - name: Paid-funnel telemetry audit
        run: node scripts/query-revenue-candidates.mjs
      - name: Independent Base Treasury reconciliation
        if: always()
        run: node scripts/reconcile-treasury.mjs
      - name: Read-only npm distribution audit
        if: always()
        run: |
          echo 'NPM_VERSION='
          npm view delta-witness-mcp version
          echo 'NPM_DIST_TAGS='
          npm view delta-witness-mcp dist-tags --json
          echo 'NPM_VERSIONS='
          npm view delta-witness-mcp versions --json
          echo 'NPM_LATEST_README_PRICING_LINES='
          npm view delta-witness-mcp@latest readme | grep -E 'DELTA_MAX_USD_PER_CALL|public list prices|Capture|Preflight|Guarded-Action' || true
      - name: Exact Circle x402 Discovery queries
        if: always()
        run: |
          set -e
          BASE='https://api.circle.com/v2/x402/discovery/resources'
          queries=(
            'delta-witness-api.ruphussten.workers.dev'
            'DELTA Witness'
            '0x1990e21bc219696ff7fbc26527dbaed335ac6367'
          )
          i=0
          for q in "${queries[@]}"; do
            i=$((i+1))
            encoded=$(node -p "encodeURIComponent(process.argv[1])" "$q")
            url="$BASE?query=$encoded"
            code=0
            for attempt in 1 2 3; do
              code=$(curl -sS --connect-timeout 10 --max-time 45 -o "/tmp/circle-$i.json" -w '%{http_code}' "$url" || true)
              echo "CIRCLE_QUERY_${i}_HTTP_ATTEMPT_${attempt}=$code"
              if [ "$code" = "200" ]; then break; fi
              sleep $((attempt * 2))
            done
            test "$code" = "200"
            Q="$q" FILE="/tmp/circle-$i.json" node - <<'NODE'
          const fs = require('fs');
          const json = JSON.parse(fs.readFileSync(process.env.FILE,'utf8'));
          const items = Array.isArray(json.items) ? json.items : [];
          const needles = ['delta-witness-api.ruphussten.workers.dev','delta witness','0x1990e21bc219696ff7fbc26527dbaed335ac6367'];
          const hits = items.filter(item => {
            const s = JSON.stringify(item).toLowerCase();
            return needles.some(n => s.includes(n));
          });
          console.log(JSON.stringify({query:process.env.Q,item_count:items.length,pagination:json.pagination||null,delta_hit_count:hits.length,delta_hits:hits},null,2));
          NODE
          done
