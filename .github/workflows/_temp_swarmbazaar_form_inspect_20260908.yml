name: DELTA SwarmBazaar Form Inspect Temp
on:
  push:
    paths:
      - '.github/workflows/_temp_swarmbazaar_form_inspect_20260908.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect free listing form contract
        shell: bash
        run: |
          set -euo pipefail
          curl -sS -L --retry 5 --retry-delay 2 --retry-all-errors --max-time 30 https://swarmbazaar.com/onboard.html > /tmp/onboard.html
          python3 - <<'PY'
          from html.parser import HTMLParser
          class P(HTMLParser):
            def handle_starttag(self, tag, attrs):
              d=dict(attrs)
              if tag in ('form','input','select','option','textarea','button'):
                safe={k:v for k,v in d.items() if k not in ('value',) or tag=='option'}
                print(tag, safe)
          P().feed(open('/tmp/onboard.html').read())
          PY
          echo '--- FORM AREA ---'
          grep -n -A80 -B10 '<form' /tmp/onboard.html | head -c 40000 || true
