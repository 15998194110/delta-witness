name: DELTA Recovery Turn 5
on:
  push:
    paths:
      - '.github/workflows/_temp_delta_recovery_turn5.yml'

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
      - name: Reconcile Treasury via small-range Base RPC with explorer fallback
        continue-on-error: true
        shell: bash
        run: |
          set -u
          node <<'NODE'
          const treasury='0x1990e21bc219696ff7fbc26527dbaed335ac6367';
          const usdc='0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913';
          const start=50985188;
          const topic0='0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef';
          const topic2='0x'+treasury.slice(2).toLowerCase().padStart(64,'0');
          const rpcs=['https://mainnet.base.org','https://1rpc.io/base','https://base.llamarpc.com'];
          async function rpc(url,method,params){
            const ac=new AbortController(); const t=setTimeout(()=>ac.abort(),15000);
            try { const r=await fetch(url,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method,params}),signal:ac.signal}); if(!r.ok) throw new Error(`HTTP ${r.status}`); const j=await r.json(); if(j.error) throw new Error(JSON.stringify(j.error)); return j.result; } finally {clearTimeout(t)}
          }
          let latest=null, preferred=null;
          for(const u of rpcs){try{latest=Number(BigInt(await rpc(u,'eth_blockNumber',[])));preferred=u;console.log('RPC_HEAD_OK',u,latest);break}catch(e){console.error('RPC_HEAD_DEGRADED',u,String(e))}}
          if(latest==null) process.exit(2);
          const logs=[]; let failures=0;
          for(let from=start;from<=latest;from+=1000){
            const to=Math.min(from+999,latest);
            const filter={address:usdc,fromBlock:'0x'+from.toString(16),toBlock:'0x'+to.toString(16),topics:[topic0,null,topic2]};
            let got=null;
            for(const u of [preferred,...rpcs.filter(x=>x!==preferred)]){
              try{got=await rpc(u,'eth_getLogs',[filter]);break}catch(e){console.error('RPC_RANGE_DEGRADED',u,from,to,String(e))}
            }
            if(got==null){failures++; continue;} logs.push(...got);
          }
          const uniq=[...new Map(logs.map(x=>[x.transactionHash+':'+x.logIndex,x])).values()];
          const rows=uniq.map(x=>({block:Number(BigInt(x.blockNumber)),tx:x.transactionHash,from:'0x'+x.topics[1].slice(-40),to:'0x'+x.topics[2].slice(-40),raw:BigInt(x.data).toString(),usdc:Number(BigInt(x.data))/1e6}));
          console.log('TREASURY_SCAN_FAILURE_RANGES',failures);
          console.log('TREASURY_INCOMING_USDC',JSON.stringify(rows));
          console.log('TREASURY_TOTAL_USDC',rows.reduce((s,x)=>s+x.usdc,0));
          if(failures) process.exitCode=3;
          NODE
          echo 'BLOCKSCOUT_FALLBACK_BEGIN'
          curl --retry 5 --retry-delay 3 --retry-all-errors -sS --max-time 45 \
            'https://base.blockscout.com/api/v2/addresses/0x1990e21bc219696ff7fbc26527dbaed335ac6367/token-transfers?type=ERC-20' \
            | jq '[.items[]? | select((.token.address_hash // "" | ascii_downcase)=="0x833589fcd6edb6e08f4c7c32d4f71b54bda02913") | {timestamp,transaction_hash,from:(.from.hash // .from),to:(.to.hash // .to),raw:.total.value,decimals:.total.decimals}]' || true
          echo 'BLOCKSCOUT_FALLBACK_END'
      - name: Reconcile DELTA telemetry independently
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -u
          DB='c9431b00-27c5-4609-9f3d-6af20cb162df'
          SQL="SELECT id,created_at,event,route,channel,partner,success,reason,gross_usd,browser_ms,storage_bytes,variable_cost_usd,contribution_margin_usd FROM telemetry_events WHERE created_at > '2026-09-07 05:42:06' AND event IN ('payment_verified','capture_started','capture_completed','capture_failed','proof_opened','repeat_call') ORDER BY id ASC"
          jq -n --arg sql "$SQL" '{sql:$sql}' >/tmp/d1.json
          curl --retry 5 --retry-delay 3 --retry-all-errors -fsS --max-time 45 \
            -X POST "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DB}/query" \
            -H "authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'content-type: application/json' \
            --data-binary @/tmp/d1.json | jq '{success,errors,result:[.result[]|{success,results}]}'
      - name: Inspect AgentNDX submission form
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -u
          url='https://agentndx.ai/submit/'
          curl --retry 5 --retry-delay 3 --retry-all-errors -LsS --max-time 45 -D /tmp/ndx.headers "$url" -o /tmp/ndx.html
          echo 'AGENTNDX_STATUS_HEADERS'; head -20 /tmp/ndx.headers
          python - <<'PY'
          from html.parser import HTMLParser
          text=open('/tmp/ndx.html',encoding='utf-8',errors='ignore').read()
          class P(HTMLParser):
            def handle_starttag(self,tag,attrs):
              if tag in {'form','input','textarea','select','option','button'}:
                d=dict(attrs); print('NDX',tag,{k:d.get(k) for k in ('action','method','name','type','value','id','required') if d.get(k) is not None})
          P().feed(text)
          for needle in ['formsubmit','submit','api/','action=','fetch(']:
            print('NDX_NEEDLE',needle,[line.strip()[:500] for line in text.splitlines() if needle.lower() in line.lower()][:10])
          PY
      - name: Inspect PayAPI submission form
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -u
          url='https://payapi.market/list'
          curl --retry 5 --retry-delay 3 --retry-all-errors -LsS --max-time 45 -D /tmp/payapi.headers "$url" -o /tmp/payapi.html
          echo 'PAYAPI_STATUS_HEADERS'; head -20 /tmp/payapi.headers
          python - <<'PY'
          from html.parser import HTMLParser
          text=open('/tmp/payapi.html',encoding='utf-8',errors='ignore').read()
          class P(HTMLParser):
            def handle_starttag(self,tag,attrs):
              if tag in {'form','input','textarea','select','option','button'}:
                d=dict(attrs); print('PAYAPI',tag,{k:d.get(k) for k in ('action','method','name','type','value','id','required') if d.get(k) is not None})
          P().feed(text)
          for needle in ['formsubmit','submit','api/','action=','fetch(']:
            print('PAYAPI_NEEDLE',needle,[line.strip()[:500] for line in text.splitlines() if needle.lower() in line.lower()][:10])
          PY
