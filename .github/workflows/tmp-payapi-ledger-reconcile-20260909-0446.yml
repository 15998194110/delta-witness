name: TMP DELTA PayAPI Ledger Reconcile 20260909 0446
on:
  push:
    paths:
      - '.github/workflows/tmp-payapi-ledger-reconcile-20260909-0446.yml'
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read PayAPI public listing and public settlement ledger
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/payapi-ledger
          for spec in \
            'get|https://payapi.market/agent/get?id=delta-witness' \
            'search|https://payapi.market/agent/search?q=DELTA%20Witness&verified_only=false'; do
            n=${spec%%|*}; u=${spec#*|}
            code=$(curl --silent --show-error --retry 4 --retry-all-errors --retry-delay 2 --max-time 30 --output "/tmp/payapi-ledger/$n.json" --write-out '%{http_code}' "$u")
            echo "$code" > "/tmp/payapi-ledger/$n.code"
          done
          curl -fsS --retry 4 --retry-all-errors --retry-delay 2 --max-time 30 'https://payapi.market/list' -o /tmp/payapi-ledger/index.html
          src=$(grep -Eo 'src="/assets/index-[^"]+\.js"' /tmp/payapi-ledger/index.html | head -1 | cut -d'"' -f2)
          if [ -n "$src" ]; then curl -fsS --retry 4 --retry-all-errors --retry-delay 2 --max-time 30 "https://payapi.market$src" -o /tmp/payapi-ledger/app.js; fi
          python - <<'PY'
          import re,pathlib,json,urllib.parse,urllib.request
          root=pathlib.Path('/tmp/payapi-ledger'); s=(root/'app.js').read_text(errors='ignore') if (root/'app.js').exists() else ''
          urls=sorted(set(re.findall(r'https://[a-z0-9-]+\.supabase\.co',s)))
          keys=sorted(set(re.findall(r'eyJ[a-zA-Z0-9_-]{100,}',s)),key=len,reverse=True)
          out={'supabase_urls':urls,'public_ledger':None,'public_listing_row':None}
          if urls and keys:
              base=urls[0]; key=keys[0]
              def get(path):
                  req=urllib.request.Request(base+'/rest/v1/'+path,headers={'apikey':key,'Authorization':'Bearer '+key,'Accept':'application/json'})
                  with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
              try:
                  out['public_ledger']=get('x402_ledger_public?select=*&listing=eq.'+urllib.parse.quote('DELTA Witness'))
              except Exception as e: out['public_ledger_error']=type(e).__name__+': '+str(e)[:400]
              try:
                  out['public_listing_row']=get('api_listings?select=*&name=eq.'+urllib.parse.quote('DELTA Witness'))
              except Exception as e: out['public_listing_error']=type(e).__name__+': '+str(e)[:400]
          for n in ['get','search']:
              p=root/(n+'.json')
              try: out[n]=json.loads(p.read_text())
              except Exception as e: out[n]={'error':type(e).__name__,'excerpt':p.read_text(errors='ignore')[:2000] if p.exists() else ''}
              cp=root/(n+'.code'); out[n+'_http']=cp.read_text().strip() if cp.exists() else None
          pathlib.Path('docs/channel-status/payapi-verification-ledger-2026-09-09.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,separators=(',',':'))[:20000])
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/channel-status/payapi-verification-ledger-2026-09-09.json
          if ! git diff --cached --quiet; then git commit -m 'ops: record PayAPI verification ledger evidence'; git push origin HEAD:master; fi
          exit 0
