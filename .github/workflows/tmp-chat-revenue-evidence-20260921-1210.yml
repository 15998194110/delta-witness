name: TMP DELTA revenue evidence 20260921 1210 JST

on:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/tmp-chat-revenue-evidence-20260921-1210.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Collect read-only evidence
        shell: bash
        run: |
          mkdir -p tmp-evidence
          node scripts/check-owner-pricing.mjs 2>&1 | tee tmp-evidence/pricing-source.txt
          node scripts/verify-owner-pricing-live.mjs 2>&1 | tee tmp-evidence/pricing-live.txt
          node scripts/query-revenue-candidates.mjs 2>&1 | tee tmp-evidence/paid-funnel.txt || true
          node scripts/scan-agentpact-demand.mjs 2>&1 | tee tmp-evidence/agentpact-demand.txt || true
          node scripts/scan-external-funded-demand.mjs 2>&1 | tee tmp-evidence/external-demand.txt || true
          DELTA_TREASURY_LOOKBACK_BLOCKS=12000 DELTA_TREASURY_CHUNK_BLOCKS=1900 node scripts/reconcile-treasury.mjs 2>&1 | tee tmp-evidence/treasury.txt
      - uses: actions/upload-artifact@v4
        with:
          name: delta-revenue-evidence-20260921-1210
          path: tmp-evidence/
          retention-days: 1
