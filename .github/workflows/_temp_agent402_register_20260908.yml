name: DELTA Agent402 Register Temp
on:
  push:
    paths:
      - '.github/workflows/_temp_agent402_register_20260908.yml'
permissions:
  contents: read
jobs:
  growth:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
      - name: Verify DELTA paid production surfaces
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://delta-witness-api.ruphussten.workers.dev'
          curl --retry 3 --retry-delay 2 --retry-all-errors -fsS "$BASE/health"
          for route in capture preflight guarded-action-pilot; do
            if [ "$route" = "capture" ]; then body='{"url":"https://example.com"}'; fi
            if [ "$route" = "preflight" ]; then body='{"url":"https://example.com","expected":{"contains":["Example Domain"]}}'; fi
            if [ "$route" = "guarded-action-pilot" ]; then body='{"urls":["https://example.com"],"objective":"Verify current public page state before action"}'; fi
            code=$(curl --retry 3 --retry-delay 2 --retry-all-errors -sS -o "/tmp/${route}.json" -D "/tmp/${route}.headers" -w '%{http_code}' -X POST "$BASE/v1/$route" -H 'content-type: application/json' --data-binary "$body")
            echo "DELTA_ROUTE=$route HTTP=$code"
            test "$code" = "402"
          done
      - name: Register origin on Agent402 free index
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN='https://delta-witness-api.ruphussten.workers.dev'
          payload=$(jq -nc --arg origin "$ORIGIN" '{origin:$origin}')
          for attempt in 1 2 3 4; do
            code=$(curl --retry 2 --retry-delay 2 --retry-all-errors -sS -o /tmp/agent402-register.json -w '%{http_code}' -X POST 'https://agent402.tools/api/index/register' -H 'content-type: application/json' --data-binary "$payload" || echo 000)
            echo "AGENT402_REGISTER_ATTEMPT=$attempt HTTP=$code"
            cat /tmp/agent402-register.json 2>/dev/null || true; echo
            if [[ "$code" =~ ^20[0-9]$ ]] || [ "$code" = "409" ]; then break; fi
            sleep $((attempt*3))
          done
          if ! [[ "$code" =~ ^20[0-9]$ ]] && [ "$code" != "409" ]; then exit 1; fi
          curl --retry 3 --retry-delay 2 --retry-all-errors -fsS 'https://agent402.tools/api/index' >/tmp/agent402-index.json
          echo 'AGENT402_READBACK_BEGIN'
          jq --arg o "$ORIGIN" '[.. | objects | select((.origin? // .url? // .baseUrl? // .endpoint? // "") == $o or ((.origin? // .url? // .baseUrl? // .endpoint? // "")|tostring|contains($o))) ] | .[:10]' /tmp/agent402-index.json
          echo 'AGENT402_READBACK_END'
          echo 'AGENT402_FIND_PREFLIGHT_BEGIN'
          curl --retry 3 --retry-delay 2 --retry-all-errors -fsS 'https://agent402.tools/api/find?q=browser%20verification%20preflight%20proof' | head -c 12000 || true
          echo; echo 'AGENT402_FIND_PREFLIGHT_END'
      - name: Reconcile Base Treasury and DELTA telemetry independently
        shell: bash
        run: |
          set -euo pipefail
          TREASURY='0x1990e21bc219696ff7fbc26527dbaed335ac6367'
          USDC='0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913'
          FIRST='0x5ae76f54c158d24f03b86aed0a20482e8de2a35983941c03fe60d131c19cd7b3'
          ok=0
          for attempt in 1 2 3 4; do
            if curl --retry 2 --retry-delay 2 --retry-all-errors -fsS --max-time 30 "https://base.blockscout.com/api/v2/addresses/${TREASURY}/token-transfers?type=ERC-20" -o /tmp/treasury.json; then ok=1; break; fi
            sleep $((attempt*3))
          done
          if [ "$ok" = "1" ]; then
            echo 'TREASURY_CANONICAL_USDC_BEGIN'
            jq --arg t "${TREASURY,,}" --arg u "${USDC,,}" '[.items[] | select(((.to.hash // .to // "")|ascii_downcase)==$t) | select(((.token.address_hash // .token.address // "")|ascii_downcase)==$u) | {timestamp,transaction_hash,from:(.from.hash // .from),to:(.to.hash // .to),value_raw:.total.value,decimals:.total.decimals}]' /tmp/treasury.json
            echo 'TREASURY_CANONICAL_USDC_END'
            echo 'TREASURY_NEW_SINCE_FIRST_BEGIN'
            jq --arg t "${TREASURY,,}" --arg u "${USDC,,}" --arg first "${FIRST,,}" '[.items[] | select(((.to.hash // .to // "")|ascii_downcase)==$t) | select(((.token.address_hash // .token.address // "")|ascii_downcase)==$u) | select(((.transaction_hash // "")|ascii_downcase)!=$first) | {timestamp,transaction_hash,from:(.from.hash // .from),value_raw:.total.value,decimals:.total.decimals}]' /tmp/treasury.json
            echo 'TREASURY_NEW_SINCE_FIRST_END'
          else
            echo 'TREASURY_BLOCKSCOUT_DEGRADED=true'
          fi
          DB='c9431b00-27c5-4609-9f3d-6af20cb162df'
          SQL="SELECT id,created_at,event,route,channel,partner,success,gross_usd,browser_ms,storage_bytes,variable_cost_usd,contribution_margin_usd FROM telemetry_events WHERE created_at > '2026-09-07 05:42:06' AND event IN ('payment_verified','capture_completed','proof_opened') ORDER BY id DESC LIMIT 100"
          jq -n --arg sql "$SQL" '{sql:$sql}' >/tmp/query.json
          echo 'D1_SETTLEMENT_TELEMETRY_BEGIN'
          curl --retry 3 --retry-delay 2 --retry-all-errors -fsS --max-time 30 -X POST "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DB}/query" -H "authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'content-type: application/json' --data-binary @/tmp/query.json | jq '{success,errors,result:[.result[]|{success,results}]}'
          echo 'D1_SETTLEMENT_TELEMETRY_END'
