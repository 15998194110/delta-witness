name: TEMP DELTA revenue reconcile 20260917 2022
on:
  push:
    branches: [master]
    paths: [.github/workflows/tmp-revenue-reconcile-20260917-2022.yml]
permissions:
  contents: read
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DELTA_PARTNER_SECRET: ${{ secrets.DELTA_PARTNER_SECRET }}
      DELTA_TREASURY_LOOKBACK_BLOCKS: '100000'
      DELTA_TREASURY_CHUNK_BLOCKS: '1900'
    steps:
      - uses: actions/checkout@v6
        with: {persist-credentials: false}
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - name: Check current owner pricing policy
        run: node scripts/check-owner-pricing.mjs
      - name: Verify live public owner prices
        run: node scripts/verify-owner-pricing-live.mjs
      - name: Query paid-funnel candidates
        run: node scripts/query-revenue-candidates.mjs | tee /tmp/delta-revenue-candidates.json
      - name: AgentPact current funded demand
        continue-on-error: true
        run: node scripts/scan-agentpact-demand.mjs | tee /tmp/delta-agentpact-demand.json
      - name: AgentExchange current funded demand
        continue-on-error: true
        run: node scripts/scan-agentexchange-demand.mjs | tee /tmp/delta-agentexchange-demand.json
      - name: External funded demand
        continue-on-error: true
        run: node scripts/scan-external-funded-demand.mjs | tee /tmp/delta-external-funded-demand.json
      - name: Reconcile canonical Base USDC Treasury
        continue-on-error: true
        run: node scripts/reconcile-treasury.mjs | tee /tmp/delta-treasury.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: delta-revenue-reconcile-${{ github.run_id }}
          path: |
            /tmp/delta-revenue-candidates.json
            /tmp/delta-agentpact-demand.json
            /tmp/delta-agentexchange-demand.json
            /tmp/delta-external-funded-demand.json
            /tmp/delta-treasury.json
          retention-days: 7
