name: TEMP DELTA revenue run 20260918-0242
on:
  push:
    branches: [master]
    paths: [.github/workflows/tmp-revenue-run-20260918-0242.yml]
permissions:
  contents: read
jobs:
  reconcile-current:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DELTA_PARTNER_SECRET: ${{ secrets.DELTA_PARTNER_SECRET }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with: {persist-credentials: false}
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - name: Owner pricing integrity
        run: node scripts/check-owner-pricing.mjs && node scripts/verify-owner-pricing-live.mjs
      - name: Paid funnel current candidates
        shell: bash
        run: |
          set -o pipefail
          node scripts/query-revenue-candidates.mjs | tee /tmp/revenue.json
      - name: Treasury current bounded overlap
        shell: bash
        env:
          DELTA_TREASURY_LOOKBACK_BLOCKS: '20000'
          DELTA_TREASURY_CHUNK_BLOCKS: '1500'
        run: |
          set -o pipefail
          node scripts/reconcile-treasury.mjs | tee /tmp/treasury.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: delta-current-revenue-${{ github.run_id }}
          path: |
            /tmp/revenue.json
            /tmp/treasury.json
          retention-days: 7
