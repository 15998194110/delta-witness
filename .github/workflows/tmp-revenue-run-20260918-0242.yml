name: TEMP DELTA revenue run 20260918-0242
on:
  push:
    branches: [master]
    paths: [.github/workflows/tmp-revenue-run-20260918-0242.yml]
permissions:
  contents: read
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DELTA_PARTNER_SECRET: ${{ secrets.DELTA_PARTNER_SECRET }}
    steps:
      - uses: actions/checkout@v6
        with: {persist-credentials: false}
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - name: Owner pricing integrity
        run: node scripts/check-owner-pricing.mjs && node scripts/verify-owner-pricing-live.mjs
      - name: Paid funnel
        run: node scripts/query-revenue-candidates.mjs | tee /tmp/revenue.json
      - name: AgentPact funded demand
        continue-on-error: true
        run: node scripts/scan-agentpact-demand.mjs | tee /tmp/agentpact.json
      - name: AgentExchange funded demand
        continue-on-error: true
        run: node scripts/scan-agentexchange-demand.mjs | tee /tmp/agentexchange.json
      - name: Additional funded demand
        continue-on-error: true
        run: node scripts/scan-external-funded-demand.mjs | tee /tmp/external.json
      - name: Treasury
        env:
          DELTA_TREASURY_LOOKBACK_BLOCKS: '120000'
          DELTA_TREASURY_CHUNK_BLOCKS: '1900'
        run: node scripts/reconcile-treasury.mjs | tee /tmp/treasury.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: delta-revenue-run-${{ github.run_id }}
          path: |
            /tmp/revenue.json
            /tmp/agentpact.json
            /tmp/agentexchange.json
            /tmp/external.json
            /tmp/treasury.json
          retention-days: 7
