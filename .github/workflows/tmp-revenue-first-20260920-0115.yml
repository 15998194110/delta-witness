name: TEMP DELTA revenue-first reconcile 20260920-0115
on:
  push:
    branches: [master]
    paths: [.github/workflows/tmp-revenue-first-20260920-0115.yml]
permissions:
  contents: read
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DELTA_PARTNER_SECRET: ${{ secrets.DELTA_PARTNER_SECRET }}
    steps:
      - uses: actions/checkout@v6
        with: {persist-credentials: false}
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - name: Verify current owner pricing and live 402 invariants
        run: |
          node scripts/check-owner-pricing.mjs
          node scripts/verify-owner-pricing-live.mjs | tee /tmp/delta-live-pricing.json
      - name: Scan AgentPact funded buyer demand
        continue-on-error: true
        run: node scripts/scan-agentpact-demand.mjs | tee /tmp/delta-agentpact-demand.json
      - name: Scan external funded buyer demand
        continue-on-error: true
        run: node scripts/scan-external-funded-demand.mjs | tee /tmp/delta-external-funded-demand.json
      - name: Audit paid funnel candidates
        continue-on-error: true
        run: node scripts/query-revenue-candidates.mjs | tee /tmp/delta-revenue-candidates.json
      - name: Reconcile canonical Base USDC Treasury
        env:
          DELTA_TREASURY_LOOKBACK_BLOCKS: '20000'
          DELTA_TREASURY_CHUNK_BLOCKS: '1900'
        run: node scripts/reconcile-treasury.mjs | tee /tmp/delta-treasury.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: delta-revenue-first-${{ github.run_id }}
          path: |
            /tmp/delta-live-pricing.json
            /tmp/delta-agentpact-demand.json
            /tmp/delta-external-funded-demand.json
            /tmp/delta-revenue-candidates.json
            /tmp/delta-treasury.json
          if-no-files-found: warn
          retention-days: 7
