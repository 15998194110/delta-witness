name: DELTA Market402 Requalify Temp
on:
  push:
    paths:
      - '.github/workflows/_temp_market402_requalify_20260908.yml'
permissions:
  contents: read
jobs:
  requalify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Re-submit paid probe opt-in after Bazaar catalog inclusion
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess
          base='https://delta-witness-api.ruphussten.workers.dev'
          items=[
            ('capture',base+'/v1/capture',0.03,{'method':'POST','body':{'url':'https://example.com'}}),
            ('preflight',base+'/v1/preflight',0.03,{'method':'POST','body':{'url':'https://example.com','expected':{'contains':['Example Domain']}}}),
          ]
          def post(path,payload):
              p=subprocess.run(['curl','-sS','--retry','4','--retry-delay','2','--retry-all-errors','--max-time','30','-w','\nHTTP_STATUS:%{http_code}','-X','POST','https://market402.com'+path,'-H','content-type: application/json','--data',json.dumps(payload)],capture_output=True,text=True)
              return {'rc':p.returncode,'body':p.stdout.strip()[:12000],'err':p.stderr.strip()[:2000]}
          for name,url,price,sample in items:
              st=post('/selftest',{'url':url})
              sub=post('/submit',{'resource':url,'declared_price_usd':price,'paid_probe_optin':True,'sample_input':sample})
              print('MARKET402_REQUALIFY='+json.dumps({'name':name,'selftest':st,'submit':sub},separators=(',',':')))
          PY
