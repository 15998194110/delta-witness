name: DELTA one-shot x402scan canonical registration 20260912
on:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/tmp-x402scan-register-20260912.yml"
  workflow_dispatch:

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - name: Enforce owner pricing policy before price-bearing registry write
        run: node scripts/check-owner-pricing.mjs
      - name: Verify live canonical 402 prices before registry write
        run: node scripts/verify-owner-pricing-live.mjs
      - name: Duplicate-check and register canonical origin on x402scan
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const base = 'https://www.x402scan.com/api/trpc';
          const origin = 'https://delta-witness-api.ruphussten.workers.dev';
          const resources = [
            {url: origin + '/v1/capture', method:'POST'},
            {url: origin + '/v1/preflight', method:'POST'},
            {url: origin + '/v1/guarded-action-pilot', method:'POST'},
          ];

          async function fetchBounded(url, opts = {}, max = 4) {
            let last;
            for (let i=1; i<=max; i++) {
              try {
                const r = await fetch(url, { ...opts, signal: AbortSignal.timeout(25000) });
                const text = await r.text();
                if (r.ok) return {ok:true,status:r.status,text,attempt:i};
                last = {ok:false,status:r.status,text,attempt:i};
                if (![408,425,429,500,502,503,504].includes(r.status)) return last;
              } catch (e) {
                last = {ok:false,status:0,text:String(e),attempt:i};
              }
              await new Promise(r=>setTimeout(r, Math.min(8000, 1000 * 2**(i-1))));
            }
            return last;
          }

          const qInput = encodeURIComponent(JSON.stringify({json:{resources}}));
          const checkUrl = `${base}/public.resources.checkRegistered?input=${qInput}`;
          const checked = await fetchBounded(checkUrl, {headers:{accept:'application/json'}});
          console.log('X402SCAN_DUPLICATE_CHECK', JSON.stringify(checked));
          if (!checked.ok) {
            console.error('Duplicate check did not succeed; refusing registry mutation.');
            process.exit(2);
          }
          let payload;
          try { payload = JSON.parse(checked.text); } catch { console.error('Malformed duplicate-check JSON; refusing mutation.'); process.exit(3); }
          const data = payload?.result?.data?.json ?? payload?.result?.data ?? payload?.json ?? payload;
          const registered = Array.isArray(data?.registered) ? data.registered : [];
          const unregistered = Array.isArray(data?.unregistered) ? data.unregistered : [];
          console.log('X402SCAN_DUPLICATE_STATE', JSON.stringify({registered,unregistered}));
          if (unregistered.length === 0) {
            console.log('X402SCAN_RESULT', JSON.stringify({channel:'x402scan', listing_status:'already_listed', discovery_status:'present', duplicate_avoided:true, submission_attempts:0, evidence_quality:'A_official_public_registry_api'}));
            process.exit(0);
          }

          const body = JSON.stringify({json:{origin}});
          const submitted = await fetchBounded(`${base}/public.resources.registerFromOrigin`, {
            method:'POST',
            headers:{'content-type':'application/json',accept:'application/json'},
            body,
          });
          console.log('X402SCAN_SUBMIT_RESPONSE', JSON.stringify(submitted));
          if (!submitted.ok) process.exit(4);
          let sp;
          try { sp = JSON.parse(submitted.text); } catch { console.error('Malformed submit JSON'); process.exit(5); }
          const sd = sp?.result?.data?.json ?? sp?.result?.data ?? sp?.json ?? sp;
          console.log('X402SCAN_RESULT', JSON.stringify({channel:'x402scan', listing_status:sd?.success === false ? 'submission_rejected' : 'submitted', discovery_status:'registration_attempted', duplicate_avoided:false, submission_attempts:submitted.attempt, evidence_quality:'A_official_public_registry_api', response:sd}));
          if (sd?.success === false) process.exit(6);
          NODE
