name: DELTA Clear Preflight Override Turn 4

on:
  push:
    paths:
      - '.github/workflows/_temp_growth_turn4_clear_preflight_override_20260909.yml'

permissions:
  contents: read

jobs:
  clear-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Require Cloudflare bootstrap
        run: test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
      - run: npm ci
      - name: Inspect and clear stale Preflight override
        shell: bash
        run: |
          set -u
          TARGET='delta-witness-proofs/pricing-overrides/preflight.json'
          echo '=== CURRENT_OVERRIDE ==='
          if npx wrangler r2 object get "$TARGET" --remote --file /tmp/preflight-override.json; then
            cat /tmp/preflight-override.json | jq '{schema,product,minimum_price_usd,reason,updated_at}'
          else
            echo '{"override":"not_readable_or_absent"}'
          fi
          echo '=== DELETE_OVERRIDE ==='
          ok=0
          for delay in 0 2 5; do
            if [ "$delay" -gt 0 ]; then sleep "$delay"; fi
            if npx wrangler r2 object delete "$TARGET" --remote; then ok=1; break; fi
          done
          if [ "$ok" -ne 1 ]; then
            echo 'override_delete_exhausted' >&2
            exit 1
          fi
      - name: Verify direct production Capture and Preflight at $0.03
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN='https://delta-witness-api.ruphussten.workers.dev'
          TREASURY='0x1990e21bc219696ff7fbc26527dbaed335ac6367'
          probe() {
            route="$1"; body="$2"
            code=$(curl --retry 5 --retry-delay 3 --retry-all-errors -sS --max-time 30 -o /tmp/body.json -w '%{http_code}' -X POST "$ORIGIN$route" -H 'content-type: application/json' --data-binary "$body")
            test "$code" = 402
            jq -e --arg treasury "$TREASURY" '.accepts[0].amount == "30000" and ((.accepts[0].payTo|ascii_downcase) == ($treasury|ascii_downcase)) and .accepts[0].network == "eip155:8453"' /tmp/body.json >/dev/null
            jq --arg route "$route" '{route:$route,product,price_usd,amount:.accepts[0].amount,payTo:.accepts[0].payTo,network:.accepts[0].network}' /tmp/body.json
          }
          probe '/v1/capture' '{"url":"https://example.com"}'
          probe '/v1/preflight' '{"url":"https://example.com","expected":{"contains":["Example Domain"]}}'
      - name: Verify Payan routed Capture and Preflight at $0.03 and Pilot at $10
        shell: bash
        run: |
          set -euo pipefail
          TREASURY='0x1990e21bc219696ff7fbc26527dbaed335ac6367'
          probe() {
            name="$1"; id="$2"; body="$3"; amount="$4"
            code=$(curl --retry 5 --retry-delay 3 --retry-all-errors -sS --max-time 30 -o /tmp/payan.json -w '%{http_code}' -X POST "https://payanagent.com/x402/$id" -H 'content-type: application/json' --data-binary "$body")
            test "$code" = 402
            jq -e --arg amount "$amount" --arg treasury "$TREASURY" '.accepts[0].amount == $amount and ((.accepts[0].payTo|ascii_downcase) == ($treasury|ascii_downcase)) and .accepts[0].network == "eip155:8453"' /tmp/payan.json >/dev/null
            jq --arg name "$name" '{name:$name,product,price_usd,amount:.accepts[0].amount,payTo:.accepts[0].payTo,network:.accepts[0].network}' /tmp/payan.json
          }
          probe capture kh79t54410qb82yjcqsjmgv0d58dn7p3 '{"url":"https://example.com"}' '30000'
          probe preflight kh72vd1kdv37109xxzzgmn2xfn8dnc6z '{"url":"https://example.com","expected":{"contains":["Example Domain"]}}' '30000'
          probe guarded-action-pilot kh7dskbdz0mj2ctc0dvm6q1yb98dz8dm '{"urls":["https://example.com"],"preflight":{"url_index":0,"expected":{"contains":["Example Domain"]}}}' '10000000'
