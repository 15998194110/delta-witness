name: TEMP DELTA revenue run 20260918-1428
on:
  push:
    branches: [master]
    paths: [.github/workflows/tmp-revenue-run-20260918-1428.yml]
permissions:
  contents: read
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DELTA_INDEXNOW_ADMIN_SECRET: ${{ secrets.DELTA_INDEXNOW_ADMIN_SECRET }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DELTA_PARTNER_SECRET: ${{ secrets.DELTA_PARTNER_SECRET }}
      DELTA_TREASURY_LOOKBACK_BLOCKS: '100000'
      DELTA_TREASURY_CHUNK_BLOCKS: '1900'
    steps:
      - uses: actions/checkout@v6
        with: {persist-credentials: false}
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - name: Verify current owner pricing
        run: |
          node scripts/check-owner-pricing.mjs | tee /tmp/pricing-check.txt
          node scripts/verify-owner-pricing-live.mjs | tee /tmp/pricing-live.json
      - name: AgentPact funded buyer demand
        continue-on-error: true
        run: node scripts/scan-agentpact-demand.mjs | tee /tmp/agentpact.json
      - name: External funded buyer demand
        continue-on-error: true
        run: node scripts/scan-external-funded-demand.mjs | tee /tmp/funded.json
      - name: Paid funnel candidates
        continue-on-error: true
        run: node scripts/query-revenue-candidates.mjs | tee /tmp/revenue-candidates.json
      - name: Canonical Base Treasury
        run: node scripts/reconcile-treasury.mjs | tee /tmp/treasury.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: delta-revenue-run-${{ github.run_id }}
          path: |
            /tmp/pricing-check.txt
            /tmp/pricing-live.json
            /tmp/agentpact.json
            /tmp/funded.json
            /tmp/revenue-candidates.json
            /tmp/treasury.json
          retention-days: 7
