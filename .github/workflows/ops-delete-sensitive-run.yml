name: DELTA One-Shot Sensitive Log Cleanup

on:
  push:
    paths:
      - '.github/workflows/ops-delete-sensitive-run.yml'

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Delete sensitive Robauto workflow run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/out -w '%{http_code}' -X DELETE \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/15998194110/delta-witness/actions/runs/34319816434')
          echo "delete_status=$code"
          if [ "$code" != 204 ] && [ "$code" != 404 ]; then
            cat /tmp/out
            exit 1
          fi
