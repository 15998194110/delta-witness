name: Autonomous Growth Turn 10 Demand Scan
on:
  push:
    branches: [master]
    paths: ['.github/workflows/autonomous-growth-turn10-demand-scan.yml']
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Scan funded buyer demand and settled receipts
        shell: bash
        run: |
          set -u
          echo '=== PAYAN_OPEN ==='
          code=$(curl --retry 4 --retry-delay 2 --retry-all-errors -sS --max-time 30 -o /tmp/req.json -w '%{http_code}' 'https://payanagent.com/api/v1/requests?status=open&limit=200' || true)
          echo "HTTP=$code"
          if [ "$code" = 200 ]; then
            echo 'FUNDED_ESCROW'
            jq -c '[.requests // .items // .data // [] | .[] | select((.escrow//false)==true and (.escrowDepositedCents//0)>0) | {id:(._id//.id),title,description,budgetMaxCents,escrowDepositedCents,escrowReceiptId,status,bidCount,acceptedBidId,providerId,buyerId}]' /tmp/req.json
          else cat /tmp/req.json; fi
          echo '=== PAYAN_RECEIPTS_DELTA ==='
          rcode=$(curl --retry 4 --retry-delay 2 --retry-all-errors -sS --max-time 30 -o /tmp/receipts.json -w '%{http_code}' 'https://payanagent.com/api/v1/receipts?limit=200' || true)
          echo "HTTP=$rcode"
          if [ "$rcode" = 200 ]; then
            jq -c '[.receipts // .items // .data // [] | .[] | select((tostring|contains("ks76vc9pzpz3qfgf8aawjckn5n8bezhf")) or (tostring|contains("jd79ndx8s7y59tkcvjbars0vf18e33z9")) or ((.sellerWallet//.providerWallet//.payTo//"")|ascii_downcase)=="0x1990e21bc219696ff7fbc26527dbaed335ac6367") ]' /tmp/receipts.json
          else cat /tmp/receipts.json; fi
          echo '=== AGENT_EXCHANGE ==='
          node <<'NODE'
          const endpoint='https://store.agentexchange.work/mcp';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function mcp(body){let last;for(let i=0;i<4;i++){try{const r=await fetch(endpoint,{method:'POST',headers:{'content-type':'application/json','accept':'application/json, text/event-stream','mcp-protocol-version':'2025-06-18'},body:JSON.stringify(body)});const t=await r.text();if(r.status===429||r.status>=500){last=new Error(String(r.status));await sleep(500*2**i);continue}return {status:r.status,text:t}}catch(e){last=e;await sleep(500*2**i)}}throw last}
          function parse(t){const ds=t.split(/\r?\n/).filter(x=>x.startsWith('data:')).map(x=>x.slice(5).trim());try{return JSON.parse(ds.at(-1)||t)}catch{return {raw:t}}}
          try{
            await mcp({jsonrpc:'2.0',id:1,method:'initialize',params:{protocolVersion:'2025-06-18',capabilities:{},clientInfo:{name:'delta-witness-growth',version:'1.0.0'}}});
            const l=await mcp({jsonrpc:'2.0',id:2,method:'tools/list',params:{}}); const tools=parse(l.text)?.result?.tools||[];
            const list=tools.find(t=>t.name==='market_list_tasks'); console.log('LIST_SCHEMA='+JSON.stringify(list||null));
            if(list){const c=await mcp({jsonrpc:'2.0',id:3,method:'tools/call',params:{name:'market_list_tasks',arguments:{status:'open',limit:100}}}); console.log('TASKS='+c.status+' '+c.text.slice(0,120000));}
          }catch(e){console.log('AGENT_EXCHANGE_ERR='+String(e))}
          NODE
