name: Dispatch DELTA 0.7 Distribution Release

on:
  push:
    paths:
      - '.github/workflows/dispatch-release-0.7.yml'

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch canonical release train
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/dispatch.out -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/release-train.yml/dispatches" \
            -d '{"ref":"master"}')
          cat /tmp/dispatch.out || true
          test "$code" = '204'
          echo 'RELEASE_DISPATCHED=true'
