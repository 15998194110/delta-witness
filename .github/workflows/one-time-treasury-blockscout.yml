name: One-time Treasury Blockscout Fallback
on:
  push:
    paths:
      - '.github/workflows/one-time-treasury-blockscout.yml'

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Query Base Blockscout with retries and independent fallbacks
        shell: python
        run: |
          import json, time, urllib.parse, urllib.request, urllib.error

          TREASURY="0x1990e21bc219696ff7fbc26527dbaed335ac6367"
          USDC="0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"
          START=51040990
          UA={"accept":"application/json","user-agent":"DELTA-Witness-reconciliation/1.0"}

          def get(url):
              errors=[]
              for attempt in range(4):
                  try:
                      req=urllib.request.Request(url,headers=UA)
                      with urllib.request.urlopen(req,timeout=35) as r:
                          raw=r.read().decode()
                          return r.status,json.loads(raw),errors
                  except urllib.error.HTTPError as e:
                      body=e.read().decode(errors="replace")
                      errors.append({"attempt":attempt+1,"status":e.code,"body":body[:500]})
                  except Exception as e:
                      errors.append({"attempt":attempt+1,"error":f"{type(e).__name__}: {e}"})
                  time.sleep(2**attempt)
              return None,None,errors

          legacy=(
              "https://base.blockscout.com/api?module=account&action=tokentx"
              f"&contractaddress={USDC}&address={TREASURY}&startblock={START}"
              "&endblock=99999999&page=1&offset=100&sort=asc"
          )
          ls,lp,le=get(legacy)

          v2=f"https://base.blockscout.com/api/v2/addresses/{TREASURY}/token-transfers?type=ERC-20"
          vs,vp,ve=get(v2)

          blocks="https://base.blockscout.com/api/v2/blocks?type=block"
          bs,bp,be=get(blocks)

          incoming=[]
          if isinstance(lp,dict) and isinstance(lp.get("result"),list):
              for x in lp["result"]:
                  if str(x.get("contractAddress","")).lower()==USDC.lower() and str(x.get("to","")).lower()==TREASURY.lower():
                      incoming.append({"source":"legacy","block":int(x.get("blockNumber",0)),"tx":x.get("hash"),"raw_amount":x.get("value")})

          # V2 fallback is filtered locally, including nested address/token shapes.
          if not incoming and isinstance(vp,dict) and isinstance(vp.get("items"),list):
              for x in vp["items"]:
                  token=x.get("token") or {}
                  to=x.get("to") or {}
                  token_addr=str(token.get("address_hash") or token.get("address") or "").lower()
                  to_addr=str(to.get("hash") or x.get("to_hash") or "").lower()
                  block=int(x.get("block_number") or 0)
                  if block>=START and token_addr==USDC.lower() and to_addr==TREASURY.lower():
                      total=x.get("total") or {}
                      value=total.get("value") if isinstance(total,dict) else x.get("value")
                      incoming.append({"source":"v2","block":block,"tx":x.get("transaction_hash"),"raw_amount":value})

          latest_block=None
          if isinstance(bp,dict) and isinstance(bp.get("items"),list) and bp["items"]:
              latest_block=bp["items"][0].get("height") or bp["items"][0].get("number")

          print(json.dumps({
              "treasury_reconciliation":"blockscout_fallback",
              "start_block":START,
              "legacy_status":ls,"legacy_payload":lp,"legacy_errors":le,
              "v2_status":vs,"v2_item_count":len(vp.get("items",[])) if isinstance(vp,dict) else None,"v2_errors":ve,
              "latest_block_status":bs,"latest_block":latest_block,"latest_block_errors":be,
              "incoming_count":len(incoming),"incoming":incoming,
          }))

          if ls!=200 and vs!=200:
              raise SystemExit(1)
