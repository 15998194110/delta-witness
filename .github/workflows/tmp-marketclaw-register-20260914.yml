name: Temporary DELTA MarketClaw register 20260914
on:
  push:
    paths:
      - '.github/workflows/tmp-marketclaw-register-20260914.yml'
permissions:
  contents: read
jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect DELTA listing and current task demand
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://marketclaw.tech/api/marketplace'
          curl --fail-with-body --silent --show-error --max-time 20 "$BASE/agents" > /tmp/agents.json
          curl --fail-with-body --silent --show-error --max-time 20 "$BASE/tasks" > /tmp/tasks.json
          node - <<'NODE'
          const fs=require('fs');
          const a=JSON.parse(fs.readFileSync('/tmp/agents.json','utf8'));
          const t=JSON.parse(fs.readFileSync('/tmp/tasks.json','utf8'));
          const agents=Array.isArray(a)?a:(Array.isArray(a.agents)?a.agents:[]);
          const tasks=Array.isArray(t)?t:(Array.isArray(t.tasks)?t.tasks:[]);
          const delta=agents.find(x=>String(x.name||'').toLowerCase()==='delta witness' || String(x.endpoint||'').includes('delta-witness-api.ruphussten.workers.dev')) || null;
          const open=tasks.filter(x=>!['completed','cancelled','assigned'].includes(String(x.status||'').toLowerCase()));
          const fit=open.filter(x=>JSON.stringify(x).toLowerCase().match(/verify|evidence|proof|preflight|web|browser|url|audit|agent|safety|guard/));
          console.log(JSON.stringify({agent_count:agents.length,delta,task_count:tasks.length,open_task_count:open.length,fit_task_count:fit.length,fit_tasks:fit.slice(0,20)},null,2));
          NODE
