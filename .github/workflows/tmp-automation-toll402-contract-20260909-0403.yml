name: TMP DELTA TOLL402 Contract 20260909 0403
on:
  push:
    paths:
      - '.github/workflows/tmp-automation-toll402-contract-20260909-0403.yml'
permissions:
  contents: write
jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Resolve public form POST contract
        shell: bash
        run: |
          set -euo pipefail
          PAGE='https://toll402.com/submit'
          curl -fsS --retry 4 --retry-delay 2 "$PAGE" -o /tmp/page
          SRC=$(python - <<'PY'
          import re
          s=open('/tmp/page',errors='ignore').read()
          a=re.findall(r'<script[^>]+src=["\']([^"\']+)',s,re.I)
          print(next((x for x in a if '/app/submit/' in x),''))
          PY
          )
          test -n "$SRC"
          case "$SRC" in http*) URL="$SRC";; *) URL="https://toll402.com$SRC";; esac
          curl -fsS --retry 4 --retry-delay 2 "$URL" -o /tmp/js
          python - <<'PY' > docs/evidence/toll402-submit-contract-2026-09-09.txt
          import re
          s=open('/tmp/js',errors='ignore').read()
          print('script_length',len(s))
          for needle in ['/api/contact','fetch(','JSON.stringify','submission','submit']:
            print('\n===== '+needle+' =====')
            start=0; n=0
            while n<20:
              i=s.find(needle,start)
              if i<0: break
              print(s[max(0,i-2500):i+4500])
              print('\n--- HIT END ---\n')
              start=i+len(needle); n+=1
          PY
      - name: Persist
        shell: bash
        run: |
          git config user.name 'DELTA automation'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/evidence/toll402-submit-contract-2026-09-09.txt
          git commit -m 'ops: resolve TOLL402 public submission contract'
          git push
