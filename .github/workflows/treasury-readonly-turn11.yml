name: Treasury Readonly Turn 11
on:
  push:
    branches: [master]
    paths: ['.github/workflows/treasury-readonly-turn11.yml']
permissions:
  contents: read
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Canonical Base USDC Treasury reconciliation
        env:
          DELTA_TREASURY_LOOKBACK_BLOCKS: '50000'
          DELTA_TREASURY_CHUNK_BLOCKS: '1900'
        run: node scripts/reconcile-treasury.mjs
