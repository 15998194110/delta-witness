name: Verify DELTA Pilot Production Now

on:
  push:
    paths:
      - '.github/workflows/verify-pilot-production-now.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify live discovery and exact unpaid contracts
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://delta-witness-api.ruphussten.workers.dev'
          TREASURY='0x1990e21bc219696ff7fbc26527dbaed335ac6367'
          NETWORK='eip155:8453'

          curl --fail --retry 5 --retry-all-errors --retry-delay 2 "$BASE/.well-known/x402" -o /tmp/x402.json
          curl --fail --retry 5 --retry-all-errors --retry-delay 2 "$BASE/distribution.json" -o /tmp/distribution.json
          curl --fail --retry 5 --retry-all-errors --retry-delay 2 "$BASE/llms.txt" -o /tmp/llms.txt
          grep -q 'guarded-action-pilot' /tmp/x402.json
          grep -q 'guarded-action-pilot' /tmp/distribution.json
          grep -q 'guarded-action-pilot' /tmp/llms.txt

          for route in capture preflight; do
            if [ "$route" = capture ]; then
              data='{"url":"https://example.com"}'
            else
              data='{"url":"https://example.com","expected":{"contains":["Example Domain"]}}'
            fi
            status="$(curl --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 -o "/tmp/${route}.json" -D "/tmp/${route}.headers" -w '%{http_code}' -X POST "$BASE/v1/$route" -H 'content-type: application/json' -d "$data")"
            test "$status" = '402'
            grep -qi '^payment-required:' "/tmp/${route}.headers"
            node - "/tmp/${route}.json" "$route" <<'NODE'
          const fs=require('fs');
          const [file,route]=process.argv.slice(2);
          const x=JSON.parse(fs.readFileSync(file,'utf8'));
          if (x.price_usd !== 0.03) throw new Error(`${route} price changed: ${JSON.stringify(x)}`);
          if (x.network && x.network !== 'eip155:8453') throw new Error(`${route} network changed: ${JSON.stringify(x)}`);
          console.log(JSON.stringify({route,status:402,price_usd:x.price_usd,network:x.network||null}));
          NODE
          done

          status="$(curl --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 -o /tmp/pilot.json -D /tmp/pilot.headers -w '%{http_code}' -X POST "$BASE/v1/guarded-action-pilot" -H 'content-type: application/json' -d '{"urls":["https://example.com"],"preflight":{"url_index":0,"expected":{"contains":["Example Domain"]}}}')"
          test "$status" = '402'
          grep -qi '^payment-required:' /tmp/pilot.headers
          node - /tmp/pilot.json /tmp/pilot.headers "$TREASURY" "$NETWORK" <<'NODE'
          const fs=require('fs');
          const [bodyFile,headerFile,treasury,network]=process.argv.slice(2);
          const body=JSON.parse(fs.readFileSync(bodyFile,'utf8'));
          if (body.price_usd !== 10 || body.product !== 'guarded_action_pilot' || body.network !== network) {
            throw new Error(`pilot body mismatch: ${JSON.stringify(body)}`);
          }
          const headers=fs.readFileSync(headerFile,'utf8').split(/\r?\n/);
          const raw=(headers.find(x=>/^payment-required:/i.test(x))||'').replace(/^[^:]+:\s*/,'').trim();
          if (!raw) throw new Error('missing Payment-Required value');
          let decoded=raw;
          try { decoded=Buffer.from(raw.replace(/-/g,'+').replace(/_/g,'/'),'base64').toString('utf8'); } catch {}
          const hay=(raw+' '+decoded).toLowerCase();
          if (!hay.includes(treasury.toLowerCase())) throw new Error(`Payment-Required missing Treasury: ${decoded}`);
          if (!hay.includes(network.toLowerCase())) throw new Error(`Payment-Required missing network: ${decoded}`);
          if (!(hay.includes('10000000') || hay.includes('$10') || hay.includes('"10"'))) throw new Error(`Payment-Required missing 10 USDC amount: ${decoded}`);
          console.log(JSON.stringify({route:'/v1/guarded-action-pilot',status:402,price_usd:10,network,treasury,payment_required_verified:true,discovery_verified:true}));
          NODE

      - name: Reconcile Base Treasury independently
        shell: bash
        run: |
          set -u
          URL='https://base.blockscout.com/api/v2/addresses/0x1990e21bc219696ff7fbc26527dbaed335ac6367/token-transfers?type=ERC-20'
          if ! curl -sS --fail --retry 5 --retry-all-errors --retry-delay 2 "$URL" -o /tmp/transfers.json; then
            echo '{"treasury_probe":"degraded","reason":"blockscout_unavailable"}'
            exit 0
          fi
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/transfers.json'))
          usdc='0x833589fcd6edb6e08f4c7c32d4f71b54bda02913'
          addr='0x1990e21bc219696ff7fbc26527dbaed335ac6367'
          out=[]
          for x in d.get('items',[]):
              token=x.get('token') or {}
              ta=(token.get('address_hash') or token.get('address') or '').lower()
              to=x.get('to') or {}
              toh=(to.get('hash') if isinstance(to,dict) else to or '').lower()
              if ta!=usdc or toh!=addr: continue
              total=x.get('total') or {}
              raw=total.get('value') if isinstance(total,dict) else x.get('value')
              try: amount=int(raw)/(10**int(token.get('decimals') or 6))
              except: amount=raw
              fr=x.get('from') or {}
              out.append({'tx_hash':x.get('transaction_hash'),'timestamp':x.get('timestamp'),'from':fr.get('hash') if isinstance(fr,dict) else fr,'amount_usdc':amount})
          print(json.dumps({'treasury_probe':'ok','latest_incoming_usdc':out[:20]},ensure_ascii=False))
          PY
