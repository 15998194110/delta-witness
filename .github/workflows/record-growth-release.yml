name: Record DELTA growth release milestone

on:
  push:
    paths:
      - '.github/workflows/record-growth-release.yml'

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: master
      - name: Record evidence-gated distribution milestone
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('docs/growth-ledger.md')
          s=p.read_text()
          rows=(
          '| 2026-09-07T06:56:27+08:00 | Official MCP Registry / `delta-witness-mcp@0.7.0` | live | successfully published upstream; public npm smoke passed | 0 | 0 | 0 | 0 | 0 | 0.00 | 0.00 | 0.00 | 0.00 | A | Canonical release train used GitHub OIDC with the official `mcp-publisher`; registry validation passed, login succeeded, and publisher returned `Successfully published` for `io.github.15998194110/delta-witness` version `0.7.0`. Public npm smoke then installed version `0.7.0` and exercised quote/MCP tools successfully. This is a distribution milestone, not buyer activity or revenue. |\n'
          '| 2026-09-07T06:56:29+08:00 | npm + PyPI distribution | live | release 0.7.0 published and public smoke-verified | 0 | 0 | 0 | 0 | 0 | 0.00 | 0.00 | 0.00 | 0.00 | A | Canonical release train completed successfully: npm JS client, npm MCP package and PyPI client publish jobs succeeded; public npm and public PyPI smoke jobs succeeded. Postman and Apify publish jobs were skipped because their configured gates were not enabled. |\n'
          '| 2026-09-07T06:54:00+08:00 | Coinbase x402 Bazaar merchant discovery | not_indexed | official merchant discovery returned HTTP 200 with `total=0` for DELTA Treasury | 0 | 0 | 0 | 0 | 0 | 0.00 | 0.00 | 0.00 | 0.00 | A | Official Coinbase merchant discovery queried `payTo=0x1990e21bc219696ff7fbc26527dbaed335ac6367`; response contained no resources. Therefore do not claim automatic Agentic Market/Bazaar distribution yet. |\n'
          '| 2026-09-07T06:54:00+08:00 | Base Treasury `0x1990e21bc219696ff7fbc26527dbaed335ac6367` | n/a | independently reconciled | 0 | 0 | 0 | 0 | 0 | 0.00 | 0.00 | 0.00 | 0.00 | A | Independent hosted-runner Blockscout query returned `TREASURY_RESULT=[]`; no canonical incoming USDC, so no First Stranger Revenue is recognized. |\n'
          )
          needle='|---|---|---|---|---:|---:|---:|---:|---:|---:|---:|---:|---:|---|---|\n'
          if 'Official MCP Registry / `delta-witness-mcp@0.7.0`' not in s:
              s=s.replace(needle,needle+rows,1)
              p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if git diff --quiet -- docs/growth-ledger.md; then
            echo 'LEDGER_ALREADY_CURRENT=true'
            exit 0
          fi
          git add docs/growth-ledger.md
          git commit -m 'growth: record MCP registry and 0.7 distribution'
          git push origin HEAD:master
