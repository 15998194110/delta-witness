name: TEMP DELTA run10 current revenue reconcile 0648
on:
  push:
    branches: [master]
    paths: [.github/workflows/tmp-run10-reconcile-20260917-0648.yml]
permissions:
  contents: read
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with: {persist-credentials: false}
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - name: Verify current owner pricing and public purchase invariants without payment
        run: node scripts/check-owner-pricing.mjs && node scripts/verify-owner-pricing-live.mjs | tee /tmp/delta-live-pricing.txt
      - name: Audit current paid-funnel candidates
        run: node scripts/query-revenue-candidates.mjs | tee /tmp/delta-revenue-candidates.json
      - name: Reconcile canonical Base USDC Treasury independently
        env:
          DELTA_TREASURY_LOOKBACK_BLOCKS: '90000'
          DELTA_TREASURY_CHUNK_BLOCKS: '1900'
        run: node scripts/reconcile-treasury.mjs | tee /tmp/delta-treasury.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: delta-run10-reconcile-${{ github.run_id }}
          path: |
            /tmp/delta-live-pricing.txt
            /tmp/delta-revenue-candidates.json
            /tmp/delta-treasury.json
          retention-days: 7
