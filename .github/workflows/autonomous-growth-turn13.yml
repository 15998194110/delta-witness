name: Autonomous Growth Turn 13 Walnut
on:
  push:
    branches: [master]
    paths: ['.github/workflows/autonomous-growth-turn13.yml']
permissions:
  contents: read
jobs:
  walnut:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - name: Validate official Registry source and index on Walnut World
        shell: bash
        run: |
          set +e
          REG='https://registry.modelcontextprotocol.io/v0.1/servers/io.github.15998194110%2Fdelta-witness/versions/latest'
          echo '=== REGISTRY SOURCE ==='
          curl --retry 3 --retry-all-errors --retry-delay 1 -sS -D /tmp/reg.headers -o /tmp/reg.json -w 'HTTP=%{http_code}\n' "$REG"
          cat /tmp/reg.json | head -c 5000; echo
          npm --silent install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null
          cat > walnut-run.mjs <<'JS'
          import { chromium } from 'playwright';
          const REG='https://registry.modelcontextprotocol.io/v0.1/servers/io.github.15998194110%2Fdelta-witness/versions/latest';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage();
          const mutations=[];
          page.on('response', async r=>{
            if(r.request().method()!=='GET'){
              let body=''; try{body=(await r.text()).slice(0,6000)}catch{}
              mutations.push({method:r.request().method(),url:r.url(),status:r.status(),body});
            }
          });
          try{
            let loaded=false;
            for(let a=1;a<=3&&!loaded;a++){
              try{await page.goto('https://walnut.world/',{waitUntil:'domcontentloaded',timeout:60000});loaded=true}catch(e){console.log('NAV_RETRY_'+a+'='+String(e));await page.waitForTimeout(1200*a)}
            }
            if(!loaded) throw new Error('Walnut unavailable after bounded retries');
            await page.waitForTimeout(1200);
            const source=page.getByPlaceholder('https://github.com/owner/repo').first();
            console.log('SOURCE_INPUT_COUNT='+await source.count());
            if(await source.count()) await source.fill(REG);
            const index=page.getByRole('button',{name:/index it/i}).first();
            console.log('INDEX_BUTTON_COUNT='+await index.count());
            if(await source.count()&&await index.count()&&!(await index.isDisabled())){
              console.log('CLICK_INDEX=1');
              await index.click();
              await page.waitForTimeout(7000);
            }
            const body=(await page.locator('body').innerText()).replace(/\s+/g,' ').slice(0,18000);
            console.log('FINAL_URL='+page.url());
            console.log('FINAL_BODY='+body);
            console.log('MUTATIONS='+JSON.stringify(mutations));
            const success=/indexed|added|submitted|queued|checking|already.*index|source.*accepted/i.test(body)||mutations.some(m=>m.status>=200&&m.status<300&&/index|submit|source/i.test(m.url)&&!/google|clarity|analytics/i.test(m.url));
            console.log('WALNUT_INDEX_ACCEPTED='+(success?'1':'0'));
          }catch(e){console.log('WALNUT_ERROR='+String(e))}
          await browser.close();
          JS
          node --check walnut-run.mjs && node walnut-run.mjs
          exit 0
