name: DELTA AgentPayStore submission
on:
  push:
    paths:
      - '.github/workflows/probe-agentpaystore.yml'
permissions:
  contents: read
jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Submit DELTA Guarded Action Pilot
        shell: bash
        continue-on-error: true
        run: |
          set +e
          cat >/tmp/payload.json <<'JSON'
          {
            "name":"DELTA Witness — Guarded Action Pilot",
            "url":"https://delta-witness-api.ruphussten.workers.dev/v1/guarded-action-pilot",
            "category":"infra",
            "price":"10",
            "description":"Pre-action page-state evidence for autonomous browser, shopping, travel, procurement and workflow agents. Returns an inspectable witness bundle before irreversible actions; x402-native on Base.",
            "email":"ruphussten85@gmail.com",
            "wallet":"0x1990e21bc219696ff7fbc26527dbaed335ac6367"
          }
          JSON
          STATUS=$(curl -sS --show-error --max-time 30 -A 'DELTA-Witness-Growth/1.0' -D /tmp/headers.txt -o /tmp/body.txt -w '%{http_code}' \
            -X POST 'https://agentpaystore.com/api/list-service' \
            -H 'content-type: application/json' \
            --data-binary @/tmp/payload.json)
          echo "AGENTPAYSTORE_SUBMIT_STATUS=$STATUS"
          echo '=== headers ==='
          cat /tmp/headers.txt || true
          echo '=== body ==='
          cat /tmp/body.txt || true
          echo
          exit 0
      - name: Check public AgentStore discovery
        if: always()
        shell: bash
        continue-on-error: true
        run: |
          set +e
          for u in \
            'https://agentpaystore.com/' \
            'https://agentpaystore.com/openapi.json' \
            'https://agentpaystore.com/api/query?q=DELTA%20Witness' \
            'https://agentpaystore.com/api/query?q=guarded%20action'; do
            echo "=== $u ==="
            curl -L -sS --max-time 20 -A 'DELTA-Witness-Growth/1.0' "$u" | grep -E -i -C 2 'DELTA|guarded.action|ruphussten|1990e21b' | head -100 || true
          done
          exit 0
      - name: Reconcile Base Treasury independently
        if: always()
        shell: bash
        continue-on-error: true
        run: |
          set +e
          URL='https://base.blockscout.com/api/v2/addresses/0x1990e21bc219696ff7fbc26527dbaed335ac6367/token-transfers?type=ERC-20'
          curl -sS --fail --retry 4 --retry-all-errors -A 'DELTA-Witness-Growth/1.0' "$URL" -o /tmp/transfers.json
          if [ ! -s /tmp/transfers.json ]; then echo 'TREASURY_QUERY_DEGRADED empty'; exit 0; fi
          python3 - <<'PY'
          import json
          try: d=json.load(open('/tmp/transfers.json'))
          except Exception as e: print('TREASURY_QUERY_DEGRADED',repr(e)); raise SystemExit(0)
          usdc='0x833589fcd6edb6e08f4c7c32d4f71b54bda02913'; addr='0x1990e21bc219696ff7fbc26527dbaed335ac6367'; out=[]
          for x in d.get('items',[]):
              token=x.get('token') or {}; ta=(token.get('address_hash') or token.get('address') or '').lower()
              to=((x.get('to') or {}).get('hash') if isinstance(x.get('to'),dict) else x.get('to') or '').lower()
              if ta!=usdc or to!=addr: continue
              dec=int(token.get('decimals') or 6); total=x.get('total') or {}; raw=total.get('value') if isinstance(total,dict) else x.get('value')
              try: amount=int(raw)/(10**dec)
              except: amount=raw
              fr=(x.get('from') or {}).get('hash') if isinstance(x.get('from'),dict) else x.get('from')
              out.append({'tx_hash':x.get('transaction_hash'),'timestamp':x.get('timestamp'),'from':fr,'amount_usdc':amount})
          print('TREASURY_RESULT='+json.dumps(out[:20],ensure_ascii=False))
          PY
          exit 0
