name: DELTA AgentPayStore probe
on:
  push:
    paths:
      - '.github/workflows/probe-agentpaystore.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect x402 service listing surface
        shell: bash
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import urllib.request
          base='https://agentpaystore.com'
          try:
              req=urllib.request.Request(base+'/list-service',headers={'User-Agent':'Mozilla/5.0 DELTA-growth-probe'})
              html=urllib.request.urlopen(req,timeout=20).read().decode('utf-8','replace')
              marker="/api/list-service"
              i=html.find(marker)
              print('AGENTPAYSTORE_MARKER_INDEX',i)
              if i>=0:
                  print(html[max(0,i-1800):i+900].replace('\n',' '))
          except Exception as e:
              print('AGENTPAYSTORE_PROBE_DEGRADED',repr(e))
          PY
      - name: Reconcile Base Treasury independently
        if: always()
        shell: bash
        continue-on-error: true
        run: |
          set +e
          URL='https://base.blockscout.com/api/v2/addresses/0x1990e21bc219696ff7fbc26527dbaed335ac6367/token-transfers?type=ERC-20'
          curl -sS --fail --retry 4 --retry-all-errors -A 'DELTA-Witness-Growth/1.0' "$URL" -o /tmp/transfers.json
          if [ ! -s /tmp/transfers.json ]; then echo 'TREASURY_QUERY_DEGRADED empty'; exit 0; fi
          python3 - <<'PY'
          import json
          try: d=json.load(open('/tmp/transfers.json'))
          except Exception as e: print('TREASURY_QUERY_DEGRADED',repr(e)); raise SystemExit(0)
          usdc='0x833589fcd6edb6e08f4c7c32d4f71b54bda02913'; addr='0x1990e21bc219696ff7fbc26527dbaed335ac6367'; out=[]
          for x in d.get('items',[]):
              token=x.get('token') or {}; ta=(token.get('address_hash') or token.get('address') or '').lower()
              to=((x.get('to') or {}).get('hash') if isinstance(x.get('to'),dict) else x.get('to') or '').lower()
              if ta!=usdc or to!=addr: continue
              dec=int(token.get('decimals') or 6); total=x.get('total') or {}; raw=total.get('value') if isinstance(total,dict) else x.get('value')
              try: amount=int(raw)/(10**dec)
              except: amount=raw
              fr=(x.get('from') or {}).get('hash') if isinstance(x.get('from'),dict) else x.get('from')
              out.append({'tx_hash':x.get('transaction_hash'),'timestamp':x.get('timestamp'),'from':fr,'amount_usdc':amount})
          print('TREASURY_RESULT='+json.dumps(out[:20],ensure_ascii=False))
          PY
          exit 0
