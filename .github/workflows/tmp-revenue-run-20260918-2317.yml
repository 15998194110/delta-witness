name: TEMP DELTA revenue run 20260918-2317
on:
  push:
    branches: [master]
    paths: [.github/workflows/tmp-revenue-run-20260918-2317.yml]
permissions:
  contents: read
jobs:
  revenue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DELTA_INDEXNOW_ADMIN_SECRET: ${{ secrets.DELTA_INDEXNOW_ADMIN_SECRET }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DELTA_PARTNER_SECRET: ${{ secrets.DELTA_PARTNER_SECRET }}
    steps:
      - uses: actions/checkout@v6
        with: {persist-credentials: false}
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - name: Verify owner pricing live
        run: node scripts/check-owner-pricing.mjs && node scripts/verify-owner-pricing-live.mjs | tee /tmp/pricing.json
      - name: Audit paid funnel
        continue-on-error: true
        run: node scripts/query-revenue-candidates.mjs | tee /tmp/revenue-candidates.json
      - name: Reconcile Treasury
        continue-on-error: true
        env:
          DELTA_TREASURY_LOOKBACK_BLOCKS: '100000'
          DELTA_TREASURY_CHUNK_BLOCKS: '1900'
        run: node scripts/reconcile-treasury.mjs | tee /tmp/treasury.json
      - name: AgentPact demand
        continue-on-error: true
        run: node scripts/scan-agentpact-demand.mjs | tee /tmp/agentpact.json
      - name: External funded demand
        continue-on-error: true
        run: node scripts/scan-external-funded-demand.mjs | tee /tmp/external-funded.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: delta-revenue-2317-${{ github.run_id }}
          path: |
            /tmp/pricing.json
            /tmp/revenue-candidates.json
            /tmp/treasury.json
            /tmp/agentpact.json
            /tmp/external-funded.json
          if-no-files-found: warn
          retention-days: 7
