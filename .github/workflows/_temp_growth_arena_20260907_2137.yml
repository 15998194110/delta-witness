name: DELTA Growth Arena Temp
on:
  push:
    paths:
      - '.github/workflows/_temp_growth_arena_20260907_2137.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read and identify DELTA registrations
        shell: bash
        run: |
          set -euo pipefail
          URL='https://core.x402arena.gg/operator/agents'
          curl --retry 4 --retry-delay 2 --retry-all-errors -fsS --max-time 30 "$URL" >/tmp/agents.json
          echo 'ARENA_TYPE_BEGIN'
          jq 'if type=="object" then {type:type,keys:keys} else {type:type,length:length} end' /tmp/agents.json
          echo 'ARENA_TYPE_END'
          echo 'ARENA_DELTA_MATCHES_BEGIN'
          python - <<'PY'
          import json
          d=json.load(open('/tmp/agents.json'))
          hits=[]
          def walk(x,path='$'):
              if isinstance(x,dict):
                  text=json.dumps(x,sort_keys=True).lower()
                  if 'delta-witness' in text or 'delta-witness-api.ruphussten.workers.dev' in text:
                      hits.append((path,x))
                  for k,v in x.items(): walk(v,f'{path}.{k}')
              elif isinstance(x,list):
                  for i,v in enumerate(x): walk(v,f'{path}[{i}]')
          walk(d)
          seen=set()
          for path,obj in hits:
              s=json.dumps(obj,sort_keys=True)
              if s in seen: continue
              seen.add(s)
              print(path)
              print(json.dumps(obj,indent=2,sort_keys=True))
          print('MATCH_COUNT',len(seen))
          PY
          echo 'ARENA_DELTA_MATCHES_END'
