name: DELTA growth ledger 20260907-1110

on:
  push:
    paths:
      - '.github/workflows/growth-ledger-20260907-1110.yml'

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Prepend verified growth evidence
        shell: python
        run: |
          from pathlib import Path
          p=Path('docs/growth-ledger.md')
          s=p.read_text(encoding='utf-8')
          marker='|---|---|---|---|---:|---:|---:|---:|---:|---:|---:|---:|---:|---|---|\n'
          rows=(
          '| 2026-09-07T11:07:58+08:00 | Base Treasury `0x1990e21bc219696ff7fbc26527dbaed335ac6367` | n/a | independently reconciled after this growth run | 0 | 0 | 0 | 0 | 0 | 0.00 | 0.00 | 0.00 | 0.00 | A | Fresh hosted-runner Blockscout reconciliation returned `TREASURY_RESULT=[]`; no incoming canonical Base USDC. Production health remained `ok` v0.7.0 and Capture, Preflight, Guarded Action Pilot each still returned the expected HTTP 402 challenge. No outreach, listing submission, crawler or review state is counted as revenue. |\n'
          '| 2026-09-07T11:05:51+08:00 | Agent Bazaar — Guarded Action Pilot | submitted | free no-account developer submission accepted into review; marketplace preview shows `$10.00/call` and `Pending`; public approval not yet claimed | 0 | 0 | 0 | 0 | 0 | 0.00 | 0.00 | 0.00 | 0.00 | A- | Direct headless submission completed on the official Developer Portal with type API, automation/security-aligned metadata, production x402 endpoint `https://delta-witness-api.ruphussten.workers.dev/v1/guarded-action-pilot`, and price `$10`. Post-submit page rendered the DELTA card with `Pending` and states submissions are reviewed within 48h. This is a real submission, not a live listing or buyer event yet. |\n'
          '| 2026-09-07T11:04:00+08:00 | PayAPI Market verification outreach | outreach_sent | first-contact sent to official public business address `hello@payapi.market`; requested marketplace listing + real buyer-wallet verification of production x402 endpoints | 0 | 0 | 0 | 0 | 0 | 0.00 | 0.00 | 0.00 | 0.00 | A- | PayAPI publicly distinguishes ordinary listings from settlement-verified APIs and says verification uses a real paid call from its buyer wallet. DELTA sent one personalized first contact with the `$0.03/$0.03/$10` endpoints and exact Base Treasury. No reply or payment was present at recording time; do not count outreach as intent or revenue. |\n'
          )
          if marker not in s: raise SystemExit('ledger marker missing')
          for key in ['Agent Bazaar — Guarded Action Pilot','PayAPI Market verification outreach','2026-09-07T11:07:58+08:00']:
              if key in s: raise SystemExit(f'duplicate marker: {key}')
          p.write_text(s.replace(marker, marker+rows, 1), encoding='utf-8')
      - name: Commit ledger
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'DELTA Growth Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/growth-ledger.md
          git commit -m 'growth: record Agent Bazaar submission and PayAPI outreach'
          git push
