name: DELTA Market402 finalize

on:
  push:
    paths:
      - '.github/workflows/market402-cleanup.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
      - name: Verify $10 pilot body compatibility
        shell: bash
        run: |
          python3 - <<'PY'
          import json,subprocess
          url='https://delta-witness-api.ruphussten.workers.dev/v1/guarded-action-pilot'
          p=subprocess.run(['curl','-sS','--retry','3','--retry-delay','2','--retry-all-errors','--max-time','30','-X','POST','https://market402.com/selftest','-H','content-type: application/json','--data',json.dumps({'url':url})],capture_output=True,text=True)
          if p.returncode: raise SystemExit(p.stderr)
          d=json.loads(p.stdout)
          print('MARKET402_PILOT_SELFTEST='+json.dumps(d,separators=(',',':')))
          if not d.get('ok') or (d.get('summary') or {}).get('failed') != 0:
              raise SystemExit('pilot Market402 self-test is not spec compliant')
          PY
      - name: Record growth ledger and remove one-shot workflows
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('docs/growth-ledger.md')
          s=p.read_text()
          marker='|---|---|---|---|---:|---:|---:|---:|---:|---:|---:|---:|---:|---|---|\n'
          rows='''| 2026-09-07T08:21:46+08:00 | Market402 measured x402 index — Capture / Preflight / Guarded Pilot | submitted | free submission accepted; Capture + Preflight externally self-tested spec-compliant 11/11 after production compatibility fix; Pilot independently re-tested spec-compliant; scheduled index probes pending | 0 | 0 | 0 | 0 | 0 | 0.00 | 0.00 | 0.00 | 0.00 | A | Official `POST /submit` accepted all three production endpoints. Market402 initially exposed a body-only compatibility gap; DELTA was patched and redeployed so the canonical x402 v2 `Payment-Required` challenge is mirrored into the JSON 402 body without changing settlement terms. External Market402 `/selftest` then passed all 11 checks for Capture and Preflight, and the finalizer independently passed Pilot. `$0.03` Capture/Preflight were submitted with declared prices; `$10` Pilot is indexable/scorable but above Market402's <=$0.05 paid-probe cap. |\n| 2026-09-07T08:21:46+08:00 | Market402 paid-delivery probe path — Capture / Preflight | listed_optin_unqualified | `paid_probe_optin=true` + safe POST sample inputs submitted; current qualification=`false`, reason=`not_in_catalog` | 0 | 0 | 0 | 0 | 0 | 0.00 | 0.00 | 0.00 | 0.00 | A | Market402 accepted the opt-in submissions but reports that its paid-probe qualification currently requires the resource to appear in the public Bazaar catalog. It will automatically re-evaluate after catalog appearance. This is a concrete dependency on Bazaar indexing, not a payment failure. Do not count a Market402 self-test or unpaid scheduled probe as buyer intent/revenue. |\n| 2026-09-07T08:21:46+08:00 | Base Treasury `0x1990e21bc219696ff7fbc26527dbaed335ac6367` | n/a | independently reconciled after Market402 deployment/submission | 0 | 0 | 0 | 0 | 0 | 0.00 | 0.00 | 0.00 | 0.00 | A | Hosted-runner Blockscout query returned `TREASURY_RESULT=[]`; no canonical incoming Base USDC. Market402 submission/self-tests are excluded from revenue, and First Stranger Revenue remains unconfirmed. |\n'''
          if 'Market402 measured x402 index — Capture / Preflight / Guarded Pilot' not in s:
              if marker not in s: raise SystemExit('ledger table marker missing')
              s=s.replace(marker,marker+rows,1)
              p.write_text(s)
          PY
          git rm -f .github/workflows/market402-submit.yml .github/workflows/market402-fix-deploy.yml .github/workflows/market402-cleanup.yml
          git config user.name 'DELTA growth operator'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/growth-ledger.md
          git diff --cached --check
          git commit -m 'growth: record Market402 listing and compatibility evidence'
          git push origin HEAD:master
