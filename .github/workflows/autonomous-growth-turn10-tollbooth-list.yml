name: Autonomous Growth Turn 10 Tollbooth List
on:
  push:
    paths:
      - '.github/workflows/autonomous-growth-turn10-tollbooth-list.yml'

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Discover valid Tollbooth categories
        shell: bash
        run: |
          set -u
          BASE='https://www.trytollbooth.com'
          code=$(curl --retry 4 --retry-delay 2 --retry-all-errors -sS --max-time 30 -o /tmp/services.json -w '%{http_code}' "$BASE/api/services" || true)
          echo "SERVICES_HTTP=$code"
          if [ "$code" = 200 ]; then
            echo 'CATEGORIES='
            jq -c '[.. | objects | .category? // empty | select(type=="string")] | unique' /tmp/services.json
            echo 'SAMPLE='
            jq -c '[.. | objects | select(has("category") and has("name")) | {name,category}] | unique_by(.name) | .[:40]' /tmp/services.json
          else
            cat /tmp/services.json || true
          fi
      - name: Reconcile Base Treasury independently
        shell: bash
        run: |
          node scripts/reconcile-treasury.mjs
