name: DELTA Growth Decixa Temp
on:
  push:
    paths:
      - '.github/workflows/_temp_growth_decixa_20260907_2043.yml'
permissions:
  contents: read
jobs:
  readback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Verify Decixa listings and discovery
        shell: bash
        run: |
          set -euo pipefail
          D='https://api.decixa.ai'
          for id in 78ea3d38-da37-4521-95f8-0338207f6e1f a2f4d378-1faf-4635-b7f8-f5e04cba27c6 79864d2f-f1de-41e7-8ab3-137e0590346e; do
            echo "DETAIL_ID=$id"
            curl --retry 4 --retry-delay 2 --retry-all-errors -fsS --max-time 30 "$D/api/agent/detail/$id" | jq '{id,name,endpoint,pricing,provider,agent_compatibility,trust_score,verification_status,health}'
          done
          for task in 'DELTA Witness' 'preflight autonomous action' 'browser verification proof'; do
            enc=$(python -c 'import urllib.parse,sys; print(urllib.parse.quote_plus(sys.argv[1]))' "$task")
            echo "DISCOVER_TASK=$task"
            curl --retry 4 --retry-delay 2 --retry-all-errors -fsS --max-time 30 "$D/api/agent/discover?task=$enc&limit=20" | jq '[.apis[]? | select((.endpoint // "") | contains("delta-witness-api.ruphussten.workers.dev")) | {id,name,endpoint,pricing,trust_score,agent_ready}]'
          done
