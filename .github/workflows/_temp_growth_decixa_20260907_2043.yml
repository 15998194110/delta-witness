name: DELTA Growth Decixa Temp
on:
  push:
    paths:
      - '.github/workflows/_temp_growth_decixa_20260907_2043.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Recover Decixa submit schema
        shell: bash
        run: |
          set -euo pipefail
          PAGE='https://api.decixa.ai/submit'
          curl --retry 4 --retry-delay 2 --retry-all-errors -fsS --max-time 30 "$PAGE" -o /tmp/page.html
          python - <<'PY'
          import re, urllib.parse, urllib.request
          html=open('/tmp/page.html',encoding='utf-8').read()
          srcs=re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',html,re.I)
          for src in srcs:
              u=urllib.parse.urljoin('https://api.decixa.ai/submit',src)
              try: body=urllib.request.urlopen(u,timeout=20).read().decode('utf-8','replace')
              except Exception: continue
              for needle in ['/api/submit/publish','/api/submit/verify']:
                  pos=body.find(needle)
                  if pos>=0:
                      print('SCHEMA_CHUNK_URL',u)
                      print('NEEDLE',needle)
                      print(body[max(0,pos-5000):min(len(body),pos+8000)])
          PY
