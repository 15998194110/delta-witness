name: DELTA Turn 9 Read Only Discovery

on:
  push:
    paths:
      - ".github/workflows/_temp_growth_turn9_circle_agentexchange_20260909.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Query new Circle x402 Discovery API
        run: |
          set -euo pipefail
          for q in 'delta-witness' 'ruphussten' 'DELTA Witness' 'preflight autonomous action'; do
            echo "=== CIRCLE_QUERY $q ==="
            curl -fsS --get 'https://api.circle.com/v2/x402/discovery/resources' \
              --data-urlencode "query=$q" \
              -o /tmp/circle.json
            jq -c '{top_keys:(keys), count:(.data.resources // .resources // .data // [] | if type=="array" then length else null end), delta_matches:[(.. | objects | select(((.resource // "") + " " + (.metadata.provider.name // "") + " " + (.metadata.provider.description // "") + " " + (.metadata.description // "")) | ascii_downcase | test("delta|ruphus|witness"))) | {resource,type,accepts,metadata}]}' /tmp/circle.json || cat /tmp/circle.json
          done

      - name: Inspect Agent Exchange free market tools and open tasks
        run: |
          node <<'NODE'
          const endpoint = 'https://store.agentexchange.work/mcp';
          async function mcp(body, session) {
            const headers = {
              'content-type':'application/json',
              'accept':'application/json, text/event-stream',
              'mcp-protocol-version':'2025-06-18',
            };
            if (session) headers['mcp-session-id'] = session;
            const r = await fetch(endpoint, {method:'POST', headers, body:JSON.stringify(body)});
            const text = await r.text();
            return {status:r.status, session:r.headers.get('mcp-session-id') || session, text};
          }
          function extract(text) {
            const lines = text.split(/\r?\n/).filter(Boolean);
            const data = lines.filter(x => x.startsWith('data:')).map(x => x.slice(5).trim());
            const candidate = data.at(-1) || text;
            try { return JSON.parse(candidate); } catch { return {raw:text.slice(0,20000)}; }
          }
          let init = await mcp({jsonrpc:'2.0',id:1,method:'initialize',params:{protocolVersion:'2025-06-18',capabilities:{},clientInfo:{name:'delta-witness-readonly-discovery',version:'1.0.0'}}});
          console.log('MCP_INIT_STATUS', init.status, 'SESSION', init.session || 'none');
          console.log(JSON.stringify(extract(init.text)));
          const session = init.session;
          let listed = await mcp({jsonrpc:'2.0',id:2,method:'tools/list',params:{}}, session);
          const listedObj = extract(listed.text);
          const tools = listedObj?.result?.tools || [];
          console.log('MCP_TOOLS_STATUS', listed.status, 'TOOL_COUNT', tools.length);
          console.log(JSON.stringify(tools.filter(t => /market|task|bid|passport/i.test(t.name + ' ' + (t.description||''))).map(t => ({name:t.name,description:t.description,inputSchema:t.inputSchema})), null, 2));
          const target = tools.find(t => t.name === 'market_list_tasks');
          if (target) {
            for (const args of [{status:'open'},{}]) {
              const call = await mcp({jsonrpc:'2.0',id:3,method:'tools/call',params:{name:'market_list_tasks',arguments:args}}, session);
              console.log('MCP_MARKET_LIST_STATUS', call.status, 'ARGS', JSON.stringify(args));
              console.log(call.text.slice(0,30000));
              if (call.status >= 200 && call.status < 300) break;
            }
          }
          NODE

      - name: Canonical Base USDC Treasury tail scan
        run: |
          set -euo pipefail
          USDC='0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913'
          TREASURY='0x1990e21bc219696ff7fbc26527dbaed335ac6367'
          TRANSFER='0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef'
          TO_TOPIC="0x000000000000000000000000${TREASURY#0x}"
          FROM_DEC=51083179
          RPCS=('https://mainnet.base.org' 'https://base-rpc.publicnode.com' 'https://1rpc.io/base')
          rpc_call() {
            local payload="$1" code
            for rpc in "${RPCS[@]}"; do
              for attempt in 1 2 3; do
                code=$(curl --silent --show-error --max-time 20 --output /tmp/rpc.json --write-out '%{http_code}' -H 'content-type: application/json' --data "$payload" "$rpc" || true)
                if [ "$code" = 200 ] && jq -e '.error == null and .result != null' /tmp/rpc.json >/dev/null 2>&1; then cat /tmp/rpc.json; return 0; fi
                sleep $((attempt * attempt))
              done
            done
            return 1
          }
          latest=$(rpc_call '{"jsonrpc":"2.0","id":1,"method":"eth_blockNumber","params":[]}')
          latest_hex=$(jq -r '.result' <<<"$latest")
          latest_dec=$((latest_hex))
          all='[]'
          if [ "$latest_dec" -ge "$FROM_DEC" ]; then
            for ((a=FROM_DEC; a<=latest_dec; a+=5000)); do
              b=$((a+4999)); [ "$b" -gt "$latest_dec" ] && b=$latest_dec
              ah=$(printf '0x%x' "$a"); bh=$(printf '0x%x' "$b")
              payload=$(jq -nc --arg address "$USDC" --arg from "$ah" --arg to "$bh" --arg t0 "$TRANSFER" --arg t2 "$TO_TOPIC" '{jsonrpc:"2.0",id:2,method:"eth_getLogs",params:[{address:$address,fromBlock:$from,toBlock:$to,topics:[$t0,null,$t2]}]}')
              page=$(rpc_call "$payload")
              logs=$(jq '.result // []' <<<"$page")
              all=$(jq -nc --argjson x "$all" --argjson y "$logs" '$x + $y')
            done
          fi
          jq -nc --argjson head "$latest_dec" --argjson from "$FROM_DEC" --argjson logs "$all" '{treasury_scan:{from_block:$from,head_block:$head,incoming_count:($logs|length),incoming:[$logs[]|{block_number:(.blockNumber|tonumber),tx_hash:.transactionHash,from:("0x"+(.topics[1][-40:])),raw_amount:(.data|tonumber)}]}}'

      - name: Audit DELTA paid funnel candidates
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          node scripts/query-revenue-candidates.mjs
