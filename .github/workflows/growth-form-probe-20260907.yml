name: DELTA growth form probe 20260907

on:
  push:
    paths:
      - '.github/workflows/growth-form-probe-20260907.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect free listing forms
        shell: bash
        run: |
          set -u
          for u in 'https://agentndx.ai/submit/' 'https://402.ad/submit'; do
            echo "=== $u ==="
            code=$(curl -sSL --retry 3 --retry-all-errors --max-time 20 -o /tmp/page.html -w '%{http_code}' "$u" || printf '000')
            echo "HTTP=$code"
            python3 - <<'PY'
          import re
          s=open('/tmp/page.html',errors='replace').read()
          for m in re.finditer(r'<form\b', s, re.I):
              print(re.sub(r'\s+',' ',s[m.start():m.start()+5000])[:5000])
          for pat in [r'action=["\'][^"\']+', r'/api/[^"\' ]+', r'fetch\([^\n]{0,300}', r'axios[^\n]{0,300}']:
              vals=re.findall(pat,s,re.I)
              if vals: print('MATCH',pat,vals[:20])
          PY
          done
