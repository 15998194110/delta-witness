# Manual canonical pulse marker: 2026-09-12T07:47+09:00
name: DELTA Discovery Pulse
on:
  schedule:
    - cron: '21 * * * *'
  workflow_dispatch:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/discovery-pulse.yml"

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      DELTA_INDEXNOW_ADMIN_SECRET: ${{ secrets.DELTA_INDEXNOW_ADMIN_SECRET }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DELTA_PARTNER_SECRET: ${{ secrets.DELTA_PARTNER_SECRET }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - name: Check current owner pricing policy
        run: node scripts/check-owner-pricing.mjs
      - name: Verify current owner live prices without payment
        run: node scripts/verify-owner-pricing-live.mjs
      - name: Reconcile existing PayanAgent relay listings without duplication
        continue-on-error: true
        run: node scripts/reconcile-payan-listings.mjs
      - name: Reconcile AllMCPs listing without duplication
        continue-on-error: true
        run: node scripts/reconcile-allmcps-listing.mjs
      - name: Scan PayanAgent funded buyer demand
        if: always()
        continue-on-error: true
        run: node scripts/scan-payan-demand.mjs
      - name: Verify machine discovery surfaces
        run: |
          set -e
          BASE=https://delta-witness-api.ruphussten.workers.dev
          curl -fsS "$BASE/health"
          curl -fsS "$BASE/.well-known/x402" >/dev/null
          curl -fsS "$BASE/openapi.json" >/dev/null
          curl -fsS "$BASE/llms.txt" >/dev/null
          curl -fsS "$BASE/sitemap.xml" >/dev/null
          curl -fsS "$BASE/SKILL.md" >/dev/null
          curl -fsS "$BASE/distribution.json" >/dev/null
          curl -fsS "$BASE/.well-known/mcp/server.json" >/dev/null
          curl -fsS "$BASE/v1/proofs/56347db8-1aa5-447f-a0e4-3bb052d7aa89" >/dev/null
          curl -fsS https://delta-witness-app.pages.dev/ >/dev/null
          curl -fsS https://delta-witness-app.pages.dev/delta-witness-2026-8f0c5a3d6e7b91ac.txt >/dev/null
          STATUS=$(curl -sS -o /tmp/delta-preflight.json -D /tmp/delta-preflight.headers -w '%{http_code}' -X POST "$BASE/v1/preflight" -H 'content-type: application/json' -d '{"url":"https://example.com","expected":{"contains":["Example Domain"]}}')
          test "$STATUS" = "402"
          grep -qi '^payment-required:' /tmp/delta-preflight.headers
      - name: Audit paid funnel candidates
        run: node scripts/query-revenue-candidates.mjs
      - name: Reconcile Base Treasury
        if: always()
        id: treasury
        continue-on-error: true
        run: node scripts/reconcile-treasury.mjs
      - name: Push core IndexNow
        id: indexnow-core
        continue-on-error: true
        run: node scripts/indexnow-pulse.mjs core
      - name: Push Base app IndexNow
        id: indexnow-base-app
        continue-on-error: true
        run: node scripts/indexnow-pulse.mjs base-app
      - name: Record external-channel diagnostics
        if: always()
        env:
          TREASURY_OUTCOME: ${{ steps.treasury.outcome }}
          CORE_OUTCOME: ${{ steps.indexnow-core.outcome }}
          BASE_APP_OUTCOME: ${{ steps.indexnow-base-app.outcome }}
        run: |
          {
            echo '### External-channel diagnostics'
            echo "- Treasury RPC reconciliation: \`$TREASURY_OUTCOME\`"
            echo "- IndexNow core: \`$CORE_OUTCOME\`"
            echo "- IndexNow Base app: \`$BASE_APP_OUTCOME\`"
            echo ''
            echo 'Treasury uses bounded retries plus multiple Base RPC fallbacks. External provider outages are isolated and never block the remaining discovery checks.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Check PayAI Bazaar visibility
        if: always()
        run: node scripts/check-bazaar.mjs
      - name: Check new external discovery channels without mutation
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          HOST='delta-witness-api.ruphussten.workers.dev'

          fetch_bounded() {
            local url="$1" out="$2"
            curl -fsS --connect-timeout 10 --max-time 25 \
              --retry 3 --retry-delay 2 --retry-all-errors \
              "$url" -o "$out"
          }

          X402_LIST=degraded
          if fetch_bounded "https://x402-list.com/api/v1/services?q=${HOST}&per_page=10" /tmp/x402-list.json; then
            if node -e "const j=require('/tmp/x402-list.json'); const a=Array.isArray(j.data)?j.data:[]; process.exit(a.some(x=>JSON.stringify(x).toLowerCase().includes('${HOST}'))?0:1)"; then
              X402_LIST=present
            else
              X402_LIST=absent
            fi
          fi

          CIRCLE=degraded
          if fetch_bounded "https://api.circle.com/v2/x402/discovery/resources?query=${HOST}" /tmp/circle.json; then
            if node -e "const j=require('/tmp/circle.json'); process.exit(JSON.stringify(j).toLowerCase().includes('${HOST}')?0:1)"; then
              CIRCLE=present
            else
              CIRCLE=absent
            fi
          fi

          PAYAPI=degraded
          if fetch_bounded "https://payapi.market/marketplace?verified=0" /tmp/payapi.html; then
            if grep -qi 'DELTA Witness' /tmp/payapi.html; then PAYAPI=present; else PAYAPI=absent; fi
          fi

          echo "DISCOVERY_CHANNEL x402_list=$X402_LIST circle=$CIRCLE payapi=$PAYAPI"
          {
            echo '### Additional discovery channels'
            echo "- x402 List: \`$X402_LIST\`"
            echo "- Circle x402 Discovery: \`$CIRCLE\`"
            echo "- PayAPI Market: \`$PAYAPI\`"
            echo ''
            echo 'These are read-only discovery checks. Channel degradation is isolated and never blocks Treasury reconciliation or other checks.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: One-shot true402 free canonical listing
        continue-on-error: true
        env:
          DELTA_ORIGIN: https://delta-witness-api.ruphussten.workers.dev
          DELTA_ENDPOINT: https://delta-witness-api.ruphussten.workers.dev/v1/capture
          DELTA_TREASURY: 0x1990e21bc219696ff7fbc26527dbaed335ac6367
        run: |
          node <<'NODE'
          const sleep = ms => new Promise(r => setTimeout(r, ms));
          const registry = 'https://true402.dev/api/v1/services';
          const origin = process.env.DELTA_ORIGIN;
          const endpoint = process.env.DELTA_ENDPOINT;
          const treasury = process.env.DELTA_TREASURY.toLowerCase();
          const result = {channel:'true402', listing_status:'unknown', discovery_status:'unknown', duplicate_avoided:false, attempts:0, evidence_quality:'A_official_registry_API'};
          const rows = j => Array.isArray(j) ? j : (['services','data','items','results'].map(k=>j?.[k]).find(Array.isArray) || []);
          const match = x => { const s=JSON.stringify(x).toLowerCase(); return s.includes('delta witness') || s.includes('delta-witness-api.ruphussten.workers.dev') || s.includes(treasury); };
          async function getJson(url) {
            let err;
            for (let i=1;i<=3;i++) {
              try { const r=await fetch(url,{signal:AbortSignal.timeout(20000)}); if(!r.ok) throw new Error(`HTTP ${r.status}`); return await r.json(); }
              catch(e){err=e; if(i<3) await sleep(700*i);}
            }
            throw err;
          }
          async function scan(){
            const found=[];
            for(let offset=0;offset<2000;offset+=100){
              const j=await getJson(`${registry}?limit=100&offset=${offset}`); const a=rows(j);
              found.push(...a.filter(match));
              const total=Number(j?.total ?? j?.count ?? NaN); const more=j?.has_more ?? j?.hasMore;
              if(more===false || (Number.isFinite(total)&&offset+a.length>=total) || a.length<100) break;
            }
            return found;
          }
          async function post(){
            result.attempts++;
            const body={url:origin,manifest:{x402:'1.0',name:'DELTA Witness Capture',description:'Independent public page-state evidence for consequential agent actions. Base USDC settles directly to DELTA Treasury.',capabilities:['evidence','verification','agent-safety','x402','capture'],pricing:{currency:'USDC',base:'1.00',unit:'request'},payment:{address:process.env.DELTA_TREASURY,chain:'base',facilitator:'https://facilitator.payai.network'},endpoint}};
            try { const r=await fetch(registry,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body),signal:AbortSignal.timeout(25000)}); const t=await r.text(); let b=t; try{b=JSON.parse(t)}catch{}; result.last_response={status:r.status,body:b}; return {ok:r.ok,status:r.status}; }
            catch(e){result.last_response={transport_error:String(e)}; return {ok:false,status:0};}
          }
          (async()=>{
            let found;
            try{found=await scan()}catch(e){result.listing_status='degraded_precheck';result.discovery_status='degraded';result.error=String(e);console.log('TRUE402_RESULT '+JSON.stringify(result));return;}
            if(found.length){result.listing_status='already_listed';result.discovery_status='present';result.duplicate_avoided=true;result.matches=found;console.log('TRUE402_RESULT '+JSON.stringify(result));return;}
            let p=await post(); await sleep(1500); let rb=[]; try{rb=await scan()}catch(e){result.readback_error=String(e)}
            if(!rb.length && !p.ok && (p.status===0||p.status===429||p.status>=500)){await sleep(2500);p=await post();await sleep(2000);try{rb=await scan()}catch(e){result.readback_error_2=String(e)}}
            if(rb.length){result.listing_status='live';result.discovery_status='present';result.matches=rb;}
            else if(p.ok){result.listing_status='submitted_readback_pending';result.discovery_status='pending';}
            else{result.listing_status='channel_degraded_retry_exhausted';result.discovery_status='unknown';}
            console.log('TRUE402_RESULT '+JSON.stringify(result));
          })().catch(e=>{result.fatal=String(e);console.log('TRUE402_RESULT '+JSON.stringify(result));});
          NODE
