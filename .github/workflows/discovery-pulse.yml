# Canonical revenue-first pulse. Reuse this workflow; never create a parallel growth loop.
# Operator evidence export added for read-only reconciliation and complete repository-contact dedupe.
name: DELTA Discovery Pulse
on:
  schedule:
    - cron: '21 * * * *'
  workflow_dispatch:
    inputs:
      treasury_bootstrap:
        description: 'Establish only the reviewed, empty Treasury cutover block'
        type: boolean
        default: false
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/discovery-pulse.yml"
      - "scripts/scan-external-funded-demand.mjs"
      - "scripts/scan-moltjobs-demand.mjs"
      - "scripts/scan-workpnp-demand.mjs"
      - "scripts/scan-agentpact-demand.mjs"
      - "scripts/reconcile-treasury.mjs"

permissions:
  contents: read

concurrency:
  group: delta-canonical-revenue-pulse
  cancel-in-progress: false

jobs:
  treasury:
    # Separate runner in the existing Pulse. Business/adapters never receive its writer credential.
    if: github.repository == '15998194110/delta-witness' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    environment:
      name: delta-treasury
      deployment: false
    steps:
      - name: Select reviewed source and scan mode
        id: gate
        shell: bash
        env:
          CONFIGURED: ${{ vars.DELTA_TREASURY_STATE_MODE }}
          RELEASE: ${{ vars.DELTA_TREASURY_APPROVED_RELEASE }}
          BOOTSTRAP: ${{ inputs.treasury_bootstrap == true }}
        run: |
          set -euo pipefail
          mode=window; ref="$GITHUB_SHA"
          case "$CONFIGURED" in
            ''|window) [[ "$BOOTSTRAP" != true ]] ;;
            remote)
              [[ "$RELEASE" =~ ^[0-9a-f]{40}$ ]]
              if [[ "$GITHUB_EVENT_NAME" == schedule || "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
                mode=remote; ref="$RELEASE"
                if [[ "$BOOTSTRAP" == true ]]; then
                  [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; mode=bootstrap
                fi
              fi ;;
            *) exit 1 ;;
          esac
          printf 'mode=%s\nref=%s\n' "$mode" "$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ steps.gate.outputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Verify Treasury cutover and publication boundaries offline
        run: node --test tests/pulse-treasury-cutover.node.mjs
      - name: Check source and reconcile Treasury
        shell: bash
        env:
          EXPECTED: ${{ steps.gate.outputs.ref }}
          DELTA_PULSE_TREASURY_MODE: ${{ steps.gate.outputs.mode }}
          DELTA_TREASURY_WRITER_SECRET: ${{ steps.gate.outputs.mode != 'window' && secrets.DELTA_TREASURY_WRITER_SECRET || '' }}
          DELTA_TREASURY_BASELINE_DIGEST: ${{ vars.DELTA_TREASURY_BASELINE_DIGEST }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          node scripts/pulse-treasury-custody.mjs | tee "$RUNNER_TEMP/delta-treasury-range.json"
      - name: Retain public range status only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: delta-treasury-range-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/delta-treasury-range.json
          if-no-files-found: warn
          retention-days: 7
  ping:
    # Bootstrapping custody is a one-off operator action, never a discovery run.
    if: github.event_name != 'workflow_dispatch' || inputs.treasury_bootstrap != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with: { node-version: '22' }

      # Fail-fast core integrity; explicitly retain diagnostic results without generating payments.
      - name: Check current owner pricing policy
        shell: bash
        run: node scripts/check-owner-pricing.mjs | tee /tmp/delta-owner-pricing-source.json
      - name: Verify current owner live prices without payment
        shell: bash
        run: node scripts/verify-owner-pricing-live.mjs | tee /tmp/delta-owner-pricing-live.json
      - name: Verify live purchase path without payment
        shell: bash
        run: |
          set -e
          BASE=https://delta-witness-api.ruphussten.workers.dev
          curl -fsS --connect-timeout 10 --max-time 25 "$BASE/health" | tee /tmp/delta-health.json
          curl -fsS --connect-timeout 10 --max-time 25 "$BASE/.well-known/x402" >/dev/null
          curl -fsS --connect-timeout 10 --max-time 25 "$BASE/openapi.json" >/dev/null
          curl -fsS --connect-timeout 10 --max-time 25 "$BASE/SKILL.md" >/dev/null
          curl -fsS --connect-timeout 10 --max-time 25 "$BASE/.well-known/mcp/server.json" >/dev/null
          curl -fsS --connect-timeout 10 --max-time 25 https://delta-witness-app.pages.dev/ >/dev/null
          STATUS=$(curl -sS --connect-timeout 10 --max-time 25 -o /tmp/delta-preflight.json -D /tmp/delta-preflight.headers -w '%{http_code}' -X POST "$BASE/v1/preflight" -H 'content-type: application/json' -d '{"url":"https://example.com","expected":{"contains":["Example Domain"]}}')
          test "$STATUS" = "402"
          grep -qi '^payment-required:' /tmp/delta-preflight.headers

      # The separate Treasury job in this same run owns the sole blockchain scan.
      - name: Audit paid funnel candidates
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # The D1 report includes partner identities. D1 retains the original.
          GITHUB_STEP_SUMMARY=/dev/null node scripts/query-revenue-candidates.mjs >/dev/null 2>&1
          printf '%s\n' '{"ok":true,"details":"private_d1"}' > /tmp/delta-revenue-candidates.json

      # Revenue-first: buyer demand and settlement run on every pulse.
      - name: Scan PayanAgent funded buyer demand
        continue-on-error: true
        shell: bash
        run: node scripts/scan-payan-demand.mjs | tee /tmp/delta-payan-demand.json
      - name: Scan Agent Exchange funded buyer demand
        continue-on-error: true
        shell: bash
        run: node scripts/scan-agentexchange-demand.mjs | tee /tmp/delta-agentexchange-demand.json
      - name: Scan AgentPact seller and funded buyer demand
        continue-on-error: true
        shell: bash
        run: node scripts/scan-agentpact-demand.mjs | tee /tmp/delta-agentpact-demand.json
      - name: Retain current public AgentPact buyer requirements without mutation
        continue-on-error: true
        shell: bash
        run: |
          curl -fsS --connect-timeout 8 --max-time 20 --retry 1 --retry-delay 1 -H 'accept: application/json' 'https://api.agentpact.xyz/api/needs?limit=100' -o /tmp/delta-agentpact-needs-raw.json
          curl -fsS --connect-timeout 8 --max-time 20 --retry 1 --retry-delay 1 -H 'accept: application/json' 'https://api.agentpact.xyz/api/offers?query=DELTA%20Witness&limit=100' -o /tmp/delta-agentpact-offers-raw.json
      - name: Scan additional escrow-backed buyer demand
        continue-on-error: true
        shell: bash
        run: node scripts/scan-external-funded-demand.mjs | tee /tmp/delta-external-funded-demand.json
      - name: Scan MoltJobs funded buyer demand
        continue-on-error: true
        shell: bash
        run: node scripts/scan-moltjobs-demand.mjs | tee /tmp/delta-moltjobs-demand.json
      - name: Scan WorkPnP escrow-funded buyer demand
        continue-on-error: true
        shell: bash
        run: node scripts/scan-workpnp-demand.mjs | tee /tmp/delta-workpnp-demand.json

      # Existing public repository records, not secrets or the inaccessible local operator workspace.
      # Export permits exact offline contact/domain searches when GitHub's code index is incomplete.
      - name: Export tracked repository operator evidence for buyer-contact deduplication
        if: always()
        shell: bash
        run: |
          git archive --format=zip HEAD AGENTS.md ACQUISITION_ENGINE.md docs distribution/evidence > /tmp/delta-operator-records.zip
          git rev-parse HEAD > /tmp/delta-operator-records-commit.txt
          sha256sum /tmp/delta-operator-records.zip > /tmp/delta-operator-records-sha256.txt

      # Maintenance is allowed only in the existing daily scheduled window, never on manual/push audits.
      - name: Decide distribution maintenance window
        id: maintenance
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ "$(date -u +%H)" = "03" ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            echo 'DISTRIBUTION_MAINTENANCE run=true'
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
            echo 'DISTRIBUTION_MAINTENANCE run=false revenue_first=true'
          fi
      - name: Register x402 Discovery service without duplication
        if: steps.maintenance.outputs.run == 'true'
        continue-on-error: true
        run: node scripts/register-x402-discovery.mjs
      - name: Register Agent402 seller origin without duplication
        if: steps.maintenance.outputs.run == 'true'
        continue-on-error: true
        run: node scripts/register-agent402.mjs
      - name: Reconcile existing PayanAgent relay listings without duplication
        if: steps.maintenance.outputs.run == 'true'
        continue-on-error: true
        env:
          DELTA_PARTNER_SECRET: ${{ secrets.DELTA_PARTNER_SECRET }}
        run: node scripts/reconcile-payan-listings.mjs
      - name: Reconcile AllMCPs listing without duplication
        if: steps.maintenance.outputs.run == 'true'
        continue-on-error: true
        run: node scripts/reconcile-allmcps-listing.mjs
      - name: Push core IndexNow
        if: steps.maintenance.outputs.run == 'true'
        id: indexnow-core
        continue-on-error: true
        env:
          DELTA_INDEXNOW_ADMIN_SECRET: ${{ secrets.DELTA_INDEXNOW_ADMIN_SECRET }}
        run: node scripts/indexnow-pulse.mjs core
      - name: Push Base app IndexNow
        if: steps.maintenance.outputs.run == 'true'
        id: indexnow-base-app
        continue-on-error: true
        env:
          DELTA_INDEXNOW_ADMIN_SECRET: ${{ secrets.DELTA_INDEXNOW_ADMIN_SECRET }}
        run: node scripts/indexnow-pulse.mjs base-app
      - name: Check PayAI Bazaar visibility
        if: steps.maintenance.outputs.run == 'true'
        continue-on-error: true
        run: node scripts/check-bazaar.mjs
      - name: Check external discovery channels without mutation
        if: steps.maintenance.outputs.run == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          HOST='delta-witness-api.ruphussten.workers.dev'
          fetch_bounded() {
            local url="$1" out="$2"
            curl -fsS --connect-timeout 10 --max-time 25 --retry 3 --retry-delay 2 --retry-all-errors "$url" -o "$out"
          }
          X402_LIST=degraded
          if fetch_bounded "https://x402-list.com/api/v1/services?q=${HOST}&per_page=10" /tmp/x402-list.json; then
            if node -e "const j=require('/tmp/x402-list.json'); const a=Array.isArray(j.data)?j.data:[]; process.exit(a.some(x=>JSON.stringify(x).toLowerCase().includes('${HOST}'))?0:1)"; then X402_LIST=present; else X402_LIST=absent; fi
          fi
          CIRCLE=degraded
          if fetch_bounded "https://api.circle.com/v2/x402/discovery/resources?query=${HOST}" /tmp/circle.json; then
            if node -e "const j=require('/tmp/circle.json'); process.exit(JSON.stringify(j).toLowerCase().includes('${HOST}')?0:1)"; then CIRCLE=present; else CIRCLE=absent; fi
          fi
          PAYAPI=degraded
          if fetch_bounded "https://payapi.market/marketplace?verified=0" /tmp/payapi.html; then
            if grep -qi 'DELTA Witness' /tmp/payapi.html; then PAYAPI=present; else PAYAPI=absent; fi
          fi
          echo "DISCOVERY_CHANNEL x402_list=$X402_LIST circle=$CIRCLE payapi=$PAYAPI"
      - name: Refresh true402 discovery without duplication
        if: steps.maintenance.outputs.run == 'true'
        continue-on-error: true
        run: node scripts/register-true402.mjs
      - name: Register nohumans.directory without duplication
        if: steps.maintenance.outputs.run == 'true'
        continue-on-error: true
        run: node scripts/register-nohumans.mjs

      - name: Record pulse diagnostics
        if: always()
        env:
          MAINTENANCE_RUN: ${{ steps.maintenance.outputs.run }}
        run: |
          {
            echo '### DELTA revenue-first pulse'
              echo '- Treasury range status is recorded in the treasury job of this run.'
            echo "- Distribution maintenance this pulse: \`${MAINTENANCE_RUN:-false}\`"
            echo ''
            echo 'Treasury and paid-funnel checks precede buyer-demand scans. Public repository evidence is exported for exact contact deduplication, not as a replacement for inaccessible local operator state. No purchase or customer revenue is generated by this diagnostic.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload canonical pulse evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: delta-pulse-state-${{ github.run_id }}
          path: |
            /tmp/delta-owner-pricing-source.json
            /tmp/delta-owner-pricing-live.json
            /tmp/delta-health.json
            /tmp/delta-payan-demand.json
            /tmp/delta-agentexchange-demand.json
            /tmp/delta-agentpact-demand.json
            /tmp/delta-agentpact-needs-raw.json
            /tmp/delta-agentpact-offers-raw.json
            /tmp/delta-external-funded-demand.json
            /tmp/delta-moltjobs-demand.json
            /tmp/delta-workpnp-demand.json
            /tmp/delta-revenue-candidates.json
            /tmp/delta-operator-records.zip
            /tmp/delta-operator-records-commit.txt
            /tmp/delta-operator-records-sha256.txt
          if-no-files-found: warn
          retention-days: 7
