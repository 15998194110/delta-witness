# Canonical revenue-first pulse. Reuse this workflow; never create a parallel growth loop.
# Operator evidence export added for read-only reconciliation and complete repository-contact dedupe.
name: DELTA Discovery Pulse
on:
  schedule:
    - cron: '21 0-2,4-23 * * *'
    - cron: '21 3 * * *'
  workflow_dispatch:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/discovery-pulse.yml"
      - "scripts/scan-external-funded-demand.mjs"
      - "scripts/scan-moltjobs-demand.mjs"
      - "scripts/scan-workpnp-demand.mjs"
      - "scripts/scan-agentpact-demand.mjs"
      - "scripts/reconcile-treasury.mjs"
      - "scripts/pulse-status.mjs"
      - "scripts/validate-treasury-report.mjs"

permissions:
  contents: read

concurrency:
  group: delta-canonical-revenue-pulse
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    # Sum of bounded steps leaves time for always-run evidence/reporting.
    timeout-minutes: 55
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    env:
      DELTA_EVENT_SCHEDULE: ${{ github.event.schedule }}
      # Candidate activation requires migration of existing channel authority;
      # this is one durable config flag, never a per-order approval.
      DELTA_DAILY_MAINTENANCE_ENABLED: ${{ vars.DELTA_DAILY_MAINTENANCE_ENABLED }}
      DELTA_INDEXNOW_ADMIN_SECRET: ${{ secrets.DELTA_INDEXNOW_ADMIN_SECRET }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DELTA_PARTNER_SECRET: ${{ secrets.DELTA_PARTNER_SECRET }}
    steps:
      - name: Record Runner observation start
        id: run_metadata
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 1
        run: echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        id: checkout
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        id: setup
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 1
        with: { node-version: '22' }

      # Independent lanes: core/provider failures must not skip Treasury or other reads.
      # No purchase or customer revenue is generated by these diagnostic probes.
      - name: Check current owner pricing policy
        id: core_source
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 1
        shell: bash --noprofile --norc -euo pipefail {0}
        run: node scripts/check-owner-pricing.mjs | tee /tmp/delta-owner-pricing-source.json
      - name: Verify current owner live prices without payment
        id: core_prices
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 2
        shell: bash --noprofile --norc -euo pipefail {0}
        run: node scripts/verify-owner-pricing-live.mjs | tee /tmp/delta-owner-pricing-live.json
      - name: Verify live purchase path without payment
        id: core_path
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 3
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          set -e
          BASE=https://delta-witness-api.ruphussten.workers.dev
          curl -fsS --connect-timeout 10 --max-time 25 "$BASE/health" | tee /tmp/delta-health.json
          curl -fsS --connect-timeout 10 --max-time 25 "$BASE/.well-known/x402" >/dev/null
          curl -fsS --connect-timeout 10 --max-time 25 "$BASE/openapi.json" >/dev/null
          curl -fsS --connect-timeout 10 --max-time 25 "$BASE/SKILL.md" >/dev/null
          curl -fsS --connect-timeout 10 --max-time 25 "$BASE/.well-known/mcp/server.json" >/dev/null
          curl -fsS --connect-timeout 10 --max-time 25 https://delta-witness-app.pages.dev/ >/dev/null
          STATUS=$(curl -sS --connect-timeout 10 --max-time 25 -o /tmp/delta-preflight.json -D /tmp/delta-preflight.headers -w '%{http_code}' -X POST "$BASE/v1/preflight" -H 'content-type: application/json' -d '{"url":"https://example.com","expected":{"contains":["Example Domain"]}}')
          test "$STATUS" = "402"
          grep -qi '^payment-required:' /tmp/delta-preflight.headers

      # Treasury and paid fulfillment evidence precede external prospect/directory scans.
      - name: Reconcile Base Treasury
        id: treasury
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 5
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          set -o pipefail
          node scripts/reconcile-treasury.mjs | tee /tmp/delta-treasury.json
      # Exit 0 alone is not valid evidence. This gate checks the declared current
      # interval; durable continuous coverage is separately blocked until an
      # approved state store is configured (no implicit migration here).
      - name: Validate Treasury evidence semantics
        id: treasury_evidence
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 1
        shell: bash --noprofile --norc -euo pipefail {0}
        run: node scripts/validate-treasury-report.mjs /tmp/delta-treasury.json | tee /tmp/delta-treasury-validation.json
      - name: Audit paid funnel candidates
        id: paid_funnel
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 1
        shell: bash --noprofile --norc -euo pipefail {0}
        run: node scripts/query-revenue-candidates.mjs | tee /tmp/delta-revenue-candidates.json

      # Revenue-first: buyer demand and settlement run on every pulse.
      - name: Scan PayanAgent funded buyer demand
        id: payan
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 1
        shell: bash --noprofile --norc -euo pipefail {0}
        run: node scripts/scan-payan-demand.mjs | tee /tmp/delta-payan-demand.json
      - name: Scan Agent Exchange funded buyer demand
        id: agentexchange
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 1
        shell: bash --noprofile --norc -euo pipefail {0}
        run: node scripts/scan-agentexchange-demand.mjs | tee /tmp/delta-agentexchange-demand.json
      - name: Scan AgentPact seller and funded buyer demand
        id: agentpact
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 1
        shell: bash --noprofile --norc -euo pipefail {0}
        run: node scripts/scan-agentpact-demand.mjs | tee /tmp/delta-agentpact-demand.json
      - name: Retain current public AgentPact buyer requirements without mutation
        id: agentpact_raw
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 1
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          curl -fsS --connect-timeout 8 --max-time 20 --retry 1 --retry-delay 1 -H 'accept: application/json' 'https://api.agentpact.xyz/api/needs?limit=100' -o /tmp/delta-agentpact-needs-raw.json
          curl -fsS --connect-timeout 8 --max-time 20 --retry 1 --retry-delay 1 -H 'accept: application/json' 'https://api.agentpact.xyz/api/offers?query=DELTA%20Witness&limit=100' -o /tmp/delta-agentpact-offers-raw.json
      - name: Scan additional escrow-backed buyer demand
        id: external
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 2
        shell: bash --noprofile --norc -euo pipefail {0}
        run: node scripts/scan-external-funded-demand.mjs | tee /tmp/delta-external-funded-demand.json
      - name: Scan MoltJobs funded buyer demand
        id: moltjobs
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 1
        shell: bash --noprofile --norc -euo pipefail {0}
        run: node scripts/scan-moltjobs-demand.mjs | tee /tmp/delta-moltjobs-demand.json
      - name: Scan WorkPnP escrow-funded buyer demand
        id: workpnp
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 1
        shell: bash --noprofile --norc -euo pipefail {0}
        run: node scripts/scan-workpnp-demand.mjs | tee /tmp/delta-workpnp-demand.json

      # Existing public repository records, not secrets or the inaccessible local operator workspace.
      # Export permits exact offline contact/domain searches when GitHub's code index is incomplete.
      - name: Export tracked repository operator evidence for buyer-contact deduplication
        id: operator_evidence
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 1
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          git archive --format=zip HEAD AGENTS.md ACQUISITION_ENGINE.md docs distribution/evidence > /tmp/delta-operator-records.zip
          git rev-parse HEAD > /tmp/delta-operator-records-commit.txt
          sha256sum /tmp/delta-operator-records.zip > /tmp/delta-operator-records-sha256.txt

      # Match the triggering cron, not Runner wall-clock hour. This does not
      # recover a dropped GitHub event; a separate watchdog remains required.
      # Existing mutation authority must be explicitly migrated before release.
      - name: Decide distribution maintenance window
        id: maintenance
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 1
        run: node scripts/pulse-status.mjs maintenance
      - name: Register x402 Discovery service without duplication
        id: x402_discovery
        if: ${{ !cancelled() && steps.maintenance.outputs.run == 'true' && steps.core_source.outcome == 'success' && steps.core_prices.outcome == 'success' && steps.core_path.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 1
        run: node scripts/register-x402-discovery.mjs
      - name: Register Agent402 seller origin without duplication
        id: agent402
        if: ${{ !cancelled() && steps.maintenance.outputs.run == 'true' && steps.core_source.outcome == 'success' && steps.core_prices.outcome == 'success' && steps.core_path.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 1
        run: node scripts/register-agent402.mjs
      - name: Reconcile existing PayanAgent relay listings without duplication
        id: payan_listings
        if: ${{ !cancelled() && steps.maintenance.outputs.run == 'true' && steps.core_source.outcome == 'success' && steps.core_prices.outcome == 'success' && steps.core_path.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 1
        run: node scripts/reconcile-payan-listings.mjs
      - name: Reconcile AllMCPs listing without duplication
        id: allmcps
        if: ${{ !cancelled() && steps.maintenance.outputs.run == 'true' && steps.core_source.outcome == 'success' && steps.core_prices.outcome == 'success' && steps.core_path.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 1
        run: node scripts/reconcile-allmcps-listing.mjs
      - name: Push core IndexNow
        id: indexnow_core
        if: ${{ !cancelled() && steps.maintenance.outputs.run == 'true' && steps.core_source.outcome == 'success' && steps.core_prices.outcome == 'success' && steps.core_path.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 2
        run: node scripts/indexnow-pulse.mjs core
      - name: Push Base app IndexNow
        id: indexnow_base_app
        if: ${{ !cancelled() && steps.maintenance.outputs.run == 'true' && steps.core_source.outcome == 'success' && steps.core_prices.outcome == 'success' && steps.core_path.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 2
        run: node scripts/indexnow-pulse.mjs base-app
      - name: Check PayAI Bazaar visibility
        id: bazaar
        if: ${{ !cancelled() && steps.maintenance.outputs.due == 'true' }}
        continue-on-error: true
        timeout-minutes: 1
        run: node scripts/check-bazaar.mjs
      - name: Check external discovery channels without mutation
        id: discovery_channels
        if: ${{ !cancelled() && steps.maintenance.outputs.due == 'true' }}
        continue-on-error: true
        timeout-minutes: 2
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          HOST='delta-witness-api.ruphussten.workers.dev'
          fetch_bounded() {
            local url="$1" out="$2"
            # Nominal retry budget: 3 x (2 x 12s + 1s) = 75s. The outer
            # deadline also bounds provider Retry-After delays: 3 x 27s <= 81s.
            # Leave the remainder of this 2-minute step for parsing and recording.
            timeout --signal=TERM --kill-after=1s 26s curl -fsS --connect-timeout 5 --max-time 12 --retry 1 --retry-delay 1 --retry-max-time 25 --retry-all-errors "$url" -o "$out"
          }
          X402_LIST=degraded
          if fetch_bounded "https://x402-list.com/api/v1/services?q=${HOST}&per_page=10" /tmp/x402-list.json; then
            if observed=$(node -e "const j=require('/tmp/x402-list.json'); if(!Array.isArray(j.data))process.exit(2); console.log(j.data.some(x=>JSON.stringify(x).toLowerCase().includes('${HOST}'))?'present':'not_observed')"); then X402_LIST="$observed"; fi
          fi
          CIRCLE=degraded
          if fetch_bounded "https://api.circle.com/v2/x402/discovery/resources?query=${HOST}" /tmp/circle.json; then
            if observed=$(node -e "const j=require('/tmp/circle.json'); if(!j || typeof j!=='object')process.exit(2); console.log(JSON.stringify(j).toLowerCase().includes('${HOST}')?'present':'not_observed')"); then CIRCLE="$observed"; fi
          fi
          PAYAPI=degraded
          if fetch_bounded "https://payapi.market/marketplace?verified=0" /tmp/payapi.html; then
            if grep -qi 'DELTA Witness' /tmp/payapi.html; then PAYAPI=present; else PAYAPI=not_observed; fi
          fi
          echo "DISCOVERY_CHANNEL x402_list=$X402_LIST circle=$CIRCLE payapi=$PAYAPI"
          printf '{"schema":"delta-discovery-observation/v1","x402_list":"%s","circle":"%s","payapi":"%s","scope":"keyword_observation_only_not_registration_or_business_success"}\n' "$X402_LIST" "$CIRCLE" "$PAYAPI" > /tmp/delta-discovery-channels.json
      - name: Refresh true402 discovery without duplication
        id: true402
        if: ${{ !cancelled() && steps.maintenance.outputs.run == 'true' && steps.core_source.outcome == 'success' && steps.core_prices.outcome == 'success' && steps.core_path.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 1
        run: node scripts/register-true402.mjs
      - name: Register nohumans.directory without duplication
        id: nohumans
        if: ${{ !cancelled() && steps.maintenance.outputs.run == 'true' && steps.core_source.outcome == 'success' && steps.core_prices.outcome == 'success' && steps.core_path.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 1
        run: node scripts/register-nohumans.mjs

      - name: Record pulse diagnostics
        id: report_status
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        env:
          DELTA_STEP_OUTCOMES: ${{ toJSON(steps) }}
          DELTA_RUN_STARTED_AT: ${{ steps.run_metadata.outputs.started_at }}
        run: |
          if ! node scripts/pulse-status.mjs /tmp prepared; then
            printf '%s\n' '{"schema":"delta-pulse-status/v1","critical_ok":false,"reporting":{"phase":"prepared","state":"unavailable","notification":"unknown"}}' > /tmp/delta-pulse-status.json
            exit 1
          fi
      - name: Upload canonical pulse evidence
        if: always()
        id: canonical_artifact
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/upload-artifact@v4
        with:
          name: delta-pulse-state-${{ github.run_id }}
          path: |
            /tmp/delta-pulse-status.json
            /tmp/delta-owner-pricing-source.json
            /tmp/delta-owner-pricing-live.json
            /tmp/delta-health.json
            /tmp/delta-payan-demand.json
            /tmp/delta-agentexchange-demand.json
            /tmp/delta-agentpact-demand.json
            /tmp/delta-agentpact-needs-raw.json
            /tmp/delta-agentpact-offers-raw.json
            /tmp/delta-external-funded-demand.json
            /tmp/delta-moltjobs-demand.json
            /tmp/delta-workpnp-demand.json
            /tmp/delta-discovery-channels.json
            /tmp/delta-revenue-candidates.json
            /tmp/delta-treasury.json
            /tmp/delta-treasury-validation.json
            /tmp/delta-operator-records.zip
            /tmp/delta-operator-records-commit.txt
            /tmp/delta-operator-records-sha256.txt
          if-no-files-found: error
          retention-days: 7


      # The final report can attest the preceding canonical upload outcome,
      # never its own future upload or delivery of a notification.
      - name: Record final canonical artifact outcome
        id: report_final
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        env:
          DELTA_STEP_OUTCOMES: ${{ toJSON(steps) }}
          DELTA_RUN_STARTED_AT: ${{ steps.run_metadata.outputs.started_at }}
        run: |
          if ! node scripts/pulse-status.mjs /tmp final; then
            printf '%s\n' '{"schema":"delta-pulse-status/v1","critical_ok":false,"reporting":{"phase":"final","state":"unavailable","notification":"unknown"}}' > /tmp/delta-pulse-status-final.json
            exit 1
          fi
      - name: Upload allowlisted operational status
        id: status_artifact
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/upload-artifact@v4
        with:
          name: delta-pulse-status-${{ github.run_id }}
          path: /tmp/delta-pulse-status*.json
          if-no-files-found: error
          retention-days: 30

      # Treasury is a revenue-critical check: maintain artifact collection and
      # unrelated buyer scans, but NEVER surface a green run on a failed scan.
      - name: Fail pulse visibly when Treasury reconciliation failed
        timeout-minutes: 1
        if: always() && (steps.treasury.outcome != 'success' || steps.treasury_evidence.outcome != 'success')
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          echo '::error::DELTA Treasury reconciliation failed or was skipped. Revenue is UNVERIFIED, not zero; inspect the prior scan logs and retry after recovery.'
          echo '### Revenue scan failure' >> "$GITHUB_STEP_SUMMARY"
          echo 'The canonical Treasury scan did not succeed. Do not report zero newly received funds from this run.' >> "$GITHUB_STEP_SUMMARY"
          exit 1


      - name: Require core, financial and reporting evidence
        if: always()
        timeout-minutes: 1
        env:
          DELTA_STEP_OUTCOMES: ${{ toJSON(steps) }}
        run: node scripts/pulse-status.mjs gate /tmp
