name: TMP DELTA full sprint treasury 20260921 1412 JST

on:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/tmp-chat-full-sprint-treasury-20260921-1412.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Scan exact sprint Treasury window
        shell: bash
        run: |
          mkdir -p tmp-evidence
          cat > /tmp/full-sprint.mjs <<'NODE'
          const USDC='0x833589fcd6edb6e08f4c7c32d4f71b54bda02913';
          const TREASURY='0x1990e21bc219696ff7fbc26527dbaed335ac6367';
          const TRANSFER='0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef';
          const TO='0x'+TREASURY.slice(2).padStart(64,'0');
          const START_TS=Math.floor(new Date('2026-09-14T04:43:28Z').getTime()/1000);
          const END_TS=Math.floor(new Date('2026-09-21T04:43:28Z').getTime()/1000);
          const RPCS=['https://mainnet.base.org','https://base-rpc.publicnode.com','https://base.llamarpc.com'];
          async function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
          async function rpc(method,params){let e;for(const u of RPCS){for(let a=1;a<=3;a++){try{const r=await fetch(u,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method,params}),signal:AbortSignal.timeout(15000)});const t=await r.text();if(!r.ok)throw new Error(`${u} ${r.status} ${t.slice(0,120)}`);const j=JSON.parse(t);if(j.error)throw new Error(`${u} ${JSON.stringify(j.error)}`);return {url:u,result:j.result};}catch(x){e=x;console.error(JSON.stringify({event:'rpc_retry',method,url:u,attempt:a,error:String(x)}));await sleep(500*a);}}}throw e;}
          async function block(n){return (await rpc('eth_getBlockByNumber',['0x'+n.toString(16),false])).result;}
          const latest=parseInt((await rpc('eth_blockNumber',[])).result,16);
          async function greatestAtOrBefore(ts,low,high){let best=low-1;while(low<=high){const mid=Math.floor((low+high)/2);const b=await block(mid);const t=parseInt(b.timestamp,16);if(t<=ts){best=mid;low=mid+1;}else high=mid-1;}return best;}
          const approxStart=Math.max(0,latest-380000);
          const endBlock=await greatestAtOrBefore(END_TS,approxStart,latest);
          const startPrev=await greatestAtOrBefore(START_TS-1,approxStart,endBlock);
          const startBlock=startPrev+1;
          const logs=[];
          for(let x=startBlock;x<=endBlock;x+=1900){const y=Math.min(endBlock,x+1899);let ok=false;let last;for(let attempt=1;attempt<=4 && !ok;attempt++){try{const res=await rpc('eth_getLogs',[{address:USDC,fromBlock:'0x'+x.toString(16),toBlock:'0x'+y.toString(16),topics:[TRANSFER,null,TO]}]);logs.push(...res.result);console.error(JSON.stringify({event:'chunk_ok',from:x,to:y,logs:res.result.length,rpc:res.url}));ok=true;}catch(e){last=e;await sleep(700*attempt);}}if(!ok)throw last;}
          const seen=new Map();for(const l of logs)seen.set(l.transactionHash+':'+l.logIndex,l);
          const rows=[...seen.values()].map(l=>({tx_hash:l.transactionHash,block_number:parseInt(l.blockNumber,16),log_index:parseInt(l.logIndex,16),from:'0x'+l.topics[1].slice(-40).toLowerCase(),raw_amount:BigInt(l.data).toString(),usdc:Number(BigInt(l.data))/1e6})).sort((a,b)=>a.block_number-b.block_number||a.log_index-b.log_index);
          const sb=await block(startBlock), eb=await block(endBlock);
          console.log(JSON.stringify({ok:true,checked_at:new Date().toISOString(),sprint_start_utc:'2026-09-14T04:43:28Z',sprint_end_utc:'2026-09-21T04:43:28Z',start_block:startBlock,start_block_timestamp:new Date(parseInt(sb.timestamp,16)*1000).toISOString(),end_block:endBlock,end_block_timestamp:new Date(parseInt(eb.timestamp,16)*1000).toISOString(),blocks_scanned:endBlock-startBlock+1,canonical_usdc_treasury_receipts:rows.length,total_usdc:rows.reduce((s,r)=>s+r.usdc,0),receipts:rows},null,2));
          NODE
          node /tmp/full-sprint.mjs 2>&1 | tee tmp-evidence/full-sprint-treasury.txt
      - uses: actions/upload-artifact@v4
        with:
          name: delta-full-sprint-treasury-20260921-1412
          path: tmp-evidence/
          retention-days: 1
