name: TEMP DELTA 0.7.1 artifact readback and MCP registry

on:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/tmp-publish-buyer-clients-20260916.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: delta-temp-buyer-client-publish-20260916
  cancel-in-progress: false

jobs:
  readback-and-register:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Verify owner pricing remains live before registry write
        run: |
          node scripts/check-owner-pricing.mjs
          node scripts/verify-owner-pricing-live.mjs

      - name: Wait for public npm 0.7.1 readback without republishing
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6 7 8; do
            MCP="$(npm view delta-witness-mcp@0.7.1 version 2>/dev/null || true)"
            JS="$(npm view delta-witness-ruphussten@0.7.1 version 2>/dev/null || true)"
            if [ "$MCP" = '0.7.1' ] && [ "$JS" = '0.7.1' ]; then
              echo 'Both npm buyer packages are publicly readable at 0.7.1'
              exit 0
            fi
            echo "npm propagation pending attempt=$attempt mcp=${MCP:-missing} js=${JS:-missing}"
            sleep 10
          done
          echo 'npm 0.7.1 packages did not become publicly readable within bounded propagation checks' >&2
          exit 1

      - name: Verify public npm artifacts contain current buyer payment semantics
        run: |
          set -euo pipefail
          rm -rf /tmp/delta-published && mkdir -p /tmp/delta-published/mcp /tmp/delta-published/js
          cd /tmp/delta-published/mcp
          npm pack delta-witness-mcp@0.7.1 --ignore-scripts >/tmp/mcp-pack-name.txt
          tar -xzf "$(cat /tmp/mcp-pack-name.txt)"
          test "$(node -p "require('./package/package.json').version")" = '0.7.1'
          grep -q 'capture: 1' package/dist/payment-config.js
          grep -q 'preflight: 5' package/dist/payment-config.js
          grep -q 'Explicit buyer approval required' package/dist/payment-config.js
          ! grep -q '0\.10' package/dist/index.js package/dist/payment-config.js package/README.md
          grep -q '1000000' package/dist/index.js
          grep -q '5000000' package/dist/index.js
          cd /tmp/delta-published/js
          npm pack delta-witness-ruphussten@0.7.1 --ignore-scripts >/tmp/js-pack-name.txt
          tar -xzf "$(cat /tmp/js-pack-name.txt)"
          test "$(node -p "require('./package/package.json').version")" = '0.7.1'
          grep -q 'Capture \*\*1 USDC\*\*' package/README.md
          grep -q 'Public Preflight \*\*5 USDC\*\*' package/README.md

      - name: Publish MCP Registry 0.7.1 after npm propagation if absent
        run: |
          set -euo pipefail
          node scripts/render-mcp-server.mjs
          PLATFORM="$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          URL="https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_${PLATFORM}.tar.gz"
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 3 "$URL" | tar xz mcp-publisher
          ./mcp-publisher validate server.json
          if node scripts/check-mcp-registry.mjs server.json; then
            echo 'MCP Registry 0.7.1 already active; no duplicate publish'
            exit 0
          fi
          ./mcp-publisher login github-oidc
          for attempt in 1 2 3 4 5 6; do
            set +e
            OUTPUT="$(./mcp-publisher publish server.json 2>&1)"
            STATUS=$?
            set -e
            printf '%s\n' "$OUTPUT"
            if [ "$STATUS" -eq 0 ]; then
              break
            fi
            if grep -q 'cannot publish duplicate version' <<<"$OUTPUT"; then
              break
            fi
            if grep -q "version '0.7.1' was not found" <<<"$OUTPUT"; then
              sleep 10
              continue
            fi
            exit "$STATUS"
          done
          for attempt in 1 2 3 4 5 6; do
            if node scripts/check-mcp-registry.mjs server.json; then
              exit 0
            fi
            sleep 10
          done
          echo 'MCP Registry 0.7.1 publish did not read back active after bounded retries' >&2
          exit 1

      - name: Verify PyPI 0.7.1 is publicly installable
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir 'delta-witness-ruphussten==0.7.1'
          python3 - <<'PY'
          from delta_witness import DeltaWitness
          c = DeltaWitness()
          assert c.base_url == 'https://delta-witness-api.ruphussten.workers.dev'
          print('PyPI 0.7.1 import/readback OK')
          PY

      - name: Final no-payment readback
        run: |
          set -euo pipefail
          test "$(npm view delta-witness-mcp@0.7.1 version)" = '0.7.1'
          test "$(npm view delta-witness-ruphussten@0.7.1 version)" = '0.7.1'
          node scripts/verify-owner-pricing-live.mjs
          echo '0.7.1 buyer artifacts verified publicly and MCP Registry registration reconciled. No wallet, payment, KYC, listing fee or customer-revenue claim.' >> "$GITHUB_STEP_SUMMARY"
