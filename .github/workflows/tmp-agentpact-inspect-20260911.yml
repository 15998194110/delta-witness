name: TMP DELTA AgentPact inspect 20260911

on:
  push:
    branches: [master]
    paths: ['.github/workflows/tmp-agentpact-inspect-20260911.yml']

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DELTA_PARTNER_GATEWAY_SECRET: ${{ secrets.DELTA_PARTNER_GATEWAY_SECRET }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - name: Verify DELTA owner pricing first
        run: |
          set -euo pipefail
          node scripts/check-owner-pricing.mjs
          node scripts/verify-owner-pricing-live.mjs
      - name: Inspect AgentPact public offers and needs without auth
        shell: bash
        run: |
          set -u
          for kind in offers needs; do
            code=000
            : >"/tmp/ap-$kind.json"
            for i in 1 2 3; do
              code=$(curl --connect-timeout 10 --max-time 30 -sS -o "/tmp/ap-$kind.json" -w '%{http_code}' "https://api.agentpact.xyz/api/$kind?limit=100") || code=000
              case "$code" in 200|401|402|403) break;; 429|500|502|503|504|000) sleep $((i*2));; *) break;; esac
            done
            echo "AGENTPACT public_${kind}_http=$code"
            if [ "$code" = 200 ]; then
              jq -c '.. | objects | select((((.title? // "") + " " + (.description? // "") + " " + (.agentName? // .sellerName? // "")) | ascii_downcase | contains("delta witness"))) | {id,title,description,category,base_price,budget_max,status,agentId,agentName,sellerId,sellerName}' "/tmp/ap-$kind.json" | head -20 || true
              echo "AGENTPACT ${kind}_count=$(jq '[.. | objects | select(.id? != null)] | length' "/tmp/ap-$kind.json" 2>/dev/null || echo unknown)"
            fi
          done
      - name: Inspect official AgentPact MCP tool schemas without invoking writes
        shell: bash
        run: |
          set -euo pipefail
          endpoint='https://mcp.agentpact.xyz/mcp'
          call_mcp() {
            body="$1"; out="$2"
            curl --connect-timeout 10 --max-time 30 -sS -D /tmp/ap-mcp-h -o "$out" -X POST "$endpoint" \
              -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' --data "$body"
          }
          call_mcp '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"delta-inspector","version":"1"}}}' /tmp/ap-init.txt || true
          echo "AGENTPACT mcp_initialize_sample=$(head -c 500 /tmp/ap-init.txt | tr '\n' ' ')"
          session=$(awk 'BEGIN{IGNORECASE=1} /^mcp-session-id:/{sub(/^[^:]+:[[:space:]]*/,"");gsub(/\r/,"");print;exit}' /tmp/ap-mcp-h)
          headers=(-H 'content-type: application/json' -H 'accept: application/json, text/event-stream')
          if [ -n "$session" ]; then headers+=(-H "mcp-session-id: $session"); fi
          curl --connect-timeout 10 --max-time 30 -sS -o /tmp/ap-tools.txt -X POST "$endpoint" "${headers[@]}" --data '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}'
          python3 - <<'PY'
          import json,re
          raw=open('/tmp/ap-tools.txt').read()
          chunks=[]
          for line in raw.splitlines():
              if line.startswith('data:'): chunks.append(line[5:].strip())
          payload=''.join(chunks) if chunks else raw
          data=json.loads(payload)
          tools=data.get('result',{}).get('tools',[])
          keep=[]
          for t in tools:
              n=t.get('name','')
              if n in {'agentpact.register','agentpact.create_agent','agentpact.create_offer','agentpact.search_offers','agentpact.search_needs','agentpact.seller_match_digest','agentpact.get_overview'}:
                  keep.append({'name':n,'description':t.get('description'),'inputSchema':t.get('inputSchema')})
          print('AGENTPACT_SELECTED_TOOLS='+json.dumps(keep,separators=(',',':')))
          print('AGENTPACT_TOOL_COUNT='+str(len(tools)))
          PY
      - name: Reconcile Treasury independently
        if: always()
        continue-on-error: true
        run: node scripts/reconcile-treasury.mjs
