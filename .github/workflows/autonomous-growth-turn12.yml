name: Autonomous Growth Turn 12
on:
  push:
    branches: [master]
    paths: ['.github/workflows/autonomous-growth-turn12.yml']
permissions:
  contents: read
jobs:
  botmarket:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: BotMarket MCP submit and confirm
        shell: bash
        run: |
          set +e
          npm --silent install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null
          cat > botmarket-run.mjs <<'JS'
          import { chromium } from 'playwright';
          const META_URL='https://delta-witness-api.ruphussten.workers.dev/.well-known/mcp/server.json';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage();
          const mutations=[];
          page.on('response', async r=>{
            if(r.request().method()!=='GET'&&!r.url().includes('/cdn-cgi/rum')){
              let body=''; try{body=(await r.text()).slice(0,3000)}catch{}
              mutations.push({method:r.request().method(),url:r.url(),status:r.status(),body});
            }
          });
          try{
            await page.goto('https://botmarket.bot/submit',{waitUntil:'networkidle',timeout:60000});
            await page.getByRole('button',{name:/mcp server/i}).first().click({force:true});
            await page.waitForTimeout(500);
            await page.locator('input[type=url]:visible').first().fill(META_URL);
            const preview=page.getByRole('button',{name:/fetch.*preview/i}).first();
            await preview.click();
            await page.waitForTimeout(2500);
            const confirm=page.getByRole('button',{name:/confirm submission/i}).first();
            console.log('CONFIRM_COUNT='+await confirm.count());
            if(await confirm.count() && await confirm.isVisible() && !(await confirm.isDisabled())){
              console.log('CLICK_CONFIRM=1');
              await confirm.click();
              await page.waitForTimeout(5000);
            }
            const body=(await page.locator('body').innerText()).replace(/\s+/g,' ').slice(0,14000);
            console.log('FINAL_BODY='+body);
            console.log('MUTATIONS='+JSON.stringify(mutations));
            console.log('FINAL_URL='+page.url());
            const finalMut=mutations.filter(m=>m.url.includes('/v1/submit')).at(-1);
            const accepted=!!finalMut&&finalMut.status>=200&&finalMut.status<300&&(/submitted|queued|review|success|pending/i.test(finalMut.body)||/submission received|submitted successfully|queued for review|sent for review|pending review|thank you|we.?ll review/i.test(body));
            console.log('BOTMARKET_FINAL_ACCEPTED='+(accepted?'1':'0'));
          }catch(e){console.log('BOTMARKET_ERROR='+String(e))}
          await browser.close();
          JS
          node --check botmarket-run.mjs && node botmarket-run.mjs
