name: Autonomous Growth Turn 12
on:
  push:
    branches: [master]
    paths: ['.github/workflows/autonomous-growth-turn12.yml']
permissions:
  contents: read
jobs:
  growth:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Verify DELTA production and reconcile Treasury
        shell: bash
        run: |
          set -u
          BASE=https://delta-witness-api.ruphussten.workers.dev
          python3 - <<'PY'
          import requests,base64,json
          base='https://delta-witness-api.ruphussten.workers.dev'
          routes=[('/v1/capture',{'url':'https://example.com'}),('/v1/preflight',{'url':'https://example.com','expected':{'contains':['Example Domain']}}),('/v1/guarded-action-pilot',{'urls':['https://example.com']})]
          for path,body in routes:
            try:
              r=requests.post(base+path,json=body,timeout=30)
              pr=r.headers.get('payment-required','')
              decoded=None
              if pr:
                try: decoded=json.loads(base64.b64decode(pr+'===').decode())
                except Exception: pass
              print('DELTA_ROUTE='+path+' HTTP='+str(r.status_code)+' PAYMENT_REQUIRED='+pr[:1000]+' DECODED='+json.dumps(decoded,separators=(',',':')) if decoded else 'DELTA_ROUTE='+path+' HTTP='+str(r.status_code)+' PAYMENT_REQUIRED='+pr[:1000])
            except Exception as e: print('DELTA_ROUTE_ERROR='+path+' '+repr(e))
          PY
          node scripts/reconcile-treasury.mjs || echo TREASURY_RECONCILE_DEGRADED=1
      - name: Recheck funded Payan demand and receipts
        shell: bash
        run: |
          python3 - <<'PY'
          import requests,json,time
          urls=['https://payanagent.com/api/v1/requests?status=open&limit=100','https://payanagent.com/api/v1/receipts?limit=100']
          for u in urls:
            for attempt in range(3):
              try:
                r=requests.get(u,timeout=25)
                print('PAYAN_URL='+u+' HTTP='+str(r.status_code)+' BODY='+r.text[:20000])
                if r.status_code<500 and r.status_code!=429: break
              except Exception as e: print('PAYAN_ERROR='+u+' attempt='+str(attempt+1)+' '+repr(e))
              time.sleep(2**attempt)
          PY
      - name: Submit DELTA to BotMarket free directory
        shell: bash
        run: |
          set +e
          python3 - <<'PY'
          import requests
          for u in ['https://botmarket.bot/agents','https://botmarket.bot/mcps']:
            try:
              r=requests.get(u,timeout=25)
              t=r.text.lower(); found=('delta-witness' in t or 'delta witness' in t or '15998194110' in t)
              print('BOTMARKET_PRECHECK='+u+' HTTP='+str(r.status_code)+' FOUND='+str(found))
            except Exception as e: print('BOTMARKET_PRECHECK_ERROR='+u+' '+repr(e))
          PY
          npm --silent install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null
          cat > submit-botmarket.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage();
          try {
            await page.goto('https://botmarket.bot/submit',{waitUntil:'networkidle',timeout:60000});
            const body0=(await page.locator('body').innerText()).replace(/\s+/g,' ');
            console.log('BOTMARKET_INITIAL='+body0.slice(0,6000));
            const tab=page.getByText(/x402 service/i,{exact:true});
            if(await tab.count()) await tab.first().click();
            await page.waitForTimeout(500);
            const fields=await page.locator('input:visible,textarea:visible,select:visible').evaluateAll(els=>els.map((e,i)=>({i,tag:e.tagName,name:e.getAttribute('name'),type:e.getAttribute('type'),placeholder:e.getAttribute('placeholder'),required:e.required,label:e.labels?.[0]?.innerText||'',context:(e.parentElement?.parentElement?.innerText||e.parentElement?.innerText||'').slice(0,500)})));
            console.log('BOTMARKET_FIELDS='+JSON.stringify(fields));
            const vis=page.locator('input:visible,textarea:visible');
            for(let i=0;i<await vis.count();i++){
              const el=vis.nth(i); const nm=(await el.getAttribute('name')||'').toLowerCase(); const ph=(await el.getAttribute('placeholder')||'').toLowerCase(); const tp=(await el.getAttribute('type')||'').toLowerCase(); const label=((await el.evaluate(e=>e.labels?.[0]?.innerText||''))||'').toLowerCase(); const ctx=((await el.evaluate(e=>(e.parentElement?.parentElement?.innerText||e.parentElement?.innerText||'')))||'').toLowerCase();
              if(tp==='email'||nm.includes('contact')||label.includes('contact')||ctx.includes('contact (optional)')) continue;
              if(nm.includes('url')||nm.includes('endpoint')||label.includes('url')||label.includes('endpoint')||ph.includes('https://')) {await el.fill('https://delta-witness-api.ruphussten.workers.dev'); continue;}
              if(nm.includes('name')||label.includes('name')) {await el.fill('DELTA Witness'); continue;}
              if(nm.includes('description')||label.includes('description')) {await el.fill('Autonomous x402 evidence service on Base: $0.03 capture and preflight checks plus a $10 guarded-action pilot.'); continue;}
            }
            let preview=page.getByRole('button',{name:/fetch.*preview|preview|validate/i});
            if(await preview.count()) { await preview.first().click(); await page.waitForTimeout(4000); }
            const afterPreview=(await page.locator('body').innerText()).replace(/\s+/g,' ');
            console.log('BOTMARKET_AFTER_PREVIEW='+afterPreview.slice(0,10000));
            let submit=page.getByRole('button',{name:/submit|add to directory|list/i});
            const n=await submit.count();
            if(n){
              for(let i=n-1;i>=0;i--){ if(await submit.nth(i).isVisible()){ await submit.nth(i).click(); break; } }
              await page.waitForTimeout(4000);
            }
            const after=(await page.locator('body').innerText()).replace(/\s+/g,' ');
            console.log('BOTMARKET_AFTER_SUBMIT='+after.slice(0,12000));
            console.log('BOTMARKET_URL='+page.url());
            console.log('BOTMARKET_SUBMISSION_CONFIRMED='+( /submitted|received|review|thank|queued|success/i.test(after) ? '1':'0'));
          } catch(e){ console.log('BOTMARKET_ERROR='+String(e)); }
          await browser.close();
          JS
          node submit-botmarket.mjs
