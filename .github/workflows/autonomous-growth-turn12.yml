name: Autonomous Growth Turn 12
on:
  push:
    branches: [master]
    paths: ['.github/workflows/autonomous-growth-turn12.yml']
permissions:
  contents: read
jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - name: Focused Payan funded-request readback
        shell: bash
        run: |
          python3 - <<'PY'
          import requests,time,json
          rid='ks76vc9pzpz3qfgf8aawjckn5n8bezhf'
          urls=[
            f'https://payanagent.com/api/v1/requests/{rid}',
            f'https://payanagent.com/api/v1/requests?id={rid}',
            f'https://payanagent.com/api/v1/requests?requestId={rid}',
            'https://payanagent.com/api/v1/requests?status=open&limit=200',
          ]
          for u in urls:
            for attempt in range(3):
              try:
                r=requests.get(u,timeout=25)
                body=r.text
                print('PAYAN_FOCUSED_URL='+u+' HTTP='+str(r.status_code)+' HAS_TARGET='+str(rid in body)+' BODY='+body[:5000])
                if rid in body:
                  try:
                    data=r.json()
                    def find(x):
                      if isinstance(x,dict):
                        if x.get('_id')==rid or x.get('id')==rid: return x
                        for v in x.values():
                          z=find(v)
                          if z is not None:return z
                      elif isinstance(x,list):
                        for v in x:
                          z=find(v)
                          if z is not None:return z
                    target=find(data)
                    print('PAYAN_TARGET='+json.dumps(target,separators=(',',':')) if target else 'PAYAN_TARGET_PRESENT_UNPARSED=1')
                  except Exception as e: print('PAYAN_TARGET_PARSE_ERROR='+repr(e))
                  raise SystemExit(0)
                if r.status_code<500 and r.status_code!=429: break
              except SystemExit: raise
              except Exception as e:
                print('PAYAN_FOCUSED_ERROR='+u+' attempt='+str(attempt+1)+' '+repr(e)); time.sleep(2**attempt)
          print('PAYAN_TARGET_NOT_FOUND_IN_FALLBACKS=1')
          PY
      - name: Retry BotMarket free x402 submission with strict confirmation
        shell: bash
        run: |
          set +e
          npm --silent install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null
          cat > botmarket-retry.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage();
          const mutations=[];
          page.on('response', async r=>{
            const req=r.request();
            if(req.method()!=='GET') mutations.push({method:req.method(),url:r.url(),status:r.status()});
          });
          const compact = async()=> (await page.locator('body').innerText()).replace(/\s+/g,' ').slice(0,12000);
          const fieldSummary = async()=>page.locator('input:visible,textarea:visible,select:visible').evaluateAll(els=>els.map((e,i)=>({i,tag:e.tagName,name:e.getAttribute('name'),type:e.getAttribute('type'),placeholder:e.getAttribute('placeholder'),value:e.value,required:e.required,label:e.labels?.[0]?.innerText||'',ctx:(e.parentElement?.parentElement?.innerText||e.parentElement?.innerText||'').slice(0,400)})));
          try {
            await page.goto('https://botmarket.bot/submit',{waitUntil:'networkidle',timeout:60000});
            console.log('BM_CONTROLS='+JSON.stringify(await page.locator('button,[role=button],label,a').evaluateAll(els=>els.map((e,i)=>({i,tag:e.tagName,role:e.getAttribute('role'),text:(e.innerText||e.textContent||'').trim().replace(/\s+/g,' ').slice(0,180),href:e.getAttribute('href'),for:e.getAttribute('for'),cls:e.className})).filter(x=>/agent|mcp|x402|submit|preview|fetch/i.test(x.text)))));
            const xText=page.getByText(/x402 service/i,{exact:true}).first();
            if(await xText.count()) console.log('BM_X402_HTML='+(await xText.evaluate(e=>e.outerHTML+'\nPARENT='+e.parentElement?.outerHTML+'\nGRAND='+e.parentElement?.parentElement?.outerHTML)).slice(0,10000));
            let switched=false;
            const attempts=[
              async()=>{const x=page.getByRole('button',{name:/x402 service/i}); if(await x.count()) await x.first().click();},
              async()=>{const x=page.getByRole('radio',{name:/x402 service/i}); if(await x.count()) await x.first().check({force:true});},
              async()=>{if(await xText.count()) await xText.click({force:true});},
              async()=>{if(await xText.count()) await xText.locator('..').click({force:true});},
              async()=>{if(await xText.count()) await xText.evaluate(e=>{const p=e.closest('button,[role="button"],label')||e.parentElement; p?.click();});},
            ];
            for(let i=0;i<attempts.length;i++){
              try{await attempts[i](); await page.waitForTimeout(400);}catch(e){console.log('BM_SWITCH_ATTEMPT_'+i+'_ERR='+String(e));}
              const f=await fieldSummary(); console.log('BM_FIELDS_AFTER_SWITCH_'+i+'='+JSON.stringify(f));
              if(f.some(x=>/x402|service url|endpoint/i.test((x.label||'')+' '+(x.placeholder||'')+' '+(x.ctx||'')))){switched=true; break;}
            }
            console.log('BM_SWITCHED='+String(switched));
            const fields=page.locator('input:visible,textarea:visible');
            for(let i=0;i<await fields.count();i++){
              const el=fields.nth(i); const type=(await el.getAttribute('type')||'').toLowerCase(); const label=((await el.evaluate(e=>e.labels?.[0]?.innerText||''))||'').toLowerCase(); const ph=(await el.getAttribute('placeholder')||'').toLowerCase(); const ctx=((await el.evaluate(e=>(e.parentElement?.parentElement?.innerText||e.parentElement?.innerText||'')))||'').toLowerCase();
              if(type==='search'||type==='email'||/contact/.test(label+' '+ctx)) continue;
              if(type==='url'||/url|endpoint/.test(label+' '+ph+' '+ctx)){
                const url=/base url/.test(label+' '+ctx)?'https://delta-witness-api.ruphussten.workers.dev':'https://delta-witness-api.ruphussten.workers.dev/v1/preflight';
                await el.fill(url);
              }
            }
            console.log('BM_FIELDS_FILLED='+JSON.stringify(await fieldSummary()));
            const beforeMut=mutations.length;
            const preview=page.getByRole('button',{name:/fetch.*preview|preview|validate/i});
            if(await preview.count()) {await preview.first().click(); await page.waitForTimeout(5000);} else console.log('BM_NO_PREVIEW_BUTTON=1');
            console.log('BM_AFTER_PREVIEW='+await compact());
            console.log('BM_MUTATIONS_AFTER_PREVIEW='+JSON.stringify(mutations.slice(beforeMut)));
            console.log('BM_CONTROLS_AFTER_PREVIEW='+JSON.stringify(await page.locator('button,[role=button]').evaluateAll(els=>els.map((e,i)=>({i,text:(e.innerText||e.textContent||'').trim().replace(/\s+/g,' ').slice(0,200),disabled:e.disabled})).filter(x=>x.text))));
            const possible=page.getByRole('button',{name:/submit|add to directory|send for review|list service|publish/i});
            let clicked=false;
            for(let i=(await possible.count())-1;i>=0;i--){const b=possible.nth(i); if(await b.isVisible() && !(await b.isDisabled())){const txt=(await b.innerText()).trim(); if(!/^submit$/i.test(txt) || i>0){console.log('BM_CLICK_FINAL='+txt); await b.click(); clicked=true; break;}}
            if(clicked) await page.waitForTimeout(5000);
            const finalBody=await compact();
            console.log('BM_FINAL_BODY='+finalBody);
            console.log('BM_FINAL_MUTATIONS='+JSON.stringify(mutations));
            const successfulMutation=mutations.some(m=>m.status>=200&&m.status<300&&/submit|agent|service|listing|directory|x402|api/i.test(m.url));
            const explicit=/thank you|submission received|submitted successfully|queued for review|sent for review|we.?ll review|successfully submitted/i.test(finalBody);
            console.log('BM_STRICT_CONFIRMED='+(successfulMutation&&explicit?'1':'0'));
          } catch(e){console.log('BM_FATAL='+String(e));}
          await browser.close();
          JS
          node botmarket-retry.mjs
