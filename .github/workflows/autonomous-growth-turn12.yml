name: Autonomous Growth Turn 12
on:
  push:
    branches: [master]
    paths: ['.github/workflows/autonomous-growth-turn12.yml']
permissions:
  contents: read
jobs:
  botmarket:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Submit DELTA to BotMarket free x402 directory
        shell: bash
        run: |
          set +e
          npm --silent install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null
          cat > /tmp/bm.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage();
          const muts=[];
          page.on('response', r=>{ const q=r.request(); if(q.method()!=='GET') muts.push({method:q.method(),url:r.url(),status:r.status()}); });
          const summary=async()=> (await page.locator('body').innerText()).replace(/\s+/g,' ').slice(0,12000);
          const fields=async()=> page.locator('input:visible,textarea:visible,select:visible').evaluateAll(es=>es.map((e,i)=>({i,tag:e.tagName,type:e.getAttribute('type'),placeholder:e.getAttribute('placeholder'),label:e.labels?.[0]?.innerText||'',value:e.value,ctx:(e.parentElement?.parentElement?.innerText||'').replace(/\s+/g,' ').slice(0,300)})));
          try {
            await page.goto('https://botmarket.bot/submit',{waitUntil:'networkidle',timeout:60000});
            console.log('BM_INTERACTIVES='+JSON.stringify(await page.locator('button,[role=button],label').evaluateAll(es=>es.map((e,i)=>({i,tag:e.tagName,text:(e.innerText||e.textContent||'').trim().replace(/\s+/g,' '),html:e.outerHTML.slice(0,1000)})).filter(x=>/agent|mcp|x402|fetch|preview|submit/i.test(x.text)))));
            const x=page.getByText(/x402 service/i,{exact:true}).first();
            if(await x.count()) console.log('BM_X402_NODE='+(await x.evaluate(e=>(e.parentElement?.parentElement?.outerHTML||e.parentElement?.outerHTML||e.outerHTML))).slice(0,8000));
            const candidates=[
              page.getByRole('button',{name:/x402/i}).first(),
              page.getByRole('radio',{name:/x402/i}).first(),
              x,
              x.locator('..'),
              x.locator('../..')
            ];
            for(let i=0;i<candidates.length;i++){
              try { if(await candidates[i].count()) await candidates[i].click({force:true}); } catch(e){ console.log('BM_SWITCH_ERR_'+i+'='+String(e)); }
              await page.waitForTimeout(300);
              console.log('BM_FIELDS_'+i+'='+JSON.stringify(await fields()));
            }
            let fs=page.locator('input:visible,textarea:visible');
            for(let i=0;i<await fs.count();i++){
              const el=fs.nth(i); const type=(await el.getAttribute('type')||'').toLowerCase();
              const ph=(await el.getAttribute('placeholder')||'').toLowerCase();
              const label=((await el.evaluate(e=>e.labels?.[0]?.innerText||''))||'').toLowerCase();
              const ctx=((await el.evaluate(e=>(e.parentElement?.parentElement?.innerText||'')))||'').toLowerCase();
              if(type==='search' || type==='email' || /contact/.test(label+' '+ctx)) continue;
              if(type==='url' || /url|endpoint/.test(ph+' '+label+' '+ctx)) {
                const v=/base url/.test(label+' '+ctx) ? 'https://delta-witness-api.ruphussten.workers.dev' : 'https://delta-witness-api.ruphussten.workers.dev/v1/preflight';
                await el.fill(v);
              }
            }
            console.log('BM_FILLED='+JSON.stringify(await fields()));
            const preview=page.getByRole('button',{name:/fetch.*preview|preview|validate/i});
            if(await preview.count()){ console.log('BM_CLICK_PREVIEW='+(await preview.first().innerText())); await preview.first().click(); await page.waitForTimeout(5000); }
            console.log('BM_AFTER_PREVIEW='+await summary());
            console.log('BM_MUTS_PREVIEW='+JSON.stringify(muts));
            console.log('BM_BUTTONS_AFTER='+JSON.stringify(await page.locator('button:visible').evaluateAll(es=>es.map((e,i)=>({i,text:(e.innerText||e.textContent||'').trim().replace(/\s+/g,' '),disabled:e.disabled}))));
            const finals=page.getByRole('button',{name:/submit|add to directory|send for review|publish|list service/i});
            for(let i=(await finals.count())-1;i>=0;i--){
              const b=finals.nth(i);
              if(await b.isVisible() && !(await b.isDisabled())){
                const txt=(await b.innerText()).trim();
                console.log('BM_CLICK_FINAL='+txt);
                await b.click();
                await page.waitForTimeout(5000);
                break;
              }
            }
            const body=await summary();
            console.log('BM_FINAL_BODY='+body);
            console.log('BM_FINAL_MUTS='+JSON.stringify(muts));
            const explicit=/thank you|submission received|submitted successfully|queued for review|sent for review|we.?ll review|successfully submitted/i.test(body);
            const mut=muts.some(m=>m.status>=200&&m.status<300 && /submit|api|service|agent|listing|directory|x402/i.test(m.url));
            console.log('BM_STRICT_CONFIRMED='+(explicit&&mut?'1':'0'));
          } catch(e){ console.log('BM_FATAL='+String(e)); }
          await browser.close();
          JS
          node /tmp/bm.mjs || true
