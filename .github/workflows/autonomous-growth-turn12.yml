name: Autonomous Growth Turn 12
on:
  push:
    branches: [master]
    paths: ['.github/workflows/autonomous-growth-turn12.yml']
permissions:
  contents: read
jobs:
  botmarket:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: BotMarket MCP direct submit
        shell: bash
        run: |
          set +e
          npm --silent install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null
          cat > botmarket-run.mjs <<'JS'
          import { chromium } from 'playwright';
          const META_URL = 'https://delta-witness-api.ruphussten.workers.dev/.well-known/mcp/server.json';
          let metaText = '';
          try {
            const mr = await fetch(META_URL, {signal: AbortSignal.timeout(15000)});
            metaText = await mr.text();
            console.log('MCP_META_FETCH=' + JSON.stringify({status:mr.status, body:metaText.slice(0,2500)}));
          } catch (e) { console.log('MCP_META_ERROR=' + String(e)); }

          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage();
          const mutations = [];
          page.on('response', async r => {
            if (r.request().method() !== 'GET' && !r.url().includes('/cdn-cgi/rum')) {
              let body=''; try { body=(await r.text()).slice(0,2000); } catch {}
              mutations.push({method:r.request().method(), url:r.url(), status:r.status(), body});
            }
          });
          try {
            await page.goto('https://botmarket.bot/submit', {waitUntil:'networkidle', timeout:60000});
            const tab = page.getByRole('button', {name:/mcp server/i}).first();
            console.log('MCP_TAB_COUNT=' + await tab.count());
            if (await tab.count()) await tab.click({force:true});
            await page.waitForTimeout(700);
            const inputs = page.locator('input:visible');
            const textareas = page.locator('textarea:visible');
            console.log('INPUTS=' + JSON.stringify(await inputs.evaluateAll(ns => ns.map(n => ({type:n.type,name:n.name,placeholder:n.placeholder,aria:n.getAttribute('aria-label')})))));
            console.log('TEXTAREAS=' + JSON.stringify(await textareas.evaluateAll(ns => ns.map(n => ({name:n.name,placeholder:n.placeholder,aria:n.getAttribute('aria-label')})))));
            console.log('BODY_AFTER_TAB=' + (await page.locator('body').innerText()).replace(/\s+/g,' ').slice(0,7000));

            const urlInput = page.locator('input[type=url]:visible').first();
            if (await urlInput.count()) {
              await urlInput.fill(META_URL);
            } else if (await inputs.count() > 1) {
              await inputs.nth(1).fill(META_URL);
            } else if (await textareas.count()) {
              await textareas.first().fill(metaText || JSON.stringify({name:'delta-witness',url:META_URL}));
            }
            const preview = page.getByRole('button', {name:/fetch.*preview|preview|validate/i}).first();
            console.log('PREVIEW_COUNT=' + await preview.count());
            if (await preview.count() && await preview.isVisible() && !(await preview.isDisabled())) {
              console.log('CLICK_PREVIEW=' + await preview.innerText());
              await preview.click();
              await page.waitForTimeout(5000);
            }
            const body1=(await page.locator('body').innerText()).replace(/\s+/g,' ').slice(0,14000);
            console.log('AFTER_PREVIEW=' + body1);
            console.log('BUTTONS=' + JSON.stringify(await page.locator('button:visible').allInnerTexts()));
            const finals = page.getByRole('button', {name:/submit.*review|submit server|add to directory|publish|list|submit/i});
            console.log('FINAL_COUNT=' + await finals.count());
            for (let i=0;i<await finals.count();i++) {
              const b=finals.nth(i); const text=await b.innerText();
              if (!/fetch.*preview/i.test(text) && await b.isVisible() && !(await b.isDisabled())) {
                console.log('CLICK_FINAL=' + text);
                await b.click(); await page.waitForTimeout(5000); break;
              }
            }
            const body2=(await page.locator('body').innerText()).replace(/\s+/g,' ').slice(0,14000);
            console.log('FINAL_BODY=' + body2);
            console.log('MUTATIONS=' + JSON.stringify(mutations));
            console.log('FINAL_URL=' + page.url());
            const acceptedMutation=mutations.some(m=>m.url.includes('/v1/submit') && m.status>=200 && m.status<300);
            const confirmed=acceptedMutation && /submission received|submitted successfully|queued for review|sent for review|pending review|thank you|we.?ll review|listed after review/i.test(body2);
            console.log('BOTMARKET_MCP_CONFIRMED=' + (confirmed?'1':'0'));
          } catch (e) { console.log('BOTMARKET_ERROR=' + String(e)); }
          await browser.close();
          JS
          node --check botmarket-run.mjs && node botmarket-run.mjs
