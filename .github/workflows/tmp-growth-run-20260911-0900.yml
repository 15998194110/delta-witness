name: TMP DELTA SwarmBazaar inspect 20260911 0900
on:
  push:
    paths:
      - '.github/workflows/tmp-growth-run-20260911-0900.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Owner pricing gate
        run: |
          node scripts/check-owner-pricing.mjs
          node scripts/verify-owner-pricing-live.mjs
      - name: Inspect free listing form values and handler
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 4 --retry-delay 2 --retry-all-errors --connect-timeout 12 --max-time 35 'https://swarmbazaar.com/onboard.html' -o /tmp/swarm.html
          sed -n '55,155p' /tmp/swarm.html
