name: DELTA growth finalizer 20260907-0920
on:
  push:
    paths:
      - '.github/workflows/automation-growth-finalize-20260907-0920.yml'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Record growth evidence and clean one-shot workflows
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('docs/growth-ledger.md')
          s=p.read_text()
          marker='|---|---|---|---|---:|---:|---:|---:|---:|---:|---:|---:|---:|---|---|\n'
          rows=(
          '| 2026-09-07T09:14:16+08:00 | agent-tools.cloud x402 directory — Capture / Preflight / Guarded Action Pilot | live | three free programmatic submissions auto-verified; exact public API readback health=`ok`; broker intent ranking not yet surfaced | 0 | 0 | 0 | 0 | 0 | 0.00 | 0.00 | 0.00 | 0.00 | A | Official `POST /api/v1/submit` returned HTTP 200 `status=listed` for all three production endpoints: submission ids `611`, `613`, `614`; directory service ids `22856`, `22857`, `22858`. Exact readback preserved Base and prices `$0.03`, `$0.03`, `$10`, and all three report `health=ok`. Platform directory reported 22,762 verified services / 18,329 healthy at observation time and refreshes the catalog every 6h; these are platform-reach counters, not DELTA buyers. Immediate `/api/v1/broker/recommend` query did not return DELTA, so broker routing remains propagation/ranking pending rather than claimed live. |\n'
          '| 2026-09-07T09:11:30+08:00 | Base Treasury `0x1990e21bc219696ff7fbc26527dbaed335ac6367` | n/a | independently reconciled before agent-tools distribution | 0 | 0 | 0 | 0 | 0 | 0.00 | 0.00 | 0.00 | 0.00 | A | Independent hosted-runner Blockscout query returned `TREASURY_RESULT=[]`; no incoming canonical Base USDC. Directory submissions/probes are excluded from revenue and First Stranger Revenue remains unconfirmed. |\n'
          )
          if 'agent-tools.cloud x402 directory — Capture / Preflight / Guarded Action Pilot' not in s:
              s=s.replace(marker, marker+rows, 1)
              p.write_text(s)
          PY
          rm -f \
            .github/workflows/automation-treasury-20260907-0908.yml \
            .github/workflows/automation-agent-tools-20260907-0914.yml \
            .github/workflows/automation-agent-tools-fix-20260907-0918.yml \
            .github/workflows/automation-growth-finalize-20260907-0920.yml
          git config user.name '15998194110'
          git config user.email '1012287336@qq.com'
          git add docs/growth-ledger.md .github/workflows
          if git diff --cached --quiet; then
            echo 'NO_CHANGES'
            exit 0
          fi
          git commit -m 'growth: record agent-tools distribution and treasury reconciliation'
          git push origin HEAD:master
