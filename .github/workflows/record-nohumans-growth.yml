name: DELTA record nohumans growth evidence
on:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/record-nohumans-growth.yml"

permissions:
  contents: write

jobs:
  reconcile-record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Reconcile nohumans listings and Treasury
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          import fs from 'node:fs';
          const ids=['9acc2efd-b71','97b7e8b8-b62','50ce8a12-faa'];
          const rows=[];
          for (const id of ids) {
            let last;
            for (let i=0;i<4;i++) {
              try { last=await fetch(`https://nohumans.directory/v1/listings/${id}`); if(last.status<500&&last.status!==429) break; } catch {}
              await new Promise(r=>setTimeout(r,1000*(i+1)));
            }
            if(!last?.ok) throw new Error(`nohumans ${id} unavailable: ${last?.status}`);
            const j=await last.json();
            rows.push({id:j.id,name:j.name,status:j.status,score:j.score,probe_count:j.probe_count,consecutive_failures:j.consecutive_failures,last_ok_at:j.last_ok_at,last_probed_at:j.last_probed_at,paid_verified:!!j.paid_verified,paid_verification:j.paid_verification||null,endpoint_url:j.endpoint_url,observed:j.observed||null});
          }
          fs.writeFileSync('/tmp/nohumans.json',JSON.stringify(rows));
          console.log(`NOHUMANS=${JSON.stringify(rows)}`);

          const treasury='0x1990e21bc219696ff7fbc26527dbaed335ac6367'.toLowerCase();
          const usdc='0x833589fcd6db6e08f4c7c32d4f71b54bda02913'.toLowerCase();
          let tr;
          for (let i=0;i<4;i++) {
            try { tr=await fetch(`https://base.blockscout.com/api/v2/addresses/${treasury}/token-transfers?type=ERC-20`); if(tr.status<500&&tr.status!==429) break; } catch {}
            await new Promise(r=>setTimeout(r,1000*(i+1)));
          }
          if(!tr?.ok) throw new Error(`Blockscout unavailable: ${tr?.status}`);
          const tj=await tr.json();
          const incoming=(tj.items||[]).filter(it=>{
            const token=String(it.token?.address_hash||it.token?.address||it.token?.contract_address_hash||'').toLowerCase();
            const to=String(it.to?.hash||it.to?.address_hash||it.to||'').toLowerCase();
            return token===usdc&&to===treasury;
          }).map(it=>({transaction_hash:it.transaction_hash||it.tx_hash||it.hash,from:it.from?.hash||it.from?.address_hash||it.from,to:it.to?.hash||it.to?.address_hash||it.to,timestamp:it.timestamp||it.block_timestamp,total:it.total||it.value}));
          fs.writeFileSync('/tmp/treasury.json',JSON.stringify(incoming));
          console.log(`TREASURY_RESULT=${JSON.stringify(incoming)}`);
          NODE
      - name: Insert conservative ledger rows
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, datetime
          p=Path('docs/growth-ledger.md')
          s=p.read_text()
          nh=json.loads(Path('/tmp/nohumans.json').read_text())
          incoming=json.loads(Path('/tmp/treasury.json').read_text())
          if incoming:
              raise SystemExit('Incoming USDC requires explicit reconciliation before ledger classification: '+json.dumps(incoming))
          by={x['id']:x for x in nh}
          pilot=by['50ce8a12-faa']; capture=by['9acc2efd-b71']; preflight=by['97b7e8b8-b62']
          observed=pilot.get('observed') or {}
          now=datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=8))).replace(microsecond=0).isoformat()
          row1=(f"| {now} | nohumans.directory — Capture / Preflight / Guarded Action Pilot | "
                f"pilot={pilot['status']}; capture={capture['status']}; preflight={preflight['status']} | "
                f"free programmatic listings accepted; Pilot independently probe-verified; Capture/Preflight recovering after production unsupported-method compatibility fix | 0 | 0 | 0 | 0 | 0 | 0.00 | 0.00 | 0.00 | 0.00 | A | "
                f"Listing ids: Capture `9acc2efd-b71`, Preflight `97b7e8b8-b62`, Pilot `50ce8a12-faa`. Current Pilot score=`{pilot['score']}`, probe_count=`{pilot['probe_count']}`, consecutive_failures=`{pilot['consecutive_failures']}`, paid_verified=`{str(pilot['paid_verified']).lower()}`; its observed challenge is x402 v{observed.get('x402_version')}, `{observed.get('challenge_transport')}`, network `{observed.get('network')}`, payTo `{observed.get('pay_to')}`, amount `${observed.get('amount_usd')}` and listing-price match=`{observed.get('price_matches_listing')}`. Initial Capture/Preflight probes exposed a real unsupported-method bug: GET hit POST-only quote state and returned 500, while valid POSTs still returned 402. DELTA fixed `protectWithX402` so non-POST methods now fall through (production GET=404; POST remains 402) without changing price, Treasury or settlement semantics. nohumans verification is external probe evidence, not a buyer or revenue event. Any future payment from nohumans scout `0x54E163e9B8eDDa194D83F46AdD921bfA5fc5f4E0` is platform verification/test and must be excluded from customer revenue. |")
          row2=(f"| {now} | Base Treasury `0x1990e21bc219696ff7fbc26527dbaed335ac6367` | n/a | independently reconciled after nohumans listing/deployment work | 0 | 0 | 0 | 0 | 0 | 0.00 | 0.00 | 0.00 | 0.00 | A | Fresh Blockscout reconciliation returned `TREASURY_RESULT=[]`; no incoming canonical Base USDC. nohumans listing probes and verification are excluded from First Stranger Revenue. |")
          marker='|---|---|---|---|---:|---:|---:|---:|---:|---:|---:|---:|---:|---|---|\n'
          if marker not in s: raise SystemExit('ledger table marker not found')
          p.write_text(s.replace(marker,marker+row2+'\n'+row1+'\n',1))
          PY
          git diff --check
      - name: Commit ledger and self-clean
        run: |
          git config user.name "DELTA Autonomous Growth"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/record-nohumans-growth.yml
          git add docs/growth-ledger.md
          git commit -m "docs: record nohumans distribution evidence [skip ci]"
          git push origin HEAD:master
