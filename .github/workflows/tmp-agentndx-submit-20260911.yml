name: TMP AgentNDX DELTA submission 20260911
on:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/tmp-agentndx-submit-20260911.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect AgentNDX free submit contract with browser-TLS fallback
        run: |
          set -euo pipefail
          python -m pip -q install curl_cffi
          python - <<'PY'
          import json
          from html.parser import HTMLParser
          from curl_cffi import requests
          s=requests.Session(impersonate='chrome')
          urls=['https://agentndx.ai/submit/','https://www.agentndx.ai/submit/']
          html=None
          for u in urls:
              try:
                  r=s.get(u,timeout=20,allow_redirects=True,headers={'Accept-Language':'en-US,en;q=0.9'})
                  print('TRY',u,'HTTP',r.status_code,'FINAL',r.url)
                  if r.status_code==200:
                      html=r.text; break
              except Exception as e:
                  print('TRY_ERROR',u,type(e).__name__,str(e)[:200])
          if html is None:
              print('AGENTNDX_CHANNEL_DEGRADED recoverable=true reason=browser_tls_fallback_exhausted')
              raise SystemExit(1)
          class P(HTMLParser):
              def __init__(self): super().__init__(); self.forms=[]; self.cur=None
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=='form': self.cur={'action':a.get('action'),'method':a.get('method','get'),'inputs':[]}; self.forms.append(self.cur)
                  elif self.cur is not None and tag in ('input','textarea','select','button'):
                      self.cur['inputs'].append({'tag':tag,'name':a.get('name'),'type':a.get('type'),'value':a.get('value'),'checked':('checked' in a)})
              def handle_endtag(self,tag):
                  if tag=='form': self.cur=None
          p=P(); p.feed(html)
          print('FORMS='+json.dumps(p.forms,ensure_ascii=False))
          PY
