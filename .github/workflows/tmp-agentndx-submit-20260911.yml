name: TMP AgentNDX DELTA submission 20260911
on:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/tmp-agentndx-submit-20260911.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect AgentNDX free submit contract with bounded fallbacks
        run: |
          set -u
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140.0 Safari/537.36'
          for URL in 'https://agentndx.ai/submit/' 'https://www.agentndx.ai/submit/'; do
            echo "TRY=$URL"
            CODE=$(curl --retry 2 --retry-delay 1 --retry-all-errors -L -A "$UA" -H 'Accept: text/html,application/xhtml+xml' -H 'Accept-Language: en-US,en;q=0.9' -o /tmp/submit.html -w '%{http_code}' "$URL" || true)
            echo "HTTP=$CODE"
            if [ "$CODE" = "200" ]; then
              python - <<'PY'
          import json
          from html.parser import HTMLParser
          html=open('/tmp/submit.html',encoding='utf-8',errors='replace').read()
          class P(HTMLParser):
              def __init__(self): super().__init__(); self.forms=[]; self.cur=None
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=='form': self.cur={'action':a.get('action'),'method':a.get('method','get'),'inputs':[]}; self.forms.append(self.cur)
                  elif self.cur is not None and tag in ('input','textarea','select','button'):
                      self.cur['inputs'].append({'tag':tag,'name':a.get('name'),'type':a.get('type'),'value':a.get('value')})
              def handle_endtag(self,tag):
                  if tag=='form': self.cur=None
          p=P(); p.feed(html)
          print('FORMS='+json.dumps(p.forms,ensure_ascii=False))
          PY
              exit 0
            fi
          done
          echo 'AGENTNDX_CHANNEL_DEGRADED recoverable=true reason=403_or_unreachable'
          exit 1
