name: DELTA Growth Turn 2026-09-10

on:
  push:
    branches: [master]
    paths: ['.github/workflows/delta-growth-turn-20260910.yml']

permissions:
  contents: read
  id-token: write

concurrency:
  group: delta-growth-turn-20260910
  cancel-in-progress: false

jobs:
  core-and-treasury:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - name: Reconcile Base Treasury independently
        run: node scripts/reconcile-treasury.mjs
      - name: Fail-fast production price and treasury integrity
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://delta-witness-api.ruphussten.workers.dev'
          check() {
            name="$1"; path="$2"; expected="$3"
            code=$(curl --connect-timeout 10 --max-time 30 --retry 3 --retry-all-errors --retry-delay 2 -sS -o /tmp/body -D /tmp/headers -w '%{http_code}' -X POST "$BASE$path" -H 'content-type: application/json' -d '{}')
            hdr=$(awk 'BEGIN{IGNORECASE=1} /^payment-required:/{sub(/^[^:]+:[[:space:]]*/,""); gsub(/\r/,""); print; exit}' /tmp/headers)
            decoded=$(printf '%s' "$hdr" | base64 -d)
            amount=$(printf '%s' "$decoded" | jq -r '.. | .amount? // empty' | head -1)
            payto=$(printf '%s' "$decoded" | jq -r '.. | .payTo? // empty' | head -1)
            network=$(printf '%s' "$decoded" | jq -r '.. | .network? // empty' | head -1)
            echo "CORE product=$name status=$code amount=$amount payTo=$payto network=$network"
            test "$code" = 402
            test "$amount" = "$expected"
            test "${payto,,}" = '0x1990e21bc219696ff7fbc26527dbaed335ac6367'
            test "$network" = 'eip155:8453'
          }
          check capture '/v1/capture' 1000000
          check preflight '/v1/preflight' 5000000
          check pilot '/v1/guarded-action-pilot' 10000000
          curl --fail --retry 3 --retry-all-errors --retry-delay 2 "$BASE/health"

  mcp-registry:
    needs: core-and-treasury
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - name: Confirm published npm artifact
        id: npm
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./packages/mcp-server/package.json').version")
          NAME=$(node -p "require('./packages/mcp-server/package.json').name")
          MCP_NAME=$(node -p "require('./packages/mcp-server/package.json').mcpName")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "mcp_name=$MCP_NAME" >> "$GITHUB_OUTPUT"
          PUBLISHED=$(npm view "$NAME@$VERSION" version 2>/dev/null || true)
          echo "NPM name=$NAME source_version=$VERSION published_version=${PUBLISHED:-missing} mcp_name=$MCP_NAME"
          test "$PUBLISHED" = "$VERSION"
      - name: Install pinned official mcp-publisher
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-all-errors --retry-delay 2 \
            -o /tmp/mcp-publisher.tgz \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          echo 'a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  /tmp/mcp-publisher.tgz' | sha256sum -c -
          tar -xzf /tmp/mcp-publisher.tgz -C /tmp
          chmod +x /tmp/mcp-publisher
          /tmp/mcp-publisher --help >/dev/null
      - name: Generate and validate Registry metadata
        working-directory: packages/mcp-server
        shell: bash
        run: |
          set -euo pipefail
          rm -f server.json
          /tmp/mcp-publisher init
          node - <<'NODE'
          const fs = require('fs');
          const pkg = require('./package.json');
          const p = JSON.parse(fs.readFileSync('server.json','utf8'));
          p.name = pkg.mcpName;
          p.description = 'Paid browser evidence capture and public-source preflight verification over Base x402.';
          p.version = pkg.version;
          if (!Array.isArray(p.packages) || !p.packages.length) {
            p.packages = [{ registryType: 'npm', identifier: pkg.name, version: pkg.version, transport: { type: 'stdio' } }];
          } else {
            p.packages[0].registryType = 'npm';
            p.packages[0].identifier = pkg.name;
            p.packages[0].version = pkg.version;
            p.packages[0].transport = { type: 'stdio' };
            delete p.packages[0].environmentVariables;
          }
          fs.writeFileSync('server.json', JSON.stringify(p, null, 2) + '\n');
          console.log(JSON.stringify(p));
          NODE
          /tmp/mcp-publisher validate server.json
      - name: Publish to official MCP Registry with GitHub OIDC
        working-directory: packages/mcp-server
        shell: bash
        run: |
          set -euo pipefail
          NAME='${{ steps.npm.outputs.mcp_name }}'
          VERSION='${{ steps.npm.outputs.version }}'
          EXISTING=$(curl --fail --retry 3 --retry-all-errors --retry-delay 2 -sS "https://registry.modelcontextprotocol.io/v0.1/servers?search=$NAME")
          if printf '%s' "$EXISTING" | jq -e --arg n "$NAME" --arg v "$VERSION" '.. | objects | select(.name? == $n and .version? == $v)' >/dev/null 2>&1; then
            echo "MCP_REGISTRY already_visible name=$NAME version=$VERSION"
          else
            /tmp/mcp-publisher login github-oidc
            /tmp/mcp-publisher publish server.json
          fi
          ok=0
          for i in 1 2 3 4 5; do
            DATA=$(curl --fail --retry 2 --retry-all-errors --retry-delay 1 -sS "https://registry.modelcontextprotocol.io/v0.1/servers?search=$NAME" || true)
            echo "MCP_REGISTRY attempt=$i response=$(printf '%s' "$DATA" | jq -c '{count:(.servers|length // 0), names:[.servers[]?.server.name // .servers[]?.name]}' 2>/dev/null || echo unavailable)"
            if printf '%s' "$DATA" | jq -e --arg n "$NAME" '.. | strings | select(. == $n)' >/dev/null 2>&1; then ok=1; break; fi
            sleep $((i*3))
          done
          test "$ok" = 1

  buyer-scan:
    needs: core-and-treasury
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Scan current pre-funded Clawlancer bounties without claiming
        shell: bash
        run: |
          set -euo pipefail
          URL='https://clawlancer.ai/api/listings?listing_type=BOUNTY'
          DATA=''
          for i in 1 2 3 4; do
            DATA=$(curl --connect-timeout 10 --max-time 30 --fail --retry 2 --retry-all-errors --retry-delay 1 -sS "$URL" || true)
            [ -n "$DATA" ] && break
            sleep $((i*2))
          done
          if [ -z "$DATA" ]; then
            echo 'CLAWLANCER channel_degraded=true reason=no_response_after_bounded_retries'
            exit 0
          fi
          printf '%s' "$DATA" > /tmp/listings.json
          jq -c '
            [.. | objects |
              select((.listing_type? // .type? // "") == "BOUNTY") |
              select(((.title? // "") + " " + (.description? // "")) | test("api|audit|verification|proof|browser|reliability|security|preflight"; "i")) |
              {id,title,description,price_usdc,price,amount,status,category,created_at,claimed_by,escrowed,funded}
            ] | .[:10]' /tmp/listings.json
