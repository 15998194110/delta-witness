name: DELTA Growth Channels 0110

on:
  push:
    paths:
      - '.github/workflows/_temp_growth_channels_20260910_0110.yml'

permissions:
  contents: read

jobs:
  channels:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read PayAPI listings
        run: |
          curl --retry 3 --retry-all-errors -fsSL 'https://payapi.market/agent/search?q=delta%20witness&verified_only=false&limit=50'
      - name: Read Payan funded request
        run: |
          curl --retry 3 --retry-all-errors -fsSL 'https://payanagent.com/api/v1/requests?status=open&limit=200'
          curl --retry 3 --retry-all-errors -fsSL 'https://payanagent.com/api/v1/receipts?limit=300'
      - name: Refresh Agent402 free registration
        run: |
          curl --retry 3 --retry-all-errors -fsSL -X POST 'https://agent402.tools/api/index/register' -H 'content-type: application/json' --data '{"origin":"https://delta-witness-api.ruphussten.workers.dev"}'
