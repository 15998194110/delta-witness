name: Temporary 402.ad free form inspection
on:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/tmp-402ad-inspect-20260912.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Inspect public submission page implementation only
        run: |
          set -euo pipefail
          curl -fsSL --connect-timeout 10 --max-time 30 --retry 3 --retry-delay 2 --retry-all-errors https://402.ad/submit -o /tmp/submit.html
          python - <<'PY'
          import re, pathlib, html
          s=pathlib.Path('/tmp/submit.html').read_text(errors='replace')
          print('HTML_LEN',len(s))
          for label,pat in [
            ('FORMS',r'<form\b[^>]*>'),
            ('INPUTS',r'<input\b[^>]*>'),
            ('TEXTAREAS',r'<textarea\b[^>]*>'),
            ('BUTTONS',r'<button\b[^>]*>[^<]{0,120}</button>'),
            ('ENDPOINTS',r'/(?:api|v1)/[A-Za-z0-9_./?=&-]+'),
            ('HIDDEN_ACTIONS',r'(?:action|endpoint|submit|submission|review)[^<>]{0,240}')]:
              print(label+'_BEGIN')
              vals=[]
              for m in re.finditer(pat,s,re.I|re.S):
                  v=html.unescape(m.group(0))
                  if v not in vals: vals.append(v)
              for v in vals[:120]: print(v[:600].replace('\n',' '))
              print(label+'_END')
          for needle in ['GitHub Repository URL','What are you using?','Submit for Review','/v1/submit']:
              i=s.find(needle)
              print('CONTEXT',needle, s[max(0,i-1500):i+2500].replace('\n',' ') if i>=0 else 'NOT_FOUND')
          PY
