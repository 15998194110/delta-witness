name: Temporary 402.ad free form inspection
on:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/tmp-402ad-inspect-20260912.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Search 402.ad for canonical DELTA listing
        run: |
          set -euo pipefail
          for q in "DELTA Witness" "DELTA Witness evidence capture verification"; do
            echo "QUERY=$q"
            curl -fsSL --connect-timeout 10 --max-time 30 --retry 3 --retry-delay 2 --retry-all-errors \
              -H 'Content-Type: application/json' \
              -d "$(node -e 'process.stdout.write(JSON.stringify({query:process.argv[1]}))' "$q")" \
              https://402.ad/v1/search -o /tmp/search.json
            node - <<'NODE'
          const fs = require('fs');
          const body = JSON.parse(fs.readFileSync('/tmp/search.json','utf8'));
          const rows = Array.isArray(body) ? body : (body.results || body.services || body.items || []);
          console.log('RESULT_COUNT', rows.length);
          for (const r of rows.slice(0,20)) {
            const s = JSON.stringify(r);
            if (/delta|ruphussten|witness/i.test(s)) console.log('DELTA_MATCH', s);
          }
          NODE
          done
