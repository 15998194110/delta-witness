name: Temporary 402.ad free form inspection
on:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/tmp-402ad-inspect-20260912.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Attempt free canonical DELTA submission
        run: |
          set -euo pipefail
          node - <<'NODE' > /tmp/payload.json
          const payload = {
            agent_type: 'custom_agent',
            service_url: 'https://delta-witness-api.ruphussten.workers.dev/v1/capture',
            tool_name: null,
            use_case: 'Enable autonomous agents to discover and purchase cryptographically verifiable evidence capture and preflight verification through canonical x402 payment on Base.',
            search_query: 'DELTA Witness evidence capture verification',
            contact_email: '',
            organization: 'DELTA Witness',
            additional_description: 'DELTA Witness provides machine-verifiable evidence capture, preflight verification, and guarded-action pilot endpoints with canonical x402 settlement on Base USDC and public discovery metadata.',
            discovered_via: ''
          };
          process.stdout.write(JSON.stringify(payload));
          NODE
          status=$(curl -sS --connect-timeout 10 --max-time 30 \
            -o /tmp/body -w '%{http_code}' \
            -H 'content-type: application/json' \
            --data-binary @/tmp/payload.json \
            https://402.ad/web/submit || true)
          echo "HTTP_STATUS=$status"
          echo 'RESPONSE_BEGIN'
          cat /tmp/body || true
          echo
          echo 'RESPONSE_END'
          # Do not bypass any human verification requirement. A 2xx means direct free submission worked;
          # a 4xx human/auth gate is terminal for this automatic path and requires user completion in the website form.
