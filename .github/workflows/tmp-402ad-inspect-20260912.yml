name: Temporary 402.ad free form inspection
on:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/tmp-402ad-inspect-20260912.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Inspect public client endpoint
        run: |
          curl -fsSL https://402.ad/_app/immutable/chunks/BR_VVxa5.js -o /tmp/client.js
          grep -oE '.{0,500}(submitMcpServer|submitService|/v1/[A-Za-z0-9_./-]+).{0,1200}' /tmp/client.js | head -80
