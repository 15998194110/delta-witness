name: DELTA Autonomous Audit Now
on:
  push:
    paths:
      - '.github/workflows/_delta-audit-now.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DELTA_D1_DATABASE_ID: c9431b00-27c5-4609-9f3d-6af20cb162df
      TREASURY: '0x1990e21bc219696ff7fbc26527dbaed335ac6367'
      USDC: '0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913'
    steps:
      - uses: actions/checkout@v6
      - name: Reconcile chain and telemetry with isolated retries
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          import {writeFile} from 'node:fs/promises';
          const treasury=process.env.TREASURY.toLowerCase();
          const usdc=process.env.USDC.toLowerCase();
          async function fetchRetry(url, options={}, tries=4) {
            let last;
            for (let i=0;i<tries;i++) {
              try {
                const r=await fetch(url,options);
                if (r.ok) return r;
                last=new Error(`HTTP ${r.status}: ${await r.text()}`);
              } catch(e) { last=e; }
              await new Promise(r=>setTimeout(r, 600*(2**i)));
            }
            throw last;
          }
          const out={generated_at:new Date().toISOString(), treasury:process.env.TREASURY, usdc_contract:process.env.USDC, chain:{ok:false,transfers:[],new_since_first_stranger:[]}, telemetry:{ok:false,rows:[]}, errors:[]};
          try {
            const u=`https://base.blockscout.com/api/v2/addresses/${process.env.TREASURY}/token-transfers?type=ERC-20`;
            const r=await fetchRetry(u);
            const j=await r.json();
            const items=j.items||[];
            const incoming=items.filter(x=>String(x.to?.hash||'').toLowerCase()===treasury && String(x.token?.address_hash||x.token?.address||'').toLowerCase()===usdc).map(x=>({tx_hash:x.transaction_hash,timestamp:x.timestamp,from:x.from?.hash,to:x.to?.hash,total:x.total,token:x.token}));
            out.chain.ok=true; out.chain.transfers=incoming;
            out.chain.new_since_first_stranger=incoming.filter(x=>new Date(x.timestamp)>new Date('2026-09-07T05:42:03Z'));
          } catch(e) { out.errors.push({channel:'blockscout',error:String(e)}); }
          try {
            const sql=`SELECT id,event,channel,partner,success,gross_usd,variable_cost_usd,contribution_margin_usd,created_at FROM telemetry_events WHERE created_at >= '2026-09-07 05:40:00' AND event IN ('payment_required','qualified_request','payment_verified','partner_request','capture_started','capture_completed','capture_failed','proof_opened','machine_proof_opened','watch_checked') ORDER BY created_at DESC LIMIT 500`;
            const url=`https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/d1/database/${process.env.DELTA_D1_DATABASE_ID}/query`;
            const r=await fetchRetry(url,{method:'POST',headers:{authorization:`Bearer ${process.env.CLOUDFLARE_API_TOKEN}`,'content-type':'application/json'},body:JSON.stringify({sql})});
            const j=await r.json();
            if(!j.success||!j.result?.[0]?.success) throw new Error(JSON.stringify(j.errors||j));
            out.telemetry.ok=true; out.telemetry.rows=j.result[0].results||[];
          } catch(e) { out.errors.push({channel:'cloudflare_d1',error:String(e)}); }
          await writeFile('docs/autonomous-run-last.json',JSON.stringify(out,null,2)+'\n');
          console.log(JSON.stringify({chain_ok:out.chain.ok,incoming:out.chain.transfers.length,new_incoming:out.chain.new_since_first_stranger.length,telemetry_ok:out.telemetry.ok,telemetry_rows:out.telemetry.rows.length,errors:out.errors}));
          NODE
      - name: Commit audit snapshot
        run: |
          git config user.name 'delta-autonomous-audit'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/autonomous-run-last.json
          git commit -m 'chore: refresh autonomous treasury audit' || exit 0
          git push
# audit-trigger: 2026-09-07T07:24:23Z
