name: DELTA AuraGate Growth Probe
on:
  push:
    paths:
      - '.github/workflows/_temp_auragate_growth_20260908.yml'

permissions:
  contents: read

jobs:
  probe-and-list:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify DELTA live 402 and probe AuraGate
        shell: bash
        run: |
          set -u
          DELTA='https://delta-witness-api.ruphussten.workers.dev/v1/preflight'
          TREASURY='0x1990e21bc219696ff7fbc26527dbaed335ac6367'

          code=$(curl -sS -o /tmp/delta.json -D /tmp/delta.headers -w '%{http_code}' \
            -X POST "$DELTA" -H 'content-type: application/json' \
            --data '{"url":"https://example.com","expected":{"contains":["Example Domain"]}}' || true)
          echo "DELTA_HTTP=$code"
          cat /tmp/delta.json || true
          echo
          test "$code" = "402" || exit 2

          probe_code=$(curl -sS -o /tmp/probe.json -w '%{http_code}' \
            -X POST 'https://auragate.app/api/services/probe' \
            -H 'content-type: application/json' \
            --data "{\"url\":\"$DELTA\",\"method\":\"POST\",\"price\":\"0.03\"}" || true)
          echo "AURAGATE_PROBE_HTTP=$probe_code"
          cat /tmp/probe.json || true
          echo

          ok=$(jq -r '.ok // false' /tmp/probe.json 2>/dev/null || echo false)
          if [ "$ok" != "true" ]; then
            echo 'AURAGATE_REGISTER_SKIPPED=probe_not_ok'
            exit 0
          fi

          cat >/tmp/register.json <<JSON
          {
            "name": "DELTA Witness Preflight",
            "description": "Independent browser preflight for autonomous actions: observe a public URL, compare deterministic expectations, and return a timestamped proof with safe/changed/diff metadata.",
            "category": "automation",
            "price": "0.03",
            "method": "POST",
            "sellerName": "DELTA Witness",
            "sellerAddress": "$TREASURY",
            "externalUrl": "$DELTA",
            "docsUrl": "https://delta-witness-api.ruphussten.workers.dev/docs",
            "tags": ["preflight", "browser-agent", "verification", "guard", "x402", "proof"],
            "sampleResponse": {"ok":true,"product":"preflight","safe":true,"changed":false,"proof_id":"<uuid>"}
          }
          JSON

          register_code=$(curl -sS -o /tmp/register-response.json -w '%{http_code}' \
            -X POST 'https://auragate.app/api/services' \
            -H 'content-type: application/json' \
            --data-binary @/tmp/register.json || true)
          echo "AURAGATE_REGISTER_HTTP=$register_code"
          cat /tmp/register-response.json || true
          echo
