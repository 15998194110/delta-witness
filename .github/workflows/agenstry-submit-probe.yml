name: Agenstry submission probe
on:
  push:
    paths:
      - '.github/workflows/agenstry-submit-probe.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Submit free no-login DELTA discovery resources
        shell: bash
        run: |
          python3 - <<'PY'
          import re, urllib.request, urllib.parse, urllib.error, time
          BASE='https://agenstry.com'
          UA={'User-Agent':'DELTA-Witness-growth/1.0'}
          def get(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers=UA),timeout=30) as r:
                  return r.status,r.geturl(),r.read().decode('utf-8','replace')
          st,final,html=get(BASE+'/submit')
          m=re.search(r'<form\b[^>]*action=["\']/submit["\'][^>]*>(.*?)</form>',html,re.I|re.S)
          if not m: raise SystemExit('submit form not found')
          form=m.group(1)
          names=re.findall(r'<(?:input|select|textarea)\b[^>]*name=["\']([^"\']+)',form,re.I)
          print('FORM_NAMES',names)
          text_inputs=[]
          for tag in re.findall(r'<input\b[^>]*>',form,re.I):
              nm=re.search(r'name=["\']([^"\']+)',tag,re.I)
              ty=re.search(r'type=["\']([^"\']+)',tag,re.I)
              if nm and (not ty or ty.group(1).lower() in ('text','url','search')):
                  text_inputs.append(nm.group(1))
          print('TEXT_INPUTS',text_inputs)
          if len(text_inputs)!=1:
              raise SystemExit('ambiguous resource field; refusing guessed write')
          field=text_inputs[0]
          def post(resource,kind):
              payload=urllib.parse.urlencode({field:resource,'kind':kind}).encode()
              last=None
              for i in range(3):
                  req=urllib.request.Request(BASE+'/submit',data=payload,headers={**UA,'Content-Type':'application/x-www-form-urlencoded'},method='POST')
                  try:
                      with urllib.request.urlopen(req,timeout=30) as r:
                          body=r.read().decode('utf-8','replace')
                          print('SUBMIT',kind,resource,'HTTP',r.status,'FINAL',r.geturl(),'LEN',len(body))
                          for key in ('queued','indexed','submitted','already','success','error'):
                              if key in body.lower():
                                  p=body.lower().find(key); print('BODY_CTX',body[max(0,p-250):p+700].replace('\n',' ')[:1000]); break
                          return
                  except urllib.error.HTTPError as e:
                      b=e.read().decode('utf-8','replace'); last=(e.code,b[:1000])
                      print('ATTEMPT',i+1,'HTTP',e.code,b[:500].replace('\n',' '))
                      if e.code not in (429,500,502,503,504): break
                  except Exception as e:
                      last=(0,repr(e)); print('ATTEMPT',i+1,'ERR',repr(e))
                  time.sleep(1.5*(2**i))
              raise SystemExit('submission failed '+repr(last))
          post('https://github.com/15998194110/delta-witness','github')
          post('delta-witness-mcp','npm')
          PY
