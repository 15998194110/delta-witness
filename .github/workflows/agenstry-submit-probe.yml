name: Agenstry submission probe
on:
  push:
    paths:
      - '.github/workflows/agenstry-submit-probe.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify public Agenstry indexing readback
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.parse, urllib.error, time
          BASE='https://agenstry.com'
          UA={'User-Agent':'DELTA-Witness-growth/1.0'}
          urls=[
            BASE+'/api/search?'+urllib.parse.urlencode({'q':'delta-witness'}),
            BASE+'/api/v1/skills/find_mcp?'+urllib.parse.urlencode({'query':'delta-witness-mcp'}),
            BASE+'/api/v1/skills/find_agent?'+urllib.parse.urlencode({'query':'delta-witness'}),
            BASE+'/providers/delta-witness-api.ruphussten.workers.dev',
          ]
          for url in urls:
              last=None
              for i in range(3):
                  try:
                      with urllib.request.urlopen(urllib.request.Request(url,headers=UA),timeout=30) as r:
                          b=r.read().decode('utf-8','replace')
                          print('READBACK',url,'HTTP',r.status,'FINAL',r.geturl(),'LEN',len(b))
                          low=b.lower()
                          for needle in ['delta-witness-mcp','15998194110/delta-witness','delta-witness-api.ruphussten.workers.dev','no results','not found']:
                              p=low.find(needle.lower())
                              if p>=0: print('MATCH',needle,b[max(0,p-500):p+1200].replace('\n',' ')[:1800])
                          break
                  except urllib.error.HTTPError as e:
                      b=e.read().decode('utf-8','replace'); last=(e.code,b[:1000]); print('ATTEMPT',i+1,'HTTP',e.code,b[:500].replace('\n',' '))
                      if e.code not in (429,500,502,503,504): break
                  except Exception as e:
                      last=(0,repr(e)); print('ATTEMPT',i+1,'ERR',repr(e))
                  time.sleep(1.5*(2**i))
              else:
                  print('FAILED',url,last)
          PY
