name: TMP DELTA x402 Arena refresh 20260912
on:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/tmp-x402arena-register-20260912.yml"

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - name: Read current owner authority
        run: |
          test -s AGENTS.md
          test -s docs/pricing-policy-2026-09-10.md
          grep -q 'Public Capture.*1.00 USDC' docs/pricing-policy-2026-09-10.md
          grep -q 'Public Preflight.*5.00 USDC' docs/pricing-policy-2026-09-10.md
          grep -q 'Guarded-Action Pilot.*10.00 USDC' docs/pricing-policy-2026-09-10.md
      - name: Verify current owner pricing policy
        run: node scripts/check-owner-pricing.mjs
      - name: Verify live public 402 amounts before listing refresh
        run: node scripts/verify-owner-pricing-live.mjs
      - name: Refresh existing canonical Arena listings without paying registration gate
        shell: bash
        run: |
          set -u
          refresh_one() {
            name="$1"; route="$2"; desc="$3"
            payload=$(jq -cn --arg name "$name" --arg endpoint "https://delta-witness-api.ruphussten.workers.dev/v1/$route" --arg desc "$desc" '{name:$name,endpoint:$endpoint,description:$desc,niche:"agent-trust",walletAddress:"0x1990e21bc219696ff7fbc26527dbaed335ac6367",method:"POST",resourceType:"http"}')
            for attempt in 1 2 3 4; do
              code=$(curl -L --connect-timeout 10 --max-time 30 -sS -D /tmp/arena-h.txt -o /tmp/arena-b.txt -w '%{http_code}' -X POST 'https://core.x402arena.gg/register' -H 'content-type: application/json' --data "$payload" || printf '000')
              body=$(cat /tmp/arena-b.txt 2>/dev/null || true)
              printf 'X402ARENA_REFRESH name=%s attempt=%s http=%s body=%q\n' "$name" "$attempt" "$code" "$body"
              if [[ "$code" =~ ^2 ]]; then return 0; fi
              if [[ "$code" == '409' ]] || printf '%s' "$body" | grep -Eqi 'already|duplicate|exists'; then return 0; fi
              if [[ "$code" == '402' ]]; then
                echo "X402ARENA_REFRESH_PAYMENT_GATE name=$name owner_boundary=no_payment"
                return 0
              fi
              if [[ "$code" == '429' || "$code" =~ ^5 || "$code" == '000' ]]; then sleep $((attempt * attempt)); continue; fi
              echo "X402ARENA_REFRESH_NONRETRYABLE name=$name http=$code"
              return 0
            done
            echo "X402ARENA_REFRESH_DEGRADED name=$name retries_exhausted=true"
          }
          refresh_one 'delta-witness-capture' 'capture' 'Tamper-evident evidence capture for autonomous web actions.'
          refresh_one 'delta-witness-preflight' 'preflight' 'Preflight trust verification for autonomous web actions.'
      - name: Verify existing canonical Arena records after refresh attempt
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -L --connect-timeout 10 --max-time 30 -sS -o /tmp/agents.json -w '%{http_code}' 'https://core.x402arena.gg/operator/agents')
          echo "X402ARENA_POSTCHECK_HTTP=$code"
          test "$code" = '200'
          python - <<'PY'
          import json
          data=json.load(open('/tmp/agents.json'))
          wanted={'delta-witness-capture','delta-witness-preflight','delta-witness-guarded-action-pilot'}
          rows=data.get('agents',[]) if isinstance(data,dict) else []
          for row in rows:
              if isinstance(row,dict) and row.get('agentId') in wanted:
                  out={k:row.get(k) for k in ('agentId','status','priceUsdc','queryCount','uniqueBuyers','organicRevenue','totalRevenue','updatedAt')}
                  print('X402ARENA_CANONICAL',json.dumps(out,sort_keys=True,separators=(',',':')))
          PY
