name: TMP DELTA x402 Arena inspect 20260912
on:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/tmp-x402arena-register-20260912.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Inspect exact canonical DELTA Arena entry
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -L --connect-timeout 10 --max-time 30 -sS -o /tmp/agents.json -w '%{http_code}' 'https://core.x402arena.gg/operator/agents')
          echo "X402ARENA_REGISTRY_HTTP=$code"
          test "$code" = '200'
          python - <<'PY'
          import json
          p='/tmp/agents.json'
          data=json.load(open(p))
          needles=('delta-witness-api.ruphussten.workers.dev','0x1990e21bc219696ff7fbc26527dbaed335ac6367','delta-witness')
          seen=set(); hits=[]
          def walk(x,path='$'):
              if isinstance(x,dict):
                  s=json.dumps(x,sort_keys=True).lower()
                  if any(n in s for n in needles):
                      # Prefer smallest dicts that look like agent records.
                      if any(k in x for k in ('name','endpoint','id','agentId','agent_id')):
                          key=json.dumps(x,sort_keys=True)
                          if key not in seen:
                              seen.add(key); hits.append((path,x))
                  for k,v in x.items(): walk(v,f'{path}.{k}')
              elif isinstance(x,list):
                  for i,v in enumerate(x): walk(v,f'{path}[{i}]')
          walk(data)
          print('X402ARENA_MATCH_COUNT',len(hits))
          for path,obj in hits[:20]:
              print('X402ARENA_MATCH_PATH',path)
              print(json.dumps(obj,sort_keys=True,separators=(',',':')))
          PY
