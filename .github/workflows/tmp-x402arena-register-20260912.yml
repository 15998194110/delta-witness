name: TMP DELTA x402 Arena register 20260912
on:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/tmp-x402arena-register-20260912.yml"

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - name: Verify current owner authority before listing mutation
        run: |
          test -s AGENTS.md
          test -s docs/pricing-policy-2026-09-10.md
          node scripts/check-owner-pricing.mjs
          node scripts/verify-owner-pricing-live.mjs
      - name: Dedupe then register canonical Capture endpoint
        shell: bash
        run: |
          set -u
          HOST='delta-witness-api.ruphussten.workers.dev'
          API='https://core.x402arena.gg'
          agents_ok=0
          for attempt in 1 2 3 4; do
            code=$(curl -fsS --connect-timeout 10 --max-time 25 --retry 2 --retry-delay 1 --retry-all-errors \
              -o /tmp/arena-agents.json -w '%{http_code}' "$API/operator/agents" 2>/tmp/arena-agents.err || printf '000')
            if [[ "$code" =~ ^2 ]]; then agents_ok=1; break; fi
            echo "X402ARENA_DEDUPE_DEGRADED attempt=$attempt http=$code recoverable=true"
            sleep $((attempt * attempt))
          done
          if [[ "$agents_ok" != '1' ]]; then
            echo 'X402ARENA_RESULT channel=x402arena listing_status=deferred discovery_status=degraded mutation=false reason=dedupe_unavailable'
            exit 0
          fi
          if grep -Fqi "$HOST" /tmp/arena-agents.json || grep -Fqi 'delta-witness' /tmp/arena-agents.json; then
            echo 'X402ARENA_RESULT channel=x402arena listing_status=already_listed discovery_status=present duplicate_avoided=true mutation=false'
            exit 0
          fi

          payload=$(jq -cn '{name:"delta-witness",endpoint:"https://delta-witness-api.ruphussten.workers.dev/v1/capture",description:"Independent timestamped public-page evidence and proof metadata for autonomous agents.",niche:"verification",walletAddress:"0x1990e21bc219696ff7fbc26527dbaed335ac6367",method:"POST",resourceType:"http",inputSchema:{type:"object",required:["url"],properties:{url:{type:"string",description:"Public HTTPS page to capture"}}},outputSchema:{type:"object",properties:{proof_id:{type:"string"},manifest_url:{type:"string"},public_proof_url:{type:"string"},observed_at:{type:"string"}}}}')
          registered=0
          for attempt in 1 2 3 4; do
            code=$(curl -sS --connect-timeout 10 --max-time 30 -o /tmp/arena-register.json -w '%{http_code}' \
              -X POST "$API/register" -H 'content-type: application/json' --data "$payload" 2>/tmp/arena-register.err || printf '000')
            body=$(cat /tmp/arena-register.json 2>/dev/null || true)
            printf 'X402ARENA_SUBMIT attempt=%s http=%s body=%q\n' "$attempt" "$code" "$body"
            if [[ "$code" =~ ^2 ]]; then registered=1; break; fi
            if [[ "$code" == '409' ]] || printf '%s' "$body" | grep -Eqi 'already|duplicate|exists'; then
              echo 'X402ARENA_RESULT channel=x402arena listing_status=already_listed discovery_status=present duplicate_avoided=true mutation=false'
              exit 0
            fi
            if [[ "$code" == '402' ]]; then
              echo 'X402ARENA_RESULT channel=x402arena listing_status=blocked discovery_status=absent mutation=false reason=registration_payment_required financial_boundary=preserved'
              exit 0
            fi
            if [[ "$code" == '429' || "$code" =~ ^5 || "$code" == '000' ]]; then
              sleep $((attempt * attempt))
              continue
            fi
            echo "X402ARENA_RESULT channel=x402arena listing_status=deferred discovery_status=absent mutation=false reason=nonretryable_http_$code"
            exit 0
          done
          if [[ "$registered" != '1' ]]; then
            echo 'X402ARENA_RESULT channel=x402arena listing_status=deferred discovery_status=degraded mutation=false reason=retries_exhausted'
            exit 0
          fi

          sleep 3
          readback=$(curl -fsS --connect-timeout 10 --max-time 25 --retry 3 --retry-delay 2 --retry-all-errors "$API/operator/agents" || true)
          if printf '%s' "$readback" | grep -Fqi "$HOST"; then
            echo 'X402ARENA_RESULT channel=x402arena listing_status=listed discovery_status=present mutation=true evidence_quality=B_official_registry_plus_self_reported_market_metrics'
          else
            echo 'X402ARENA_RESULT channel=x402arena listing_status=submitted discovery_status=pending mutation=true evidence_quality=B_official_registration_receipt'
          fi
