name: TMP DELTA AgentNDX Contract Inspect 20260909 0322
on:
  push:
    paths:
      - '.github/workflows/tmp-automation-form-inspect-20260909-0322.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect exact AgentNDX submission contract
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --retry-delay 2 https://agentndx.ai/submit/ -o /tmp/agentndx.html
          echo '=== FORM ==='
          grep -Eio '<form[^>]*id="submit-form"[^>]*>' /tmp/agentndx.html || true
          echo '=== INPUTS ==='
          grep -Eio '<input[^>]*>' /tmp/agentndx.html | grep -Ei 'report_id|name=.?name|github_url|homepage_url|protocols|contact' || true
          echo '=== TEXTAREA ==='
          grep -Eio '<textarea[^>]*>' /tmp/agentndx.html || true
          echo '=== PROTOCOL CONTEXT ==='
          python - <<'PY'
          from pathlib import Path
          s=Path('/tmp/agentndx.html').read_text(errors='ignore')
          for needle in ['name="protocols"','name="report_id"','/api/submit']:
              i=s.find(needle)
              if i>=0:
                  print('---', needle, '---')
                  print(s[max(0,i-500):i+900])
          PY
