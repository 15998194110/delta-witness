name: TMP DELTA AgentNDX Submit 20260909 0322
on:
  push:
    paths:
      - '.github/workflows/tmp-automation-form-inspect-20260909-0322.yml'
permissions:
  contents: read
jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Submit DELTA Witness to AgentNDX
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS https://agentndx.ai/submit/ -o /tmp/form.html
          grep -q 'method="POST" action="/api/submit"' /tmp/form.html
          grep -q 'name="protocols" value="MCP"' /tmp/form.html
          grep -q 'name="protocols" value="x402"' /tmp/form.html
          code=$(curl --silent --show-error --max-time 30 \
            --output /tmp/submit.body --dump-header /tmp/submit.headers --write-out '%{http_code}' \
            -X POST https://agentndx.ai/api/submit \
            --data-urlencode 'name=DELTA Witness' \
            --data-urlencode 'github_url=https://github.com/15998194110/delta-witness' \
            --data-urlencode 'homepage_url=https://delta-witness-api.ruphussten.workers.dev/' \
            --data-urlencode 'protocols=MCP' \
            --data-urlencode 'protocols=x402' \
            --data-urlencode 'description=Deterministic public-page evidence and guarded-action preflight for web agents; exposes MCP tools and x402-paid Capture/Preflight on Base.' \
            --data-urlencode 'contact=ruphussten85@gmail.com')
          echo "SUBMIT_HTTP=$code"
          echo '=== HEADERS ==='
          sed -n '1,30p' /tmp/submit.headers
          echo '=== BODY ==='
          head -c 3000 /tmp/submit.body || true
          case "$code" in
            200|201|202|303) exit 0 ;;
            *) exit 1 ;;
          esac
