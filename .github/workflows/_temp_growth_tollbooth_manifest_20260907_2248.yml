name: DELTA Tollbooth Manifest Temp
on:
  push:
    paths:
      - '.github/workflows/_temp_growth_tollbooth_manifest_20260907_2248.yml'
permissions:
  contents: read
jobs:
  fallback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Exact Tollbooth service readback candidates
        shell: bash
        run: |
          set -u
          for slug in delta-witness-capture delta-witness-preflight delta-witness-guarded-action-pilot; do
            code=$(curl --retry 3 --retry-delay 2 --retry-all-errors -sS --max-time 30 -o "/tmp/${slug}.json" -w '%{http_code}' "https://www.trytollbooth.com/api/services/${slug}" || true)
            echo "TOLLBOOTH_EXACT slug=$slug HTTP=$code"
            head -c 5000 "/tmp/${slug}.json" 2>/dev/null || true; echo
          done
      - name: Manifest ingestion fallback
        shell: bash
        run: |
          set -u
          W='0x1990e21bc219696ff7fbc26527dbaed335ac6367'
          USDC='0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913'
          cat >/tmp/manifests.json <<JSON
          [
            {"schema":"agent402/manifest@1","name":"DELTA Witness Capture","description":"Browser verification and timestamped page-state proof for autonomous agents.","category":"ai-inference","endpoint":"https://delta-witness-api.ruphussten.workers.dev/v1/capture","x402":{"network":"base","scheme":"exact","asset":"$USDC","payTo":"$W","maxAmountRequired":"30000"},"input":{"type":"object","properties":{"url":{"type":"string"}}},"output":{"type":"object","properties":{"ok":{"type":"boolean"},"proof_id":{"type":"string"}}}},
            {"schema":"agent402/manifest@1","name":"DELTA Witness Preflight","description":"Preflight autonomous actions against fresh public-source observations and deterministic expectations.","category":"ai-inference","endpoint":"https://delta-witness-api.ruphussten.workers.dev/v1/preflight","x402":{"network":"base","scheme":"exact","asset":"$USDC","payTo":"$W","maxAmountRequired":"30000"},"input":{"type":"object","properties":{"url":{"type":"string"},"expected":{"type":"object"}}},"output":{"type":"object","properties":{"ok":{"type":"boolean"},"safe":{"type":["boolean","null"]},"proof_id":{"type":"string"}}}},
            {"schema":"agent402/manifest@1","name":"DELTA Witness Guarded Action Pilot","description":"Higher-value guarded-action pilot for evidence-backed autonomous action verification.","category":"ai-inference","endpoint":"https://delta-witness-api.ruphussten.workers.dev/v1/guarded-action-pilot","x402":{"network":"base","scheme":"exact","asset":"$USDC","payTo":"$W","maxAmountRequired":"10000000"},"input":{"type":"object","properties":{"urls":{"type":"array","items":{"type":"string"}}}},"output":{"type":"object","properties":{"ok":{"type":"boolean"},"proofs":{"type":"array"}}}}
          ]
          JSON
          code=$(curl --retry 4 --retry-delay 2 --retry-all-errors -sS --max-time 60 -o /tmp/manifest-res.json -w '%{http_code}' -X POST 'https://www.trytollbooth.com/api/manifests' -H 'content-type: application/json' --data-binary @/tmp/manifests.json || true)
          echo "TOLLBOOTH_MANIFEST_ARRAY_HTTP=$code"
          cat /tmp/manifest-res.json 2>/dev/null || true; echo
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            jq '.[0]' /tmp/manifests.json >/tmp/one.json
            code2=$(curl --retry 3 --retry-delay 2 --retry-all-errors -sS --max-time 45 -o /tmp/one-res.json -w '%{http_code}' -X POST 'https://www.trytollbooth.com/api/manifests' -H 'content-type: application/json' --data-binary @/tmp/one.json || true)
            echo "TOLLBOOTH_MANIFEST_SINGLE_HTTP=$code2"
            cat /tmp/one-res.json 2>/dev/null || true; echo
          fi
