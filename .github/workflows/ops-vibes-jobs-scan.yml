name: DELTA One-Shot Vibes Jobs Scan

on:
  push:
    paths:
      - .github/workflows/ops-vibes-jobs-scan.yml

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read public jobs feed
        run: |
          set -euo pipefail
          UA='DELTA-Witness/0.7 (+https://github.com/15998194110/delta-witness)'
          PRIMARY='https://vibes-coded.com/api/v1/jobs-feed'
          FALLBACK='https://vibes-coded-production.up.railway.app/api/v1/jobs-feed'
          code=000
          for url in "$PRIMARY" "$FALLBACK"; do
            for delay in 0 2 5; do
              [ "$delay" = 0 ] || sleep "$delay"
              code=$(curl -sS --connect-timeout 10 --max-time 30 -A "$UA" -o /tmp/jobs.json -w '%{http_code}' "$url" || echo 000)
              echo "jobs_http=$code url=$url"
              [ "$code" = 200 ] && break 2
            done
          done
          test "$code" = 200
          cat /tmp/jobs.json
