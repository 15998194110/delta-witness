name: AuraGate DELTA listing 2026-09-10
on:
  push:
    branches: [master]
    paths: ['.github/workflows/auragate-listing-20260910.yml']
permissions:
  contents: read
jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe and register DELTA endpoints with bounded fallback
        shell: bash
        run: |
          set -u
          API='https://auragate.app/api/services'
          SELLER='0x1990e21bc219696ff7fbc26527dbaed335ac6367'
          register() {
            slug="$1"; name="$2"; price="$3"; url="$4"; desc="$5"; tags="$6"
            probe_payload=$(jq -nc --arg url "$url" --arg method POST --arg price "$price" '{url:$url,method:$method,price:$price}')
            pcode=000
            for i in 1 2 3; do
              pcode=$(curl --connect-timeout 10 --max-time 30 -sS -o "/tmp/probe-$slug.json" -w '%{http_code}' -X POST "$API/probe" -H 'content-type: application/json' --data "$probe_payload") || pcode=000
              echo "AURAGATE probe product=$slug attempt=$i http=$pcode body=$(cat /tmp/probe-$slug.json 2>/dev/null || true)"
              case "$pcode" in 200) break;; 429|500|502|503|504|000) sleep $((i*2));; *) break;; esac
            done
            if [ "$pcode" != 200 ]; then echo "AURAGATE product=$slug action=defer reason=probe_http_$pcode"; return 0; fi
            ok=$(jq -r '.ok // false' "/tmp/probe-$slug.json" 2>/dev/null || echo false)
            if [ "$ok" != true ]; then echo "AURAGATE product=$slug action=defer reason=probe_not_ok"; return 0; fi
            payload=$(jq -nc --arg name "$name" --arg description "$desc" --arg category security --arg price "$price" --arg method POST --arg sellerName 'DELTA Witness' --arg sellerAddress "$SELLER" --arg externalUrl "$url" --arg docsUrl 'https://delta-witness-api.ruphussten.workers.dev/docs' --argjson tags "$tags" '{name:$name,description:$description,category:$category,price:$price,method:$method,sellerName:$sellerName,sellerAddress:$sellerAddress,externalUrl:$externalUrl,docsUrl:$docsUrl,tags:$tags}')
            code=000
            for i in 1 2 3; do
              code=$(curl --connect-timeout 10 --max-time 30 -sS -o "/tmp/submit-$slug.json" -w '%{http_code}' -X POST "$API" -H 'content-type: application/json' --data "$payload") || code=000
              echo "AURAGATE submit product=$slug attempt=$i http=$code body=$(cat /tmp/submit-$slug.json 2>/dev/null || true)"
              case "$code" in 200|201|409) break;; 429|500|502|503|504|000) sleep $((i*3));; *) break;; esac
            done
            case "$code" in 200|201|409) echo "AURAGATE product=$slug action=submission_terminal_success_or_duplicate http=$code";; *) echo "AURAGATE product=$slug action=defer recoverable=true http=$code";; esac
          }
          register capture 'DELTA Witness Capture' '1' 'https://delta-witness-api.ruphussten.workers.dev/v1/capture' 'Timestamped browser-rendered public-web evidence with immutable artifact hashes, paid per call over x402 on Base USDC.' '["web-verification","x402","base","evidence"]'
          register preflight 'DELTA Witness Preflight' '5' 'https://delta-witness-api.ruphussten.workers.dev/v1/preflight' 'Deterministic preflight verification for autonomous actions against a fresh public-web observation, paid per call over x402 on Base USDC.' '["preflight","workflow-safety","x402","base"]'
          register pilot 'DELTA Witness Guarded-Action Pilot' '10' 'https://delta-witness-api.ruphussten.workers.dev/v1/guarded-action-pilot' 'Higher-value guarded-action evidence pilot for consequential agent workflows, with exact x402 Base USDC payment and bounded public-page verification.' '["guarded-action","agent-safety","x402","base"]'
