name: TMP DELTA PayAPI Registration Inspect 20260909 0340
on:
  push:
    paths:
      - '.github/workflows/tmp-automation-free-listing-discovery-20260909-0340.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect PayAPI registration and listing flow
        shell: bash
        run: |
          set -euo pipefail
          base='https://payapi.market'
          curl -fsS --retry 3 --retry-delay 2 "$base/list" -o /tmp/index.html
          src=$(grep -Eo 'src="/assets/index-[^"]+\.js"' /tmp/index.html | head -1 | cut -d'"' -f2)
          curl -fsS --retry 3 --retry-delay 2 "$base$src" -o /tmp/app.js
          python - <<'PY'
          from pathlib import Path
          s=Path('/tmp/app.js').read_text(errors='ignore')
          needles=['signInWithOtp','from(`providers`)','from(`api_listings`)','insert(','wallet_address','walletAddress','company_name','provider_id','base_url','mcp_endpoint','List your API','Provider Dashboard','payment_verified']
          for n in needles:
              print('\n===',n,'===')
              start=0; shown=0
              while shown<12:
                  i=s.find(n,start)
                  if i<0: break
                  print(s[max(0,i-700):i+1700].replace('\n',' ')[:2400])
                  start=i+len(n); shown+=1
          PY
