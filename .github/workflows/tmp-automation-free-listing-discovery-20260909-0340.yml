name: TMP DELTA Historical Receipt Inspect 20260909 0340
on:
  push:
    paths:
      - '.github/workflows/tmp-automation-free-listing-discovery-20260909-0340.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect historical Base transaction and token transfers
        shell: bash
        run: |
          set +e
          tx='0x5ae76f54c158d24f03b86aed0a20482e8de2a35983941c03fe60d131c19cd7b3'
          for path in "transactions/$tx" "transactions/$tx/token-transfers"; do
            echo "=== $path ==="
            curl -fsS --retry 4 --retry-delay 2 "https://base.blockscout.com/api/v2/$path" -o /tmp/out.json
            rc=$?
            echo "CURL_EXIT=$rc"
            if [ $rc -eq 0 ]; then
              python - <<'PY'
          import json
          d=json.load(open('/tmp/out.json'))
          if isinstance(d,dict):
              keep={k:d.get(k) for k in ['hash','status','block','timestamp','from','to','method','fee','items'] if k in d}
              print(json.dumps(keep,separators=(',',':'))[:12000])
          else:
              print(json.dumps(d,separators=(',',':'))[:12000])
          PY
            fi
          done
          exit 0
