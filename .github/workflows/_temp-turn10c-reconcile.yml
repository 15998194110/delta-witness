name: DELTA one-shot revenue reconciliation

on:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/_temp-turn10c-reconcile.yml"

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
      - name: Verify live public quotes
        run: |
          set -euo pipefail
          BASE=https://delta-witness-api.ruphussten.workers.dev
          for p in capture preflight guarded-action-pilot; do
            echo "QUOTE $p"
            curl --fail --retry 4 --retry-all-errors --retry-delay 2 -sS "$BASE/v1/quote?product=$p"
            echo
          done
          STATUS=$(curl --retry 4 --retry-all-errors --retry-delay 2 -sS -o /tmp/preflight.json -D /tmp/preflight.headers -w '%{http_code}' -X POST "$BASE/v1/preflight" -H 'content-type: application/json' -d '{"url":"https://example.com","expected":{"contains":["Example Domain"]}}')
          echo "PREFLIGHT_HTTP_STATUS=$STATUS"
          test "$STATUS" = "402"
          grep -qi '^payment-required:' /tmp/preflight.headers
          cat /tmp/preflight.json
      - name: Audit D1 paid funnel candidates
        run: node scripts/query-revenue-candidates.mjs
      - name: Reconcile canonical Base USDC Treasury
        run: |
          node <<'NODE'
          const TREASURY = '0x1990e21bc219696ff7fbc26527dbaed335ac6367';
          const USDC = '0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913';
          const START = 51057320n;
          const TRANSFER = '0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef';
          const TO_TOPIC = '0x' + '0'.repeat(24) + TREASURY.slice(2).toLowerCase();
          const RPCS = [
            'https://mainnet.base.org',
            'https://base-rpc.publicnode.com',
            'https://1rpc.io/base'
          ];
          const sleep = ms => new Promise(r => setTimeout(r, ms));
          async function rpc(method, params) {
            const errors = [];
            for (const url of RPCS) {
              for (let attempt = 1; attempt <= 3; attempt++) {
                try {
                  const ctl = new AbortController();
                  const timer = setTimeout(() => ctl.abort(), 12000);
                  const res = await fetch(url, {
                    method: 'POST',
                    headers: {'content-type': 'application/json'},
                    body: JSON.stringify({jsonrpc:'2.0', id:1, method, params}),
                    signal: ctl.signal,
                  });
                  clearTimeout(timer);
                  const text = await res.text();
                  if (!res.ok) throw new Error(`http_${res.status}:${text.slice(0,120)}`);
                  const body = JSON.parse(text);
                  if (body.error) throw new Error(`rpc:${JSON.stringify(body.error).slice(0,160)}`);
                  if (body.result === undefined) throw new Error('missing_result');
                  return body.result;
                } catch (e) {
                  errors.push(`${url}#${attempt}:${e?.message || e}`);
                  if (attempt < 3) await sleep(750 * attempt);
                }
              }
            }
            throw new Error(`${method} failed across RPC fallbacks: ${errors.join(' | ')}`);
          }
          function hex(n) { return '0x' + n.toString(16); }
          const latest = BigInt(await rpc('eth_blockNumber', []));
          const all = [];
          if (latest >= START) {
            for (let from = START; from <= latest; from += 1500n) {
              const to = from + 1499n > latest ? latest : from + 1499n;
              const logs = await rpc('eth_getLogs', [{
                address: USDC,
                fromBlock: hex(from),
                toBlock: hex(to),
                topics: [TRANSFER, null, TO_TOPIC],
              }]);
              all.push(...logs);
            }
          }
          const incoming = all.map(log => ({
            block_number: Number(BigInt(log.blockNumber)),
            tx_hash: log.transactionHash,
            from: '0x' + log.topics[1].slice(-40),
            to: TREASURY,
            raw_amount: BigInt(log.data).toString(),
            usdc: Number(BigInt(log.data)) / 1e6,
          }));
          console.log(JSON.stringify({
            ok: true,
            canonical_asset: USDC,
            treasury: TREASURY,
            from_block: Number(START),
            latest_block: Number(latest),
            incoming_count: incoming.length,
            incoming,
          }, null, 2));
          NODE
