name: DELTA Payan Buy Challenge Probe Turn2
on:
  push:
    branches: [master]
    paths: ['.github/workflows/autonomous-growth-turn2-payan-price-sync-2026-09-10.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - name: Probe Payan universal x402 routes without payment
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          git checkout master
          git reset --hard origin/master
          : >/tmp/probes.tsv
          probe(){
            id="$1" title="$2" expected="$3" code=000 amount='' payto='' network=''
            for i in 1 2 3 4; do
              code=$(curl -sS --connect-timeout 8 --max-time 25 -o /tmp/body-$id -D /tmp/headers-$id -w '%{http_code}' -X POST "https://payanagent.com/x402/$id" -H 'content-type: application/json' -d '{}') || code=000
              python3 - "$expected" "/tmp/headers-$id" "/tmp/body-$id" >/tmp/parsed-$id.json <<'PY' || true
          import sys,json,base64,pathlib
          expected,hp,bp=sys.argv[1:]
          h=''
          try:
            for line in open(hp,errors='ignore'):
              if line.lower().startswith('payment-required:'): h=line.split(':',1)[1].strip(); break
          except: pass
          obj={}
          if h:
            try: obj=json.loads(base64.b64decode(h+'==='))
            except: pass
          if not obj:
            try: obj=json.load(open(bp))
            except: obj={}
          def walk(v):
            if isinstance(v,dict):
              yield v
              for z in v.values(): yield from walk(z)
            elif isinstance(v,list):
              for z in v: yield from walk(z)
          nodes=list(walk(obj))
          amount=next((str(x.get('amount')) for x in nodes if x.get('amount') is not None),'')
          payto=next((str(x.get('payTo')) for x in nodes if x.get('payTo')),'')
          network=next((str(x.get('network')) for x in nodes if x.get('network')),'')
          print(json.dumps({'amount':amount,'payTo':payto,'network':network,'expected':expected}))
          PY
              amount=$(jq -r '.amount // empty' /tmp/parsed-$id.json 2>/dev/null || true)
              payto=$(jq -r '.payTo // empty' /tmp/parsed-$id.json 2>/dev/null || true)
              network=$(jq -r '.network // empty' /tmp/parsed-$id.json 2>/dev/null || true)
              [ "$code" = 402 ] && break
              sleep $((i*2))
            done
            if [ "$code" = 402 ] && [ "$amount" = "$expected" ] && [ "${payto,,}" = '0x1990e21bc219696ff7fbc26527dbaed335ac6367' ] && [ "$network" = 'eip155:8453' ]; then status=live_matches_owner_price; else status=challenge_mismatch_or_degraded; fi
            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "$id" "$title" "$status" "$code" "$amount" "$payto" "$network" >>/tmp/probes.tsv
          }
          probe kh79t54410qb82yjcqsjmgv0d58dn7p3 'DELTA Witness Capture' 1000000
          probe kh72vd1kdv37109xxzzgmn2xfn8dnc6z 'DELTA Witness Guard Preflight' 5000000
          probe kh7dskbdz0mj2ctc0dvm6q1yb98dz8dm 'DELTA Witness Guarded Action Pilot' 10000000
          python3 - <<'PY'
          import json,pathlib,datetime
          rows=[]
          for l in pathlib.Path('/tmp/probes.tsv').read_text().splitlines():
            p=l.split('\t'); rows.append({'offer_id':p[0],'title':p[1],'status':p[2],'http':p[3],'raw_amount':p[4],'pay_to':p[5],'network':p[6]})
          pathlib.Path('docs/channel-status/payan-buy-challenge-2026-09-10-turn2.json').write_text(json.dumps({'checked_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'rows':rows},indent=2)+'\n')
          PY
          git config user.name 'DELTA Operator'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/channel-status/payan-buy-challenge-2026-09-10-turn2.json
          git commit -m 'growth: record Payan live buy challenge pricing'
          git push origin HEAD:master
