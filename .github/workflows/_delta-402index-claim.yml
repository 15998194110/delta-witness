name: DELTA 402 Index Claim
on:
  push:
    paths:
      - '.github/workflows/_delta-402index-claim.yml'
permissions:
  contents: write
jobs:
  claim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Request public domain-verification hash
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          import {writeFile} from 'node:fs/promises';
          const domain='delta-witness-api.ruphussten.workers.dev';
          let result;
          for(let i=0;i<4;i++){
            try{
              const r=await fetch('https://402index.io/api/v1/claim',{method:'POST',headers:{'content-type':'application/json','user-agent':'DELTA-Witness/0.7.0'},body:JSON.stringify({domain})});
              const data=await r.json();
              if(r.status===200||r.status===201){result={status:r.status,domain:data.domain,verification_hash:data.verification_hash,verification_url:data.verification_url,expires_at:data.expires_at||null};break;}
              if(r.status===409){result={status:r.status,domain,already_verified:true};break;}
            }catch{}
            await new Promise(r=>setTimeout(r,600*(2**i)));
          }
          if(!result) throw new Error('claim failed after retries');
          await writeFile('docs/402index-claim-public.json',JSON.stringify(result,null,2)+'\n');
          console.log(JSON.stringify(result));
          NODE
      - name: Commit public claim material
        run: |
          git config user.name 'delta-autonomous-growth'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/402index-claim-public.json
          git commit -m 'chore: record 402 Index domain verification hash' || exit 0
          git push
