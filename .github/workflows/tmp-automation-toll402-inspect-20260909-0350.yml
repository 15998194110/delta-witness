name: TMP DELTA TOLL402 Inspect 20260909 0350
on:
  push:
    paths:
      - '.github/workflows/tmp-automation-toll402-inspect-20260909-0350.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Inspect official TOLL402 no-account submission page
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --retry-delay 2 --max-time 30 'https://toll402.com/submit' -o /tmp/toll.html
          python - <<'PY'
          from html.parser import HTMLParser
          import re, pathlib, urllib.parse, urllib.request
          html=pathlib.Path('/tmp/toll.html').read_text(errors='ignore')
          class P(HTMLParser):
            def handle_starttag(self,tag,attrs):
              if tag in ('form','input','textarea','select','button'):
                print('TAG',tag,dict(attrs))
          P().feed(html)
          srcs=re.findall(r'<script[^>]+src=["\']([^"\']+)',html,re.I)
          print('SCRIPTS',srcs)
          for src in srcs:
            if src.startswith('/'): src='https://toll402.com'+src
            if not src.startswith('http'): continue
            try:
              data=urllib.request.urlopen(src,timeout=20).read().decode(errors='ignore')
            except Exception as e:
              print('SCRIPT_ERR',src,repr(e)); continue
            hits=sorted(set(re.findall(r'/api/[A-Za-z0-9_./?=&:-]+',data)))
            interesting=[h for h in hits if any(k in h.lower() for k in ('submit','list','contact','review'))]
            if interesting: print('SCRIPT_API',src,interesting[:100])
            for needle in ('SUBMIT FOR REVIEW','listing review','contactEmail','contact_email','endpointUrl','endpoint_url'):
              i=data.find(needle)
              if i>=0: print('CONTEXT',needle,data[max(0,i-800):i+1800])
          PY
      - name: Reconcile canonical Base USDC Treasury
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.request, time
          treasury='0x1990e21bc219696ff7fbc26527dbaed335ac6367'
          usdc='0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913'
          topic0='0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef'
          to_topic='0x'+'0'*24+treasury[2:].lower()
          endpoints=['https://mainnet.base.org','https://base-rpc.publicnode.com','https://base.llamarpc.com']
          def rpc(method,params):
            last=None
            for ep in endpoints:
              for attempt in range(3):
                try:
                  req=urllib.request.Request(ep,data=json.dumps({'jsonrpc':'2.0','id':1,'method':method,'params':params}).encode(),headers={'content-type':'application/json'})
                  with urllib.request.urlopen(req,timeout=20) as r: d=json.load(r)
                  if 'result' in d: return d['result'],ep
                  last=RuntimeError(str(d)[:300])
                except Exception as e:
                  last=e; time.sleep(2*(attempt+1))
            raise last
          head_hex,ep=rpc('eth_blockNumber',[]); head=int(head_hex,16)
          start=51052684
          if head<start: start=max(0,head-2000)
          logs,ep2=rpc('eth_getLogs',[{'fromBlock':hex(start),'toBlock':hex(head),'address':usdc,'topics':[topic0,None,to_topic]}])
          rows=[]
          for x in logs:
            rows.append({'block':int(x['blockNumber'],16),'tx':x['transactionHash'],'from':'0x'+x['topics'][1][-40:],'amount_usdc':int(x['data'],16)/1_000_000})
          print('TREASURY_RECON='+json.dumps({'from_block':start,'head_block':head,'incoming_count':len(rows),'incoming':rows,'rpc':ep2},separators=(',',':')))
          PY
      - name: Read paid-funnel telemetry candidates
        run: node scripts/query-revenue-candidates.mjs
