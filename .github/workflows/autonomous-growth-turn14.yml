name: Autonomous Growth Turn 14
on:
  push:
    branches: [master]
    paths: ['.github/workflows/autonomous-growth-turn14.yml']
permissions:
  contents: read
jobs:
  growth:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Reconcile Base Treasury and DELTA paid funnel
        shell: bash
        run: |
          set +e
          echo '=== TREASURY ==='
          for i in 1 2 3; do
            node scripts/reconcile-treasury.mjs && break
            sleep $((i*2))
          done
          echo '=== PAID FUNNEL ==='
          node scripts/query-revenue-candidates.mjs || true
          exit 0
      - name: Verify owner-authorized production x402 quotes
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://delta-witness-api.ruphussten.workers.dev'
          check() {
            name="$1"; path="$2"; payload="$3"; expected="$4"
            code=$(curl --retry 3 --retry-all-errors --retry-delay 1 -sS -o /tmp/body -D /tmp/headers -w '%{http_code}' -X POST "$BASE$path" -H 'content-type: application/json' -d "$payload")
            hdr=$(awk 'BEGIN{IGNORECASE=1} /^payment-required:/{sub(/^[^:]+:[[:space:]]*/,""); gsub(/\r/,""); print; exit}' /tmp/headers)
            decoded=$(printf '%s' "$hdr" | base64 -d 2>/dev/null || true)
            amount=$(printf '%s' "$decoded" | jq -r '.. | .amount? // empty' 2>/dev/null | head -1)
            payto=$(printf '%s' "$decoded" | jq -r '.. | .payTo? // empty' 2>/dev/null | head -1)
            network=$(printf '%s' "$decoded" | jq -r '.. | .network? // empty' 2>/dev/null | head -1)
            echo "product=$name status=$code amount=$amount expected=$expected payTo=$payto network=$network"
            test "$code" = 402
            test "$amount" = "$expected"
            test "${payto,,}" = '0x1990e21bc219696ff7fbc26527dbaed335ac6367'
            test "$network" = 'eip155:8453'
          }
          check capture '/v1/capture' '{"url":"https://example.com"}' 30000
          check preflight '/v1/preflight' '{"url":"https://example.com","expected":{"contains":["Example Domain"]}}' 1000000
          check pilot '/v1/guarded-action-pilot' '{"url":"https://example.com","expected":{"contains":["Example Domain"]}}' 10000000
      - name: Check automatic x402.new discovery without payment
        shell: bash
        run: |
          set +e
          HOST='delta-witness-api.ruphussten.workers.dev'
          for qs in 'search=delta-witness' 'q=delta-witness' 'host=delta-witness-api.ruphussten.workers.dev'; do
            echo "=== x402.new?$qs ==="
            code=$(curl --retry 3 --retry-all-errors --retry-delay 1 -sS -G -o /tmp/x402new.json -w '%{http_code}' 'https://x402.new/api/services' --data "$qs" --data 'perPage=100')
            echo "HTTP=$code"
            if [ "$code" = '200' ]; then
              jq -c --arg h "$HOST" '{total,page,perPage,matches:[.items[]? | select(.host==$h or (.resource|tostring|contains($h)))]}' /tmp/x402new.json 2>/dev/null || head -c 2000 /tmp/x402new.json
              echo
            fi
          done
          exit 0
