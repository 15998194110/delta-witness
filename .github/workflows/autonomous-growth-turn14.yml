name: Autonomous Growth Turn 14
on:
  push:
    branches: [master]
    paths: ['.github/workflows/autonomous-growth-turn14.yml']
permissions:
  contents: read
jobs:
  growth:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PAYANAGENT_API_KEY: ${{ secrets.PAYANAGENT_API_KEY }}
    steps:
      - uses: actions/checkout@v6
      - name: Retry funded request detail with seller auth
        shell: bash
        run: |
          set +e
          RID=ks76vc9pzpz3qfgf8aawjckn5n8bezhf
          echo "KEY_PRESENT=$([ -n \"$PAYANAGENT_API_KEY\" ] && echo 1 || echo 0)"
          for i in 1 2 3; do
            code=$(curl --retry 2 --retry-all-errors --retry-delay 1 -sS -o /tmp/request.json -w '%{http_code}' "https://payanagent.com/api/v1/requests/$RID" -H "Authorization: Bearer $PAYANAGENT_API_KEY")
            echo "AUTH_REQUEST_HTTP=$code"
            cat /tmp/request.json | head -c 12000; echo
            [ "$code" = "200" ] && break
            sleep $((i*2))
          done
          exit 0
