name: Autonomous Growth Turn 14
on:
  push:
    branches: [master]
    paths: ['.github/workflows/autonomous-growth-turn14.yml']
permissions:
  contents: read
jobs:
  growth:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - name: Submit DELTA MCP to MCP.Directory
        shell: bash
        run: |
          set +e
          npm --silent install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null
          cat > /tmp/submit.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage();
          const mutations=[];
          page.on('response',async r=>{if(r.request().method()!=='GET'){let body='';try{body=(await r.text()).slice(0,6000)}catch{};mutations.push({method:r.request().method(),url:r.url(),status:r.status(),body})}});
          try{
            let loaded=false;
            for(let i=1;i<=3&&!loaded;i++){try{await page.goto('https://mcp.directory/submit',{waitUntil:'domcontentloaded',timeout:60000});loaded=true}catch(e){console.log('NAV_RETRY_'+i+'='+String(e));await page.waitForTimeout(i*1500)}}
            if(!loaded) throw new Error('mcp.directory unavailable after retries');
            const gh=page.getByPlaceholder('https://github.com/org/mcp-server').first();
            console.log('GH_FIELD='+await gh.count());
            await gh.fill('https://github.com/15998194110/delta-witness');
            const npm=page.getByPlaceholder('@org/mcp-server').first(); if(await npm.count()) await npm.fill('delta-witness-mcp');
            const desc=page.locator('input').filter({has:page.locator('')});
            const short=page.getByPlaceholder(/one sentence/i).first(); if(await short.count()) await short.fill('Paid evidence capture and preflight for autonomous agents via MCP and Base x402.');
            const button=page.getByRole('button',{name:/submit for review/i}).first();
            console.log('SUBMIT_COUNT='+await button.count());
            if(await button.count() && !(await button.isDisabled())) {await button.click(); await page.waitForTimeout(6000)}
            const body=(await page.locator('body').innerText()).replace(/\s+/g,' ').slice(0,16000);
            console.log('FINAL_URL='+page.url());
            console.log('BODY='+body);
            console.log('MUTATIONS='+JSON.stringify(mutations));
            console.log('ACCEPTED='+( /thank|submitted|received|review|success/i.test(body) && !/submit your mcp server.*submission form/i.test(body.slice(0,500)) ? '1':'0'));
          }catch(e){console.log('ERROR='+String(e))}finally{await browser.close()}
          JS
          node --check /tmp/submit.mjs && node /tmp/submit.mjs
          exit 0
