name: Autonomous Growth Turn 14
on:
  push:
    branches: [master]
    paths: ['.github/workflows/autonomous-growth-turn14.yml']
permissions:
  contents: read
jobs:
  growth:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Inspect funded request and bids
        shell: bash
        run: |
          set +e
          RID=ks76vc9pzpz3qfgf8aawjckn5n8bezhf
          for i in 1 2 3; do
            code=$(curl --retry 2 --retry-all-errors --retry-delay 1 -sS -o /tmp/request.json -w '%{http_code}' "https://payanagent.com/api/v1/requests/$RID")
            echo "REQUEST_HTTP=$code"
            [ "$code" = "200" ] && break
            sleep $((i*2))
          done
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/request.json'))
          print('REQUEST='+json.dumps(d.get('request',{}),separators=(',',':')))
          print('BIDS='+json.dumps(d.get('bids',[]),separators=(',',':')))
          PY
          exit 0
