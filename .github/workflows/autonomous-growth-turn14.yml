name: Autonomous Growth Turn 14
on:
  push:
    branches: [master]
    paths: ['.github/workflows/autonomous-growth-turn14.yml']
permissions:
  contents: read
jobs:
  growth:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Submit DELTA to Not Human Search and verify index
        shell: bash
        run: |
          set +e
          DOMAIN=delta-witness-api.ruphussten.workers.dev
          URL=https://$DOMAIN
          echo '=== SUBMIT ==='
          for i in 1 2 3; do
            code=$(curl --connect-timeout 10 --max-time 45 --retry 2 --retry-all-errors --retry-delay 1 -sS -o /tmp/submit.json -w '%{http_code}' -X POST 'https://nothumansearch.ai/api/v1/submit' -H 'Content-Type: application/json' --data "{\"url\":\"$URL\"}")
            echo "SUBMIT_HTTP=$code"
            cat /tmp/submit.json; echo
            case "$code" in 200|201|202|409) break;; esac
            sleep $((i*2))
          done
          echo '=== READBACK ==='
          for i in 1 2 3 4; do
            code=$(curl --connect-timeout 10 --max-time 45 --retry 2 --retry-all-errors --retry-delay 1 -sS -o /tmp/site.json -w '%{http_code}' "https://nothumansearch.ai/api/v1/site/$DOMAIN")
            echo "SITE_HTTP=$code"
            cat /tmp/site.json | head -c 16000; echo
            [ "$code" = "200" ] && break
            sleep $((i*3))
          done
          exit 0
