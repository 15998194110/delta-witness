name: DELTA Arena Growth Temp

on:
  push:
    paths:
      - '.github/workflows/_temp_growth_arena_20260907_1810.yml'

permissions:
  contents: read

jobs:
  verify-arena:
    runs-on: ubuntu-latest
    steps:
      - name: Read back DELTA Arena registrations
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://delta-witness-api.ruphussten.workers.dev'
          raw=$(curl --retry 3 --retry-all-errors --connect-timeout 10 --max-time 40 -fsS 'https://core.x402arena.gg/operator/agents')
          echo "$raw" | jq '{delta:[.. | objects | select((.endpoint? // "") | startswith("'"$BASE"'")) | {id,agentId,name,endpoint,niche,status,verified,pricing,network,payTo,walletAddress,revenue,queries,buyers}]}'
          echo "$raw" | jq -e '[.. | objects | select((.endpoint? // "") == "'"$BASE"'/v1/preflight")] | length > 0'

      - name: Read back DELTA leaderboard rows
        shell: bash
        run: |
          set -euo pipefail
          raw=$(curl --retry 3 --retry-all-errors --connect-timeout 10 --max-time 40 -fsS 'https://core.x402arena.gg/leaderboard')
          echo "$raw" | jq '{delta:[.. | objects | select(((.name? // .agentId? // "") | startswith("delta-witness"))) | {id,agentId,name,endpoint,niche,revenue,queries,buyers}]}'
