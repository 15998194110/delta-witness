name: TMP MCPServers free-submit inspect 20260911-1404
on:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/tmp-mcpservers-inspect-20260911-1404.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - name: Read current operator authority
        run: |
          test -s AGENTS.md
          test -s docs/pricing-policy-2026-09-10.md
          grep -q 'Public Capture.*1.00 USDC' docs/pricing-policy-2026-09-10.md
          grep -q 'Public Preflight.*5.00 USDC' docs/pricing-policy-2026-09-10.md
          grep -q 'Guarded-Action Pilot.*10.00 USDC' docs/pricing-policy-2026-09-10.md
      - name: Verify current owner pricing policy
        run: node scripts/check-owner-pricing.mjs
      - name: Verify live public 402 amounts
        run: node scripts/verify-owner-pricing-live.mjs
      - name: Reconcile Base Treasury independently
        env:
          TREASURY_ADDRESS: '0x1990e21bc219696ff7fbc26527dbaed335ac6367'
        run: node scripts/reconcile-treasury.mjs
      - name: Inspect free submission contract without writing
        shell: bash
        run: |
          set -euo pipefail
          url='https://mcpservers.org/submit'
          for attempt in 1 2 3 4; do
            code=$(curl -L --connect-timeout 10 --max-time 30 -sS -D /tmp/headers -c /tmp/cookies -o /tmp/page.html -w '%{http_code}' "$url" || printf '000')
            echo "MCPSERVERS_GET attempt=$attempt http=$code"
            if [[ "$code" == 2* ]]; then break; fi
            if [[ "$code" == 429 || "$code" == 5* || "$code" == 000 ]]; then sleep $((attempt*attempt)); continue; fi
            exit 1
          done
          echo '--- FORM TAGS ---'
          grep -Eoi '<form[^>]*>' /tmp/page.html | head -20 || true
          echo '--- INPUT/TEXTAREA/SELECT NAMES ---'
          grep -Eoi '<(input|textarea|select)[^>]*>' /tmp/page.html | sed -E 's/>/>\n/g' | grep -Ei 'name=|type=|value=' | head -100 || true
          echo '--- OPTIONS ---'
          grep -Eoi '<option[^>]*>[^<]*' /tmp/page.html | head -100 || true
          echo '--- LEGAL/PAYMENT TERMS ---'
          grep -Eio '.{0,120}(terms|agree|agreement|privacy|premium|payment|fee|stripe|checkout).{0,180}' /tmp/page.html | head -50 || true
          echo '--- CANONICAL DEDUPE PROBES ---'
          for probe in \
            'https://mcpservers.org/?q=delta-witness' \
            'https://mcpservers.org/servers?search=delta-witness' \
            'https://mcpservers.org/search?q=delta-witness'; do
            p=$(curl -L --connect-timeout 10 --max-time 20 -sS "$probe" || true)
            if printf '%s' "$p" | grep -Fqi 'https://github.com/15998194110/delta-witness'; then
              echo "MCPSERVERS_DEDUPE present=1 probe=$probe"
            else
              echo "MCPSERVERS_DEDUPE present=0 probe=$probe"
            fi
          done
