name: TEMP DELTA revenue reconciliation 20260919-1413
on:
  push:
    branches: [master]
    paths: [.github/workflows/tmp-revenue-run-20260919-1413.yml]
permissions:
  contents: read
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DELTA_INDEXNOW_ADMIN_SECRET: ${{ secrets.DELTA_INDEXNOW_ADMIN_SECRET }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DELTA_PARTNER_SECRET: ${{ secrets.DELTA_PARTNER_SECRET }}
      DELTA_TREASURY_LOOKBACK_BLOCKS: '70000'
      DELTA_TREASURY_CHUNK_BLOCKS: '1900'
    steps:
      - uses: actions/checkout@v6
        with: {persist-credentials: false}
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - name: Verify owner pricing and live public 402
        run: node scripts/check-owner-pricing.mjs && node scripts/verify-owner-pricing-live.mjs | tee /tmp/pricing.json
      - name: Paid funnel
        continue-on-error: true
        run: node scripts/query-revenue-candidates.mjs | tee /tmp/funnel.json
      - name: AgentPact funded demand
        continue-on-error: true
        run: node scripts/scan-agentpact-demand.mjs | tee /tmp/agentpact.json
      - name: External funded demand
        continue-on-error: true
        run: node scripts/scan-external-funded-demand.mjs | tee /tmp/external.json
      - name: Reconcile Treasury
        run: node scripts/reconcile-treasury.mjs | tee /tmp/treasury.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: delta-revenue-1413-${{ github.run_id }}
          path: |
            /tmp/pricing.json
            /tmp/funnel.json
            /tmp/agentpact.json
            /tmp/external.json
            /tmp/treasury.json
          retention-days: 7
