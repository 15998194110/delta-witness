name: TEMP DELTA revenue audit 20260915-1246
on:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/tmp-revenue-audit-20260915-1246.yml"
jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static owner pricing policy check
        run: node scripts/check-owner-pricing.mjs
      - name: Live public pricing verification
        run: node scripts/verify-owner-pricing-live.mjs
      - name: Paid funnel candidates
        continue-on-error: true
        run: node scripts/query-revenue-candidates.mjs
      - name: Treasury reconciliation
        if: always()
        env:
          DELTA_TREASURY_LOOKBACK_BLOCKS: 50000
          DELTA_TREASURY_CHUNK_BLOCKS: 1900
        run: node scripts/reconcile-treasury.mjs
      - name: AgentPact demand
        if: always()
        continue-on-error: true
        run: node scripts/scan-agentpact-demand.mjs
      - name: AgentExchange demand
        if: always()
        continue-on-error: true
        run: node scripts/scan-agentexchange-demand.mjs
      - name: Payan demand
        if: always()
        continue-on-error: true
        run: node scripts/scan-payan-demand.mjs
      - name: Circle discovery duplicate check
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          curl -fsS --connect-timeout 10 --max-time 25 --retry 3 --retry-delay 2 --retry-all-errors \
            'https://api.circle.com/v2/x402/discovery/resources?query=delta-witness-api.ruphussten.workers.dev' \
            | tee /tmp/circle.json
          if grep -Fqi 'delta-witness-api.ruphussten.workers.dev' /tmp/circle.json; then
            echo 'CIRCLE_DELTA_PRESENT=true'
          else
            echo 'CIRCLE_DELTA_PRESENT=false'
          fi
