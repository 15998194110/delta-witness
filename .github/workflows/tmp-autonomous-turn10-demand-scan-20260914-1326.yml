name: TEMP DELTA autonomous turn10 demand scan 20260914-1326

on:
  push:
    paths:
      - '.github/workflows/tmp-autonomous-turn10-demand-scan-20260914-1326.yml'

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: AgentExchange public funded-demand scan
        run: node scripts/scan-agentexchange-demand.mjs
      - name: PayanAgent public funded-demand scan
        run: node scripts/scan-payan-demand.mjs
