name: DELTA PayAPI Submission Contract Discovery

on:
  push:
    paths:
      - '.github/workflows/_temp_growth_turn6_payapi_extract_20260909_2342.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Extract listing contract without submitting
        shell: bash
        run: |
          set -u
          node <<'NODE'
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function req(url,opts={},tries=4){let last;for(let i=0;i<tries;i++){try{const r=await fetch(url,{...opts,headers:{'user-agent':'DELTA-Witness-Distribution/0.7',...(opts.headers||{})}});const text=await r.text();if((r.status===429||r.status>=500)&&i<tries-1){last={status:r.status,text};await sleep(400*2**i);continue}return{status:r.status,text,headers:Object.fromEntries(r.headers)}}catch(e){last={error:String(e)};if(i<tries-1)await sleep(400*2**i)}}return last}
          const html=await req('https://payapi.market/list');
          const src=[...html.text.matchAll(/<script[^>]+src=["']([^"']+)["']/gi)].map(m=>m[1]).find(x=>x.includes('/assets/index-'));
          const js=await req(new URL(src,'https://payapi.market').href);
          console.log('JS_STATUS',js.status,'LEN',js.text.length);
          const needles=['Your details','payout wallet','USDC payout','List your API','base URL','price per request','provider_name','providerName','wallet_address','walletAddress','base_url','baseUrl','mcp_endpoint','supabase.co','/rest/v1/','.from(`','.from("','.insert(','provider_submissions','submissions','listings','submit for verification','verification'];
          for(const n of needles){let pos=0,count=0;while((pos=js.text.indexOf(n,pos))>=0&&count<12){console.log(`\n### ${n} @ ${pos}\n`+js.text.slice(Math.max(0,pos-900),Math.min(js.text.length,pos+1800)));pos+=n.length;count++;}if(count)console.log('COUNT',n,count)}
          const urls=[...new Set(js.text.match(/https:\/\/[^"'`\\\s)]+/g)||[])].filter(u=>/supabase|payapi|railway|api/i.test(u));
          console.log('\nURLS',JSON.stringify(urls.slice(0,100),null,2));
          for(const u of ['https://payapi.market/agent/search?q=delta%20witness&verified_only=false&limit=20','https://payapi.market/agent/search?q=delta&verified_only=false&limit=50','https://payapi.market/agent/list?verified_only=false&limit=500']){const r=await req(u);console.log('\nCATALOG',u,r.status,r.text.slice(0,12000));}
          NODE