name: TMP DELTA x402 List Submission Preflight 20260913

on:
  push:
    branches: [master]
    paths: ['.github/workflows/tmp-x402-list-submit-preflight-20260913.yml']

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with: { node-version: '22' }

      - name: Enforce current owner pricing and live production
        run: |
          set -euo pipefail
          node scripts/check-owner-pricing.mjs
          node scripts/verify-owner-pricing-live.mjs

      - name: Attempt x402 List submission up to payment boundary
        shell: bash
        run: |
          set -euo pipefail
          payload=$(jq -nc '{
            url:"https://delta-witness-api.ruphussten.workers.dev",
            email:"ruphussten85@gmail.com",
            service_name:"DELTA Witness",
            description:"Independent public page-state evidence and deterministic preflight verification for consequential agent actions, with direct x402 settlement on Base USDC.",
            website_url:"https://delta-witness-app.pages.dev/",
            category:"Verification",
            endpoints:["POST /v1/capture","POST /v1/preflight","POST /v1/guarded-action-pilot"],
            notes:"Current owner-authorized prices are Capture 1 USDC, Public Preflight 5 USDC, and Guarded-Action Pilot 10 USDC. Production challenges use Base eip155:8453, canonical Base USDC, and Treasury 0x1990e21bc219696ff7fbc26527dbaed335ac6367. Pricing should be measured from live 402 responses rather than copied metadata."
          }')

          : >/tmp/x402-list-submit-body.json
          : >/tmp/x402-list-submit-headers.txt
          code=000
          for i in 1 2 3; do
            code=$(curl --connect-timeout 10 --max-time 45 -sS \
              -D /tmp/x402-list-submit-headers.txt \
              -o /tmp/x402-list-submit-body.json \
              -w '%{http_code}' \
              -X POST 'https://x402-list.com/api/v1/submit' \
              -H 'content-type: application/json' \
              --data "$payload") || code=000
            case "$code" in 201|400|402|409|429) break;; 500|502|503|504|000) sleep $((i*2));; *) break;; esac
          done

          echo "X402_LIST_SUBMIT http=$code"
          if [ "$code" = 201 ]; then
            jq -c '{data:.data}' /tmp/x402-list-submit-body.json
            echo 'X402_LIST_SUBMIT listing_status=submitted_pending_review payment_required=false'
          elif [ "$code" = 402 ]; then
            node - <<'NODE'
          const fs=require('fs');
          const body=JSON.parse(fs.readFileSync('/tmp/x402-list-submit-body.json','utf8')||'{}');
          const accepts = body.accepts || body.error?.accepts || body.payment?.accepts || [];
          const a = accepts[0] || {};
          console.log(JSON.stringify({
            event:'x402_list_payment_boundary',
            payment_required:true,
            amount_raw:a.amount ?? null,
            network:a.network ?? null,
            asset:a.asset ?? null,
            payTo:a.payTo ?? a.pay_to ?? null,
            scheme:a.scheme ?? null,
            error:body.error?.message ?? null
          }));
          NODE
            echo 'X402_LIST_SUBMIT listing_status=blocked_exact_financial_authorization payment_required=true'
          else
            jq -c '.' /tmp/x402-list-submit-body.json 2>/dev/null || cat /tmp/x402-list-submit-body.json
            echo "X402_LIST_SUBMIT listing_status=degraded_or_rejected payment_required=false http=$code"
          fi

      - name: Reconcile Base Treasury independently
        if: always()
        continue-on-error: true
        run: node scripts/reconcile-treasury.mjs
