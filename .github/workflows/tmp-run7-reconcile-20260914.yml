name: Temporary DELTA run7 reconciliation
on:
  push:
    paths:
      - '.github/workflows/tmp-run7-reconcile-20260914.yml'
permissions:
  contents: read
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
