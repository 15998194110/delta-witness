name: TMP true402 product listings
on:
  push:
    paths:
      - '.github/workflows/tmp-true402-products.yml'
permissions:
  contents: write
jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify and list missing DELTA products
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://delta-witness-api.ruphussten.workers.dev'
          mkdir -p /tmp/t402 docs/channel-status
          verify402(){ local path="$1" body="$2"; local h; h=$(curl --retry 2 --retry-delay 2 --retry-all-errors -sS -o /tmp/t402/body -D /tmp/t402/headers -w '%{http_code}' -X POST "$BASE$path" -H 'content-type: application/json' -d "$body"); test "$h" = 402; grep -qi '^payment-required:' /tmp/t402/headers; echo "$h"; }
          CAP_HTTP=$(verify402 '/v1/capture' '{"url":"https://example.com"}')
          PRE_HTTP=$(verify402 '/v1/preflight' '{"url":"https://example.com","expected":{"contains":["Example Domain"]}}')
          PILOT_HTTP=$(verify402 '/v1/guarded-action-pilot' '{"targets":[{"url":"https://example.com"}],"expected":{"contains":["Example Domain"]}}')

          query(){ curl --retry 2 --retry-delay 2 --retry-all-errors -sS -G 'https://true402.dev/api/v1/services' --data-urlencode "q=$1" --data-urlencode 'limit=100'; }
          query 'DELTA Witness Capture' > /tmp/t402/cap_before.json
          query 'DELTA Witness Preflight' > /tmp/t402/pre_before.json

          has_endpoint(){ node - "$1" "$2" <<'NODE'
          const fs=require('fs');const [p,e]=process.argv.slice(2);let j;try{j=JSON.parse(fs.readFileSync(p,'utf8'))}catch{j=null}const a=Array.isArray(j)?j:(j?.data||j?.services||j?.items||[]);process.stdout.write(a.some(x=>x?.manifest?.endpoint===e)?'1':'0');
          NODE
          }
          CAP_FOUND=$(has_endpoint /tmp/t402/cap_before.json "$BASE/v1/capture")
          PRE_FOUND=$(has_endpoint /tmp/t402/pre_before.json "$BASE/v1/preflight")
          CAP_REG='not_needed'; PRE_REG='not_needed'

          if [ "$CAP_FOUND" = 0 ]; then
            cat >/tmp/t402/cap_payload.json <<'JSON'
          {"url":"https://delta-witness-api.ruphussten.workers.dev/v1/capture","manifest":{"x402":"1.0","name":"DELTA Witness Capture","description":"Timestamped public-page evidence for autonomous agents. One exact $0.03 Base USDC payment preserves the observed page state and returns verifiable proof metadata and hashes.","capabilities":["web-evidence","page-state-proof","capture","browser-verification","agent-safety"],"pricing":{"currency":"USDC","base":"0.03","unit":"request"},"payment":{"address":"0x1990e21bc219696ff7fbc26527dbaed335ac6367","chain":"base","facilitator":"https://facilitator.payai.network"},"endpoint":"https://delta-witness-api.ruphussten.workers.dev/v1/capture"}}
          JSON
            CAP_REG=$(curl --retry 2 --retry-delay 2 --retry-all-errors -sS -o /tmp/t402/cap_register.json -w '%{http_code}' -X POST 'https://true402.dev/api/v1/services' -H 'content-type: application/json' --data-binary @/tmp/t402/cap_payload.json || true)
          fi
          if [ "$PRE_FOUND" = 0 ]; then
            cat >/tmp/t402/pre_payload.json <<'JSON'
          {"url":"https://delta-witness-api.ruphussten.workers.dev/v1/preflight","manifest":{"x402":"1.0","name":"DELTA Witness Preflight","description":"Deterministic public-source preflight for autonomous actions. One exact $0.03 Base USDC payment observes fresh page state and compares it with explicit text rules or prior proof hashes before an agent acts.","capabilities":["preflight-verification","web-evidence","agent-safety","deterministic-verification","workflow-safety"],"pricing":{"currency":"USDC","base":"0.03","unit":"request"},"payment":{"address":"0x1990e21bc219696ff7fbc26527dbaed335ac6367","chain":"base","facilitator":"https://facilitator.payai.network"},"endpoint":"https://delta-witness-api.ruphussten.workers.dev/v1/preflight"}}
          JSON
            PRE_REG=$(curl --retry 2 --retry-delay 2 --retry-all-errors -sS -o /tmp/t402/pre_register.json -w '%{http_code}' -X POST 'https://true402.dev/api/v1/services' -H 'content-type: application/json' --data-binary @/tmp/t402/pre_payload.json || true)
          fi
          sleep 1
          query 'DELTA Witness Capture' > /tmp/t402/cap_after.json
          query 'DELTA Witness Preflight' > /tmp/t402/pre_after.json
          query 'delta-witness' > /tmp/t402/all_after.json
          printf '%s' "$CAP_HTTP" > /tmp/t402/cap_http; printf '%s' "$PRE_HTTP" > /tmp/t402/pre_http; printf '%s' "$PILOT_HTTP" > /tmp/t402/pilot_http; printf '%s' "$CAP_REG" > /tmp/t402/cap_reg; printf '%s' "$PRE_REG" > /tmp/t402/pre_reg

          node - <<'NODE'
          const fs=require('fs'); const read=p=>{try{return JSON.parse(fs.readFileSync(p,'utf8'))}catch{return null}}; const arr=j=>Array.isArray(j)?j:(j?.data||j?.services||j?.items||[]);
          const all=[...arr(read('/tmp/t402/cap_after.json')),...arr(read('/tmp/t402/pre_after.json')),...arr(read('/tmp/t402/all_after.json'))]; const seen=new Set(), hits=[];
          for(const x of all){const ep=x?.manifest?.endpoint||''; if(!ep.includes('delta-witness-api.ruphussten.workers.dev'))continue; const k=x?.id||ep; if(seen.has(k))continue; seen.add(k); hits.push(x);}
          const want=['https://delta-witness-api.ruphussten.workers.dev/v1/capture','https://delta-witness-api.ruphussten.workers.dev/v1/preflight','https://delta-witness-api.ruphussten.workers.dev/v1/guarded-action-pilot'];
          const out={observed_at:new Date().toISOString(),production:{capture_http:Number(fs.readFileSync('/tmp/t402/cap_http','utf8')),preflight_http:Number(fs.readFileSync('/tmp/t402/pre_http','utf8')),pilot_http:Number(fs.readFileSync('/tmp/t402/pilot_http','utf8')),treasury:'0x1990e21bc219696ff7fbc26527dbaed335ac6367',network:'eip155:8453'},true402:{capture_registration_http:fs.readFileSync('/tmp/t402/cap_reg','utf8'),preflight_registration_http:fs.readFileSync('/tmp/t402/pre_reg','utf8'),delta_listing_count:hits.length,listings:hits,expected_endpoints:want,confirmed_endpoints:want.filter(ep=>hits.some(x=>x?.manifest?.endpoint===ep)),evidence_quality:'A if confirmed by registry readback; otherwise registration-only'},controls:['Free registration only.','No wallet signature, fee, asset movement, or paid self-call.']};
          fs.writeFileSync('docs/channel-status/true402-products-2026-09-08-turn9.json',JSON.stringify(out,null,2)+'\n');
          NODE
      - name: Commit listing evidence
        shell: bash
        run: |
          git config user.name 'delta-growth-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/channel-status/true402-products-2026-09-08-turn9.json
          git commit -m 'growth: persist true402 product listing evidence'
          git push
