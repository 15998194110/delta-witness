name: TEMP DELTA revenue turn8 audit 20260915 0235
on:
  push:
    paths:
      - '.github/workflows/tmp-revenue-turn8-audit-20260915-0235.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verify owner pricing policy
        run: node scripts/check-owner-pricing.mjs
      - name: Verify live public prices without payment
        run: node scripts/verify-owner-pricing-live.mjs
      - name: Audit paid funnel candidates
        run: node scripts/query-revenue-candidates.mjs
      - name: Reconcile Base Treasury
        env:
          DELTA_TREASURY_LOOKBACK_BLOCKS: '100000'
          DELTA_TREASURY_CHUNK_BLOCKS: '1900'
        run: node scripts/reconcile-treasury.mjs
      - name: Scan AgentPact buyer demand
        continue-on-error: true
        run: node scripts/scan-agentpact-demand.mjs
      - name: Scan AgentExchange buyer demand
        continue-on-error: true
        run: node scripts/scan-agentexchange-demand.mjs
      - name: Scan PayanAgent buyer demand
        continue-on-error: true
        run: node scripts/scan-payan-demand.mjs
