name: DELTA treasury reconciliation 20260907-1210

on:
  push:
    paths:
      - '.github/workflows/treasury-20260907-1210.yml'

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Base Treasury canonical USDC
        shell: bash
        run: |
          set -u
          URL='https://base.blockscout.com/api/v2/addresses/0x1990e21bc219696ff7fbc26527dbaed335ac6367/token-transfers?type=ERC-20'
          ok=0
          for attempt in 1 2 3; do
            code=$(curl -sS --connect-timeout 5 --max-time 15 -o /tmp/transfers.json -w '%{http_code}' "$URL" || printf '000')
            echo "TREASURY_FETCH attempt=$attempt HTTP=$code"
            if [ "$code" = "200" ]; then ok=1; break; fi
            sleep $((attempt * 2))
          done
          if [ "$ok" -ne 1 ]; then
            echo 'TREASURY_RECONCILIATION_DEGRADED'
            exit 0
          fi
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/transfers.json'))
          items=d.get('items',[])
          usdc='0x833589fcd6edb6e08f4c7c32d4f71b54bda02913'
          addr='0x1990e21bc219696ff7fbc26527dbaed335ac6367'
          rows=[]
          for x in items:
              token=x.get('token') or {}
              ta=(token.get('address_hash') or token.get('address') or '').lower()
              to=x.get('to') or {}
              tohash=(to.get('hash') if isinstance(to,dict) else to or '').lower()
              if ta != usdc or tohash != addr: continue
              dec=int(token.get('decimals') or 6)
              total=x.get('total') or {}
              raw=total.get('value') if isinstance(total,dict) else x.get('value')
              try: amount=int(raw)/(10**dec)
              except Exception: amount=raw
              fr=x.get('from') or {}
              rows.append({'tx_hash':x.get('transaction_hash'),'timestamp':x.get('timestamp'),'from':fr.get('hash') if isinstance(fr,dict) else fr,'amount_usdc':amount})
          print('TREASURY_RESULT='+json.dumps(rows[:50],separators=(',',':')))
          PY
