name: TEMP inspect DELTA live x402 challenge shape
on:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/tmp-x402-challenge-shape-20260915.yml"
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect unpaid Capture challenge only
        shell: bash
        run: |
          set -euo pipefail
          URL='https://delta-witness-api.ruphussten.workers.dev/v1/capture'
          curl -sS -D /tmp/h -o /tmp/b -X POST "$URL" -H 'content-type: application/json' --data '{"url":"https://example.com"}' >/dev/null
          STATUS=$(awk 'NR==1{print $2}' /tmp/h)
          test "$STATUS" = "402"
          node <<'NODE'
          const fs = require('fs');
          const h = fs.readFileSync('/tmp/h','utf8');
          const b = JSON.parse(fs.readFileSync('/tmp/b','utf8'));
          const m = h.match(/^payment-required:\s*(.+)$/mi);
          if (!m) throw new Error('payment-required missing');
          const s=m[1].trim().replace(/-/g,'+').replace(/_/g,'/');
          const pad='='.repeat((4-s.length%4)%4);
          const p=JSON.parse(Buffer.from(s+pad,'base64').toString('utf8'));
          const a=Array.isArray(p.accepts)?p.accepts[0]||{}:{};
          console.log(JSON.stringify({
            status:402,
            x402Version:p.x402Version,
            root_keys:Object.keys(p).sort(),
            accept_keys:Object.keys(a).sort(),
            extra_keys:a.extra && typeof a.extra==='object'?Object.keys(a.extra).sort():[],
            scheme:a.scheme,
            network:a.network,
            asset:a.asset,
            amount:a.amount,
            payTo:a.payTo,
            maxTimeoutSeconds:a.maxTimeoutSeconds,
            root_facilitator:p.facilitator ?? null,
            accept_facilitator:a.facilitator ?? null,
            extra_facilitator:a.extra?.facilitator ?? null,
            body_root_keys:Object.keys(b).sort(),
            body_facilitator:b.facilitator ?? null,
            body_accept_facilitator:Array.isArray(b.accepts)?(b.accepts[0]?.facilitator ?? null):null,
            body_extra_facilitator:Array.isArray(b.accepts)?(b.accepts[0]?.extra?.facilitator ?? null):null,
          },null,2));
          NODE