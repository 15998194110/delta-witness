name: DELTA one-shot Walnut listing and revenue reconciliation

on:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/_temp-turn10-walnut-reconcile.yml"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Direct-submit public source to Walnut World
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/walnut.json
          import json, re, time
          from html import unescape
          from urllib.parse import urljoin
          import requests

          HOME='https://walnut.world/'
          SOURCE='https://github.com/15998194110/delta-witness'
          s=requests.Session()
          s.headers.update({'User-Agent':'DELTA-Witness-Growth/0.7 (+https://delta-witness-api.ruphussten.workers.dev/docs)'})

          def req(method,url,**kw):
              errs=[]
              for attempt in range(1,4):
                  try:
                      r=s.request(method,url,timeout=20,allow_redirects=False,**kw)
                      if r.status_code in (429,500,502,503,504):
                          errs.append(f'{r.status_code}:{r.text[:120]}')
                          time.sleep(attempt*1.5)
                          continue
                      return r, errs
                  except Exception as e:
                      errs.append(repr(e)); time.sleep(attempt*1.5)
              return None, errs

          out={'observed_at':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),'channel':'walnut.world','source':SOURCE,'home_fetch':{},'discovery':{},'submission':{},'readback':{}}
          r,errs=req('GET',HOME)
          out['home_fetch']={'status': getattr(r,'status_code',None),'errors':errs}
          html=r.text if r is not None else ''

          forms=re.findall(r'(?is)<form\b.*?</form>',html)
          chosen=None
          for f in forms:
              if 'github.com/owner/repo' in f or 'Public source URL' in f or 'Index it' in f:
                  chosen=f; break
          if chosen:
              tag=re.search(r'(?is)^<form\b([^>]*)>',chosen)
              attrs=tag.group(1) if tag else ''
              ma=re.search(r'(?i)\baction=["\']([^"\']*)',attrs)
              mm=re.search(r'(?i)\bmethod=["\']([^"\']*)',attrs)
              action=urljoin(HOME, unescape(ma.group(1) if ma else ''))
              method=(mm.group(1) if mm else 'post').upper()
              inputs=[]; data={}; target_name=None
              for it in re.finditer(r'(?is)<input\b([^>]*)>',chosen):
                  a=it.group(1)
                  nm=re.search(r'(?i)\bname=["\']([^"\']+)',a)
                  val=re.search(r'(?i)\bvalue=["\']([^"\']*)',a)
                  ph=re.search(r'(?i)\bplaceholder=["\']([^"\']*)',a)
                  typ=re.search(r'(?i)\btype=["\']([^"\']*)',a)
                  row={'name':nm.group(1) if nm else None,'value':unescape(val.group(1)) if val else '', 'placeholder':unescape(ph.group(1)) if ph else '', 'type':typ.group(1) if typ else ''}
                  inputs.append(row)
                  if row['name']:
                      data[row['name']]=row['value']
                      if 'github.com/owner/repo' in row['placeholder'] or row['name'].lower() in ('url','source','sourceurl','source_url','publicsource','public_source'):
                          target_name=row['name']
              out['discovery']['form']={'action':action,'method':method,'inputs':inputs}
              if target_name:
                  data[target_name]=SOURCE
                  sr,serrs=req(method,action,data=data,headers={'Referer':HOME,'Origin':'https://walnut.world'})
                  out['submission']={'mechanism':'html_form','target':action,'field':target_name,'status':getattr(sr,'status_code',None),'location':sr.headers.get('location') if sr is not None else None,'errors':serrs,'response_excerpt':sr.text[:1200] if sr is not None else ''}

          if not out['submission']:
              scripts=[]; api_paths=[]
              for m in re.finditer(r'(?is)<script[^>]+src=["\']([^"\']+)',html):
                  u=urljoin(HOME,unescape(m.group(1))); scripts.append(u)
              for u in scripts[:20]:
                  jr,jerrs=req('GET',u)
                  if jr is None: continue
                  text=jr.text
                  for p in re.findall(r'["\'](/(?:api|actions?)/[A-Za-z0-9_?&=./:-]+)["\']',text):
                      if p not in api_paths: api_paths.append(p)
              out['discovery']['scripts']=scripts[:20]
              out['discovery']['api_paths']=api_paths[:80]
              ranked=[p for p in api_paths if re.search(r'(?i)(submit|index|ingest|source|publish)',p)]
              if ranked:
                  target=urljoin(HOME,ranked[0])
                  bodies=[{'url':SOURCE},{'source':SOURCE},{'sourceUrl':SOURCE}]
                  attempts=[]
                  for body in bodies:
                      sr,serrs=req('POST',target,json=body,headers={'Referer':HOME,'Origin':'https://walnut.world'})
                      attempts.append({'body_keys':list(body),'status':getattr(sr,'status_code',None),'location':sr.headers.get('location') if sr is not None else None,'errors':serrs,'response_excerpt':sr.text[:800] if sr is not None else ''})
                      if sr is not None and sr.status_code in (200,201,202,204,302,303,307,308):
                          break
                  out['submission']={'mechanism':'discovered_api','target':target,'attempts':attempts}

          # Non-mutating readbacks. Search query and homepage are used only as evidence; absence is not treated as terminal.
          for url in [HOME+'?q=delta-witness', HOME+'?q=15998194110%2Fdelta-witness']:
              rr,rerrs=req('GET',url)
              text=rr.text if rr is not None else ''
              out['readback'][url]={'status':getattr(rr,'status_code',None),'contains_delta':('delta-witness' in text.lower()),'contains_repo':('15998194110/delta-witness' in text.lower()),'errors':rerrs}
          print(json.dumps(out,indent=2))
          PY
          cat /tmp/walnut.json
      - name: Verify current production pricing authority
        run: |
          set -euo pipefail
          BASE=https://delta-witness-api.ruphussten.workers.dev
          python3 - <<'PY' > /tmp/pricing.json
          import requests,json,time
          base='https://delta-witness-api.ruphussten.workers.dev'
          out={'observed_at':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),'quotes':{},'openapi':{}}
          for p in ['capture','preflight','guarded-action-pilot']:
              errs=[]; r=None
              for a in range(1,4):
                  try:
                      r=requests.get(base+'/v1/quote',params={'product':p},timeout=20)
                      if r.status_code in (429,500,502,503,504): errs.append(f'{r.status_code}:{r.text[:100]}'); time.sleep(a); continue
                      break
                  except Exception as e: errs.append(repr(e)); time.sleep(a)
              out['quotes'][p]={'status':getattr(r,'status_code',None),'body':(r.json() if r is not None and 'json' in r.headers.get('content-type','') else (r.text[:1200] if r is not None else None)),'errors':errs}
          try:
              r=requests.get(base+'/openapi.json',timeout=20); j=r.json()
              out['openapi']={'status':r.status_code,'capture':j['paths']['/v1/capture']['post'].get('x-payment-info'), 'preflight':j['paths']['/v1/preflight']['post'].get('x-payment-info'), 'pilot':j['paths']['/v1/guarded-action-pilot']['post'].get('x-payment-info')}
          except Exception as e: out['openapi']={'error':repr(e)}
          print(json.dumps(out,indent=2))
          PY
          cat /tmp/pricing.json
      - name: Audit DELTA paid funnel telemetry
        run: |
          set -euo pipefail
          node scripts/query-revenue-candidates.mjs | tee /tmp/d1.txt
      - name: Reconcile canonical Base USDC Treasury with RPC fallbacks
        run: |
          set -euo pipefail
          node <<'NODE' | tee /tmp/treasury.json
          const TREASURY='0x1990e21bc219696ff7fbc26527dbaed335ac6367';
          const USDC='0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913';
          const START=51060235n;
          const TRANSFER='0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef';
          const TO_TOPIC='0x'+'0'.repeat(24)+TREASURY.slice(2).toLowerCase();
          const RPCS=['https://mainnet.base.org','https://base-rpc.publicnode.com','https://1rpc.io/base'];
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function rpc(method,params){const errors=[];for(const url of RPCS){for(let a=1;a<=3;a++){try{const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),12000);const res=await fetch(url,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method,params}),signal:ctl.signal});clearTimeout(t);const text=await res.text();if(!res.ok)throw new Error(`http_${res.status}:${text.slice(0,120)}`);const body=JSON.parse(text);if(body.error)throw new Error(JSON.stringify(body.error));if(body.result===undefined)throw new Error('missing_result');return body.result}catch(e){errors.push(`${url}#${a}:${e?.message||e}`);if(a<3)await sleep(750*a)}}}throw new Error(`${method} failed: ${errors.join(' | ')}`)}
          const hex=n=>'0x'+n.toString(16);
          const latest=BigInt(await rpc('eth_blockNumber',[]));
          const all=[];
          if(latest>=START){for(let from=START;from<=latest;from+=1500n){const to=(from+1499n>latest?latest:from+1499n);const logs=await rpc('eth_getLogs',[{address:USDC,fromBlock:hex(from),toBlock:hex(to),topics:[TRANSFER,null,TO_TOPIC]}]);all.push(...logs)}}
          const incoming=all.map(log=>({block_number:Number(BigInt(log.blockNumber)),tx_hash:log.transactionHash,from:'0x'+log.topics[1].slice(-40),to:TREASURY,raw_amount:BigInt(log.data).toString(),usdc:Number(BigInt(log.data))/1e6}));
          console.log(JSON.stringify({ok:true,canonical_asset:USDC,treasury:TREASURY,from_block:Number(START),latest_block:Number(latest),incoming_count:incoming.length,incoming},null,2));
          NODE
      - name: Persist evidence
        run: |
          set -euo pipefail
          mkdir -p docs/channel-status
          node <<'NODE'
          const fs=require('fs');
          const readJson=p=>{try{return JSON.parse(fs.readFileSync(p,'utf8'))}catch(e){return {parse_error:String(e),raw:fs.existsSync(p)?fs.readFileSync(p,'utf8').slice(0,20000):null}}};
          const report={
            observed_at:new Date().toISOString(),
            walnut:readJson('/tmp/walnut.json'),
            pricing:readJson('/tmp/pricing.json'),
            treasury:readJson('/tmp/treasury.json'),
            d1_excerpt:fs.readFileSync('/tmp/d1.txt','utf8').slice(0,50000),
            metrics:{channel:'walnut.world',listing_status:'submitted_or_discovered_from_evidence',discovery_status:'pending_readback',buyer_count:0,settlement_count:0,verified_neighbor_demand:null,external_requests:0,intents_402:0,paid_settlements:0,treasury_received_new:0,revenue_usdc_new:0,variable_cost_usdc_new:null,contribution_margin_usdc_new:null,evidence_quality:'B'}
          };
          if(report.treasury?.incoming_count>0){report.metrics.treasury_received_new=report.treasury.incoming.reduce((a,x)=>a+(x.usdc||0),0)}
          fs.writeFileSync('docs/channel-status/walnut-world-automation-turn10-2026-09-09.json',JSON.stringify(report,null,2)+'\n');
          NODE
          git config user.name 'DELTA Growth Operator'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/channel-status/walnut-world-automation-turn10-2026-09-09.json
          git commit -m 'growth: submit DELTA to Walnut World and reconcile revenue' || true
          git push
