name: TEMP DELTA revenue reconcile 2026-09-17 1300 JST
on:
  push:
    branches: [master]
    paths: [.github/workflows/tmp-revenue-reconcile-20260917-1300.yml]
permissions:
  contents: read
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DELTA_INDEXNOW_ADMIN_SECRET: ${{ secrets.DELTA_INDEXNOW_ADMIN_SECRET }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DELTA_PARTNER_SECRET: ${{ secrets.DELTA_PARTNER_SECRET }}
      DELTA_TREASURY_LOOKBACK_BLOCKS: '60000'
      DELTA_TREASURY_CHUNK_BLOCKS: '1900'
    steps:
      - uses: actions/checkout@v6
        with: {persist-credentials: false}
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - name: Verify owner pricing and live 402 invariants
        run: node scripts/check-owner-pricing.mjs && node scripts/verify-owner-pricing-live.mjs | tee /tmp/delta-pricing-live.json
      - name: Audit paid funnel
        run: node scripts/query-revenue-candidates.mjs | tee /tmp/delta-revenue-candidates.json
      - name: Scan AgentPact funded demand
        continue-on-error: true
        run: node scripts/scan-agentpact-demand.mjs | tee /tmp/delta-agentpact-demand.json
      - name: Reconcile Base Treasury
        run: node scripts/reconcile-treasury.mjs | tee /tmp/delta-treasury.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: delta-reconcile-1300-${{ github.run_id }}
          path: |
            /tmp/delta-pricing-live.json
            /tmp/delta-revenue-candidates.json
            /tmp/delta-agentpact-demand.json
            /tmp/delta-treasury.json
          if-no-files-found: warn
          retention-days: 7
