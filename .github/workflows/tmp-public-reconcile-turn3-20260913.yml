name: DELTA public reconcile turn3
on:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/tmp-public-reconcile-turn3-20260913.yml"
permissions:
  contents: read
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Pricing policy gate
        run: node scripts/check-owner-pricing.mjs
      - name: Live price gate
        run: node scripts/verify-owner-pricing-live.mjs
      - name: AgentPact public scan
        if: always()
        continue-on-error: true
        run: node scripts/scan-agentpact-demand.mjs
      - name: Base Treasury reconciliation
        if: always()
        run: node scripts/reconcile-treasury.mjs
      - name: Public channel probes
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          probe(){ curl -fsS --connect-timeout 10 --max-time 25 --retry 3 --retry-delay 2 --retry-all-errors "$1" >/tmp/probe.out; c=$?; echo "$2 exit=$c"; if [ "$c" = 0 ]; then head -c 600 /tmp/probe.out; echo; fi; }
          probe 'https://api.circle.com/v2/x402/discovery/resources?query=delta-witness-api.ruphussten.workers.dev' circle
          probe 'https://x402-list.com/api/v1/services?q=delta-witness-api.ruphussten.workers.dev&per_page=10' x402_list
          probe 'https://clawslist.com' clawslist
