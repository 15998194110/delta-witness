name: DELTA automation growth probe 2026-09-09
on:
  push:
    paths:
      - '.github/workflows/automation-growth-probe-2026-09-09.yml'

jobs:
  allmcps-submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Submit DELTA Witness to AllMCPs public directory
        shell: bash
        run: |
          set -euo pipefail
          API='https://allmcps.com/api/v1'
          NAME='DELTA Witness'
          REPO='https://github.com/15998194110/delta-witness'
          CONTACT_EMAIL=$(git log -1 --format='%ae')
          echo '--- duplicate search ---'
          curl --retry 3 --retry-delay 2 --retry-all-errors --connect-timeout 10 --max-time 30 -fsS "$API/search?q=delta-witness&limit=20" -o /tmp/search-before.json || echo '{"degraded":true}' > /tmp/search-before.json
          jq -c '.' /tmp/search-before.json | head -c 6000; echo
          PAYLOAD=$(jq -cn \
            --arg name "$NAME" \
            --arg url "$REPO" \
            --arg description 'Evidence-backed web verification for autonomous agents: timestamped public-source capture, deterministic preflight checks, and x402-paid Base USDC execution via MCP.' \
            --arg category 'Search & Data Extraction' \
            --arg email "$CONTACT_EMAIL" \
            --arg support 'https://github.com/15998194110/delta-witness/issues' \
            '{name:$name,url:$url,description:$description,category:$category,email:$email,tags:["x402","web-verification","proof","autonomous-agents","preflight"],license:"Apache-2.0",authType:"none",pricingModel:"paid",maintenanceStatus:"active",compatibleClients:["Claude Desktop","Claude Code","Cursor","Windsurf","Cline","VS Code"],supportUrl:$support}')
          submit() {
            local payload="$1"
            local code='000'
            for delay in 0 2 5 10; do
              [ "$delay" = 0 ] || sleep "$delay"
              code=$(curl -sS --connect-timeout 10 --max-time 35 -o /tmp/submit.body -D /tmp/submit.headers -w '%{http_code}' -X POST "$API/submit" -H 'content-type: application/json' --data "$payload" || echo '000')
              echo "AllMCPs HTTP=$code"
              case "$code" in
                200|201|202|409) break ;;
                429|500|502|503|504|000) continue ;;
                *) break ;;
              esac
            done
            printf '%s' "$code"
          }
          CODE=$(submit "$PAYLOAD" | tail -n1)
          if [ "$CODE" = '400' ] && grep -qi 'categor' /tmp/submit.body; then
            echo 'Category label rejected; retrying official slug.'
            PAYLOAD=$(jq -c '.category="search-and-data-extraction"' <<<"$PAYLOAD")
            CODE=$(submit "$PAYLOAD" | tail -n1)
          fi
          echo '--- submission response ---'
          jq 'del(.email,.contact_email,.contactEmail)' /tmp/submit.body 2>/dev/null || head -c 8000 /tmp/submit.body
          echo
          case "$CODE" in
            200|201|202) echo 'ALLMCPS_SUBMISSION=accepted' ;;
            409) echo 'ALLMCPS_SUBMISSION=already_exists' ;;
            *) echo "ALLMCPS_SUBMISSION=not_accepted_http_${CODE}" ; exit 1 ;;
          esac
          echo '--- public search after submission ---'
          curl --retry 3 --retry-delay 2 --retry-all-errors --connect-timeout 10 --max-time 30 -fsS "$API/search?q=delta-witness&limit=20" -o /tmp/search-after.json || true
          jq -c '.' /tmp/search-after.json 2>/dev/null | head -c 8000 || true
          echo
