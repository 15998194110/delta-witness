name: TMP DELTA Tollbooth Manifest Fallback

on:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/tmp-tollbooth-reconcile.yml"

permissions:
  contents: read

jobs:
  manifest-fallback:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
      - name: Submit agent402 manifests through alternate official endpoint
        run: |
          cat > /tmp/manifests.mjs <<'NODE'
          const BASE='https://www.trytollbooth.com';
          const wallet='0x1990e21bc219696ff7fbc26527dbaed335ac6367';
          const asset='0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913';
          const manifests=[
            {schema:'agent402/manifest@1',name:'DELTA Witness Capture',description:'Tamper-evident public page-state capture with public proof, paid per call via x402.',category:'data',endpoint:'https://delta-witness-api.ruphussten.workers.dev/v1/capture',x402:{network:'base',scheme:'exact',asset,payTo:wallet,maxAmountRequired:'30000'}},
            {schema:'agent402/manifest@1',name:'DELTA Witness Preflight',description:'Deterministic page observation and expectation comparison for autonomous actions; not a security audit.',category:'data',endpoint:'https://delta-witness-api.ruphussten.workers.dev/v1/preflight',x402:{network:'base',scheme:'exact',asset,payTo:wallet,maxAmountRequired:'1000000'}},
            {schema:'agent402/manifest@1',name:'DELTA Witness Guarded Action Pilot',description:'Guarded higher-value DELTA Witness action pilot with x402 settlement and verifiable evidence.',category:'data',endpoint:'https://delta-witness-api.ruphussten.workers.dev/v1/guarded-action-pilot',x402:{network:'base',scheme:'exact',asset,payTo:wallet,maxAmountRequired:'10000000'}}
          ];
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function post(body){try{const r=await fetch(`${BASE}/api/manifests`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body),signal:AbortSignal.timeout(45000)});const t=await r.text();let b;try{b=JSON.parse(t)}catch{b={raw:t.slice(0,2000)}};return{status:r.status,ok:r.ok,body:b};}catch(e){return{status:0,ok:false,error:e.message};}}
          const attempts=[];
          let shapes=[{manifests},manifests,{manifest:manifests[0]}];
          let success=null;
          for(let i=0;i<shapes.length;i++){
            let r=await post(shapes[i]);attempts.push({shape:i,status:r.status,body:r.body,error:r.error});
            if(r.ok){success={shape:i,response:r};break;}
            if((r.status===429||r.status>=500||r.status===0)){await sleep(1500*2**Math.min(i,2));r=await post(shapes[i]);attempts.push({shape:i,status:r.status,body:r.body,error:r.error,retry:true});if(r.ok){success={shape:i,response:r};break;}}
            if(!(r.status===400||r.status===422||r.status===429||r.status>=500||r.status===0)) break;
          }
          console.log(JSON.stringify({channel:'Tollbooth',endpoint:'/api/manifests',success,attempts,submitted_prices:{capture:0.03,preflight:1,pilot:10},treasury:wallet}));
          NODE
          node /tmp/manifests.mjs
      - name: Reconcile Treasury after fallback attempts
        if: always()
        run: |
          cat > /tmp/scan.mjs <<'NODE'
          const R=['https://mainnet.base.org','https://base-rpc.publicnode.com','https://1rpc.io/base'];const U='0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913';const T='0x1990e21bc219696ff7fbc26527dbaed335ac6367';const E='0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef';const TT='0x'+T.slice(2).padStart(64,'0');const sleep=ms=>new Promise(r=>setTimeout(r,ms));async function rpc(m,p){let es=[];for(const u of R){for(let a=1;a<=3;a++){try{const r=await fetch(u,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method:m,params:p}),signal:AbortSignal.timeout(15000)});const t=await r.text();if(r.status===429||r.status>=500)throw new Error(`HTTP ${r.status}`);if(!r.ok)throw new Error(`HTTP ${r.status}`);const j=JSON.parse(t);if(j.error)throw new Error(JSON.stringify(j.error));return j.result}catch(e){es.push(`${u}#${a}:${e.message}`);if(a<3)await sleep(700*2**(a-1));}}}throw new Error(es.join('|'));}const from=51029319;const head=Number(BigInt(await rpc('eth_blockNumber',[])));let raw=[];if(head>=from){for(let a=from;a<=head;a+=1000){const b=Math.min(head,a+999);raw.push(...await rpc('eth_getLogs',[{address:U,fromBlock:'0x'+a.toString(16),toBlock:'0x'+b.toString(16),topics:[E,null,TT]}]));}}const incoming=raw.map(l=>({block_number:Number(BigInt(l.blockNumber)),tx_hash:l.transactionHash,from:'0x'+l.topics[1].slice(-40),raw_amount:BigInt(l.data).toString(),amount_usdc:Number(BigInt(l.data))/1e6,classification:'unclassified_new_receipt__exclude_from_customer_revenue_until_source_proven'}));console.log(JSON.stringify({ok:true,from_block:from,head_block:head,incoming_count:incoming.length,incoming}));
          NODE
          node /tmp/scan.mjs
      - name: Reconcile paid-funnel telemetry
        if: always()
        run: node scripts/query-revenue-candidates.mjs
