name: TMP DELTA Tollbooth Fallback

on:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/tmp-tollbooth-reconcile.yml"

permissions:
  contents: read

jobs:
  fallback:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
      - name: Retry direct Tollbooth listing with official manifest-ingest fallback
        run: |
          cat > /tmp/tollbooth-fallback.mjs <<'NODE'
          const BASE='https://www.trytollbooth.com';
          const wallet='0x1990e21bc219696ff7fbc26527dbaed335ac6367';
          const asset='0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913';
          const specs=[
            {name:'DELTA Witness Capture',endpoint:'https://delta-witness-api.ruphussten.workers.dev/v1/capture',category:'developer-tools',priceUsdc:0.03,wallet,chain:'base',description:'Tamper-evident public page-state capture with public proof, paid per call via x402.',raw:'30000'},
            {name:'DELTA Witness Preflight',endpoint:'https://delta-witness-api.ruphussten.workers.dev/v1/preflight',category:'developer-tools',priceUsdc:1,wallet,chain:'base',description:'Deterministic page observation and expectation comparison for autonomous actions; not a security audit.',raw:'1000000'},
            {name:'DELTA Witness Guarded Action Pilot',endpoint:'https://delta-witness-api.ruphussten.workers.dev/v1/guarded-action-pilot',category:'developer-tools',priceUsdc:10,wallet,chain:'base',description:'Guarded higher-value DELTA Witness action pilot with x402 settlement and verifiable evidence.',raw:'10000000'}
          ];
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          function servicesOf(x){if(Array.isArray(x))return x;for(const k of ['services','data','items','results'])if(Array.isArray(x?.[k]))return x[k];return[];}
          async function getAll(){
            const attempts=[];
            for(let a=1;a<=3;a++){
              try{const r=await fetch(`${BASE}/api/services`,{signal:AbortSignal.timeout(15000)});const t=await r.text();attempts.push({a,status:r.status});if(r.ok)return{ok:true,services:servicesOf(JSON.parse(t)),attempts};if(!(r.status===429||r.status>=500))return{ok:false,attempts,terminal:`HTTP ${r.status}`};}
              catch(e){attempts.push({a,error:e.message});}
              if(a<3)await sleep(800*2**(a-1));
            }
            return{ok:false,services:[],attempts};
          }
          const exact=(list,endpoint)=>list.find(s=>String(s.endpoint||s.url||'').replace(/\/$/,'')===endpoint.replace(/\/$/,''));
          async function post(path,body){
            try{const r=await fetch(`${BASE}${path}`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body),signal:AbortSignal.timeout(30000)});const t=await r.text();let parsed;try{parsed=JSON.parse(t)}catch{parsed={raw:t.slice(0,1200)}};return{status:r.status,ok:r.ok,body:parsed};}
            catch(e){return{status:0,ok:false,error:e.message};}
          }
          function manifest(s){return{schema:'agent402/manifest@1',name:s.name,description:s.description,category:s.category,endpoint:s.endpoint,x402:{network:'base',scheme:'exact',asset,payTo:wallet,maxAmountRequired:s.raw}};}
          const initial=await getAll();
          const results=[];
          for(const s of specs){
            const existing=initial.ok?exact(initial.services,s.endpoint):null;
            if(existing){results.push({endpoint:s.endpoint,action:'already_listed',service:existing});continue;}
            const first=await post('/api/services',{name:s.name,endpoint:s.endpoint,category:s.category,priceUsdc:s.priceUsdc,wallet:s.wallet,chain:s.chain,description:s.description});
            if(first.ok){await sleep(600);const rb=await getAll();results.push({endpoint:s.endpoint,action:'submitted_services',response:first,readback:rb.ok?exact(rb.services,s.endpoint)||null:null});continue;}
            if(first.status===409){results.push({endpoint:s.endpoint,action:'duplicate_conflict_existing',response:first});continue;}
            if(!(first.status===0||first.status===429||first.status>=500)){
              results.push({endpoint:s.endpoint,action:'rejected_nonretryable',response:first});continue;
            }
            await sleep(1200);
            const recovered=await getAll();
            const appeared=recovered.ok?exact(recovered.services,s.endpoint):null;
            if(appeared){results.push({endpoint:s.endpoint,action:'submitted_then_recovered_by_readback',service:appeared,first});continue;}
            const m=manifest(s);
            let alt=await post('/api/manifests',{manifests:[m]});
            if(alt.status===400||alt.status===422) alt=await post('/api/manifests',m);
            if(alt.ok){await sleep(600);const rb=await getAll();results.push({endpoint:s.endpoint,action:'submitted_manifest_fallback',response:alt,readback:rb.ok?exact(rb.services,s.endpoint)||null:null});continue;}
            if(alt.status===0||alt.status===429||alt.status>=500){await sleep(1800);const rb=await getAll();const found=rb.ok?exact(rb.services,s.endpoint):null;if(found){results.push({endpoint:s.endpoint,action:'manifest_submit_recovered_by_readback',service:found,first,alt});continue;}}
            results.push({endpoint:s.endpoint,action:'channel_degraded_after_services_and_manifest_fallback',first,alt});
          }
          const final=await getAll();
          console.log(JSON.stringify({channel:'Tollbooth',initial_list:initial,results,final_readback:final.ok?specs.map(s=>({endpoint:s.endpoint,service:exact(final.services,s.endpoint)||null})):null,final_list_status:final.ok?'ok':'degraded'}));
          NODE
          node /tmp/tollbooth-fallback.mjs

      - name: Independent post-fallback Treasury reconciliation
        if: always()
        run: |
          cat > /tmp/scan.mjs <<'NODE'
          const RPCS=['https://mainnet.base.org','https://base-rpc.publicnode.com','https://1rpc.io/base'];
          const USDC='0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913';
          const T='0x1990e21bc219696ff7fbc26527dbaed335ac6367';
          const TOP0='0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef';
          const TOP2='0x'+T.slice(2).padStart(64,'0');
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function rpc(method,params){let errs=[];for(const u of RPCS){for(let a=1;a<=3;a++){try{const r=await fetch(u,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method,params}),signal:AbortSignal.timeout(15000)});const t=await r.text();if(r.status===429||r.status>=500)throw new Error(`HTTP ${r.status}`);if(!r.ok)throw new Error(`HTTP ${r.status}`);const j=JSON.parse(t);if(j.error)throw new Error(JSON.stringify(j.error));return j.result}catch(e){errs.push(`${u}#${a}:${e.message}`);if(a<3)await sleep(700*2**(a-1));}}}throw new Error(errs.join('|'));}
          const from=51029212;const head=Number(BigInt(await rpc('eth_blockNumber',[])));let raw=[];
          if(head>=from){for(let a=from;a<=head;a+=1000){let b=Math.min(head,a+999);raw.push(...await rpc('eth_getLogs',[{address:USDC,fromBlock:'0x'+a.toString(16),toBlock:'0x'+b.toString(16),topics:[TOP0,null,TOP2]}]));}}
          const incoming=raw.map(l=>({block_number:Number(BigInt(l.blockNumber)),tx_hash:l.transactionHash,from:'0x'+l.topics[1].slice(-40),raw_amount:BigInt(l.data).toString(),amount_usdc:Number(BigInt(l.data))/1e6,customer_revenue:false,classification:'unclassified_new_receipt__exclude_until_payer_proof_source_match'}));
          console.log(JSON.stringify({ok:true,from_block:from,head_block:head,incoming_count:incoming.length,incoming}));
          NODE
          node /tmp/scan.mjs
      - name: Recheck DELTA paid-funnel telemetry
        if: always()
        run: node scripts/query-revenue-candidates.mjs
