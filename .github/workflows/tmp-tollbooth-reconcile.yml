name: TMP DELTA Tollbooth Category Recovery

on:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/tmp-tollbooth-reconcile.yml"

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
      - name: Discover accepted semantically valid category and submit directly
        run: |
          cat > /tmp/recover.mjs <<'NODE'
          const BASE='https://www.trytollbooth.com';
          const wallet='0x1990e21bc219696ff7fbc26527dbaed335ac6367';
          const specs=[
            {name:'DELTA Witness Capture',endpoint:'https://delta-witness-api.ruphussten.workers.dev/v1/capture',priceUsdc:0.03,description:'Tamper-evident public page-state capture with public proof, paid per call via x402.'},
            {name:'DELTA Witness Preflight',endpoint:'https://delta-witness-api.ruphussten.workers.dev/v1/preflight',priceUsdc:1,description:'Deterministic page observation and expectation comparison for autonomous actions; not a security audit.'},
            {name:'DELTA Witness Guarded Action Pilot',endpoint:'https://delta-witness-api.ruphussten.workers.dev/v1/guarded-action-pilot',priceUsdc:10,description:'Guarded higher-value DELTA Witness action pilot with x402 settlement and verifiable evidence.'}
          ];
          const categories=['verification','monitoring','web-data','data','utility','utilities','tools','developer-tool','developer-tools','other'];
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function submit(spec,category){
            try{const r=await fetch(`${BASE}/api/services`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name:spec.name,endpoint:spec.endpoint,category,priceUsdc:spec.priceUsdc,wallet,chain:'base',description:spec.description}),signal:AbortSignal.timeout(30000)});const t=await r.text();let body;try{body=JSON.parse(t)}catch{body={raw:t.slice(0,1000)}};return{status:r.status,ok:r.ok,body};}catch(e){return{status:0,ok:false,error:e.message};}
          }
          let chosen=null;const probe=[];const results=[];
          const first=specs[0];
          for(const c of categories){
            const r=await submit(first,c);probe.push({category:c,status:r.status,body:r.body});
            if(r.ok){chosen=c;results.push({endpoint:first.endpoint,action:'submitted',category:c,response:r});break;}
            if(r.status===409){chosen=c;results.push({endpoint:first.endpoint,action:'already_exists',category:c,response:r});break;}
            const categoryUnknown=r.status===422 && String(r.body?.errors?.category||'').toLowerCase().includes('unknown');
            if(categoryUnknown) continue;
            if(r.status===429||r.status>=500||r.status===0){await sleep(1200);const retry=await submit(first,c);probe.push({category:c,status:retry.status,body:retry.body,retry:true});if(retry.ok){chosen=c;results.push({endpoint:first.endpoint,action:'submitted_after_retry',category:c,response:retry});break;}if(retry.status===409){chosen=c;results.push({endpoint:first.endpoint,action:'already_exists_after_retry',category:c,response:retry});break;}if(retry.status===422&&String(retry.body?.errors?.category||'').toLowerCase().includes('unknown'))continue;}
            break;
          }
          if(chosen){
            for(const spec of specs.slice(1)){
              let r=await submit(spec,chosen);
              if(r.ok){results.push({endpoint:spec.endpoint,action:'submitted',category:chosen,response:r});continue;}
              if(r.status===409){results.push({endpoint:spec.endpoint,action:'already_exists',category:chosen,response:r});continue;}
              if(r.status===429||r.status>=500||r.status===0){await sleep(1500);r=await submit(spec,chosen);if(r.ok){results.push({endpoint:spec.endpoint,action:'submitted_after_retry',category:chosen,response:r});continue;}if(r.status===409){results.push({endpoint:spec.endpoint,action:'already_exists_after_retry',category:chosen,response:r});continue;}}
              results.push({endpoint:spec.endpoint,action:'submission_not_completed',category:chosen,response:r});
            }
          }
          console.log(JSON.stringify({channel:'Tollbooth',chosen_category:chosen,category_probe:probe,results,completed_count:results.filter(x=>x.action.startsWith('submitted')||x.action.startsWith('already_exists')).length}));
          NODE
          node /tmp/recover.mjs
      - name: Strict Treasury reconciliation after channel actions
        if: always()
        run: |
          cat > /tmp/scan.mjs <<'NODE'
          const RPCS=['https://mainnet.base.org','https://base-rpc.publicnode.com','https://1rpc.io/base'];const U='0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913';const T='0x1990e21bc219696ff7fbc26527dbaed335ac6367';const E='0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef';const TT='0x'+T.slice(2).padStart(64,'0');const sleep=ms=>new Promise(r=>setTimeout(r,ms));async function rpc(m,p){let es=[];for(const u of RPCS){for(let a=1;a<=3;a++){try{const r=await fetch(u,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method:m,params:p}),signal:AbortSignal.timeout(15000)});const t=await r.text();if(r.status===429||r.status>=500)throw new Error(`HTTP ${r.status}`);if(!r.ok)throw new Error(`HTTP ${r.status}`);const j=JSON.parse(t);if(j.error)throw new Error(JSON.stringify(j.error));return j.result}catch(e){es.push(`${u}#${a}:${e.message}`);if(a<3)await sleep(700*2**(a-1));}}}throw new Error(es.join('|'));}
          const from=51029272;const head=Number(BigInt(await rpc('eth_blockNumber',[])));let raw=[];if(head>=from){for(let a=from;a<=head;a+=1000){const b=Math.min(head,a+999);raw.push(...await rpc('eth_getLogs',[{address:U,fromBlock:'0x'+a.toString(16),toBlock:'0x'+b.toString(16),topics:[E,null,TT]}]));}}const incoming=raw.map(l=>({block_number:Number(BigInt(l.blockNumber)),tx_hash:l.transactionHash,from:'0x'+l.topics[1].slice(-40),raw_amount:BigInt(l.data).toString(),amount_usdc:Number(BigInt(l.data))/1e6,classification:'unclassified_new_receipt__exclude_from_customer_revenue_until_source_proven'}));console.log(JSON.stringify({ok:true,from_block:from,head_block:head,incoming_count:incoming.length,incoming}));
          NODE
          node /tmp/scan.mjs
      - name: DELTA telemetry reconciliation
        if: always()
        run: node scripts/query-revenue-candidates.mjs
