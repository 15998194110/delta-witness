name: DELTA MCP Metadata Repair Turn2
on:
  push:
    branches: [master]
    paths: ['.github/workflows/autonomous-growth-turn2-1640.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - name: Repair and verify MCP metadata
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          git checkout master
          git reset --hard origin/master
          python3 - <<'PY'
          from pathlib import Path
          p=Path('packages/mcp-server/src/index.ts')
          s=p.read_text()
          old='const server = new McpServer({ name: "DELTA Witness", version: "0.6.1" });'
          new='const server = new McpServer({ name: "DELTA Witness", version: "0.7.0" });'
          if old not in s:
              if new in s: raise SystemExit(0)
              raise SystemExit('expected MCP version marker not found')
          p.write_text(s.replace(old,new,1))
          PY
          cd packages/mcp-server
          npm ci
          npm run check
          npm test
          cd ../..
          git diff --check
          git config user.name 'DELTA Operator'
          git config user.email 'actions@users.noreply.github.com'
          git add packages/mcp-server/src/index.ts
          if ! git diff --cached --quiet; then
            git commit -m 'fix: advertise DELTA MCP v0.7.0'
            git push origin HEAD:master
          fi
