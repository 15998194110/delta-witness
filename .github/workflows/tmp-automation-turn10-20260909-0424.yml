name: TMP DELTA Turn10 AgentNDX + Reconcile 20260909 0424
on:
  push:
    paths:
      - '.github/workflows/tmp-automation-turn10-20260909-0424.yml'
permissions:
  contents: write
jobs:
  execute:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recover AgentNDX free submission
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/delta-turn10
          index='https://agentndx.ai/api/servers.json'
          curl -fsS --retry 4 --retry-all-errors --retry-delay 2 --max-time 30 "$index" -o /tmp/delta-turn10/agentndx-index.json
          pre_rc=$?
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('/tmp/delta-turn10/agentndx-index.json')
          found=[]
          if p.exists():
              try:
                  d=json.loads(p.read_text())
                  for x in d.get('servers',[]):
                      if str(x.get('name','')).strip().lower()=='delta witness': found.append(x)
              except Exception: pass
          pathlib.Path('/tmp/delta-turn10/agentndx-pre.json').write_text(json.dumps({'exact_matches':found},separators=(',',':')))
          print('AGENTNDX_PRE_MATCHES='+str(len(found)))
          PY
          exact=$(python - <<'PY'
          import json
          print(len(json.load(open('/tmp/delta-turn10/agentndx-pre.json'))['exact_matches']))
          PY
          )
          if [ "$exact" -gt 0 ]; then
            printf '%s' '{"status":"already_live","submitted":false}' > /tmp/delta-turn10/agentndx-submit.json
          else
            body=/tmp/delta-turn10/agentndx-submit-body.txt
            headers=/tmp/delta-turn10/agentndx-submit-headers.txt
            code=$(curl --silent --show-error --retry 4 --retry-all-errors --retry-delay 2 --max-time 30 \
              --output "$body" --dump-header "$headers" --write-out '%{http_code}' \
              -X POST 'https://agentndx.ai/api/submit' \
              --data-urlencode 'name=DELTA Witness' \
              --data-urlencode 'github_url=https://github.com/15998194110/delta-witness' \
              --data-urlencode 'homepage_url=https://delta-witness-api.ruphussten.workers.dev/' \
              --data-urlencode 'protocols=MCP' \
              --data-urlencode 'protocols=x402' \
              --data-urlencode 'description=Deterministic public-page evidence capture and guarded-action preflight for web agents; MCP/OpenAPI discovery plus x402-paid Capture, Preflight, and Guarded Action Pilot on Base.' \
              --data-urlencode 'contact=ruphussten85@gmail.com')
            curl_rc=$?
            CODE="$code" CURL_RC="$curl_rc" python - <<'PY'
          import json,os,pathlib
          b=pathlib.Path('/tmp/delta-turn10/agentndx-submit-body.txt')
          h=pathlib.Path('/tmp/delta-turn10/agentndx-submit-headers.txt')
          out={'status':'submitted_review' if os.environ.get('CODE') in {'200','201','202','303'} and os.environ.get('CURL_RC')=='0' else 'degraded',
               'submitted':os.environ.get('CODE') in {'200','201','202','303'} and os.environ.get('CURL_RC')=='0',
               'http_code':os.environ.get('CODE'),'curl_rc':int(os.environ.get('CURL_RC','999')),
               'response_excerpt':b.read_text(errors='ignore')[:1200] if b.exists() else '',
               'headers_excerpt':h.read_text(errors='ignore')[:1200] if h.exists() else ''}
          pathlib.Path('/tmp/delta-turn10/agentndx-submit.json').write_text(json.dumps(out,separators=(',',':')))
          print('AGENTNDX_SUBMIT='+json.dumps(out,separators=(',',':')))
          PY
          fi
          exit 0
      - name: Read back PayAPI listing without re-registering
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/delta-turn10
          code=$(curl --silent --show-error --retry 4 --retry-all-errors --retry-delay 2 --max-time 30 \
            --output /tmp/delta-turn10/payapi-search.json --write-out '%{http_code}' \
            'https://payapi.market/agent/search?q=DELTA%20Witness&verified_only=false')
          rc=$?
          CODE="$code" RC="$rc" python - <<'PY'
          import json,os,pathlib
          p=pathlib.Path('/tmp/delta-turn10/payapi-search.json')
          matches=[]; parse_error=None
          if p.exists():
              try:
                  d=json.loads(p.read_text())
                  def walk(x):
                      if isinstance(x,dict):
                          yield x
                          for v in x.values(): yield from walk(v)
                      elif isinstance(x,list):
                          for v in x: yield from walk(v)
                  for o in walk(d):
                      if str(o.get('name','')).strip().lower()=='delta witness': matches.append(o)
              except Exception as e: parse_error=type(e).__name__
          out={'http_code':os.environ.get('CODE'),'curl_rc':int(os.environ.get('RC','999')),'exact_match_count':len(matches),'matches':matches[:5],'parse_error':parse_error}
          pathlib.Path('/tmp/delta-turn10/payapi-readback.json').write_text(json.dumps(out,separators=(',',':')))
          print('PAYAPI_READBACK='+json.dumps(out,separators=(',',':'))[:6000])
          PY
          exit 0
      - name: Verify production 402 pricing without payment
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/delta-turn10/probes
          for spec in 'capture|https://delta-witness-api.ruphussten.workers.dev/v1/capture' 'preflight|https://delta-witness-api.ruphussten.workers.dev/v1/preflight' 'pilot|https://delta-witness-api.ruphussten.workers.dev/v1/guarded-action-pilot'; do
            name=${spec%%|*}; url=${spec#*|}
            code=$(curl --silent --show-error --retry 4 --retry-all-errors --retry-delay 2 --max-time 30 \
              --output "/tmp/delta-turn10/probes/$name.body" --dump-header "/tmp/delta-turn10/probes/$name.headers" --write-out '%{http_code}' \
              -X POST "$url" -H 'content-type: application/json' --data '{}')
            rc=$?
            printf '%s\n' "$code" > "/tmp/delta-turn10/probes/$name.code"
            printf '%s\n' "$rc" > "/tmp/delta-turn10/probes/$name.rc"
            echo "PROBE_${name^^}_HTTP=$code RC=$rc"
          done
          exit 0
      - name: Reconcile canonical Base USDC Treasury with fallbacks
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/delta-turn10
          b='https://base.blockscout.com/api/v2/addresses/0x1990e21bc219696ff7fbc26527dbaed335ac6367/token-transfers?type=ERC-20'
          code=$(curl --silent --show-error --retry 4 --retry-all-errors --retry-delay 2 --max-time 40 \
            --output /tmp/delta-turn10/blockscout.json --write-out '%{http_code}' "$b")
          rc=$?
          CODE="$code" RC="$rc" python - <<'PY'
          import json,os,pathlib
          p=pathlib.Path('/tmp/delta-turn10/blockscout.json')
          treasury='0x1990e21bc219696ff7fbc26527dbaed335ac6367'; usdc='0x833589fcd6edb6e08f4c7c32d4f71b54bda02913'
          rows=[]; err=None
          if p.exists():
              try:
                  d=json.loads(p.read_text())
                  for x in d.get('items',[]) if isinstance(d,dict) else []:
                      token=str(((x.get('token') or {}).get('address') or '')).lower()
                      tv=x.get('to')
                      to=(str(tv.get('hash') or '') if isinstance(tv,dict) else str(tv or '')).lower()
                      if token!=usdc or to!=treasury: continue
                      raw=(x.get('total') or {}).get('value') if isinstance(x.get('total'),dict) else x.get('value')
                      dec=(x.get('token') or {}).get('decimals') or 6
                      try: amount=int(raw)/(10**int(dec))
                      except Exception: amount=None
                      rows.append({'tx':x.get('transaction_hash'),'block':x.get('block_number'),'timestamp':x.get('timestamp'),'from':((x.get('from') or {}).get('hash') if isinstance(x.get('from'),dict) else x.get('from')),'amount_usdc':amount})
              except Exception as e: err=type(e).__name__
          out={'source':'blockscout','http_code':os.environ.get('CODE'),'curl_rc':int(os.environ.get('RC','999')),'parse_error':err,'canonical_usdc_incoming':rows}
          pathlib.Path('/tmp/delta-turn10/treasury.json').write_text(json.dumps(out,separators=(',',':')))
          print('BLOCKSCOUT_RECON='+json.dumps(out,separators=(',',':'))[:10000])
          PY
          ok=$(python - <<'PY'
          import json
          d=json.load(open('/tmp/delta-turn10/treasury.json'))
          print('1' if d.get('http_code')=='200' and d.get('curl_rc')==0 and not d.get('parse_error') else '0')
          PY
          )
          if [ "$ok" != 1 ]; then
            python - <<'PY'
          import json,time,urllib.request,pathlib
          treasury='0x1990e21bc219696ff7fbc26527dbaed335ac6367'; usdc='0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913'
          topic0='0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef'; to_topic='0x'+'0'*24+treasury[2:].lower()
          endpoints=['https://mainnet.base.org','https://base-rpc.publicnode.com','https://base.llamarpc.com']
          def rpc(method,params):
              last=None
              for ep in endpoints:
                  for attempt in range(3):
                      try:
                          req=urllib.request.Request(ep,data=json.dumps({'jsonrpc':'2.0','id':1,'method':method,'params':params}).encode(),headers={'content-type':'application/json'})
                          with urllib.request.urlopen(req,timeout=20) as r:d=json.load(r)
                          if 'result' in d:return d['result'],ep
                          last=RuntimeError(str(d)[:500])
                      except Exception as e:last=e; time.sleep(1+attempt*2)
              raise last
          try:
              hh,ep=rpc('eth_blockNumber',[]); head=int(hh,16); start=51052684; rows=[]
              if head<start:start=head
              step=5000
              for a in range(start,head+1,step):
                  z=min(head,a+step-1)
                  logs,lep=rpc('eth_getLogs',[{'fromBlock':hex(a),'toBlock':hex(z),'address':usdc,'topics':[topic0,None,to_topic]}])
                  for x in logs: rows.append({'tx':x['transactionHash'],'block':int(x['blockNumber'],16),'amount_usdc':int(x['data'],16)/1_000_000})
              out={'source':'base_rpc_fallback','from_block':start,'head_block':head,'incoming_since_from_block':rows,'rpc':ep}
          except Exception as e:
              out={'source':'base_rpc_fallback','error':type(e).__name__+': '+str(e)[:400]}
          pathlib.Path('/tmp/delta-turn10/treasury.json').write_text(json.dumps(out,separators=(',',':')))
          print('RPC_RECON='+json.dumps(out,separators=(',',':'))[:10000])
          PY
          fi
          exit 0
      - name: Reconcile D1 paid-delivery telemetry independently
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/delta-turn10
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            printf '%s' '{"status":"credentials_unavailable"}' > /tmp/delta-turn10/d1.json
            exit 0
          fi
          python - <<'PY'
          import json,os,urllib.request,pathlib
          tok=os.environ['CLOUDFLARE_API_TOKEN']; acct=os.environ['CLOUDFLARE_ACCOUNT_ID']; root=f'https://api.cloudflare.com/client/v4/accounts/{acct}/d1/database'
          def call(url,body=None):
              req=urllib.request.Request(url,data=None if body is None else json.dumps(body).encode(),method='GET' if body is None else 'POST',headers={'Authorization':f'Bearer {tok}','Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
          out={'status':'ok','databases':[]}
          try:
              dbs=call(root).get('result',[])
              cand=[d for d in dbs if 'delta' in (str(d.get('name',''))+' '+str(d.get('uuid',''))).lower() or 'witness' in (str(d.get('name',''))+' '+str(d.get('uuid',''))).lower()]
              out['database_candidates']=[{'name':d.get('name'),'uuid':d.get('uuid')} for d in cand]
              for d in cand:
                  q=f"{root}/{d['uuid']}/query"; dbo={'name':d.get('name'),'uuid':d.get('uuid'),'tables':[],'event_rows':[]}
                  s=call(q,{'sql':"SELECT name FROM sqlite_master WHERE type='table' ORDER BY name"}).get('result',[])
                  tables=[]
                  for z in s if isinstance(s,list) else []: tables += [r.get('name') for r in z.get('results',[]) if r.get('name')]
                  dbo['tables']=tables
                  for t in tables:
                      if t.startswith('_') or not t.replace('_','').isalnum(): continue
                      try:
                          inf=call(q,{'sql':f'PRAGMA table_info({t})'}).get('result',[]); cols=[]
                          for z in inf if isinstance(inf,list) else []: cols += [r.get('name') for r in z.get('results',[]) if r.get('name')]
                          ec=next((x for x in cols if x.lower() in ['event_type','event','type','name']),None)
                          tc=next((x for x in cols if x.lower() in ['created_at','timestamp','ts','occurred_at']),None)
                          if not ec: continue
                          wanted="'payment_required','payment_verified','capture_completed','paid_settlement','settlement_confirmed','treasury_received','qualified_request'"
                          sql=f"SELECT * FROM {t} WHERE lower(CAST({ec} AS TEXT)) IN ({wanted})"
                          if tc: sql += f' ORDER BY {tc} DESC'
                          sql += ' LIMIT 100'
                          rr=call(q,{'sql':sql}).get('result',[]); rows=[]
                          for z in rr if isinstance(rr,list) else []: rows += z.get('results',[]) if isinstance(z,dict) else []
                          if rows: dbo['event_rows'].append({'table':t,'rows':rows})
                      except Exception as e: dbo.setdefault('table_errors',[]).append({'table':t,'error':type(e).__name__})
                  out['databases'].append(dbo)
          except Exception as e:
              out={'status':'degraded','error':type(e).__name__+': '+str(e)[:500]}
          pathlib.Path('/tmp/delta-turn10/d1.json').write_text(json.dumps(out,separators=(',',':')))
          print('D1_RECON='+json.dumps(out,separators=(',',':'))[:15000])
          PY
          exit 0
      - name: Persist evidence snapshot
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib,datetime,re
          root=pathlib.Path('/tmp/delta-turn10')
          def load(n,default=None):
              p=root/n
              try:return json.loads(p.read_text())
              except:return default
          probes={}
          for name in ['capture','preflight','pilot']:
              b=(root/'probes'/f'{name}.body').read_text(errors='ignore')[:2000] if (root/'probes'/f'{name}.body').exists() else ''
              h=(root/'probes'/f'{name}.headers').read_text(errors='ignore')[:4000] if (root/'probes'/f'{name}.headers').exists() else ''
              code=(root/'probes'/f'{name}.code').read_text().strip() if (root/'probes'/f'{name}.code').exists() else None
              rc=(root/'probes'/f'{name}.rc').read_text().strip() if (root/'probes'/f'{name}.rc').exists() else None
              probes[name]={'http_code':code,'curl_rc':rc,'headers_excerpt':h,'body_excerpt':b}
          out={'observed_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),
               'agentndx_precheck':load('agentndx-pre.json',{}),'agentndx_submission':load('agentndx-submit.json',{}),
               'payapi_readback':load('payapi-readback.json',{}),'production_probes':probes,
               'treasury_reconciliation':load('treasury.json',{}),'d1_reconciliation':load('d1.json',{})}
          p=pathlib.Path('docs/channel-status/automation-turn10-2026-09-09.json'); p.parent.mkdir(parents=True,exist_ok=True); p.write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/channel-status/automation-turn10-2026-09-09.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'ops: record turn10 listing and reconciliation evidence'
          git push origin HEAD:master
