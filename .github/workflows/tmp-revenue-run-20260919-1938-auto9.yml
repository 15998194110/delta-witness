name: TEMP DELTA revenue reconciliation 20260919-1938-auto9
on:
  push:
    branches: [master]
    paths: [.github/workflows/tmp-revenue-run-20260919-1938-auto9.yml]
permissions:
  contents: read
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DELTA_PARTNER_SECRET: ${{ secrets.DELTA_PARTNER_SECRET }}
    steps:
      - uses: actions/checkout@v6
        with: {persist-credentials: false}
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - name: Verify owner pricing and live public challenges without payment
        run: |
          node scripts/check-owner-pricing.mjs | tee /tmp/owner-pricing.txt
          node scripts/verify-owner-pricing-live.mjs | tee /tmp/live-pricing.txt
      - name: Audit paid funnel candidates
        run: node scripts/query-revenue-candidates.mjs | tee /tmp/delta-revenue-candidates.json
      - name: AgentPact funded buyer demand
        continue-on-error: true
        run: node scripts/scan-agentpact-demand.mjs | tee /tmp/delta-agentpact-demand.json
      - name: Agent Exchange funded buyer demand
        continue-on-error: true
        run: node scripts/scan-agentexchange-demand.mjs | tee /tmp/delta-agentexchange-demand.json
      - name: Additional funded buyer demand
        continue-on-error: true
        run: node scripts/scan-external-funded-demand.mjs | tee /tmp/delta-external-funded-demand.json
      - name: Reconcile recent Base Treasury with overlap
        env:
          DELTA_TREASURY_LOOKBACK_BLOCKS: '7000'
          DELTA_TREASURY_CHUNK_BLOCKS: '1900'
        run: node scripts/reconcile-treasury.mjs | tee /tmp/delta-treasury.json
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: delta-revenue-state-${{ github.run_id }}
          path: |
            /tmp/owner-pricing.txt
            /tmp/live-pricing.txt
            /tmp/delta-revenue-candidates.json
            /tmp/delta-agentpact-demand.json
            /tmp/delta-agentexchange-demand.json
            /tmp/delta-external-funded-demand.json
            /tmp/delta-treasury.json
          if-no-files-found: warn
          retention-days: 7
