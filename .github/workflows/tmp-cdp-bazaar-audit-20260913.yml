name: TMP - Agent402 DELTA price audit 20260913
on:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/tmp-cdp-bazaar-audit-20260913.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verify canonical live owner prices
        run: |
          node scripts/check-owner-pricing.mjs
          node scripts/verify-owner-pricing-live.mjs
      - name: Read Agent402 current index without mutation
        run: |
          node <<'NODE'
          const origin='https://delta-witness-api.ruphussten.workers.dev';
          const host='delta-witness-api.ruphussten.workers.dev';
          const treasury='0x1990e21bc219696ff7fbc26527dbaed335ac6367';
          const r=await fetch('https://agent402.tools/api/index',{headers:{accept:'application/json'},signal:AbortSignal.timeout(30000)});
          const text=await r.text();
          console.log('AGENT402_HTTP',r.status,'bytes',text.length);
          if(!r.ok) throw new Error(`agent402_http_${r.status}`);
          const data=JSON.parse(text);
          const matches=[];
          const seen=new Set();
          function compact(o){
            const out={};
            for(const [k,v] of Object.entries(o)){
              if(['string','number','boolean'].includes(typeof v)) out[k]=v;
              else if(Array.isArray(v) && v.length<=12 && v.every(x=>['string','number','boolean'].includes(typeof x))) out[k]=v;
              else if(v && typeof v==='object' && ['accepts','paymentRequirements','pricing','x402','resources'].some(x=>k.toLowerCase().includes(x.toLowerCase()))) out[k]=v;
            }
            return out;
          }
          function walk(v){
            if(!v || typeof v!=='object')return;
            if(Array.isArray(v)){for(const x of v)walk(x);return;}
            const direct=Object.values(v).some(x=>typeof x==='string' && (x.toLowerCase().includes(host)||x.toLowerCase().includes('delta witness')||x.toLowerCase()===treasury));
            if(direct){const c=compact(v);const s=JSON.stringify(c);if(!seen.has(s)){seen.add(s);matches.push(c);}}
            for(const x of Object.values(v)) if(x && typeof x==='object')walk(x);
          }
          walk(data);
          console.log('AGENT402_DELTA_MATCHES',JSON.stringify(matches,null,2));
          const joined=JSON.stringify(matches);
          const expected={capture:'1000000',preflight:'5000000','guarded-action-pilot':'10000000'};
          console.log('AGENT402_PRICE_SIGNAL',JSON.stringify({
            match_count:matches.length,
            contains_origin:joined.toLowerCase().includes(origin.toLowerCase()),
            contains_treasury:joined.toLowerCase().includes(treasury),
            observed_raw_amounts:[...joined.matchAll(/"amount"\s*:\s*"?(\d+)"?/g)].map(m=>m[1]),
            expected
          },null,2));
          NODE
