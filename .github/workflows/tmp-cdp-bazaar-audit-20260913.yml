name: TMP - CDP Bazaar DELTA price audit 20260913
on:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/tmp-cdp-bazaar-audit-20260913.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verify canonical live owner prices
        run: |
          node scripts/check-owner-pricing.mjs
          node scripts/verify-owner-pricing-live.mjs
      - name: Read Coinbase CDP Bazaar without mutation
        run: |
          node <<'NODE'
          const host='delta-witness-api.ruphussten.workers.dev';
          const base='https://api.cdp.coinbase.com/platform/v2/x402/discovery';
          const endpoints=['/v1/capture','/v1/preflight','/v1/guarded-action-pilot'];
          const urls=[
            `${base}/search?query=${encodeURIComponent(host)}`,
            `${base}/search?urlSubstring=${encodeURIComponent(host)}`,
          ];
          async function get(url){
            const r=await fetch(url,{headers:{accept:'application/json'},signal:AbortSignal.timeout(30000)});
            const text=await r.text();
            console.log('CDP_HTTP',r.status,url,text.slice(0,20000));
            if(!r.ok) return null;
            try{return JSON.parse(text)}catch{return null}
          }
          const bodies=[];
          for(const url of urls) bodies.push(await get(url));
          const flat=[];
          function walk(v){
            if(!v)return;
            if(Array.isArray(v)){for(const x of v)walk(x);return;}
            if(typeof v==='object'){
              const s=JSON.stringify(v).toLowerCase();
              if(s.includes(host)) flat.push(v);
              for(const x of Object.values(v)) if(typeof x==='object') walk(x);
            }
          }
          for(const b of bodies) walk(b);
          const uniq=[...new Map(flat.map(x=>[JSON.stringify(x),x])).values()];
          const matches=uniq.filter(x=>endpoints.some(p=>JSON.stringify(x).includes(`${host}${p}`)||JSON.stringify(x).includes(`https://${host}${p}`)));
          console.log('CDP_DELTA_MATCHES',JSON.stringify(matches,null,2));
          console.log('CDP_DELTA_SUMMARY',JSON.stringify({host,match_count:matches.length,expected_usdc:{capture:1,preflight:5,'guarded-action-pilot':10}},null,2));
          NODE
