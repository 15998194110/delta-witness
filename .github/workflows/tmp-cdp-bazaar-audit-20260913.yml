name: TMP - Agent402 duplicate suppression validation 20260913
on:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/tmp-cdp-bazaar-audit-20260913.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Run canonical Agent402 registration reconciler a second time
        run: |
          node scripts/register-agent402.mjs | tee /tmp/agent402-second-pass.txt
          grep -q '"duplicate_avoided":true' /tmp/agent402-second-pass.txt
          grep -q '"submission_attempts":0' /tmp/agent402-second-pass.txt
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent402-duplicate-suppression-${{ github.run_id }}
          path: /tmp/agent402-second-pass.txt
          retention-days: 7
          if-no-files-found: warn
