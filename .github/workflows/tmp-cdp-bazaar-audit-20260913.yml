name: TMP - x402 facilitator routing audit 20260913
on:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/tmp-cdp-bazaar-audit-20260913.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Inspect installed x402 version and multi-facilitator selection
        run: |
          node <<'NODE'
          const fs = await import('node:fs');
          const pkg = JSON.parse(fs.readFileSync('node_modules/@x402/core/package.json','utf8'));
          console.log('X402_CORE_VERSION', pkg.version);
          const candidates = [
            'node_modules/@x402/core/dist/esm/server/x402ResourceServer.js',
            'node_modules/@x402/core/dist/esm/server/index.mjs',
            'node_modules/@x402/core/dist/cjs/server/x402ResourceServer.js',
          ];
          let source=''; let sourcePath='';
          for (const p of candidates) if (fs.existsSync(p)) { source=fs.readFileSync(p,'utf8'); sourcePath=p; break; }
          if (!source) {
            const stack=['node_modules/@x402/core'];
            while(stack.length && !source){
              const d=stack.pop();
              for(const e of fs.readdirSync(d,{withFileTypes:true})){
                const p=`${d}/${e.name}`;
                if(e.isDirectory()) stack.push(p);
                else if(/x402ResourceServer\.(js|mjs)$/.test(e.name)){source=fs.readFileSync(p,'utf8');sourcePath=p;break;}
              }
            }
          }
          console.log('X402_RESOURCE_SERVER_SOURCE', sourcePath || 'not-found');
          const markers=['facilitatorClientsMap','constructor(facilitatorClients','getFacilitatorClient','supportedResponsesMap'];
          for(const marker of markers){
            const i=source.indexOf(marker);
            console.log(`MARKER_${marker}`, i, i>=0 ? source.slice(Math.max(0,i-1400),Math.min(source.length,i+3000)) : 'missing');
          }
          NODE
