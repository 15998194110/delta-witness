name: TMP - x402 facilitator routing audit 20260913
on:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/tmp-cdp-bazaar-audit-20260913.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Prove same-network multi-facilitator semantics without external calls
        run: |
          node <<'NODE'
          import { x402ResourceServer } from '@x402/core/server';
          import { registerExactEvmScheme } from '@x402/evm/exact/server';
          const supported={kinds:[{x402Version:2,scheme:'exact',network:'eip155:8453'}],extensions:[],signers:{'eip155:*':['0x0000000000000000000000000000000000000001']}};
          function fake(name){
            return {
              name,
              async getSupported(){ console.log('GET_SUPPORTED',name); return structuredClone(supported); },
              async verify(){ console.log('VERIFY_CALLED',name); return {isValid:false,invalidReason:`${name}_probe`,payer:'0x0000000000000000000000000000000000000002'}; },
              async settle(){ console.log('SETTLE_CALLED',name); return {success:false,errorReason:`${name}_probe`,payer:'0x0000000000000000000000000000000000000002',network:'eip155:8453',transaction:''}; },
            };
          }
          async function audit(order){
            const clients=order.map(fake);
            const server=new x402ResourceServer(clients);
            registerExactEvmScheme(server);
            await server.initialize();
            console.log('ORDER',order.join(','));
            console.log('OWN_KEYS',Object.getOwnPropertyNames(server));
            for(const key of Object.getOwnPropertyNames(server)){
              if(/facilitator|supported/i.test(key)) console.dir({key,value:server[key]},{depth:8});
            }
            const req={scheme:'exact',network:'eip155:8453',amount:'1000000',asset:'0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913',payTo:'0x1990e21bc219696ff7fbc26527dbaed335ac6367',maxTimeoutSeconds:300,extra:{name:'USD Coin',version:'2'}};
            const payload={x402Version:2,accepted:req,payload:{signature:'0x',authorization:{from:'0x0000000000000000000000000000000000000002',to:req.payTo,value:req.amount,validAfter:'0',validBefore:'999999999999',nonce:'0x'+'00'.repeat(32)}}};
            try{await server.verifyPayment(payload,req);}catch(e){console.log('VERIFY_ERROR',String(e));}
          }
          await audit(['A','B']);
          await audit(['B','A']);
          NODE
