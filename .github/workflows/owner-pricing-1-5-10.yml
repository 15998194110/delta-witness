name: Owner Pricing 1-5-10
on:
  push:
    branches: [master]
    paths: ['.github/workflows/owner-pricing-1-5-10.yml']
permissions:
  contents: read
concurrency:
  group: delta-production-release
  cancel-in-progress: false
jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DELTA_PARTNER_GATEWAY_SECRET: ${{ secrets.DELTA_PARTNER_GATEWAY_SECRET }}
      DELTA_INDEXNOW_ADMIN_SECRET: ${{ secrets.DELTA_INDEXNOW_ADMIN_SECRET }}
      DELTA_PARTNER_SECRET: ${{ secrets.DELTA_PARTNER_SECRET }}
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - name: Move to freshest master and assert owner policy
        run: |
          set -euo pipefail
          git fetch origin master
          git checkout --detach origin/master
          grep -F '**$1.00 USDC — entry layer:** Public Capture.' AGENTS.md
          grep -F '**$5.00 USDC — standard verification layer:** Public Preflight.' AGENTS.md
          node - <<'NODE'
          const fs=require('fs');
          const c=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          if(c.vars.CAPTURE_BASE_PRICE_USD!=='1'||c.vars.PREFLIGHT_BASE_PRICE_USD!=='5'||c.vars.WATCH_BASE_PRICE_USD!=='1'||c.vars.PARTNER_PREFLIGHT_BASE_PRICE_USD!=='1') throw new Error(JSON.stringify(c.vars));
          const p=JSON.parse(fs.readFileSync('channels/partner-gateway/wrangler.jsonc','utf8'));
          if(p.vars.PARTNER_NET_CAPTURE_USD!=='1'||p.vars.PARTNER_NET_PREFLIGHT_USD!=='1'||p.vars.PARTNER_NET_WATCH_CHECK_USD!=='1') throw new Error(JSON.stringify(p.vars));
          NODE
      - name: Verify core and partner before deploy
        run: |
          set -euo pipefail
          npm ci
          npm run verify
          cd channels/partner-gateway
          npm ci
          npm run verify
      - name: Require production credentials
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$DELTA_PARTNER_GATEWAY_SECRET"
          test -n "$DELTA_INDEXNOW_ADMIN_SECRET"
          test -n "$DELTA_PARTNER_SECRET"
      - name: Deploy freshest core preserving secrets and bindings
        run: |
          set -euo pipefail
          printf '%s' "$DELTA_PARTNER_GATEWAY_SECRET" | npx wrangler secret put PARTNER_GATEWAY_SECRET
          printf '%s' "$DELTA_INDEXNOW_ADMIN_SECRET" | npx wrangler secret put INDEXNOW_ADMIN_SECRET
          npx wrangler deploy
      - name: Deploy $1 partner gateway
        working-directory: channels/partner-gateway
        run: |
          set -euo pipefail
          printf '%s' "$DELTA_PARTNER_SECRET" | npx wrangler secret put PARTNER_SECRET
          printf '%s' "$DELTA_PARTNER_GATEWAY_SECRET" | npx wrangler secret put CORE_SERVICE_SECRET
          npx wrangler deploy
      - name: Verify public 402 prices, Base and Treasury
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://delta-witness-api.ruphussten.workers.dev'
          check() {
            name="$1"; path="$2"; expected="$3"
            code=$(curl --retry 5 --retry-all-errors --retry-delay 2 -sS -o /tmp/body -D /tmp/headers -w '%{http_code}' -X POST "$BASE$path" -H 'content-type: application/json' -d '{}')
            hdr=$(awk 'BEGIN{IGNORECASE=1} /^payment-required:/{sub(/^[^:]+:[[:space:]]*/,""); gsub(/\r/,""); print; exit}' /tmp/headers)
            decoded=$(printf '%s' "$hdr" | base64 -d)
            amount=$(printf '%s' "$decoded" | jq -r '.. | .amount? // empty' | head -1)
            payto=$(printf '%s' "$decoded" | jq -r '.. | .payTo? // empty' | head -1)
            network=$(printf '%s' "$decoded" | jq -r '.. | .network? // empty' | head -1)
            echo "product=$name status=$code amount=$amount expected=$expected payTo=$payto network=$network"
            test "$code" = 402
            test "$amount" = "$expected"
            test "${payto,,}" = '0x1990e21bc219696ff7fbc26527dbaed335ac6367'
            test "$network" = 'eip155:8453'
          }
          check capture '/v1/capture' 1000000
          check preflight '/v1/preflight' 5000000
          check pilot '/v1/guarded-action-pilot' 10000000
          curl --fail --retry 5 --retry-all-errors --retry-delay 2 "$BASE/health"
          curl --fail --retry 5 --retry-all-errors --retry-delay 2 "$BASE/openapi.json" >/tmp/openapi.json
          curl --fail --retry 5 --retry-all-errors --retry-delay 2 "$BASE/.well-known/agent.json" >/tmp/agent.json
      - name: Verify $1 partner/watch floors without fulfillment
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://delta-witness-api.ruphussten.workers.dev'
          core_post() {
            path="$1"; data="$2"; key="$3"; outfile="$4"
            curl --silent --show-error --retry 3 --retry-all-errors --retry-delay 1 --output "$outfile" --write-out '%{http_code}' \
              --request POST "$BASE$path" \
              --header "x-delta-core-secret: $DELTA_PARTNER_GATEWAY_SECRET" \
              --header 'x-delta-partner: pricing-ci' \
              --header 'x-delta-channel: pricing-ci' \
              --header 'x-delta-gross-usd: 0' \
              --header "idempotency-key: $key" \
              --header 'content-type: application/json' \
              --data "$data"
          }
          s=$(core_post '/internal/partner/capture' '{"url":"https://example.com"}' "pricing-cap-${GITHUB_RUN_ID}" /tmp/cap.json); test "$s" = 402; jq -e '.minimum_price_usd == 1' /tmp/cap.json
          s=$(core_post '/internal/partner/preflight' '{"url":"https://example.com","expected":{"contains":["Example Domain"]}}' "pricing-pre-${GITHUB_RUN_ID}" /tmp/pre.json); test "$s" = 402; jq -e '.minimum_price_usd == 1' /tmp/pre.json
          s=$(core_post '/internal/partner/watch' '{"url":"https://example.com","checks":1,"interval_seconds":900}' "pricing-watch-${GITHUB_RUN_ID}" /tmp/watch.json); test "$s" = 402; jq -e '.required_total_usd == 1' /tmp/watch.json
          curl --fail --retry 5 --retry-all-errors --retry-delay 2 https://delta-witness-partner-gateway.ruphussten.workers.dev/health
      - name: Reconcile Base Treasury after pricing deployment
        run: node scripts/reconcile-treasury.mjs
