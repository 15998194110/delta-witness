name: DELTA Agent402 Finalize Temp
on:
  push:
    paths:
      - '.github/workflows/_temp_agent402_finalize_20260908.yml'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Reconcile canonical Base USDC by RPC log fallback
        shell: bash
        run: |
          set -euo pipefail
          USDC='0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913'
          TREASURY='0x1990e21bc219696ff7fbc26527dbaed335ac6367'
          FIRST_TX='0x5ae76f54c158d24f03b86aed0a20482e8de2a35983941c03fe60d131c19cd7b3'
          TOPIC0='0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef'
          TO_TOPIC='0x0000000000000000000000001990e21bc219696ff7fbc26527dbaed335ac6367'
          START_DEC=50985188
          RPC='https://mainnet.base.org'
          rpc_call() {
            local payload="$1" outfile="$2"
            for attempt in 1 2 3; do
              if curl --retry 1 --retry-delay 1 --retry-all-errors -fsS --max-time 25 -H 'content-type: application/json' --data-binary "$payload" "$RPC" -o "$outfile"; then
                if jq -e '.error == null' "$outfile" >/dev/null 2>&1; then return 0; fi
              fi
              sleep $((attempt*2))
            done
            return 1
          }
          if ! rpc_call '{"jsonrpc":"2.0","id":1,"method":"eth_blockNumber","params":[]}' /tmp/block.json; then
            RPC='https://base-rpc.publicnode.com'
            rpc_call '{"jsonrpc":"2.0","id":1,"method":"eth_blockNumber","params":[]}' /tmp/block.json
          fi
          latest_hex=$(jq -r '.result' /tmp/block.json)
          latest_dec=$((latest_hex))
          echo "BASE_RPC=$RPC LATEST=$latest_dec START=$START_DEC"
          : > /tmp/usdc_logs.ndjson
          chunk=5000
          from=$START_DEC
          while [ "$from" -le "$latest_dec" ]; do
            to=$((from+chunk-1)); if [ "$to" -gt "$latest_dec" ]; then to=$latest_dec; fi
            from_hex=$(printf '0x%x' "$from"); to_hex=$(printf '0x%x' "$to")
            payload=$(jq -nc --arg a "$USDC" --arg f "$from_hex" --arg t "$to_hex" --arg x "$TOPIC0" --arg y "$TO_TOPIC" '{jsonrpc:"2.0",id:1,method:"eth_getLogs",params:[{address:$a,fromBlock:$f,toBlock:$t,topics:[$x,null,$y]}]}')
            if ! rpc_call "$payload" /tmp/logs.json; then
              if [ "$RPC" != 'https://base-rpc.publicnode.com' ]; then
                RPC='https://base-rpc.publicnode.com'
                rpc_call "$payload" /tmp/logs.json
              else
                echo "RPC_LOG_QUERY_DEGRADED from=$from to=$to" >&2
                exit 1
              fi
            fi
            jq -c '.result[]?' /tmp/logs.json >> /tmp/usdc_logs.ndjson
            from=$((to+1))
          done
          if [ -s /tmp/usdc_logs.ndjson ]; then jq -s '.' /tmp/usdc_logs.ndjson > /tmp/usdc_logs.json; else echo '[]' > /tmp/usdc_logs.json; fi
          jq --arg first "${FIRST_TX,,}" '[.[] | {transactionHash,blockNumber,data,address,topics} | select((.transactionHash|ascii_downcase)!=$first)]' /tmp/usdc_logs.json > /tmp/new_usdc.json
          echo 'RPC_CANONICAL_INCOMING_USDC_BEGIN'
          jq '[.[] | {transactionHash,blockNumber,rawAmount:.data}]' /tmp/usdc_logs.json
          echo 'RPC_CANONICAL_INCOMING_USDC_END'
          echo 'RPC_NEW_SINCE_FIRST_BEGIN'
          cat /tmp/new_usdc.json
          echo 'RPC_NEW_SINCE_FIRST_END'
          jq -e 'length == 0' /tmp/new_usdc.json >/dev/null || echo 'NEW_TREASURY_RECEIPT_CANDIDATE=true'
      - name: Record Agent402 live listing in strict growth ledger
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('docs/growth-ledger.md')
          text=p.read_text()
          new=json.loads(Path('/tmp/new_usdc.json').read_text())
          treasury_note=(
              'Independent Base RPC canonical-USDC Transfer-log fallback found no incoming receipt after the already-recorded First Stranger Revenue.'
              if not new else
              f'Independent Base RPC fallback detected {len(new)} additional canonical-USDC receipt candidate(s); they are NOT classified as customer revenue in this Agent402 row pending separate settlement/proof reconciliation.'
          )
          row=(
          '| 2026-09-08T01:14:17+08:00 | Agent402 open x402 marketplace / Smart Order Router — DELTA production origin | live | free direct registration accepted; seller returned `listed=true`, 6 tools, Base `eip155:8453`, `routable=true`, `health=1`; task-router search propagation/ranking pending | 0 | 0 | 0 | 0 | 0 | 0.00 | 0.00 | 0.00 | 0.00 | A | '
          'Official free `POST /api/index/register` returned HTTP 200 on first attempt for `https://delta-witness-api.ruphussten.workers.dev`, with authoritative seller state `toolCount=6`, network `eip155:8453`, `routable=true`, `health=1`. Production Capture, Preflight, and Guarded Action Pilot were re-probed immediately beforehand and each returned the expected HTTP 402. Agent402 `/api/find` returned strong adjacent paid demand for deterministic agent-action preflight, browser rendering/screenshot and x402 settlement verification, but DELTA did not surface in the immediate query, so router propagation/ranking is not claimed yet. No Agent402 probe/listing activity is counted as buyer intent, settlement or revenue. '
          + treasury_note + ' |'
          )
          marker='|---|---|---|---|---:|---:|---:|---:|---:|---:|---:|---:|---:|---|---|\n'
          if row in text:
              raise SystemExit('Agent402 row already present')
          if marker not in text:
              raise SystemExit('ledger marker missing')
          p.write_text(text.replace(marker, marker+row+'\n',1))
          PY
      - name: Clean temporary workflows and persist evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'DELTA Autonomous Operator'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/growth-ledger.md
          git rm -f .github/workflows/_temp_agent402_register_20260908.yml .github/workflows/_temp_agent402_finalize_20260908.yml
          git commit -m 'growth: list DELTA on Agent402 and reconcile treasury'
          git push origin HEAD:master
