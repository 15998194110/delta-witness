name: DELTA MeshKore 2224 Check Temp
on:
  push:
    paths: ['.github/workflows/_temp_meshkore_2224check_20260908.yml']
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Check and record if live
        shell: bash
        run: |
          set -euo pipefail
          curl --fail -sS --retry 4 --retry-all-errors --retry-delay 2 https://api.meshkore.com/v1/agents/delta-witness-ruphussten >/tmp/m.json
          node - <<'NODE'
          const x=require('/tmp/m.json'),a=x.agent||x,c=a.agent_card||a.card||{};console.log(JSON.stringify({slug:a.slug,registered:a.registered,live:a.live,last_active:a.last_active,endpoint:a.endpoint,card:c}));if(!(a.live===1||a.live===true||a.online===true))process.exit(12);if(c.name!=='DELTA Witness'||c.pricing?.amount!==30000)process.exit(13);
          NODE
          for spec in 'capture|{"url":"https://example.com"}' 'preflight|{"url":"https://example.com","expected":{"contains":["Example Domain"]}}' 'guarded-action-pilot|{"urls":["https://example.com"],"preflight":{"url_index":0,"expected":{"contains":["Example Domain"]}}}'; do p=${spec%%|*};b=${spec#*|};code=$(curl -sS --retry 3 --retry-all-errors --retry-delay 2 -o /tmp/$p -w '%{http_code}' -X POST https://delta-witness-api.ruphussten.workers.dev/v1/$p -H 'content-type: application/json' --data "$b");echo "$p=$code";test "$code" = 402;done
          python3 - <<'PY'
          import json,urllib.request,time,datetime,os
          mesh=json.load(open('/tmp/m.json'));a=mesh.get('agent',mesh);c=a.get('agent_card') or a.get('card') or {};treasury='0x1990e21bc219696ff7fbc26527dbaed335ac6367';usdc='0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913';t0='0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef';t2='0x'+'0'*24+treasury[2:].lower();start=51014877
          def rpc(m,p):
            for u in ['https://mainnet.base.org','https://base-rpc.publicnode.com']:
              for i in range(3):
                try:q=urllib.request.Request(u,data=json.dumps({'jsonrpc':'2.0','id':1,'method':m,'params':p}).encode(),headers={'content-type':'application/json'});j=json.loads(urllib.request.urlopen(q,timeout=25).read());
                except Exception:time.sleep(i+1);continue
                if 'result' in j:return j['result'],u
            raise RuntimeError('rpc unavailable')
          tr={'status':'degraded','from_block':start,'receipts':[]}
          try:
            h,u=rpc('eth_blockNumber',[]);latest=int(h,16);tr.update(status='ok',latest=latest,rpc=u);cur=start
            while cur<=latest:
              end=min(cur+1999,latest);logs,u=rpc('eth_getLogs',[{'fromBlock':hex(cur),'toBlock':hex(end),'address':usdc,'topics':[t0,None,t2]}]);tr['receipts'] += [{'block':int(x['blockNumber'],16),'tx':x['transactionHash'],'from':'0x'+x['topics'][1][-40:],'amount_usdc':int(x['data'],16)/1e6} for x in logs];cur=end+1
          except Exception as e:tr['error']=str(e)
          rec={'schema':'delta-growth-meshkore/v1','recorded_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'channel':'meshkore','listing_status':'public_active','discovery_status':'live_routable','canonical_url':'https://meshkore.com/agent/delta-witness-ruphussten','agent_id':a.get('slug') or a.get('agent_id') or a.get('id'),'registered':a.get('registered'),'live':a.get('live'),'last_active':a.get('last_active'),'endpoint':a.get('endpoint'),'owner_class':a.get('owner_class') or c.get('owner_class'),'protocols':c.get('protocols'),'pricing':c.get('pricing'),'production_http_status':{'capture':402,'preflight':402,'guarded_action_pilot':402},'production_prices_usdc':{'capture':0.03,'preflight':0.03,'guarded_action_pilot':10},'treasury_reconciliation':tr,'strict_accounting':{'buyer_count':1,'settlement_count':1,'revenue_usdc':0.03,'variable_cost_usdc':0.002163522555,'contribution_margin_usdc':0.027836477445,'new_receipt_count':len(tr.get('receipts',[])),'new_customer_revenue_usdc':0},'evidence_quality':'A' if tr.get('status')=='ok' else 'B','risk_controls':{'listing_fee_paid':0,'wallet_signature':False,'assets_moved':False,'private_key_exposed':False}}
          os.makedirs('docs/channel-status',exist_ok=True);open('docs/channel-status/meshkore-2026-09-08.json','w').write(json.dumps(rec,indent=2)+'\n');print(json.dumps(rec,separators=(',',':')))
          PY
          git config user.name 'DELTA Growth Bot';git config user.email 'actions@users.noreply.github.com';git add docs/channel-status/meshkore-2026-09-08.json;git commit -m 'growth: verify live MeshKore routing';git push origin HEAD:master
      - name: Cleanup
        if: always()
        run: |
          git fetch origin master;git reset --hard origin/master;git config user.name 'DELTA Growth Bot';git config user.email 'actions@users.noreply.github.com';git rm -f .github/workflows/_temp_meshkore_2224check_20260908.yml 2>/dev/null || true;git commit -m 'chore: remove MeshKore cron check workflow' || true;git push origin HEAD:master || true
