name: TEMP DELTA buyer-route readback
on:
  push:
    branches: [master]
    paths: [.github/workflows/tmp-commerce-expansion-readback-20260916.yml]
permissions:
  contents: read
jobs:
  buyer-route-readback:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with: {persist-credentials: false}
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - name: Owner price integrity before interpreting purchase routes
        run: node scripts/check-owner-pricing.mjs && node scripts/verify-owner-pricing-live.mjs
      - name: Query free buyer discovery surfaces without account, payment, signing or mutation
        run: |
          mkdir -p /tmp/delta-expansion
          node --input-type=module <<'JS'
          import {writeFileSync} from 'node:fs';
          const results=[];
          async function call(name,url,opts={}) {
            for(let attempt=1;attempt<=2;attempt++) {
              try {
                const r=await fetch(url,{...opts,signal:AbortSignal.timeout(18000)});
                const text=await r.text();
                if((r.status>=500||r.status===429)&&attempt<2){await new Promise(x=>setTimeout(x,1200));continue;}
                results.push({name,url,checked_at:new Date().toISOString(),http:r.status,content_type:r.headers.get('content-type'),body:text.slice(0,300000)});
                console.log(JSON.stringify({name,http:r.status,length:text.length})); return;
              } catch(e) {
                if(attempt<2){await new Promise(x=>setTimeout(x,1200));continue;}
                results.push({name,url,status:'deferred_recoverable',error:String(e)});
              }
            }
          }
          await call('arispay_search_delta','https://api.arispay.app/v1/marketplace/agents?q=DELTA%20Witness&limit=50');
          const intents=[
            ['public_page_capture','preserve a timestamped public product or vendor page before checkout',100],
            ['vendor_terms_preflight','verify public vendor terms before an autonomous consequential action',500],
            ['price_availability_evidence','retain evidence of public price or availability immediately before purchase',100]
          ];
          for(const [id,intent,budgetCentsMax] of intents){
            await call(`arispay_discover_${id}`,'https://api.arispay.app/v1/marketplace/discover',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({intent,budgetCentsMax,limit:10})});
            await call(`paywitness_select_${id}`,'https://paywitness.ai/select',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({intent,budget_usd:budgetCentsMax/100})});
          }
          writeFileSync('/tmp/delta-expansion/buyer-route-readback.json',JSON.stringify(results,null,2));
          JS
      - name: Deferred Tollbooth recovery readback without mutation
        continue-on-error: true
        run: curl -sS --connect-timeout 8 --max-time 20 --retry 1 --retry-delay 2 --retry-all-errors 'https://trytollbooth.com/api/services?q=DELTA%20Witness' -o /tmp/delta-expansion/tollbooth-readback.json -w 'TOLLBOOTH_HTTP=%{http_code}\n'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: delta-buyer-route-readback-${{ github.run_id }}
          path: /tmp/delta-expansion/
          retention-days: 7
