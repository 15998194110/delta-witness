name: TEMP DELTA free buyer-route contract readback
on:
  push:
    branches: [master]
    paths: [.github/workflows/tmp-commerce-expansion-readback-20260916.yml]
permissions:
  contents: read
jobs:
  official-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v6
        with: {persist-credentials: false}
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - name: Download official published CLI for static inspection only
        run: |
          mkdir -p /tmp/delta-expansion
          npm view agentmarketplace --json --fetch-retries=2 > /tmp/delta-expansion/cli-metadata.json
          npm pack agentmarketplace --ignore-scripts --pack-destination /tmp/delta-expansion --fetch-retries=2
      - name: Deferred Tollbooth recovery readback without mutation
        continue-on-error: true
        run: |
          curl -sS --connect-timeout 8 --max-time 20 --retry 1 --retry-delay 2 --retry-all-errors 'https://trytollbooth.com/api/services?q=DELTA%20Witness' -o /tmp/delta-expansion/tollbooth-readback.json -w 'TOLLBOOTH_HTTP=%{http_code}\n'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: delta-expansion-contracts-${{ github.run_id }}
          path: /tmp/delta-expansion/
          retention-days: 7
