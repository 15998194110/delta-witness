name: TEMP DELTA Tollbooth Capture expansion
on:
  push:
    branches: [master]
    paths: [.github/workflows/tmp-commerce-expansion-readback-20260916.yml]
permissions:
  contents: read
jobs:
  list-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with: {persist-credentials: false}
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - name: Verify owner pricing and live 402 before price-bearing write
        run: node scripts/check-owner-pricing.mjs && node scripts/verify-owner-pricing-live.mjs
      - name: Register DELTA Capture only if exact endpoint is absent
        run: |
          set -euo pipefail
          BASE='https://www.trytollbooth.com'
          ENDPOINT='https://delta-witness-api.ruphussten.workers.dev/v1/capture'
          OUT=/tmp/tollbooth-delta-capture.json
          readback() { curl -fsS --connect-timeout 10 --max-time 25 --retry 2 --retry-delay 2 --retry-all-errors "$BASE/api/services?q=DELTA%20Witness"; }
          BEFORE="$(readback || true)"
          if printf '%s' "$BEFORE" | grep -Fq "$ENDPOINT"; then
            printf '%s' "$BEFORE" > "$OUT"
            echo 'TOLLBOOTH_CAPTURE existing=true write=false'
            exit 0
          fi
          PAYLOAD='{"name":"DELTA Witness Capture","endpoint":"https://delta-witness-api.ruphussten.workers.dev/v1/capture","category":"data","priceUsdc":1,"wallet":"0x1990e21bc219696ff7fbc26527dbaed335ac6367","chain":"base","description":"Preserve a timestamped, hash-verifiable observation of a public webpage before checkout, procurement, audit, or automation. Exact x402 price: 1 USDC on Base."}'
          CODE=$(curl -sS --connect-timeout 10 --max-time 35 -o /tmp/tollbooth-post.json -w '%{http_code}' -X POST "$BASE/api/services" -H 'content-type: application/json' --data "$PAYLOAD" || true)
          AFTER="$(readback || true)"
          if printf '%s' "$AFTER" | grep -Fq "$ENDPOINT"; then
            printf '%s' "$AFTER" > "$OUT"
            echo "TOLLBOOTH_CAPTURE present=true post_http=$CODE"
            exit 0
          fi
          echo "TOLLBOOTH_CAPTURE present=false post_http=$CODE" >&2
          cat /tmp/tollbooth-post.json >&2 || true
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: delta-tollbooth-capture-${{ github.run_id }}
          path: /tmp/tollbooth-*.json
          if-no-files-found: warn
          retention-days: 7
