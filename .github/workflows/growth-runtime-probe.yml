name: DELTA growth runtime probe

on:
  push:
    paths:
      - '.github/workflows/growth-runtime-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: '22' }
      - name: Base Treasury canonical USDC
        shell: bash
        run: |
          set -euo pipefail
          URL='https://base.blockscout.com/api/v2/addresses/0x1990e21bc219696ff7fbc26527dbaed335ac6367/token-transfers?type=ERC-20'
          curl --fail --location --retry 4 --retry-all-errors --retry-delay 2 "$URL" -o /tmp/transfers.json
          node - <<'NODE'
          const d=require('/tmp/transfers.json');
          const usdc='0x833589fcd6edb6e08f4c7c32d4f71b54bda02913';
          const treasury='0x1990e21bc219696ff7fbc26527dbaed335ac6367';
          const out=[];
          for (const x of d.items||[]) {
            const token=x.token||{};
            const ta=(token.address_hash||token.address||'').toLowerCase();
            const to=(typeof x.to==='object' ? x.to?.hash : x.to || '').toLowerCase();
            if (ta===usdc && to===treasury) {
              const raw=(typeof x.total==='object' ? x.total?.value : x.value);
              const dec=Number(token.decimals||6);
              out.push({tx_hash:x.transaction_hash,timestamp:x.timestamp,from:typeof x.from==='object'?x.from?.hash:x.from,amount_usdc:Number(raw)/10**dec});
            }
          }
          console.log('TREASURY_RESULT='+JSON.stringify(out.slice(0,20)));
          NODE
      - name: Public npm MCP version
        shell: bash
        run: |
          set -u
          echo "NPM_MCP=$(npm view delta-witness-mcp version 2>/dev/null || true)"
          echo "NPM_JS=$(npm view delta-witness-ruphussten version 2>/dev/null || true)"
      - name: Official MCP Registry status
        shell: bash
        run: |
          set -u
          node scripts/render-mcp-server.mjs
          node scripts/check-mcp-registry.mjs server.json && echo 'MCP_REGISTRY=active' || echo 'MCP_REGISTRY=not_active_or_degraded'
      - name: Coinbase Bazaar merchant discovery
        shell: bash
        run: |
          set -u
          URL='https://api.cdp.coinbase.com/platform/v2/x402/discovery/merchant?payTo=0x1990e21bc219696ff7fbc26527dbaed335ac6367'
          code=$(curl -L -sS --retry 4 --retry-all-errors --retry-delay 2 -o /tmp/bazaar.json -w '%{http_code}' "$URL" || true)
          echo "BAZAAR_HTTP=$code"
          head -c 12000 /tmp/bazaar.json 2>/dev/null | sed 's/^/BAZAAR_BODY=/' || true
      - name: DELTA production contract
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://delta-witness-api.ruphussten.workers.dev'
          curl --fail --retry 4 --retry-all-errors "$BASE/health" >/dev/null
          code=$(curl -sS -o /tmp/pilot.json -D /tmp/pilot.headers -w '%{http_code}' -X POST "$BASE/v1/guarded-action-pilot" -H 'content-type: application/json' -d '{"urls":["https://example.com"]}')
          test "$code" = '402'
          echo "PILOT_HTTP=$code"
          grep -i '^payment-required:' /tmp/pilot.headers | head -1 || true
