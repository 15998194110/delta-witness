name: DELTA Finalize Turn 5
on:
  push:
    paths:
      - '.github/workflows/_temp_finalize_turn5.yml'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Persist conservative evidence and clean temp workflows
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/growth-ledger.md')
          text=p.read_text()
          row="| 2026-09-08T02:44+08:00 | Standing-mandate production price integrity + AgentNDX free submission | core live; AgentNDX review submitted | Capture `$0.03`, Preflight `$0.03`, Pilot `$10` independently returned canonical Base-USDC HTTP 402 after production deploy; AgentNDX form POST reached its authoritative `302 /submit?success=1` review-queue success redirect; public listing approval pending | 0 | 0 | 0 | 0 | 0 | 0.00 | 0.00 | 0.00 | 0.00 | A core / A- listing | Earlier public Preflight `$1` experiment was superseded by the standing `$0.03` mandate and restored in source commit `0d51cecf`; 54 tests passed and Worker version `c9a3b278-42bf-429b-ac65-d1f35428a5e8` deployed with unchanged Treasury. Live x402 challenges encode raw USDC amounts `30000` / `30000` / `10000000` to `0x1990e21bc219696ff7fbc26527dbaed335ac6367`. Independent official Base RPC scan through block `51008628` found exactly the existing First Stranger Revenue transfer only, total Treasury canonical-USDC receipts `0.03`; D1 after the first fulfillment contained proof-open events but no new `payment_verified` or `capture_completed`. AgentNDX contact email was omitted and no fee/account was used. Operational note: the submit client followed the success redirect while preserving POST, causing downstream HTTP 405 and retries; each POST first returned the same success redirect, so duplicate review-queue entries are possible and no further submission will be made. PayAPI was not re-contacted because two prior first contacts exist with no reply; silence is not chased. |"
          marker="|---|---|---|---|---:|---:|---:|---:|---:|---:|---:|---:|---:|---|---|\n"
          if row not in text:
              if marker not in text: raise SystemExit('ledger marker missing')
              text=text.replace(marker,marker+row+'\n',1)
              p.write_text(text)
          PY
          git rm -f .github/workflows/_temp_delta_automation_turn5.yml .github/workflows/_temp_delta_recovery_turn5.yml .github/workflows/_temp_agentndx_submit_turn5.yml .github/workflows/_temp_finalize_turn5.yml
          git config user.name 'DELTA Autonomous Operator'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/growth-ledger.md
          git commit -m 'ops: record price integrity, treasury audit and AgentNDX submission'
          git push origin HEAD:master
