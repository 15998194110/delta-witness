name: DELTA MeshKore Endpoint Fix Temp
on:
  push:
    paths:
      - '.github/workflows/_temp_meshkore_endpoint_fix_20260908.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - name: Add protocol-correct MeshKore top-level endpoint
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/index.ts')
          s=p.read_text()
          old='''    body: stableJson({\n      description: "Trust layer for autonomous actions: paid public-page capture and deterministic preflight evidence over x402 on Base.",\n      capabilities: ["web-proof", "browser-verification", "preflight", "page-state", "x402", "base", "usdc", "autonomous-agents", "guard", "evidence"],\n      agent_card: meshKoreDiscoveryCard(env),\n    }),'''
          new='''    body: stableJson({\n      endpoint: origin(env),\n      description: "Trust layer for autonomous actions: paid public-page capture and deterministic preflight evidence over x402 on Base.",\n      capabilities: ["web-proof", "browser-verification", "preflight", "page-state", "x402", "base", "usdc", "autonomous-agents", "guard", "evidence"],\n      agent_card: meshKoreDiscoveryCard(env),\n    }),'''
          if old not in s:
              if 'endpoint: origin(env),\n      description: "Trust layer for autonomous actions' in s:
                  print('endpoint patch already present')
              else:
                  raise SystemExit('MeshKore heartbeat patch anchor not found')
          else:
              p.write_text(s.replace(old,new,1))
          PY
          npm ci
          npm run verify
          git config user.name 'DELTA Growth Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/index.ts
          if ! git diff --cached --quiet; then
            git commit -m 'growth: bind MeshKore top-level endpoint in heartbeat'
            git pull --rebase origin master
            git push origin HEAD:master
          fi
      - name: Deploy endpoint heartbeat fix
        shell: bash
        run: |
          npx wrangler deploy
          curl --fail --retry 5 --retry-delay 3 --retry-all-errors --max-time 30 https://delta-witness-api.ruphussten.workers.dev/health
      - name: Wait for heartbeat and verify MeshKore routing
        shell: bash
        run: |
          set +e
          for i in 1 2 3 4 5; do
            sleep 45
            echo "CHECK=$i"
            curl -sS --retry 3 --retry-delay 2 --retry-all-errors --max-time 30 https://api.meshkore.com/v1/agents/delta-witness-ruphussten > /tmp/agent.json
            cat /tmp/agent.json; echo
            node - <<'NODE'
          const x=JSON.parse(require('fs').readFileSync('/tmp/agent.json','utf8')).agent||{};
          console.log(JSON.stringify({live:x.live,endpoint:x.endpoint,last_active:x.last_active,pubkey:!!x.pubkey,updated_at:x.updated_at}));
          if (x.live===1 && x.endpoint) process.exit(0); else process.exit(1);
          NODE
            if [ $? -eq 0 ]; then
              echo 'MESHKORE_LIVE=1'
              curl -sS --retry 3 --retry-delay 2 --retry-all-errors --max-time 30 -w '\nHTTP=%{http_code}\n' https://meshkore.com/agent/delta-witness-ruphussten/.well-known/agent.json
              exit 0
            fi
          done
          echo 'MESHKORE_LIVE=0_AFTER_ENDPOINT_FIX'
          curl -sS --retry 3 --retry-delay 2 --retry-all-errors --max-time 30 -w '\nHTTP=%{http_code}\n' https://api.meshkore.com/v1/agents/delta-witness-ruphussten/identity
          exit 0
