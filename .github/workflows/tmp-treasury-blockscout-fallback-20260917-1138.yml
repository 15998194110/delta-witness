name: TEMP DELTA Treasury Blockscout fallback 2026-09-17 1138 JST
on:
  push:
    branches: [master]
    paths: [.github/workflows/tmp-treasury-blockscout-fallback-20260917-1138.yml]
permissions:
  contents: read
jobs:
  fallback:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read Base head and canonical USDC transfers to Treasury
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/delta-treasury-fallback
          HEAD_URL='https://base.blockscout.com/api?module=block&action=eth_block_number'
          TX_URL='https://base.blockscout.com/api?module=account&action=tokentx&address=0x1990e21bc219696ff7fbc26527dbaed335ac6367&contractaddress=0x833589fcd6edb6e08f4c7c32d4f71b54bda02913&startblock=51395633&endblock=99999999&sort=asc'
          curl -fsS --connect-timeout 10 --max-time 30 --retry 2 --retry-delay 2 --retry-all-errors "$HEAD_URL" -o /tmp/delta-treasury-fallback/head.json
          curl -fsS --connect-timeout 10 --max-time 30 --retry 2 --retry-delay 2 --retry-all-errors "$TX_URL" -o /tmp/delta-treasury-fallback/transfers.json
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const head=JSON.parse(fs.readFileSync('/tmp/delta-treasury-fallback/head.json','utf8'));
          const tx=JSON.parse(fs.readFileSync('/tmp/delta-treasury-fallback/transfers.json','utf8'));
          const treasury='0x1990e21bc219696ff7fbc26527dbaed335ac6367';
          const usdc='0x833589fcd6edb6e08f4c7c32d4f71b54bda02913';
          const headHex=head.result;
          const latest=typeof headHex==='string'&&headHex.startsWith('0x')?parseInt(headHex,16):Number(headHex);
          const rows=Array.isArray(tx.result)?tx.result:[];
          const incoming=rows.filter(r=>String(r.to||'').toLowerCase()===treasury && String(r.contractAddress||'').toLowerCase()===usdc && Number(r.blockNumber)>=51395633 && Number(r.blockNumber)<=latest);
          const out={ok:Number.isFinite(latest),checked_at:new Date().toISOString(),source:'Base Blockscout official explorer API',start_block:51395633,latest_block:latest,raw_status:tx.status,raw_message:tx.message,returned_rows:rows.length,canonical_usdc_incoming_candidates:incoming.length,transfers:incoming.map(r=>({tx_hash:r.hash,block_number:Number(r.blockNumber),from:String(r.from||'').toLowerCase(),to:String(r.to||'').toLowerCase(),raw_amount:String(r.value),token_symbol:r.tokenSymbol,token_decimal:r.tokenDecimal,contract_address:String(r.contractAddress||'').toLowerCase()}))};
          fs.writeFileSync('/tmp/delta-treasury-fallback/summary.json',JSON.stringify(out,null,2));
          console.log(JSON.stringify(out,null,2));
          if(!out.ok) process.exit(2);
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: delta-treasury-blockscout-${{ github.run_id }}
          path: /tmp/delta-treasury-fallback/
          retention-days: 7
