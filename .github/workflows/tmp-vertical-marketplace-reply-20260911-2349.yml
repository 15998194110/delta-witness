name: TMP Vertical Marketplace explicit-interest reply 20260911-2349

on:
  push:
    branches: ["master"]
    paths:
      - '.github/workflows/tmp-vertical-marketplace-reply-20260911-2349.yml'

permissions:
  contents: read

jobs:
  reply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - name: Verify current DELTA owner pricing before external communication
        run: |
          node scripts/check-owner-pricing.mjs
          node scripts/verify-owner-pricing-live.mjs
      - name: Advance existing Vertical Marketplace inquiry
        shell: bash
        run: |
          set -u
          THREAD='https://verticalmarketplace.ai/api/inquiries/0e333a7e-7cf3-4840-aac9-932848862b39'
          API="$THREAD/messages"
          MESSAGE='Thanks — the native x402 provider path is the fit. Please prioritize POST https://delta-witness-api.ruphussten.workers.dev/v1/capture first; its current owner-authorized price is 1 USDC on Base. We are not enabling the current relay-wrapper sequence because a 95% provider payout followed by a self-funded canonical x402 call is structurally negative-margin at the authorized price and would require self-payment, which our operating policy excludes. Please keep the native-provider feature request open. When that listing type is available, we can provide the canonical x402 URL, Treasury/network/USDC metadata, proof schema and test vectors immediately. Public Preflight would be the second route to add.'
          payload=$(jq -nc --arg message "$MESSAGE" '{message:$message}')
          code=000
          : >/tmp/vm-reply.json
          for i in 1 2 3 4; do
            code=$(curl --connect-timeout 10 --max-time 30 -sS -o /tmp/vm-reply.json -w '%{http_code}' -X POST "$API" -H 'content-type: application/json' --data "$payload") || code=000
            echo "VERTICAL_MARKETPLACE_REPLY attempt=$i http=$code body=$(cat /tmp/vm-reply.json 2>/dev/null || true)"
            case "$code" in
              200|201|202|204|409) break;;
              429|500|502|503|504|000) sleep $((i*3));;
              *) break;;
            esac
          done
          case "$code" in
            200|201|202|204|409) ;;
            *) echo "VERTICAL_MARKETPLACE_REPLY degraded=true recoverable=true http=$code"; exit 1;;
          esac
          read_code=$(curl --connect-timeout 10 --max-time 30 -sS -o /tmp/vm-thread.json -w '%{http_code}' "$THREAD") || read_code=000
          echo "VERTICAL_MARKETPLACE_READBACK http=$read_code body=$(cat /tmp/vm-thread.json 2>/dev/null || true)"
          case "$read_code" in
            200) ;;
            *) echo "VERTICAL_MARKETPLACE_READBACK degraded=true recoverable=true http=$read_code"; exit 1;;
          esac
