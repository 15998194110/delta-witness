name: DELTA one-shot turn11 reconcile
on:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/_temp-turn11-reconcile.yml"
permissions:
  contents: write
concurrency:
  group: delta-turn11-reconcile
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Probe production pricing and payment terms
        run: |
          set -euo pipefail
          BASE=https://delta-witness-api.ruphussten.workers.dev
          node <<'NODE' > /tmp/quotes.json
          const base='https://delta-witness-api.ruphussten.workers.dev';
          const products=['capture','preflight','guarded-action-pilot'];
          const out={};
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function get(url, init={}) { let errors=[]; for(let i=1;i<=4;i++){try{const c=new AbortController();const t=setTimeout(()=>c.abort(),12000);const r=await fetch(url,{...init,signal:c.signal});clearTimeout(t);const text=await r.text();if([429,500,502,503,504].includes(r.status)){errors.push(`http_${r.status}`);await sleep(i*750);continue;}return {status:r.status,headers:Object.fromEntries(r.headers),text};}catch(e){errors.push(String(e));await sleep(i*750)}} throw new Error(errors.join(' | ')); }
          for (const p of products) { const r=await get(`${base}/v1/quote?product=${p}`); let body; try{body=JSON.parse(r.text)}catch{body={raw:r.text}}; out[p]={status:r.status,body}; }
          for (const path of ['/v1/capture','/v1/preflight','/v1/guarded-action-pilot']) { const r=await get(`${base}${path}`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(path.includes('capture')?{url:'https://example.com'}:{url:'https://example.com',expected:{contains:['Example Domain']}})}); out[path]={status:r.status,payment_required:r.headers['payment-required']||null,body:r.text.slice(0,1200)}; }
          console.log(JSON.stringify(out,null,2));
          NODE
      - name: Audit paid funnel telemetry independently
        run: node scripts/query-revenue-candidates.mjs > /tmp/telemetry.json
      - name: Reconcile canonical Base USDC Treasury independently
        run: |
          set -euo pipefail
          node <<'NODE' > /tmp/treasury.json
          const TREASURY='0x1990e21bc219696ff7fbc26527dbaed335ac6367';
          const USDC='0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913';
          const START=51065282n;
          const TRANSFER='0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef';
          const TO_TOPIC='0x'+'0'.repeat(24)+TREASURY.slice(2).toLowerCase();
          const RPCS=['https://mainnet.base.org','https://base-rpc.publicnode.com','https://1rpc.io/base'];
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function rpc(method,params){const errors=[];for(const url of RPCS){for(let a=1;a<=3;a++){try{const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),12000);const res=await fetch(url,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method,params}),signal:ctl.signal});clearTimeout(t);const text=await res.text();if(!res.ok)throw new Error(`http_${res.status}:${text.slice(0,120)}`);const body=JSON.parse(text);if(body.error)throw new Error(JSON.stringify(body.error));if(body.result===undefined)throw new Error('missing_result');return body.result}catch(e){errors.push(`${url}#${a}:${e?.message||e}`);if(a<3)await sleep(750*a)}}}throw new Error(`${method} failed: ${errors.join(' | ')}`)}
          const hex=n=>'0x'+n.toString(16);
          const latest=BigInt(await rpc('eth_blockNumber',[]));
          const all=[];
          if(latest>=START){for(let from=START;from<=latest;from+=1500n){const to=(from+1499n>latest?latest:from+1499n);const logs=await rpc('eth_getLogs',[{address:USDC,fromBlock:hex(from),toBlock:hex(to),topics:[TRANSFER,null,TO_TOPIC]}]);all.push(...logs)}}
          const incoming=all.map(log=>({block_number:Number(BigInt(log.blockNumber)),tx_hash:log.transactionHash,from:'0x'+log.topics[1].slice(-40),to:TREASURY,raw_amount:BigInt(log.data).toString(),usdc:Number(BigInt(log.data))/1e6}));
          console.log(JSON.stringify({ok:true,canonical_asset:USDC,treasury:TREASURY,from_block:Number(START),latest_block:Number(latest),incoming_count:incoming.length,incoming},null,2));
          NODE
      - name: Persist sanitized one-shot result for controller readback
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const result={
            generated_at:new Date().toISOString(),
            quotes:JSON.parse(fs.readFileSync('/tmp/quotes.json','utf8')),
            telemetry:JSON.parse(fs.readFileSync('/tmp/telemetry.json','utf8')),
            treasury:JSON.parse(fs.readFileSync('/tmp/treasury.json','utf8'))
          };
          fs.writeFileSync('docs/_temp-turn11-result.json',JSON.stringify(result,null,2)+'\n');
          NODE
          git config user.name "DELTA Automation"
          git config user.email "actions@users.noreply.github.com"
          git add docs/_temp-turn11-result.json
          git commit -m "ops: record one-shot turn11 reconcile result"
          git push
