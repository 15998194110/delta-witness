name: TEMP DELTA sprint turn9 funnel 20260915-1010
on:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/tmp-delta-sprint-turn9-funnel-20260915-1010.yml"

permissions:
  contents: read

jobs:
  funnel:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - name: Audit paid funnel candidates
        run: node scripts/query-revenue-candidates.mjs
