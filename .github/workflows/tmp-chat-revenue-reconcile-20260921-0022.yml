name: TMP DELTA revenue reconcile 20260921 0022 JST

on:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/tmp-chat-revenue-reconcile-20260921-0022.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Owner pricing source check
        run: node scripts/check-owner-pricing.mjs
      - name: Live public 402 pricing check without payment
        run: node scripts/verify-owner-pricing-live.mjs
      - name: Canonical Base USDC Treasury reconciliation
        env:
          DELTA_TREASURY_LOOKBACK_BLOCKS: '10000'
          DELTA_TREASURY_CHUNK_BLOCKS: '1900'
        run: node scripts/reconcile-treasury.mjs
      - name: State safety boundary
        if: always()
        run: echo 'Read-only pricing and canonical-USDC Treasury reconciliation only; no wallet, signature, payment, asset movement, KYC, deployment, listing write or customer action occurred.' >> "$GITHUB_STEP_SUMMARY"
