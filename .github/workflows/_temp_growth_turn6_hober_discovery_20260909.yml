name: DELTA Turn 6 Hober Discovery

on:
  push:
    paths:
      - '.github/workflows/_temp_growth_turn6_hober_discovery_20260909.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Inspect Hober marketplace public job data and route contracts
        shell: bash
        run: |
          set +e
          APP='https://app.hober.dev'
          curl --retry 4 --retry-delay 2 --retry-all-errors -L -sS --max-time 40 "$APP/marketplace/jobs" -o /tmp/jobs.html || true
          curl --retry 4 --retry-delay 2 --retry-all-errors -L -sS --max-time 40 "$APP/marketplace/register" -o /tmp/register.html || true
          echo "HOBER_JOBS_HTML_BYTES=$(wc -c </tmp/jobs.html)"
          echo '=== SERVER-RENDERED JOB SIGNALS ==='
          python - <<'PY'
          import re, html, pathlib, json
          t=html.unescape(pathlib.Path('/tmp/jobs.html').read_text(errors='ignore'))
          needles=['USDC','budget','open','job','deadline','escrow','agent','bid','capabilities','price']
          for n in needles:
              print(n, t.lower().count(n.lower()))
          # emit compact visible text fragments likely to contain job rows, excluding script bulk where possible
          s=re.sub(r'<script[^>]*>.*?</script>',' ',t,flags=re.S|re.I)
          s=re.sub(r'<style[^>]*>.*?</style>',' ',s,flags=re.S|re.I)
          s=re.sub(r'<[^>]+>',' ',s)
          s=re.sub(r'\s+',' ',s)
          print('VISIBLE_TEXT',s[:12000])
          # inspect hydration JSON-ish text around economic words
          for m in re.finditer(r'(?i)(budget|usdc|escrow|open job|bid)',t):
              a=max(0,m.start()-300); b=min(len(t),m.start()+900)
              frag=re.sub(r'\s+',' ',t[a:b])
              print('HYDRATION_FRAGMENT',frag[:1300])
              if m.start()>50000: break
          PY
          echo '=== DISCOVER JS CHUNKS AND API ROUTES ==='
          grep -oE 'src="[^"]+\.js[^"]*"' /tmp/jobs.html | sed 's/^src="//;s/"$//' | head -n 60 >/tmp/chunks.txt
          while read -r p; do
            case "$p" in http*) u="$p";; *) u="$APP$p";; esac
            f="/tmp/$(echo "$p"|tr '/?&=' '____')"
            curl --retry 2 --retry-delay 1 --retry-all-errors -sS --max-time 30 "$u" -o "$f" || continue
            grep -oE 'https://api\.hober\.dev[^"'"'"' ]+|/api/[A-Za-z0-9_?&=./:{}-]+|/v1/[A-Za-z0-9_?&=./:{}-]+' "$f" 2>/dev/null | sort -u | head -n 100
          done </tmp/chunks.txt | sort -u
          echo '=== AUTH/REGISTRATION SIGNALS ==='
          python - <<'PY'
          import re, html, pathlib
          t=html.unescape(pathlib.Path('/tmp/register.html').read_text(errors='ignore'))
          s=re.sub(r'<script[^>]*>.*?</script>',' ',t,flags=re.S|re.I)
          s=re.sub(r'<[^>]+>',' ',s); s=re.sub(r'\s+',' ',s)
          print(s[:10000])
          PY
          exit 0
