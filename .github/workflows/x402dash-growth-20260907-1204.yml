name: DELTA x402dash growth 20260907-1204

on:
  push:
    paths:
      - '.github/workflows/x402dash-growth-20260907-1204.yml'

permissions:
  contents: read

jobs:
  advance:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify production x402 surfaces
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://delta-witness-api.ruphussten.workers.dev'
          check() {
            local path="$1" body="$2" expected="$3"
            code=$(curl -sS --retry 3 --retry-all-errors --max-time 20 -o /tmp/body.json -D /tmp/headers.txt -w '%{http_code}' -X POST "$BASE$path" -H 'content-type: application/json' -d "$body")
            echo "$path HTTP=$code"
            test "$code" = "402"
            grep -qi 'payment-required\|x-payment-required' /tmp/headers.txt
            grep -q "$expected" /tmp/body.json
          }
          check '/v1/capture' '{"url":"https://example.com"}' '30000'
          check '/v1/preflight' '{"url":"https://example.com","expected":{"contains":["Example Domain"]}}' '30000'
          check '/v1/guarded-action-pilot' '{"urls":["https://example.com"],"preflight":{"url_index":0,"expected":{"contains":["Example Domain"]}}}' '10000000'

      - name: Submit three DELTA endpoints to x402dash
        shell: bash
        run: |
          set -u
          API='https://api.x402dash.com/v1/register'
          submit() {
            local url="$1" name="$2" description="$3" tags="$4"
            local payload out code ok=0
            payload=$(python3 - "$url" "$name" "$description" "$tags" <<'PY'
          import json,sys
          print(json.dumps({"url":sys.argv[1],"name":sys.argv[2],"description":sys.argv[3],"tags":sys.argv[4].split(',')}))
          PY
          )
            for attempt in 1 2 3 4; do
              code=$(curl -sS --max-time 25 -o /tmp/register.json -w '%{http_code}' -X POST "$API" -H 'content-type: application/json' --data "$payload" || printf '000')
              out=$(cat /tmp/register.json 2>/dev/null || true)
              echo "REGISTER name=$name attempt=$attempt HTTP=$code body=$out"
              case "$code" in
                200|201|202|409) ok=1; break ;;
              esac
              sleep $((attempt * 2))
            done
            if [ "$ok" -ne 1 ]; then
              echo "CHANNEL_DEGRADED x402dash register name=$name final_http=$code"
            fi
          }
          submit 'https://delta-witness-api.ruphussten.workers.dev/v1/capture' 'DELTA Witness Page-State Capture' 'Independent page-state capture with cryptographic proof references, paid per request over x402 on Base.' 'browser,verification,proof,x402'
          submit 'https://delta-witness-api.ruphussten.workers.dev/v1/preflight' 'DELTA Witness Preflight Verification' 'Deterministic preflight verification of public page conditions before agent actions, paid per request over x402 on Base.' 'browser,preflight,verification,x402'
          submit 'https://delta-witness-api.ruphussten.workers.dev/v1/guarded-action-pilot' 'DELTA Witness Guarded Action Pilot' 'Guarded-action pilot producing independent witness receipts plus a deterministic preflight verdict, paid over x402 on Base.' 'browser,workflow,security,x402'

      - name: Read back x402dash public index
        shell: bash
        run: |
          set -u
          for q in 'delta-witness-api.ruphussten.workers.dev' 'DELTA%20Witness'; do
            url="https://api.x402dash.com/v1/endpoints?limit=50&q=$q"
            code=$(curl -sS --retry 3 --retry-all-errors --max-time 20 -o /tmp/endpoints.json -w '%{http_code}' "$url" || printf '000')
            echo "X402DASH_READBACK q=$q HTTP=$code"
            cat /tmp/endpoints.json 2>/dev/null || true
            echo
          done

      - name: Reconcile Base Treasury incoming canonical USDC
        shell: bash
        run: |
          set -u
          URL='https://base.blockscout.com/api/v2/addresses/0x1990e21bc219696ff7fbc26527dbaed335ac6367/token-transfers?type=ERC-20'
          ok=0
          for attempt in 1 2 3 4; do
            code=$(curl -sS --max-time 25 -o /tmp/transfers.json -w '%{http_code}' "$URL" || printf '000')
            echo "TREASURY_FETCH attempt=$attempt HTTP=$code"
            if [ "$code" = "200" ]; then ok=1; break; fi
            sleep $((attempt * 2))
          done
          if [ "$ok" -ne 1 ]; then
            echo 'TREASURY_RECONCILIATION_DEGRADED'
            exit 0
          fi
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/transfers.json'))
          items=d.get('items',[])
          usdc='0x833589fcd6edb6e08f4c7c32d4f71b54bda02913'
          addr='0x1990e21bc219696ff7fbc26527dbaed335ac6367'
          rows=[]
          for x in items:
              token=x.get('token') or {}
              ta=(token.get('address_hash') or token.get('address') or '').lower()
              to=x.get('to') or {}
              tohash=(to.get('hash') if isinstance(to,dict) else to or '').lower()
              if ta != usdc or tohash != addr: continue
              dec=int(token.get('decimals') or 6)
              total=x.get('total') or {}
              raw=total.get('value') if isinstance(total,dict) else x.get('value')
              try: amount=int(raw)/(10**dec)
              except Exception: amount=raw
              fr=x.get('from') or {}
              rows.append({
                  'tx_hash':x.get('transaction_hash'),
                  'timestamp':x.get('timestamp'),
                  'from':fr.get('hash') if isinstance(fr,dict) else fr,
                  'amount_usdc':amount
              })
          print('TREASURY_RESULT='+json.dumps(rows[:50],separators=(',',':')))
          PY
