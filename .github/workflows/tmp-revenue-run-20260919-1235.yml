name: TEMP DELTA revenue reconciliation 20260919-1235
on:
  push:
    branches: [master]
    paths: [.github/workflows/tmp-revenue-run-20260919-1235.yml]
permissions:
  contents: read
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DELTA_PARTNER_SECRET: ${{ secrets.DELTA_PARTNER_SECRET }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DELTA_TREASURY_LOOKBACK_BLOCKS: '70000'
    steps:
      - uses: actions/checkout@v6
        with: {persist-credentials: false}
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - name: Verify owner pricing and live 402
        run: node scripts/check-owner-pricing.mjs && node scripts/verify-owner-pricing-live.mjs
      - name: Paid funnel
        run: node scripts/query-revenue-candidates.mjs
      - name: AgentPact demand
        continue-on-error: true
        run: node scripts/scan-agentpact-demand.mjs
      - name: External funded demand
        continue-on-error: true
        run: node scripts/scan-external-funded-demand.mjs
      - name: Treasury reconcile
        run: node scripts/reconcile-treasury.mjs
