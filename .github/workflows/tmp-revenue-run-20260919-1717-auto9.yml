name: TEMP DELTA revenue reconciliation 20260919-1717-auto9
on:
  push:
    branches: [master]
    paths: [.github/workflows/tmp-revenue-run-20260919-1717-auto9.yml]
permissions:
  contents: read
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with: {persist-credentials: false}
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - name: Owner pricing policy
        run: node scripts/check-owner-pricing.mjs
      - name: Verify live prices without payment
        run: node scripts/verify-owner-pricing-live.mjs | tee /tmp/pricing-live.json
      - name: AgentPact demand
        continue-on-error: true
        run: node scripts/scan-agentpact-demand.mjs | tee /tmp/agentpact.json
      - name: AgentExchange demand
        continue-on-error: true
        run: node scripts/scan-agentexchange-demand.mjs | tee /tmp/agentexchange.json
      - name: External funded demand
        continue-on-error: true
        run: node scripts/scan-external-funded-demand.mjs | tee /tmp/external-funded.json
      - name: Paid funnel candidates
        continue-on-error: true
        run: node scripts/query-revenue-candidates.mjs | tee /tmp/revenue-candidates.json
      - name: Treasury reconciliation
        env:
          DELTA_TREASURY_LOOKBACK_BLOCKS: '70000'
          DELTA_TREASURY_CHUNK_BLOCKS: '1900'
        run: node scripts/reconcile-treasury.mjs | tee /tmp/treasury.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: delta-revenue-auto9-${{ github.run_id }}
          path: |
            /tmp/pricing-live.json
            /tmp/agentpact.json
            /tmp/agentexchange.json
            /tmp/external-funded.json
            /tmp/revenue-candidates.json
            /tmp/treasury.json
          if-no-files-found: warn
          retention-days: 7
