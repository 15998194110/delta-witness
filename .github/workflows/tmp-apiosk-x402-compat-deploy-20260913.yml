# Phase 2 marker: 2026-09-13T10:30+09:00
name: ONE-SHOT - DELTA x402 discovery compatibility + Apiosk submit
on:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/tmp-apiosk-x402-compat-deploy-20260913.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: delta-one-shot-x402-discovery-compat
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Read owner authority and verify current live prices
        run: |
          test -s AGENTS.md
          test -s docs/pricing-policy-2026-09-10.md
          node scripts/check-owner-pricing.mjs
          node scripts/verify-owner-pricing-live.mjs

      - name: Add non-settling GET discovery probes for POST-only paid resources
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('src/index.ts')
          s = p.read_text()
          anchor = '''app.use("/v1/capture", (c, next) => prevalidate("capture", c, next));'''
          block = '''// Discovery/catalog health probes may issue GET even when the advertised paid
// operation is POST. Never forward a caller payment header on this compatibility
// path: each GET is converted into a fresh internal *unpaid* POST so it can only
// receive the canonical 402 challenge and can never settle or execute work.
async function unpaidDiscoveryProbe(c: AppContext, route: "/v1/capture" | "/v1/preflight" | "/v1/guarded-action-pilot"): Promise<Response> {
  const headers = new Headers({
    accept: "application/json",
    "x-delta-channel": "discovery-probe",
  });
  const response = await app.fetch(new Request(`${origin(c.env)}${route}`, {
    method: "POST",
    headers,
  }), c.env, c.executionCtx);
  if (response.status !== 402) {
    return c.json({ error: "discovery_probe_failed", route, upstream_status: response.status }, 502);
  }
  response.headers.set("cache-control", "private, no-store");
  return response;
}

app.get("/v1/capture", (c) => unpaidDiscoveryProbe(c, "/v1/capture"));
app.get("/v1/preflight", (c) => unpaidDiscoveryProbe(c, "/v1/preflight"));
app.get("/v1/guarded-action-pilot", (c) => unpaidDiscoveryProbe(c, "/v1/guarded-action-pilot"));

'''
          if block in s:
              print('probe compatibility already present; idempotent no-op')
          else:
              if anchor not in s:
                  raise SystemExit('paid route anchor not found; refusing stale patch')
              s = s.replace(anchor, block + anchor, 1)
              p.write_text(s)
          PY

      - name: Run regression suite and static safety gate
        run: |
          npm ci
          npm run verify
          node <<'NODE'
          const fs = require('node:fs');
          const s = fs.readFileSync('src/index.ts','utf8');
          for (const token of [
            'async function unpaidDiscoveryProbe',
            'method: "POST"',
            '"x-delta-channel": "discovery-probe"',
            'app.get("/v1/capture"',
            'app.get("/v1/preflight"',
            'app.get("/v1/guarded-action-pilot"',
          ]) if (!s.includes(token)) throw new Error(`missing safety token: ${token}`);
          const fn = s.slice(s.indexOf('async function unpaidDiscoveryProbe'), s.indexOf('app.use("/v1/capture"'));
          if (/getPaymentHeader|payment-signature|x-payment/i.test(fn)) throw new Error('GET probe must not forward or consume payment credentials');
          NODE

      - name: Refuse stale deployment on concurrent source changes
        run: |
          git fetch origin master
          test "$(git rev-parse origin/master)" = "$GITHUB_SHA" || {
            echo 'Master advanced concurrently; refusing stale deployment.'
            exit 75
          }

      - name: Commit probe compatibility to canonical master
        run: |
          if git diff --quiet -- src/index.ts; then
            echo 'No source change required.'
          else
            git config user.name 'DELTA Commercial Operator'
            git config user.email 'actions@users.noreply.github.com'
            git add src/index.ts
            git commit -m 'feat: expose non-settling x402 discovery probes on paid routes'
            git push origin HEAD:master
          fi

      - name: Deploy canonical source to Cloudflare
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx wrangler deploy

      - name: Verify POST prices and GET probes live
        run: |
          node scripts/verify-owner-pricing-live.mjs
          node <<'NODE'
          const base='https://delta-witness-api.ruphussten.workers.dev';
          const cases=[['/v1/capture',1],['/v1/preflight',5],['/v1/guarded-action-pilot',10]];
          for (const [path,price] of cases) {
            const r=await fetch(`${base}${path}`, {method:'GET',signal:AbortSignal.timeout(20000)});
            const body=await r.json().catch(()=>({}));
            if (r.status!==402) throw new Error(`${path} GET status ${r.status} != 402`);
            if (!r.headers.get('payment-required')) throw new Error(`${path} GET missing payment-required header`);
            if (Number(body.price_usd)!==price) throw new Error(`${path} GET price ${body.price_usd} != ${price}`);
            if (body.payment_flow!=='upfront') throw new Error(`${path} GET payment flow mismatch`);
            console.log('GET_DISCOVERY_PROBE_OK',path,price);
          }
          NODE
