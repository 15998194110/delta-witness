name: TEMP DELTA run9 current revenue reconcile
on:
  push:
    branches: [master]
    paths: [.github/workflows/tmp-run9-reconcile-20260917.yml]
permissions:
  contents: read
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with: {persist-credentials: false}
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - name: Owner pricing and live x402 integrity
        run: |
          mkdir -p /tmp/delta-run9
          node scripts/check-owner-pricing.mjs | tee /tmp/delta-run9/price-source.json
          node scripts/verify-owner-pricing-live.mjs | tee /tmp/delta-run9/price-live.json
      - name: Paid funnel
        run: node scripts/query-revenue-candidates.mjs | tee /tmp/delta-run9/revenue-candidates.json
      - name: Independent Treasury reconciliation
        env:
          DELTA_TREASURY_LOOKBACK_BLOCKS: '90000'
          DELTA_TREASURY_CHUNK_BLOCKS: '1900'
        run: node scripts/reconcile-treasury.mjs | tee /tmp/delta-run9/treasury.json
      - name: AgentPact funded demand
        continue-on-error: true
        run: node scripts/scan-agentpact-demand.mjs | tee /tmp/delta-run9/agentpact.json
      - name: Agent Exchange funded demand
        continue-on-error: true
        run: node scripts/scan-agentexchange-demand.mjs | tee /tmp/delta-run9/agentexchange.json
      - name: Additional escrow-backed demand
        continue-on-error: true
        run: node scripts/scan-external-funded-demand.mjs | tee /tmp/delta-run9/external-funded.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: delta-run9-evidence-${{ github.run_id }}
          path: /tmp/delta-run9/
          retention-days: 7
