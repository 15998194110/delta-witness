name: DELTA agent-tools distribution fix 20260907-0918
on:
  push:
    paths:
      - '.github/workflows/automation-agent-tools-fix-20260907-0918.yml'
permissions:
  contents: read
jobs:
  distribute:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Submit DELTA x402 services to agent-tools.cloud
        shell: bash
        run: |
          set -u
          submit () {
            label="$1"; payload="$2"
            echo "=== SUBMIT $label ==="
            code=$(curl -sS -o /tmp/out.json -w '%{http_code}' --max-time 25 \
              -X POST 'https://agent-tools.cloud/api/v1/submit' \
              -H 'content-type: application/json' \
              --data-binary "$payload") || code='transport_error'
            echo "HTTP=$code"
            cat /tmp/out.json 2>/dev/null || true
            echo
          }
          submit 'capture' '{"name":"DELTA Witness Page-State Capture","url":"https://delta-witness-api.ruphussten.workers.dev/v1/capture","description":"Browser-rendered page-state evidence and timestamped proof for autonomous agents; Base x402 USDC.","category":"agent-verification-security","chains":["base"],"price_usdc":0.03,"contact":"ruphussten85@gmail.com"}'
          submit 'preflight' '{"name":"DELTA Witness Preflight Verification","url":"https://delta-witness-api.ruphussten.workers.dev/v1/preflight","description":"Pre-action verification against deterministic page expectations for autonomous browser workflows; Base x402 USDC.","category":"agent-verification-security","chains":["base"],"price_usdc":0.03,"contact":"ruphussten85@gmail.com"}'
          submit 'guarded-action-pilot' '{"name":"DELTA Witness Guarded Action Pilot","url":"https://delta-witness-api.ruphussten.workers.dev/v1/guarded-action-pilot","description":"Higher-value guarded-action witness pilot for consequential autonomous actions; Base x402 USDC.","category":"agent-verification-security","chains":["base"],"price_usdc":10,"contact":"ruphussten85@gmail.com"}'
      - name: Exact readback from agent-tools.cloud
        shell: bash
        run: |
          set -euo pipefail
          curl -sS --fail --max-time 25 --get 'https://agent-tools.cloud/api/v1/search' \
            --data-urlencode 'q=delta-witness-api.ruphussten.workers.dev' \
            --data-urlencode 'limit=100' -o /tmp/search.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/search.json'))
          domain='delta-witness-api.ruphussten.workers.dev'
          matches=[]
          for s in d.get('services',[]):
              hay=' '.join(str(s.get(k,'')) for k in ('name','url','description','well_known_url','mcp_url'))
              if domain in hay:
                  matches.append({k:s.get(k) for k in ('id','slug','name','url','health','price_min','price_max','chains','tx_30d','payto_tx_30d','payto_payers_30d','quality_score','conformance','service_card_url')})
          print('AGENT_TOOLS_MATCHES='+json.dumps(matches,separators=(',',':')))
          PY
          curl -sS --fail --max-time 25 --get 'https://agent-tools.cloud/api/v1/broker/recommend' \
            --data-urlencode 'q=browser page-state evidence preflight verification autonomous action' \
            --data-urlencode 'chain=base' \
            --data-urlencode 'limit=20' -o /tmp/broker.json || true
          python3 - <<'PY'
          import json,os
          if not os.path.exists('/tmp/broker.json'):
              print('BROKER_MATCHES=[]'); raise SystemExit
          try: d=json.load(open('/tmp/broker.json'))
          except Exception: print('BROKER_MATCHES=[]'); raise SystemExit
          domain='delta-witness-api.ruphussten.workers.dev'
          items=d.get('services', d.get('recommendations', d if isinstance(d,list) else []))
          out=[]
          if isinstance(items,list):
              for s in items:
                  hay=json.dumps(s,ensure_ascii=False)
                  if domain in hay: out.append(s)
          print('BROKER_MATCHES='+json.dumps(out,separators=(',',':')))
          PY
