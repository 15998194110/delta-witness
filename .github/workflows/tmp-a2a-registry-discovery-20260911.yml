name: TMP A2A Registry discovery 20260911
on:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/tmp-a2a-registry-discovery-20260911.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - name: Verify current owner pricing before any possible listing work
        run: |
          node scripts/check-owner-pricing.mjs
          node scripts/verify-owner-pricing-live.mjs
      - name: Inspect public submit contract without writing registry state
        shell: bash
        run: |
          set -euo pipefail
          SITE='https://www.a2a-registry.org'
          curl --retry 3 --retry-delay 2 --retry-all-errors -fsSL "$SITE/submit" -o /tmp/submit.html
          ASSET=$(grep -oE 'src="[^"]+/app/submit/page-[^"]+\.js"' /tmp/submit.html | head -1 | sed -E 's/^src="|"$//g')
          test -n "$ASSET"
          curl --retry 3 --retry-delay 2 --retry-all-errors -fsSL "$SITE$ASSET" -o /tmp/submit.js
          node - <<'NODE'
          const fs = require('fs');
          const s = fs.readFileSync('/tmp/submit.js','utf8');
          for (const needle of ['/public/ingest/scan','/public/ingest/submit-and-claim','submit-and-claim']) {
            let pos = 0, n = 0;
            while ((pos = s.indexOf(needle,pos)) >= 0 && n < 6) {
              console.log(`=== ${needle} hit ${++n} ===`);
              console.log(s.slice(Math.max(0,pos-1200), Math.min(s.length,pos+2200)));
              pos += needle.length;
            }
          }
          NODE
