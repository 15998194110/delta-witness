name: TMP A2A Registry discovery 20260911
on:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/tmp-a2a-registry-discovery-20260911.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - name: Verify current owner pricing before listing write
        run: |
          node scripts/check-owner-pricing.mjs
          node scripts/verify-owner-pricing-live.mjs
      - name: Submit canonical DELTA URL only if absent
        shell: bash
        run: |
          set -euo pipefail
          API='https://api.a2a-registry.org'
          URL='https://delta-witness-api.ruphussten.workers.dev'
          EXISTING=$(curl --retry 3 --retry-delay 2 --retry-all-errors -fsS --get "$API/public/agents" --data-urlencode 'q=ruphussten')
          echo "A2A_EXISTING_SEARCH=$EXISTING"
          if printf '%s' "$EXISTING" | grep -qiE 'delta[- ]witness|ruphussten'; then
            echo 'A2A_DUPLICATE_SUPPRESSED=true'
            exit 0
          fi

          SCAN=$(curl --retry 3 --retry-delay 2 --retry-all-errors -fsS -X POST "$API/public/ingest/scan" -H 'content-type: application/json' --data "{\"url\":\"$URL\"}")
          echo "A2A_SCAN=$SCAN"
          node -e 'const x=JSON.parse(process.argv[1]); if(!x.success || !x.data?.found) process.exit(1)' "$SCAN"

          SUBMIT=$(curl --retry 3 --retry-delay 2 --retry-all-errors -fsS -X POST "$API/public/ingest/submit-and-claim" -H 'content-type: application/json' --data "{\"url\":\"$URL\"}")
          echo "A2A_SUBMIT=$SUBMIT"
          node -e 'const x=JSON.parse(process.argv[1]); if(!x.success) process.exit(1)' "$SUBMIT"

          sleep 2
          for q in ruphussten delta-witness 'DELTA Witness'; do
            READBACK=$(curl --retry 3 --retry-delay 2 --retry-all-errors -fsS --get "$API/public/agents" --data-urlencode "q=$q")
            echo "A2A_READBACK q=$q $READBACK"
          done
