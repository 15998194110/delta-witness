name: DELTA Fresh Growth Audit RPC
on:
  push:
    paths:
      - '.github/workflows/_temp_growth_audit_rpc_20260908.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Audit paid telemetry and canonical Base USDC logs
        shell: bash
        run: |
          set -u
          DB='c9431b00-27c5-4609-9f3d-6af20cb162df'
          TREASURY='1990e21bc219696ff7fbc26527dbaed335ac6367'
          USDC='0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913'
          RPC='https://mainnet.base.org'
          TRANSFER_TOPIC='0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef'

          echo 'TELEMETRY_BEGIN'
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ] && [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            SQL="SELECT id,created_at,event,route,channel,partner,success,reason,gross_usd,browser_ms,storage_bytes,variable_cost_usd,contribution_margin_usd FROM telemetry_events WHERE created_at > '2026-09-08 00:13:17' AND event IN ('qualified_request','payment_verified','capture_started','capture_completed','capture_failed','proof_opened','repeat_call') ORDER BY id ASC"
            jq -n --arg sql "$SQL" '{sql:$sql}' >/tmp/query.json
            curl --retry 3 --retry-delay 2 --retry-all-errors -fsS --max-time 30 \
              -X POST "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DB}/query" \
              -H "authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'content-type: application/json' \
              --data-binary @/tmp/query.json | jq '{success,errors,result:[.result[]|{success,results}]}' || true
          else
            echo 'TELEMETRY_UNAVAILABLE=missing_cloudflare_secrets'
          fi
          echo 'TELEMETRY_END'

          FROM_DEC=51018061
          FROM_HEX=$(printf '0x%x' "$FROM_DEC")
          TO_TOPIC="0x000000000000000000000000${TREASURY}"
          echo "BASE_FROM=$FROM_HEX"
          echo 'BASE_LATEST_BEGIN'
          curl --retry 3 --retry-delay 2 --retry-all-errors -sS --max-time 30 \
            -H 'content-type: application/json' \
            --data '{"jsonrpc":"2.0","id":1,"method":"eth_blockNumber","params":[]}' "$RPC" | tee /tmp/latest.json
          echo 'BASE_LATEST_END'
          LATEST=$(jq -r '.result // empty' /tmp/latest.json)
          if [ -n "$LATEST" ]; then
            jq -n --arg address "$USDC" --arg from "$FROM_HEX" --arg to "$LATEST" --arg t0 "$TRANSFER_TOPIC" --arg t2 "$TO_TOPIC" \
              '{jsonrpc:"2.0",id:2,method:"eth_getLogs",params:[{address:$address,fromBlock:$from,toBlock:$to,topics:[$t0,null,$t2]}]}' >/tmp/logquery.json
            echo 'TREASURY_USDC_LOGS_BEGIN'
            curl --retry 3 --retry-delay 2 --retry-all-errors -sS --max-time 30 \
              -H 'content-type: application/json' --data-binary @/tmp/logquery.json "$RPC" | \
              jq '{error,result:[(.result // [])[]|{blockNumber,transactionHash,data,topics}]}' || true
            echo 'TREASURY_USDC_LOGS_END'
          else
            echo 'BASE_RPC_UNAVAILABLE=true'
          fi
