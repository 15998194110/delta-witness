name: DELTA Growth Run 8
on:
  push:
    paths:
      - '.github/workflows/_delta-growth-run8.yml'
permissions:
  contents: write
jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Reconcile treasury and execute free PayanAgent listing
        run: |
          python - <<'PY'
          import json, time, urllib.request, urllib.error, urllib.parse, pathlib

          TREASURY='0x1990e21bc219696ff7fbc26527dbaed335ac6367'.lower()
          USDC='0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913'.lower()
          BASE='https://delta-witness-api.ruphussten.workers.dev'
          out={'treasury':{}, 'payanagent':{}, 'errors':[]}

          def call(method,url,data=None,headers=None,retries=4,timeout=25):
              body=None if data is None else json.dumps(data).encode()
              h={'User-Agent':'delta-witness-growth/0.7','Accept':'application/json'}
              if data is not None: h['Content-Type']='application/json'
              if headers: h.update(headers)
              last=None
              for i in range(retries):
                  try:
                      req=urllib.request.Request(url,data=body,headers=h,method=method)
                      with urllib.request.urlopen(req,timeout=timeout) as r:
                          raw=r.read().decode('utf-8','replace')
                          try: parsed=json.loads(raw)
                          except Exception: parsed={'raw':raw[:4000]}
                          return r.status, parsed
                  except urllib.error.HTTPError as e:
                      raw=e.read().decode('utf-8','replace')
                      try: parsed=json.loads(raw)
                      except Exception: parsed={'raw':raw[:4000]}
                      last=(e.code,parsed)
                      if e.code not in (429,500,502,503,504): return last
                  except Exception as e:
                      last=('exception',repr(e))
                  time.sleep(min(2**i,8))
              return last or ('exception','unknown')

          # Treasury: Blockscout v2, isolated from all listing work.
          turl=f'https://base.blockscout.com/api/v2/addresses/{TREASURY}/token-transfers?type=ERC-20'
          ts,td=call('GET',turl)
          out['treasury']['blockscout_status']=ts
          incoming=[]
          if ts==200 and isinstance(td,dict):
              for x in td.get('items',[]):
                  token=(x.get('token') or {})
                  token_addr=str(token.get('address_hash') or token.get('address') or '').lower()
                  to=(x.get('to') or {})
                  to_addr=str(to.get('hash') or '').lower()
                  if token_addr==USDC and to_addr==TREASURY:
                      value=str(x.get('total',{}).get('value') or x.get('value') or '')
                      decimals=int(token.get('decimals') or 6)
                      try: amount=float(value)/(10**decimals)
                      except Exception: amount=None
                      incoming.append({
                        'tx_hash':x.get('transaction_hash'),
                        'timestamp':x.get('timestamp'),
                        'from':(x.get('from') or {}).get('hash'),
                        'amount_usdc':amount,
                      })
          else:
              out['errors'].append({'channel':'blockscout','status':ts,'detail':td})
          out['treasury']['incoming_usdc']=incoming[:50]

          # PayanAgent: free, programmatic, no listing fee. First inspect current catalog.
          q=urllib.parse.quote('DELTA Witness')
          ds,dd=call('GET',f'https://payanagent.com/api/v1/discover?q={q}&limit=50')
          out['payanagent']['discover_status']=ds
          existing=[]
          if ds==200 and isinstance(dd,dict):
              for o in dd.get('offers',[]):
                  blob=json.dumps(o).lower()
                  if 'delta-witness-api.ruphussten.workers.dev' in blob or 'delta witness' in blob:
                      existing.append(o)
          out['payanagent']['existing_before']=existing

          endpoints=[
            {
              'title':'DELTA Witness Page-State Capture',
              'description':'Machine-verifiable capture of current public page state with timestamped hashes and proof URLs. x402 v2, Base USDC, direct-to-provider settlement.',
              'category':'Data',
              'tags':['x402','attestation','browser-agent','page-state','base'],
              'offerType':'api','externalUrl':BASE+'/v1/capture','httpMethod':'POST',
              'verificationBody':{'url':'https://example.com'}
            },
            {
              'title':'DELTA Witness Preflight Verification',
              'description':'Deterministic preflight verification for browser, shopping, procurement, coding and workflow actions. Returns machine-verifiable proof and safety/change signals.',
              'category':'Security',
              'tags':['x402','preflight','browser-agent','workflow-safety','base'],
              'offerType':'api','externalUrl':BASE+'/v1/preflight','httpMethod':'POST',
              'verificationBody':{'url':'https://example.com','expected':{'contains':['Example Domain']}}
            },
            {
              'title':'DELTA Witness Guarded Action Pilot',
              'description':'$10 guarded-action pilot: capture 1-3 public URLs as evidence and optionally run deterministic preflight before a consequential agent action.',
              'category':'Security',
              'tags':['x402','guarded-action','browser-agent','procurement','shopping','base'],
              'offerType':'api','externalUrl':BASE+'/v1/guarded-action-pilot','httpMethod':'POST',
              'verificationBody':{'urls':['https://example.com'],'preflight':{'url_index':0,'expected':{'contains':['Example Domain']}}}
            },
          ]

          target_urls={e['externalUrl'] for e in endpoints}
          existing_urls=set()
          for o in existing:
              for k in ('externalUrl','external_url','endpoint','url'):
                  if isinstance(o.get(k),str): existing_urls.add(o[k])

          # If all three exact endpoints are already discoverable, do not create a duplicate provider.
          if target_urls.issubset(existing_urls):
              out['payanagent']['action']='already_listed'
          else:
              reg={
                'name':'DELTA Witness',
                'description':'Trust layer for autonomous actions: page-state evidence, deterministic preflight verification and guarded-action pilots with x402 v2 settlement on Base.',
                'walletAddress':TREASURY,
                'chain':'base',
                'tags':['x402','attestation','browser-agent','preflight','base'],
                'providerType':'api',
                'agentUrl':BASE+'/.well-known/agent.json'
              }
              rs,rd=call('POST','https://payanagent.com/api/v1/agents',reg)
              out['payanagent']['register_status']=rs
              if rs in (200,201) and isinstance(rd,dict) and rd.get('apiKey'):
                  api=rd['apiKey']
                  out['payanagent']['agent_id']=rd.get('agentId')
                  created=[]
                  for offer in endpoints:
                      os,od=call('POST','https://payanagent.com/api/v1/offers',offer,headers={'Authorization':'Bearer '+api})
                      # Never persist or print the API key.
                      created.append({'endpoint':offer['externalUrl'],'status':os,'response':od})
                  out['payanagent']['created']=created
              else:
                  out['errors'].append({'channel':'payanagent_register','status':rs,'detail':rd})

          # Re-read discovery after any registration attempt.
          time.sleep(2)
          ds2,dd2=call('GET',f'https://payanagent.com/api/v1/discover?q={q}&limit=50')
          out['payanagent']['discover_after_status']=ds2
          after=[]
          if ds2==200 and isinstance(dd2,dict):
              for o in dd2.get('offers',[]):
                  blob=json.dumps(o).lower()
                  if 'delta-witness-api.ruphussten.workers.dev' in blob or 'delta witness' in blob:
                      after.append(o)
          out['payanagent']['after']=after

          pathlib.Path('artifacts').mkdir(exist_ok=True)
          pathlib.Path('artifacts/growth-run8.json').write_text(json.dumps(out,indent=2,sort_keys=True))
          PY
      - name: Persist sanitized evidence
        run: |
          git config user.name delta-growth-bot
          git config user.email 15998194110@users.noreply.github.com
          git add artifacts/growth-run8.json
          git commit -m 'chore: record growth run 8 evidence' || exit 0
          git push
