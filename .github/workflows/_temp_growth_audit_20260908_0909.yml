name: DELTA Fresh Growth Audit
on:
  push:
    paths:
      - '.github/workflows/_temp_growth_audit_20260908_0909.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Audit treasury and paid telemetry
        shell: bash
        run: |
          set -u
          TREASURY='0x1990e21bc219696ff7fbc26527dbaed335ac6367'
          USDC='0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913'
          DB='c9431b00-27c5-4609-9f3d-6af20cb162df'

          echo 'TREASURY_RECENT_BEGIN'
          curl --retry 3 --retry-delay 2 --retry-all-errors -fsS --max-time 30 \
            "https://base.blockscout.com/api/v2/addresses/${TREASURY}/token-transfers?type=ERC-20" >/tmp/transfers.json
          jq --arg t "${TREASURY,,}" --arg u "${USDC,,}" '[.items[] | select(((.to.hash // .to // "")|ascii_downcase)==$t) | select(((.token.address_hash // .token.address // "")|ascii_downcase)==$u) | {timestamp,transaction_hash,from:(.from.hash // .from),to:(.to.hash // .to),value_raw:.total.value,decimals:.total.decimals}] | .[:20]' /tmp/transfers.json
          echo 'TREASURY_RECENT_END'

          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ] && [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            SQL="SELECT id,created_at,event,route,channel,partner,success,reason,gross_usd,browser_ms,storage_bytes,variable_cost_usd,contribution_margin_usd FROM telemetry_events WHERE created_at > '2026-09-08 00:13:17' AND event IN ('qualified_request','payment_verified','capture_started','capture_completed','capture_failed','proof_opened','repeat_call') ORDER BY id ASC"
            jq -n --arg sql "$SQL" '{sql:$sql}' >/tmp/query.json
            echo 'TELEMETRY_BEGIN'
            curl --retry 3 --retry-delay 2 --retry-all-errors -fsS --max-time 30 \
              -X POST "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DB}/query" \
              -H "authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'content-type: application/json' \
              --data-binary @/tmp/query.json | jq '{success,errors,result:[.result[]|{success,results}]}'
            echo 'TELEMETRY_END'
          else
            echo 'TELEMETRY_UNAVAILABLE=missing_cloudflare_secrets'
          fi
