name: Autonomous Growth Turn 10 Actions
on:
  push:
    branches: [master]
    paths: ['.github/workflows/autonomous-growth-turn10-actions.yml']
permissions:
  contents: read
jobs:
  advance:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Recover degraded listings and refresh routing
        shell: bash
        run: |
          python3 - <<'PY'
          import json,time,requests
          BASE='https://delta-witness-api.ruphussten.workers.dev'
          s=requests.Session(); s.headers['User-Agent']='DELTA-Witness-Autonomous-Growth/turn10-actions'
          def req(m,u,**kw):
            last=None
            for i in range(4):
              try:
                r=s.request(m,u,timeout=22,**kw)
                if r.status_code not in (429,500,502,503,504): return r
                last=r
              except Exception as e: last=e
              time.sleep(min(2**i,5))
            if isinstance(last,Exception): raise last
            return last
          out={'agent402':{},'agent_bazaar':{},'true402':{},'chain':{}}
          # Free/no-account Agent402 origin refresh.
          try:
            r=req('POST','https://agent402.tools/api/index/register',json={'origin':BASE})
            out['agent402']['register']={'http':r.status_code,'body':r.text[:5000]}
            idx=req('GET','https://agent402.tools/api/index')
            txt=idx.text
            pos=txt.lower().find('delta-witness-api.ruphussten.workers.dev')
            out['agent402']['readback']={'http':idx.status_code,'present':pos>=0,'snippet':txt[max(0,pos-1200):pos+5000] if pos>=0 else txt[:1200]}
          except Exception as e: out['agent402']={'error':repr(e)}
          # Agent Bazaar fallback store vanished; re-submit all three directly and read back immediately.
          products=[
            {'name':'DELTA Witness Capture','type':'api','category':'testing','description':'Preserve the exact state of a public webpage as timestamped evidence with hashes and a public proof URL. x402 on Base; designed for autonomous agents that need auditable before/after checkpoints.','endpoint':BASE+'/v1/capture','pricePerCall':0.03,'tags':['x402','web-proof','page-state','evidence','agents']},
            {'name':'DELTA Witness Preflight','type':'api','category':'testing','description':'Fetch a fresh public webpage and deterministically verify expected terms before an autonomous agent takes a consequential action. x402 on Base.','endpoint':BASE+'/v1/preflight','pricePerCall':0.03,'tags':['x402','preflight','verification','agent-safety','web']},
            {'name':'DELTA Guarded Action Pilot','type':'api','category':'automation','description':'Capture evidence from 1-3 public URLs and optionally run one deterministic preflight condition before a consequential agent action. Higher-value x402 pilot on Base.','endpoint':BASE+'/v1/guarded-action-pilot','pricePerCall':10.0,'tags':['x402','guarded-action','agent-safety','evidence','workflow']}
          ]
          try:
            before=req('GET','https://www.agent-bazaar.com/api/submit')
            before_blob=before.text.lower()
            subs=[]
            for p in products:
              if p['endpoint'].lower() in before_blob:
                subs.append({'name':p['name'],'status':'already_submitted'})
              else:
                r=req('POST','https://www.agent-bazaar.com/api/submit',json=p)
                subs.append({'name':p['name'],'http':r.status_code,'body':r.text[:3000]})
            after=req('GET','https://www.agent-bazaar.com/api/submit')
            pub=req('GET','https://www.agent-bazaar.com/api/capabilities?q=DELTA')
            out['agent_bazaar']={'before_http':before.status_code,'submissions':subs,'after_http':after.status_code,'after':after.text[:10000],'public_http':pub.status_code,'public':pub.text[:10000]}
          except Exception as e: out['agent_bazaar']={'error':repr(e)}
          # True402 free catalog recovery: read first, only submit root if absent.
          try:
            cat=req('GET','https://true402.dev/api/v1/services')
            blob=cat.text.lower(); present='delta-witness-api.ruphussten.workers.dev' in blob
            reg=None
            if not present:
              rr=req('POST','https://true402.dev/api/v1/services',json={'url':BASE})
              reg={'http':rr.status_code,'body':rr.text[:4000]}
              cat=req('GET','https://true402.dev/api/v1/services'); blob=cat.text.lower(); present='delta-witness-api.ruphussten.workers.dev' in blob
            out['true402']={'catalog_http':cat.status_code,'present':present,'register':reg,'snippet':cat.text[:7000]}
          except Exception as e: out['true402']={'error':repr(e)}
          # Independent chain-index head for reconciliation coverage.
          try:
            st=req('GET','https://base.blockscout.com/api/v2/stats')
            out['chain']={'http':st.status_code,'body':st.text[:3000]}
          except Exception as e: out['chain']={'error':repr(e)}
          print('DELTA_TURN10_ACTIONS='+json.dumps(out,separators=(',',':'),sort_keys=True))
          PY
