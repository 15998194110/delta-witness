name: TEMP DELTA Agent402 index submit 20260914
on:
  push:
    paths:
      - '.github/workflows/tmp-agent402-index-submit-20260914.yml'
permissions:
  contents: read
jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Submit canonical DELTA origin
        shell: bash
        run: |
          set -euo pipefail
          origin='https://delta-witness-api.ruphussten.workers.dev'
          body=$(jq -nc --arg origin "$origin" '{origin:$origin}')
          echo '--- submission ---'
          curl --fail-with-body --retry 3 --retry-all-errors --retry-delay 2 \
            -sS -D /tmp/headers.txt -o /tmp/body.txt \
            -H 'content-type: application/json' \
            -H 'user-agent: DELTA-Distribution-Operator/1.0' \
            -X POST https://agent402.tools/api/index/register \
            --data "$body"
          cat /tmp/headers.txt
          cat /tmp/body.txt
