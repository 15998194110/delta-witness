name: DELTA x402 Scout one-shot listing

on:
  push:
    paths:
      - '.github/workflows/x402scout-list-once.yml'

permissions:
  contents: read

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Register production services and reconcile treasury
        shell: bash
        run: |
          set -u
          SCOUT='https://x402scout.com'
          API='https://delta-witness-api.ruphussten.workers.dev'
          TREASURY='0x1990e21bc219696ff7fbc26527dbaed335ac6367'

          submit () {
            local name="$1" url="$2" price="$3" desc="$4"
            body=$(python3 - "$name" "$url" "$price" "$desc" <<'PY'
          import json,sys
          n,u,p,d=sys.argv[1:]
          print(json.dumps({"name":n,"url":u,"price_usd":float(p),"category":"developer-tools","description":d,"network":"base-mainnet"}))
          PY
            )
            tmp=$(mktemp)
            code=$(curl -sS --retry 4 --retry-all-errors --max-time 30 -o "$tmp" -w '%{http_code}' \
              -H 'content-type: application/json' -X POST "$SCOUT/register" -d "$body" || echo 000)
            echo "SCOUT_REGISTER_HTTP=$code NAME=$name"
            python3 - "$tmp" <<'PY'
          import json,sys
          try:
              d=json.load(open(sys.argv[1]))
              safe={k:d.get(k) for k in ('success','id','service_id','name','url','status','message','verified','health','price_usd','network') if k in d}
              print('SCOUT_REGISTER_RESPONSE='+json.dumps(safe,separators=(',',':')))
          except Exception:
              print('SCOUT_REGISTER_RESPONSE_NONJSON')
          PY
          }

          submit 'DELTA Witness — Page-State Proof' "$API/v1/capture" '0.03' 'Auditable page-state proof for browser and workflow agents before actions.'
          submit 'DELTA Witness — Preflight Verification' "$API/v1/preflight" '0.03' 'Preflight page-state and constraint verification for browser, shopping, travel, procurement and workflow agents.'
          submit 'DELTA Witness — Guarded Action Pilot' "$API/v1/guarded-action-pilot" '10.00' 'Evidence-backed guarded-action decision and policy checks for legitimate higher-value agent workflows.'

          # Public discovery readback. Failure here is diagnostic and must not block treasury reconciliation.
          for path in '/catalog' '/services' '/api/services' '/api/catalog'; do
            code=$(curl -L -sS --max-time 20 -o /tmp/scout-readback -w '%{http_code}' "$SCOUT$path" || echo 000)
            echo "SCOUT_READBACK path=$path http=$code"
            if [ "$code" = '200' ]; then
              python3 - <<'PY'
          import json
          raw=open('/tmp/scout-readback','r',errors='ignore').read()
          try:
              d=json.loads(raw)
              text=json.dumps(d,separators=(',',':'))
          except Exception:
              text=raw
          hits=[]
          lo=text.lower()
          for needle in ('delta witness','delta-witness-api.ruphussten.workers.dev'):
              if needle in lo: hits.append(needle)
          print('SCOUT_READBACK_DELTA='+json.dumps({'found':bool(hits),'matches':hits}))
          PY
            fi
          done

          # Treasury reconciliation always runs independently of channel registration/readback health.
          TURL="https://base.blockscout.com/api/v2/addresses/$TREASURY/token-transfers?type=ERC-20"
          if curl -sS --fail --retry 4 --retry-all-errors --max-time 30 "$TURL" -o /tmp/transfers.json; then
            python3 - <<'PY'
          import json
          d=json.load(open('/tmp/transfers.json'))
          usdc='0x833589fcd6edb6e08f4c7c32d4f71b54bda02913'
          addr='0x1990e21bc219696ff7fbc26527dbaed335ac6367'
          out=[]
          for x in d.get('items',[]):
              token=x.get('token') or {}
              ta=(token.get('address_hash') or token.get('address') or '').lower()
              tov=x.get('to') or {}
              to=(tov.get('hash') if isinstance(tov,dict) else tov or '').lower()
              if ta != usdc or to != addr: continue
              total=x.get('total') or {}
              raw=total.get('value') if isinstance(total,dict) else x.get('value')
              dec=int(token.get('decimals') or 6)
              try: amount=int(raw)/(10**dec)
              except Exception: amount=raw
              fr=x.get('from') or {}
              fr=fr.get('hash') if isinstance(fr,dict) else fr
              out.append({'tx_hash':x.get('transaction_hash'),'timestamp':x.get('timestamp'),'from':fr,'amount_usdc':amount})
          print('TREASURY_RESULT='+json.dumps(out[:20],separators=(',',':')))
          PY
          else
            echo 'TREASURY_RECONCILIATION_DEGRADED'
          fi
