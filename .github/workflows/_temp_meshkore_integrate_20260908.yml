name: DELTA MeshKore Integration Temp
on:
  push:
    paths:
      - '.github/workflows/_temp_meshkore_integrate_20260908.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DELTA_PARTNER_SECRET: ${{ secrets.DELTA_PARTNER_SECRET }}
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - name: Add MeshKore-compatible public card and heartbeat
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('src/env.ts'); s=p.read_text()
          old='export type RuntimeEnv = Env & {\n  INDEXNOW_ADMIN_SECRET?: string;\n  PARTNER_GATEWAY_SECRET?: string;\n};'
          new='export type RuntimeEnv = Env & {\n  INDEXNOW_ADMIN_SECRET?: string;\n  PARTNER_GATEWAY_SECRET?: string;\n  MESHKORE_API_KEY?: string;\n  MESHKORE_AGENT_ID?: string;\n};'
          if old not in s and 'MESHKORE_API_KEY' not in s: raise SystemExit('env patch anchor missing')
          if 'MESHKORE_API_KEY' not in s: p.write_text(s.replace(old,new))

          p=Path('src/agent-manifest.ts'); s=p.read_text()
          anchor='  return {\n    version: "1.4",'
          insert='''  return {\n    protocolVersion: "0.2.0",\n    name: "DELTA Witness",\n    url: publicOrigin,\n    version: "1.4",\n    defaultInputModes: ["application/json"],\n    defaultOutputModes: ["application/json"],\n    protocols: ["http", "a2a", "x402"],\n    pricing: {\n      unit: "request",\n      amount: Math.round(capture.grossPriceUsd * 1_000_000),\n      currency: "USDC",\n      network: "base",\n      note: "Capture and preflight are 0.03 USDC per call; guarded-action-pilot is a separate 10 USDC bounded pilot.",\n    },\n    availability: { now: true, window_hours: 168, sla: "best-effort" },\n    contact: {\n      http: `${publicOrigin}/v1/preflight`,\n      a2a: `${publicOrigin}/.well-known/agent.json`,\n      payment: `${publicOrigin}/.well-known/x402`,\n    },\n    skills: [\n      {\n        id: "capture",\n        name: "Capture public page state",\n        description: "Observe a public webpage independently and return timestamped cryptographic proof metadata and hashes.",\n        examples: ["Capture the current public page state for https://example.com"],\n      },\n      {\n        id: "preflight",\n        name: "Preflight verification",\n        description: "Observe a public source and deterministically compare it with supplied expectations or a prior DELTA proof before an autonomous action.",\n        examples: ["Verify that https://example.com still contains the expected public statement before acting"],\n      },\n      {\n        id: "guarded-action-pilot",\n        name: "Guarded Action Pilot",\n        description: "Produce a bounded 1-3 URL evidence package with optional deterministic preflight for higher-value autonomous actions.",\n        examples: ["Witness up to three public URLs and run one deterministic preflight condition"],\n      },\n    ],'''
          if 'protocolVersion: "0.2.0"' not in s:
            if anchor not in s: raise SystemExit('manifest patch anchor missing')
            p.write_text(s.replace(anchor,insert,1))

          p=Path('src/index.ts'); s=p.read_text()
          helper='''\nconst MESHKORE_DEFAULT_AGENT_ID = "delta-witness-ruphussten";\n\nfunction meshKoreDiscoveryCard(env: RuntimeEnv): Record<string, unknown> {\n  const base = origin(env);\n  const amount = Math.round(Number(env.CAPTURE_BASE_PRICE_USD || "0.03") * 1_000_000);\n  return {\n    name: "DELTA Witness",\n    endpoint: base,\n    category: "security.web-verification",\n    description: "Trust layer for autonomous actions: paid public-page capture and deterministic preflight evidence over x402 on Base.",\n    tags: ["web-proof", "browser-verification", "preflight", "page-state", "x402", "base", "usdc", "autonomous-agents", "guard", "evidence"],\n    accepts: ["application/json"],\n    produces: ["application/json"],\n    protocols: ["http", "a2a", "x402"],\n    pricing: { unit: "request", amount, currency: "USDC", network: "base" },\n    availability: { now: true },\n    owner_class: "third-party",\n    brand: "delta-witness",\n  };\n}\n\nasync function meshKoreHeartbeat(env: RuntimeEnv): Promise<void> {\n  if (!env.MESHKORE_API_KEY) return;\n  const agentId = env.MESHKORE_AGENT_ID || MESHKORE_DEFAULT_AGENT_ID;\n  const tokenResponse = await fetch("https://api.meshkore.com/v1/agents/token", {\n    method: "POST",\n    headers: { "content-type": "application/json" },\n    body: stableJson({ agent_id: agentId, api_key: env.MESHKORE_API_KEY }),\n  });\n  if (!tokenResponse.ok) throw new Error(`meshkore_token_${tokenResponse.status}`);\n  const tokenBody = await tokenResponse.json<{ token?: string }>();\n  if (!tokenBody.token) throw new Error("meshkore_token_missing");\n  const updateResponse = await fetch("https://api.meshkore.com/v1/agents/me", {\n    method: "PATCH",\n    headers: { authorization: `Bearer ${tokenBody.token}`, "content-type": "application/json" },\n    body: stableJson({\n      description: "Trust layer for autonomous actions: paid public-page capture and deterministic preflight evidence over x402 on Base.",\n      capabilities: ["web-proof", "browser-verification", "preflight", "page-state", "x402", "base", "usdc", "autonomous-agents", "guard", "evidence"],\n      agent_card: meshKoreDiscoveryCard(env),\n    }),\n  });\n  if (!updateResponse.ok) throw new Error(`meshkore_update_${updateResponse.status}`);\n  await updateResponse.body?.cancel();\n}\n'''
          marker='\nexport { app };\n'
          if 'function meshKoreHeartbeat' not in s:
            if marker not in s: raise SystemExit('index helper anchor missing')
            s=s.replace(marker,helper+marker,1)
          old_sched='''  async scheduled(controller: ScheduledController, env: RuntimeEnv, ctx: ExecutionContext): Promise<void> {\n    ctx.waitUntil(runDueWatches(env));\n    const scheduled = new Date(controller.scheduledTime);'''
          new_sched='''  async scheduled(controller: ScheduledController, env: RuntimeEnv, ctx: ExecutionContext): Promise<void> {\n    if (controller.cron === "*/3 * * * *") {\n      ctx.waitUntil(meshKoreHeartbeat(env).catch((error) => {\n        console.error(JSON.stringify({ event: "meshkore_heartbeat_failed", message: message(error) }));\n      }));\n      return;\n    }\n    ctx.waitUntil(runDueWatches(env));\n    const scheduled = new Date(controller.scheduledTime);'''
          if 'controller.cron === "*/3 * * * *"' not in s:
            if old_sched not in s: raise SystemExit('scheduled patch anchor missing')
            s=s.replace(old_sched,new_sched,1)
          p.write_text(s)

          p=Path('wrangler.jsonc'); s=p.read_text()
          if '"MESHKORE_AGENT_ID"' not in s:
            s=s.replace('    "PARTNER_GATEWAY_ORIGIN": "https://delta-witness-partner-gateway.ruphussten.workers.dev",', '    "PARTNER_GATEWAY_ORIGIN": "https://delta-witness-partner-gateway.ruphussten.workers.dev",\n    "MESHKORE_AGENT_ID": "delta-witness-ruphussten",')
          s=s.replace('"crons": ["*/15 * * * *"]','"crons": ["*/15 * * * *", "*/3 * * * *"]')
          p.write_text(s)
          PY
          npm ci
          npm run verify
          git config user.name 'DELTA Growth Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/env.ts src/agent-manifest.ts src/index.ts wrangler.jsonc
          git commit -m 'growth: add MeshKore discovery and live heartbeat'
          git pull --rebase origin master
          git push origin HEAD:master
      - name: Deploy MeshKore-compatible production surface
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx wrangler deploy
          curl --fail --retry 5 --retry-delay 3 https://delta-witness-api.ruphussten.workers.dev/health
          curl --fail --retry 5 --retry-delay 3 https://delta-witness-api.ruphussten.workers.dev/.well-known/agent.json > /tmp/agent-card.json
          node - <<'NODE'
          const c=require('/tmp/agent-card.json');
          for (const k of ['name','url','version','description','defaultInputModes','defaultOutputModes','protocols','pricing','availability','contact','skills']) if (c[k] == null) throw new Error('missing '+k);
          for (const id of ['capture','preflight','guarded-action-pilot']) if (!c.skills.some(x=>x.id===id)) throw new Error('missing skill '+id);
          console.log(JSON.stringify({ok:true,name:c.name,skills:c.skills.map(x=>x.id),pricing:c.pricing}));
          NODE
          test "$(curl -sSI -H 'Origin: https://meshkore.com' https://delta-witness-api.ruphussten.workers.dev/.well-known/agent.json | grep -ic '^access-control-allow-origin:')" -ge 1
      - name: Register MeshKore, persist credential, publish card, verify directory
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DELTA_PARTNER_SECRET"
          AGENT_ID=delta-witness-ruphussten
          REG=$(curl -sS --retry 4 --retry-delay 2 --retry-all-errors --max-time 30 -X POST https://api.meshkore.com/v1/agents/register -H 'content-type: application/json' --data '{"agent_id":"delta-witness-ruphussten","capabilities":["web-proof","browser-verification","preflight","page-state","x402","base","usdc","autonomous-agents","guard","evidence"]}')
          printf '%s' "$REG" >/tmp/mesh-register.json
          API_KEY=$(node -e 'const x=JSON.parse(require("fs").readFileSync("/tmp/mesh-register.json","utf8"));process.stdout.write(x.api_key||"")')
          if [ -z "$API_KEY" ]; then
            echo "Registration did not return an API key; checking whether the public id already exists without claiming control."
            curl -sS --retry 3 --retry-delay 2 https://api.meshkore.com/v1/agents/$AGENT_ID >/tmp/mesh-existing.json || true
            cat /tmp/mesh-existing.json
            exit 12
          fi
          echo "::add-mask::$API_KEY"
          printf '%s' "$API_KEY" | npx wrangler secret put MESHKORE_API_KEY
          export MESHKORE_API_KEY="$API_KEY"
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const secret=process.env.DELTA_PARTNER_SECRET,key=process.env.MESHKORE_API_KEY;
          const salt=crypto.randomBytes(16),iv=crypto.randomBytes(12),k=crypto.scryptSync(secret,salt,32),c=crypto.createCipheriv('aes-256-gcm',k,iv),cipher=Buffer.concat([c.update(Buffer.from(key)),c.final()]),tag=c.getAuthTag();
          const out={schema:'delta-encrypted-credential/v1',provider:'meshkore',agent_id:'delta-witness-ruphussten',encryption:{algorithm:'aes-256-gcm',kdf:'scrypt',salt_b64:salt.toString('base64'),iv_b64:iv.toString('base64'),tag_b64:tag.toString('base64'),ciphertext_b64:cipher.toString('base64')},note:'Encrypted with DELTA_PARTNER_SECRET; plaintext MeshKore API key is never committed.'};
          fs.writeFileSync('credentials/meshkore-operator.enc.json',JSON.stringify(out,null,2)+'\n');
          NODE
          TOKEN=$(curl -sS --retry 4 --retry-delay 2 --retry-all-errors --max-time 30 -X POST https://api.meshkore.com/v1/agents/token -H 'content-type: application/json' --data "{\"agent_id\":\"$AGENT_ID\",\"api_key\":\"$API_KEY\"}" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);process.stdout.write(x.token||"")})')
          test -n "$TOKEN"
          echo "::add-mask::$TOKEN"
          cat >/tmp/discovery.json <<'JSON'
          {"description":"Trust layer for autonomous actions: paid public-page capture and deterministic preflight evidence over x402 on Base.","capabilities":["web-proof","browser-verification","preflight","page-state","x402","base","usdc","autonomous-agents","guard","evidence"],"agent_card":{"name":"DELTA Witness","endpoint":"https://delta-witness-api.ruphussten.workers.dev","category":"security.web-verification","description":"Trust layer for autonomous actions: paid public-page capture and deterministic preflight evidence over x402 on Base.","tags":["web-proof","browser-verification","preflight","page-state","x402","base","usdc","autonomous-agents","guard","evidence"],"accepts":["application/json"],"produces":["application/json"],"protocols":["http","a2a","x402"],"pricing":{"unit":"request","amount":30000,"currency":"USDC","network":"base"},"availability":{"now":true},"owner_class":"third-party","brand":"delta-witness"}}
          JSON
          curl --fail -sS --retry 4 --retry-delay 2 --retry-all-errors --max-time 30 -X PATCH https://api.meshkore.com/v1/agents/me -H "authorization: Bearer $TOKEN" -H 'content-type: application/json' --data-binary @/tmp/discovery.json >/tmp/mesh-patch.json
          sleep 3
          curl --fail -sS --retry 4 --retry-delay 2 --retry-all-errors --max-time 30 https://api.meshkore.com/v1/agents/$AGENT_ID >/tmp/mesh-readback.json
          node - <<'NODE'
          const x=JSON.parse(require('fs').readFileSync('/tmp/mesh-readback.json','utf8')); const a=x.agent||x;
          if (!(a.live===1||a.live===true||a.online===true)) throw new Error('MeshKore agent not live: '+JSON.stringify(x));
          const card=a.agent_card||a.card||{}; if (card.name!=='DELTA Witness' || card.owner_class!=='third-party') throw new Error('MeshKore card mismatch: '+JSON.stringify(x));
          console.log(JSON.stringify({ok:true,agent_id:a.agent_id||a.id,live:a.live,display_name:a.display_name||card.name,owner_class:a.owner_class||card.owner_class,pricing:card.pricing}));
          NODE
          git add credentials/meshkore-operator.enc.json
          git commit -m 'ops: persist encrypted MeshKore operator credential'
          git pull --rebase origin master
          git push origin HEAD:master
      - name: Record evidence, recheck Treasury, and cleanup temp workflows
        if: always()
        shell: bash
        run: |
          set -u
          git pull --rebase origin master || true
          python3 - <<'PY'
          import json,urllib.request,time,datetime,os
          treasury='0x1990e21bc219696ff7fbc26527dbaed335ac6367'; usdc='0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913'; topic0='0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef'; topic2='0x'+'0'*24+treasury[2:].lower(); rpcs=['https://mainnet.base.org','https://base-rpc.publicnode.com']; start=51014673
          def rpc(m,p):
            for u in rpcs:
              for i in range(3):
                try:
                  q=urllib.request.Request(u,data=json.dumps({'jsonrpc':'2.0','id':1,'method':m,'params':p}).encode(),headers={'content-type':'application/json','user-agent':'delta-growth/1.0'}); j=json.loads(urllib.request.urlopen(q,timeout=25).read());
                  if 'result' in j:return j['result'],u
                except Exception: time.sleep(i+1)
            raise RuntimeError('rpc unavailable')
          tr={'status':'degraded','from_block':start,'receipts':[]}
          try:
            hx,u=rpc('eth_blockNumber',[]); latest=int(hx,16); tr.update(status='ok',latest=latest,rpc=u); cur=start
            while cur<=latest:
              end=min(cur+1999,latest); logs,u=rpc('eth_getLogs',[{'fromBlock':hex(cur),'toBlock':hex(end),'address':usdc,'topics':[topic0,None,topic2]}])
              for x in logs: tr['receipts'].append({'block':int(x['blockNumber'],16),'tx':x['transactionHash'],'from':'0x'+x['topics'][1][-40:],'amount_usdc':int(x['data'],16)/1e6})
              cur=end+1
          except Exception as e: tr['error']=str(e)
          mesh={}
          try:
            mesh=json.load(urllib.request.urlopen('https://api.meshkore.com/v1/agents/delta-witness-ruphussten',timeout=25))
          except Exception as e: mesh={'error':str(e)}
          rec={'schema':'delta-growth-meshkore/v1','recorded_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'channel':'meshkore','listing_status':'public_active' if not mesh.get('error') else 'registration_unverified','discovery_status':'live_directory_readback' if not mesh.get('error') else 'degraded','canonical_url':'https://meshkore.com/agent/delta-witness-ruphussten','api_readback':mesh,'treasury_reconciliation':tr,'strict_accounting':{'previous_buyer_count':1,'previous_settlement_count':1,'previous_revenue_usdc':0.03,'new_receipt_count':len(tr.get('receipts',[])),'new_customer_revenue_usdc':0,'classification_note':'New receipts, if any, require non-project settlement/telemetry correlation before customer-revenue classification.'},'evidence_quality':'A' if not mesh.get('error') and tr.get('status')=='ok' else 'B','risk_controls':{'listing_fee_paid':0,'wallet_signature':False,'assets_moved':False,'private_key_exposed':False}}
          os.makedirs('docs/channel-status',exist_ok=True); path='docs/channel-status/meshkore-2026-09-08.json'; open(path,'w').write(json.dumps(rec,indent=2)+'\n'); print(json.dumps({'mesh_status':rec['listing_status'],'treasury':tr},separators=(',',':')))
          PY
          git config user.name 'DELTA Growth Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/channel-status/meshkore-2026-09-08.json 2>/dev/null || true
          git rm -f .github/workflows/_temp_growth_turn9_20260908.yml .github/workflows/_temp_meshkore_probe_20260908.yml .github/workflows/_temp_meshkore_integrate_20260908.yml 2>/dev/null || true
          git commit -m 'growth: record MeshKore distribution and clean temp workflows' || true
          for i in 1 2 3; do git pull --rebase origin master || true; git push origin HEAD:master && break; sleep $((i*3)); done
