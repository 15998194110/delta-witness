name: DELTA Growth Turn 5 Market402 + Fallbacks

on:
  push:
    paths:
      - '.github/workflows/_temp_growth_turn5_fallback_20260909.yml'

permissions:
  contents: read

jobs:
  growth:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Submit DELTA endpoints to Market402 and self-test
        shell: bash
        run: |
          set +e
          MARKET='https://market402.com'
          BASE='https://delta-witness-api.ruphussten.workers.dev'
          submit_one() {
            local label="$1" resource="$2" declared="$3"
            jq -n --arg resource "$resource" --argjson declared_price_usd "$declared" '{resource:$resource,declared_price_usd:$declared_price_usd}' >/tmp/market-submit.json
            code=$(curl --retry 4 --retry-delay 2 --retry-all-errors -sS --max-time 40 -o "/tmp/market-${label}.json" -w '%{http_code}' -X POST "$MARKET/submit" -H 'content-type: application/json' --data-binary @/tmp/market-submit.json || true)
            echo "MARKET402_SUBMIT label=$label http=$code resource=$resource declared=$declared"
            jq . "/tmp/market-${label}.json" 2>/dev/null || head -c 4000 "/tmp/market-${label}.json"; echo

            scode=$(curl --retry 4 --retry-delay 2 --retry-all-errors -sS --max-time 40 -o "/tmp/selftest-${label}.json" -w '%{http_code}' -X POST "$MARKET/selftest" -H 'content-type: application/json' --data-binary "{\"url\":\"$resource\"}" || true)
            echo "MARKET402_SELFTEST label=$label http=$scode"
            jq . "/tmp/selftest-${label}.json" 2>/dev/null || head -c 5000 "/tmp/selftest-${label}.json"; echo
          }
          submit_one capture "$BASE/v1/capture" 0.03
          submit_one preflight "$BASE/v1/preflight" 0.03
          submit_one pilot "$BASE/v1/guarded-action-pilot" 10
          exit 0

      - name: Read back DELTA registrations from x402 Arena by name
        shell: bash
        run: |
          set +e
          ARENA='https://core.x402arena.gg'
          code=$(curl --retry 4 --retry-delay 2 --retry-all-errors -sS --max-time 40 -o /tmp/agents.json -w '%{http_code}' "$ARENA/operator/agents" || true)
          echo "ARENA_AGENT_READBACK_HTTP=$code"
          if [ "$code" = 200 ]; then
            jq '[.. | objects | select(((.name // "") | startswith("delta-witness"))) | {id,name,endpoint,description,niche,walletAddress,price,priceUSDC,status,verified,revenue,totalRevenue,queries,totalQueries,buyers,createdAt,updatedAt}] | unique_by(.id // .name)' /tmp/agents.json 2>/dev/null || head -c 10000 /tmp/agents.json
          else
            head -c 4000 /tmp/agents.json; echo
          fi
          exit 0

      - name: Recover Payan request by public discovery
        shell: bash
        run: |
          set +e
          PAYAN='https://payanagent.com'
          echo '=== PAYAN_OPEN_REQUESTS ==='
          code=$(curl --retry 4 --retry-delay 2 --retry-all-errors -sS --max-time 40 -o /tmp/open.json -w '%{http_code}' "$PAYAN/api/v1/requests?status=open&limit=100" || true)
          echo "PAYAN_OPEN_HTTP=$code"
          if [ "$code" = 200 ]; then
            jq '[.. | objects | select((((.title // "") + " " + (.description // "")) | ascii_downcase | test("catalog.*endpoint|endpoint.*health|health.*checker"))) | {id:(_id // .id),title,status,budgetMaxCents,escrow,escrowDepositedCents,escrowReceiptId,bidCount,acceptedBidId,providerId,createdAt,updatedAt}] | unique_by(.id)' /tmp/open.json 2>/dev/null || true
          fi
          echo '=== PAYAN_SEARCH_REQUESTS ==='
          qcode=$(curl --retry 4 --retry-delay 2 --retry-all-errors -sS --max-time 40 -G -o /tmp/search.json -w '%{http_code}' "$PAYAN/api/v1/requests" --data-urlencode 'q=catalog endpoint health checker' --data-urlencode 'limit=100' || true)
          echo "PAYAN_SEARCH_HTTP=$qcode"
          if [ "$qcode" = 200 ]; then
            jq '[.. | objects | select((((.title // "") + " " + (.description // "")) | ascii_downcase | test("catalog|endpoint|health"))) | {id:(_id // .id),title,status,budgetMaxCents,escrow,escrowDepositedCents,escrowReceiptId,bidCount,acceptedBidId,providerId,createdAt,updatedAt}] | unique_by(.id)' /tmp/search.json 2>/dev/null || head -c 8000 /tmp/search.json
          else
            head -c 3000 /tmp/search.json; echo
          fi
          echo '=== PAYAN_KNOWN_BID_IN_RECEIPTS ==='
          rcode=$(curl --retry 4 --retry-delay 2 --retry-all-errors -sS --max-time 40 -o /tmp/receipts.json -w '%{http_code}' "$PAYAN/api/v1/receipts?limit=200" || true)
          echo "PAYAN_RECEIPTS_HTTP=$rcode"
          if [ "$rcode" = 200 ]; then
            jq '[.. | objects | select(((.bidId // .bid_id // "") == "jd79ndx8s7y59tkcvjbars0vf18e33z9") or ((.requestId // .request_id // "") == "ks76vc9pzpz3qfgf8aawjckn5n8bezhf")) | {id:(_id // .id // .receiptId),bidId:(.bidId // .bid_id),requestId:(.requestId // .request_id),status,amountCents,txHash,transactionHash,createdAt,updatedAt}] | unique_by(.id // .txHash // .transactionHash)' /tmp/receipts.json 2>/dev/null || true
          fi
          exit 0
