name: DELTA One-Shot MCPServers Listing

on:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/ops-mcpservers-submit.yml"

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Submit free mcpservers.org listing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/delta-mcpservers
          cd /tmp/delta-mcpservers
          npm init -y >/dev/null 2>&1
          npm install --silent playwright-core@1.55.0
          cat > submit.cjs <<'NODE'
          const fs = require('node:fs');
          const { chromium } = require('playwright-core');

          const candidates = [
            '/usr/bin/google-chrome',
            '/usr/bin/google-chrome-stable',
            '/usr/bin/chromium',
            '/usr/bin/chromium-browser'
          ];
          const executablePath = candidates.find((p) => fs.existsSync(p));
          if (!executablePath) throw new Error('No system Chromium/Chrome executable found');

          const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
          async function gotoWithRetry(page, url) {
            let last;
            for (let attempt = 1; attempt <= 3; attempt++) {
              try {
                const res = await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 45000 });
                if (res && res.status() >= 500) throw new Error(`HTTP ${res.status()}`);
                return res;
              } catch (e) {
                last = e;
                console.log(JSON.stringify({ event: 'navigation_retry', attempt, error: String(e) }));
                if (attempt < 3) await sleep(1000 * Math.pow(2, attempt - 1));
              }
            }
            throw last;
          }

          (async () => {
            const browser = await chromium.launch({ executablePath, headless: true, args: ['--no-sandbox'] });
            const page = await browser.newPage({ viewport: { width: 1280, height: 900 } });
            await gotoWithRetry(page, 'https://mcpservers.org/submit');

            const title = await page.title();
            const bodyText = await page.locator('body').innerText();
            if (!/Submit Your MCP Server/i.test(bodyText)) {
              throw new Error(`Unexpected submit page: ${title} :: ${bodyText.slice(0, 300)}`);
            }

            const checkbox = page.locator('input[type="checkbox"]').first();
            if (await checkbox.count()) {
              const checkboxContext = await checkbox.evaluate((e) => ({
                checked: e.checked,
                required: e.required,
                parentText: (e.parentElement?.innerText || '').trim().slice(0, 500),
                grandparentText: (e.parentElement?.parentElement?.innerText || '').trim().slice(0, 800)
              }));
              console.log(JSON.stringify({ event: 'checkbox_context', ...checkboxContext }));
              if (checkboxContext.required) throw new Error(`Unexpected required checkbox; refusing implicit commitment: ${JSON.stringify(checkboxContext)}`);
            }

            await page.locator('input[name="name"]').fill('DELTA Witness');
            await page.locator('input[name="description"]').fill('Deterministic preflight and evidence for autonomous web actions.');
            await page.locator('input[name="url"]').fill('https://github.com/15998194110/delta-witness');
            await page.locator('input[name="email"]').fill('ruphussten85@gmail.com');
            await page.locator('select[name="category"]').selectOption('development');

            const plan = await page.locator('input[name="plan"]').inputValue();
            if (plan !== 'free') throw new Error(`Refusing non-free plan: ${plan}`);

            const submitButton = page.getByRole('button', { name: 'Submit', exact: true });
            if (!(await submitButton.count())) throw new Error('Free Submit button not found');

            const beforeUrl = page.url();
            await submitButton.click();
            await Promise.race([
              page.waitForURL((url) => url.toString() !== beforeUrl, { timeout: 30000 }).catch(() => null),
              page.waitForTimeout(2500)
            ]);
            await sleep(1200);
            const afterUrl = page.url();
            const afterText = (await page.locator('body').innerText()).replace(/\s+/g, ' ').trim();
            const success = /thank|submitted|review|success|received|12 hours|24 hours/i.test(afterText) || afterUrl !== beforeUrl;
            console.log(JSON.stringify({ event: 'submission_result', success, plan, beforeUrl, afterUrl, excerpt: afterText.slice(0, 1600) }));
            if (!success) throw new Error(`Submission did not expose a success signal: ${afterText.slice(0, 700)}`);
            await browser.close();
          })().catch((err) => {
            console.error(err.stack || String(err));
            process.exit(1);
          });
          NODE
          node submit.cjs
