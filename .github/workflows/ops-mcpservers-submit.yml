name: DELTA One-Shot MCPServers Listing

on:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/ops-mcpservers-submit.yml"

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Submit free mcpservers.org listing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/delta-mcpservers
          cd /tmp/delta-mcpservers
          npm init -y >/dev/null 2>&1
          npm install --silent playwright-core@1.55.0
          cat > submit.cjs <<'NODE'
          const fs = require('node:fs');
          const { chromium } = require('playwright-core');

          const candidates = [
            '/usr/bin/google-chrome', '/usr/bin/google-chrome-stable', '/usr/bin/chromium', '/usr/bin/chromium-browser'
          ];
          const executablePath = candidates.find((p) => fs.existsSync(p));
          if (!executablePath) throw new Error('No system Chromium/Chrome executable found');
          const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

          async function gotoWithRetry(page, url) {
            let last;
            for (let attempt = 1; attempt <= 3; attempt++) {
              try {
                const res = await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 45000 });
                if (res && res.status() >= 500) throw new Error(`HTTP ${res.status()}`);
                return res;
              } catch (e) {
                last = e;
                console.log(JSON.stringify({ event: 'navigation_retry', attempt, error: String(e) }));
                if (attempt < 3) await sleep(1000 * Math.pow(2, attempt - 1));
              }
            }
            throw last;
          }

          (async () => {
            const browser = await chromium.launch({ executablePath, headless: true, args: ['--no-sandbox'] });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1200 } });
            await gotoWithRetry(page, 'https://mcpservers.org/submit');
            const bodyText = await page.locator('body').innerText();
            if (!/Submit Your MCP Server/i.test(bodyText)) throw new Error(`Unexpected submit page: ${bodyText.slice(0, 300)}`);

            const checkbox = page.locator('input[type="checkbox"]:visible').first();
            if (await checkbox.count()) {
              const ctx = await checkbox.evaluate((e) => ({
                checked: e.checked, required: e.required,
                parentText: (e.parentElement?.innerText || '').trim().slice(0, 500),
                grandparentText: (e.parentElement?.parentElement?.innerText || '').trim().slice(0, 800)
              }));
              console.log(JSON.stringify({ event: 'checkbox_context', ...ctx }));
              if (ctx.required) throw new Error(`Unexpected required checkbox; refusing implicit commitment: ${JSON.stringify(ctx)}`);
              if (ctx.checked) await checkbox.uncheck();
            }

            const fillVisible = async (selector, value) => {
              const loc = page.locator(`${selector}:visible`).first();
              if (!(await loc.count())) throw new Error(`Visible field not found: ${selector}`);
              await loc.fill(value);
            };
            await fillVisible('input[name="name"]', 'DELTA Witness');
            await fillVisible('input[name="description"]', 'Deterministic preflight and evidence for autonomous web actions.');
            await fillVisible('input[name="url"]', 'https://github.com/15998194110/delta-witness');
            await fillVisible('input[name="email"]', 'ruphussten85@gmail.com');

            const category = page.locator('select[name="category"]:visible').first();
            if (!(await category.count())) throw new Error('Visible category select not found');
            await category.selectOption('development');

            const plan = await page.locator('input[name="plan"]:visible').first().inputValue().catch(async () => {
              return await page.locator('input[name="plan"]').first().inputValue();
            });
            if (plan !== 'free') throw new Error(`Refusing non-free plan: ${plan}`);

            const submitButton = page.getByRole('button', { name: 'Submit', exact: true }).filter({ visible: true }).first();
            let button = submitButton;
            if (!(await button.count())) button = page.locator('button:visible').filter({ hasText: /^Submit$/ }).first();
            if (!(await button.count())) throw new Error('Free Submit button not found');

            const beforeUrl = page.url();
            await button.click();
            await Promise.race([
              page.waitForURL((url) => url.toString() !== beforeUrl, { timeout: 30000 }).catch(() => null),
              page.waitForTimeout(3500)
            ]);
            await sleep(1500);
            const afterUrl = page.url();
            const afterText = (await page.locator('body').innerText()).replace(/\s+/g, ' ').trim();
            const success = /thank|submitted|review|success|received|12 hours|24 hours/i.test(afterText) || afterUrl !== beforeUrl;
            console.log(JSON.stringify({ event: 'submission_result', success, plan, beforeUrl, afterUrl, excerpt: afterText.slice(0, 1800) }));
            if (!success) throw new Error(`Submission did not expose a success signal: ${afterText.slice(0, 900)}`);
            await browser.close();
          })().catch((err) => { console.error(err.stack || String(err)); process.exit(1); });
          NODE
          node submit.cjs
