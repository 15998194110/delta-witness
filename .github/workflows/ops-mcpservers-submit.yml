name: DELTA One-Shot MCPServers Listing

on:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/ops-mcpservers-submit.yml"

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Submit free mcpservers.org listing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/delta-mcpservers
          cd /tmp/delta-mcpservers
          npm init -y >/dev/null 2>&1
          npm install --silent playwright-core@1.55.0
          cat > submit.cjs <<'NODE'
          const fs = require('node:fs');
          const { chromium } = require('playwright-core');
          const candidates = ['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium','/usr/bin/chromium-browser'];
          const executablePath = candidates.find((p) => fs.existsSync(p));
          if (!executablePath) throw new Error('No system Chromium/Chrome executable found');
          const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

          async function gotoWithRetry(page, url) {
            let last;
            for (let attempt = 1; attempt <= 3; attempt++) {
              try {
                const res = await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 45000 });
                if (res && res.status() >= 500) throw new Error(`HTTP ${res.status()}`);
                return res;
              } catch (e) {
                last = e;
                console.log(JSON.stringify({ event: 'navigation_retry', attempt, error: String(e) }));
                if (attempt < 3) await sleep(1000 * Math.pow(2, attempt - 1));
              }
            }
            throw last;
          }

          (async () => {
            const browser = await chromium.launch({ executablePath, headless: true, args: ['--no-sandbox'] });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1200 } });
            await gotoWithRetry(page, 'https://mcpservers.org/submit');
            const bodyText = await page.locator('body').innerText();
            if (!/Submit Your MCP Server/i.test(bodyText)) throw new Error(`Unexpected submit page: ${bodyText.slice(0, 300)}`);

            const formInfo = await page.locator('form').evaluateAll((forms) => forms.map((f, i) => ({
              i, action: f.action, method: f.method,
              inputs: Array.from(f.querySelectorAll('input,select')).map((e) => ({name:e.name,type:e.type,value:e.value,required:!!e.required})),
              text: (f.innerText || '').replace(/\s+/g,' ').trim().slice(0,700)
            })));
            console.log(JSON.stringify({ event: 'forms', formInfo }));

            const checkbox = page.locator('input[type="checkbox"]').first();
            if (await checkbox.count()) {
              const ctx = await checkbox.evaluate((e) => ({
                checked: e.checked, required: e.required,
                parentText: (e.parentElement?.innerText || '').trim().slice(0, 500)
              }));
              console.log(JSON.stringify({ event: 'checkbox_context', ...ctx }));
              if (ctx.required) throw new Error(`Unexpected required checkbox; refusing implicit commitment: ${JSON.stringify(ctx)}`);
              if (ctx.checked) await checkbox.uncheck({ force: true });
            }

            const first = (selector) => page.locator(selector).first();
            await first('input[name="name"]').fill('DELTA Witness', { force: true });
            await first('input[name="description"]').fill('Deterministic preflight and evidence for autonomous web actions.', { force: true });
            await first('input[name="url"]').fill('https://github.com/15998194110/delta-witness', { force: true });
            await first('input[name="email"]').fill('ruphussten85@gmail.com', { force: true });
            await first('select[name="category"]').selectOption('development', { force: true });

            const plan = await first('input[name="plan"]').inputValue();
            if (plan !== 'free') throw new Error(`Refusing non-free plan: ${plan}`);
            console.log(JSON.stringify({event:'free_form_ready', plan}));

            const submitButtons = page.getByRole('button', { name: 'Submit', exact: true });
            const count = await submitButtons.count();
            if (!count) throw new Error('Submit button not found');
            let button = null;
            for (let i = 0; i < count; i++) {
              if (await submitButtons.nth(i).isVisible()) { button = submitButtons.nth(i); break; }
            }
            if (!button) button = submitButtons.first();

            const beforeUrl = page.url();
            await button.click({ force: true });
            await Promise.race([
              page.waitForURL((url) => url.toString() !== beforeUrl, { timeout: 30000 }).catch(() => null),
              page.waitForTimeout(4500)
            ]);
            await sleep(1800);
            const afterUrl = page.url();
            const afterText = (await page.locator('body').innerText()).replace(/\s+/g, ' ').trim();
            const success = /thank|submitted|review|success|received|12 hours|24 hours/i.test(afterText) || afterUrl !== beforeUrl;
            console.log(JSON.stringify({ event: 'submission_result', success, plan, beforeUrl, afterUrl, excerpt: afterText.slice(0, 2200) }));
            if (!success) throw new Error(`Submission did not expose a success signal: ${afterText.slice(0, 1000)}`);
            await browser.close();
          })().catch((err) => { console.error(err.stack || String(err)); process.exit(1); });
          NODE
          node submit.cjs
