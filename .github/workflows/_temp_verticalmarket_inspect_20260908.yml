name: DELTA Vertical Marketplace API Inspect
on:
  push:
    paths:
      - '.github/workflows/_temp_verticalmarket_inspect_20260908.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect public API specs
        shell: bash
        run: |
          set -u
          for u in \
            https://verticalmarketplace.ai/llms-full.txt \
            https://verticalmarketplace.ai/openapi.json \
            https://verticalmarketplace.ai/api/stats; do
            echo "=== $u ==="
            curl --retry 2 --retry-delay 2 --retry-all-errors -fsS --max-time 30 "$u" -o /tmp/out || { echo FETCH_FAILED; continue; }
            if [[ "$u" == *llms-full.txt ]]; then
              grep -n -E -A30 -B10 '/api/agents/register|/api/marketplace/listings|price_cents|delivery_endpoint|consent' /tmp/out | head -n 300 || true
            elif [[ "$u" == *openapi.json ]]; then
              jq '{register:.paths["/api/agents/register"],listings:.paths["/api/marketplace/listings"],stats:.info}' /tmp/out || head -c 12000 /tmp/out
            else
              cat /tmp/out
            fi
            echo
          done
