name: DELTA Growth Turn 6 Temp

on:
  push:
    paths:
      - '.github/workflows/_temp_growth_turn6_20260908_0312.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6

      - name: Verify DELTA paid production surfaces
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://delta-witness-api.ruphussten.workers.dev'
          probe() {
            local name="$1" path="$2" body="$3"
            code=$(curl --retry 3 --retry-delay 2 --retry-all-errors -sS --max-time 30 -o "/tmp/${name}.body" -D "/tmp/${name}.headers" -w '%{http_code}' -X POST "$BASE$path" -H 'content-type: application/json' --data-binary "$body")
            echo "PROBE name=$name status=$code"
            grep -i '^payment-required:' "/tmp/${name}.headers" || true
            jq -c '{error,product,price_usd,network,asset,payment_flow}' "/tmp/${name}.body" 2>/dev/null || cat "/tmp/${name}.body"
            test "$code" = '402'
          }
          probe capture /v1/capture '{"url":"https://example.com"}'
          probe preflight /v1/preflight '{"url":"https://example.com","expected":{"contains":["Example Domain"]}}'
          probe pilot /v1/guarded-action-pilot '{}'

      - name: Reconcile Base Treasury via canonical USDC logs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.request, time
          RPC='https://mainnet.base.org'
          USDC='0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913'
          TREASURY='1990e21bc219696ff7fbc26527dbaed335ac6367'
          TRANSFER='0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef'
          TO_TOPIC='0x' + ('0'*24) + TREASURY
          START=51008629
          def rpc(method, params, retries=5):
              payload=json.dumps({'jsonrpc':'2.0','id':1,'method':method,'params':params}).encode()
              last=None
              for i in range(retries):
                  try:
                      req=urllib.request.Request(RPC,data=payload,headers={'content-type':'application/json','user-agent':'delta-witness-audit/1.0'})
                      with urllib.request.urlopen(req,timeout=30) as r:
                          obj=json.load(r)
                      if 'error' in obj: raise RuntimeError(obj['error'])
                      return obj['result']
                  except Exception as e:
                      last=e; time.sleep(min(2**i,8))
              raise last
          latest=int(rpc('eth_blockNumber',[]),16)
          print('BASE_LATEST_BLOCK',latest)
          found=[]
          if START <= latest:
              chunk=2000
              for a in range(START, latest+1, chunk):
                  b=min(a+chunk-1, latest)
                  params=[{'fromBlock':hex(a),'toBlock':hex(b),'address':USDC,'topics':[TRANSFER,None,TO_TOPIC]}]
                  logs=rpc('eth_getLogs',params)
                  for x in logs:
                      found.append({'blockNumber':int(x['blockNumber'],16),'transactionHash':x['transactionHash'],'amount_raw':int(x['data'],16)})
          print('TREASURY_NEW_CANONICAL_USDC',json.dumps(found,separators=(',',':')))
          print('TREASURY_NEW_TOTAL_USDC',sum(x['amount_raw'] for x in found)/1_000_000)
          PY

      - name: Reconcile DELTA paid telemetry
        shell: bash
        run: |
          set -euo pipefail
          DB='c9431b00-27c5-4609-9f3d-6af20cb162df'
          SQL="SELECT id,created_at,event,route,channel,partner,success,gross_usd,browser_ms,storage_bytes,variable_cost_usd,contribution_margin_usd FROM telemetry_events WHERE created_at >= '2026-09-07 18:44:00' AND event IN ('qualified_request','payment_verified','capture_started','capture_completed','capture_failed','proof_opened','repeat_call') ORDER BY id ASC"
          jq -n --arg sql "$SQL" '{sql:$sql}' >/tmp/query.json
          curl --retry 4 --retry-delay 2 --retry-all-errors -fsS --max-time 30 \
            -X POST "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DB}/query" \
            -H "authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'content-type: application/json' --data-binary @/tmp/query.json \
            | jq -c '{success,errors,results:[.result[]?.results[]?]}'

      - name: Check AgentPay public listing state
        shell: bash
        run: |
          set -u
          for url in \
            'https://agentpaystore.com/api/services' \
            'https://agentpaystore.com/custom/api/services' \
            'https://agentpaystore.com/marketplace' \
            'https://agentpaystore.com/'
          do
            echo "AGENTPAY_URL=$url"
            code=$(curl --retry 2 --retry-delay 2 --retry-all-errors -L -sS --max-time 25 -o /tmp/ap.out -w '%{http_code}' "$url" || echo 000)
            echo "HTTP=$code"
            grep -Eio '.{0,100}DELTA Witness.{0,180}' /tmp/ap.out | head -5 || true
          done

      - name: Inspect Hober public funded-job surface
        shell: bash
        run: |
          set -u
          for url in \
            'https://app.hober.dev/marketplace/jobs' \
            'https://www.hober.dev/'
          do
            echo "HOBER_URL=$url"
            code=$(curl --retry 2 --retry-delay 2 --retry-all-errors -L -sS --max-time 25 -o /tmp/hober.out -w '%{http_code}' "$url" || echo 000)
            echo "HTTP=$code BYTES=$(wc -c </tmp/hober.out 2>/dev/null || echo 0)"
            grep -Eio 'href="[^"]+"|/api/[A-Za-z0-9_/?&=.-]+' /tmp/hober.out | grep -Ei 'job|market|api' | head -40 || true
          done
