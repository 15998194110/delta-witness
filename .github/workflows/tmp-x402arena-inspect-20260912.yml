name: Temporary x402 Arena canonical refresh
on:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/tmp-x402arena-inspect-20260912.yml"

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - name: Verify owner policy and live canonical prices before listing write
        run: |
          node scripts/check-owner-pricing.mjs
          node scripts/verify-owner-pricing-live.mjs
      - name: Refresh only existing canonical DELTA names on x402 Arena
        run: |
          set -euo pipefail
          node - <<'NODE'
          const BASE='https://delta-witness-api.ruphussten.workers.dev';
          const TREASURY='0x1990e21bc219696ff7fbc26527dbaed335ac6367';
          const REG='https://core.x402arena.gg/register';
          const LIST='https://core.x402arena.gg/operator/agents';
          const targets=[
            {name:'delta-witness-capture',endpoint:`${BASE}/v1/capture`,method:'POST',niche:'verification',description:'Timestamped public-page evidence and page-state proof for autonomous agents.',inputSchema:{type:'object',properties:{url:{type:'string'}}}},
            {name:'delta-witness-preflight',endpoint:`${BASE}/v1/preflight`,method:'POST',niche:'verification',description:'Deterministic fresh public-source preflight before an autonomous action.',inputSchema:{type:'object',properties:{url:{type:'string'},expected:{type:'object'}}}},
            {name:'delta-witness-guarded-action-pilot',endpoint:`${BASE}/v1/guarded-action-pilot`,method:'POST',niche:'agent-safety',description:'Guarded-action evidence pilot for browser, shopping, procurement and workflow agents.',inputSchema:{type:'object',properties:{urls:{type:'array',items:{type:'string'}},expected:{type:'object'}}}}
          ];
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function json(url,opts={}){
            let last;
            for(let i=1;i<=4;i++){
              try{
                const r=await fetch(url,{...opts,signal:AbortSignal.timeout(25000)});
                const text=await r.text();
                if(r.status===429||r.status>=500){last={status:r.status,text}; if(i<4){await sleep(750*2**(i-1));continue;}}
                return {status:r.status,text,json:(()=>{try{return JSON.parse(text)}catch{return null}})()};
              }catch(e){last={status:0,text:String(e)}; if(i<4){await sleep(750*2**(i-1));continue;} return last;}
            }
            return last;
          }
          const beforeRes=await json(LIST);
          if(beforeRes.status!==200) throw new Error(`list_before_http_${beforeRes.status}:${beforeRes.text}`);
          const before=beforeRes.json?.agents||[];
          const canonicalBefore=targets.map(t=>before.find(a=>a.agentId===t.name)).filter(Boolean);
          if(canonicalBefore.length!==targets.length) throw new Error(`canonical_existing_count_${canonicalBefore.length}_expected_${targets.length}`);
          console.log('X402_ARENA_CANONICAL_BEFORE '+JSON.stringify(canonicalBefore));
          for(const t of targets){
            const body={name:t.name,endpoint:t.endpoint,description:t.description,niche:t.niche,walletAddress:TREASURY,method:t.method,inputSchema:t.inputSchema,resourceType:'http'};
            const res=await json(REG,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});
            console.log('X402_ARENA_REFRESH_RESULT '+JSON.stringify({name:t.name,status:res.status,body:res.json??res.text}));
            if(res.status===402){console.log('X402_ARENA_REFRESH_STOP reason=registration_payment_required_no_payment_authorized');break;}
            if(!(res.status>=200&&res.status<300) && res.status!==409 && res.status!==400){throw new Error(`refresh_http_${res.status}_${t.name}`);}
          }
          const afterRes=await json(LIST);
          if(afterRes.status!==200) throw new Error(`list_after_http_${afterRes.status}:${afterRes.text}`);
          const after=afterRes.json?.agents||[];
          const canonicalAfter=targets.map(t=>after.find(a=>a.agentId===t.name)).filter(Boolean);
          const allDeltaAfter=after.filter(a=>String(a.agentId||'').startsWith('delta-witness'));
          console.log('X402_ARENA_CANONICAL_AFTER '+JSON.stringify(canonicalAfter));
          console.log('X402_ARENA_DELTA_TOTAL_AFTER '+JSON.stringify({count:allDeltaAfter.length,names:allDeltaAfter.map(x=>x.agentId)}));
          NODE
