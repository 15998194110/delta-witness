name: TEMP DELTA revenue reconciliation 20260919-0625
on:
  push:
    branches: [master]
    paths: [.github/workflows/tmp-revenue-reconcile-20260919-0625.yml]
permissions:
  contents: read
jobs:
  blockscout-fallback:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read canonical USDC transfers into Treasury from failed-RPC boundary forward
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/delta-fallback
          TREASURY='0x1990e21bc219696ff7fbc26527dbaed335ac6367'
          USDC='0x833589fcd6edb6e08f4c7c32d4f71b54bda02913'
          START=51464821
          curl -fsS --connect-timeout 10 --max-time 30 --retry 2 --retry-delay 2 --retry-all-errors \
            'https://base.blockscout.com/api?module=block&action=eth_block_number' \
            -o /tmp/delta-fallback/head.json
          curl -fsS --connect-timeout 10 --max-time 30 --retry 2 --retry-delay 2 --retry-all-errors \
            "https://base.blockscout.com/api?module=account&action=tokentx&contractaddress=${USDC}&address=${TREASURY}&startblock=${START}&endblock=99999999&sort=asc" \
            -o /tmp/delta-fallback/transfers.json
          python - <<'PY'
          import json, datetime
          treasury='0x1990e21bc219696ff7fbc26527dbaed335ac6367'.lower()
          usdc='0x833589fcd6edb6e08f4c7c32d4f71b54bda02913'.lower()
          start=51464821
          h=json.load(open('/tmp/delta-fallback/head.json'))
          raw=h.get('result')
          head=int(raw,16) if isinstance(raw,str) and raw.startswith('0x') else int(raw)
          t=json.load(open('/tmp/delta-fallback/transfers.json'))
          rows=t.get('result') if isinstance(t,dict) else []
          if not isinstance(rows,list):
              raise SystemExit(f'unexpected Blockscout transfers response: {t}')
          incoming=[]
          for r in rows:
              if str(r.get('to','')).lower()!=treasury: continue
              if str(r.get('contractAddress','')).lower()!=usdc: continue
              b=int(r.get('blockNumber') or 0)
              if b < start: continue
              incoming.append({
                  'tx_hash': r.get('hash'), 'block_number': b,
                  'from': str(r.get('from','')).lower(), 'to': str(r.get('to','')).lower(),
                  'raw_amount': str(r.get('value','')), 'token_symbol': r.get('tokenSymbol'),
                  'confirmations': r.get('confirmations')
              })
          out={
            'ok': True,
            'checked_at': datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'source':'Base Blockscout legacy token-transfer API fallback',
            'network':'eip155:8453','asset':usdc,'treasury':treasury,
            'start_block':start,'latest_block':head,
            'treasury_received_candidates':len(incoming),
            'transfers':incoming,
            'evidence_quality':'A_official_chain_indexer_fallback',
            'scope':'Completes the current-run gap from the first Base RPC chunk that failed after blocks through 51464820 were already directly checked.'
          }
          print(json.dumps(out,indent=2))
          open('/tmp/delta-fallback/reconciliation.json','w').write(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: delta-blockscout-fallback-${{ github.run_id }}
          path: /tmp/delta-fallback/
          retention-days: 7
