name: DELTA one-shot production reconciliation

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/_temp-turn10b-reconcile.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Reconcile production, telemetry, and Treasury
        run: node scripts/_temp-turn10b-reconcile.mjs
      - name: Persist compact evidence
        run: |
          git config user.name delta-ops-bot
          git config user.email actions@users.noreply.github.com
          git add docs/channel-status/automation-turn10b-reconcile-2026-09-09.json
          git commit -m "docs: record turn10b production reconciliation" || exit 0
          git push
