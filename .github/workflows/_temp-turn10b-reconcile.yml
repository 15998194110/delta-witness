name: DELTA one-shot production reconciliation

on:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/_temp-turn10b-reconcile.yml"

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ORIGIN: https://delta-witness-api.ruphussten.workers.dev
      TREASURY: 0x1990e21bc219696ff7fbc26527dbaed335ac6367
      USDC: 0x833589fCD6eDb6E08f4c7C32d4f71b54bdA02913
      START_BLOCK: "51040989"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with: { node-version: "22" }

      - name: Probe production pricing and discovery
        shell: bash
        run: |
          set -u
          retry_curl() { curl --silent --show-error --location --retry 4 --retry-all-errors --retry-delay 3 "$@"; }
          retry_curl "$ORIGIN/.well-known/agent.json" > /tmp/agent.json
          retry_curl "$ORIGIN/.well-known/x402" > /tmp/x402.json
          probe402() {
            local route="$1" body="$2" prefix="$3"
            local code
            code="$(curl --silent --show-error --retry 4 --retry-all-errors --retry-delay 3 -D "/tmp/${prefix}.headers" -o "/tmp/${prefix}.body" -w '%{http_code}' -X POST "$ORIGIN$route" -H 'content-type: application/json' --data "$body")"
            printf '%s' "$code" > "/tmp/${prefix}.code"
          }
          probe402 /v1/capture '{"url":"https://example.com"}' capture
          probe402 /v1/preflight '{"url":"https://example.com","expected":{"contains":["Example Domain"]}}' preflight
          probe402 /v1/guarded-action-pilot '{"urls":["https://example.com"]}' pilot

      - name: Query DELTA paid-funnel telemetry
        shell: bash
        run: |
          set +e
          ok=0
          for attempt in 1 2 3; do
            node scripts/query-revenue-candidates.mjs > /tmp/d1.json 2>/tmp/d1.err && { ok=1; break; }
            sleep $((attempt * 4))
          done
          if [ "$ok" -ne 1 ]; then
            node -e 'const fs=require("fs"); console.log(JSON.stringify({ok:false,error:fs.readFileSync("/tmp/d1.err","utf8").slice(0,1000)}))' > /tmp/d1.json
          fi
          exit 0

      - name: Reconcile Base canonical USDC independently
        shell: bash
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          TREASURY=os.environ['TREASURY'].lower(); USDC=os.environ['USDC'].lower(); START=int(os.environ['START_BLOCK'])
          TOPIC0='0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef'
          TOPIC2='0x' + '0'*24 + TREASURY[2:]
          endpoints=['https://mainnet.base.org','https://base-rpc.publicnode.com','https://base.drpc.org']
          def rpc(url, method, params):
              data=json.dumps({'jsonrpc':'2.0','id':1,'method':method,'params':params}).encode()
              req=urllib.request.Request(url,data=data,headers={'content-type':'application/json','user-agent':'delta-reconcile/1'})
              with urllib.request.urlopen(req,timeout=25) as r:
                  out=json.loads(r.read())
              if out.get('error'): raise RuntimeError(str(out['error']))
              return out['result']
          result={'ok':False,'source':None,'from_block':START,'latest_block':None,'canonical_usdc_incoming':[],'errors':[]}
          for ep in endpoints:
              try:
                  latest=int(rpc(ep,'eth_blockNumber',[]),16)
                  logs=[]
                  cur=START
                  while cur <= latest:
                      end=min(cur+499,latest)
                      chunk=None
                      last=None
                      for a in range(3):
                          try:
                              chunk=rpc(ep,'eth_getLogs',[{'address':USDC,'fromBlock':hex(cur),'toBlock':hex(end),'topics':[TOPIC0,None,TOPIC2]}]); break
                          except Exception as e:
                              last=e; time.sleep(2*(a+1))
                      if chunk is None: raise last
                      logs.extend(chunk); cur=end+1
                  parsed=[]
                  for x in logs:
                      parsed.append({'block_number':int(x['blockNumber'],16),'tx_hash':x['transactionHash'],'log_index':int(x['logIndex'],16),'from':'0x'+x['topics'][1][-40:],'to':'0x'+x['topics'][2][-40:],'raw_amount':str(int(x['data'],16))})
                  result.update({'ok':True,'source':ep,'latest_block':latest,'canonical_usdc_incoming':parsed}); break
              except Exception as e:
                  result['errors'].append({'source':ep,'error':str(e)[:500]})
          if not result['ok']:
              try:
                  url=f'https://base.blockscout.com/api/v2/addresses/{TREASURY}/token-transfers?type=ERC-20'
                  req=urllib.request.Request(url,headers={'user-agent':'delta-reconcile/1'})
                  with urllib.request.urlopen(req,timeout=30) as r: p=json.loads(r.read())
                  items=[]
                  for x in p.get('items',[]):
                      tok=x.get('token') or {}; to=x.get('to') or {}
                      ta=(tok.get('address') or tok.get('address_hash') or tok.get('contract_address_hash') or '').lower()
                      th=(to.get('hash') if isinstance(to,dict) else str(to)).lower()
                      if ta==USDC and th==TREASURY:
                          items.append({'block_number':x.get('block_number') or x.get('block'),'tx_hash':x.get('transaction_hash') or x.get('tx_hash'),'raw_amount':str(x.get('total',{}).get('value') if isinstance(x.get('total'),dict) else x.get('value'))})
                  result.update({'ok':True,'source':'https://base.blockscout.com/api/v2','canonical_usdc_incoming':items})
              except Exception as e:
                  result['errors'].append({'source':'blockscout','error':str(e)[:500]})
          open('/tmp/treasury.json','w').write(json.dumps(result,indent=2))
          PY

      - name: Build compact evidence
        shell: bash
        run: |
          python - <<'PY'
          import base64, json, os, re, datetime
          def load(path, default=None):
              try: return json.load(open(path))
              except Exception: return default
          def challenge(prefix):
              code=open('/tmp/'+prefix+'.code').read().strip()
              body=load('/tmp/'+prefix+'.body',{}) or {}
              headers=open('/tmp/'+prefix+'.headers',errors='ignore').read()
              raw=None
              m=re.search(r'(?im)^payment-required:\s*([^\r\n]+)',headers)
              if m:
                  try:
                      s=m.group(1).strip(); s += '='*((4-len(s)%4)%4); raw=json.loads(base64.urlsafe_b64decode(s).decode())
                  except Exception: raw=None
              accepts=(raw or body).get('accepts',[]) if isinstance(raw or body,dict) else []
              a=accepts[0] if accepts else {}
              return {'http_code':code,'amount':a.get('amount'),'asset':a.get('asset'),'network':a.get('network'),'payTo':a.get('payTo')}
          agent=load('/tmp/agent.json',{}) or {}
          intents={x.get('name'):x.get('price') for x in agent.get('intents',[]) if isinstance(x,dict)}
          evidence={
            'checked_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'production':{
              'agent_pricing':agent.get('pricing'),
              'intent_prices':intents,
              'capture_402':challenge('capture'),
              'preflight_402':challenge('preflight'),
              'pilot_402':challenge('pilot')
            },
            'd1_paid_funnel':load('/tmp/d1.json',{'ok':False}),
            'treasury':load('/tmp/treasury.json',{'ok':False})
          }
          path='docs/channel-status/automation-turn10b-reconcile-2026-09-09.json'
          open(path,'w').write(json.dumps(evidence,indent=2)+"\n")
          print(json.dumps(evidence,indent=2))
          PY

      - name: Persist reconciliation evidence
        shell: bash
        run: |
          git config user.name delta-ops-bot
          git config user.email actions@users.noreply.github.com
          git add docs/channel-status/automation-turn10b-reconcile-2026-09-09.json
          git commit -m 'docs: record turn10b production reconciliation' || exit 0
          git push
