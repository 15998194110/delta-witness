name: DELTA one-shot production reconciliation

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/_temp-turn10b-reconcile.yml

permissions:
  contents: read

jobs:
  verify-repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm ci
      - name: Verify DELTA core and discovery pricing regression
        run: npm run verify
