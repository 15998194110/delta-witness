name: DELTA 402 Index Submission Turn 8

on:
  push:
    paths:
      - '.github/workflows/_temp_402index_turn8_20260910_0248.yml'

permissions:
  contents: write

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Submit three production endpoints
        shell: bash
        run: |
          mkdir -p .growth
          node <<'NODE' > .growth/402index.json
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function post(body){let last=null;for(let i=0;i<4;i++){try{const r=await fetch('https://402index.io/api/v1/register',{method:'POST',headers:{'content-type':'application/json','user-agent':'DELTA-Witness-Growth/0.7'},body:JSON.stringify(body),signal:AbortSignal.timeout(20000)});const text=await r.text();last={http:r.status,body:(()=>{try{return JSON.parse(text)}catch{return text.slice(0,3000)}})()};if((r.status===429||r.status>=500)&&i<3){await sleep(700*2**i);continue}return last}catch(e){last={http:0,error:String(e)};if(i<3)await sleep(700*2**i)}}return last}
          const base='https://delta-witness-api.ruphussten.workers.dev';
          const specs=[
            {key:'capture',body:{url:base+'/v1/capture',name:'DELTA Witness Capture',protocol:'x402',http_method:'POST',probe_body:JSON.stringify({url:'https://example.com'}),description:'Timestamped public web page-state capture with provider-attested SHA-256 proof artifacts and resolvable manifest.',price_usd:0.03,payment_asset:'USDC',payment_network:'Base',category:'verification',provider:'DELTA Witness'}},
            {key:'preflight',body:{url:base+'/v1/preflight',name:'DELTA Witness Preflight',protocol:'x402',http_method:'POST',probe_body:JSON.stringify({url:'https://example.com',expected:{contains:['Example Domain']}}),description:'Deterministic browser preflight that checks live public URL observations against caller-supplied expectations and emits a signed proof bundle.',price_usd:0.03,payment_asset:'USDC',payment_network:'Base',category:'verification',provider:'DELTA Witness'}},
            {key:'pilot',body:{url:base+'/v1/guarded-action-pilot',name:'DELTA Witness Guarded Action Pilot',protocol:'x402',http_method:'POST',probe_body:JSON.stringify({urls:['https://example.com'],preflight:{url_index:0,expected:{contains:['Example Domain']}}}),description:'Higher-value guarded-action pilot combining evidence capture and deterministic preflight before an autonomous action.',price_usd:10,payment_asset:'USDC',payment_network:'Base',category:'verification',provider:'DELTA Witness'}}
          ];
          const out={checked_at:new Date().toISOString(),channel:'402 Index',results:{}};
          for(const s of specs){out.results[s.key]=await post(s.body);await sleep(350)}
          console.log(JSON.stringify(out,null,2));
          NODE
          cp .growth/402index.json docs/growth-evidence-2026-09-10T0248+08-402index.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/growth-evidence-2026-09-10T0248+08-402index.json
          git commit -m 'growth: record 402 Index submissions' || true
          git push || true
