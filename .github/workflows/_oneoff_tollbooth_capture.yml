name: One-off Tollbooth Capture registration

on:
  push:
    paths:
      - '.github/_run_tollbooth_capture'

permissions:
  contents: read

jobs:
  tollbooth:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Discover categories, verify production, and register Capture
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN='https://delta-witness-api.ruphussten.workers.dev'
          TREASURY='0x1990e21bc219696ff7fbc26527dbaed335ac6367'
          API='https://www.trytollbooth.com/api'

          echo '=== production pre-check ==='
          curl --retry 3 --retry-delay 2 --retry-all-errors -fsS "$ORIGIN/health" | jq -c .
          curl --retry 3 --retry-delay 2 --retry-all-errors -fsS "$ORIGIN/v1/quote?product=capture" | tee /tmp/quote.json | jq -c .
          jq -e '.price == "$0.03" and .network == "eip155:8453" and ((.pay_to // "") | ascii_downcase) == "0x1990e21bc219696ff7fbc26527dbaed335ac6367"' /tmp/quote.json >/dev/null

          echo '=== unpaid 402 probe ==='
          code=$(curl --retry 3 --retry-delay 2 --retry-all-errors -sS -o /tmp/capture402.json -w '%{http_code}' -X POST "$ORIGIN/v1/capture" -H 'content-type: application/json' --data '{"url":"https://example.com"}')
          echo "HTTP=$code"
          jq -c . /tmp/capture402.json || cat /tmp/capture402.json
          test "$code" = '402'

          echo '=== discover live Tollbooth categories ==='
          svc_status=''
          for attempt in 1 2 3; do
            svc_status=$(curl --connect-timeout 15 --max-time 60 -sS -o /tmp/services.json -w '%{http_code}' "$API/services" || true)
            echo "services_attempt=$attempt status=$svc_status"
            if [ "$svc_status" = '200' ]; then break; fi
            sleep $((attempt*3))
          done
          if [ "$svc_status" = '200' ]; then
            echo 'observed_categories:'
            jq -r '.. | objects | .category? // empty' /tmp/services.json | sort -u | tee /tmp/categories.txt
          else
            echo 'service catalog unavailable after bounded retries; will try documented manifest fallback'
            : > /tmp/categories.txt
          fi

          CATEGORY=$(grep -Ei 'verification|security|audit|data|utility|tool|infrastructure|infra|other' /tmp/categories.txt | head -n1 || true)
          echo "selected_category=${CATEGORY:-none}"
          registered=0

          if [ -n "$CATEGORY" ]; then
            echo '=== direct service registration ==='
            payload=$(jq -nc --arg endpoint "$ORIGIN/v1/capture" --arg wallet "$TREASURY" --arg category "$CATEGORY" '{name:"DELTA Witness Capture",endpoint:$endpoint,category:$category,priceUsdc:0.03,wallet:$wallet,chain:"base",description:"Timestamped page-state proof for a public HTTPS page, returning deterministic artifact hashes for autonomous agents."}')
            for attempt in 1 2 3; do
              status=$(curl --connect-timeout 15 --max-time 90 -sS -o /tmp/register.json -w '%{http_code}' -X POST "$API/services" -H 'content-type: application/json' --data "$payload" || true)
              echo "register_attempt=$attempt status=$status"
              cat /tmp/register.json 2>/dev/null || true; echo
              if [ "$status" = '200' ] || [ "$status" = '201' ] || [ "$status" = '409' ]; then registered=1; break; fi
              sleep $((attempt*3))
            done
          fi

          if [ "$registered" != '1' ]; then
            echo '=== documented agent402 manifest fallback ==='
            if [ -n "$CATEGORY" ]; then
              manifest=$(jq -nc --arg endpoint "$ORIGIN/v1/capture" --arg wallet "$TREASURY" --arg category "$CATEGORY" '{schema:"agent402/manifest@1",name:"DELTA Witness Capture",description:"Timestamped page-state proof for a public HTTPS page, returning deterministic artifact hashes for autonomous agents.",category:$category,endpoint:$endpoint,x402:{network:"base",scheme:"exact",asset:"0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913",payTo:$wallet,maxAmountRequired:"30000"},input:{type:"object",properties:{url:{type:"string"}},required:["url"]},output:{type:"object"}}')
              for attempt in 1 2 3; do
                mstatus=$(curl --connect-timeout 15 --max-time 90 -sS -o /tmp/manifest.json -w '%{http_code}' -X POST "$API/manifests" -H 'content-type: application/json' --data "$manifest" || true)
                echo "manifest_attempt=$attempt status=$mstatus"
                cat /tmp/manifest.json 2>/dev/null || true; echo
                if [ "$mstatus" = '200' ] || [ "$mstatus" = '201' ] || [ "$mstatus" = '409' ]; then registered=1; break; fi
                sleep $((attempt*3))
              done
            else
              echo 'manifest fallback skipped: no valid category observed from official catalog'
            fi
          fi

          echo '=== exact discovery readback ==='
          readback_status=$(curl --connect-timeout 15 --max-time 60 -sS -o /tmp/readback.json -w '%{http_code}' "$API/services?q=DELTA%20Witness" || true)
          echo "readback_status=$readback_status"
          cat /tmp/readback.json 2>/dev/null || true; echo
          if [ "$readback_status" = '200' ]; then
            matches=$(jq '[.. | objects | select((.endpoint? // "") == "https://delta-witness-api.ruphussten.workers.dev/v1/capture")] | length' /tmp/readback.json 2>/dev/null || echo 0)
            echo "exact_endpoint_matches=$matches"
            if [ "$matches" -gt 0 ]; then exit 0; fi
          fi
          echo 'Tollbooth remained degraded after bounded retries/fallbacks; isolated from Treasury job.'
          exit 0

  treasury:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Independently scan Base USDC Treasury inflows
        shell: bash
        env:
          START_BLOCK: '51048493'
          TREASURY: '0x1990e21bc219696ff7fbc26527dbaed335ac6367'
          USDC: '0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913'
        run: |
          set -euo pipefail
          cat > /tmp/scan.mjs <<'NODE'
          const start = Number(process.env.START_BLOCK);
          const treasury = process.env.TREASURY.toLowerCase();
          const usdc = process.env.USDC;
          const transfer = '0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef';
          const topic2 = '0x' + treasury.slice(2).padStart(64,'0');
          const rpcs = ['https://mainnet.base.org','https://base-rpc.publicnode.com','https://1rpc.io/base','https://base.llamarpc.com'];
          async function rpc(url, method, params) {
            const c = new AbortController(); const t=setTimeout(()=>c.abort(),30000);
            try { const r=await fetch(url,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method,params}),signal:c.signal}); if(!r.ok) throw new Error(`HTTP ${r.status}`); const j=await r.json(); if(j.error) throw new Error(JSON.stringify(j.error)); return j.result; }
            finally { clearTimeout(t); }
          }
          let chosen=null, latest=null;
          for (const url of rpcs) { try { latest=parseInt(await rpc(url,'eth_blockNumber',[]),16); chosen=url; console.log(`rpc_selected=${url} latest_block=${latest}`); break; } catch(e){ console.log(`rpc_degraded=${url} error=${String(e).slice(0,180)}`); } }
          if(!chosen){ console.log('TREASURY_SCAN_STATUS=DEGRADED_ALL_RPC'); process.exit(0); }
          if(latest < start){ console.log(`incoming_count=0 scanned_from=${start} scanned_to=${latest}`); process.exit(0); }
          const logs=[]; const chunk=1500;
          for(let a=start;a<=latest;a+=chunk){ const b=Math.min(latest,a+chunk-1); let part=null; for(const url of [chosen,...rpcs.filter(x=>x!==chosen)]){ try { part=await rpc(url,'eth_getLogs',[{address:usdc,fromBlock:'0x'+a.toString(16),toBlock:'0x'+b.toString(16),topics:[transfer,null,topic2]}]); chosen=url; break; } catch(e){ console.log(`chunk_degraded=${a}-${b} rpc=${url} error=${String(e).slice(0,140)}`); } } if(part===null){ console.log(`TREASURY_SCAN_STATUS=PARTIAL_BLOCKED range=${a}-${b}`); process.exit(0); } logs.push(...part); }
          console.log(`TREASURY_SCAN_STATUS=OK scanned_from=${start} scanned_to=${latest} incoming_count=${logs.length}`);
          for(const l of logs){ const from='0x'+l.topics[1].slice(-40); const amount=Number(BigInt(l.data))/1e6; console.log(JSON.stringify({tx:l.transactionHash,block:parseInt(l.blockNumber,16),from,treasury,amount_usdc:amount,logIndex:parseInt(l.logIndex,16)})); }
          NODE
          node /tmp/scan.mjs
