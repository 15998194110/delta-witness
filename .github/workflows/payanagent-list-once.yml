name: DELTA PayanAgent one-shot listing

on:
  push:
    paths:
      - '.github/workflows/payanagent-list-once.yml'

permissions:
  contents: read

jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Register provider and list production offers
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://payanagent.com'
          TREASURY='0x1990e21bc219696ff7fbc26527dbaed335ac6367'
          API='https://delta-witness-api.ruphussten.workers.dev'

          # Register a fresh API provider. Keep the one-time API key masked and ephemeral.
          curl -sS --fail-with-body --retry 4 --retry-all-errors \
            -H 'content-type: application/json' \
            -X POST "$BASE/api/v1/agents" \
            -d "{\"name\":\"DELTA Witness\",\"description\":\"Evidence-backed guard/witness API for browser, shopping, procurement and workflow agents. Produces auditable page-state proof, preflight verification and guarded-action decisions.\",\"walletAddress\":\"$TREASURY\",\"chain\":\"base\",\"tags\":[\"verification\",\"browser\",\"workflow\",\"procurement\",\"x402\"],\"providerType\":\"api\",\"agentUrl\":\"$API\"}" \
            -o /tmp/agent.json

          AGENT_ID=$(python3 -c 'import json;print(json.load(open("/tmp/agent.json"))["agentId"])')
          API_KEY=$(python3 -c 'import json;print(json.load(open("/tmp/agent.json"))["apiKey"])')
          echo "::add-mask::$API_KEY"
          echo "PAYAN_AGENT_ID=$AGENT_ID"

          list_offer () {
            local title="$1" desc="$2" price="$3" url="$4" body="$5"
            payload=$(python3 - "$title" "$desc" "$price" "$url" "$body" <<'PY'
          import json,sys
          title,desc,price,url,body=sys.argv[1:]
          print(json.dumps({
            "title": title,
            "description": desc,
            "category": "developer-tools",
            "tags": ["verification","browser","workflow","guard","x402","base"],
            "priceCents": int(price),
            "offerType": "api",
            "externalUrl": url,
            "httpMethod": "POST",
            "verificationBody": json.loads(body)
          }))
          PY
            )
            tmp=$(mktemp)
            code=$(curl -sS --retry 3 --retry-all-errors -o "$tmp" -w '%{http_code}' \
              -H 'content-type: application/json' \
              -H "authorization: Bearer $API_KEY" \
              -X POST "$BASE/api/v1/offers" -d "$payload")
            echo "OFFER_HTTP=$code TITLE=$title"
            python3 - "$tmp" <<'PY'
          import json,sys
          try:
              d=json.load(open(sys.argv[1]))
          except Exception:
              print('OFFER_RESPONSE_NONJSON')
              raise SystemExit(1)
          safe={k:d.get(k) for k in ('id','offerId','title','status','priceUsd','buyUrl','verified','verificationStatus') if k in d}
          print('OFFER_RESPONSE='+json.dumps(safe,separators=(',',':')))
          if not (200 <= int(__import__('os').environ.get('DUMMY_HTTP','200')) < 300):
              pass
          PY
            test "$code" -ge 200 -a "$code" -lt 300
          }

          list_offer 'DELTA Witness — Page-State Proof' 'Capture an auditable page-state proof before a browser or workflow agent acts.' 3 "$API/v1/capture" '{"url":"https://example.com"}'
          list_offer 'DELTA Witness — Preflight Verification' 'Verify expected page state and constraints before a browser, shopping, travel, procurement or workflow action.' 3 "$API/v1/preflight" '{"url":"https://example.com","expected":{"contains":["Example Domain"]}}'
          list_offer 'DELTA Witness — Guarded Action Pilot' 'Higher-value guarded-action decision with evidence and policy checks for legitimate agent workflows.' 1000 "$API/v1/guarded-action-pilot" '{"url":"https://example.com","action":{"type":"navigate","target":"https://example.com"}}'

          # Public readback; do not expose the API key.
          curl -sS --fail --retry 3 "$BASE/api/v1/discover?q=DELTA%20Witness" -o /tmp/discover.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/discover.json'))
          print('DISCOVER='+json.dumps(d,separators=(',',':'))[:12000])
          PY
