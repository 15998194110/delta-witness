name: DELTA MeshKore Live Check Temp
on:
  push:
    paths:
      - '.github/workflows/_temp_meshkore_livecheck_20260908.yml'
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
      - name: Verify MeshKore readback and paid routes
        shell: bash
        run: |
          set -euo pipefail
          curl --fail -sS --retry 5 --retry-all-errors --retry-delay 3 https://api.meshkore.com/v1/agents/delta-witness-ruphussten > /tmp/mesh.json
          node - <<'NODE'
          const x=require('/tmp/mesh.json'),a=x.agent||x,c=a.agent_card||a.card||{};
          console.log(JSON.stringify({slug:a.slug||a.agent_id||a.id,registered:a.registered,live:a.live,last_active:a.last_active,endpoint:a.endpoint,card:c}));
          if(!(a.live===1||a.live===true||a.online===true)) process.exit(12);
          if(c.name!=='DELTA Witness'||!(c.protocols||[]).includes('x402')||c.pricing?.amount!==30000) process.exit(13);
          NODE
          for spec in 'capture|{"url":"https://example.com"}' 'preflight|{"url":"https://example.com","expected":{"contains":["Example Domain"]}}' 'guarded-action-pilot|{"urls":["https://example.com"],"preflight":{"url_index":0,"expected":{"contains":["Example Domain"]}}}'; do
            path=${spec%%|*}; body=${spec#*|}; code=$(curl -sS --retry 3 --retry-all-errors --retry-delay 2 -o /tmp/$path -w '%{http_code}' -X POST https://delta-witness-api.ruphussten.workers.dev/v1/$path -H 'content-type: application/json' --data "$body"); echo "$path=$code"; test "$code" = 402;
          done
      - name: Record active listing and Treasury tail
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,urllib.request,time,datetime,os
          mesh=json.load(open('/tmp/mesh.json'));a=mesh.get('agent',mesh);card=a.get('agent_card') or a.get('card') or {}
          treasury='0x1990e21bc219696ff7fbc26527dbaed335ac6367';usdc='0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913';t0='0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef';t2='0x'+'0'*24+treasury[2:].lower();start=51014877
          def rpc(m,p):
            for u in ['https://mainnet.base.org','https://base-rpc.publicnode.com']:
              for i in range(3):
                try:
                  q=urllib.request.Request(u,data=json.dumps({'jsonrpc':'2.0','id':1,'method':m,'params':p}).encode(),headers={'content-type':'application/json','user-agent':'delta-growth/1.0'});j=json.loads(urllib.request.urlopen(q,timeout=25).read());
                  if 'result' in j:return j['result'],u
                except Exception:time.sleep(i+1)
            raise RuntimeError('rpc unavailable')
          tr={'status':'degraded','from_block':start,'receipts':[]}
          try:
            h,u=rpc('eth_blockNumber',[]);latest=int(h,16);tr.update(status='ok',latest=latest,rpc=u);cur=start
            while cur<=latest:
              end=min(cur+1999,latest);logs,u=rpc('eth_getLogs',[{'fromBlock':hex(cur),'toBlock':hex(end),'address':usdc,'topics':[t0,None,t2]}])
              for x in logs:tr['receipts'].append({'block':int(x['blockNumber'],16),'tx':x['transactionHash'],'from':'0x'+x['topics'][1][-40:],'amount_usdc':int(x['data'],16)/1e6})
              cur=end+1
          except Exception as e:tr['error']=str(e)
          rec={'schema':'delta-growth-meshkore/v1','recorded_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'channel':'meshkore','listing_status':'public_active','discovery_status':'live_routable','canonical_url':'https://meshkore.com/agent/delta-witness-ruphussten','agent_id':a.get('slug') or a.get('agent_id') or a.get('id'),'registered':a.get('registered'),'live':a.get('live'),'last_active':a.get('last_active'),'endpoint':a.get('endpoint'),'owner_class':a.get('owner_class') or card.get('owner_class'),'protocols':card.get('protocols'),'pricing':card.get('pricing'),'production_http_status':{'capture':402,'preflight':402,'guarded_action_pilot':402},'production_prices_usdc':{'capture':0.03,'preflight':0.03,'guarded_action_pilot':10},'treasury_reconciliation':tr,'strict_accounting':{'previous_buyer_count':1,'previous_settlement_count':1,'previous_revenue_usdc':0.03,'new_receipt_count':len(tr.get('receipts',[])),'new_customer_revenue_usdc':0,'classification_note':'Any new receipt requires non-project settlement/telemetry correlation before customer-revenue classification.'},'evidence_quality':'A' if tr.get('status')=='ok' else 'B','risk_controls':{'listing_fee_paid':0,'wallet_signature':False,'assets_moved':False,'private_key_exposed':False}}
          os.makedirs('docs/channel-status',exist_ok=True);open('docs/channel-status/meshkore-2026-09-08.json','w').write(json.dumps(rec,indent=2)+'\n');print(json.dumps(rec,separators=(',',':')))
          PY
          git config user.name 'DELTA Growth Bot';git config user.email 'actions@users.noreply.github.com';git add docs/channel-status/meshkore-2026-09-08.json;git commit -m 'growth: verify live MeshKore routing';git push origin HEAD:master
      - name: Cleanup
        if: always()
        shell: bash
        run: |
          git fetch origin master;git reset --hard origin/master;git config user.name 'DELTA Growth Bot';git config user.email 'actions@users.noreply.github.com';git rm -f .github/workflows/_temp_meshkore_livecheck_20260908.yml 2>/dev/null || true;git commit -m 'chore: remove MeshKore live-check workflow' || true;git push origin HEAD:master || true
