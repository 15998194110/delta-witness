name: Autonomous Growth Turn 10
on:
  push:
    branches: [master]
    paths: ['.github/workflows/autonomous-growth-turn10.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Reconcile production, treasury, funded demand and pending listings
        shell: bash
        run: |
          python3 - <<'PY'
          import json,time,requests,urllib.parse
          BASE='https://delta-witness-api.ruphussten.workers.dev'
          TREASURY='0x1990e21bc219696ff7fbc26527dbaed335ac6367'
          USDC='0x833589fcd6edb6e08f4c7c32d4f71b54bda02913'
          BASELINE=51097503
          REQUEST_ID='ks76vc9pzpz3qfgf8aawjckn5n8bezhf'
          BID='jd79ndx8s7y59tkcvjbars0vf18e33z9'
          SUB_IDS=['sub_1788985052841','sub_1788985053001','sub_1788985053124']
          s=requests.Session(); s.headers['User-Agent']='DELTA-Witness-Autonomous-Growth/turn10'
          def req(m,u,**kw):
            last=None
            for i in range(4):
              try:
                r=s.request(m,u,timeout=22,**kw)
                if r.status_code not in (429,500,502,503,504): return r
                last=r
              except Exception as e: last=e
              time.sleep(min(2**i,5))
            if isinstance(last,Exception): raise last
            return last
          out={'production':{},'treasury':{},'payan':{},'agent_bazaar':{}}
          # Production unpaid 402 challenges only; no payment headers are sent.
          for name,path,payload in [
            ('capture','/v1/capture',{'url':'https://example.com'}),
            ('preflight','/v1/preflight',{'url':'https://example.com'}),
            ('guarded_action_pilot','/v1/guarded-action-pilot',{'urls':['https://example.com']})]:
            try:
              r=req('POST',BASE+path,json=payload)
              out['production'][name]={'http':r.status_code,'body':r.text[:3000], 'payment_headers':{k:v for k,v in r.headers.items() if 'payment' in k.lower() or 'x402' in k.lower()}}
            except Exception as e: out['production'][name]={'error':repr(e)}
          # Treasury: paginate canonical ERC20 transfers until crossing previous baseline.
          try:
            url=f'https://base.blockscout.com/api/v2/addresses/{TREASURY}/token-transfers?type=ERC-20'
            incoming=[]; pages=0; crossed=False; max_seen=0
            while url and pages<12:
              r=req('GET',url); pages+=1
              if not r.ok: raise RuntimeError(f'blockscout {r.status_code} {r.text[:500]}')
              j=r.json()
              for x in j.get('items',[]):
                bn=int(x.get('block_number') or 0); max_seen=max(max_seen,bn)
                if bn<=BASELINE: crossed=True
                token=x.get('token') or {}; to=x.get('to') or {}; frm=x.get('from') or {}
                token_addr=str(token.get('address_hash') or token.get('address') or '').lower()
                to_addr=str(to.get('hash') or to.get('address_hash') or '').lower()
                if bn>BASELINE and to_addr==TREASURY.lower() and token_addr==USDC.lower():
                  total=x.get('total'); raw=(total or {}).get('value') if isinstance(total,dict) else x.get('value')
                  dec=int(token.get('decimals') or 6)
                  try: amt=int(raw)/(10**dec)
                  except Exception: amt=raw
                  incoming.append({'block':bn,'timestamp':x.get('timestamp'),'tx':x.get('transaction_hash'),'from':str(frm.get('hash') or frm.get('address_hash') or ''),'amount':amt})
              if crossed: break
              nxt=j.get('next_page_params')
              if not nxt: break
              url='https://base.blockscout.com/api/v2/addresses/'+TREASURY+'/token-transfers?type=ERC-20&'+urllib.parse.urlencode(nxt)
            out['treasury']={'baseline':BASELINE,'pages':pages,'crossed_baseline':crossed,'max_seen':max_seen,'new_canonical_usdc_incoming':incoming}
          except Exception as e: out['treasury']={'baseline':BASELINE,'error':repr(e)}
          # PayanAgent: exact detail plus open-feed fallback. No bid write is made.
          try:
            d=req('GET',f'https://payanagent.com/api/v1/requests/{REQUEST_ID}')
            out['payan']['detail']={'http':d.status_code,'body':d.text[:7000],'bid_present':BID in d.text}
          except Exception as e: out['payan']['detail']={'error':repr(e)}
          try:
            q=urllib.parse.quote('catalog endpoint-health checker')
            r=req('GET',f'https://payanagent.com/api/v1/requests?status=open&q={q}&limit=50')
            text=r.text
            out['payan']['open_feed']={'http':r.status_code,'target_present':REQUEST_ID in text,'bid_present':BID in text,'body':text[:12000]}
          except Exception as e: out['payan']['open_feed']={'error':repr(e)}
          # Agent Bazaar: read pending submission store and public search only.
          for label,url in [
            ('submission_store','https://www.agent-bazaar.com/api/submit'),
            ('public_capture','https://www.agent-bazaar.com/api/capabilities?q=DELTA%20Witness%20Capture'),
            ('public_preflight','https://www.agent-bazaar.com/api/capabilities?q=DELTA%20Witness%20Preflight'),
            ('public_pilot','https://www.agent-bazaar.com/api/capabilities?q=DELTA%20Guarded%20Action%20Pilot')]:
            try:
              r=req('GET',url)
              txt=r.text
              out['agent_bazaar'][label]={'http':r.status_code,'submission_ids_present':[sid for sid in SUB_IDS if sid in txt],'delta_present':'delta' in txt.lower(),'body':txt[:10000]}
            except Exception as e: out['agent_bazaar'][label]={'error':repr(e)}
          print('DELTA_TURN10='+json.dumps(out,separators=(',',':'),sort_keys=True))
          PY
