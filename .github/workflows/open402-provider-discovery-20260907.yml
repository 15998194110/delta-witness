name: DELTA Open402 provider discovery

on:
  push:
    paths:
      - '.github/workflows/open402-provider-discovery-20260907.yml'

permissions:
  contents: write

jobs:
  ship:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DELTA_PARTNER_GATEWAY_SECRET: ${{ secrets.DELTA_PARTNER_GATEWAY_SECRET }}
      DELTA_INDEXNOW_ADMIN_SECRET: ${{ secrets.DELTA_INDEXNOW_ADMIN_SECRET }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with: { node-version: '22' }

      - name: Add canonical agent.json manifest and route
        shell: bash
        run: |
          set -euo pipefail
          cat > src/agent-manifest.ts <<'TS'
          import type { PricingQuote } from "./pricing";

          const BASE_USDC = "0x833589fCD6eDb6E08f4c7C32d4f71b54bdA02913";

          export function agentJsonManifest(
            publicOrigin: string,
            payoutAddress: string,
            facilitatorUrl: string,
            capture: PricingQuote,
            preflight: PricingQuote,
          ): Record<string, unknown> {
            const hostname = new URL(publicOrigin).hostname;
            const payment = {
              networks: [{
                network: "base",
                asset: "USDC",
                contract: BASE_USDC,
                facilitator: facilitatorUrl,
                recipient: payoutAddress,
              }],
            };
            return {
              version: "1.4",
              origin: hostname,
              payout_address: payoutAddress,
              display_name: "DELTA Witness",
              description: "Independent public page-state evidence and deterministic preflight verification for consequential agent actions.",
              payments: { x402: payment },
              intents: [
                {
                  name: "capture_page_state",
                  description: "Observe a public webpage independently and return timestamped cryptographic proof metadata and hashes.",
                  endpoint: "/v1/capture",
                  method: "POST",
                  parameters: {
                    url: { type: "string", required: true, description: "Public HTTP(S) webpage to observe." },
                  },
                  returns: { type: "object", description: "DELTA proof reference, content hashes, observation metadata, and public verifier URL." },
                  price: { amount: capture.grossPriceUsd, currency: "USDC", model: "per_call", network: "base" },
                },
                {
                  name: "preflight_verification",
                  description: "Independently observe a public source and deterministically compare it with supplied expected content or prior proof state before an agent acts.",
                  endpoint: "/v1/preflight",
                  method: "POST",
                  parameters: {
                    url: { type: "string", required: true, description: "Public HTTP(S) source to observe before an action." },
                    prior_proof_id: { type: "string", required: false, description: "Optional prior DELTA proof UUID used as a hash baseline." },
                    expected: { type: "object", required: false, description: "Optional deterministic contains/excludes or hash expectations." },
                  },
                  returns: { type: "object", description: "safe/changed/reason/diff plus a new DELTA proof reference and hashes." },
                  price: { amount: preflight.grossPriceUsd, currency: "USDC", model: "per_call", network: "base" },
                },
                {
                  name: "guarded_action_pilot",
                  description: "Produce 1-3 independent public page-state witness receipts and optionally one deterministic preflight verdict as a bounded guarded-action evidence package.",
                  endpoint: "/v1/guarded-action-pilot",
                  method: "POST",
                  parameters: {
                    urls: { type: "array", required: true, description: "One to three public HTTPS webpages to witness." },
                    preflight: { type: "object", required: false, description: "Optional deterministic preflight rule applied to one submitted URL." },
                  },
                  returns: { type: "object", description: "Evidence bundle with proof URLs, bundle roots, observation timestamps, and optional preflight verdict." },
                  price: { amount: 10, currency: "USDC", model: "flat", network: "base" },
                },
              ],
            };
          }
          TS

          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/index.ts')
          s=p.read_text()
          needle='import { mirrorX402ChallengeBody } from "./x402-compat";\n'
          addition=needle+'import { agentJsonManifest } from "./agent-manifest";\n'
          if 'from "./agent-manifest"' not in s:
              if needle not in s: raise SystemExit('import anchor not found')
              s=s.replace(needle, addition, 1)

          anchor='app.get("/.well-known/api-catalog", (c) => c.json({ name: "DELTA Witness", version: c.env.APP_VERSION, openapi: `${origin(c.env)}/openapi.json`, skill: `${origin(c.env)}/SKILL.md` }));'
          route='''app.get("/.well-known/agent.json", async (c) => c.json(agentJsonManifest(\n  origin(c.env),\n  c.env.PAY_TO,\n  c.env.FACILITATOR_URL,\n  await quoteProductWithOverride(c.env, "capture"),\n  await quoteProductWithOverride(c.env, "preflight"),\n)));\n'''
          if '/.well-known/agent.json' not in s:
              if anchor not in s: raise SystemExit('route anchor not found')
              s=s.replace(anchor, route+anchor, 1)

          old='''    x402: `${origin(c.env)}/.well-known/x402`,\n    skill: `${origin(c.env)}/SKILL.md`,'''
          new='''    x402: `${origin(c.env)}/.well-known/x402`,\n    agent_json: `${origin(c.env)}/.well-known/agent.json`,\n    skill: `${origin(c.env)}/SKILL.md`,'''
          if 'agent_json:' not in s:
              if old not in s: raise SystemExit('distribution anchor not found')
              s=s.replace(old,new,1)
          p.write_text(s)
          PY

          cat > tests/agent-manifest.test.ts <<'TS'
          import { describe, expect, it } from "vitest";
          import { agentJsonManifest } from "../src/agent-manifest";
          import type { PricingQuote } from "../src/pricing";

          const quote = (product: "capture" | "preflight", price = 0.03): PricingQuote => ({
            product,
            grossPriceUsd: price,
            configuredPriceUsd: price,
            minimumPriceUsd: 0.01,
            expectedVariableCostUsd: 0.003,
            targetMarginBps: 6500,
            estimatedContributionMarginUsd: price - 0.003,
            assumptions: { browserMs: 25000, storageBytes: 9000000, facilitatorFeeUsd: 0.001, r2Writes: 5 },
          });

          describe("agent.json provider manifest", () => {
            it("publishes three same-origin x402-priced intents without unsupported trust claims", () => {
              const doc: any = agentJsonManifest(
                "https://delta-witness-api.ruphussten.workers.dev",
                "0x1990e21bc219696ff7fbc26527dbaed335ac6367",
                "https://facilitator.payai.network",
                quote("capture"),
                quote("preflight"),
              );
              expect(doc.version).toBe("1.4");
              expect(doc.origin).toBe("delta-witness-api.ruphussten.workers.dev");
              expect(doc.payout_address).toBe("0x1990e21bc219696ff7fbc26527dbaed335ac6367");
              expect(doc.identity).toBeUndefined();
              expect(doc.commitments).toBeUndefined();
              expect(doc.payments.x402.networks[0]).toMatchObject({
                network: "base",
                asset: "USDC",
                contract: "0x833589fCD6eDb6E08f4c7C32d4f71b54bdA02913",
                facilitator: "https://facilitator.payai.network",
                recipient: "0x1990e21bc219696ff7fbc26527dbaed335ac6367",
              });
              expect(doc.intents.map((x: any) => [x.name, x.endpoint, x.method, x.price.amount])).toEqual([
                ["capture_page_state", "/v1/capture", "POST", 0.03],
                ["preflight_verification", "/v1/preflight", "POST", 0.03],
                ["guarded_action_pilot", "/v1/guarded-action-pilot", "POST", 10],
              ]);
            });
          });
          TS

      - name: Verify repository
        run: npm ci && npm run verify

      - name: Commit canonical discovery source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name '15998194110'
          git config user.email '1012287336@qq.com'
          git add src/index.ts src/agent-manifest.ts tests/agent-manifest.test.ts
          if ! git diff --cached --quiet; then
            git commit -m 'growth: publish provider-authoritative agent.json'
            git push origin HEAD:master
          fi

      - name: Require Cloudflare deployment credentials
        run: test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID" && test -n "$DELTA_PARTNER_GATEWAY_SECRET" && test -n "$DELTA_INDEXNOW_ADMIN_SECRET"

      - name: Deploy DELTA core
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$DELTA_PARTNER_GATEWAY_SECRET" | npx wrangler secret put PARTNER_GATEWAY_SECRET
          printf '%s' "$DELTA_INDEXNOW_ADMIN_SECRET" | npx wrangler secret put INDEXNOW_ADMIN_SECRET
          npx wrangler deploy

      - name: Verify production agent.json and existing paid surfaces
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://delta-witness-api.ruphussten.workers.dev'
          curl -fsS --retry 5 --retry-all-errors "$BASE/.well-known/agent.json" -o /tmp/agent.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/agent.json'))
          assert d['version']=='1.4'
          assert d['origin']=='delta-witness-api.ruphussten.workers.dev'
          assert d['payout_address'].lower()=='0x1990e21bc219696ff7fbc26527dbaed335ac6367'
          xs={x['name']:x for x in d['intents']}
          assert xs['capture_page_state']['price']['amount']==0.03
          assert xs['preflight_verification']['price']['amount']==0.03
          assert xs['guarded_action_pilot']['price']['amount']==10
          assert d['payments']['x402']['networks'][0]['network']=='base'
          print(json.dumps(d,separators=(',',':')))
          PY
          for spec in \
            '/v1/capture|{"url":"https://example.com"}|30000' \
            '/v1/preflight|{"url":"https://example.com","expected":{"contains":["Example Domain"]}}|30000' \
            '/v1/guarded-action-pilot|{"urls":["https://example.com"]}|10000000'; do
            IFS='|' read -r path body amount <<< "$spec"
            code=$(curl -sS --retry 3 --retry-all-errors -o /tmp/pay.json -w '%{http_code}' -X POST "$BASE$path" -H 'content-type: application/json' -d "$body")
            echo "$path HTTP=$code"
            test "$code" = 402
            grep -q "$amount" /tmp/pay.json
          done
