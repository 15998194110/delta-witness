name: DELTA Growth Recovery Temp

on:
  push:
    paths:
      - '.github/workflows/_temp_growth_recovery_20260907.yml'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Recover and verify AllMCPs claim
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const cp = require('child_process');
          const endpoint='https://allmcps.com/api/mcp';
          const searchUrl='https://allmcps.com/api/v1/search?q='+encodeURIComponent('DELTA Witness');
          async function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
          async function rpc(method,params){
            let last;
            for(let i=0;i<4;i++){
              try{
                const r=await fetch(endpoint,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:Date.now(),method,params})});
                const t=await r.text();
                if(!r.ok) throw new Error(`HTTP ${r.status}: ${t.slice(0,400)}`);
                const j=JSON.parse(t); if(j.error) throw new Error(j.error.message||JSON.stringify(j.error)); return j.result;
              }catch(e){last=e;if(i<3)await sleep(1200*(i+1));}
            }
            throw last;
          }
          function texts(r){return (r?.content||[]).map(x=>x?.text||'').join('\n');}
          function collect(obj,out=[]){
            if(obj==null)return out;
            if(typeof obj==='string'){out.push(obj);return out;}
            if(typeof obj==='object')for(const v of Object.values(obj))collect(v,out);
            return out;
          }
          function findBadge(obj){
            const raw=collect(obj).join('\n');
            const m=raw.match(/!\[[^\]]*\]\([^\n)]+allmcps[^\n)]*\)/i) || raw.match(/<a[^>]+allmcps[^>]*>.*?<\/a>/is);
            return m?.[0];
          }
          async function readback(){
            const r=await fetch(searchUrl); const j=await r.json();
            const arr=Array.isArray(j)?j:(j.results||j.data||j.servers||[]);
            return (arr||[]).find(x=>String(x.id)==='delta-witness'||JSON.stringify(x).toLowerCase().includes('15998194110/delta-witness'));
          }
          (async()=>{
            const tools=await rpc('tools/list');
            const vt=(tools.tools||[]).find(t=>t.name==='verify_mcp_claim');
            console.log('ALLMCPS_VERIFY_SCHEMA='+JSON.stringify(vt?.inputSchema||null));
            if(!vt) throw new Error('verify_mcp_claim unavailable');
            let before=await readback(); console.log('ALLMCPS_BEFORE='+JSON.stringify(before));
            let first=await rpc('tools/call',{name:'verify_mcp_claim',arguments:{id:'delta-witness'}});
            console.log('ALLMCPS_VERIFY1='+JSON.stringify(first));
            let badge=findBadge(first);
            if(badge && !/allmcps/i.test(fs.readFileSync('README.md','utf8'))){
              fs.appendFileSync('README.md',`\n\n## Directory verification\n\n${badge}\n`);
              cp.execSync("git config user.name 'DELTA Autonomous Operator'");
              cp.execSync("git config user.email 'actions@users.noreply.github.com'");
              cp.execSync('git add README.md');
              cp.execSync("git commit -m 'docs: add AllMCPs verification badge'");
              cp.execSync('git push origin HEAD:master',{stdio:'inherit'});
              console.log('ALLMCPS_BADGE_PUSHED=yes');
              await sleep(5000);
              let second=await rpc('tools/call',{name:'verify_mcp_claim',arguments:{id:'delta-witness'}});
              console.log('ALLMCPS_VERIFY2='+JSON.stringify(second));
            }
            for(let i=0;i<4;i++){
              const rb=await readback(); console.log('ALLMCPS_READBACK_'+i+'='+JSON.stringify(rb));
              if(rb?.isVerifiedActive===true){fs.writeFileSync('/tmp/allmcps_verified','yes');break;}
              await sleep(3000*(i+1));
            }
          })().catch(e=>{console.error('ALLMCPS_RECOVERY_DEGRADED '+e.stack);process.exit(0)});
          NODE

      - name: Submit AgentNDX for curated review
        shell: bash
        run: |
          set -euo pipefail
          CONTACT=$(git log -1 --format=%ae)
          export CONTACT
          python - <<'PY'
          import html.parser, urllib.request, urllib.parse, http.cookiejar, json, re, os, time
          URL='https://agentndx.ai/submit/'
          class P(html.parser.HTMLParser):
              def __init__(self): super().__init__(); self.forms=[]; self.cur=None
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=='form': self.cur={'action':a.get('action',''),'method':a.get('method','get').lower(),'fields':[]}; self.forms.append(self.cur)
                  elif self.cur is not None and tag in ('input','textarea','select'): self.cur['fields'].append({'tag':tag,**a})
              def handle_endtag(self,tag):
                  if tag=='form': self.cur=None
          cj=http.cookiejar.CookieJar(); op=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cj))
          def get():
              return op.open(urllib.request.Request(URL,headers={'User-Agent':'Mozilla/5.0 DELTA-Witness-Listing/1.0'}),timeout=30).read().decode('utf-8','replace')
          html=get(); p=P(); p.feed(html)
          if not p.forms: raise SystemExit('AGENTNDX no form found')
          form=max(p.forms,key=lambda f:len(f['fields'])); print('AGENTNDX_FORM',json.dumps(form,ensure_ascii=False))
          data={}
          for f in form['fields']:
              name=f.get('name'); typ=f.get('type','').lower(); val=f.get('value',''); ph=f.get('placeholder','').lower();
              if not name: continue
              if typ=='hidden': data[name]=val; continue
              key=(name+' '+ph).lower()
              if 'github' in key: data[name]='https://github.com/15998194110/delta-witness'
              elif 'server' in key and ('name' in key or 'firecrawl' in ph): data[name]='DELTA Witness'
              elif 'homepage' in key or 'website' in key: data[name]='https://delta-witness-api.ruphussten.workers.dev'
              elif 'description' in key or f.get('tag')=='textarea': data[name]='Trust layer for autonomous actions with MCP plus x402-paid browser capture, deterministic preflight verification, and verifiable proof artifacts.'
              elif 'email' in key: data[name]=os.environ['CONTACT']
              elif typ in ('checkbox','radio'):
                  token=(val or name).lower()
                  if 'mcp' in token or 'x402' in token: data.setdefault(name,[]).append(val or 'on')
          enc=[]
          for k,v in data.items(): enc += [(k,x) for x in v] if isinstance(v,list) else [(k,v)]
          action=urllib.parse.urljoin(URL,form['action'] or URL); body=urllib.parse.urlencode(enc,doseq=True).encode(); last=None
          for attempt in range(4):
              try:
                  r=op.open(urllib.request.Request(action,data=body,headers={'User-Agent':'Mozilla/5.0 DELTA-Witness-Listing/1.0','Content-Type':'application/x-www-form-urlencoded','Referer':URL}),timeout=30)
                  text=r.read().decode('utf-8','replace'); clean=re.sub(r'\s+',' ',text)
                  received=('submission received' in clean.lower() or 'thank' in clean.lower() or 'review' in clean.lower())
                  print('AGENTNDX_SUBMIT http=',r.status,'final=',r.geturl(),'received=',received); print(clean[:1200])
                  if received: open('/tmp/agentndx_submitted','w').write('yes')
                  break
              except Exception as e:
                  last=e; print('AGENTNDX_RETRY',attempt+1,type(e).__name__,str(e)[:180]); time.sleep(2*(attempt+1))
          else: print('AGENTNDX_DEGRADED',repr(last))
          PY

      - name: Check x402-list imported visibility
        shell: bash
        run: |
          set -euo pipefail
          for q in 'DELTA Witness' 'delta-witness-api.ruphussten.workers.dev'; do
            echo "X402LIST_QUERY=$q"
            for n in 1 2 3 4; do
              if curl -fsS --max-time 30 --get 'https://x402-list.com/api/v1/services' --data-urlencode "q=$q" --data 'per_page=100' -o /tmp/x402list.json; then break; fi
              sleep $((n*2))
            done
            jq '{meta, matches:[(.data // [])[] | select((.name//""|ascii_downcase|contains("delta")) or (.base_url//""|contains("delta-witness"))) | {slug,name,base_url,source,status,payment_ready,verified,cheapest_price_usd}]}' /tmp/x402list.json || cat /tmp/x402list.json
          done
