name: TEMP DELTA revenue run 20260918-2150
on:
  push:
    branches: [master]
    paths: [.github/workflows/tmp-revenue-run-20260918-2150.yml]
permissions:
  contents: read
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with: {persist-credentials: false}
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - name: Owner pricing integrity
        run: node scripts/check-owner-pricing.mjs && node scripts/verify-owner-pricing-live.mjs
      - name: Independent Base Treasury reconciliation
        env:
          DELTA_TREASURY_LOOKBACK_BLOCKS: '70000'
          DELTA_TREASURY_CHUNK_BLOCKS: '1900'
        run: node scripts/reconcile-treasury.mjs | tee /tmp/delta-treasury-2150.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: delta-revenue-2150-${{ github.run_id }}
          path: /tmp/delta-treasury-2150.json
          retention-days: 7
