name: DELTA Growth Turn6 Agent402 Reconcile

on:
  push:
    paths:
      - '.github/workflows/_temp_growth_turn6_agent402_reconcile_20260909.yml'

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Refresh free routing index and reconcile Treasury tail
        shell: bash
        run: |
          set -u
          ORIGIN='https://delta-witness-api.ruphussten.workers.dev'
          TREASURY='0x1990e21bc219696ff7fbc26527dbaed335ac6367'
          USDC='0x833589fcd6edb6e08f4c7c32d4f71b54bda02913'
          echo '=== AGENT402_DIRECT_REFRESH ==='
          code=$(curl --retry 4 --retry-delay 2 --retry-all-errors -sS --max-time 35 -o /tmp/a402.json -w '%{http_code}' -X POST 'https://agent402.tools/api/index/register' -H 'content-type: application/json' --data-binary "{\"origin\":\"$ORIGIN\"}" || true)
          echo "HTTP=$code"; cat /tmp/a402.json; echo
          echo '=== TREASURY_FINAL_TAIL ==='
          node <<'NODE'
          const TREASURY='0x1990e21bc219696ff7fbc26527dbaed335ac6367';
          const USDC='0x833589fcd6edb6e08f4c7c32d4f71b54bda02913';
          const rpcs=['https://mainnet.base.org','https://base-rpc.publicnode.com','https://base.llamarpc.com'];
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function rpc(method,params){let last;for(const url of rpcs){for(let i=0;i<2;i++){try{const r=await fetch(url,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method,params})});const t=await r.text();const j=JSON.parse(t);if(r.ok&&!j.error)return j.result;last=j.error||t;if(r.status===429||r.status>=500)await sleep(300*2**i);else break}catch(e){last=e;await sleep(300*2**i)}}}throw new Error(String(last))}
          const head=parseInt(await rpc('eth_blockNumber',[]),16); const start=51086056;
          const topic0='0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef';
          const toTopic='0x'+'0'.repeat(24)+TREASURY.slice(2).toLowerCase(); let logs=[];
          for(let from=start;from<=head;from+=1500){const to=Math.min(head,from+1499);logs.push(...await rpc('eth_getLogs',[{address:USDC,fromBlock:'0x'+from.toString(16),toBlock:'0x'+to.toString(16),topics:[topic0,null,toTopic]}]));}
          const incoming=logs.map(x=>({block:parseInt(x.blockNumber,16),tx:x.transactionHash,amount_usdc:Number(BigInt(x.data))/1e6,from:'0x'+x.topics[1].slice(-40)}));
          console.log(JSON.stringify({start,head,incoming_count:incoming.length,incoming}));
          NODE
