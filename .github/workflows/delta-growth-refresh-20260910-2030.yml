name: DELTA Growth Refresh 2026-09-10 20:30

on:
  push:
    paths:
      - '.github/workflows/delta-growth-refresh-20260910-2030.yml'

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with: { node-version: 22 }

      - name: Verify live core before distribution
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://delta-witness-api.ruphussten.workers.dev'
          TREASURY='0x1990e21bc219696ff7fbc26527dbaed335ac6367'
          probe() {
            local path="$1" expected="$2"
            curl --connect-timeout 10 --max-time 30 --retry 3 --retry-all-errors --retry-delay 2 -sS -D /tmp/h -o /tmp/b -X POST "$BASE$path" -H 'content-type: application/json' -d '{}'
            hdr=$(awk 'BEGIN{IGNORECASE=1} /^payment-required:/{sub(/^[^:]+:[[:space:]]*/,"");gsub(/\r/,"");print;exit}' /tmp/h)
            decoded=$(printf '%s' "$hdr" | base64 -d)
            amount=$(printf '%s' "$decoded" | jq -r '.. | .amount? // empty' | head -1)
            payto=$(printf '%s' "$decoded" | jq -r '.. | .payTo? // empty' | head -1)
            network=$(printf '%s' "$decoded" | jq -r '.. | .network? // empty' | head -1)
            test "$amount" = "$expected"
            test "${payto,,}" = "$TREASURY"
            test "$network" = 'eip155:8453'
          }
          probe '/v1/capture' 30000
          probe '/v1/preflight' 30000
          probe '/v1/guarded-action-pilot' 10000000

      - name: Refresh x402 Arena listings
        shell: bash
        run: |
          set -u
          API='https://core.x402arena.gg'
          TREASURY='0x1990e21bc219696ff7fbc26527dbaed335ac6367'
          submit() {
            name="$1" endpoint="$2" niche="$3" desc="$4"
            payload=$(jq -nc --arg name "$name" --arg endpoint "$endpoint" --arg niche "$niche" --arg description "$desc" --arg walletAddress "$TREASURY" '{name:$name,endpoint:$endpoint,niche:$niche,description:$description,walletAddress:$walletAddress}')
            code=000
            for i in 1 2 3; do
              code=$(curl --connect-timeout 10 --max-time 30 -sS -o /tmp/arena.json -w '%{http_code}' -X POST "$API/register" -H 'content-type: application/json' --data "$payload") || code=000
              echo "ARENA attempt=$i endpoint=$endpoint http=$code body=$(cat /tmp/arena.json 2>/dev/null || true)"
              case "$code" in 200|201|202|204|409) break;; 429|500|502|503|504|000) sleep $((i*3));; *) break;; esac
            done
            case "$code" in 200|201|202|204|409) echo "ARENA listing_status=accepted endpoint=$endpoint";; *) echo "ARENA recoverable_degradation=true endpoint=$endpoint http=$code";; esac
          }
          submit 'delta-witness-capture' 'https://delta-witness-api.ruphussten.workers.dev/v1/capture' 'developer-tools' 'Timestamped public-web evidence for autonomous agents; x402 Base USDC.'
          submit 'delta-witness-preflight' 'https://delta-witness-api.ruphussten.workers.dev/v1/preflight' 'agent-safety' 'Deterministic preflight verification before consequential autonomous actions; x402 Base USDC.'
          submit 'delta-witness-guarded-action-pilot' 'https://delta-witness-api.ruphussten.workers.dev/v1/guarded-action-pilot' 'agent-safety' 'Production-verified $10 guarded-action evidence pilot; x402 Base USDC.'
          curl --connect-timeout 10 --max-time 30 --retry 3 --retry-all-errors --retry-delay 2 -fsS "$API/operator/agents" | jq -c '.. | objects | select(((.endpoint? // .url? // "") | contains("delta-witness-api.ruphussten.workers.dev"))) | {name,endpoint,url,niche,revenue,queries,buyers,status}' | head -20 || true

      - name: Refresh x402dash listings
        shell: bash
        run: |
          set -u
          PRIMARY='https://api.x402dash.com'
          FALLBACK='https://api.x402market.shop'
          submit() {
            name="$1" endpoint="$2" category="$3" tags="$4"
            payload=$(jq -nc --arg url "$endpoint" --arg name "$name" --arg description 'DELTA Witness trust layer for autonomous actions: timestamped evidence, deterministic preflight, and guarded-action verification on Base.' --arg category "$category" --arg tags "$tags" --arg contact 'ruphussten85@gmail.com' '{url:$url,name:$name,description:$description,category:$category,tags:($tags|split(",")),contact:$contact}')
            base="$PRIMARY"; code=000
            for i in 1 2 3; do
              code=$(curl --connect-timeout 10 --max-time 30 -sS -o /tmp/dash.json -w '%{http_code}' -X POST "$base/v1/register" -H 'content-type: application/json' --data "$payload") || code=000
              echo "X402DASH attempt=$i base=$base endpoint=$endpoint http=$code body=$(cat /tmp/dash.json 2>/dev/null || true)"
              case "$code" in 200|201|202|204|409) break;; 429|500|502|503|504|000) if [ "$i" = 2 ]; then base="$FALLBACK"; fi; sleep $((i*3));; *) break;; esac
            done
            case "$code" in 200|201|202|204|409) echo "X402DASH listing_status=accepted endpoint=$endpoint";; *) echo "X402DASH recoverable_degradation=true endpoint=$endpoint http=$code";; esac
          }
          submit 'DELTA Witness Capture' 'https://delta-witness-api.ruphussten.workers.dev/v1/capture' 'Developer Tools' 'evidence,web-capture,agent-trust,x402,base'
          submit 'DELTA Witness Preflight' 'https://delta-witness-api.ruphussten.workers.dev/v1/preflight' 'Security' 'preflight,agent-safety,verification,x402,base'
          submit 'DELTA Witness Guarded Action Pilot' 'https://delta-witness-api.ruphussten.workers.dev/v1/guarded-action-pilot' 'Security' 'guarded-action,audit,evidence,x402,base'
          for base in "$PRIMARY" "$FALLBACK"; do
            out=$(curl --connect-timeout 10 --max-time 30 -fsS "$base/v1/endpoints?limit=100&provider=delta-witness-api.ruphussten.workers.dev" 2>/tmp/dash.err || true)
            if [ -n "$out" ]; then
              echo "X402DASH discovery_base=$base"
              printf '%s' "$out" | jq -c '.items[]? | select(((.url? // .endpoint? // "") | contains("delta-witness-api.ruphussten.workers.dev"))) | {url,endpoint,name,liveness_score,integration_readiness,price_usd,network,onchain_tx_count_30d,onchain_unique_payers_30d}' | head -20 || true
              break
            fi
            echo "X402DASH verify_degraded base=$base reason=$(cat /tmp/dash.err 2>/dev/null || true)"
          done

      - name: Reconcile Treasury independently
        if: always()
        run: node scripts/reconcile-treasury.mjs
