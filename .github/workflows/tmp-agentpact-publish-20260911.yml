name: TMP DELTA AgentPact publish 20260911

on:
  push:
    branches: [master]
    paths: ['.github/workflows/tmp-agentpact-publish-20260911.yml']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DELTA_PARTNER_GATEWAY_SECRET: ${{ secrets.DELTA_PARTNER_GATEWAY_SECRET }}
      AGENTPACT_AGENT_ID: 5fdb4f2a-0d15-4e27-8d4a-15998194110d
      TREASURY: 0x1990e21bc219696ff7fbc26527dbaed335ac6367
      MCP: https://mcp.agentpact.xyz/mcp
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - name: Verify owner pricing and live DELTA
        run: |
          set -euo pipefail
          node scripts/check-owner-pricing.mjs
          node scripts/verify-owner-pricing-live.mjs
      - name: Prepare MCP session and helper
        shell: bash
        run: |
          set -euo pipefail
          curl --connect-timeout 10 --max-time 30 -sS -D /tmp/ap-init-h -o /tmp/ap-init \
            -X POST "$MCP" -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' \
            --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"delta-agentpact-publisher","version":"1"}}}'
          session=$(awk 'BEGIN{IGNORECASE=1} /^mcp-session-id:/{sub(/^[^:]+:[[:space:]]*/,"");gsub(/\r/,"");print;exit}' /tmp/ap-init-h)
          printf '%s' "$session" >/tmp/ap-session
          cat >/tmp/mcp-call.py <<'PY'
          import json,sys
          raw=open(sys.argv[1]).read()
          ds=[line[5:].strip() for line in raw.splitlines() if line.startswith('data:')]
          payload=''.join(ds) if ds else raw
          obj=json.loads(payload)
          print(json.dumps(obj,separators=(',',':')))
          PY
          cat >/tmp/extract-register.py <<'PY'
          import json,sys,re
          raw=open(sys.argv[1]).read(); ds=[l[5:].strip() for l in raw.splitlines() if l.startswith('data:')]
          obj=json.loads(''.join(ds) if ds else raw)
          vals=[]
          def walk(x):
            if isinstance(x,dict):
              vals.append(x)
              for v in x.values(): walk(v)
            elif isinstance(x,list):
              for v in x: walk(v)
            elif isinstance(x,str):
              try: walk(json.loads(x))
              except Exception: pass
          walk(obj)
          key=''; aid=''
          for d in vals:
            if not key: key=str(d.get('apiKey') or d.get('api_key') or d.get('key') or '')
            if not aid: aid=str(d.get('agentId') or d.get('agent_id') or '')
          if not key:
            print('NO_API_KEY',file=sys.stderr); sys.exit(2)
          open('/tmp/ap-key','w').write(key)
          open('/tmp/ap-agent-id','w').write(aid or sys.argv[2])
          PY
          cat >/tmp/ap-call <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          tool="$1"; args="$2"; out="$3"; session=$(cat /tmp/ap-session)
          payload=$(jq -nc --arg name "$tool" --argjson arguments "$args" '{jsonrpc:"2.0",id:3,method:"tools/call",params:{name:$name,arguments:$arguments}}')
          curl --connect-timeout 10 --max-time 30 -sS -o "$out" -X POST "$MCP" \
            -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' \
            ${session:+-H "mcp-session-id: $session"} --data "$payload"
          SH
          chmod +x /tmp/ap-call
      - name: Dedupe identity and register exactly once
        id: register
        shell: bash
        run: |
          set -euo pipefail
          # Fixed UUID makes retries target the same identity rather than create another seller.
          /tmp/ap-call agentpact.get_agent "$(jq -nc --arg id "$AGENTPACT_AGENT_ID" '{agentId:$id}')" /tmp/ap-get-agent || true
          if grep -Eqi 'DELTA Witness|delta-witness' /tmp/ap-get-agent 2>/dev/null; then
            echo 'AGENTPACT existing_identity=true'
            echo 'existing=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          args=$(jq -nc --arg id "$AGENTPACT_AGENT_ID" --arg wallet "$TREASURY" '{agentId:$id,walletAddress:$wallet}')
          /tmp/ap-call agentpact.register "$args" /tmp/ap-register
          python3 /tmp/extract-register.py /tmp/ap-register "$AGENTPACT_AGENT_ID"
          key=$(cat /tmp/ap-key)
          echo "::add-mask::$key"
          chmod 600 /tmp/ap-key
          printf '%s' "$key" | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:DELTA_PARTNER_GATEWAY_SECRET -out /tmp/agentpact-api-key.enc
          printf '%s\n' "$AGENTPACT_AGENT_ID" >/tmp/agentpact-agent-id.txt
          echo 'existing=false' >> "$GITHUB_OUTPUT"
          echo 'credential_captured=true' >> "$GITHUB_OUTPUT"
          echo "AGENTPACT registration=created agent_id=$AGENTPACT_AGENT_ID wallet=$TREASURY"
      - name: Create public DELTA profile and owner-priced offers
        if: steps.register.outputs.existing == 'false'
        shell: bash
        run: |
          set -euo pipefail
          key=$(cat /tmp/ap-key); echo "::add-mask::$key"
          profile=$(jq -nc --arg key "$key" --arg wallet "$TREASURY" '{handle:"delta-witness",displayName:"DELTA Witness",ownerWalletAddress:$wallet,walletProvider:"other",autoBuyEnabled:false,apiKey:$key}')
          /tmp/ap-call agentpact.create_agent "$profile" /tmp/ap-profile
          if grep -Eqi 'error|already|duplicate' /tmp/ap-profile && ! grep -Eqi 'DELTA Witness|delta-witness' /tmp/ap-profile; then
            echo 'AGENTPACT profile_response_nonfatal=true'
          fi
          create_offer() {
            title="$1"; desc="$2"; category="$3"; price="$4"; tags="$5"; type="$6"
            # Public API dedupe first so a rerun never creates duplicate offers.
            curl --connect-timeout 10 --max-time 30 -fsS "https://api.agentpact.xyz/api/offers?query=$(printf '%s' "$title" | jq -sRr @uri)&limit=100" -o /tmp/ap-offer-search || true
            if jq -e --arg title "$title" --arg id "$AGENTPACT_AGENT_ID" '.. | objects | select((.title? // "") == $title and ((.agentId? // .agent_id? // "") == $id))' /tmp/ap-offer-search >/dev/null 2>&1; then
              echo "AGENTPACT offer_status=already_present title=$title price=$price"
              return 0
            fi
            args=$(jq -nc --arg id "$AGENTPACT_AGENT_ID" --arg title "$title" --arg desc "$desc" --arg category "$category" --arg tags "$tags" --argjson price "$price" --arg type "$type" --arg key "$key" '{agentId:$id,title:$title,descriptionMd:$desc,category:$category,tags:($tags|split(",")),basePrice:$price,maxPriceDeltaPct:0,fulfillmentType:$type,acceptedPaymentMethods:"usdc",apiKey:$key}')
            /tmp/ap-call agentpact.create_offer "$args" /tmp/ap-offer-create
            if grep -Eqi 'isError[^f]|error' /tmp/ap-offer-create; then cat /tmp/ap-offer-create | sed -E 's/[A-Za-z0-9_-]{24,}/[REDACTED]/g' | head -c 1000; return 1; fi
            echo "AGENTPACT offer_status=created title=$title price=$price negotiation_delta_pct=0 rail=usdc"
          }
          create_offer 'DELTA Witness Capture — Public Web Evidence' '1 USDC entry layer. Observe a buyer-provided public URL and return timestamped evidence/proof metadata. Scope is public-web observation, not truth certification. Existing production capability: DELTA Witness Capture on Base USDC.' 'data' 1 'web-evidence,capture,x402,base,verification' 'data-delivery'
          create_offer 'DELTA Witness Public Preflight — Deterministic Verification' '5 USDC standard verification layer. Re-observe a buyer-provided public source and evaluate deterministic expectations before a consequential autonomous action. This is source-state verification, not a security audit or safety guarantee.' 'automation' 5 'preflight,verification,agent-safety,web-evidence,base' 'data-delivery'
          create_offer 'DELTA Witness Guarded-Action Pilot — Higher-Value Evidence' '10 USDC high-value execution layer. Produce guarded-action evidence for a defined consequential agent workflow using DELTA production verification primitives. Scope and output are evidence/verification artifacts; no hidden wallet authority is requested.' 'automation' 10 'guarded-action,evidence,verification,agents,base' 'generic'
      - name: Public readback of DELTA offers and price ladder
        id: readback
        shell: bash
        run: |
          set -euo pipefail
          visible=0
          for delay in 0 2 5; do
            sleep "$delay"
            curl --connect-timeout 10 --max-time 30 -fsS 'https://api.agentpact.xyz/api/offers?query=DELTA%20Witness&limit=100' -o /tmp/ap-offers-after || true
            count=$(jq --arg id "$AGENTPACT_AGENT_ID" '[.. | objects | select((.agentId? // .agent_id? // "") == $id and ((.title? // "") | startswith("DELTA Witness")))] | length' /tmp/ap-offers-after 2>/dev/null || echo 0)
            if [ "$count" -ge 3 ]; then visible=1; break; fi
          done
          echo "AGENTPACT public_visible=$visible"
          jq -c --arg id "$AGENTPACT_AGENT_ID" '.. | objects | select((.agentId? // .agent_id? // "") == $id and ((.title? // "") | startswith("DELTA Witness"))) | {id,title,category,basePrice,base_price,maxPriceDeltaPct,status,acceptedPaymentMethods,agentId}' /tmp/ap-offers-after | tee /tmp/ap-delta-offers.jsonl
          test "$visible" = 1
          python3 - <<'PY'
          import json
          rows=[json.loads(x) for x in open('/tmp/ap-delta-offers.jsonl') if x.strip()]
          def price(r): return r.get('basePrice',r.get('base_price'))
          vals={r['title']:float(price(r)) for r in rows}
          assert any('Capture' in k and v==1 for k,v in vals.items()), vals
          assert any('Preflight' in k and v==5 for k,v in vals.items()), vals
          assert any('Guarded-Action' in k and v==10 for k,v in vals.items()), vals
          print('AGENTPACT price_ladder_verified=1/5/10')
          PY
      - name: Scan matching open buyer needs without proposing or accepting deals
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --retry 3 --retry-all-errors --retry-delay 2 'https://api.agentpact.xyz/api/needs?limit=100' -o /tmp/ap-needs
          jq -c '.. | objects | select((((.title? // "")+" "+(.descriptionMd? // .description? // "")+" "+((.tags? // [])|tostring)) | ascii_downcase | test("web|evidence|verify|verification|preflight|endpoint|monitor|change|research|data validation|audit"))) | {id,title,category,budgetMin,budgetMax,budget_min,budget_max,status,tags,agentId}' /tmp/ap-needs | head -20 | tee /tmp/ap-fit-needs.jsonl || true
          echo "AGENTPACT matched_needs=$(wc -l </tmp/ap-fit-needs.jsonl | tr -d ' ') action=scan_only deal_proposals=0 acceptances=0"
      - name: Preserve encrypted AgentPact credential
        if: steps.register.outputs.credential_captured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: delta-agentpact-credential-${{ github.run_id }}
          path: |
            /tmp/agentpact-api-key.enc
            /tmp/agentpact-agent-id.txt
          retention-days: 90
          if-no-files-found: error
      - name: Reconcile Base Treasury independently
        if: always()
        continue-on-error: true
        run: node scripts/reconcile-treasury.mjs
