name: DELTA one-shot MCP registry verification
on:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/_temp-mcp-registry-check-20260909.yml"
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Query official MCP Registry
        run: |
          set -euo pipefail
          URL='https://registry.modelcontextprotocol.io/v0.1/servers?search=io.github.15998194110%2Fdelta-witness&version=latest'
          curl --fail --retry 4 --retry-all-errors --retry-delay 2 -sS "$URL" | tee /tmp/mcp-registry.json
          node - <<'NODE'
          const fs = require('node:fs');
          const j = JSON.parse(fs.readFileSync('/tmp/mcp-registry.json','utf8'));
          const rows = (j.servers || []).filter(x => x?.server?.name === 'io.github.15998194110/delta-witness');
          console.log(JSON.stringify({exact_matches: rows.map(x => ({name:x.server?.name,version:x.server?.version,status:x._meta?.['io.modelcontextprotocol.registry/official']?.status,publishedAt:x._meta?.['io.modelcontextprotocol.registry/official']?.publishedAt,repository:x.server?.repository,packages:x.server?.packages})), metadata:j.metadata}, null, 2));
          NODE