name: Payan catalog health smoke

on:
  push:
    paths:
      - '.github/workflows/_temp_payan_health_smoke_20260909.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: node --check scripts/payan-catalog-health-checker.mjs
      - name: Ten-offer unpaid smoke run
        env:
          PAYAN_HEALTH_LIMIT: '10'
          PAYAN_HEALTH_CONCURRENCY: '2'
          PAYAN_HEALTH_TIMEOUT_MS: '5000'
        run: |
          node scripts/payan-catalog-health-checker.mjs --json=/tmp/payan-health.json --markdown=/tmp/payan-health.md
          jq 'group_by(.status) | map({status: .[0].status, count: length})' /tmp/payan-health.json
          cat /tmp/payan-health.md
