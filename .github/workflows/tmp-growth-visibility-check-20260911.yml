name: TMP DELTA distribution visibility check

on:
  push:
    paths:
      - .github/workflows/tmp-growth-visibility-check-20260911.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check x402mpp public index for canonical DELTA URL
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 3 --retry-delay 2 --retry-all-errors -fsS 'https://x402mpp.sh/data/search.json' -o /tmp/x402mpp.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/x402mpp.json'))
          needle='delta-witness-api.ruphussten.workers.dev'
          found=[]
          def walk(x):
              if isinstance(x,dict):
                  s=json.dumps(x,ensure_ascii=False)
                  if needle in s: found.append(x)
                  for v in x.values(): walk(v)
              elif isinstance(x,list):
                  for v in x: walk(v)
          walk(data)
          print('x402mpp_match_count',len(found))
          if found: print(json.dumps(found[:10],indent=2,ensure_ascii=False)[:12000])
          PY
      - name: Check known x402mpp submission status URL candidates
        shell: bash
        run: |
          set +e
          for u in \
            'https://api.x402mpp.sh/submit/sub-b800f7e62c9ae5ae958f1c1b' \
            'https://api.x402mpp.sh/status/sub-b800f7e62c9ae5ae958f1c1b' \
            'https://api.x402mpp.sh/submissions/sub-b800f7e62c9ae5ae958f1c1b'; do
            code=$(curl -sS --max-time 20 -o /tmp/body -w '%{http_code}' "$u")
            echo "$u http=$code body=$(head -c 2000 /tmp/body)"
          done
      - name: Check MCPRepository expected public page
        shell: bash
        run: |
          set +e
          u='https://mcprepository.com/15998194110/delta-witness'
          code=$(curl -L -sS --max-time 30 -o /tmp/mcp -w '%{http_code}' "$u")
          echo "mcprepository_http=$code"
          grep -io -E 'delta[- ]witness|15998194110/delta-witness|not found|404' /tmp/mcp | head -n 20 || true
          head -c 1000 /tmp/mcp | tr '\n' ' ' | sed 's/[[:space:]]\+/ /g'
