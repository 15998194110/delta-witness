name: DELTA Swarmwage Probe Temp
on:
  push:
    paths:
      - '.github/workflows/_temp_swarmwage_probe_20260908.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - name: Inspect Swarmwage x402 discovery and dry-run DELTA
        shell: bash
        env:
          AGENT_TELEMETRY: '1'
        run: |
          set +e
          echo '--- VERSION/HELP ---'
          npx -y @swarmwage/mcp --help 2>&1 | head -c 12000
          echo
          for q in 'DELTA Witness' 'web proof' 'preflight verification' 'page state evidence' 'guard autonomous action'; do
            echo "--- SEARCH: $q ---"
            npx -y @swarmwage/mcp x402-search "$q" --max-price 10 2>&1 | head -c 20000
            echo
          done
          for spec in \
            'capture|https://delta-witness-api.ruphussten.workers.dev/v1/capture|0.03' \
            'preflight|https://delta-witness-api.ruphussten.workers.dev/v1/preflight|0.03' \
            'pilot|https://delta-witness-api.ruphussten.workers.dev/v1/guarded-action-pilot|10'
          do
            IFS='|' read -r name url max <<< "$spec"
            echo "--- DRYRUN: $name ---"
            npx -y @swarmwage/mcp dry-run "$url" --max-price "$max" 2>&1 | head -c 30000
            echo
            echo "--- RELIABILITY: $name ---"
            npx -y @swarmwage/mcp reliability --url "$url" 2>&1 | head -c 30000
            echo
          done
