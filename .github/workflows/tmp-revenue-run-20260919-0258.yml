name: TEMP DELTA revenue reconciliation 2026-09-19 0258 JST
on:
  push:
    branches: [master]
    paths: [.github/workflows/tmp-revenue-run-20260919-0258.yml]
permissions:
  contents: read
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DELTA_PARTNER_SECRET: ${{ secrets.DELTA_PARTNER_SECRET }}
      DELTA_TREASURY_LOOKBACK_BLOCKS: '100000'
    steps:
      - uses: actions/checkout@v6
        with: {persist-credentials: false}
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - name: Owner pricing integrity
        run: node scripts/check-owner-pricing.mjs && node scripts/verify-owner-pricing-live.mjs
      - name: Paid funnel candidates
        run: node scripts/query-revenue-candidates.mjs
      - name: AgentPact funded demand
        continue-on-error: true
        run: node scripts/scan-agentpact-demand.mjs
      - name: AgentExchange funded demand
        continue-on-error: true
        run: node scripts/scan-agentexchange-demand.mjs
      - name: External funded demand
        continue-on-error: true
        run: node scripts/scan-external-funded-demand.mjs
      - name: Treasury 100k
        run: node scripts/reconcile-treasury.mjs
