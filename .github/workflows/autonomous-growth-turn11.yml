name: Autonomous Growth Turn 11
on:
  push:
    branches: [master]
    paths: ['.github/workflows/autonomous-growth-turn11.yml']
permissions:
  contents: read
jobs:
  submit-402ad:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - name: Retry free 402.ad website submission
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          import requests
          try:
            r=requests.post('https://402.ad/v1/search',json={'query':'DELTA Witness autonomous action evidence preflight x402'},timeout=25)
            text=r.text.lower(); found=('delta witness' in text) or ('delta-witness' in text) or ('ruphussten' in text)
            print('402AD_PRECHECK_HTTP='+str(r.status_code)); print('402AD_PRECHECK_DELTA='+str(found)); print('402AD_PRECHECK_BODY='+r.text[:6000])
            open('/tmp/402ad-indexed','w').write('1' if found else '0')
          except Exception as e:
            print('402AD_PRECHECK_ERROR='+repr(e)); open('/tmp/402ad-indexed','w').write('0')
          PY
          if [ "$(cat /tmp/402ad-indexed)" = "1" ]; then echo '402AD_ALREADY_INDEXED=1'; exit 0; fi
          npm --silent install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null
          cat > submit402.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage();
          try {
            await page.goto('https://402.ad/submit',{waitUntil:'networkidle',timeout:60000});
            const x402=page.getByRole('button',{name:/x402 api/i});
            if(await x402.count()) await x402.first().click();
            await page.waitForTimeout(700);
            const fields=await page.locator('input,textarea').evaluateAll(els=>els.map((e,i)=>({i,name:e.getAttribute('name'),type:e.getAttribute('type'),placeholder:e.getAttribute('placeholder'),required:e.required,label:e.labels?.[0]?.innerText||'',parent:(e.parentElement?.parentElement?.innerText||e.parentElement?.innerText||'').slice(0,420)})));
            console.log('402AD_FIELDS='+JSON.stringify(fields));
            const visible=page.locator('input:visible,textarea:visible');
            for(let i=0;i<await visible.count();i++){
              const el=visible.nth(i); const ph=(await el.getAttribute('placeholder')||'').toLowerCase(); const nm=(await el.getAttribute('name')||'').toLowerCase(); const tp=(await el.getAttribute('type')||'').toLowerCase(); const label=((await el.evaluate(e=>e.labels?.[0]?.innerText||''))||'').toLowerCase(); const ctx=((await el.evaluate(e=>(e.parentElement?.parentElement?.innerText||e.parentElement?.innerText||'')))||'').toLowerCase();
              if(tp==='email'||nm.includes('email')||label.includes('email')) continue;
              if(nm.includes('endpoint')||label.includes('endpoint')||ctx.includes('x402 endpoint')||ctx.includes('api endpoint')) {await el.fill('https://delta-witness-api.ruphussten.workers.dev/v1/preflight'); continue;}
              if(nm.includes('url')||label.includes('url')||ph.includes('https://')) {await el.fill('https://delta-witness-api.ruphussten.workers.dev/v1/preflight'); continue;}
              if(nm.includes('name')||label.includes('name')) {await el.fill('DELTA Witness'); continue;}
              if(nm.includes('goal')||nm.includes('accomplish')||label.includes('accomplish')||ctx.includes('trying to accomplish')) {await el.fill('List DELTA Witness so autonomous agents can discover its Base x402 capture, preflight, and guarded-action evidence services.'); continue;}
              if(nm.includes('search')||label.includes('search')||ctx.includes('what did you search')) {await el.fill('autonomous action evidence preflight x402'); continue;}
              if((await el.getAttribute('required'))!==null && (await el.inputValue())==='') await el.fill('DELTA Witness autonomous x402 evidence service');
            }
            for(const label of ['Custom Agent','Other']) {const b=page.getByRole('button',{name:new RegExp('^'+label+'$','i')}); if(await b.count()){await b.first().click(); break;}}
            const yes=page.getByRole('button',{name:/yes,? i searched/i}); if(await yes.count()) await yes.first().click();
            const submit=page.getByRole('button',{name:/submit for review/i}); if(!await submit.count()) throw new Error('submit button not found');
            await submit.first().click(); await page.waitForTimeout(3000);
            const body=(await page.locator('body').innerText()).replace(/\s+/g,' ').slice(0,9000);
            console.log('402AD_AFTER_URL='+page.url()); console.log('402AD_AFTER_BODY='+body);
            const ok=/thank|submitted|received|review queue|submission/i.test(body); console.log('402AD_SUBMISSION_CONFIRMED='+(ok?'1':'0')); if(!ok) process.exitCode=2;
          } catch(e) {console.log('402AD_SUBMIT_ERROR='+String(e)); process.exitCode=3;}
          await browser.close();
          JS
          node submit402.mjs
