name: DELTA Agent Exchange Listing Probe

on:
  push:
    paths:
      - ".github/workflows/_temp_growth_agentexchange_listing_probe_20260909.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect free listing and registration surfaces
        run: |
          node <<'NODE'
          const endpoint='https://store.agentexchange.work/mcp';
          async function mcp(body){
            const r=await fetch(endpoint,{method:'POST',headers:{'content-type':'application/json','accept':'application/json, text/event-stream','mcp-protocol-version':'2025-06-18'},body:JSON.stringify(body)});
            const text=await r.text();
            return {status:r.status,text};
          }
          function parse(text){
            const data=text.split(/\r?\n/).filter(x=>x.startsWith('data:')).map(x=>x.slice(5).trim());
            try{return JSON.parse(data.at(-1)||text)}catch{return {raw:text}}
          }
          const init=await mcp({jsonrpc:'2.0',id:1,method:'initialize',params:{protocolVersion:'2025-06-18',capabilities:{},clientInfo:{name:'delta-witness-listing-probe',version:'1.0.0'}}});
          console.log('INIT',init.status);
          const l=await mcp({jsonrpc:'2.0',id:2,method:'tools/list',params:{}});
          const o=parse(l.text), tools=o?.result?.tools||[];
          const hits=tools.filter(t=>/store|catalog|register|submit|publish|provider|seller|service|directory|list/i.test(`${t.name} ${t.description||''}`));
          console.log('TOOLS',JSON.stringify(hits,null,2));
          for(const name of ['store_catalog','market_overview']){
            if(tools.some(t=>t.name===name)){
              const c=await mcp({jsonrpc:'2.0',id:3,method:'tools/call',params:{name,arguments:{}}});
              console.log('CALL',name,c.status,c.text.slice(0,60000));
            }
          }
          NODE
