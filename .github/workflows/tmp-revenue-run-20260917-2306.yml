name: TEMP DELTA revenue run 20260917-2306
on:
  push:
    branches: [master]
    paths: [.github/workflows/tmp-revenue-run-20260917-2306.yml]
permissions:
  contents: read
jobs:
  revenue:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with: {persist-credentials: false}
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - name: Verify owner pricing and live no-payment purchase path
        run: |
          node scripts/check-owner-pricing.mjs
          node scripts/verify-owner-pricing-live.mjs
      - name: Paid funnel and funded demand
        continue-on-error: true
        run: |
          mkdir -p /tmp/delta-run
          node scripts/query-revenue-candidates.mjs > /tmp/delta-run/revenue-candidates.json
          node scripts/scan-agentpact-demand.mjs > /tmp/delta-run/agentpact.json || true
          node scripts/scan-agentexchange-demand.mjs > /tmp/delta-run/agentexchange.json || true
          node scripts/scan-external-funded-demand.mjs > /tmp/delta-run/external-funded.json || true
          node scripts/scan-moltjobs-demand.mjs > /tmp/delta-run/moltjobs.json || true
          node scripts/scan-workpnp-demand.mjs > /tmp/delta-run/workpnp.json || true
          node scripts/scan-payan-demand.mjs > /tmp/delta-run/payan.json || true
      - name: Reconcile canonical Base USDC Treasury
        env:
          DELTA_TREASURY_LOOKBACK_BLOCKS: '100000'
          DELTA_TREASURY_CHUNK_BLOCKS: '1900'
        run: node scripts/reconcile-treasury.mjs > /tmp/delta-run/treasury.json
      - name: Probe Arispay marketplace buyer route without account or payment
        run: |
          node --input-type=module <<'JS'
          import {writeFileSync} from 'node:fs';
          const base='https://api.arispay.app/v1/marketplace';
          const out={checked_at:new Date().toISOString(), searches:[], discoveries:[]};
          async function read(url,opts={}){
            const r=await fetch(url,{...opts,signal:AbortSignal.timeout(15000)});
            const txt=await r.text();
            let body; try{body=JSON.parse(txt)}catch{body=txt.slice(0,4000)}
            return {http:r.status,body};
          }
          for(const q of ['DELTA Witness','delta-witness','public page evidence','price availability verification']){
            const x=await read(`${base}/agents?q=${encodeURIComponent(q)}&limit=50`);
            out.searches.push({q,...x});
          }
          const intents=[
            {intent:'preserve timestamped public product or vendor page evidence before checkout',budgetCentsMax:100},
            {intent:'verify public vendor terms before autonomous procurement action',budgetCentsMax:500},
            {intent:'capture public price or availability evidence immediately before purchase',budgetCentsMax:100}
          ];
          for(const body of intents){
            const x=await read(`${base}/discover`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({...body,limit:10})});
            out.discoveries.push({query:body,...x});
          }
          writeFileSync('/tmp/delta-run/arispay.json',JSON.stringify(out,null,2));
          console.log(JSON.stringify({event:'arispay_probe_complete',searches:out.searches.map(x=>({q:x.q,http:x.http,count:Array.isArray(x.body?.agents)?x.body.agents.length:null})),discoveries:out.discoveries.map(x=>({query:x.query,http:x.http,count:Array.isArray(x.body?.candidates)?x.body.candidates.length:null}))}));
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: delta-revenue-run-${{ github.run_id }}
          path: /tmp/delta-run/
          retention-days: 7
