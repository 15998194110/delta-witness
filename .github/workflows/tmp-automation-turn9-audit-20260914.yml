name: TEMP DELTA automation turn9 audit 20260914

on:
  push:
    paths:
      - '.github/workflows/tmp-automation-turn9-audit-20260914.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      DELTA_PARTNER_GATEWAY_SECRET: ${{ secrets.DELTA_PARTNER_SECRET }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check owner pricing authority
        run: node scripts/check-owner-pricing.mjs
      - name: Verify live public and partner price gates
        continue-on-error: true
        run: node scripts/verify-owner-pricing-live.mjs
      - name: Read DELTA revenue candidates
        continue-on-error: true
        run: node scripts/query-revenue-candidates.mjs
      - name: Reconcile Base Treasury independently
        run: node scripts/reconcile-treasury.mjs
      - name: Scan AgentPact funded demand
        continue-on-error: true
        run: node scripts/scan-agentpact-demand.mjs
      - name: Scan Agent Exchange funded demand
        continue-on-error: true
        run: node scripts/scan-agentexchange-demand.mjs
