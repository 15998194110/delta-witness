name: DELTA Autonomous Growth Turn 2

on:
  push:
    paths:
      - '.github/workflows/_temp_growth_turn2_20260909.yml'

permissions:
  contents: read

jobs:
  growth:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Core integrity and treasury reconciliation
        shell: bash
        run: |
          set -u
          BASE='https://delta-witness-api.ruphussten.workers.dev'
          echo '=== CORE_HEALTH ==='
          curl --retry 4 --retry-delay 2 --retry-all-errors -fsS --max-time 30 "$BASE/health" || echo 'CORE_HEALTH_DEGRADED=true'
          echo
          echo '=== CORE_QUOTES ==='
          for route in capture preflight guarded-action-pilot; do
            case "$route" in
              capture) body='{"url":"https://example.com"}' ;;
              preflight) body='{"url":"https://example.com","expected":{"contains":["Example Domain"]}}' ;;
              guarded-action-pilot) body='{"urls":["https://example.com"],"preflight":{"url_index":0,"expected":{"contains":["Example Domain"]}}}' ;;
            esac
            code=$(curl --retry 3 --retry-delay 2 --retry-all-errors -sS --max-time 30 -o "/tmp/${route}.body" -D "/tmp/${route}.headers" -w '%{http_code}' -X POST "$BASE/v1/$route" -H 'content-type: application/json' --data-binary "$body" || true)
            hdr=$(grep -i -E '^(payment-required|x-payment-required):' "/tmp/${route}.headers" | head -1 | cut -d: -f1 || true)
            challenge=$(grep -i -E '^(payment-required|x-payment-required):' "/tmp/${route}.headers" | head -1 | sed -E 's/^[^:]+:[[:space:]]*//' || true)
            echo "CORE route=$route http=$code payment_header=${hdr:-none} challenge_len=${#challenge}"
          done
          echo '=== TREASURY ==='
          node scripts/reconcile-treasury.mjs || echo 'TREASURY_RECONCILIATION_DEGRADED=true'

      - name: Public discovery pulses
        shell: bash
        run: |
          set +e
          echo '=== BAZAAR ==='
          node scripts/check-bazaar.mjs
          echo "BAZAAR_EXIT=$?"
          echo '=== INDEXNOW_CORE ==='
          node scripts/indexnow-pulse.mjs
          echo "INDEXNOW_CORE_EXIT=$?"
          echo '=== INDEXNOW_APP ==='
          node scripts/indexnow-app.mjs
          echo "INDEXNOW_APP_EXIT=$?"
          exit 0

      - name: PayanAgent funded demand and current listings
        shell: bash
        run: |
          set -u
          PAYAN='https://payanagent.com'
          BASE='https://delta-witness-api.ruphussten.workers.dev'
          TREASURY='0x1990e21bc219696ff7fbc26527dbaed335ac6367'
          REQUEST_ID='ks76vc9pzpz3qfgf8aawjckn5n8bezhf'
          echo '=== PAYAN_CURRENT ==='
          curl --retry 4 --retry-delay 2 --retry-all-errors -fsS --max-time 30 "$PAYAN/api/v1/offers?q=DELTA%20Witness&limit=50" >/tmp/offers.json || echo '{"offers":[]}' >/tmp/offers.json
          jq '{offers:[(.offers // .items // [])[] | {id,title,priceUsd,priceCents,buyUrl,category,status,seller:(.seller.name // .sellerName // null)}]}' /tmp/offers.json
          curl --retry 4 --retry-delay 2 --retry-all-errors -fsS --max-time 30 "$PAYAN/api/v1/requests/$REQUEST_ID" >/tmp/request.json || echo '{}' >/tmp/request.json
          jq '{request:(.request // .), bids:(.bids // [])}' /tmp/request.json

          status=$(jq -r '(.request.status // .status // empty)' /tmp/request.json)
          escrow=$(jq -r '(.request.escrow // .escrow // false)' /tmp/request.json)
          deposited=$(jq -r '(.request.escrowDepositedCents // .escrowDepositedCents // 0)' /tmp/request.json)
          current_v07=$(jq '[.offers // .items // [] | .[] | select(((.title // "")|ascii_downcase|contains("delta witness v0.7")))] | length' /tmp/offers.json)
          need_bid=0
          if [ "$status" = 'open' ] && [ "$escrow" = 'true' ] && [ "$deposited" -ge 4 ]; then need_bid=1; fi

          need_current_listing=0
          preflight_current=$(jq '[.offers // .items // [] | .[] | select(((.title // "")|ascii_downcase|contains("delta witness")) and ((.title // "")|ascii_downcase|contains("preflight"))) | select(((.priceUsd // 0)|tonumber) >= 0.99 and ((.priceUsd // 0)|tonumber) <= 1.01)] | length' /tmp/offers.json 2>/dev/null || echo 0)
          guard_current=$(jq '[.offers // .items // [] | .[] | select(((.title // "")|ascii_downcase|contains("delta witness")) and ((.title // "")|ascii_downcase|contains("guarded"))) | select(((.priceUsd // 0)|tonumber) >= 9.99 and ((.priceUsd // 0)|tonumber) <= 10.01)] | length' /tmp/offers.json 2>/dev/null || echo 0)
          if [ "$preflight_current" -eq 0 ] || [ "$guard_current" -eq 0 ]; then need_current_listing=1; fi

          echo "PAYAN_GATE status=${status:-unknown} escrow=$escrow deposited=$deposited need_bid=$need_bid need_current_listing=$need_current_listing existing_v07=$current_v07"
          if [ "$need_bid" -eq 0 ] && [ "$need_current_listing" -eq 0 ]; then
            echo 'PAYAN_ACTION=none_needed'
            exit 0
          fi

          cat >/tmp/agent.json <<JSON
          {"name":"DELTA Witness v0.7","description":"Production trust layer for autonomous actions: browser evidence capture, deterministic preflight verification, and guarded-action pilots with x402 USDC settlement on Base.","walletAddress":"$TREASURY","chain":"base","tags":["x402","verification","preflight","browser-evidence","agent-safety"],"providerType":"api","agentUrl":"$BASE"}
          JSON
          reg_code=$(curl --retry 3 --retry-delay 2 --retry-all-errors -sS --max-time 30 -o /tmp/register.json -w '%{http_code}' -X POST "$PAYAN/api/v1/agents" -H 'content-type: application/json' --data-binary @/tmp/agent.json || true)
          echo "PAYAN_REGISTER_HTTP=$reg_code"
          if ! [[ "$reg_code" =~ ^20[0-9]$ ]]; then
            jq 'del(.apiKey,.key,.token)' /tmp/register.json 2>/dev/null || cat /tmp/register.json
            echo 'PAYAN_REGISTER_DEGRADED=true'
            exit 0
          fi
          agent_id=$(jq -r '.agentId // .id // empty' /tmp/register.json)
          api_key=$(jq -r '.apiKey // empty' /tmp/register.json)
          api_prefix=$(jq -r '.apiKeyPrefix // empty' /tmp/register.json)
          echo "PAYAN_REGISTERED agent_id=$agent_id api_key_prefix=$api_prefix"
          if [ -z "$api_key" ]; then echo 'PAYAN_API_KEY_MISSING=true'; exit 0; fi

          if [ "$need_current_listing" -eq 1 ] && [ "$current_v07" -eq 0 ]; then
            make_offer() {
              local title="$1" desc="$2" category="$3" price="$4" url="$5" verify="$6"
              jq -n --arg title "$title" --arg description "$desc" --arg category "$category" --argjson price "$price" --arg externalUrl "$url" --argjson verificationBody "$verify" '{title:$title,description:$description,category:$category,tags:["delta-witness","x402","base","usdc","autonomous-agents"],priceCents:$price,offerType:"api",externalUrl:$externalUrl,httpMethod:"POST",verificationBody:$verificationBody}' >/tmp/offer.json
              local code
              code=$(curl --retry 3 --retry-delay 2 --retry-all-errors -sS --max-time 30 -o /tmp/offer-response.json -w '%{http_code}' -X POST "$PAYAN/api/v1/offers" -H "Authorization: Bearer $api_key" -H 'content-type: application/json' --data-binary @/tmp/offer.json || true)
              echo "PAYAN_OFFER_HTTP=$code title=$title"
              if [[ "$code" =~ ^20[0-9]$ ]]; then jq '{id:(.offerId // .id // .offer.id),title:(.title // .offer.title),status:(.status // .offer.status),buyUrl:(.buyUrl // .offer.buyUrl),priceUsd:(.priceUsd // .offer.priceUsd)}' /tmp/offer-response.json; else jq 'del(.apiKey,.key,.token)' /tmp/offer-response.json 2>/dev/null || cat /tmp/offer-response.json; fi
            }
            make_offer 'DELTA Witness v0.7 — Capture' 'Capture a public webpage as timestamped browser-rendered evidence with content hashes and public verification metadata.' 'Developer Tools' 3 "$BASE/v1/capture" '{"url":"https://example.com"}'
            make_offer 'DELTA Witness v0.7 — Preflight' 'Verify a fresh public-source observation against deterministic text or hash expectations before an autonomous action.' 'Security' 100 "$BASE/v1/preflight" '{"url":"https://example.com","expected":{"contains":["Example Domain"]}}'
            make_offer 'DELTA Witness v0.7 — Guarded Action Pilot' 'Production-verified $10 guarded-action pilot: capture public URLs and run deterministic preflight checks before consequential autonomous actions.' 'Security' 1000 "$BASE/v1/guarded-action-pilot" '{"urls":["https://example.com"],"preflight":{"url_index":0,"expected":{"contains":["Example Domain"]}}}'
          fi

          if [ "$need_bid" -eq 1 ]; then
            jq -n '{priceCents:4,estimatedDurationSeconds:300,message:"I can deliver this as a Node.js one-shot catalog health checker with pagination, bounded concurrency, HEAD/GET/OPTIONS probe fallbacks, latency + HTTP classification, valid JSON output, and a markdown dead-endpoint summary. No paid calls are required."}' >/tmp/bid.json
            bid_code=$(curl --retry 3 --retry-delay 2 --retry-all-errors -sS --max-time 30 -o /tmp/bid-response.json -w '%{http_code}' -X POST "$PAYAN/api/v1/requests/$REQUEST_ID/bid" -H "Authorization: Bearer $api_key" -H 'content-type: application/json' --data-binary @/tmp/bid.json || true)
            echo "PAYAN_BID_HTTP=$bid_code"
            if [[ "$bid_code" =~ ^20[0-9]$ ]]; then jq '{id:(.bidId // .id // .bid.id),status:(.status // .bid.status),priceCents:(.priceCents // .bid.priceCents),requestId:(.requestId // .bid.requestId)}' /tmp/bid-response.json; else jq 'del(.apiKey,.key,.token)' /tmp/bid-response.json 2>/dev/null || cat /tmp/bid-response.json; fi
          fi
          unset api_key

          echo '=== PAYAN_READBACK ==='
          curl --retry 4 --retry-delay 2 --retry-all-errors -fsS --max-time 30 "$PAYAN/api/v1/offers?q=DELTA%20Witness%20v0.7&limit=20" | jq '{offers:[(.offers // .items // [])[] | {id,title,priceUsd,buyUrl,status}]}' || true
          curl --retry 4 --retry-delay 2 --retry-all-errors -fsS --max-time 30 "$PAYAN/api/v1/requests/$REQUEST_ID" | jq '{request:{id:(.request._id // .request.id),status:.request.status,escrow:.request.escrow,escrowDepositedCents:.request.escrowDepositedCents},bids:[(.bids // [])[] | {id:(_id // .id),providerId,priceCents,status,message}]}' || true
