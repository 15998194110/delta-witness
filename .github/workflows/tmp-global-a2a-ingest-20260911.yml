name: TMP DELTA Global A2A Registry public ingest 20260911

on:
  push:
    branches: [master]
    paths: ['.github/workflows/tmp-global-a2a-ingest-20260911.yml']

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DELTA_PARTNER_GATEWAY_SECRET: ${{ secrets.DELTA_PARTNER_GATEWAY_SECRET }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - name: Verify owner pricing and live service before ingest
        run: |
          set -euo pipefail
          node scripts/check-owner-pricing.mjs
          node scripts/verify-owner-pricing-live.mjs
          curl --fail --retry 3 --retry-all-errors --retry-delay 2 https://delta-witness-api.ruphussten.workers.dev/.well-known/agent.json -o /tmp/delta-agent.json
          jq -e 'type=="object"' /tmp/delta-agent.json >/dev/null
      - name: Dedupe Global A2A Registry public index
        id: dedupe
        shell: bash
        run: |
          set -euo pipefail
          api='https://api.a2a-registry.org/public/agents'
          code=000
          : >/tmp/global-a2a-before.json
          for i in 1 2 3; do
            code=$(curl --connect-timeout 10 --max-time 30 -sS -o /tmp/global-a2a-before.json -w '%{http_code}' "$api?q=DELTA%20Witness") || code=000
            case "$code" in 200) break;; 429|500|502|503|504|000) sleep $((i*2));; *) break;; esac
          done
          echo "GLOBAL_A2A read_http=$code"
          test "$code" = 200
          if jq -e '.. | objects | select((((.displayName? // .name? // "") + " " + (.description? // "") + " " + (.manifest_url? // .manifestUrl? // "")) | ascii_downcase | contains("delta witness")) or ((.manifest_url? // .manifestUrl? // "") | contains("delta-witness-api.ruphussten.workers.dev")))' /tmp/global-a2a-before.json >/dev/null 2>&1; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
            echo 'GLOBAL_A2A listing_status=already_present duplicate_write_prevented=true'
            jq -c '.. | objects | select((((.displayName? // .name? // "") + " " + (.description? // "") + " " + (.manifest_url? // .manifestUrl? // "")) | ascii_downcase | contains("delta witness")) or ((.manifest_url? // .manifestUrl? // "") | contains("delta-witness-api.ruphussten.workers.dev"))) | {id,package_name,displayName,name,manifest_url,manifestUrl,status,verification_level}' /tmp/global-a2a-before.json | head -10
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
            echo 'GLOBAL_A2A listing_status=not_present'
          fi
      - name: Public ingest canonical DELTA manifest
        if: steps.dedupe.outputs.exists == 'false'
        id: ingest
        shell: bash
        run: |
          set -euo pipefail
          endpoint='https://api.a2a-registry.org/public/ingest'
          payload='{"manifestUrl":"https://delta-witness-api.ruphussten.workers.dev/.well-known/agent.json"}'
          code=000
          : >/tmp/global-a2a-ingest.json
          for i in 1 2 3; do
            code=$(curl --connect-timeout 10 --max-time 30 -sS -o /tmp/global-a2a-ingest.json -w '%{http_code}' -X POST "$endpoint" -H 'content-type: application/json' --data "$payload") || code=000
            echo "GLOBAL_A2A ingest_attempt=$i http=$code body=$(jq -c . /tmp/global-a2a-ingest.json 2>/dev/null || head -c 800 /tmp/global-a2a-ingest.json)"
            case "$code" in 200|201|202|409|400|422) break;; 429|500|502|503|504|000) sleep $((i*3));; *) break;; esac
          done
          case "$code" in
            200|201|202|409) echo 'accepted=true' >> "$GITHUB_OUTPUT";;
            400|422) echo 'accepted=false' >> "$GITHUB_OUTPUT"; echo 'GLOBAL_A2A compatibility_rejected=true'; exit 0;;
            *) exit 1;;
          esac
      - name: Public readback without resubmitting
        if: always()
        shell: bash
        run: |
          set -u
          visible=0
          code=000
          for delay in 0 3 8; do
            sleep "$delay"
            code=$(curl --connect-timeout 10 --max-time 30 -sS -o /tmp/global-a2a-after.json -w '%{http_code}' 'https://api.a2a-registry.org/public/agents?q=DELTA%20Witness') || code=000
            if [ "$code" = 200 ] && jq -e '.. | objects | select((((.displayName? // .name? // "") + " " + (.description? // "") + " " + (.manifest_url? // .manifestUrl? // "")) | ascii_downcase | contains("delta witness")) or ((.manifest_url? // .manifestUrl? // "") | contains("delta-witness-api.ruphussten.workers.dev")))' /tmp/global-a2a-after.json >/dev/null 2>&1; then visible=1; break; fi
          done
          echo "GLOBAL_A2A public_visible=$visible read_http=$code"
          if [ "$visible" = 1 ]; then
            jq -c '.. | objects | select((((.displayName? // .name? // "") + " " + (.description? // "") + " " + (.manifest_url? // .manifestUrl? // "")) | ascii_downcase | contains("delta witness")) or ((.manifest_url? // .manifestUrl? // "") | contains("delta-witness-api.ruphussten.workers.dev"))) | {id,package_name,displayName,name,manifest_url,manifestUrl,status,verification_level,category,tags}' /tmp/global-a2a-after.json | head -10
          fi
      - name: Reconcile Base Treasury independently
        if: always()
        continue-on-error: true
        run: node scripts/reconcile-treasury.mjs
