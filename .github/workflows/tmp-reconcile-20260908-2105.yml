name: TMP DELTA Reconcile 20260908 2105

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/tmp-reconcile-20260908-2105.yml"

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with: { node-version: "22" }
      - name: Canonical Base USDC inbound scan with bounded fallbacks
        shell: bash
        run: |
          set -euo pipefail
          USDC='0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913'
          TREASURY='0x1990e21bc219696ff7fbc26527dbaed335ac6367'
          TRANSFER='0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef'
          TO_TOPIC="0x000000000000000000000000${TREASURY#0x}"
          FROM_DEC=51040990
          RPCS=('https://mainnet.base.org' 'https://base-rpc.publicnode.com' 'https://1rpc.io/base')
          rpc_call() {
            local payload="$1" code
            for rpc in "${RPCS[@]}"; do
              for attempt in 1 2 3; do
                code=$(curl --silent --show-error --max-time 20 --output /tmp/rpc.json --write-out '%{http_code}' -H 'content-type: application/json' --data "$payload" "$rpc" || true)
                if [ "$code" = 200 ] && jq -e '.error == null and .result != null' /tmp/rpc.json >/dev/null 2>&1; then cat /tmp/rpc.json; return 0; fi
                sleep $((attempt * attempt))
              done
            done
            return 1
          }
          latest=$(rpc_call '{"jsonrpc":"2.0","id":1,"method":"eth_blockNumber","params":[]}')
          latest_hex=$(jq -r '.result' <<<"$latest")
          latest_dec=$((latest_hex))
          all='[]'
          if [ "$latest_dec" -ge "$FROM_DEC" ]; then
            for ((a=FROM_DEC; a<=latest_dec; a+=5000)); do
              b=$((a+4999)); [ "$b" -gt "$latest_dec" ] && b=$latest_dec
              ah=$(printf '0x%x' "$a"); bh=$(printf '0x%x' "$b")
              payload=$(jq -nc --arg address "$USDC" --arg from "$ah" --arg to "$bh" --arg t0 "$TRANSFER" --arg t2 "$TO_TOPIC" '{jsonrpc:"2.0",id:2,method:"eth_getLogs",params:[{address:$address,fromBlock:$from,toBlock:$to,topics:[$t0,null,$t2]}]}')
              page=$(rpc_call "$payload")
              logs=$(jq '.result // []' <<<"$page")
              all=$(jq -nc --argjson x "$all" --argjson y "$logs" '$x + $y')
            done
          fi
          jq -nc --argjson head "$latest_dec" --argjson from "$FROM_DEC" --argjson logs "$all" '{treasury_scan:{from_block:$from,head_block:$head,incoming_count:($logs|length),incoming:[$logs[]|{block_number:(.blockNumber|tonumber),tx_hash:.transactionHash,from:("0x"+(.topics[1][-40:])),raw_amount:(.data|tonumber)}]}}'
      - name: Read-only D1 telemetry since last distribution checkpoint
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          npm ci --silent
          npx wrangler d1 execute delta-witness-analytics --remote --json --command "SELECT id,created_at,event,route,channel,partner,success,reason,network,event_count,gross_usd,variable_cost_usd,contribution_margin_usd FROM telemetry_events WHERE created_at >= '2026-09-08 12:45:00' ORDER BY id ASC;"
