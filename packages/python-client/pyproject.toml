[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "delta-witness-ruphussten"
version = "0.6.0"
description = "Client for DELTA Witness Capture and Guard API"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["httpx>=0.27"]
keywords = ["x402", "web-proof", "preflight", "provenance", "ai-agent", "osint"]

[project.urls]
Homepage = "https://delta-witness-api.ruphussten.workers.dev"

[tool.hatch.build.targets.wheel]
packages = ["delta_witness"]
