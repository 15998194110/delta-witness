openapi: 3.1.0
info:
  title: DELTA Witness Web Proof
  version: 0.5.0
  description: Fresh tamper-evident public-web captures. RapidAPI handles subscriber authentication and billing; DELTA returns proof metadata and cryptographic fingerprints.
servers:
  - url: https://delta-witness-partner-gateway.ruphussten.workers.dev
paths:
  /capture:
    post:
      summary: Create a webpage proof
      operationId: createWebProof
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  format: uri
                external_request_id:
                  type: string
      responses:
        '200':
          description: Proof created
        '400':
          description: Invalid public URL
        '401':
          description: Marketplace proxy was not authenticated
        '502':
          description: Capture failed
